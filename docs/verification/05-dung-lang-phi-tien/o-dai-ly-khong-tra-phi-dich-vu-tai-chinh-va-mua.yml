suggested_edits:
  - "Mục 'Pháp luật VN', gạch đầu 1 (Điều 10 khoản 1 điểm c): sửa thành 'Cấm ép buộc người tiêu dùng mua ... trái với ý muốn thông qua dùng vũ lực, đe dọa dùng vũ lực hoặc hành vi khác có tính chất tương tự', dựa vào quote điểm c; sửa tldr 'Không ai được ép bạn' cho khớp, hoặc nêu đây là lời khuyên."
  - "Điều 100 khoản 1: sửa 'lãi suất và phí' thành 'mức lãi suất huy động vốn và mức phí cung ứng dịch vụ'; gắn nhãn 'suy ra' cho câu 'mọi khoản phí hợp lệ phải có trên bảng phí' hoặc bỏ, nêu khoản 2 (phí cấp tín dụng do thỏa thuận)."
  - "Bẫy 2: sửa 'Chỉ bảo hiểm TNDS ... là bắt buộc' thành 'Khi mua xe, bảo hiểm bắt buộc là bảo hiểm TNDS của chủ xe cơ giới (Điều 8 khoản 2 điểm a Luật KDBH); bảo hiểm thân vỏ không nằm trong danh mục bắt buộc'; thêm Điều 8 khoản 3 vào legal_refs để làm cơ sở cho 'mua ở bất kỳ doanh nghiệp bảo hiểm được cấp phép'."
  - "Làm rõ trong phần Pháp luật rằng Điều 15 khoản 5 chỉ cấm ngân hàng/nhân viên ngân hàng, và bỏ 'vay ở chỗ họ' khỏi tldr nếu không dẫn được điều luật."

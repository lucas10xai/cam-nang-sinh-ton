    note: "Mục tự thừa nhận số này do sách tính. Tôi tính lại: nếu phí 6% thu một lần ngay lúc chuyển đổi và gốc trả đều 12 tháng thì lãi tháng ≈0,965%, nhân 12 = 11,6%/năm danh nghĩa, 12,21%/năm hiệu dụng (có lãi kép) — khớp 12,2% nếu hiểu là hiệu dụng. Nếu phí chia đều vào 12 kỳ thì khoảng 10,9% danh nghĩa/11,5% hiệu dụng; nếu tính phí trên dư nợ bình quân thì khoảng 11,1%. Giả định (thu phí một lần ở đầu kỳ, hiệu dụng) không được nêu; 'Nói dễ hiểu' và tldr nói '12%'/'khoảng 12,2%' nên chưa mâu thuẫn nhưng cần ghi giả định. Cách thu phí thực tế (một lần hay theo tháng) không đọc được trong thông báo ACB."

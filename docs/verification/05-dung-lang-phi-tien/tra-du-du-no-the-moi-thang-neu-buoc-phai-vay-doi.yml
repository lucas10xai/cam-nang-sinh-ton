  - text: "Tổ chức tín dụng phải niêm yết công khai lãi suất và phí cung ứng dịch vụ; con số để so là con số trên biểu phí (Điều 100 khoản 1, Luật Các tổ chức tín dụng 32/2024/QH15)"

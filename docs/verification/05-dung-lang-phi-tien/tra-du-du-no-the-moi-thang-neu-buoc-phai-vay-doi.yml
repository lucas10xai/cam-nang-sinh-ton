    quote: "1. Tổ chức tín dụng được quyền ấn định và phải niêm yết công khai mức lãi suất huy động vốn, mức phí cung ứng dịch vụ trong hoạt động kinh doanh của tổ chức tín dụng."
    verdict: mismatch
    note: "Điều 100 khoản 1 (bản hợp nhất 158/VBHN-VPQH) bắt niêm yết 'lãi suất huy động vốn' và 'phí cung ứng dịch vụ', KHÔNG nói lãi suất cho vay/lãi suất thẻ. Khoản 2: 'Tổ chức tín dụng và khách hàng có quyền thỏa thuận về lãi suất, phí cấp tín dụng'. Câu của mục ('niêm yết công khai lãi suất và phí', gắn với lãi thẻ) vượt quá chữ của điều khoản. Nghĩa vụ công khai lãi suất cho vay/thẻ nếu có nằm ở văn bản khác của NHNN, mục chưa dẫn và tôi chưa kiểm. Phần 'phí cung ứng dịch vụ' (kể cả phí rút/chuyển đổi trả góp) đúng. Câu 'không phải con số nhân viên đọc' là lời khuyên, không phải chữ luật."
  - text: "VIB: lãi giao dịch rút tiền 2,54%–3,71%/tháng, tức 30,5%–44,5%/năm (lãi đơn)"
    source_url: https://ndh.vn/the-tin-dung-ngan-hang/vib/
    quote: "Từ 2,54% đến 3,71%/tháng, tức khoảng 30,48–44,52%/năm, mức cụ thể tùy lịch sử tín dụng."
    verdict: match-secondary
    note: "Trang chính thức VIB (vib.com.vn/vn/the-tin-dung/vib-financial-free/bieu-phi-va-dieu-kien) trả trang 'Challenge Validation' của hệ thống chống bot, không đọc được qua HTTP. Chỉ có bản trích qua tìm kiếm trang VIB: 'Đối với các giao dịch rút tiền mặt, lãi sẽ được tính từ ngày giao dịch.' và '0%/tháng 03 kỳ sao kê đầu tiên từ ngày phát hành thẻ lần đầu'. Số 2,54–3,71% khớp. 2,54x12 = 30,48; 3,71x12 = 44,52 đúng số học. Tính theo dòng tiền (1,0254^12-1 và 1,0371^12-1) = 35,1% và 54,8%, khớp phần ngoặc của mục."
  - text: "'Lãi thẻ ở Việt Nam 2,54% đến 3,71% một tháng' (Nói dễ hiểu)"

suggested_edits:
  - "Điều 37 khoản 1 điểm b: ghi rõ 'doanh nghiệp lữ hành nội địa (khoản 1), quốc tế đến VN (khoản 2.b), đưa khách ra nước ngoài (khoản 3, dẫn lại khoản 2.b)' hoặc bỏ 'Tức là hợp đồng là chỗ xác định ai chịu trách nhiệm' (suy luận)."
  - "Thêm Điều 37 khoản 1 điểm k và Điều 39 khoản 3 (nội dung chương trình, dịch vụ trong hợp đồng lữ hành) làm cơ sở; gắn nhãn 'suy ra' cho câu 'đưa vào cửa hàng ngoài chương trình là thực hiện không đúng hợp đồng'."
  - "Câu 'Việt Nam không có quy định ... trả hàng trong 30 ngày': đổi thành 'Luật Du lịch 2017 không có quy định ...' hoặc dẫn nguồn đã rà toàn bộ; bỏ 'như luật du lịch của nhiều nước' hoặc dẫn luật nước ngoài cụ thể."
  - "Điều 10 khoản 1 điểm a: giữ chữ 'lừa dối hoặc gây nhầm lẫn thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác'; Điều 25: ghi 'khoản 3'."
  - "Dẫn nguồn pháp lý cho đường khiếu nại (Sở VHTTDL, Cục Du lịch Quốc gia) hoặc đánh dấu là gợi ý thực hành; kiểm tên cơ quan sau tổ chức lại 2025."

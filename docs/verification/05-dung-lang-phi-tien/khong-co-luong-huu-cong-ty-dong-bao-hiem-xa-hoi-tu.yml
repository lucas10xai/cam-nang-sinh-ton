claims:
  - text: "Thu nhập làm căn cứ đóng BHXH tự nguyện thấp nhất bằng mức chuẩn hộ nghèo nông thôn, cao nhất 20 lần mức tham chiếu (Luật BHXH 41/2024 Điều 31 khoản 2)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm
    quote: 'Thu nhập làm căn cứ đóng bảo hiểm xã hội tự nguyện thấp nhất bằng mức chuẩn hộ nghèo của khu vực nông thôn và cao nhất bằng 20 lần mức tham chiếu tại thời điểm đóng.'
    verdict: match
    note: "Trang xaydungchinhsach.chinhphu.vn (cổng chính phủ, trích được chữ)."
  - text: "Tỷ lệ đóng BHXH tự nguyện là 22% (Điều 32 khoản 2) và hằng tháng đóng 22% thu nhập đã chọn (Điều 36 khoản 1)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm
    quote: 'Tỷ lệ đóng bảo hiểm xã hội tự nguyện bằng 22% thu nhập làm căn cứ đóng bảo hiểm xã hội vào quỹ hưu trí và tử tuất.'
    verdict: match
    note: "Điều 36 khoản 1: 'hằng tháng đóng bằng 22% mức thu nhập làm căn cứ đóng bảo hiểm xã hội tự nguyện vào quỹ hưu trí và tử tuất.'"
  - text: "Đóng đủ 15 năm là đủ điều kiện hưởng lương hưu khi đủ tuổi (mục dẫn Điều 64)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm
    quote: 'Người tham gia bảo hiểm xã hội tự nguyện được hưởng lương hưu khi đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động và có thời gian đóng bảo hiểm xã hội từ đủ 15 năm trở lên.'
    verdict: partial
    note: "Nội dung 15 năm khớp, nhưng điều đúng là Điều 98 (Chương BHXH tự nguyện), KHÔNG phải Điều 64 (Điều 64 áp dụng cho đối tượng khoản 1, 2 Điều 2 tức bắt buộc, không liệt kê khoản 4 Điều 2). Mục cũng bỏ điều kiện đủ tuổi nghỉ hưu ở tldr, steps và title."
  - text: "Lao động nữ hưởng 45% ứng với 15 năm, thêm mỗi năm 2%, tối đa 75%; nam đóng 15 đến dưới 20 năm hưởng 40% ứng với 15 năm, thêm 1% mỗi năm (mục dẫn Điều 66 khoản 1)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm
    quote: 'Đối với lao động nữ bằng 45% mức bình quân thu nhập làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 104 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 2%, mức tối đa bằng 75%; ... Trường hợp lao động nam có thời gian đóng bảo hiểm xã hội từ đủ 15 năm đến dưới 20 năm, mức lương hưu hằng tháng bằng 40% mức bình quân thu nhập làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 104 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 1%.'
    verdict: partial
    note: "Số liệu khớp (45%, 15 năm, 2%, 75%, 40%, 1%; nam 45% ứng 20 năm), nhưng đây là Điều 99 khoản 1 (BHXH tự nguyện); Điều 66 khoản 1 cùng công thức nhưng cho BHXH bắt buộc (cơ sở là mức bình quân tiền lương Điều 72). Dẫn sai điều."
  - text: "Hỗ trợ 50% hộ nghèo, 40% hộ cận nghèo, 30% dân tộc thiểu số, 20% các trường hợp khác (NĐ 159/2025 Điều 5)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/6/159-cp.signed.pdf
    quote: 'Người tham gia bảo hiểm xã hội tự nguyện được Nhà nước hỗ trợ tiền đóng theo tỷ lệ phần trăm (%) trên mức đóng bảo hiểm xã hội tự nguyện hằng tháng theo mức chuẩn hộ nghèo của khu vực nông thôn ... a) Bằng 50% đối với người tham gia thuộc hộ nghèo, người đang sinh sống tại xã đảo, đặc khu theo quy định của Chính phủ, Thủ tướng Chính phủ; b) Bằng 40% đối với người tham gia thuộc hộ cận nghèo; c) Bằng 30% đối với người tham gia là người dân tộc thiểu số; d) Bằng 20% đối với người tham gia khác.'
    verdict: match
    note: "PDF ký số là ảnh quét; đọc từ ảnh trang 2-3 bằng OCR (macOS Vision), quote đã chuẩn hóa dấu. Mục lược 'người đang sinh sống tại xã đảo, đặc khu' khỏi mức 50% và quy tắc 'thuộc nhiều mức thì hưởng mức cao nhất'."
  - text: "Thời gian hỗ trợ không quá 10 năm (120 tháng); hỗ trợ tính trên mức đóng theo chuẩn hộ nghèo (NĐ 159 Điều 5 khoản 1, 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/6/159-cp.signed.pdf
    quote: 'Thời gian hỗ trợ tùy thuộc vào thời gian tham gia bảo hiểm xã hội tự nguyện thực tế của mỗi người nhưng không quá 10 năm (120 tháng).'
    verdict: match
    note: "OCR trang 3. 'Thực nộp 264.000 đồng' là tính toán: 22% × 1.500.000 = 330.000; trừ 20% của 330.000 = 66.000; còn 264.000 (kiểm đúng)."
  - text: "Chuẩn nghèo đa chiều giai đoạn 2022-2025 tiếp tục thực hiện đến hết 31/12/2026 (NĐ 351/2025 Điều 2 khoản 1); hiệu lực 15/2/2026"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/1/15/351signed-1768466928752975992498.pdf
    quote: 'Tiếp tục thực hiện chuẩn nghèo đa chiều giai đoạn 2022 - 2025 theo quy định tại Điều 3 Nghị định số 07/2021/NĐ-CP ngày 27 tháng 01 năm 2021 của Chính phủ quy định chuẩn nghèo đa chiều giai đoạn 2021 - 2025 (sau đây gọi là Nghị định số 07/2021/NĐ-CP) từ ngày 01 tháng 01 năm 2026 đến hết ngày 31 tháng 12 năm 2026.'
    verdict: match
    note: "Điều 5 khoản 1: 'Nghị định này có hiệu lực thi hành từ ngày 15 tháng 02 năm 2026.' Lưu ý NĐ 351 KHÔNG tự nêu con số 1.500.000; mục ghi con số này kèm cite NĐ 351 Điều 2 khoản 1 nhưng con số nằm ở NĐ 07/2021 Điều 3 (xem claim kế)."
  - text: "Chuẩn hộ nghèo khu vực nông thôn đang áp dụng năm 2026 là 1.500.000 đồng/người/tháng (NĐ 07/2021 Điều 3)"
    source_url: https://baohiemxahoi.gov.vn/UserControls/Publishing/News/BinhLuan/pFormPrint.aspx?IsTA=False&ItemID=25949&UrlListProcess=%2Fcontent%2Ftintuc%2Flists%2Fnews
    quote: 'Điều 3 Nghị định số 07/2021/NĐ-CP quy định các tiêu chí đo lường nghèo đa chiều giai đoạn 2022-2025: a) Tiêu chí thu nhập: - Khu vực nông thôn: 1.500.000 đồng/người/tháng.'
    verdict: match-secondary
    note: "Trích từ bản tin của Bảo hiểm xã hội Việt Nam (trang cơ quan, bản đăng lại nội dung Điều 3), không phải văn bản NĐ 07/2021 gốc; legal_refs của mục không có URL cho NĐ 07 và mục Nguồn chỉ ghi 'Mức 1.500.000 là chuẩn nghèo 2021–2025 tại Điều 3 NĐ 07/2021' không có link."
  - text: "Chuẩn mới giai đoạn 2027–2030 là 2.200.000 đồng/người/tháng ở nông thôn (NĐ 351 Điều 3)"

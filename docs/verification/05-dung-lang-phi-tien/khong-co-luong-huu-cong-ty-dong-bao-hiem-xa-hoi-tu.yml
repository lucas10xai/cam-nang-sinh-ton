  - "steps[1]: đổi thành 'Tích lũy đủ 15 năm đóng (cộng dồn, có thể gián đoạn; dừng đóng thì được bảo lưu theo Điều 103) và đủ tuổi nghỉ hưu mới được hưởng lương hưu'. Bẫy 3: bỏ 'đứt quãng là mất điều kiện'; thay bằng 'chưa đủ 15 năm thì chưa có lương hưu; thiếu thì đóng tiếp, đóng một lần cho thời gian còn thiếu (Điều 36 khoản 2 điểm e), hoặc bảo lưu, hoặc rút một lần nếu thuộc Điều 102'."
  - "tldr/title: thêm 'và đủ tuổi nghỉ hưu'. Nêu rõ 20% là mức cho 'người tham gia khác'; nhóm nghèo/cận nghèo/dân tộc thiểu số được 50/40/30%."
  - "Dòng 'từ 2027 sàn 484.000, thực nộp 387.200' gắn nhãn 'dự kiến, suy ra từ chuẩn nghèo mới' vì chưa có văn bản xác nhận; thêm URL bản chính thống NĐ 07/2021 Điều 3 cho con số 1.500.000."

potential_harm:
  - "Tiêu đề, tldr-ngữ cảnh và Nói dễ hiểu hướng người đọc tính hạn 1 năm từ NGÀY BIẾT sự kiện bảo hiểm. Nếu người thụ hưởng làm theo (ví dụ biết sự kiện muộn vài tháng nhưng thực tế sự kiện xảy ra từ lâu và họ không chứng minh được 'không biết'), họ có thể nộp trễ hạn thật (tính từ ngày xảy ra) và mất quyền/bị từ chối. Cần sửa tiêu đề trước khi công bố."
suggested_edits:
  - "Tiêu đề: đổi 'nhớ hạn: 1 năm kể từ ngày biết sự kiện bảo hiểm' thành 'nhớ hạn: 1 năm kể từ ngày xảy ra sự kiện bảo hiểm' (dựa Điều 30 khoản 1)."
  - "Nói dễ hiểu: đổi 'trong 1 năm kể từ ngày biết sự kiện' thành 'trong 1 năm kể từ ngày xảy ra sự kiện (chỉ tính từ ngày biết nếu chứng minh được mình không biết thời điểm xảy ra)'; thêm thời gian bất khả kháng/trở ngại khách quan không tính."
  - "Điều 41: thêm ngoại lệ hợp đồng nhóm và người đại diện theo pháp luật cho người được bảo hiểm chưa thành niên/mất năng lực hành vi."
  - "Câu 'không báo thì thay đổi không có hiệu lực' sửa thành 'phải thông báo bằng văn bản cho doanh nghiệp bảo hiểm và doanh nghiệp xác nhận vào hợp đồng' (đúng chữ Điều 41 khoản 3), hoặc gắn nhãn suy ra."
  - "Bẫy 1: bỏ 'chậm là mất quyền' hoặc gắn nhãn suy luận; bỏ câu phủ định 5 năm/2 năm nếu không dẫn được nguồn."

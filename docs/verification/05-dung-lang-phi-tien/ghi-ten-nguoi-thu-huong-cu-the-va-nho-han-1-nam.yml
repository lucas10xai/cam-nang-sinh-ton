claims:
  - text: "Bên mua có quyền chỉ định người thụ hưởng; nếu không đồng thời là người được bảo hiểm thì phải có sự đồng ý bằng văn bản của người được bảo hiểm (Điều 41 khoản 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Bên mua bảo hiểm có quyền chỉ định người thụ hưởng, trừ hợp đồng bảo hiểm nhóm. Trường hợp bên mua bảo hiểm không đồng thời là người được bảo hiểm, bên mua bảo hiểm phải có sự đồng ý bằng văn bản của người được bảo hiểm khi chỉ định người thụ hưởng;'
    verdict: partial
    note: "Đúng ý nhưng mục bỏ ngoại lệ: không áp dụng cho hợp đồng bảo hiểm nhóm; và nếu người được bảo hiểm chưa thành niên/mất hoặc hạn chế năng lực hành vi thì người đại diện theo pháp luật phải đồng ý."
  - text: "Có nhiều người thụ hưởng thì xác định thứ tự hoặc tỷ lệ; không xác định thì chia đều (Điều 41 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Trường hợp thứ tự hoặc tỷ lệ thụ hưởng không được xác định thì tất cả những người thụ hưởng được hưởng quyền lợi thụ hưởng theo tỷ lệ như nhau.'
    verdict: match
    note: ""
  - text: "Thay đổi người thụ hưởng phải được người được bảo hiểm đồng ý bằng văn bản, thông báo bằng văn bản cho doanh nghiệp bảo hiểm; doanh nghiệp phải xác nhận vào hợp đồng (Điều 41 khoản 3)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Bên mua bảo hiểm có thể thay đổi người thụ hưởng nhưng phải được sự đồng ý bằng văn bản của người được bảo hiểm và phải thông báo bằng văn bản cho doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài. ... Doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài phải xác nhận tại hợp đồng bảo hiểm hoặc văn bản khác đính kèm hợp đồng bảo hiểm sau khi nhận được thông báo của bên mua bảo hiểm.'
    verdict: match
    note: "Người thực hiện đổi là BÊN MUA bảo hiểm (không nhất thiết là người được bảo hiểm); step 2 'làm văn bản có sự đồng ý của người được bảo hiểm và gửi công ty' phù hợp. Có ngoại lệ người được bảo hiểm chưa thành niên/mất năng lực: người đại diện đồng ý."
  - text: "Đổi người thụ hưởng mà không báo công ty bảo hiểm thì thay đổi đó không có hiệu lực (Nói dễ hiểu)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: ''
    verdict: inference
    note: "Điều 41 khoản 3 chỉ nói 'phải thông báo bằng văn bản'; không có câu nào nêu hậu quả 'không có hiệu lực'. Cần gắn nhãn suy ra hoặc sửa lời."
  - text: "Thời hạn nộp hồ sơ yêu cầu bồi thường, trả tiền bảo hiểm là 01 năm kể từ ngày xảy ra sự kiện bảo hiểm (Điều 30 khoản 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Thời hạn nộp hồ sơ yêu cầu bồi thường, trả tiền bảo hiểm theo hợp đồng bảo hiểm là 01 năm kể từ ngày xảy ra sự kiện bảo hiểm. Thời gian xảy ra sự kiện bất khả kháng hoặc trở ngại khách quan không tính vào thời hạn nộp hồ sơ yêu cầu bồi thường, trả tiền bảo hiểm.'
    verdict: mismatch
    note: "Là khẳng định ở TIÊU ĐỀ, tldr (không có mốc), Nói dễ hiểu: mục ghi '1 năm kể từ ngày biết sự kiện bảo hiểm'. Luật: mốc mặc định là ngày XẢY RA sự kiện; chỉ tính từ ngày biết khi chứng minh được không biết thời điểm xảy ra (khoản 2). Mục Pháp luật VN ghi đúng 'kể từ ngày xảy ra' nên mâu thuẫn nội bộ. Bỏ sót: thời gian bất khả kháng/trở ngại khách quan không tính. Con số 1 năm khớp."
  - text: "Nếu người được bảo hiểm hoặc người thụ hưởng chứng minh được không biết thời điểm xảy ra sự kiện thì tính từ ngày biết (Điều 30 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Trường hợp người được bảo hiểm hoặc người thụ hưởng chứng minh được rằng không biết thời điểm xảy ra sự kiện bảo hiểm thì thời hạn quy định tại khoản 1 Điều này được tính từ ngày người được bảo hiểm hoặc người thụ hưởng biết việc xảy ra sự kiện bảo hiểm đó.'
    verdict: match
    note: "Mục viết đúng điều kiện 'chứng minh được là không biết'."
  - text: "Không có thỏa thuận khác thì doanh nghiệp phải trả trong 15 ngày kể từ khi nhận đủ hồ sơ hợp lệ (Điều 31 khoản 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Trường hợp không có thỏa thuận về thời hạn thì doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài phải bồi thường, trả tiền bảo hiểm trong thời hạn 15 ngày kể từ ngày nhận được đầy đủ hồ sơ hợp lệ về yêu cầu bồi thường, trả tiền bảo hiểm.'
    verdict: match
    note: "Điều 31 khoản 1 cũng nói trước hết là theo thời hạn đã thỏa thuận trong hợp đồng."
  - text: "Hạn 1 năm nên chậm là mất quyền; Việt Nam không có hạn 5 năm cho nhân thọ và 2 năm cho loại khác (Ghi chú Bẫy 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: ''
    verdict: inference
    note: "Điều 30 đặt hạn nộp hồ sơ chung 1 năm nhưng không nói hậu quả 'mất quyền'; mục cũng không nguồn cho phủ định 'không có hạn 5 năm/2 năm'. Đây là suy luận; hạn khởi kiện theo Bộ luật Dân sự là chuyện khác, mục không đề cập."

result: "pass-with-edits"
claims:
  - text: "Vay thế chấp mua nhà công bố 5,5%–14,8%/năm"
    source_url: "https://www.vpbank.com.vn/bi-kip-va-chia-se/retail-story-and-tips/loans-category/lai-suat-vay-ngan-hang-moi-nhat-hien-nay-cap-nhat-12-2022"
    verdict: "match"
    quote: "lãi suất vay ngân hàng hiện nay (T11/2026) dao động từ 5.5% - 14.8%/năm đối với vay thế chấp (mua nhà, mua xe, kinh doanh)"
    note: "Trang VPBank (nguồn thứ cấp về thị trường nhưng là nguồn công bố gốc của chính trang, ghi \"Nguồn: Tổng hợp internet\" ở bảng) ghi mức 5.5%–14.8%, nhưng đây là dải thế chấp gộp mua nhà/mua xe/kinh doanh, và \"Mức lãi suất sẽ được cố định trong thời gian đầu (từ 3 đến 24 tháng) và thả nổi theo thị trường sau đó\". Ngày đăng trên trang là 05/09/2025 dù tiêu đề ghi 11/2026 (trang tự cập nhật)."
  - text: "\"Lãi vay thả nổi phổ biến 11%–15%/năm\" (tldr, Nói dễ hiểu, Lợi ích)"
    source_url: "https://www.vpbank.com.vn/bi-kip-va-chia-se/retail-story-and-tips/loans-category/lai-suat-vay-ngan-hang-moi-nhat-hien-nay-cap-nhat-12-2022"
    verdict: "not-found"
    note: "Không có trong trang VPBank (nguồn mục dẫn). Bảng 16 ngân hàng trên trang: cận trên vay thế chấp phần lớn 9.5–12.3% (Vietinbank 9.5, BIDV 9.5, Vietcombank 9.5, VPBank 12.3, ACB 12, VIB 11.4, Sacombank 12...), chỉ BVBank 14.8. Mục dẫn \"báo chí tháng 4/2026\" nhưng không có URL. Toàn bộ kết luận \"chênh 5,1 đến 9,1 điểm %\" và \"khoản lớn thì trả trước thắng\" dựa trên dải này."
  - text: "Tiết kiệm 12 tháng tại ngân hàng lớn 5,9%/năm (Vietcombank, bảng tháng 10/2026, topi.vn)"
    source_url: "https://topi.vn/lai-suat-ngan-hang-vietcombank.html"
    verdict: "mismatch"
    quote: "12 tháng | 5.40% | 0.30% | 0.00%"
    note: "Nguồn mục dẫn là https://topi.vn/lai-suat-ngan-hang-vietcombank.html (qua mục 06). Trang đọc 2026-11-08 (tiêu đề \"tháng 11-2026\") ghi 12 tháng 5.40% cả tại quầy lẫn online, 24 tháng 5.50%; không có bảng tháng 10/2026 để đối chiếu 5,9%. Mục 27 dùng 5,2%. Với 5,4% thì chênh với 11–15% là 5,6 đến 9,6 điểm, ngược lại ưu đãi 5,5–7% chênh từ +0,1 đến +1,6."
  - text: "Phí trả nợ trước hạn của một ngân hàng nước ngoài: năm 1 là 3%, năm 2 là 2%, năm 3 là 1%, từ năm 5 miễn phí"
    source_url: "https://www.hlbank.com.vn/vi/help-and-support/interest-rates/loan-interest-rates.html"
    verdict: "partial"
    quote: "Phí trả nợ trước hạn | Năm 1: 3% Năm 2: 2% Năm 3: 1% Năm 4: 0,5% Từ Năm 5: Miễn phí | Năm 1: 2% Năm 2: 1% Năm 3: 1% Năm 4: 0,5% Từ Năm 5: Miễn phí"
    note: "Trang Hong Leong Việt Nam đọc 2026-11-08 (áp dụng hồ sơ giải ngân từ 20/10/2026) CÓ công bố biểu phí này, trái với dòng trong mục Nguồn nói trang \"không công bố biểu phí trả trước hạn\". Mục thiếu năm 4 (0,5%) và chỉ nêu gói cố định; gói lãi thả nổi (đúng bối cảnh của mục) là 2%/1%/1%/0,5%. Mục không nêu tên ngân hàng trong thân."
  - text: "\"Phí trả nợ trước hạn thường 1%–3% trên số tiền trả trước, chỉ thu một lần\" và \"Phần lớn miễn sau 3–5 năm\""
    source_url: "https://www.hlbank.com.vn/vi/help-and-support/interest-rates/loan-interest-rates.html"
    verdict: "inference"
    note: "Mục tự ghi \"dải 1%–3% là mức phổ biến trên thị trường\" không dẫn nguồn. Ví dụ duy nhất (Hong Leong) có tầng 0,5% và 3%; không đủ để nói \"phổ biến\". \"Chỉ thu một lần\" hợp lý (phí tính trên số tiền trả trước) nhưng không có nguồn."
  - text: "Vay đang ưu đãi 5,5%–7%/năm, chênh với 5,9% là âm 0,4 đến 1,1 điểm %"
    source_url: "https://www.vpbank.com.vn/bi-kip-va-chia-se/retail-story-and-tips/loans-category/lai-suat-vay-ngan-hang-moi-nhat-hien-nay-cap-nhat-12-2022"
    verdict: "partial"
    quote: "| Vietinbank  | 9.6                           | 6.0 - 9.5                     |"
    note: "Cận dưới 5,5% có trong bảng (BIDV, Vietcombank 5.5 - 9.5); 7% làm cận trên ưu đãi không có nguồn. Phép tính số học 5,5−5,9=−0,4 và 7−5,9=1,1 đúng với 5,9%."
  - text: "Phép so r với g: trả trước thu được đúng r, không rủi ro; g nhỏ hơn r hoặc không đo được thì trả trước"
    source_url: "https://www.vpbank.com.vn/bi-kip-va-chia-se/retail-story-and-tips/loans-category/lai-suat-vay-ngan-hang-moi-nhat-hien-nay-cap-nhat-12-2022"
    verdict: "inference"
    note: "Lập luận tài chính của tác giả, không phải chữ nguồn. Hợp lý nhưng bỏ qua phí/điều kiện ưu đãi bị mất, thuế (lãi tiền gửi cá nhân) và khả năng vay lại; step 2 \"g không đo được thì trả trước\" có thể làm mất thanh khoản nếu bỏ qua step 3."

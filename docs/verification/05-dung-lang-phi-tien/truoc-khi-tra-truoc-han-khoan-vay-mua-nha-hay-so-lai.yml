suggested_edits:
  - "tldr, Nói dễ hiểu, Lợi ích: thay \"lãi thả nổi 11%–15%\" bằng dải có nguồn đọc được (ví dụ cận trên thế chấp 9,5%–12,3% ở nhóm ngân hàng lớn theo bảng VPBank) hoặc dẫn URL bài báo tháng 4/2026; tính lại chênh lệch và các con số \"51 đến 91 triệu\" theo dải mới (quote: bảng 16 ngân hàng trên trang VPBank)."
  - "Thay 5,9% bằng con số có nguồn tại ngày tra; trang topi.vn/Vietcombank hiện ghi 12 tháng 5.40%. Thống nhất với mục 06, 07, 27."
  - "Chi phí: nêu tên Hong Leong, thêm năm 4 (0,5%), ghi rõ gói cố định 3/2/1/0,5% và gói thả nổi 2/1/1/0,5%, ngày hiệu lực 20/10/2026; sửa dòng Nguồn \"không công bố biểu phí\" (trang nay có công bố). Bỏ hoặc có nguồn cho \"1%–3% phổ biến\" và \"phần lớn miễn sau 3–5 năm\"."
  - "Ghi chú: ở step 2 nhắc điều kiện \"g không đo được thì trả trước\" chỉ khi đã giữ quỹ dự phòng (nối với step 3) và đã trừ phí trả trước hạn."

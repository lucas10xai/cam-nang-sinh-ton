potential_harm:
  - "tldr/bước 4/Bẫy 1: người đọc gửi yêu cầu bằng văn bản đòi hoàn 'phần chưa dùng' dẫn Điều 10 khoản 1 điểm e. Doanh nghiệp có thể từ chối đúng luật vì điểm e chỉ áp dụng khi dịch vụ không đúng cam kết; người đọc tưởng mình có quyền đương nhiên và có thể tiếp tục đóng tiền trả trước hoặc bỏ lỡ cách đòi đúng (Điều 38 cho giao dịch từ xa, thỏa thuận hợp đồng, luật dân sự)."
suggested_edits:
  - "tldr: bỏ 'Phần dịch vụ chưa dùng vẫn phải hoàn; Điều 10 khoản 1 điểm e là căn cứ để đòi.' Thay bằng 'Hợp đồng theo mẫu phải công khai trước khi bạn thanh toán trước; hóa đơn, chứng từ doanh nghiệp phải đưa khi bạn yêu cầu (Điều 26 khoản 3, Điều 29).'"
  - "Bước 4: đổi thành 'Cần đòi phần chưa dùng thì viết yêu cầu bằng văn bản, dẫn điều khoản hoàn/hủy trong hợp đồng của bạn; nếu giao dịch từ xa (mua qua mạng, điện thoại) thì dẫn Điều 38 khoản 3 điểm b và khoản 4 (hoàn trong 30 ngày).' Dựa vào quote Điều 10.1.e (không có chữ 'chưa dùng') và Điều 38 khoản 4 (xem mục 23)."
  - "Bẫy 1: bỏ 'Phần dịch vụ chưa dùng vẫn là nghĩa vụ phải hoàn, và Điều 10 khoản 1 điểm e là chỗ để đòi.' Viết lại: 'Điều 10 khoản 1 điểm đ, e chỉ áp dụng khi doanh nghiệp nhầm lẫn hoặc dịch vụ không đúng cam kết; còn lại quyền hoàn tiền phụ thuộc điều khoản hợp đồng.'"
  - "Điều 25 khoản 5: sửa 'quy định NTD không thực hiện' thành 'tự xác định NTD không thực hiện'; khoản 13 thêm 'không báo trước'; Điều 28 khoản 1 thêm 'thuộc Danh mục do Thủ tướng ban hành'."
  - "Bỏ hoặc ghi rõ 'chưa tìm thấy' cho khẳng định 'Việt Nam chưa có luật riêng về tiền trả trước' và Bẫy 2; thêm kiểm Nghị định 55/2024/NĐ-CP trước khi kết luận."

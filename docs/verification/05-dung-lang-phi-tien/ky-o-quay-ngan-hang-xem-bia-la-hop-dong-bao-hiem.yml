claims:
  - text: "Tổ chức tín dụng phải giải thích cho khách hàng các sản phẩm bảo hiểm phân phối qua tổ chức tín dụng không phải là sản phẩm của tổ chức tín dụng (TT 37/2019/TT-NHNN Điều 6 khoản 2 điểm a)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2020/03/37-nhnn.pdf
    quote: 'Giải thích cho khách hàng các sản phẩm bảo hiểm được phân phối thông qua tổ chức tín dụng không phải là sản phẩm của tổ chức tín dụng;'
    verdict: match
    note: "PDF ký số là ảnh quét; lớp chữ nhúng bị lỗi dấu, nên đọc lại từ ảnh trang bằng OCR (macOS Vision), quote đã chuẩn hóa dấu. Chữ khớp, NHƯNG văn bản đã bị bãi bỏ (xem validity): nguồn này không còn là căn cứ hiện hành."
  - text: "Tổ chức tín dụng không được dùng phí bảo hiểm thu được cho mục đích khác ngoài thỏa thuận trong hợp đồng đại lý (TT 37/2019 Điều 3 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2020/03/37-nhnn.pdf
    quote: 'Tổ chức tín dụng không được sử dụng phí bảo hiểm thu được cho các mục đích khác ngoài các thỏa thuận tại hợp đồng đại lý bảo hiểm.'
    verdict: match
    note: "Cùng giới hạn OCR như trên; văn bản gốc đã hết hiệu lực."
  - text: "Thông tư 37/2019/TT-NHNN có hiệu lực 2/3/2020"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2020/03/37-nhnn.pdf
    quote: 'Thông tư này có hiệu lực kể từ ngày 02 tháng 03 năm 2020.'
    verdict: match
    note: "Điều 10. Đúng, nhưng mục trình bày như luật hiện hành trong khi đã bị bãi bỏ từ 1/7/2024."
  - text: "Khi tham gia bảo hiểm qua đại lý là tổ chức tín dụng, phần xác nhận phải có nội dung tham gia trên cơ sở tự nguyện, không bị ép buộc (TT 67/2023/TT-BTC Điều 30 khoản 1)"
    source_url: https://english.luatvietnam.vn/bao-hiem/circular-67-2023-tt-btc-guiding-law-on-insurance-business-and-decree-46-2023-nd-cp-275550-d1.html
    quote: 'In the case where the insurance product is distributed by a corporate agent being a credit institution or foreign bank branch, the confirmation section must indicate that the policyholder purchases insurance on a voluntary basis, without being so coerced.'
    verdict: match-secondary
    note: "Bản dịch tiếng Anh của LuatVietnam (Điều 30 khoản 1). Không mở được bản Việt chính thống: mục không có URL cho TT 67, đoán đường dẫn datafiles.chinhphu.vn trả 404. Tóm tắt Việt: phần xác nhận trong đơn phải ghi người mua tham gia tự nguyện, không bị ép. Thông tư 96/2026/TT-BTC (2/7/2026) sửa TT 67 nhưng nội dung đọc được không đụng Điều 29/30."
  - text: "Tài liệu minh họa bán hàng phải có xác nhận của người mua đã được tư vấn đầy đủ và hiểu rõ nội dung (TT 67/2023 Điều 29 khoản 4)"
    source_url: https://english.luatvietnam.vn/bao-hiem/circular-67-2023-tt-btc-guiding-law-on-insurance-business-and-decree-46-2023-nd-cp-275550-d1.html
    quote: 'The sales illustration shall be signed off by the policyholder to confirm that he/she is adequately advised on and comprehend details of such sales illustration.'
    verdict: match-secondary
    note: "Điều 29 là minh họa quyền lợi cho sản phẩm bảo hiểm NHÂN THỌ (tiêu đề Điều 29: Sales illustrations for life insurance products); mục không nói rõ giới hạn này nên bước 3 'đòi bảng minh họa' chỉ đúng với nhân thọ."
  - text: "Ngân hàng được bán bảo hiểm nhưng bìa ghi tên công ty bảo hiểm thì không phải tiền gửi (Nói dễ hiểu / tldr)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2020/03/37-nhnn.pdf
    quote: ''
    verdict: inference
    note: "Suy luận từ Điều 6.2.a TT 37 (đã hết hiệu lực); không có câu nguồn nào nói về 'bìa' hay 'tiền gửi'. Lời khuyên thực tế hợp lý nhưng cần gắn nhãn là suy ra."

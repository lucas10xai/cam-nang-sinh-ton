  - "Mục Lợi ích, đoạn DellaVigna: nêu rõ 'hợp đồng THÁNG hơn 70 USD' và đối chiếu với 'thẻ 10 lượt'; thêm câu của abstract: người trả theo tháng ở lại quá 1 năm nhiều hơn 17% so với nhóm cam kết 1 năm. Hoặc bỏ nghiên cứu khỏi lập luận 'gói dài' và dùng đúng nó cho ý 'nếu chưa chắc đi, trả lẻ'. Dựa vào quote claim 2 và 3."
  - "Mục Pháp luật VN, gạch 2: bỏ 'không được mặc định trừ tiền'; viết 'gói tự động gia hạn phải có thông báo trước hoặc cơ chế để bạn chọn gia hạn hay chấm dứt'. Dựa vào quote Điều 25 khoản 13."
  - "Bước 3 và Bẫy 2: bỏ 'lời nói của nhân viên không có giá trị'; đổi thành 'cam kết miệng khó chứng minh, hãy ghi vào hợp đồng'."

suggested_edits:
  - "legal_refs[5] và Nguồn: sửa 'Điều 6 khoản 6' thành 'Điều 3 khoản 6' (thu nhập từ trúng thưởng) và giữ Điều 15 cho thuế suất/ngưỡng 20 triệu (dựa vào Luật 109/2025, trang 2–3 và 11 bản ký)."
  - "Tiêu đề/tldr/Nói dễ hiểu: đổi 'mỗi 10.000 đồng luật chỉ cho trả thưởng tối đa 5.000 đồng' thành 'luật cho phép trả thưởng tối đa 50% tổng tiền bán vé mỗi đợt; tính trung bình 10.000 đồng chỉ nhận lại tối đa khoảng 5.000 đồng' (Điều 9 khoản 1 điểm a)."
  - "Pháp luật VN: gắn nhãn 'suy ra' hoặc bỏ phần 'chi phí phát hành, hoa hồng đại lý, thuế và lợi nhuận, không bao giờ về túi người mua' vì Điều 9 không phân bổ 50% còn lại."
  - "Điều 7: thêm 'vé 20.000 đồng chỉ phát hành tối đa 4 kỳ dịp Tết Nguyên đán'."
  - "Bẫy 2, steps[1]: thay 'thời hạn in trên thể lệ' bằng 'thời hạn lĩnh thưởng là 30 ngày kể từ ngày xác định kết quả (Điều 30 khoản 1 TT 75/2013); vé rách vẫn có thể được thẩm tra theo Điều 31'. Cần mở bản hợp nhất chính thống để xác nhận."
  - "Bẫy 3: gắn nhãn 'thực tế thị trường' hoặc bỏ câu về người bán dạo trả giải nhỏ, Điều 30 khoản 2 chỉ cho đại lý được ủy quyền."
  - "Nguồn: đổi dẫn sang bản hợp nhất 13/VBHN-BTC (Bộ Tài chính, 2025) hoặc ghi thêm TT 112/2014/TT-BTC và TT 61/2025/TT-BTC; xác nhận Điều 7, 9, 14 không đổi."

claims:
  - text: "Hợp đồng có thời hạn trên 01 năm: trong 21 ngày kể từ ngày nhận được hợp đồng, bên mua có quyền từ chối tiếp tục tham gia bảo hiểm (Điều 35)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "Đối với các hợp đồng bảo hiểm có thời hạn trên 01 năm, trong thời hạn 21 ngày kể từ ngày nhận được hợp đồng bảo hiểm, bên mua bảo hiểm có quyền từ chối tiếp tục tham gia bảo hiểm."
    verdict: match
    note: "VBHN 31/VBHN-VPQH (13/03/2026), Điều 35 'Thời gian cân nhắc tham gia bảo hiểm'. Không có chú thích sửa đổi ở Điều 35."
  - text: "Khi từ chối, hợp đồng bị hủy; được hoàn lại phí đã đóng sau khi trừ chi phí hợp lý (nếu có) theo thỏa thuận trong hợp đồng; doanh nghiệp không phải bồi thường"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "Trường hợp bên mua bảo hiểm từ chối tiếp tục tham gia bảo hiểm thì hợp đồng bảo hiểm sẽ bị hủy bỏ, bên mua bảo hiểm được hoàn lại phí bảo hiểm đã đóng sau khi trừ đi chi phí hợp lý (nếu có) theo thoả thuận trong hợp đồng bảo hiểm; doanh nghiệp bảo hiểm không phải bồi thường, trả tiền bảo hiểm khi xảy ra sự kiện bảo hiểm."
    verdict: match
    note: "Khớp, kể cả cụm 'sau khi trừ đi chi phí hợp lý' mà mục trích đúng."
  - text: "Hợp đồng nhân thọ có giá trị hoàn lại: khi chấm dứt, doanh nghiệp phải trả giá trị hoàn lại, trừ khi các bên thỏa thuận khác (Điều 27 khoản 3); tldr: quá hạn chỉ còn giá trị hoàn lại"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "3. Trường hợp đơn phương chấm dứt thực hiện hợp đồng bảo hiểm quy định tại khoản 1 và khoản 2 Điều 26 của Luật này, đối với hợp đồng bảo hiểm nhân thọ có giá trị hoàn lại, doanh nghiệp bảo hiểm phải trả cho bên mua bảo hiểm giá trị hoàn lại của hợp đồng bảo hiểm, trừ trường hợp các bên có thoả thuận khác."
    verdict: partial
    note: "Điều 27.3 chỉ áp dụng cho đơn phương chấm dứt theo khoản 1, 2 Điều 26 và chỉ cho hợp đồng nhân thọ CÓ giá trị hoàn lại. Mục (tldr, Nói dễ hiểu, Đừng hiểu ngược) nói chung 'quá hạn chỉ còn giá trị hoàn lại' cho mọi hợp đồng trên 1 năm (kể cả bảo hiểm sức khỏe, bảo hiểm tài sản nhiều năm); các loại này không có giá trị hoàn lại. Chưa mở Điều 26 để xác nhận người mua muốn hủy thuộc khoản nào. Cụm 'thường ít hơn nhiều' không có nguồn."
  - text: "Mốc 21 ngày tính từ ngày nhận hợp đồng, không phải ngày ký hay ngày đóng phí"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "trong thời hạn 21 ngày kể từ ngày nhận được hợp đồng bảo hiểm"
    verdict: match
    note: "Chữ luật là 'kể từ ngày nhận được hợp đồng bảo hiểm'; phần 'không phải ngày ký hay ngày đóng phí' là hệ quả hợp lý."
  - text: "Hợp đồng gửi qua bưu điện thì mốc là ngày bạn ký nhận"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(Điều 35 chỉ nói 'ngày nhận được hợp đồng bảo hiểm', không quy định cách chứng minh ngày nhận.)"
    verdict: inference
    note: "Luật không nhắc bưu điện hay 'ký nhận'. Cách hiểu hợp lý nhưng không phải chữ luật."
  - text: "Hợp đồng mua ở quầy ngân hàng vẫn có 21 ngày, giấy tờ thường bị giữ lại"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(không có nguồn)"
    verdict: not-found
    note: "Phần 'vẫn có 21 ngày' suy ra từ Điều 35 áp dụng cho mọi hợp đồng trên 01 năm; phần 'giấy tờ thường bị giữ lại' là nhận định thực tế không dẫn nguồn."
  - text: "Tiêu đề: hủy trong hạn thì lấy lại được phần lớn phí"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "được hoàn lại phí bảo hiểm đã đóng sau khi trừ đi chi phí hợp lý (nếu có) theo thoả thuận trong hợp đồng bảo hiểm"
    verdict: inference
    note: "Luật không nói mức khấu trừ; 'phần lớn' phụ thuộc hợp đồng. Mục tự ghi ở Bẫy 1 'luật không hứa hoàn gần đủ' nên tiêu đề mâu thuẫn với thân."
  - text: "steps[2]: gửi yêu cầu từ chối tiếp tục tham gia trước khi hết 21 ngày"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "trong thời hạn 21 ngày kể từ ngày nhận được hợp đồng bảo hiểm, bên mua bảo hiểm có quyền từ chối tiếp tục tham gia bảo hiểm"
    verdict: partial
    note: "Luật không nói hình thức từ chối hay mốc nộp (gửi hay doanh nghiệp nhận). Nên dặn gửi bằng văn bản, có bằng chứng ngày gửi, và nộp sớm; đây là lời khuyên thực hành."

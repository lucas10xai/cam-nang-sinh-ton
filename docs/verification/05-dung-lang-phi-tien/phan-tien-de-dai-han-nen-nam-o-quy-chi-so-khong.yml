    severity: error
  - issue: "So sánh không cùng cơ sở: 0,65% là phí QUẢN LÝ của một ETF (tổng chi phí còn có giám sát, lưu ký, phí giao dịch 0,03% và thuế bán 0,1% theo trang Dragon Capital) với 1,5%-2% là phí quản lý của quỹ chủ động. Mục 15 cùng chương nói bán chịu thuế 0,1% và phí môi giới 0,15%-0,35%/chiều; mục 17 không nhắc các chi phí giao dịch ETF này nên chênh phí thật có thể nhỏ hơn 17%."

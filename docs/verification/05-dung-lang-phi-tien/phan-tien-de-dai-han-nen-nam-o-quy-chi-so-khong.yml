  - issue: "Mục 15 vừa nêu thuế bán 0,1%; Luật Thuế TNCN 109/2025/QH15 Điều 5 khoản 4 miễn thuế chuyển nhượng chứng chỉ quỹ mở giữ từ 2 năm trở lên; nếu quỹ chỉ số ở đây là ETF thì cần xác nhận xem có thuộc 'chứng chỉ quỹ mở' hay không; mục 17 không nêu."
    severity: warn
  - issue: "legal_refs rỗng và mục không dẫn văn bản pháp luật; các nguồn: SPIVA không có url, Harvey-Liu không dùng. Nguồn ETF dùng url cũ chạy bằng JavaScript."

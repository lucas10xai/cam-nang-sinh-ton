claims:
  - text: "ETF DCVFMVN30 công bố phí quản lý 0,65%/năm"
    source_url: https://dautu.dragoncapital.com.vn/product/etf/e1vfvn30
    quote: "Phí quản lý của quỹ theo bản cáo bạch là 0,65%/năm, đã được trừ dần vào NAV hằng ngày."
    verdict: match
    note: "Trang Dragon Capital (công ty quản lý quỹ) cho E1VFVN30; cũng có dòng 'Phí quản lý 0,65%/năm'. URL mà mục dẫn (https://www.dragoncapital.com.vn/individual/product/a0eJ2000001X9zhIAC/vn30) trả khung rỗng khi tải (nội dung chạy bằng JavaScript), nên đã đối chiếu trên tên miền mới của cùng công ty. Cùng trang: 'Ngoài phí quản lý, tổng chi phí hoạt động của quỹ còn gồm phí giám sát, lưu ký và các chi phí khác' và 'Khi giao dịch, nhà đầu tư trả thêm phí giao dịch của công ty chứng khoán (0,03% trên DragonX) và thuế bán 0,1%.' Chưa đọc bản cáo bạch gốc."
  - text: "Quỹ mở chủ động thường thu phí quản lý 1,5%-2%/năm"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: ""
    verdict: not-found
    note: "Nguồn mục dẫn (ACBS) không nói 'quỹ mở chủ động 1,5%-2%'. Trang này chỉ nói chung về quỹ đầu tư (xem claim sau). Mục không dẫn bản cáo bạch của một quỹ mở chủ động nào để làm chứng cho 'thường 1,5%-2%'. Con số 1,5% là đầu vào của toàn bộ phép tính 17%."
  - text: "Dải phí quản lý quỹ ở Việt Nam là 0,5%-2% giá trị tài sản ròng"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "Các quỹ đầu tư thường thu phí quản lý từ 0,5% – 2% giá trị tài sản ròng (NAV) mà quỹ quản lý."
    verdict: match-secondary
    note: "Bài blog 'Cách mua chứng chỉ quỹ ETF' của công ty chứng khoán ACBS (nguồn thứ cấp, mục ETF; không phải bản cáo bạch hay văn bản của Ủy ban Chứng khoán). Câu nói chung 'các quỹ đầu tư', không riêng quỹ mở ở Việt Nam."
  - text: "Giả định lợi nhuận trước phí 8%/năm, sau 20 năm quỹ phí 1,5% để lại ít hơn quỹ phí 0,65% khoảng 17% giá trị cuối; tldr: 'chênh phí này ăn khoảng 17% số tiền cuối sau 20 năm'"
    source_url: https://dautu.dragoncapital.com.vn/product/etf/e1vfvn30
    quote: ""
    verdict: mismatch
    note: "Tính lại: (1,08-0,015)^20 = 3,5236; (1,08-0,0065)^20 = 4,1309; tỷ lệ 3,5236/4,1309 = 0,853, tức quỹ phí 1,5% để lại ÍT HƠN khoảng 14,7% (làm theo phí nhân: 15,8%); số 17% là chiều ngược lại (quỹ phí 0,65% để lại NHIỀU HƠN khoảng 17,2%: 4,1309/3,5236 = 1,172). Mục viết 'ít hơn ... khoảng 17%' và tldr 'ăn khoảng 17% số tiền cuối': sai chiều/sai con số. Ngoài ra tldr bỏ giả định 8% và 1,5% (nếu 2% thì ít hơn khoảng 22%: 0,776)."
  - text: "Fama-French (2010): dùng bootstrap trên quỹ tương hỗ Mỹ, kết luận rất ít quỹ có kỹ năng đủ bù phí"
    source_url: https://doi.org/10.1111/j.1540-6261.2010.01598.x
    quote: "Bootstrap simulations suggest that few funds produce benchmark-adjusted expected returns sufficient to cover their costs."
    verdict: match
    note: "Tóm tắt bài (Crossref), The Journal of Finance 65(5):1915-1947, tựa 'Luck versus Skill in the Cross-Section of Mutual Fund Returns'. Tiếng Việt: mô phỏng bootstrap gợi ý rất ít quỹ tạo ra lợi suất kỳ vọng điều chỉnh theo chuẩn đủ bù chi phí. Cùng tóm tắt: 'If we add back the costs in fund expense ratios, there is evidence of inferior and superior performance ... in the extreme tails.' (hai đuôi có bằng chứng vượt trội), mục bỏ phần này."
  - text: "Harvey & Liu (2022) (liệt kê trong Nguồn, không dùng trong thân)"
    source_url: https://doi.org/10.1111/jofi.13123
    quote: "We show that the Fama‐French method suffers from an undersampling problem that leads to a failure to reject the null hypothesis of zero alpha, even when some funds generate economically large risk‐adjusted returns."
    verdict: partial
    note: "Tóm tắt (Crossref): bài The Journal of Finance 77(3):1921-1966 'Luck versus Skill in the Cross Section of Mutual Fund Returns: Reexamining the Evidence' cho rằng phương pháp Fama-French (2010) bị thiếu mẫu và có thể không bác bỏ alpha bằng 0 dù một số quỹ có lợi suất vượt trội lớn. Mục dựa Fama-French 2010 làm bằng chứng kết luận 'ít quỹ có kỹ năng' mà không nói có bài 2022 phản biện phương pháp; bài Harvey-Liu nằm trong Nguồn nhưng thân bài không dùng, gây hiểu mục có chứng cứ nhất quán."
  - text: "SPIVA 2024: 65% quỹ cổ phiếu lớn chủ động của Mỹ thua S&P 500 trong năm 2024"
    source_url: https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf
    quote: "In our largest and most closely watched comparison, 65% of all active large-cap U.S. equity funds underperformed the S&P 500®"
    verdict: match-secondary
    note: "Không mở được văn bản S&P Dow Jones Indices (trang trả HTML/chặn truy cập, kể cả công cụ đọc URL). Câu trích là đoạn trích lại báo cáo, hiển thị trong kết quả tìm kiếm từ bài đăng Bogleheads.org (secondary). Mục không có url cho nguồn SPIVA ('S&P Dow Jones Indices, SPIVA U.S. Year-End 2024')."
  - text: "SPIVA: bình quân 24 năm là 64%"
    source_url: https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf
    quote: ""
    verdict: unreachable
    note: "Công cụ tìm kiếm tóm tắt: '64% average annual rate reported over the 24-year history' (diễn đạt, không phải trích nguyên văn). Không xác minh được bằng văn bản gốc. Lưu ý nếu đúng thì 64% là tỷ lệ thua trung bình CỦA TỪNG NĂM trong 24 năm, không phải tỷ lệ quỹ thua sau 24 năm liên tục (SPIVA báo 15-20 năm cao hơn nhiều); mục viết 'bình quân 24 năm là 64%' dễ hiểu nhầm."
  - text: "Nghĩa là bằng chứng 'chủ động thua chỉ số' ở thị trường mới nổi chưa một chiều như ở Mỹ"
    source_url: https://doi.org/10.1111/j.1540-6261.2010.01598.x
    quote: ""
    verdict: inference
    note: "Không có nguồn trong mục về thị trường mới nổi hay Việt Nam; 'Nghĩa là' nối từ hai số liệu Mỹ sang kết luận về thị trường mới nổi mà dữ liệu không nói. Mục Ghi chú Bẫy 1 tự nhận 'Việt Nam chưa có nghiên cứu dài hạn kiểu SPIVA', nhưng câu 'chưa một chiều ở thị trường mới nổi' vẫn là khẳng định không nguồn."
  - text: "Chỉ số VN30/VNX50 chỉ vài chục mã, nặng ngân hàng và bất động sản; chênh lệch giá mua-bán ETF so với NAV có khi lớn hơn phần phí tiết kiệm (Bẫy 2, 3)"
    source_url: https://dautu.dragoncapital.com.vn/product/etf/e1vfvn30
    quote: ""
    verdict: not-found
    note: "Trang Dragon Capital cho 'Chỉ số tham chiếu VN30 TRI' và 'Mô phỏng VN30: 30 doanh nghiệp vốn hoá lớn nhất HOSE' (30 mã đúng). Phần 'nặng ngân hàng và bất động sản' và 'chênh lệch giá-NAV có khi lớn hơn phần phí tiết kiệm' không có nguồn trong mục; không kiểm."

claims:
  - text: "Hạn mức bảo hiểm bắt buộc 150 triệu đồng/người/vụ"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/9/67-cp.signed.pdf
    quote: "1. Giới hạn trách nhiệm bảo hiểm đối với thiệt hại về sức khỏe, tính mạng do xe cơ giới gây ra là 150 triệu đồng cho một người trong một vụ tai nạn."
    verdict: match
    note: "PDF ký số, là ảnh quét (không trích được chữ); đọc trực tiếp ảnh trang 5 (Điều 6 khoản 1) và đối chiếu bản chữ của MSIG (tructuyen.msig.com.vn/assets/documents/motor/compulsory-tpl/ND-CP.pdf). Số khớp. Xem claim sau về điều kiện: 150 triệu là hạn mức cho thiệt hại sức khỏe/tính mạng của NGƯỜI THỨ BA và hành khách."
  - text: "Phí bảo hiểm bắt buộc xe máy 60.000 đồng/năm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/9/67-cp.signed.pdf
    quote: "A. Phí bảo hiểm cho thời hạn bảo hiểm 1 năm (chưa bao gồm thuế giá trị gia tăng) ... I Mô tô 2 bánh: 1 Dưới 50 cc 55.000; 2 Từ 50 cc trở lên 60.000 ... III Xe gắn máy (bao gồm xe máy điện) và các loại xe cơ giới tương tự: 1 Xe máy điện 55.000; 2 Các loại xe còn lại 290.000"
    verdict: partial
    note: "Đọc trực tiếp ảnh trang 52 (Phụ lục I). 60.000 đúng cho mô tô 2 bánh từ 50 cc trở lên, CHƯA gồm VAT (nên giá phải trả cao hơn, 66.000 nếu VAT 10%, con số 10% chưa kiểm ở nguồn); xe máy điện 55.000; mô tô 3 bánh 290.000; xe gắn máy khác 290.000. 'Xe máy' không nói rõ loại và chưa gồm VAT. Điều 8 khoản 2: doanh nghiệp được tăng/giảm tối đa 15% theo lịch sử bồi thường."
  - text: "Bảo hiểm xe máy là bảo hiểm bắt buộc (trách nhiệm dân sự của chủ xe) trả cho người thứ ba/hành khách"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/9/67-cp.signed.pdf
    quote: "Đối tượng bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới là trách nhiệm dân sự của chủ xe cơ giới đối với người thứ ba, hành khách theo quy định của pháp luật."
    verdict: match
    note: "Điều 5, đọc từ ảnh trang 5. Luật KDBH Điều 8 khoản 2 điểm a và khoản 3 cũng quy định bắt buộc mua. Hệ quả: gói này bồi thường cho người bị mình gây hại, không bồi thường thương tích của chính chủ xe."
  - text: "Một đồng phí mua 2.500 đồng bảo vệ (150.000.000 / 60.000)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/9/67-cp.signed.pdf
    quote: "150 triệu đồng cho một người trong một vụ tai nạn"
    verdict: inference
    note: "Phép chia đúng (150.000.000/60.000 = 2.500) nhưng bỏ qua VAT, và 150 triệu là trần trách nhiệm, không phải khoản chắc chắn nhận được."
  - text: "Bảo hiểm bắt buộc trả trong mọi vụ tai nạn xe máy (ngầm hiểu qua ví dụ 'nên mua')"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/9/67-cp.signed.pdf
    quote: "c) Người lái xe không đủ điều kiện về độ tuổi theo quy định của Luật Giao thông đường bộ; người lái xe không có Giấy phép lái xe hoặc sử dụng Giấy phép lái xe không hợp lệ ..."
    verdict: partial
    note: "Điều 7 khoản 2 (đọc từ ảnh trang 5-6) liệt kê loại trừ: cố ý gây thiệt hại, bỏ chạy, người lái không đủ tuổi/không có hoặc dùng giấy phép lái xe không hợp lệ, nồng độ cồn vượt mức hoặc ma túy (đối với thiệt hại tài sản), tài sản bị mất cắp/cướp... Mục không nhắc loại trừ nào nên 'đổi lấy hạn mức 150 triệu' dễ bị hiểu là vô điều kiện. Điều 6 khoản 2: thiệt hại tài sản chỉ 50 triệu/vụ (xe máy)."
  - text: "Bảo hiểm y tế là bảo hiểm bắt buộc theo Luật Bảo hiểm y tế, quyền lợi tính theo mức hưởng, không theo phí"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "2. Luật này không áp dụng đối với bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm tiền gửi và các loại bảo hiểm khác do Nhà nước thực hiện không mang tính kinh doanh."
    verdict: inference
    note: "Luật KDBH Điều 1 khoản 2 chỉ xác nhận BHYT nằm ngoài Luật KDBH. Mục không dẫn Luật Bảo hiểm y tế; 'bắt buộc' và 'quyền lợi theo mức hưởng' chưa kiểm ở nguồn."
  - text: "Bảo hiểm sức khỏe ở Việt Nam tăng phí theo tuổi và thường loại trừ bệnh có sẵn"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(không có nguồn)"
    verdict: not-found
    note: "Không có nguồn trong mục. Luật chỉ có Điều 19 về điều khoản loại trừ nói chung."
  - text: "Gói nhân thọ gộp ba thứ là bảo vệ, tiết kiệm, đầu tư; phần lớn phí bảo hiểm không quay lại"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(không có nguồn)"
    verdict: not-found
    note: "Khẳng định mô tả thị trường, không có nguồn trong mục."

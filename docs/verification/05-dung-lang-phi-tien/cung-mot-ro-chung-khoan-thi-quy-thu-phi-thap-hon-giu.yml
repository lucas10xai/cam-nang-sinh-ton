  - text: "Các quỹ đầu tư thường thu phí quản lý 0,5%–2% NAV (ACBS)"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "Các quỹ đầu tư thường thu phí quản lý từ 0,5% – 2% giá trị tài sản ròng (NAV) mà quỹ quản lý."

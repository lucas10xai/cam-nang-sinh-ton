    note: "Khớp dải 0,5%–2%. Thân mục dùng riêng cho quỹ mở chủ động '1,5%–2%/năm': ACBS không nói con số đó cho riêng quỹ chủ động."
  - text: "Quỹ mở chủ động phí quản lý 1,5%–2%/năm"
    source_url: https://vinacapital.com/wp-content/uploads/2025/10/20251013-VINACAPITAL-VESAF_Monthly-Factsheet_Sep-2025-EN.pdf
    quote: "Management fee 1.75% per annum"
    verdict: partial
    note: "Factsheet VinaCapital-VESAF (quỹ cổ phiếu chủ động, 9/2025): phí quản lý 1,75%/năm, nằm trong khoảng nhưng không chứng minh cận dưới 1,5%. DCDS 'up to 2%/NAV/year' chỉ thấy qua kết quả tìm kiếm tóm tắt, chưa mở trực tiếp tài liệu. Mục không dẫn nguồn nào cho '1,5%–2%'; cần dẫn factsheet cụ thể hoặc viết 'khoảng 1,75%–2% ở hai quỹ chủ động lớn (VESAF, DCDS)'."
  - text: "Chênh 1 điểm %/năm làm mất khoảng 18,0% số tiền cuối sau 20 năm, 25,8% sau 30 năm"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "(không có nguyên văn: phép tính do sách tính, không có nguồn; tự tính lại ở note)"
    verdict: inference
    note: "Tự tính lại, giả định hai quỹ cùng lợi suất gộp g trước phí, chênh phí 1 điểm: giá trị cuối thấp hơn 1-((1+g-0,01)/(1+g))^n. g=0: 18,2% (20 năm), 26,0% (30 năm). g=2%: 17,9%/25,6%. g=5%: 17,4%/25,0%. g=8%: 17,0%/24,4%. Số 18,0%/25,8% chỉ khớp g≈1%/năm, thấp bất thường và mục không nêu g. Mục chỉ viết 'giả định hai quỹ sinh lời như nhau trước phí' mà thiếu lợi suất giả định nên người đọc không tái tính được; với lợi suất thực tế 5–8% con số đúng hơn là khoảng 17%/24–25%."
  - text: "Chênh 0,85 đến 1,35 điểm %, tương đương 17% đến 29% giá trị cuối sau 20 năm"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "(không có nguyên văn: phép tính của sách; tự tính lại ở note)"
    verdict: mismatch
    note: "Tự tính lại theo cùng công thức, 20 năm: chênh 0,85 điểm thì mất 15,7% (g=0) đến 14,4% (g=10%); chênh 1,35 điểm thì mất 23,8% (g=0) đến 21,9% (g=10%). Dải đúng khoảng 15%–24%, không phải 17%–29%. Số 29% quá cao với mọi g≥0 (cần chênh ~1,67 điểm); số 17% ứng với chênh ~0,93 điểm. Cũng tự mâu thuẫn: chênh 1,0 điểm đã là 18,0% theo mục, nên chênh 0,85 điểm không thể là 17% khi chênh 1,35 điểm là 29% (tỷ lệ 1,35 lần phí mà mất gấp 1,6 lần)."
  - text: "Phí quản lý bị trừ âm thầm vào giá trị tài sản ròng mỗi ngày, không hiện trên sao kê"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "Phí quản lý quỹ: Khoản phí này được sử dụng để trả cho công ty quản lý quỹ và đội ngũ chuyên gia điều hành danh mục đầu tư."
    verdict: inference
    note: "ACBS chỉ nói mục đích phí, không nói cách trừ 'mỗi ngày' hay 'không hiện trên sao kê'. Thực tế phí được tính vào NAV là phổ biến nhưng không có nguyên văn nguồn nào trong mục. Nên dẫn bản cáo bạch."
  - text: "Ngoài phí quản lý còn phí mua/bán chứng chỉ quỹ và phí lưu ký, phải cộng cả ba rồi mới so"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "Phí giao dịch: Đây là khoản phí bạn phải trả cho công ty chứng khoán khi mua bán ETF trên sàn tương tự như cổ phiếu thông thường"
    verdict: partial
    note: "ACBS nêu phí quản lý và phí giao dịch, không nêu 'phí lưu ký' hay 'ba dòng'. Là lời khuyên thực hành hợp lý nhưng không phải chữ của nguồn. Lưu ý thêm (không sai mục): ETF mua qua sàn trả phí môi giới, quỹ mở trả phí mua/bán chứng chỉ quỹ; hai loại phí khác nhau, mục gộp chung."
  - text: "Bẫy 3: 'cùng tên quỹ cổ phiếu nhưng khác chỉ số' (ví dụ ngầm: so ETF chỉ số với quỹ chủ động là so hai thứ khác nhau)"
    source_url: https://acbs.com.vn/blog/cach-mua-chung-chi-quy-etf
    quote: "Quỹ ETF (Exchange Traded Fund) là một dạng quỹ mở đầu tư thụ động. Danh mục đầu tư của quỹ ETF thiết kế mô phỏng theo biến động của một chỉ số tham chiếu (như VN30, VN100,…)."
    verdict: match-secondary
    note: "Hỗ trợ rằng ETF mô phỏng chỉ số. Mục lại đem 0,65% (ETF thụ động) so với 1,5–2% (quỹ chủ động) ở 'Lợi ích' để suy ra 'chênh 17%–29%': đây chính là so hai thứ khác nhau (khác cách đầu tư), mâu thuẫn với Bẫy 3 và 'Đừng hiểu ngược' của chính mục."

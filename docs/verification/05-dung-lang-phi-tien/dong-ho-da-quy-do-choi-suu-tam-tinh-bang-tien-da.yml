    verdict: mismatch
    note: "PDF ký số là ảnh quét; OCR 15 trang (macOS Vision). Câu có thật nhưng ở Điều 3 khoản 10 điểm đ (Điều 3 'thu nhập chịu thuế', trang 3), KHÔNG phải Điều 6. Điều 6 là 'Quản lý thuế đối với thuế thu nhập cá nhân'. Sai điều dẫn (legal_refs[0].article và phần Nguồn). Luật số 109/2025/QH15 đúng."
  - text: "Chính phủ quy định ngưỡng giá trị vàng miếng chịu thuế, thời điểm áp dụng và thuế suất"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "Chính phủ quy định ngưỡng giá trị vàng miếng chịu thuế, thời điểm áp dụng thu và điều chỉnh thuế suất thuế thu nhập cá nhân đối với chuyển nhượng vàng miếng phù hợp với lộ trình quản lý thị trường vàng."
    verdict: partial
    note: "Luật giao Chính phủ quy định 'ngưỡng', 'thời điểm áp dụng thu' và 'điều chỉnh thuế suất', không phải 'quy định thuế suất' từ đầu. Chính luật đã có thuế suất mặc định: Điều 19 khoản 2: 'Thuế thu nhập cá nhân đối với thu nhập khác của cá nhân cư trú quy định tại điểm d và điểm đ khoản 10 Điều 3 của Luật này được xác định bằng giá chuyển nhượng nhân (x) với thuế suất 0,1%.' Nên câu của mục 'thuế suất do Chính phủ quy định, hiện chưa có con số' không chính xác: có 0,1% trong luật, chỉ là Chính phủ có thể điều chỉnh."
  - text: "Từ năm 2026, bán vàng miếng đã nằm trong diện thu nhập chịu thuế (tldr, Nói dễ hiểu, Pháp luật VN)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026, trừ trường hợp quy định tại khoản 2 Điều này."
    verdict: partial
    note: "Điều 29 khoản 1 (OCR trang 14): luật hiệu lực 01/7/2026, không phải 'từ 2026' nói chung; khoản 2 (áp dụng từ kỳ tính thuế năm 2026) chỉ cho thu nhập từ kinh doanh, tiền lương, tiền công của cá nhân cư trú, không áp dụng vàng miếng. Quan trọng hơn: Bộ Tài chính, Thông tin báo chí số 20 ngày 30/6/2026 (https://cdn.thuvienphapluat.vn/uploads/tintuc/2026/07/01/TTBC-20-BTC.pdf, đọc được chữ): 'Luật Thuế Thu nhập cá nhân số 109/2025/QH15 ... có hiệu lực thi hành kể từ ngày 01/7/2026, trong đó quy định thu nhập từ chuyển nhượng vàng miếng là thu nhập phải chịu thuế. Tuy nhiên, Luật giao Chính phủ quy định ngưỡng giá trị vàng miếng chịu thuế, thời điểm áp dụng thu...' và tiêu đề 'Chưa thu thuế đối với hoạt động chuyển nhượng vàng miếng từ ngày 01/7/2026'. Vì vậy 'bán vàng miếng thuộc diện thu nhập chịu thuế' đúng về luật, nhưng ở ngày 2026-11-08 chưa có quy định về thời điểm thu (không có nguồn sơ cấp nào mới hơn mà tôi tìm thấy; không xác nhận được)."
  - text: "Cấm cung cấp thông tin sai lệch, không đầy đủ, không chính xác về sản phẩm (Điều 10 khoản 1 điểm a Luật BVQLNTD 19/2023/QH15)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "a) Lừa dối hoặc gây nhầm lẫn cho người tiêu dùng thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác về một trong các nội dung sau đây: sản phẩm, hàng hóa, dịch vụ mà tổ chức, cá nhân kinh doanh bán, cung cấp;"
    verdict: partial
    note: "OCR trang 8 (ảnh quét). Hành vi bị cấm là 'lừa dối hoặc gây nhầm lẫn ... thông qua việc cung cấp thông tin sai lệch...'; mục lược bỏ 'lừa dối hoặc gây nhầm lẫn'. Ý đúng nhưng thiếu yếu tố cấu thành."
  - text: "Không có cơ quan nào công bố giá thu hồi cho đồng hồ, trang sức, đá quý, đồ chơi sưu tầm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf

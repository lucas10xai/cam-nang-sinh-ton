claims:
  - text: "Mua bảo hiểm nhân thọ cho trường hợp chết của người khác phải được người đó đồng ý bằng văn bản, ghi rõ số tiền bảo hiểm và người thụ hưởng (Điều 39 khoản 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "1. Khi bên mua bảo hiểm giao kết hợp đồng bảo hiểm nhân thọ, hợp đồng bảo hiểm sức khỏe cho trường hợp chết của người khác thì phải được người đó đồng ý bằng văn bản, trong đó ghi rõ số tiền bảo hiểm và người thụ hưởng."
    verdict: match
    note: "VBHN 31/VBHN-VPQH (13/03/2026), bản chữ trích được. Mục chỉ nhắc 'nhân thọ'; luật nói cả hợp đồng bảo hiểm sức khỏe cho trường hợp chết."
  - text: "Không được mua cho trường hợp chết của người chưa thành niên, trừ khi cha, mẹ hoặc người giám hộ đồng ý bằng văn bản (Điều 39 khoản 2 điểm a); tldr: cần chữ ký bằng văn bản của cha, mẹ hoặc người giám hộ"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "2. Không được giao kết hợp đồng bảo hiểm nhân thọ, hợp đồng bảo hiểm sức khỏe cho trường hợp chết của những người sau đây: a) Người chưa thành niên, trừ trường hợp cha, mẹ hoặc người giám hộ của người đó đồng ý bằng văn bản;"
    verdict: match
    note: ""
  - text: "Có quyền chỉ định người thụ hưởng; thay đổi phải thông báo bằng văn bản cho doanh nghiệp bảo hiểm (Điều 41)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "3. Bên mua bảo hiểm có thể thay đổi người thụ hưởng nhưng phải được sự đồng ý bằng văn bản của người được bảo hiểm và phải thông báo bằng văn bản cho doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài."
    verdict: partial
    note: "Mục bỏ điều kiện: bên mua không đồng thời là người được bảo hiểm thì cần sự đồng ý bằng văn bản của người được bảo hiểm (khoản 1 và khoản 3), và người được bảo hiểm chưa thành niên... thì cần người đại diện theo pháp luật đồng ý. Người đọc làm theo nguyên văn mục có thể đổi người thụ hưởng mà không có đồng ý của người được bảo hiểm."
  - text: "Luật nói tới 'sản phẩm bảo hiểm tử kỳ có thời hạn từ 01 năm trở xuống' do doanh nghiệp bảo hiểm phi nhân thọ kinh doanh (Điều 63 khoản 3 điểm b)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "b)8 Doanh nghiệp bảo hiểm phi nhân thọ, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài kinh doanh các sản phẩm thuộc loại hình bảo hiểm sức khỏe có thời hạn từ 01 năm trở xuống và các sản phẩm bảo hiểm tử kỳ có thời hạn từ 01 năm trở xuống;"
    verdict: match
    note: "Chữ khớp, nhưng đây là bản đã sửa bởi Luật 139/2025/QH15 (chú thích 8, hiệu lực 01/01/2026). Quy định này nói về phạm vi kinh doanh của doanh nghiệp phi nhân thọ, không phải về lợi ích cho người mua."
  - text: "Đó là loại thuần rủi ro, không có phần tiết kiệm, đúng là thứ nên mua cho người đang nuôi nhà"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(Điều 63 khoản 3 điểm b chỉ liệt kê loại sản phẩm doanh nghiệp phi nhân thọ được kinh doanh; không có chữ nào về 'thuần rủi ro', 'không có phần tiết kiệm' hay 'nên mua'.)"
    verdict: inference
    note: "Suy ra, không phải chữ của luật. Luật không định nghĩa 'tử kỳ'. Đáng chú ý: sản phẩm nêu trong điều luật có thời hạn tối đa 01 năm, trong khi nhu cầu của người nuôi nhà thường là thời hạn nhiều năm (tới khi hết nợ nhà, con trưởng thành). Dẫn điều này dễ khiến người đọc nghĩ loại 1 năm là sản phẩm cần tìm."
  - text: "Doanh nghiệp có quyền hủy hợp đồng khi người mua cố ý cung cấp thông tin sai để được chi trả (Điều 22 khoản 2); Bẫy 2: khai sai là mất quyền lợi"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "2. Trường hợp bên mua bảo hiểm cố ý cung cấp không đầy đủ thông tin hoặc cung cấp thông tin sai sự thật nhằm giao kết hợp đồng bảo hiểm để được bồi thường, trả tiền bảo hiểm thì doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài có quyền hủy bỏ hợp đồng bảo hiểm."
    verdict: partial
    note: "Bullet ở Pháp luật Việt Nam có chữ 'cố ý' nên đúng. Bẫy 2 và step 4 viết 'khai sai là mất quyền lợi' không có chữ 'cố ý'; luật cũng quy định doanh nghiệp không phải bồi thường nhưng phải hoàn phí sau khi trừ chi phí hợp lý. Nên giữ chữ 'cố ý' ở cả Bẫy 2."
  - text: "Phần lớn hợp đồng bán ở Việt Nam là gói gộp tiết kiệm, và người bán đẩy gói lớn cho trẻ vì dễ bán"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(không có nguồn)"
    verdict: not-found
    note: "Khẳng định thị trường không dẫn nguồn."
  - text: "Chi phí: mất khoảng nửa ngày cho khám và giấy tờ"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: "(không có nguồn)"
    verdict: not-found
    note: "Ước lượng thời gian không dẫn nguồn."

  - "Phần Trẻ em, bullet 2: viết lại: 'Người từ đủ 6 đến chưa đủ 15 tuổi giao dịch phải được người đại diện theo pháp luật đồng ý, trừ giao dịch phục vụ nhu cầu sinh hoạt hàng ngày phù hợp với lứa tuổi (Điều 21 khoản 3). Người đại diện có thể yêu cầu Tòa án tuyên bố giao dịch vô hiệu nếu giao dịch phải có sự đồng ý của họ (Điều 125 khoản 1), nhưng không vô hiệu nếu là giao dịch thiết yếu hàng ngày của người chưa đủ 6 tuổi (Điều 125 khoản 2)'. Bỏ 'bán hộp mù cho trẻ nhỏ là giao dịch có thể bị hủy' hoặc nêu rõ điều kiện."
  - "Điều 10 khoản 1 điểm e: đổi diễn đạt 'khi lỗi thuộc về bên bán' thành 'do sản phẩm không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam kết của bên kinh doanh'; cân nhắc dùng điểm e làm căn cứ chính cho trường hợp 'tỷ lệ công bố khác thực tế'."
  - "Điều 10 khoản 1 điểm a: ghi đủ 'lừa dối hoặc gây nhầm lẫn thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác'."
  - "'Không có văn bản nào ở Việt Nam buộc công bố xác suất': hạ thành 'chưa thấy quy định riêng' hoặc gắn nhãn suy ra; soát thêm văn bản quản lý trò chơi có thưởng/quảng cáo trước khi khẳng định tuyệt đối."

claims:
  - text: "Cấm cung cấp thông tin sai lệch, không đầy đủ, không chính xác về sản phẩm; nếu cửa hàng công bố một tỷ lệ rồi thực tế khác, đó là căn cứ khiếu nại (Điều 10 khoản 1 điểm a Luật BVQLNTD 19/2023/QH15)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "a) Lừa dối hoặc gây nhầm lẫn cho người tiêu dùng thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác về một trong các nội dung sau đây: sản phẩm, hàng hóa, dịch vụ mà tổ chức, cá nhân kinh doanh bán, cung cấp;"
    verdict: partial
    note: "PDF là ảnh quét, đọc bằng OCR (trang 8). Điều khoản có thật nhưng hành vi bị cấm là 'lừa dối hoặc gây nhầm lẫn ... thông qua việc cung cấp thông tin sai lệch...'; mục lược bỏ yếu tố lừa dối/gây nhầm lẫn. Suy luận 'tỷ lệ công bố khác thực tế là căn cứ khiếu nại' là suy ra, không phải chữ của luật (luật không nhắc 'tỷ lệ' hay 'hộp mù')."
  - text: "Cấm không đền bù, không trả lại tiền hoặc không đổi hàng khi lỗi thuộc về bên bán (Điều 10 khoản 1 điểm e)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "e) Không đền bù, trả lại tiền hoặc đổi lại sản phẩm, hàng hóa, dịch vụ cho người tiêu dùng do sản phẩm, hàng hóa, dịch vụ không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam kết của tổ chức, cá nhân kinh doanh;"
    verdict: partial
    note: "Điểm e nói 'do sản phẩm không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo ... cam kết', không phải 'lỗi thuộc về bên bán' chung chung. Điều khoản này thực tế sát với trường hợp 'tỷ lệ công bố khác thực tế' hơn điểm a nhưng mục dẫn nó với diễn đạt không đúng. Điểm đ (do nhầm lẫn của bên kinh doanh) là điểm khác."
  - text: "Trẻ em thuộc nhóm người tiêu dùng dễ bị tổn thương (Điều 8)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "Điều 8. Bảo vệ quyền lợi người tiêu dùng dễ bị tổn thương 1. Người tiêu dùng dễ bị tổn thương là người tiêu dùng có khả năng chịu nhiều tác động bất lợi về tiếp cận thông tin, sức khỏe, tài sản, giải quyết tranh chấp tại thời điểm mua hoặc sử dụng sản phẩm, hàng hóa, dịch vụ, bao gồm: ... c) Trẻ em theo quy định của pháp luật về trẻ em;"
    verdict: match
    note: "OCR trang 5."
  - text: "Giao dịch của người dưới 15 tuổi bị giới hạn, nên bán hộp mù cho trẻ nhỏ là giao dịch có thể bị hủy (Điều 21 Bộ luật Dân sự '91/2015/QH15')"
    source_url: https://vbpl.vn/van-ban/chi-tiet/bo-luat-dan-su-so-91-2015-qh13--95942
    quote: "3. Người từ đủ sáu tuổi đến chưa đủ mười lăm tuổi khi xác lập, thực hiện giao dịch dân sự phải được người đại diện theo pháp luật đồng ý, trừ giao dịch dân sự phục vụ nhu cầu sinh hoạt hàng ngày phù hợp với lứa tuổi."
    verdict: partial
    note: "Hai lỗi: (1) số hiệu sai: Bộ luật Dân sự 2015 là 91/2015/QH13 (vbpl.vn), không phải QH15. (2) Điều 21 chỉ quy định năng lực/đại diện, KHÔNG nói giao dịch 'bị hủy'. Việc vô hiệu nằm ở Điều 125: 'theo yêu cầu của người đại diện của người đó, Tòa án tuyên bố giao dịch đó vô hiệu nếu theo quy định của pháp luật giao dịch này phải do người đại diện của họ xác lập, thực hiện hoặc đồng ý', kèm ngoại lệ: Điều 21 khoản 3 'trừ giao dịch dân sự phục vụ nhu cầu sinh hoạt hàng ngày phù hợp với lứa tuổi' (hộp mù giá nhỏ có thể thuộc ngoại lệ). Khoản 4: người 15-18 tuổi tự xác lập, trừ bất động sản/động sản phải đăng ký. 'Có thể bị hủy' phải do Tòa tuyên, không tự động; mục nói như tự hủy được ('giao dịch có thể bị hủy') có thể làm người đọc kỳ vọng sai."
  - text: "Việt Nam chưa có luật riêng bắt công bố tỷ lệ ra đồ hiếm; 'Không có văn bản nào ở Việt Nam buộc cửa hàng công bố xác suất từng món'"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "(không có nguyên văn)"
    verdict: not-found
    note: "Khẳng định phủ định tuyệt đối ('không có văn bản nào'). Trong Luật 19/2023 (đã đọc các điều 8, 10, 21, 34) không thấy quy định riêng; nhưng chưa tra các văn bản khác (kinh doanh có thưởng, quảng cáo, trò chơi điện tử, thương mại điện tử) nên không thể xác nhận phủ định toàn hệ thống. Nên viết 'trong các điều của Luật BVQLNTD đã tra không thấy' hoặc dẫn nguồn khác. Cần soát thêm: Luật BVQLNTD Điều 21 khoản 1 điểm a ('Cung cấp thông tin chính xác, đầy đủ ... sản phẩm, hàng hóa ... chất lượng, công dụng, giá') cũng là căn cứ."
  - text: "Điều 21: người dưới 15 tuổi (mục dùng 'bị giới hạn')"
    source_url: https://vbpl.vn/van-ban/chi-tiet/bo-luat-dan-su-so-91-2015-qh13--95942
    quote: "2. Giao dịch dân sự của người chưa đủ sáu tuổi do người đại diện theo pháp luật của người đó xác lập, thực hiện."
    verdict: match
    note: "Khoản 2 Điều 21 (từ vbpl.vn, trang chi tiết quét thành văn bản). Chưa đủ 6 tuổi: người đại diện xác lập."

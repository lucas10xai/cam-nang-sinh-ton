suggested_edits:
  - "Thân, 'Luật Bảo vệ quyền lợi người tiêu dùng' bullet 1: thêm ngoại lệ 'trừ trường hợp quy định tại Điều 35' và điều kiện 'sản phẩm, hàng hóa có khuyết tật' (quote Điều 34 khoản 1)."
  - "Thân, bullet 2 ('Khi không xác định được bên sản xuất, nhập khẩu...'): sửa thành 'Khi không xác định được các bên quy định tại điểm a, b, c, d, e khoản 2 Điều 34 (sản xuất, nhập khẩu, gắn thương hiệu, trung gian thương mại, bên khác chịu trách nhiệm) thì bên trực tiếp cung cấp cho người tiêu dùng phải bồi thường, trừ trường hợp pháp luật có quy định khác' (quote Điều 34 khoản 3)."
  - "Phần 'Không có bội số' và title: thêm một câu 'Luật ATTP Điều 6 khoản 3 có mức phạt hành chính tới 07 lần giá trị thực phẩm vi phạm, nhưng đó là tiền phạt nộp nhà nước, không phải tiền đền cho người mua' để tránh hiểu lầm (quote Điều 6 khoản 3)."
  - "Step 4 và Bẫy 3: thay 'cơ quan quản lý an toàn thực phẩm cấp tỉnh' bằng 'cơ sở y tế hoặc UBND nơi gần nhất, hoặc cơ quan quản lý ATTP ở địa phương' (Điều 53 khoản 1, Điều 9 khoản 2 điểm b)."
  - "Bẫy 2: bỏ 'thường phải do cơ quan chuyên môn kết luận' hoặc ghi rõ 'suy ra, không phải chữ luật'."
  - "Cần xác minh thêm có Luật ATTP (sửa đổi) thay Luật 55/2010 vào thời điểm công bố; nếu có, cập nhật số điều và hiệu lực (xem validity)."

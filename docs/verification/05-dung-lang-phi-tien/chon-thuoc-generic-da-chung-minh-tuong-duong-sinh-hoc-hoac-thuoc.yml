potential_harm:
  - 'steps[1] và tldr: "cùng hoạt chất, cùng hàm lượng" bỏ điều kiện cùng DẠNG BÀO CHẾ/đường dùng (ví dụ viên giải phóng kéo dài vs giải phóng ngay). Người đọc làm đúng nguyên văn có thể đổi sang chế phẩm khác dạng bào chế. Dạng bào chế là đối tượng thử TĐSH trong TT 07/2022 (theo TT 44/2026: "dược chất hoặc dạng bào chế phải thử tương đương sinh học"). Cần thêm "cùng dạng bào chế".'
  - 'steps[3]: "Đổi thuốc mạn tính thì ghi huyết áp, đường huyết..." đặt ngay sau các bước tự tra cứu mà không nói rõ phải báo bác sĩ trước khi đổi thuốc đang điều trị; cảnh báo "thuốc có cửa sổ điều trị hẹp... là việc của bác sĩ" chỉ nằm cuối mục (Đừng hiểu ngược), không có trong tldr/steps. Đổi tự ý thuốc mạn tính (chống đông, chống động kinh, hormone tuyến giáp...) có thể gây hại. Chưa đối chiếu với hướng dẫn quốc tế (WHO/FDA về thay thế generic): mục không dẫn nguồn quốc tế cho kết luận y khoa "generic đã chứng minh tương đương sinh học thì thay thế được".'

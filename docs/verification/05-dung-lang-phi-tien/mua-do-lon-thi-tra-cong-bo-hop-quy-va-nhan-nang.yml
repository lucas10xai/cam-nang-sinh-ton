  - text: "TT 52/2025/TT-BCT ban hành trên cơ sở Luật Sử dụng năng lượng tiết kiệm và hiệu quả (sửa đổi bởi Luật 77/2025/QH15)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/11/52-bct.signed.pdf

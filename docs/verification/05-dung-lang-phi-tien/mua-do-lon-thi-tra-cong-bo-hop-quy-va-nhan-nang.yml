suggested_edits:
  - "Viết lại phần 'Hợp quy' theo Luật CLSPHH đã sửa bởi Luật 78/2025/QH15 (hiệu lực 01/01/2026): thay Điều 5 cũ bằng 'phân loại theo mức rủi ro: thấp, trung bình, cao' (Điều 5 khoản 2) và bỏ Điều 24, Điều 25 (đã bãi bỏ). Căn cứ công bố hợp quy: Điều 28 khoản 1 điểm d ('đối với sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao'); chứng nhận: Điều 5 khoản 4 điểm c và d."
  - "Tldr, Nói dễ hiểu, Pháp luật VN: sửa 'bếp từ, bếp hồng ngoại, lò vi sóng' thành 'nhãn tự nguyện đến hết 31/12/2026, bắt buộc từ 01/01/2027' (TT 52/2025 Điều 3 khoản 1 điểm b, c); nhãn bắt buộc hiện tại: đèn huỳnh quang, chấn lưu, điều hòa, tủ lạnh, máy giặt gia dụng, nồi cơm điện, quạt điện, máy thu hình, đèn LED, bình đun nước nóng có dự trữ (điểm a)."
  - "Bỏ 'dấu 3C' hoặc gắn nhãn 'nhận xét của biên tập, không phải chữ luật'; bỏ 'số sao' hoặc dẫn văn bản quy định mẫu nhãn."
  - "Thay NĐ 74/2018 (hết hiệu lực từ 01/7/2026) bằng Nghị định 37/2026/NĐ-CP ngày 23/01/2026 hướng dẫn Luật CLSPHH sau sửa đổi; mở bản gốc từ Công báo/vanban.chinhphu.vn để chọn đúng điều về công bố hợp quy trước khi dẫn."
  - "Điền article/url cho legal_refs[6] (Luật 77/2025/QH15) hoặc bỏ mục này."

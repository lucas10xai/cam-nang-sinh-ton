claims:
  - text: "Hàng hóa chia hai nhóm: nhóm 1 theo tiêu chuẩn do người sản xuất công bố; nhóm 2 theo quy chuẩn kỹ thuật tương ứng do cơ quan nhà nước ban hành (Điều 5 Luật CLSPHH 05/2007/QH12)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2007/12/97732_l5qh.doc
    quote: "b) Sản phẩm, hàng hoá nhóm 2 được quản lý chất lượng trên cơ sở quy chuẩn kỹ thuật tương ứng do cơ quan quản lý nhà nước có thẩm quyền ban hành và tiêu chuẩn do người sản xuất công bố áp dụng."
    verdict: mismatch
    note: "Bản gốc 2007 (khớp một phần: nhóm 2 còn kèm tiêu chuẩn công bố). NHƯNG từ 01/01/2026 Luật 78/2025/QH15 (Công báo 969+970, 'Hiệu lực: 01/01/2026') đã thay Điều 5 bằng phân loại theo mức rủi ro: 'Sản phẩm, hàng hóa được phân thành ba loại sau đây: a) ... mức độ rủi ro thấp; b) ... trung bình; c) ... cao.' Cách chia 'nhóm 1/nhóm 2' không còn trong luật hiện hành (ngày kiểm 2026-11-08). Mục dẫn bản đã bị thay."
  - text: "Người sản xuất phải công bố hợp quy khi sản phẩm phù hợp quy chuẩn kỹ thuật (Điều 24 khoản 1 Luật 05/2007/QH12)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2007/12/97732_l5qh.doc
    quote: "1. Người sản xuất thông báo sản phẩm của mình phù hợp với tiêu chuẩn (sau đây gọi là công bố hợp chuẩn) hoặc với quy chuẩn kỹ thuật (sau đây gọi là công bố hợp quy)."
    verdict: mismatch
    note: "Hai lỗi: (1) Điều 24 khoản 1 bản 2007 là định nghĩa 'thông báo ... phù hợp', không phải nghĩa vụ 'phải công bố hợp quy khi ...'. (2) Điều 24 và Điều 25 đã bị BÃI BỎ từ 01/01/2026: Luật 78/2025/QH15, khoản 25 Điều 1: 'Bãi bỏ Điều 7, khoản 4 Điều 13, khoản 2 và khoản 3 Điều 17, các điều 19, 20, 24, 25, 26, 27, 29, 30, 31, 35, 36, 37, 55;...' (bản .doc tải từ Công báo). Nghĩa vụ công bố hợp quy hiện nằm ở Điều 28 khoản 1 điểm d (sửa đổi): 'd) Công bố hợp quy theo quy định của pháp luật về tiêu chuẩn và quy chuẩn kỹ thuật đối với sản phẩm, hàng hóa có mức độ rủi ro trung bình, mức độ rủi ro cao;'."
  - text: "Chứng nhận hợp quy do tổ chức chứng nhận được chỉ định thực hiện (Điều 25 khoản 3 điểm b)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2007/12/97732_l5qh.doc
    quote: "b) Việc chứng nhận hợp quy do tổ chức chứng nhận được chỉ định thực hiện."
    verdict: mismatch
    note: "Khớp chữ bản 2007 nhưng Điều 25 đã bị bãi bỏ từ 01/01/2026 (xem claim trên). Luật mới (Điều 5 khoản 4): rủi ro trung bình 'tự đánh giá hoặc do tổ chức chứng nhận được công nhận thực hiện chứng nhận'; rủi ro cao 'do tổ chức chứng nhận được chỉ định thực hiện chứng nhận phù hợp quy chuẩn kỹ thuật quốc gia tương ứng'. Mục không phân biệt hai mức nên sai/thiếu."
  - text: "Với sản phẩm nhóm 2, người sản xuất phải công bố hợp quy theo quy chuẩn kỹ thuật quốc gia tương ứng (Điều 1 khoản 2 NĐ 74/2018/NĐ-CP)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2018/05/74.signed.pdf
    quote: "2. Đối với sản phẩm nhóm 2, người sản xuất phải công bố hợp quy theo quy chuẩn kỹ thuật quốc gia tương ứng."
    verdict: partial
    note: "PDF ký số là ảnh quét; đọc bằng OCR trang 2 (Điều 1 khoản 2 sửa đổi Điều 4 NĐ 132/2008). Khớp chữ, nhưng căn cứ 'nhóm 2' của Luật 2007 đã bị thay từ 01/01/2026; có Nghị định 37/2026/NĐ-CP (23/01/2026, nguồn thứ cấp qua tìm kiếm) hướng dẫn Luật sau sửa đổi. NĐ 74/2018 sẽ HẾT HIỆU LỰC từ 01/7/2026 theo Điều 97 khoản 2 điểm b Nghị định 37/2026/NĐ-CP: 'Các Nghị định, quy định dưới đây hết hiệu lực kể từ ngày 01 tháng 7 năm 2026: ... b) Nghị định số 74/2018/NĐ-CP ngày 15 tháng 5 năm 2018 ...' (đọc qua bản đăng lại vnlawfirm.vn, thứ cấp). Tại 2026-11-08 NĐ 74/2018 đã hết hiệu lực."
  - text: "Việc công bố dựa trên kết quả tự đánh giá của tổ chức, cá nhân, hoặc kết quả chứng nhận của tổ chức chứng nhận đã đăng ký hoặc được thừa nhận (NĐ 74/2018 Điều 1 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2018/05/74.signed.pdf
    quote: "a) Kết quả tự đánh giá sự phù hợp của tổ chức, cá nhân; b) Kết quả chứng nhận của tổ chức chứng nhận đã đăng ký hoặc được thừa nhận theo quy định của pháp luật; c) Kết quả chứng nhận của tổ chức chứng nhận được chỉ định theo quy định của pháp luật."
    verdict: partial
    note: "OCR. Mục bỏ biện pháp (c) (chứng nhận bởi tổ chức được chỉ định) và câu 'Trường hợp ... đang áp dụng biện pháp a hoặc b, nếu phát hiện chất lượng không bảo đảm ... thì chuyển sang biện pháp ... chặt hơn'. Cũng cần ghi 'theo một trong các biện pháp sau' và 'quy định chi tiết tại các quy chuẩn kỹ thuật quốc gia tương ứng'."
  - text: "Nhãn năng lượng bắt buộc trên điều hòa, tủ lạnh, máy giặt (tldr, Nói dễ hiểu, Điều 3 TT 52/2025/TT-BCT)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/11/52-bct.signed.pdf
    quote: "a) Thực hiện dán nhãn năng lượng bắt buộc đối với các thiết bị gia dụng và nhóm thiết bị công nghiệp sau: Đèn huỳnh quang ống thẳng, đèn huỳnh quang compact, chấn lưu điện từ và điện tử cho đèn huỳnh quang, máy điều hòa không khí, tủ lạnh, máy giặt gia dụng, nồi cơm điện, quạt điện, máy thu hình, đèn LED, bình đun nước nóng có dự trữ, máy biến áp phân phối, động cơ điện;"
    verdict: match
    note: "PDF ký số là ảnh quét; OCR 3 trang. Điều 3 khoản 1 điểm a. Thông tư 52/2025/TT-BCT ký 14/11/2025, Điều 5: 'có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026'."
  - text: "Nhãn năng lượng bắt buộc trên bếp từ (Nói dễ hiểu: 'nhãn năng lượng bắt buộc trên tủ lạnh, máy giặt, điều hòa, nồi cơm điện, quạt, tivi, bếp từ'; Pháp luật VN: 'mấy món tốn điện nhất trong nhà đều thuộc diện phải có nhãn')"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/11/52-bct.signed.pdf
    quote: "b) Thực hiện dán nhãn năng lượng tự nguyện đến hết ngày 31 tháng 12 năm 2026 đối với: bếp từ, bếp hồng ngoại, lò vi sóng, đèn điện LED chiếu sáng đường và phố; c) Thực hiện dán nhãn năng lượng bắt buộc từ ngày 01 tháng 01 năm 2027 đối với: bếp từ, bếp hồng ngoại, lò vi sóng, đèn điện LED chiếu sáng đường và phố;"
    verdict: mismatch
    note: "Tại 2026-11-08 bếp từ, bếp hồng ngoại, lò vi sóng chỉ là nhãn TỰ NGUYỆN; bắt buộc từ 01/01/2027. Mục nói bắt buộc: sai thời điểm; người đọc sẽ kết luận 'bếp từ không nhãn là sai luật' (có thể khiến tranh cãi vô cớ với người bán)."
  - text: "Danh mục nhóm gia dụng gồm điều hòa, tủ lạnh, máy giặt, nồi cơm điện, quạt điện, máy thu hình, đèn LED, bếp từ, bếp hồng ngoại, lò vi sóng (Điều 2 TT 52/2025/TT-BCT)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/11/52-bct.signed.pdf
    quote: "1. Nhóm thiết bị gia dụng gồm: Đèn huỳnh quang ống thẳng, đèn huỳnh quang compact, chấn lưu điện từ và điện tử cho bóng đèn huỳnh quang, máy điều hòa không khí, tủ lạnh, máy giặt gia dụng, nồi cơm điện, quạt điện, máy thu hình, đèn LED, bình đun nước nóng có dự trữ, bếp từ, bếp hồng ngoại, lò vi sóng;"

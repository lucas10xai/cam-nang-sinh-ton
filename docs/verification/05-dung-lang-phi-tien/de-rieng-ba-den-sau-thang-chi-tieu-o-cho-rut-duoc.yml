claims:
  - text: "Hạn mức chi trả bảo hiểm tiền gửi 350 triệu đồng (TT 05/2026/TT-NHNN Điều 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "match"
    quote: "Số tiền tối đa Bảo hiểm tiền gửi Việt Nam trả cho tất cả các khoản tiền gửi được bảo hiểm theo quy định của Luật Bảo hiểm tiền gửi (gồm cả tiền gốc và tiền lãi) của một người tại một tổ chức tham gia bảo hiểm tiền gửi khi phát sinh nghĩa vụ trả tiền bảo hiểm là 350.000.000 đồng (ba trăm năm mươi triệu đồng)."
    note: "Đọc từ file .docx Công báo số 447 (2026-07-28) tải từ congbao.chinhphu.vn (trích được chữ). Hạn mức chỉ áp dụng cho \"khoản tiền gửi được bảo hiểm theo Luật Bảo hiểm tiền gửi\" tại \"tổ chức tham gia bảo hiểm tiền gửi\"; mục không nêu điều kiện này (không nghiêm trọng)."
  - text: "Hiệu lực từ 13/7/2026"
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "match"
    quote: "Thông tư này có hiệu lực kể từ ngày 13 tháng 7 năm 2026."
    note: "Điều 5. Công báo ghi Ban hành 31/03/2026, hiệu lực 13/07/2026."
  - text: "Hạn mức tính theo từng người tại từng tổ chức, gộp cả gốc và lãi"
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "match"
    quote: "Số tiền tối đa Bảo hiểm tiền gửi Việt Nam trả cho tất cả các khoản tiền gửi được bảo hiểm theo quy định của Luật Bảo hiểm tiền gửi (gồm cả tiền gốc và tiền lãi) của một người tại một tổ chức tham gia bảo hiểm tiền gửi khi phát sinh nghĩa vụ trả tiền bảo hiểm là 350.000.000 đồng (ba trăm năm mươi triệu đồng)."
    note: "Cùng Điều 3: \"tất cả các khoản tiền gửi được bảo hiểm ... (gồm cả tiền gốc và tiền lãi) của một người tại một tổ chức\"."
  - text: "Chia nhiều sổ trong cùng một ngân hàng không tăng hạn mức (Bẫy 2, step 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "match"
    quote: "Số tiền tối đa Bảo hiểm tiền gửi Việt Nam trả cho tất cả các khoản tiền gửi được bảo hiểm theo quy định của Luật Bảo hiểm tiền gửi (gồm cả tiền gốc và tiền lãi) của một người tại một tổ chức tham gia bảo hiểm tiền gửi khi phát sinh nghĩa vụ trả tiền bảo hiểm là 350.000.000 đồng (ba trăm năm mươi triệu đồng)."
    note: "Suy trực tiếp từ \"tất cả các khoản\" của một người tại một tổ chức; VOV2 (thứ cấp) viết rõ \"không tính riêng theo từng sổ tiết kiệm\". Chữ luật là \"tổ chức tham gia bảo hiểm tiền gửi\", rộng hơn \"ngân hàng\" (quỹ tín dụng nhân dân, tổ chức tài chính vi mô)."
  - text: "\"Rút trước hạn vẫn hưởng lãi không kỳ hạn\""
    source_url: "https://vov2.vov.vn/phap-luat/nhung-dieu-nguoi-gui-tien-can-biet-ve-han-muc-bao-hiem-tien-gui-60925.vov2"
    verdict: "not-found"
    note: "Không có trong TT 05/2026 và bài VOV2; mục không dẫn nguồn cho câu này. Cần dẫn văn bản NHNN về tiền gửi tiết kiệm; chưa kiểm."
  - text: "\"Quỹ mở thị trường tiền tệ: thanh khoản thường 1 đến 2 ngày làm việc, không có bảo hiểm tiền gửi\""
    source_url: "https://vov2.vov.vn/phap-luat/nhung-dieu-nguoi-gui-tien-can-biet-ve-han-muc-bao-hiem-tien-gui-60925.vov2"
    verdict: "not-found"
    note: "Mục không dẫn nguồn nào cho quỹ mở. \"Không có bảo hiểm tiền gửi\" hợp lý (Điều 3 TT 05/2026 chỉ nói tiền gửi tại tổ chức tham gia BHTG) nhưng mục chưa nêu căn cứ; \"1 đến 2 ngày\" cần dẫn điều lệ/bản cáo bạch một quỹ cụ thể. Mâu thuẫn với tldr \"rút được trong ngày\": xem internal_checks."
  - text: "Lãi thẻ tín dụng 30,5%/năm (tldr) và 30,5%–44,5%/năm (thân)"
    source_url: "https://www.vib.com.vn/vn/the-tin-dung/vib-financial-free/bieu-phi-va-dieu-kien"
    verdict: "partial"
    quote: "Từ 2.54% đến 3.71%/tháng các kỳ tiếp theo (*)\n(*) Mức lãi suất cụ thể sẽ tùy thuộc lịch sử tín dụng của từng Khách hàng và được VIB thông báo qua SMS và/hoặc Email và/hoặc Bảng sao kê, …"
    note: "Nguồn (qua mục 07) là biểu phí một sản phẩm của một ngân hàng (VIB Financial Free, hiệu lực từ 19/03/2026), áp dụng \"các kỳ tiếp theo\" sau miễn lãi. 30,5% = 2,54%×12 và 44,5% = 3,71%×12 (lãi đơn): phép nhân của tác giả, khớp. Nhưng tldr dùng \"Thẻ tín dụng lãi 30,5%/năm\" như mức chung là khái quát từ một sản phẩm và là đầu thấp của dải. Mục 27 không có URL VIB riêng (ghi \"tra 2/11/2026\")."
  - text: "Lãi tiết kiệm 12 tháng 5,2%/năm (tldr và thân)"
    source_url: "https://topi.vn/lai-suat-ngan-hang-vietcombank.html"
    verdict: "not-found"
    note: "Mục không dẫn nguồn cho 5,2%. Mục 06 và 28 dẫn 5,9% cho cùng thời điểm. Trang topi.vn về Vietcombank, đọc 2026-11-08, ghi 12 tháng 5.40% (tại quầy và online). Ba con số không khớp nhau."
  - text: "\"Mốc 3 đến 6 tháng là quy ước, không phải kết quả nghiên cứu\" và Bẫy 4 \"Ba đến sáu tháng là mức tối thiểu cho người làm công ăn lương\""
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "inference"
    note: "Không có nguồn; hai câu tự mâu thuẫn nhẹ (\"quy ước\" rồi \"mức tối thiểu\"). Evidence C đã phản ánh."
  - text: "\"Đừng để quỹ này trong cổ phiếu hoặc chứng chỉ quỹ cổ phiếu: cần tiền đúng lúc thị trường giảm là lúc phải bán lỗ\" (Bẫy 1, step 4)"
    source_url: "https://congbao.chinhphu.vn/van-ban/thong-tu-so-05-2026-tt-nhnn-470097/67202.htm"
    verdict: "inference"
    note: "Lập luận thực hành, không phải chữ nguồn; hợp lý, không gây hại."

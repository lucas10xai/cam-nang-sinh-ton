suggested_edits:
  - 'Đổi mọi "91/2015/QH15" thành "91/2015/QH13".'
  - 'tldr: "Con dưới 15 tuổi nạp game: bố mẹ có thể yêu cầu Tòa án tuyên giao dịch vô hiệu (Điều 125 BLDS) nếu không phải giao dịch sinh hoạt hằng ngày; từ 15 tuổi gần như không." Dựa vào quote Điều 125 khoản 1 ("theo yêu cầu của người đại diện ... Tòa án tuyên bố giao dịch đó vô hiệu").'
  - 'Mục Pháp luật, Điều 125: viết "Tòa án tuyên bố ... theo yêu cầu của người đại diện" thay "chỉ bị tuyên vô hiệu theo yêu cầu của người đại diện"; tách ngoại lệ: chưa đủ 6 tuổi (Điều 125 khoản 2 điểm a) và 6-15 tuổi sinh hoạt hằng ngày (Điều 21 khoản 3); thêm điểm c (thừa nhận sau khi thành niên).'
  - 'Ví dụ 14 và 16 tuổi: gắn nhãn "suy ra từ Điều 21 và 125" và dẫn Điều 127 BLDS nếu giữ chữ "lừa dối".'
  - 'Điều 8 khoản 2 điểm c: thêm "kèm chứng cứ chứng minh" và ngoại lệ bên thứ ba có nghĩa vụ liên quan.'
  - 'Bẫy 2: dẫn NĐ 147/2024 Điều 39 khoản 1 điểm đ (dưới 16 tuổi do cha mẹ đăng ký tài khoản bằng thông tin của cha mẹ) và Điều 48 khoản 1 điểm đ cho G2-G4; chưa mở được hướng dẫn của từng nhà phát hành.'

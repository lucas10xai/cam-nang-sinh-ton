suggested_edits:
  - "Mục Pháp luật VN, dòng Điều 29 khoản 1 điểm d: sửa \"Hợp đồng trên một năm phải nói rõ việc hủy hợp đồng có thể dẫn tới không nhận lại được giá trị tương đương khoản phí đã đóng\" thành \"Với hợp đồng thời hạn trên một năm, tài liệu minh họa bán hàng cần thông tin rõ rằng hủy hợp đồng có thể dẫn đến không nhận lại được giá trị tương đương khoản phí đã đóng\" (quote: Điều 29 khoản 1 điểm d)."
  - "Mục Pháp luật VN, dòng Điều 27 khoản 3 Luật KDBH: thêm điều kiện \"khi bên mua không đóng đủ phí đúng hạn hoặc không chấp nhận thay đổi mức độ rủi ro dẫn tới đơn phương chấm dứt (Điều 26 khoản 1, 2)\"; không dùng câu này cho mọi trường hợp tự hủy sớm (quote: Điều 27 khoản 3)."
  - "Mục Ghi chú Bẫy 3 và \"Chi phí\": gắn nhãn \"suy ra/khái quát\" hoặc bỏ các câu \"phí thấp hơn hẳn\", \"khoản gửi có phí, không phải bảo hiểm\", \"có thể mất gốc\" cho đến khi có nguồn; với liên kết chung nêu rằng có lãi suất cam kết tối thiểu (Điều 11 khoản 3)."
  - "legal_refs: ghi doc Luật KDBH là bản hợp nhất 31/VBHN-VPQH; điền effective_from cho Luật (1/1/2023); ghi chú Điều 29 khoản 1 điểm a, b hiệu lực từ 1/1/2023 (Điều 62 khoản 2)."
  - "Thêm related tới mục 40 (21 ngày cân nhắc)."

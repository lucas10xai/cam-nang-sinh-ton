claims:
  - text: "Quyền lợi bảo hiểm có đảm bảo và không đảm bảo phải thể hiện rõ trong hợp đồng (TT 67/2023 Điều 11 khoản 2)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "match"
    quote: "2. Quyền lợi bảo hiểm có đảm bảo và các quyền lợi không đảm bảo (nếu có) phải được thể hiện rõ trong các hợp đồng bảo hiểm."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; dùng OCR và đối chiếu bằng mắt trên ảnh trang, đã sửa dấu OCR). Trang 8 của PDF. Điều 11 là quy định chung về hợp đồng bảo hiểm, không riêng nhân thọ."
  - text: "Tài liệu minh họa bán hàng của sản phẩm có giá trị hoàn lại phải nêu điều kiện nhận, số tiền cụ thể, có đảm bảo hay không (Điều 29 khoản 1 điểm b)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "match"
    quote: "b) Đối với những sản phẩm có giá trị hoàn lại, tài liệu minh họa bán hàng phải nêu rõ điều kiện để được nhận giá trị hoàn lại theo quy tắc, điều khoản sản phẩm bảo hiểm và những quyền lợi, kèm theo số tiền cụ thể mà bên mua bảo hiểm được hưởng khi nhận giá trị hoàn lại, nêu rõ những quyền lợi này là có đảm bảo hay không có đảm bảo;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; dùng OCR và đối chiếu bằng mắt trên ảnh trang, đã sửa dấu OCR). Trang 27. Điều 29 nằm trong mục sản phẩm bảo hiểm nhân thọ (tiêu đề Điều 29: Tài liệu minh họa bán hàng của sản phẩm bảo hiểm nhân thọ)."
  - text: "\"Hợp đồng trên một năm phải nói rõ việc hủy hợp đồng có thể dẫn tới không nhận lại được giá trị tương đương khoản phí đã đóng\" (Điều 29 khoản 1 điểm d)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "partial"
    quote: "Đối với các hợp đồng bảo hiểm có thời hạn lớn hơn 01 năm, tài liệu minh họa bán hàng cần thông tin rõ ràng cho bên mua bảo hiểm biết việc giao kết hợp đồng bảo hiểm là một cam kết dài hạn, việc bên mua bảo hiểm hủy bỏ hợp đồng bảo hiểm có thể dẫn đến việc không nhận lại được giá trị tương đương với khoản phí bảo hiểm đã đóng;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; dùng OCR và đối chiếu bằng mắt trên ảnh trang, đã sửa dấu OCR). Trang 27. Chủ thể trong nguồn là \"tài liệu minh họa bán hàng\", không phải \"hợp đồng\"; câu của mục viết \"Hợp đồng trên một năm phải nói rõ\" là sai đối tượng nghĩa vụ, và nguồn nói \"cần thông tin\", không phải \"phải nói rõ\"."
  - text: "Chấm dứt hợp đồng nhân thọ có giá trị hoàn lại thì doanh nghiệp phải trả giá trị hoàn lại, trừ khi các bên thỏa thuận khác (Luật KDBH Điều 27 khoản 3)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf"
    verdict: "partial"
    quote: "3. Trường hợp đơn phương chấm dứt thực hiện hợp đồng bảo hiểm quy định tại khoản 1 và khoản 2 Điều 26 của Luật này, đối với hợp đồng bảo hiểm nhân thọ có giá trị hoàn lại, doanh nghiệp bảo hiểm phải trả cho bên mua bảo hiểm giá trị hoàn lại của hợp đồng bảo hiểm, trừ trường hợp các bên có thoả thuận khác."
    note: "Chỉ áp dụng cho đơn phương chấm dứt theo Điều 26 khoản 1 (bên mua không đóng phí/không đóng đủ phí sau thời gian gia hạn) và khoản 2 (không chấp nhận thay đổi mức độ rủi ro). Câu của mục khái quát thành \"Chấm dứt hợp đồng nhân thọ có giá trị hoàn lại\"; người đọc dễ hiểu là mọi trường hợp hủy, kể cả tự nguyện hủy sớm (nguồn không nói điều đó). Đọc thẳng từ PDF có lớp chữ (bản hợp nhất 31/VBHN-VPQH)."
  - text: "Thời điểm hiệu lực TT 67/2023: 2/11/2023"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "partial"
    quote: "1. Thông tư này có hiệu lực thi hành kể từ ngày ký, trừ trường hợp quy định tại khoản 2 và 3 Điều này.\n2. Các điểm a, b, c, d, đ, i khoản 1, các điểm b, d khoản 2, các điểm a, b khoản 3 Điều 20, các điểm a, b khoản 1 Điều 29, các điều 33, 34, 45, 46, 47, 48, 51, khoản 1 Điều 52, Điều 55, Mục 3 và Mục 4 Chương IV của Thông tư này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2023."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; dùng OCR và đối chiếu bằng mắt trên ảnh trang, đã sửa dấu OCR). Điều 62 (OCR, chưa đối chiếu ảnh từng chữ). TT ký ngày 02/11/2023 nên điểm d khoản 1 Điều 29 hiệu lực từ 2/11/2023, nhưng điểm a, b khoản 1 Điều 29 có hiệu lực từ 01/01/2023 (khoản 2 Điều 62). Mục ghi chung 2/11/2023 cho cả hai điểm: lệch nhẹ, không gây hiểu sai nghĩa vụ hiện nay."
  - text: "\"Hợp đồng thuần bảo vệ không trả lại tiền nếu không có sự kiện bảo hiểm\" và \"phí thấp hơn hẳn hợp đồng có yếu tố tiết kiệm\""
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "inference"
    note: "Không có câu nào trong 2 nguồn nói điều này; đúng về bản chất sản phẩm nhưng là kiến thức nền, không phải chữ của luật. Nên gắn nhãn hoặc dẫn nguồn khác. \"thấp hơn hẳn\" không có số liệu."
  - text: "\"Phần phí bạn trả thêm để được nhận lại tiền là một khoản gửi có phí, không phải bảo hiểm\""
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "inference"
    note: "Cách diễn đạt của tác giả, không có trong nguồn. Với sản phẩm có quyền lợi bảo hiểm kèm tích lũy thì phần \"thêm\" vẫn nằm trong hợp đồng bảo hiểm; nên viết \"về mặt kinh tế gần giống\" hoặc bỏ."
  - text: "Sản phẩm liên kết đầu tư: tiền nằm trong quỹ, lên xuống theo thị trường, có thể mất gốc (Bẫy 3)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "inference"
    note: "Không có câu tương ứng trong nguồn được dẫn. Điều 11 khoản 3 nói liên kết chung/hưu trí phải thể hiện \"mức lãi suất cam kết tối thiểu\", nên \"có thể mất gốc\" không đúng với mọi sản phẩm liên kết (liên kết chung có lãi suất cam kết tối thiểu); đúng hơn với liên kết đơn vị. Cần phân biệt hoặc rút gọn."
  - text: "Bước 2: đòi bảng giá trị hoàn lại năm thứ nhất, thứ hai, thứ ba trước khi ký"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf"
    verdict: "inference"
    note: "Lời khuyên thực hành, không phải nghĩa vụ trong nguồn: Điều 29 khoản 1 điểm b chỉ đòi tài liệu minh họa nêu số tiền cụ thể mà không quy định bảng theo từng năm. Hợp lý nhưng nên ghi rõ là khuyến nghị."

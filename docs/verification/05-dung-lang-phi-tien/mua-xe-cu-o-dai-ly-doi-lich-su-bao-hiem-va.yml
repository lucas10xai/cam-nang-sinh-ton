claims:
  - text: "Cấm cung cấp thông tin sai lệch, không đầy đủ, không chính xác về hàng hóa (Điều 10 khoản 1 điểm a)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "a) Lừa dối hoặc gây nhầm lẫn cho người tiêu dùng thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác về một trong các nội dung sau đây: sản phẩm, hàng hóa, dịch vụ mà tổ chức, cá nhân kinh doanh bán, cung cấp;"
    verdict: match
    note: "Đọc trực tiếp ảnh trang 8 bản ký Bộ Công Thương (PDF quét ảnh)."
  - text: "Cấm không đền bù, không đổi trả khi hàng không đúng cam kết (Điều 10 khoản 1 điểm đ và e)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "e) Không đền bù, trả lại tiền hoặc đổi lại sản phẩm, hàng hóa, dịch vụ cho người tiêu dùng do sản phẩm, hàng hóa, dịch vụ không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam kết của tổ chức, cá nhân kinh doanh;"
    verdict: partial
    note: "Điểm e khớp. Điểm đ chỉ nói 'do nhầm lẫn của tổ chức, cá nhân kinh doanh', không phải 'không đúng cam kết'; mục gộp hai điểm thành một câu. Khoản 1 chỉ áp dụng cho 'Tổ chức, cá nhân kinh doanh'."
  - text: "Giao dịch dân sự vô hiệu khi bị lừa dối (mục ghi Điều 132)"
    source_url: https://hethongphapluat.com/bo-luat-dan-su-2015/dieu-127
    quote: "Điều 127. Giao dịch dân sự vô hiệu do bị lừa dối, đe dọa, cưỡng ép. Khi một bên tham gia giao dịch dân sự do bị lừa dối hoặc bị đe dọa, cưỡng ép thì có quyền yêu cầu Tòa án tuyên bố giao dịch dân sự đó là vô hiệu."
    verdict: mismatch
    note: "Sai điều luật: vô hiệu do lừa dối là Điều 127 BLDS 2015. Điều 132 là 'Thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu'. Nguồn thứ cấp (hethongphapluat.com); không mở được bản ký/Công báo của BLDS (datafiles.chinhphu.vn 404, thuvienphapluat 403)."
  - text: "Các bên hoàn trả cho nhau những gì đã nhận; bên có lỗi bồi thường thiệt hại (Điều 131)"
    source_url: https://hethongphapluat.com/bo-luat-dan-su-2015/dieu-131
    quote: "2. Khi giao dịch dân sự vô hiệu thì các bên khôi phục lại tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận. ... 4. Bên có lỗi gây thiệt hại thì phải bồi thường."
    verdict: match-secondary
    note: "Chỉ có bản thứ cấp. Khớp nội dung."
  - text: "Thời hiệu khởi kiện tranh chấp hợp đồng là 3 năm (Điều 429)"
    source_url: https://hethongphapluat.com/bo-luat-dan-su-2015/dieu-429
    quote: "Thời hiệu khởi kiện để yêu cầu Tòa án giải quyết tranh chấp hợp đồng là 03 năm, kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm."
    verdict: match-secondary
    note: "Số 3 năm khớp riêng Điều 429. Nhưng xem claim kế tiếp: áp dụng sai cho yêu cầu hủy/tuyên vô hiệu."
  - text: "Bị giấu xe đâm/ngập thì hủy được hợp đồng, đòi lại tiền và khởi kiện trong 3 năm (tldr, Nói dễ hiểu, steps 4)"
    source_url: https://hethongphapluat.com/bo-luat-dan-su-2015/dieu-132
    quote: "1. Thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu quy định tại các Điều 125, 126, 127, 128 và 129 của Bộ luật này là 02 năm, kể từ ngày: ... b) Người bị nhầm lẫn, bị lừa dối biết hoặc phải biết giao dịch được xác lập do bị nhầm lẫn, do bị lừa dối;"
    verdict: mismatch
    note: "Đường 'hủy hợp đồng vì bị lừa dối' (Điều 127) có thời hiệu 2 năm (Điều 132 khoản 1 điểm b), không phải 3 năm. 3 năm (Điều 429) chỉ cho tranh chấp hợp đồng nói chung (ví dụ đòi bồi thường do vi phạm hợp đồng). Mục đang ghi 3 năm cho mọi trường hợp và còn dẫn Điều 132 sai chủ đề. Người đọc chờ năm thứ 3 mới kiện có thể mất quyền yêu cầu tuyên vô hiệu."
  - text: "Muốn vậy phải chứng minh người bán biết mà vẫn nói sai"
    source_url: https://hethongphapluat.com/bo-luat-dan-su-2015/dieu-127
    quote: "Khi một bên tham gia giao dịch dân sự do bị lừa dối hoặc bị đe dọa, cưỡng ép thì có quyền yêu cầu Tòa án tuyên bố giao dịch dân sự đó là vô hiệu."
    verdict: inference
    note: "Đoạn tôi đọc được của Điều 127 không nêu yêu cầu chứng minh 'người bán biết'; định nghĩa lừa dối (hành vi cố ý) nằm ở phần sau của điều này mà bản tôi lấy bị cụt, chưa đối chiếu. Nên trích định nghĩa đầy đủ."
  - text: "Việt Nam không có mức phạt gấp ba tiền xe / không có điều nào cho nhân ba giá trị xe"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "Không tìm thấy điều khoản bồi thường gấp ba trong các điều đã đọc (Điều 10, 25, 29, 30, 31 Luật BVQLNTD 2023)."
    verdict: not-found
    note: "Khẳng định phủ định. Chưa đọc toàn bộ Luật 19/2023 (46 trang quét ảnh), chưa đọc NĐ 98/2020 và NĐ 24/2025 về xử phạt."
  - text: "Mua từ người bán tư nhân thì luật bảo vệ người tiêu dùng không áp dụng (Bẫy 3)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "1. Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây:"
    verdict: inference
    note: "Điều 10 khoản 1 nhắm vào 'Tổ chức, cá nhân kinh doanh' nên suy ra không áp dụng cho người bán không kinh doanh. Chưa đọc Điều 2 (đối tượng áp dụng) để khẳng định."
  - text: "Việt Nam không có cơ sở dữ liệu công khai về lịch sử tai nạn của xe (Bẫy 1)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "Nguồn đã dẫn không nói gì về cơ sở dữ liệu lịch sử tai nạn xe."
    verdict: not-found
    note: "Không có nguồn nào trong mục Nguồn cho khẳng định này; không kiểm được."

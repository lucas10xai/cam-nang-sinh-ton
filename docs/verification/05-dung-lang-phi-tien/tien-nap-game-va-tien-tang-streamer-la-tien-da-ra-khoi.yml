claims:
  - text: 'Người đủ 18 tuổi là người thành niên có năng lực hành vi dân sự đầy đủ (Điều 20 khoản 2 BLDS)'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2016/01/91.signed.pdf
    quote: 'Điều 20. Người thành niên 1. Người thành niên là người từ đủ mười tám tuổi trở lên. 2. Người thành niên có năng lực hành vi dân sự đầy đủ, trừ trường hợp quy định tại các điều 22, 23 và 24 của Bộ luật này.'
    verdict: match
    note: 'PDF ký số là ảnh quét; đã đọc bằng OCR trang 5 (hình), sửa lỗi glyph rõ ràng. Lưu ý: số hiệu thật của Bộ luật là 91/2015/QH13 (trang bìa ghi "Luật số: 91/2015/QH13"), KHÔNG phải QH15 như mục ghi. Điều 20 chỉ nói về năng lực hành vi, KHÔNG nói gì về việc giao dịch nạp game "không đòi lại được".'
  - text: 'Nạp tiền/tặng quà của người đủ 18 tuổi là giao dịch hợp lệ, "không có luật nào cho đòi lại"; "người lớn tiêu rồi thì không có cửa đòi"'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2016/01/91.signed.pdf
    quote: ''
    verdict: inference
    note: 'Không có câu nào trong Điều 20 hay nguồn dẫn nói như vậy. Khẳng định tuyệt đối "không có luật nào" quá mức: vẫn còn giao dịch vô hiệu do nhầm lẫn (Điều 126), lừa dối/đe dọa (Điều 127) trong cùng bộ luật (thấy tiêu đề Điều 126 ở trang 35), tài khoản bị chiếm/hack, và quyền người tiêu dùng nói chung (Luật BVQLNTD 2023, ví dụ Điều 38 khoản 3 điểm b cho đơn phương chấm dứt hợp đồng từ xa trong 30 ngày khi thông tin cung cấp không chính xác/đầy đủ). Cần sửa thành "thường rất khó, trừ khi có lừa dối/nhầm lẫn/tài khoản bị chiếm".'
  - text: 'Cách còn lại là đòi hoàn tiền cho giao dịch của con (dẫn Điều 20 khoản 2)'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2016/01/91.signed.pdf
    quote: ''
    verdict: mismatch
    note: 'Dẫn sai điều. Quyền hủy giao dịch của người chưa thành niên nằm ở Điều 21 và Điều 125 BLDS, không phải Điều 20 khoản 2 (Điều 20 là người thành niên).'
  - text: 'Doanh nghiệp game phải có hệ thống quản lý thời gian chơi: dưới 18 tuổi không quá 60 phút/ngày mỗi trò và không quá 180 phút/ngày cho tất cả trò (Điều 39 khoản 1 điểm e NĐ 147/2024)'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/147-nd.signed.pdf
    quote: 'e) Có hệ thống thiết bị kỹ thuật bảo đảm quản lý thời gian chơi trong ngày (từ 00h00 đến 24h00) của người chơi dưới 18 tuổi không quá 60 phút đối với từng trò chơi nhưng không quá 180 phút một ngày đối với tất cả trò chơi dành cho người chơi dưới 18 tuổi do doanh nghiệp cung cấp;'
    verdict: partial
    note: 'Đọc OCR trang 63 (bản 223 trang). Điều 39 có tên "Cấp Giấy phép cung cấp dịch vụ trò chơi điện tử G1 trên mạng": đây là ĐIỀU KIỆN CẤP PHÉP cho game G1. Điều kiện y hệt cho G2, G3, G4 nằm ở Điều 48 khoản 1 điểm e (trang 72). Mục chỉ dẫn Điều 39 nên thiếu Điều 48. Mức 180 phút là tổng các trò "do doanh nghiệp cung cấp" (từng doanh nghiệp), không phải tổng mọi game của trẻ. Câu "trẻ chỉ được chơi 60 phút mỗi trò một ngày" ở mục Nói dễ hiểu là nghĩa vụ kỹ thuật của doanh nghiệp, không phải quy định cấm trẻ.'
  - text: 'Phải hiện khuyến cáo "Chơi quá 180 phút một ngày sẽ ảnh hưởng xấu đến sức khỏe" 30 phút một lần (Điều 39 khoản 1 điểm g)'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/147-nd.signed.pdf
    quote: 'có thông tin khuyến cáo với nội dung "Chơi quá 180 phút một ngày sẽ ảnh hưởng xấu đến sức khỏe" tại vị trí dễ nhận biết ở diễn đàn của trò chơi (nếu có) và trên màn hình thiết bị của người chơi theo tần suất 30 phút/lần trong quá trình chơi trò chơi;'
    verdict: match
    note: 'Trang 63 OCR. Cùng lưu ý phạm vi G1 (Điều 39); G2-G4 ở Điều 48 điểm g.'
  - text: 'NĐ 147/2024/NĐ-CP hiệu lực 25/12/2024'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/147-nd.signed.pdf
    quote: '1. Nghị định này có hiệu lực thi hành từ ngày 25 tháng 12 năm 2024.'
    verdict: match
    note: 'Điều 83 (trang 106 OCR). Nghị định ký ngày 09/11/2024.'
  - text: 'Trẻ em thuộc nhóm người tiêu dùng dễ bị tổn thương (Điều 8, Luật BVQLNTD 19/2023/QH15)'
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: 'Điều 8. Bảo vệ quyền lợi người tiêu dùng dễ bị tổn thương 1. Người tiêu dùng dễ bị tổn thương là người tiêu dùng có khả năng chịu nhiều tác động bất lợi về tiếp cận thông tin, sức khỏe, tài sản, giải quyết tranh chấp tại thời điểm mua hoặc sử dụng sản phẩm, hàng hóa, dịch vụ, bao gồm: ... c) Trẻ em theo quy định của pháp luật về trẻ em;'
    verdict: match
    note: 'Mục ghi legal_refs của Điều 8 với url: null và checked_at: null; PDF Bộ Công Thương ở mục 9 là nguồn dùng được (Luật số 19/2023/QH15 ở trang bìa, OCR trang 5-6).'
  - text: 'Bên bán phải ưu tiên tiếp nhận, xử lý, không chuyển yêu cầu của trẻ cho bên thứ ba; từ chối thì phải trả lời bằng văn bản nêu căn cứ pháp lý (Điều 8 khoản 2 điểm c)'
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: 'c) Khi người tiêu dùng dễ bị tổn thương có yêu cầu được bảo vệ kèm theo chứng cứ, tài liệu chứng minh mình là người tiêu dùng dễ bị tổn thương và về việc quyền lợi của mình bị xâm phạm, tổ chức, cá nhân kinh doanh phải ưu tiên tiếp nhận, xử lý và không chuyển yêu cầu của người tiêu dùng cho bên thứ ba giải quyết, trừ trường hợp bên thứ ba đó có nghĩa vụ liên quan. Trường hợp từ chối giải quyết yêu cầu của người tiêu dùng dễ bị tổn thương, tổ chức, cá nhân kinh doanh phải trả lời bằng văn bản, trong đó nêu rõ căn cứ pháp lý và sự không phù hợp với nội dung chính sách đã công bố theo quy định tại khoản 3 Điều này;'
    verdict: partial
    note: 'Đúng ý nhưng thiếu hai điều kiện: (1) yêu cầu phải kèm chứng cứ, tài liệu chứng minh là người tiêu dùng dễ bị tổn thương và quyền lợi bị xâm phạm; (2) ngoại lệ "trừ trường hợp bên thứ ba đó có nghĩa vụ liên quan" (nhà phát hành/cửa hàng ứng dụng/cổng thanh toán). Đây là quyền được ưu tiên tiếp nhận, không phải quyền được hoàn tiền; dễ khiến người đọc hiểu quá mức.'
  - text: 'Bẫy 3: đơn chốt trong livestream vẫn là hợp đồng mua bán; "hủy sau khi chốt là bạn vi phạm, không phải chưa mua gì"'
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: ''
    verdict: not-found
    note: 'Không có nguồn nào trong mục cho câu này và nó không thuộc chủ đề mục (game, tặng streamer). Luật BVQLNTD 2023 Điều 38 khoản 3 điểm b cho người tiêu dùng quyền đơn phương chấm dứt hợp đồng từ xa trong 30 ngày kể từ ngày giao kết khi bên bán cung cấp thông tin không chính xác/không đầy đủ theo khoản 1 Điều 37 (OCR trang 25), nên khẳng định tuyệt đối "hủy là vi phạm" có thể sai. Nên xóa hoặc chuyển sang mục livestream (30).'
  - text: 'Bẫy 1 và 2: thẻ cào không để lại dấu vết trong sao kê; tiền tặng streamer đi thẳng vào tài khoản cá nhân, ngân hàng không có nghĩa vụ thu hồi, không có "khiếu nại hoàn tiền"'
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/147-nd.signed.pdf
    quote: ''

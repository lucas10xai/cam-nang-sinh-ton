claims:
  - text: "Đại lý bảo hiểm không được xúi giục khách hàng hủy bỏ hợp đồng bảo hiểm đang có hiệu lực dưới mọi hình thức (Luật KDBH Điều 129 khoản 3 điểm d)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'd) Xúi giục khách hàng hủy bỏ hợp đồng bảo hiểm đang có hiệu lực dưới mọi hình thức.'
    verdict: match
    note: "Bản hợp nhất 31/VBHN-VPQH (trích được chữ). Mục viết 'huỷ' (dấu cũ), nội dung trùng. Lưu ý: điều cấm áp dụng cho ĐẠI LÝ bảo hiểm; mục dùng nó để nói về 'dịch vụ đòi lại phí' (thường không phải đại lý) trong phần 'Nói dễ hiểu' nên cần nói rõ phạm vi."
  - text: "Đại lý không được ngăn cản người mua kê khai hoặc xúi giục không kê khai thông tin (Điều 129 khoản 3 điểm b)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'b) Ngăn cản bên mua bảo hiểm cung cấp các thông tin liên quan đến hợp đồng bảo hiểm hoặc xúi giục bên mua bảo hiểm, người được bảo hiểm không kê khai các thông tin liên quan đến hợp đồng bảo hiểm;'
    verdict: match
    note: "Câu luật khớp. Câu kèm theo 'Đây là chiêu các nhóm đòi phí dùng khi soạn đơn tố cáo sai' là nhận định thực tiễn, không có trong nguồn (xem claim riêng)."
  - text: "Nghiêm cấm gian lận gồm giả mạo tài liệu, cố ý làm sai lệch thông tin trong hồ sơ yêu cầu bồi thường, trả tiền bảo hiểm (Điều 9 khoản 4)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'b) Giả mạo tài liệu, cố ý làm sai lệch thông tin trong hồ sơ yêu cầu bồi thường, trả tiền bảo hiểm;'
    verdict: match
    note: "Nằm ở khoản 4 Điều 9 điểm b ('Thực hiện các hành vi gian lận bao gồm:'). Mục cắt ngắn, không ghi điểm b, nhưng đúng chữ."
  - text: "Muốn hủy thì làm trực tiếp với doanh nghiệp bảo hiểm, theo quy định về quyền đơn phương chấm dứt và hậu quả (Điều 26 và Điều 27)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: 'Doanh nghiệp bảo hiểm, chi nhánh doanh nghiệp bảo hiểm phi nhân thọ nước ngoài hoặc bên mua bảo hiểm có quyền đơn phương chấm dứt thực hiện hợp đồng bảo hiểm trong trường hợp sau đây: 1. Bên mua bảo hiểm không đóng phí bảo hiểm hoặc không đóng đủ phí bảo hiểm theo thời hạn thỏa thuận hoặc sau thời gian gia hạn đóng phí; 2. ... không chấp nhận yêu cầu về thay đổi mức độ rủi ro được bảo hiểm quy định tại Điều 23 ...; 3. Người được bảo hiểm không thực hiện các biện pháp bảo đảm an toàn cho đối tượng bảo hiểm ...; 4. Bên mua bảo hiểm không đồng ý chuyển giao danh mục hợp đồng bảo hiểm ...'
    verdict: partial
    note: "Điều 26 chỉ liệt kê 4 trường hợp cụ thể được đơn phương chấm dứt, KHÔNG phải quyền hủy chung của bên mua. Quyền rút trong 21 ngày là Điều 35 (hợp đồng trên 1 năm); hủy bỏ khi bị đối phương cố ý cung cấp sai thông tin là Điều 22 khoản 3. Dẫn Điều 26-27 làm căn cứ 'muốn hủy thì tự làm' là đọc quá rộng."
  - text: "Không có dịch vụ nào lấy lại được toàn bộ phí bảo hiểm (tldr, Nói dễ hiểu)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/31-vbhn-vpqh.pdf
    quote: ''
    verdict: inference
    note: "Không có câu nguồn. Luật có trường hợp hoàn đủ phí: Điều 22 khoản 3 ('bên mua bảo hiểm có quyền hủy bỏ hợp đồng bảo hiểm, được hoàn lại phí bảo hiểm đã đóng' khi doanh nghiệp bảo hiểm cố ý cung cấp sai thông tin để giao kết) và Điều 27 khoản 2 (hoàn phí cho thời gian còn lại). Khẳng định tuyệt đối 'không dịch vụ nào' là suy ra từ kinh nghiệm, không phải chữ luật."

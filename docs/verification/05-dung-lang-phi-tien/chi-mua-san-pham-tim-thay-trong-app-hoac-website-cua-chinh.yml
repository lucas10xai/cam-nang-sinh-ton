  - "tldr/tiêu đề/'Ba câu hỏi': nêu rõ 'tra app/website' là cách kiểm tra thực hành, không phải nghĩa vụ luật định (hoặc dẫn quy định cụ thể); không viết 'sản phẩm ngân hàng bán hợp pháp phải tra được'."

result: "pass-with-edits"
claims:
  - text: "Luật TMĐT 122/2025/QH15 thông qua 10/12/2025, có hiệu lực từ 1/7/2026 (Điều 40)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "Điều 40. Hiệu lực thi hành\nLuật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026.\n...Luật này đã được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XV, Kỳ họp thứ 10 thông qua ngày 10 tháng 12 năm 2025."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 28."
  - text: "Người bán phải cung cấp cho nền tảng tên, địa điểm kinh doanh; tên, địa chỉ trụ sở; tên, địa chỉ cư trú (Điều 21 khoản 1 điểm b)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "b) Cung cấp cho chủ quản nền tảng thương mại điện tử thông tin về tên, địa điểm kinh doanh của doanh nghiệp, hộ kinh doanh theo nội dung đăng ký đã thực hiện với cơ quan đăng ký kinh doanh; tên, địa chỉ nơi đặt trụ sở của tổ chức; tên, địa chỉ cư trú của cá nhân;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 15-16. Khoản 1 Điều 21 áp dụng cho người bán trên sàn trung gian/mạng xã hội KHÔNG có chức năng đặt hàng; người bán trên nền tảng có chức năng đặt hàng cũng phải thực hiện khoản 1 (Điều 21 khoản 2 điểm a), nên không sai nội dung."
  - text: "Chủ quản nền tảng trung gian phải công khai đúng những thông tin đó (Điều 17 khoản 1 điểm d); tldr: \"nền tảng phải công khai tên, địa chỉ người bán\""
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "partial"
    quote: "d) Công khai thông tin quy định tại điểm b khoản 1 và điểm c khoản 2 Điều 21 của Luật này do người bán cung cấp;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Đối chiếu ảnh trang 11, đọc đúng. Phần \"điểm b khoản 1\" = tên/địa chỉ như mục nói; nhưng luật còn dẫn \"điểm c khoản 2 Điều 21\" (người bán có chức năng đặt hàng phải cung cấp giấy tờ chứng minh điều kiện đầu tư kinh doanh) mà mục không nêu. Với mạng xã hội có livestream, Điều 17 áp dụng gián tiếp qua Điều 18 khoản 3 (điểm b dẫn khoản 2 Điều 17, trong đó điểm a dẫn khoản 1); \"Chính phủ quy định chi tiết Điều này\" (Điều 18 khoản 5) chưa kiểm nghị định hướng dẫn."
  - text: "Nền tảng số trung gian phải cung cấp thông tin về tổ chức, cá nhân kinh doanh trên nền tảng khi người tiêu dùng giao dịch yêu cầu (Luật BVQLNTD Điều 39 khoản 3 điểm c)"
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "match"
    quote: "3. Ngoài trách nhiệm quy định tại khoản 2 Điều này, tổ chức thiết lập, vận hành nền tảng số trung gian có trách nhiệm sau đây:\nc) Cung cấp thông tin về tổ chức, cá nhân kinh doanh hoạt động trên nền tảng số trung gian khi người tiêu dùng giao dịch với tổ chức, cá nhân kinh doanh đó có yêu cầu;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 26. Đây mới là căn cứ cho nghĩa vụ \"cung cấp khi có yêu cầu\"; legal_refs[6] đang có url: null (thiếu liên kết nguồn)."
  - text: "Nền tảng phải xác thực điện tử danh tính người livestream bán hàng trước khi cho phép (Điều 22 khoản 4)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "4. Thực hiện việc xác thực điện tử danh tính người livestream bán hàng theo quy định của Luật này, pháp luật về định danh và xác thực điện tử trước khi cho phép thực hiện livestream bán hàng. Trường hợp người livestream bán hàng là người nước ngoài thì xác thực danh tính thông qua các giấy tờ hợp pháp."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 17."
  - text: "Nền tảng lưu trữ và bảo đảm truy cập hình ảnh, âm thanh livestream ít nhất 01 năm từ lúc bắt đầu truyền phát (Điều 22 khoản 7)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "7. Lưu trữ và bảo đảm khả năng truy cập thông tin, dữ liệu về hình ảnh, âm thanh của hoạt động livestream bán hàng trong thời gian ít nhất 01 năm từ thời điểm bắt đầu truyền phát."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 17."
  - text: "Người bán phải cung cấp cho người livestream giấy tờ chứng minh đáp ứng điều kiện đầu tư kinh doanh trước khi livestream (Điều 23)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "partial"
    quote: "1. Trước khi thực hiện livestream bán hàng, người bán phải cung cấp đầy đủ cho người livestream bán hàng giấy tờ chứng minh sau đây:\na) Giấy tờ chứng minh đáp ứng điều kiện đầu tư kinh doanh đối với ngành, nghề đầu tư kinh doanh có điều kiện trước khi livestream bán hàng;\nb) Giấy tờ chứng minh đáp ứng chất lượng sản phẩm, hàng hóa theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 17-18. Mục bỏ \"đối với ngành, nghề đầu tư kinh doanh có điều kiện\" (chỉ ngành có điều kiện) và bỏ điểm b (giấy tờ chất lượng sản phẩm); legal_refs ghi \"Điều 23\" không khoản."
  - text: "Bước 3 và Bẫy 1: yêu cầu nền tảng cung cấp thông tin người bán \"theo Điều 17 Luật Thương mại điện tử\"; \"Nền tảng chỉ đưa thông tin khi bạn yêu cầu đúng cách\""
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "inference"
    note: "Điều 17 khoản 1 điểm d là nghĩa vụ \"công khai\" (cho mọi người), không phải \"cung cấp khi có yêu cầu\"; nghĩa vụ cung cấp theo yêu cầu nằm ở Luật BVQLNTD Điều 39 khoản 3 điểm c. Khẳng định \"chỉ đưa khi yêu cầu đúng cách\" và \"phải nêu mã đơn, trích đúng điều luật\" là lời khuyên thực hành không có căn cứ luật; Điều 17 còn tới mạng xã hội chỉ qua Điều 18. Không gây hại, nhưng nên trích Điều 39 khoản 3 điểm c cùng Điều 17."
  - text: "Bẫy 3: nền tảng nước ngoài phải có đại diện theo ủy quyền tại Việt Nam (Điều 27–31)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "partial"
    quote: "4. Chủ quản nền tảng thương mại điện tử trung gian có chức năng đặt hàng trực tuyến, mạng xã hội hoạt động thương mại điện tử có chức năng đặt hàng trực tuyến, nền tảng thương mại điện tử tích hợp quy định tại khoản 1 Điều này phải thành lập pháp nhân tại Việt Nam trước khi nền tảng có lựa chọn ngôn ngữ hiển thị là tiếng Việt hoặc sử dụng tên miền quốc gia Việt Nam \".vn\" hoặc sau khi đạt ngưỡng giao dịch với người mua tại Việt Nam, trừ trường hợp pháp luật có quy định khác."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Điều 27 khoản 4, trang 20. Chỉ nền tảng KHÔNG có chức năng đặt hàng phải \"chỉ định đại diện theo ủy quyền\" (khoản 3); nền tảng có chức năng đặt hàng phải thành lập pháp nhân tại Việt Nam (khoản 4) hoặc chỉ định pháp nhân ủy quyền + ký quỹ nếu điều ước quốc tế cho phép (khoản 5). Điều 27–31 không nằm trong legal_refs."
  - text: "Bẫy 4: \"Mục này không nói nền tảng chịu trách nhiệm trả tiền thay người bán. Nghĩa vụ của nền tảng là cho bạn biết ai là người phải trả\""
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "mismatch"
    quote: "2. Chủ quản nền tảng thương mại điện tử trung gian có chức năng đặt hàng trực tuyến thực hiện các trách nhiệm sau đây:\nk) Chịu trách nhiệm bồi thường thiệt hại hoặc liên đới chịu trách nhiệm bồi thường thiệt hại trong trường hợp không thực hiện hoặc thực hiện không đầy đủ các quy định tại Điều này dẫn đến thiệt hại cho người mua. Việc bồi thường thiệt hại thực hiện theo quy định của pháp luật về dân sự và quy định khác của pháp luật có liên quan."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 11-12. Nền tảng có chức năng đặt hàng trực tuyến (kể cả mạng xã hội có livestream/đặt hàng qua Điều 18 khoản 3 điểm b) \"chịu trách nhiệm bồi thường thiệt hại hoặc liên đới chịu trách nhiệm bồi thường\" nếu không thực hiện đầy đủ Điều 17 gây thiệt hại cho người mua, và phải \"tiếp nhận lại hàng hóa\" không đúng nội dung đã công bố/quảng cáo/cam kết (khoản 2 điểm b). Nghĩa vụ của nền tảng rộng hơn \"cho biết ai là người bán\"; lời \"phải đòi đúng người bán\" làm nhẹ quyền đối với sàn."
internal_checks:
  - issue: "Bẫy 4 và Bẫy 3 của mục 29 mâu thuẫn với Luật TMĐT Điều 17 khoản 2 điểm b, k (sàn có chức năng đặt hàng phải nhận lại hàng và chịu/liên đới bồi thường)."
    severity: "error"
  - issue: "legal_refs[6] (Luật BVQLNTD Điều 39 khoản 3 điểm c) có url: null, effective_from và checked_at null; legal_refs[0-5] có url đúng văn bản (Luật 122/2025/QH15, 28 trang) và khoản/điểm khớp, trừ \"Điều 23\" không ghi khoản."
    severity: "warn"
  - issue: "Bước 3 và Bẫy 1 nói căn cứ \"Điều 17 Luật Thương mại điện tử\" để yêu cầu nền tảng cung cấp thông tin; Điều 17 khoản 1 điểm d chỉ là nghĩa vụ công khai. Căn cứ \"cung cấp khi có yêu cầu\" là Luật BVQLNTD Điều 39 khoản 3 điểm c (nằm trong thân nhưng không có trong lời khuyên bước 3)."
    severity: "warn"
  - issue: "Nói dễ hiểu và tldr: \"phải công khai tên và địa chỉ người bán\" nhưng Bẫy 1 nói nền tảng \"chỉ đưa thông tin khi bạn yêu cầu đúng cách\": hai câu căng nhau (công khai so với theo yêu cầu)."
    severity: "warn"
  - issue: "Bẫy 3 viết \"Luật 122/2025, Điều 27–31\" nhưng các điều này không có trong legal_refs; nội dung bị đơn giản hóa (đại diện theo ủy quyền chỉ cho nền tảng không có chức năng đặt hàng)."
    severity: "warn"
  - issue: "Cùng chương, mục 29 (Bẫy 3) nói sàn không chịu trách nhiệm thay người bán và đòi phải qua người bán trước; mục 30 nói nền tảng chỉ cho biết người bán: cả hai thiếu nghĩa vụ tiếp nhận hàng/bồi thường của sàn có chức năng đặt hàng. Số: 1 năm lưu trữ livestream khớp Điều 22 khoản 7; ngày 1/7/2026 và 10/12/2025 khớp."
    severity: "warn"
validity:
  doc: "Luật Thương mại điện tử 122/2025/QH15; Luật Bảo vệ quyền lợi người tiêu dùng 19/2023/QH15"
  in_force: true
  effective_from: "2026-07-01"
  amended_by: []
  basis: "Luật TMĐT: Điều 40 có hiệu lực từ 01/7/2026, thông qua 10/12/2025 (bản ký đọc từ ảnh trang 28) nên đang có hiệu lực tại 8/11/2026; Điều 18 khoản 5 và Điều 19 khoản 3 giao Chính phủ quy định chi tiết (nghị định hướng dẫn chưa kiểm). Luật BVQLNTD 19/2023: Điều 79 hiệu lực 01/7/2024; Luật TMĐT 2025 (ban hành sau) viện dẫn pháp luật BVQLNTD như đang hiện hành (Điều 17 khoản 1 điểm b, khoản 3); nguồn thứ cấp tháng 11/2026 ghi chưa có luật sửa đổi."
deliberate_vn_deviation: []
potential_harm:
  - "Bẫy 4 (và Bẫy 3 của mục 29): người đọc có thể hiểu nền tảng có chức năng đặt hàng không có nghĩa vụ nhận lại hàng/bồi thường, chỉ \"cho biết người bán\", nên không khiếu nại nền tảng theo Điều 17 khoản 2 điểm b, k. Hại tài chính/pháp lý nhẹ-vừa, không phải y tế."
suggested_edits:
  - "Ghi chú Bẫy 4: thay bằng \"Nền tảng không phải là người bán, nhưng với nền tảng có chức năng đặt hàng trực tuyến luật còn bắt nền tảng tiếp nhận lại hàng không đúng nội dung đã công bố và bồi thường hoặc liên đới bồi thường nếu không thực hiện đầy đủ nghĩa vụ gây thiệt hại cho người mua (Luật TMĐT Điều 17 khoản 2 điểm b, k). Vì vậy vừa yêu cầu thông tin người bán, vừa yêu cầu nền tảng xử lý\" (quote: Điều 17 khoản 2 điểm b, k)."
  - "Steps 3 và Ghi chú Bẫy 1: bỏ \"Nền tảng chỉ đưa thông tin khi bạn yêu cầu đúng cách\" hoặc sửa thành lời khuyên thực hành; thêm Điều 39 khoản 3 điểm c Luật BVQLNTD làm căn cứ \"cung cấp khi có yêu cầu\" (quote: Điều 39 khoản 3 điểm c); thêm URL và effective_from (01/7/2024) cho legal_refs[6]."
  - "Pháp luật VN, dòng Điều 17 khoản 1 điểm d: ghi đủ \"điểm b khoản 1 và điểm c khoản 2 Điều 21\" hoặc giải thích; nêu rằng với mạng xã hội, áp dụng qua Điều 18 khoản 3."
  - "Bẫy 3: sửa \"phải có đại diện theo ủy quyền\" thành \"phải thành lập pháp nhân tại Việt Nam, hoặc chỉ định pháp nhân ủy quyền và ký quỹ khi điều ước quốc tế cho phép (nền tảng có chức năng đặt hàng); nền tảng không có chức năng đặt hàng chỉ phải chỉ định đại diện theo ủy quyền\" (quote: Điều 27 khoản 3, 4, 5); thêm Điều 27–31 vào legal_refs hoặc bỏ dẫn số điều."
  - "Điều 23: ghi \"khoản 1 điểm a và b\" và thêm \"đối với ngành, nghề đầu tư kinh doanh có điều kiện\"; kiểm nghị định hướng dẫn Luật TMĐT 2025 (Điều 18 khoản 5) trước khi khẳng định thời điểm áp dụng."

claims:
  - text: "Nhà đầu tư trong nước đang có tài sản mã hóa được mở tài khoản tại tổ chức cung cấp dịch vụ do Bộ Tài chính cấp phép để lưu ký, mua, bán tại Việt Nam (NQ 05/2025/NQ-CP Điều 7 khoản 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/05-cp.signed.pdf
    quote: 'Nhà đầu tư trong nước đang có tài sản mã hóa, nhà đầu tư nước ngoài được mở tài khoản tại tổ chức cung cấp dịch vụ tài sản mã hóa do Bộ Tài chính cấp phép để lưu ký, mua, bán tài sản mã hóa tại Việt Nam.'
    verdict: match
    note: "PDF ký số là ảnh quét 45 trang, không có lớp chữ; đọc từ ảnh trang 5 bằng OCR (macOS Vision), quote đã chuẩn hóa dấu. Mục lược 'nhà đầu tư nước ngoài' khỏi câu, không làm sai ý."
  - text: "Sau 6 tháng kể từ khi tổ chức đầu tiên được cấp phép, nhà đầu tư trong nước giao dịch không qua tổ chức được cấp phép sẽ bị xử lý hành chính hoặc truy cứu trách nhiệm hình sự (Điều 7 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/05-cp.signed.pdf
    quote: 'Sau thời hạn 6 tháng kể từ khi tổ chức cung cấp dịch vụ tài sản mã hóa đầu tiên được cấp phép, nhà đầu tư trong nước giao dịch tài sản mã hóa không thông qua tổ chức cung cấp dịch vụ tài sản mã hóa do Bộ Tài chính cấp phép tùy theo tính chất, mức độ vi phạm sẽ bị xử lý vi phạm hành chính hoặc truy cứu trách nhiệm hình sự theo quy định pháp luật.'
    verdict: match
    note: "Cùng giới hạn OCR. Khớp với văn bản được Bộ Tài chính trích trên Báo Chính phủ 6/10/2026 (đọc được chữ)."
  - text: "Nhà đầu tư tự chịu trách nhiệm về quyết định đầu tư (Điều 16 khoản 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/05-cp.signed.pdf
    quote: 'Nhà đầu tư tự chịu trách nhiệm về quyết định đầu tư tài sản mã hóa.'
    verdict: match
    note: "OCR trang 17."
  - text: "Phạt 30 đến 50 triệu đồng đối với nhà đầu tư trong nước giao dịch tài sản mã hóa không thông qua tổ chức cung cấp dịch vụ do Bộ Tài chính cấp phép (NĐ 284/2026 Điều 9 khoản 1)"
    source_url: https://www.sav.gov.vn/Files/Others/db59882a-7d7d-4e67-9515-c363e3a1f417/284_2026_N%C4%90-CP.pdf
    quote: '1. Phạt tiền từ 30.000.000 đồng đến 50.000.000 đồng đối với nhà đầu tư trong nước giao dịch tài sản mã hóa không thông qua tổ chức cung cấp dịch vụ tài sản mã hóa do Bộ Tài chính cấp phép theo quy định tại khoản 2 Điều 7 Nghị quyết số 05/2025/NQ-CP.'
    verdict: partial
    note: "Con số khớp, nhưng điều khoản dẫn chiếu khoản 2 Điều 7 NQ 05, tức là chỉ áp dụng sau 6 tháng kể từ khi tổ chức ĐẦU TIÊN được cấp phép. tldr nói 'Từ 1/9/2026, giao dịch không qua tổ chức được cấp phép bị phạt 30 đến 50 triệu' thiếu điều kiện này và mâu thuẫn với chính mục (chưa có tổ chức nào được cấp phép nên đồng hồ 6 tháng chưa chạy). Bản PDF của SAV trích được chữ."
  - text: "Mức phạt tối đa của nghị định là 200 triệu đồng với tổ chức và 100 triệu đồng với cá nhân (Điều 4 khoản 1)"
    source_url: https://www.sav.gov.vn/Files/Others/db59882a-7d7d-4e67-9515-c363e3a1f417/284_2026_N%C4%90-CP.pdf
    quote: 'Mức phạt tiền tối đa đối với hành vi vi phạm quy định tại Nghị định này là 200.000.000 đồng đối với tổ chức, 100.000.000 đồng đối với cá nhân.'
    verdict: match
    note: ""
  - text: "Nghị định 284/2026/NĐ-CP ban hành 16/7/2026, hiệu lực 1/9/2026"
    source_url: https://www.sav.gov.vn/Files/Others/db59882a-7d7d-4e67-9515-c363e3a1f417/284_2026_N%C4%90-CP.pdf
    quote: 'Nghị định này có hiệu lực thi hành từ ngày 01 tháng 9 năm 2026 đến ngày Nghị quyết số 05/2025/NQ-CP hết hiệu lực thi hành.'
    verdict: match
    note: "Số: 284/2026/NĐ-CP, Hà Nội, ngày 16 tháng 7 năm 2026 (trang đầu). Nghị định chỉ có hiệu lực trong thời gian NQ 05 còn hiệu lực (Điều 21)."
  - text: "Ngày 6/10/2026, Bộ Tài chính trả lời công dân: Việt Nam chưa có tổ chức cung cấp dịch vụ tài sản số nào được cấp phép"
    source_url: https://baochinhphu.vn/giao-dich-tai-san-ma-hoa-khong-qua-to-chuc-duoc-cap-phep-co-the-bi-xu-ly-102261006081040169.htm
    quote: 'hiện có nhiều ý kiến tranh luận liên quan đến việc cá nhân thực hiện giao dịch tài sản số trên các sàn giao dịch quốc tế sau ngày 01/9/2026 trong bối cảnh Việt Nam chưa có tổ chức cung cấp dịch vụ tài sản số nào được cơ quan có thẩm quyền cấp phép.'
    verdict: partial
    note: "Câu 'chưa có tổ chức nào được cấp phép' nằm trong phần dẫn nhập của báo mô tả câu hỏi của công dân (ông Trần Toàn), không phải lời của Bộ Tài chính; phần trả lời của Bộ Tài chính (đọc được) chỉ trích khoản 2 Điều 7 NQ 05. Ngày bài 6/10/2026 đúng. Tình hình đến 8/11/2026 chưa kiểm được (tìm kiếm thấy tin hồ sơ cấp phép được nhận từ 20/1/2026 và một sàn nội địa vừa qua thẩm định an toàn thông tin cấp độ 4 cách đây ~2 tuần; chưa thấy tin cấp phép)."
  - text: "Bitcoin hay USDT không phải tiền hợp pháp ở Việt Nam / tiền ảo không phải tiền (tiêu đề, Nói dễ hiểu)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/05-cp.signed.pdf
    quote: ''
    verdict: not-found
    note: "Không nguồn nào trong mục nêu câu này. NQ 05 Điều 4 khoản 7 chỉ nói 'chào bán, phát hành, giao dịch, thanh toán tài sản mã hóa phải được thực hiện bằng Đồng Việt Nam'; không phát biểu 'không phải tiền hợp pháp'. Cần dẫn nguồn (ví dụ quy định về phương tiện thanh toán hợp pháp) hoặc bỏ."

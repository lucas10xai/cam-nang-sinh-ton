claims:
  - text: "Giá bán lẻ nước sạch sinh hoạt Hà Nội năm 2026 giữ nguyên mức của Quyết định 3541/QĐ-UBND ngày 7/7/2023 (Điều 1 Quyết định 6592/QĐ-UBND ngày 31/12/2025)"
    source_url: http://cskh.hawater.com.vn/wp-content/uploads/2026/01/QD6592UBNDgia-nuoc-sach-tu-nam-2026upwebcskh.pdf
    quote: "1. Giá bán lẻ nước sạch sinh hoạt: Giữ nguyên giá bán lẻ đã được UBND Thành phố phê duyệt tại Quyết định số 3541/QĐ-UBND ngày 07/7/2023 (cột từ ngày 01/01/2024 đến ngày 31/12/2024)."
    verdict: match
    note: "PDF quét ảnh, đọc bằng OCR cả 2 trang. Điều 2 nói thực hiện từ ngày 01/01/2026. Đúng văn bản, số hiệu và ngày."
  - text: "Hộ dân cư dùng đến 10 m3/tháng trả 8.500 đồng/m3 (8,5 đồng/lít)"
    source_url: https://cskh.hawater.com.vn/gia-nuoc/
    quote: "Hộ dân cư khác | 8.500 (Mức đến 10 m3/đồng hồ/tháng, SH1)"
    verdict: match-secondary
    note: "Số 8.500 nằm trong bảng của Quyết định 3541/QĐ-UBND (cột 01/01/2024-31/12/2024; OCR trang 2: '7.500 ... 8.500') và trong trang giá nước của Công ty nước sạch số 2 Hà Nội (không phải cơ quan ban hành). Điều kiện bị thiếu trong mục: 8.500 chỉ cho 'Hộ dân cư khác' (hộ chính sách/nghèo/cận nghèo là 5.973), và giá CHƯA gồm thuế GTGT và phí bảo vệ môi trường (xem claim sau)."
  - text: "Giá bán lẻ chưa gồm thuế GTGT và phí bảo vệ môi trường (mục so 8,5 đồng/lít với 3.350 đồng/lít bình, đắt 394 lần)"
    source_url: https://cskh.hawater.com.vn/gia-nuoc/
    quote: "Giá bán nước sạch sinh hoạt trên chưa bao gồm thuế giá trị gia tăng và phí bảo vệ môi trường đối với nước thải sinh hoạt."
    verdict: partial
    note: "Quyết định 3541 OCR cũng ghi 'Giá bán lẻ nước sạch sinh hoạt chưa bao gồm thuế giá trị gia tăng và phí ...'. Hóa đơn thật cao hơn 8,5 đồng/lít (cộng GTGT và phí BVMT), nên 'đắt 394 lần' và '8.840 đồng/1.040 lít' là so với giá chưa thuế phí; mục không nói điều này."
  - text: "Bình Lavie 20 lít bán lẻ 67.000 đồng/bình (tra 2/11/2026), tức 3.350 đồng/lít, đắt 394 lần nước máy"
    source_url: https://dailynuoc.com/gia-nuoc-lavie-20l-/
    quote: "Bảng giá nước suối Lavie bình 20 lít và chai nhỏ cập nhật tháng 07 năm 2024 ... Nước khoáng Lavie có vòi 20l | Bình | 67.000"
    verdict: partial
    note: "Số 67.000 có trong bảng, nhưng (1) bảng ghi 'cập nhật tháng 07 năm 2024', không phải 2/11/2026 như mục khẳng định; (2) đại lý là Công ty TNHH Nước uống Trường Phát giao tại TP.HCM, so với giá nước máy HÀ NỘI; (3) ngay trên trang, mô tả/meta ghi 'Giá nước Lavie 20l bình úp chỉ 62.000đ' và 'có vòi chỉ 58k', mâu thuẫn với bảng 67.000. Phép tính 67.000/20 = 3.350; 3.350/8,5 = 394,1 đúng."
  - text: "Một hộ dùng 1 bình 20 lít mỗi tuần: 52 bình/năm, 1.040 lít, 3.484.000 đồng; cùng lượng nước máy tốn 8.840 đồng"
    source_url: https://dailynuoc.com/gia-nuoc-lavie-20l-/
    quote: "Nước khoáng Lavie có vòi 20l | Bình | 67.000"
    verdict: inference
    note: "Tính lại: 52 x 67.000 = 3.484.000; 52 x 20 = 1.040; 1.040 x 8,5 = 8.840. Đúng số học, nhưng là suy ra từ 2 giá trên nên chịu cả 2 hạn chế ở trên. Trong mục chữ 'Nói dễ hiểu' và tldr dùng 'mỗi tuần một bình tốn 3.484.000 đồng/năm' đúng ý."
  - text: "Chai 500 ml khoảng 4.000 đồng/chai là 8.000 đồng/lít, đắt 941 lần"
    source_url: https://dailynuoc.com/gia-nuoc-lavie-20l-/
    quote: "Hiện nay giá bán 01 chai nước Lavie 500ml trên thị trường khoảng 4,000đ/chai."
    verdict: partial
    note: "Câu này có trên trang nhưng là phần tin liên quan đăng 23-08-2020 (6 năm trước); bảng giá chính ghi thùng 24 chai 500 ml 92.000 đ (~3.800 đ/chai). Tính 8.000/8,5 = 941 đúng."
  - text: "Nước sạch sinh hoạt chịu QCVN 01-1:2018/BYT (ban hành 14/12/2018); quy chuẩn này không áp dụng cho nước đóng bình, đóng chai"
    source_url: https://vhttdl.daklak.gov.vn/CMS/Content/thang10/Thongtu41-Nuocsach.pdf
    quote: "2. Quy chuẩn này không áp dụng đối với nước uống trực tiếp tại vòi, nước đóng bình, đóng chai, nước khoáng thiên nhiên đóng bình, đóng chai, nước sản xuất ra từ các bình lọc nước, hệ thống lọc nước và các loại nước không dùng cho mục đích sinh hoạt."
    verdict: match-secondary
    note: "Bản Thông tư 41/2018/TT-BYT (ngày 14/12/2018) lấy từ trang Sở VHTTDL Đắk Lắk, không phải trang Bộ Y tế/Công báo; mục không dẫn url. QUAN TRỌNG: quy chuẩn này đã bị thay (xem validity). Chính Điều 2.2 còn nói 'không áp dụng đối với nước uống trực tiếp tại vòi' nghĩa là quy chuẩn không xác nhận nước máy tại vòi uống thẳng được, điều mà mục Bẫy 3 dựa vào."
  - text: "Nước đạt QCVN 01-1:2018/BYT thì đun sôi uống được (Bẫy 3)"
    source_url: https://vhttdl.daklak.gov.vn/CMS/Content/thang10/Thongtu41-Nuocsach.pdf
    quote: "Nước sạch sử dụng cho mục đích sinh hoạt là nước đã qua xử lý có chất lượng bảo đảm, đáp ứng yêu cầu sử dụng cho mục đích ăn uống, vệ sinh của con người (viết tắt là nước sạch)."
    verdict: inference
    note: "Quy chuẩn định nghĩa nước sạch dùng cho 'ăn uống, vệ sinh' nhưng không có chữ nào nói 'đun sôi uống được'. Đây là suy ra của mục; hợp lý nhưng cần ghi nhãn. Ý 'đun thêm không khử được kim loại hay hóa chất' không có nguồn trong mục."
  - text: "Nước đóng bình có quy chuẩn riêng là QCVN 6-1:2010/BYT"
    source_url: https://chinhphu.vn/default.aspx?pageid=27160&docid=97229
    quote: "Ban hành kèm theo Thông tư này: QCVN 6-1:2010/BYT Quy chuẩn kỹ thuật quốc gia đối với nước khoáng thiên nhiên và nước uống đóng chai."
    verdict: partial
    note: "Thông tư 34/2010/TT-BYT ngày 02/6/2010, hiệu lực 01/01/2011 (trang chinhphu.vn). Tên quy chuẩn là 'nước khoáng thiên nhiên và nước uống đóng chai', chưa thấy chữ 'đóng bình' trong phần tôi đọc (chưa mở toàn văn quy chuẩn, mục cũng nói 'chưa mở toàn văn'). Hiệu lực hiện nay chưa xác nhận."

suggested_edits:
  - "Sửa mọi dẫn QCVN 01-1:2018/BYT thành QCVN 01-1:2024/BYT (Thông tư 52/2024/TT-BYT), đối chiếu lại điều 'phạm vi áp dụng' trong bản 2024: 'Quy chuẩn kỹ thuật quốc gia này không áp dụng đối với nước uống trực tiếp tại vòi, nước khoáng thiên nhiên đóng chai và nước uống đóng chai được sử dụng với mục đích giải khát, nước sản xuất ra từ các bình lọc nước, hệ thống lọc nước và các loại nước không dùng cho mục đích sinh hoạt.' (bản gốc quacert.gov.vn). Điền url Công báo/văn bản chính thức."
  - "Sửa 'Bình Lavie 20 lít bán lẻ 67.000 đồng/bình (tra 2/11/2026)': nguồn là bảng cập nhật 'tháng 07 năm 2024' của đại lý TP.HCM; hoặc thay bằng giá Hà Nội có ngày tra thật và url cụ thể, hoặc ghi 'giá tham khảo TP.HCM, 7/2024' và bỏ con số 394 lần dạng chắc chắn (viết 'hàng trăm lần' như tiêu đề)."
  - "Thêm vào 'Lợi ích' câu: 'Giá nước 8.500 đồng/m3 là giá chưa gồm thuế GTGT và phí bảo vệ môi trường đối với nước thải sinh hoạt (Quyết định 3541/QĐ-UBND, Quyết định 6592/QĐ-UBND)', và ghi rõ 8.500 chỉ cho hộ dân cư khác ở bậc đến 10 m3/tháng (hộ nghèo/cận nghèo/chính sách 5.973)."
  - "Bẫy 3 gắn nhãn 'suy ra': đổi 'Nước đạt QCVN 01-1:2018/BYT thì đun sôi uống được' thành 'Nước máy đạt quy chuẩn nước sạch sinh hoạt (QCVN 01-1:2024/BYT) dùng cho ăn uống nhưng quy chuẩn không áp dụng cho nước uống trực tiếp tại vòi; vì vậy đun sôi là biện pháp thận trọng.' và nêu nguồn cho 'đun thêm không khử được kim loại hay hóa chất' (ví dụ WHO Guidelines for drinking-water quality) hoặc bỏ."
  - "Cập nhật legal_refs: QCVN 6-1:2010/BYT thêm url (https://chinhphu.vn/default.aspx?pageid=27160&docid=97229), ghi rõ 'nước khoáng thiên nhiên và nước uống đóng chai'; đặt effective_from 2026-01-01 cho QĐ 6592 và 2011-01-01 cho QCVN 6-1; cập nhật checked_at."

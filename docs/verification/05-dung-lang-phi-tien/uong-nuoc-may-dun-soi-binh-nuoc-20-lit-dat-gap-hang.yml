  basis: "QĐ 6592: bản ký năm 2025, áp dụng từ 1/1/2026, đọc OCR, trang công ty nước (cskh.hawater.com.vn) vẫn niêm yết bảng giá này, chưa thấy văn bản thay. Với QCVN 01-1:2018: lời nói đầu của QCVN 01-1:2024/BYT ghi 'thay thế quy chuẩn kỹ thuật quốc gia về chất lượng nước nước sạch QCVN 01-1:2018/BYT'; báo Đầu tư 20/01/2025 xác nhận Thông tư 52/2024/TT-BYT đã ban hành. Ngày hiệu lực 1/7/2025 chỉ từ nguồn thứ cấp (tôi không mở được Công báo/văn bản gốc). QCVN 6-1:2010/BYT: Thông tư 34/2010 hiệu lực 1/1/2011, chưa có bằng chứng bị thay/sửa nhưng chưa kiểm."

claims:
  - text: "Nhãn hàng hóa bắt buộc thể hiện tên hàng hóa; tên và địa chỉ của tổ chức, cá nhân chịu trách nhiệm; xuất xứ; và nội dung khác theo Phụ lục I (Điều 10 khoản 1 NĐ 43/2017/NĐ-CP)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2017/04/43.signed.pdf
    quote: "1. Nhãn hàng hóa bắt buộc phải thể hiện các nội dung sau: a) Tên hàng hoá; b) Tên và địa chỉ của tổ chức, cá nhân chịu trách nhiệm về hàng hóa; c) Xuất xứ hàng hóa; d) Các nội dung khác theo tính chất của mỗi loại hàng hóa được quy định tại Phụ lục I của Nghị định này và văn bản quy phạm pháp luật liên quan."
    verdict: match
    note: "PDF ký số là ảnh quét; đọc bằng OCR (macOS Vision) trang 6. Khớp chữ NĐ 43/2017 gốc, nhưng NĐ 43/2017 đã HẾT HIỆU LỰC (xem validity). Nội dung tương ứng nay ở Điều 42 khoản 1 NĐ 37/2026/NĐ-CP (đọc qua bản đăng lại trên vnlawfirm.vn, xem claim 'NĐ 37')."
  - text: "Điều 16: ghi thành phần và thành phần định lượng; thực phẩm phải ghi thành phần theo thứ tự từ cao đến thấp về khối lượng (cơ sở của step 1 'nguyên liệu đứng trước là nguyên liệu chiếm nhiều nhất')"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2017/04/43.signed.pdf
    quote: "a) Đối với thực phẩm phải ghi thành phần theo thứ tự từ cao đến thấp về khối lượng."
    verdict: match
    note: "OCR trang 10, Điều 16 khoản 3 điểm a. Còn thêm: 'Nếu thành phần là chất phụ gia, phải ghi tên nhóm chất phụ gia, tên chất phụ gia hoặc mã số quốc tế INS (nếu có)'. Văn bản đã hết hiệu lực; NĐ 37/2026 Điều 48 khoản 3 điểm a giữ cùng nguyên tắc: 'a) Đối với thực phẩm phải ghi thành phần theo thứ tự từ cao đến thấp về khối lượng.'"
  - text: "Điều 13 (định lượng hàng hóa) và Điều 14 (ngày sản xuất, hạn sử dụng) là nội dung theo tính chất thực phẩm phải ghi"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2017/04/43.signed.pdf
    quote: "Điều 14. Ngày sản xuất, hạn sử dụng 1. Ngày sản xuất, hạn sử dụng hàng hóa được ghi theo thứ tự ngày, tháng, năm của năm dương lịch."
    verdict: partial
    note: "OCR trang 7-8. Điều 13 và 14 NĐ 43 quy định CÁCH GHI (định lượng, thứ tự ngày), không tự nó quy định thực phẩm 'phải' có ngày sản xuất/hạn dùng; yêu cầu bắt buộc nằm ở Điều 10 khoản 1 điểm d + Phụ lục I. Mục dùng Điều 13, 14 như nguồn của nghĩa vụ là lệch."
  - text: "Điều 9: trách nhiệm ghi nhãn trung thực, rõ ràng, chính xác (Bẫy 3: 'Điều 9 Nghị định 43 đặt trách nhiệm lên người ghi nhãn')"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2017/04/43.signed.pdf
    quote: "1. Tổ chức, cá nhân chịu trách nhiệm ghi nhãn hàng hóa kể cả nhãn phụ phải bảo đảm ghi nhãn trung thực, rõ ràng, chính xác, phản ánh đúng bản chất của hàng hoa."
    verdict: match
    note: "OCR trang 5-6. Văn bản đã hết hiệu lực; nay Điều 41 khoản 1 NĐ 37/2026: 'Tổ chức, cá nhân chịu trách nhiệm ghi nhãn hàng hóa kể cả nhãn phụ phải bảo đảm ghi nhãn trung thực, rõ ràng, chính xác, phản ánh đúng bản chất của hàng hóa.'"
  - text: "Bên bán phải ghi nhãn hàng hóa trung thực, rõ ràng, chính xác, phản ánh đúng bản chất (Điều 21 khoản 2 Luật BVQLNTD 19/2023/QH15)"
    source_url: https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf
    quote: "2. Thực hiện ghi nhãn hàng hóa bảo đảm trung thực, rõ ràng, chính xác, phản ánh đúng bản chất của hàng hóa theo quy định của pháp luật;"
    verdict: match
    note: "OCR trang 9. Chủ thể là 'Tổ chức, cá nhân kinh doanh', mục dùng 'Bên bán': hợp lý. legal_refs[6] ghi url: null (URL đúng như trên)."
  - text: "Hàng bán rời, bán cân, bán trong chợ không có nhãn thì Nghị định 43 chỉ đặt nghĩa vụ lên nhãn, không có nghĩa vụ ghi thành phần ('Chỗ không có luật')"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2017/04/43.signed.pdf
    quote: "đ) Hàng hoá là thực phẩm tươi, sống, thực phẩm chế biến không có bao bì và bán trực tiếp cho người tiêu dùng;"
    verdict: partial
    note: "OCR trang 2, Điều 1 khoản 2 điểm đ NĐ 43: loại hàng này 'không thuộc phạm vi điều chỉnh' của nghị định. Mục không nhắc căn cứ cụ thể này (chỉ nói 'NĐ 43 chỉ đặt nghĩa vụ lên nhãn'). Hơn nữa 'không có luật' là quá rộng: Luật BVQLNTD Điều 21 khoản 1 điểm a vẫn buộc bên kinh doanh 'Cung cấp thông tin chính xác, đầy đủ' về 'chất lượng, công dụng, giá, xuất xứ hàng hóa, thời hạn sử dụng' (OCR trang 9), và Luật ATTP Điều 9 khoản 1 điểm a cho người tiêu dùng quyền 'Được cung cấp thông tin trung thực về an toàn thực phẩm' (bản chinhphu .doc). Kết luận 'không ghi ≠ không có' và 'phải hỏi người bán' đúng; câu 'Chỗ không có luật' sai khái quát."
  - text: "NĐ 37/2026/NĐ-CP (23/01/2026) thay NĐ 43/2017: nội dung bắt buộc, loại trừ hàng thực phẩm tươi sống/không bao bì"
    source_url: https://vnlawfirm.vn/van-ban/nghi-dinh-37-2026-nd-cp-huong-dan-luat-chat-luong-san-pham-hang-hoa
    quote: "4. Các quy định dưới đây hết hiệu lực kể từ ngày Nghị định này có hiệu lực thi hành: ... b) Nghị định số 43/2017/NĐ-CP ngày 14 tháng 4 năm 2017 của Chính phủ về nhãn hàng hóa; c) Nghị định số 111/2021/NĐ-CP ngày 09 tháng 12 năm 2021 của Chính phủ sửa đổi, bổ sung một số điều Nghị định số 43/2017/NĐ-CP ngày 14 tháng 4 năm 2017 của Chính phủ về nhãn hàng hóa."
    verdict: match-secondary
    note: "Điều 97 khoản 4 NĐ 37/2026/NĐ-CP, qua bản đăng lại toàn văn của vnlawfirm.vn (thứ cấp; không mở được bản gốc Công báo/vanban). Khoản 1 cùng điều: 'Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành.' Nguồn chính thống phụ: Chi cục QLCL nông lâm thủy sản Lâm Đồng (chicucclcbpttt.lamdong.gov.vn/News/tintucsukien/2026/04/725.aspx): 'Nghị định số 37/2026/NĐ-CP ... có hiệu lực thi hành từ ngày 23/01/2026, đã chính thức bãi bỏ Nghị định số 43/2017/NĐ-CP và Nghị định số 111/2021/NĐ-CP'. Điều 35 khoản 2 điểm e NĐ 37 giữ loại trừ: 'e) Hàng hóa là thực phẩm tươi, sống, thực phẩm chế biến không có bao bì và bán trực tiếp cho người tiêu dùng;' Điều 42 khoản 1 giữ bốn nhóm nội dung bắt buộc nhưng 'bằng tiếng Việt'."
  - text: "Nghị định 111/2021/NĐ-CP sửa đổi NĐ 43/2017 (mục dẫn kèm 'sửa đổi, bổ sung bởi NĐ 111/2021' cho Điều 10 khoản 1)"
    source_url: https://vanban.chinhphu.vn/?pageid=27160&docid=204681
    quote: "Sửa đổi, bổ sung một số điều Nghị định số 43/2017/NĐ-CP ngày 14 tháng 4 năm 2017 của Chính phủ về nhãn hàng hóa"
    verdict: match
    note: "Chỉ khớp tiêu đề/ngày hiệu lực (15-02-2022) trên trang vanban.chinhphu.vn; không đọc toàn văn PDF (111.signed.pdf), nên không xác nhận Điều 10 khoản 1 có bị NĐ 111 sửa. Văn bản này cũng hết hiệu lực từ 23/01/2026. legal_refs có Điều 10 khoản 1 nhưng mục 'Nguồn' dẫn NĐ 111 mà không nêu điều."

result: "fail"
claims:
  - text: "Cấm lừa dối/gây nhầm lẫn bằng thông tin sai lệch, không đầy đủ, không chính xác về hàng hóa, dịch vụ, uy tín và khả năng kinh doanh (Luật BVQLNTD Điều 10 khoản 1 điểm a)"
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "match"
    quote: "Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây:\na) Lừa dối hoặc gây nhầm lẫn cho người tiêu dùng thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không chính xác về một trong các nội dung sau đây: sản phẩm, hàng hóa, dịch vụ mà tổ chức, cá nhân kinh doanh bán, cung cấp; uy tín, khả năng kinh doanh, khả năng cung cấp sản phẩm, hàng hóa, dịch vụ của tổ chức, cá nhân kinh doanh; nội dung, đặc điểm giao dịch giữa người tiêu dùng với tổ chức, cá nhân kinh doanh; hình ảnh, giấy tờ, tài liệu chứng nhận của cơ quan nhà nước có thẩm quyền về sản phẩm, hàng hóa, dịch vụ hoặc tổ chức, cá nhân kinh doanh;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Điều 10 khoản 1 điểm a. Mục chỉ nêu 2 trong 4 nhóm nội dung (còn \"nội dung, đặc điểm giao dịch\" và \"hình ảnh, giấy tờ, tài liệu chứng nhận\"); không làm sai nghĩa."
  - text: "Thông tin về nhận xét, đánh giá của người tiêu dùng cũng phải chính xác, đầy đủ (Điều 21 khoản 1 điểm c)"
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "match"
    quote: "Tổ chức, cá nhân kinh doanh có trách nhiệm sau đây:\n1. Cung cấp thông tin chính xác, đầy đủ về các nội dung sau đây:\nc) Nhận xét, đánh giá của người tiêu dùng về sản phẩm, hàng hóa, dịch vụ, tổ chức, cá nhân kinh doanh (nếu có);"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Điều 21 khoản 1 điểm c."
  - text: "Cấm nền tảng số ngăn hiển thị hoặc hiển thị không trung thực kết quả phản hồi, đánh giá (Điều 10 khoản 3 điểm c)"
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "match"
    quote: "3. Tổ chức, cá nhân kinh doanh thiết lập, vận hành, cung cấp dịch vụ nền tảng số bị nghiêm cấm thực hiện các hành vi sau đây:\nc) Sử dụng biện pháp ngăn hiển thị hoặc hiển thị không trung thực kết quả phản hồi, đánh giá của người tiêu dùng về sản phẩm, hàng hóa, dịch vụ, tổ chức, cá nhân kinh doanh trên nền tảng số, trừ trường hợp phản hồi, đánh giá đó vi phạm quy định của pháp luật, trái đạo đức xã hội;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Điều 10 khoản 3 điểm c. Mục bỏ ngoại lệ (đánh giá vi phạm pháp luật/trái đạo đức), không làm hiểu sai ý chính."
  - text: "Cấm thực hiện hành vi lừa đảo, lừa dối trên nền tảng thương mại điện tử (Luật TMĐT 122/2025 Điều 6 khoản 1)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "Điều 6. Các hành vi bị cấm trong hoạt động thương mại điện tử\n1. Thực hiện các hành vi lừa đảo, lừa dối trên nền tảng thương mại điện tử."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 4."
  - text: "Nền tảng phải cho phép người mua phản hồi, đánh giá và hiển thị đầy đủ, chính xác; chỉ loại đánh giá vi phạm pháp luật hoặc trái đạo đức (Luật TMĐT Điều 17 khoản 2 điểm h)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "partial"
    quote: "h) Cho phép người mua phản hồi, đánh giá về người bán và hàng hóa, dịch vụ do người bán cung cấp, hiển thị đầy đủ, chính xác kết quả phản hồi, đánh giá, trừ trường hợp phản hồi, đánh giá đó vi phạm quy định của pháp luật, trái đạo đức xã hội, thuần phong mỹ tục;"
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 12. Khoản 2 Điều 17 chỉ áp dụng cho \"Chủ quản nền tảng thương mại điện tử trung gian có chức năng đặt hàng trực tuyến\" (và mạng xã hội có chức năng đặt hàng/livestream qua Điều 18 khoản 3 điểm b); mục viết \"Nền tảng phải\" không nêu điều kiện này."
  - text: "\"Luật Việt Nam không có mức đền gấp 3 lần giá trị, tối thiểu 500 tệ, cũng không có mức sàn cố định. Bạn đòi thiệt hại thực tế theo pháp luật dân sự\""
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "inference"
    note: "Khẳng định phủ định, mục không dẫn nguồn. Trong Luật BVQLNTD 19/2023 không tìm thấy mức bồi thường gấp bội (đã tìm \"gấp\" trong toàn văn OCR, không thấy), nhưng toàn văn BLDS/Nghị định xử phạt chưa kiểm. Vế \"chỉ đòi thiệt hại thật\" làm nhẹ quyền thực tế: Điều 10 khoản 1 điểm e cấm không đền bù, trả lại tiền hoặc đổi lại hàng khi hàng không đúng quảng cáo, giới thiệu, cam kết (quote ở claim Bẫy 2), tức người mua có căn cứ đòi hoàn tiền/đổi hàng chứ không chỉ bồi thường thiệt hại."
  - text: "\"Việt Nam không có mức trần 20% giá trị hợp đồng cho tiền đặt cọc; mức đặt cọc do hai bên thỏa thuận\""
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "not-found"
    note: "Không dẫn nguồn (BLDS 2015 Điều 328, không mở). Trong Luật BVQLNTD chỉ thấy Điều 26 khoản 3 (hợp đồng theo mẫu phải được công khai trước khi người tiêu dùng giao kết hợp đồng hoặc thực hiện hoạt động đặt cọc, thanh toán trước), không có con số trần. Khẳng định \"không có mức trần\" là khẳng định phổ quát; có thể có trần theo từng ngành (ví dụ tiền đặt trước trong đấu giá tài sản): chưa kiểm, cần xác minh hoặc giới hạn phạm vi."
  - text: "Bẫy 2: \"Livestream không phải hợp đồng. Câu 'bảo hành 12 tháng', 'không thích trả lại' nói trên sóng chỉ thành nghĩa vụ khi ghi trong mô tả sản phẩm hoặc chính sách của shop\""
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "mismatch"
    quote: "e) Không đền bù, trả lại tiền hoặc đổi lại sản phẩm, hàng hóa, dịch vụ cho người tiêu dùng do sản phẩm, hàng hóa, dịch vụ không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam kết của tổ chức, cá nhân kinh doanh;"
    note: "Luật cấm không đền bù/hoàn tiền/đổi hàng khi hàng không đúng \"quảng cáo, giới thiệu, giao kết, cam kết\", không giới hạn ở mô tả sản phẩm hoặc chính sách. Luật TMĐT Điều 24 khoản 4 cấm người livestream \"cung cấp thông tin gian dối hoặc gây nhầm lẫn về công dụng, xuất xứ, chất lượng, giá cả, chính sách khuyến mại, bảo hành\" (đọc từ ảnh trang 18). Lời nói/quảng cáo trên livestream có thể là căn cứ pháp lý; khuyên chụp màn hình có ngày giờ là đúng, nhưng câu \"chỉ thành nghĩa vụ khi ghi trong mô tả\" sai/làm nhẹ quyền người đọc."
  - text: "Bẫy 3: \"Sàn không chịu trách nhiệm thay người bán trong mọi trường hợp... đòi được tiền vẫn phải qua người bán trước. Sàn là bên cung cấp thông tin và công cụ, không phải bên bán\" (Điều 17)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "mismatch"
    quote: "2. Chủ quản nền tảng thương mại điện tử trung gian có chức năng đặt hàng trực tuyến thực hiện các trách nhiệm sau đây:\nb) Tiếp nhận lại hàng hóa đối với trường hợp hàng hóa do người bán cung cấp không theo đúng nội dung đã thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam kết trên nền tảng. Việc xử lý hàng hóa bị hoàn trả thực hiện theo quy định của pháp luật về dân sự;\nk) Chịu trách nhiệm bồi thường thiệt hại hoặc liên đới chịu trách nhiệm bồi thường thiệt hại trong trường hợp không thực hiện hoặc thực hiện không đầy đủ các quy định tại Điều này dẫn đến thiệt hại cho người mua. Việc bồi thường thiệt hại thực hiện theo quy định của pháp luật về dân sự và quy định khác của pháp luật có liên quan."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 11-12. Với sàn trung gian có chức năng đặt hàng trực tuyến, luật bắt sàn \"tiếp nhận lại hàng hóa\" không đúng nội dung đã công bố/quảng cáo/cam kết, và \"chịu trách nhiệm bồi thường thiệt hại hoặc liên đới chịu trách nhiệm bồi thường\" nếu không thực hiện đầy đủ Điều 17 dẫn đến thiệt hại cho người mua. Nên câu \"vẫn phải qua người bán trước\" không đúng với loại sàn này. Phần \"Điều 17 đặt nghĩa vụ lên sàn\" thì đúng."
  - text: "Luật TMĐT 122/2025/QH15 có hiệu lực 1/7/2026 (legal_refs effective_from)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat122.2025.qh15.pdf"
    verdict: "match"
    quote: "Điều 40. Hiệu lực thi hành\nLuật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026."
    note: "Đọc từ ảnh trang PDF ký số (bản quét, không có lớp chữ; OCR đối chiếu với ảnh trang, đã sửa dấu). Trang 28. Quốc hội thông qua ngày 10/12/2025 (đọc từ phần cuối văn bản)."
  - text: "Bẫy 1: \"Đánh giá thật thường nằm ở nhóm 2–3 sao và ở phần bình luận có ảnh\"; step đọc 10 đánh giá xấu nhất"
    source_url: "https://moit.gov.vn/upload/2005517/fck/files/Luat_BVQLNTD_2023_a41f1.pdf"
    verdict: "inference"
    note: "Lời khuyên thực hành không có nguồn; \"đánh giá thật thường nằm ở nhóm 2–3 sao\" là khẳng định thực nghiệm chưa có số liệu (Evidence C đã tính đến). Không gây hại."
internal_checks:
  - issue: "Bẫy 2 (livestream chỉ thành nghĩa vụ khi ghi trong mô tả) trái với Luật BVQLNTD Điều 10 khoản 1 điểm e (quảng cáo, giới thiệu, cam kết) và Luật TMĐT Điều 24 khoản 4."
    severity: "error"
  - issue: "Bẫy 3 (\"vẫn phải qua người bán trước\", sàn \"không phải bên bán\") trái Luật TMĐT Điều 17 khoản 2 điểm b và k. Đồng thời mâu thuẫn với chính mục 30 cùng chương, nơi Điều 17 là nền cho yêu cầu nền tảng; mục 29 và 30 cần nhất quán về trách nhiệm của sàn."
    severity: "error"
  - issue: "legal_refs[4] (Điều 17 khoản 2 điểm h) bỏ điều kiện áp dụng \"có chức năng đặt hàng trực tuyến\" nên khái quát cho mọi nền tảng."
    severity: "warn"
  - issue: "legal_refs thiếu article/URL chính xác cho các ý \"đền gấp ba\" và \"trần đặt cọc 20%\" (khẳng định phủ định không có nguồn); tldr \"Luật Việt Nam không có mức đền gấp ba\" là khẳng định phủ định."
    severity: "warn"
  - issue: "Các legal_refs[].url: Luật BVQLNTD (moit.gov.vn) và Luật TMĐT (datafiles.chinhphu.vn) đều đúng văn bản (đã mở, 46 và 28 trang). Số khoản/điểm khớp (Điều 10 k1 a, k3 c; Điều 21 k1 c; Điều 6 k1; Điều 17 k2 h)."
    severity: "warn"
  - issue: "Không có số liệu nào (tiền/ngày/tỷ lệ) trong tldr/steps ngoài \"10 đánh giá\", \"2–3 sao\" (hướng dẫn thực hành, có trong thân)."
    severity: "warn"
validity:
  doc: "Luật Bảo vệ quyền lợi người tiêu dùng 19/2023/QH15; Luật Thương mại điện tử 122/2025/QH15"
  in_force: true
  effective_from: "2026-07-01"
  amended_by: []
  basis: "Luật TMĐT: Điều 40 \"có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026\" (bản ký đọc từ ảnh), thông qua 10/12/2025, nên đang có hiệu lực tại 8/11/2026. Luật BVQLNTD 19/2023: Điều 79 hiệu lực 01/7/2024 (đọc từ bản ký); Luật TMĐT 2025 (ban hành sau) viện dẫn pháp luật BVQLNTD như đang hiện hành (Điều 17 khoản 1 điểm b, Điều 17 khoản 3); tìm kiếm tháng 11/2026 trên thuvienphapluat.vn và vplsdms.vn (nguồn thứ cấp) ghi chưa có luật sửa đổi và còn hiệu lực. Luật BVQLNTD còn hiệu lực: bằng chứng gián tiếp, mức độ cao."
deliberate_vn_deviation: []
potential_harm:
  - "Bẫy 2: người đọc có thể hiểu lời hứa bảo hành/đổi trả nói trên livestream không có giá trị pháp lý nên bỏ không đòi, trong khi luật cấm không đền bù/hoàn tiền/đổi hàng khi hàng không đúng quảng cáo, giới thiệu, cam kết. Rủi ro làm người dùng từ bỏ quyền (không phải hại sức khỏe)."
  - "Bẫy 3: người đọc có thể tin rằng sàn có chức năng đặt hàng (Shopee, TikTok Shop...) không phải nhận lại hàng và không chịu trách nhiệm bồi thường, nên không yêu cầu sàn xử lý/hoàn trả theo Điều 17 khoản 2 điểm b, k; làm chậm hoặc mất cơ hội đòi quyền lợi."
suggested_edits:
  - "Ghi chú Bẫy 2: thay bằng \"Lời nói trên livestream có thể là quảng cáo, giới thiệu hoặc cam kết của người bán. Luật cấm bán hàng không đúng quảng cáo, giới thiệu, cam kết mà không đền bù, trả lại tiền hoặc đổi lại hàng (Luật BVQLNTD Điều 10 khoản 1 điểm e); người livestream không được đưa thông tin gian dối về chính sách bảo hành (Luật TMĐT Điều 24 khoản 4). Chụp màn hình có ngày giờ để có bằng chứng\" (quote: Điều 10 khoản 1 điểm e; Điều 24 khoản 4)."
  - "Ghi chú Bẫy 3: bỏ \"đòi được tiền vẫn phải qua người bán trước\" và \"không phải bên bán\"; viết \"Sàn trung gian có chức năng đặt hàng trực tuyến phải tiếp nhận lại hàng không đúng nội dung đã công bố, quảng cáo, cam kết, và phải bồi thường hoặc liên đới bồi thường nếu không thực hiện đầy đủ nghĩa vụ gây thiệt hại cho người mua (Luật TMĐT Điều 17 khoản 2 điểm b, k). Sàn không phải người bán, nhưng đừng bỏ qua yêu cầu sàn xử lý\" (quote: Điều 17 khoản 2 điểm b, k)."
  - "Pháp luật VN, dòng Điều 17 khoản 2 điểm h: thêm \"Nền tảng thương mại điện tử trung gian có chức năng đặt hàng trực tuyến phải...\"."

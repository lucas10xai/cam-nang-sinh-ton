  - "Bẫy 2 'Xe máy điện cũng thuộc diện bắt buộc': thêm legal_ref cho điều khoản nêu nghĩa vụ mua (Luật Kinh doanh bảo hiểm 08/2022/QH15) hoặc diễn đạt theo Điều 6/Phụ lục I."

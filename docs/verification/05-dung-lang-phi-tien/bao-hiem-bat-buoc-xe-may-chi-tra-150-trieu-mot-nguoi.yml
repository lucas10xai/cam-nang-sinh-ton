    severity: warn
  - issue: "(d)(e) Cả 3 legal_refs[].url đều là ND 67/2023/NĐ-CP (đúng văn bản); article khớp: Điều 6, Điều 7 khoản 2, Điều 8 và Phụ lục I. Nhưng bảng phí trong Phụ lục I, không phải Điều 8 (Điều 8 chỉ dẫn tới Phụ lục I và quy định tăng/giảm phí tối đa 15% theo lịch sử bồi thường), mục chưa nhắc tăng/giảm phí. Không phải lỗi."
    severity: warn
  - issue: "(b) Mục nói 'Hạn mức đã tính' nhưng không nêu VAT; so sánh số 60.000 với 150 triệu bỏ qua VAT (xem claim 4)."
    severity: warn
  - issue: "(f) Không có mục nào khác trong lượt này nói khác về bảo hiểm xe máy."

claims:
  - text: "Không có khoản giảm trừ nào cho đóng bảo hiểm hưu trí tự nguyện hay quỹ hưu trí (Điều 11, Luật TNCN 109/2025/QH15); tiền đóng bảo hiểm hưu trí tự nguyện không được giảm trừ thuế (tldr, tiêu đề)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "2. Thu nhập tính thuế đối với thu nhập từ tiền lương, tiền công là tổng thu nhập chịu thuế quy định tại khoản 2 Điều 3 của Luật này mà người nộp thuế nhận được trong kỳ tính thuế, trừ (-) đi các khoản đóng góp bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp, bảo hiểm trách nhiệm nghề nghiệp đối với một số ngành, nghề phải tham gia bảo hiểm bắt buộc, khoản đóng góp tham gia bảo hiểm hưu trí bổ sung theo quy định của Luật Bảo hiểm xã hội, mua bảo hiểm hưu trí tự nguyện, bảo hiểm nhân thọ không vượt quá mức do Chính phủ quy định và các khoản giảm trừ quy định tại Điều 10 và Điều 11 của Luật này."
    verdict: mismatch
    note: "SAI NGHIÊM TRỌNG. Điều 8 khoản 2 (trang 8/15 của chính file mục dẫn, PDF ký ảnh quét, đọc bằng OCR Apple Vision từ ảnh trang và đối chiếu bằng mắt) cho trừ khoản 'mua bảo hiểm hưu trí tự nguyện' khi tính thu nhập tính thuế, 'không vượt quá mức do Chính phủ quy định'. Điều 11 chỉ liệt kê từ thiện/nhân đạo, y tế, giáo dục nên đúng là 'không có trong Điều 11', nhưng khoản trừ nằm ở Điều 8 khoản 2, mà mục không đọc. Chính Điều 8 khoản 2 là khoản mục cần để kết luận 'không có ưu đãi thuế'. Mức Chính phủ quy định: Nghị định 253/2026/NĐ-CP Điều 46 khoản 2 điểm a, tối đa 3 triệu đồng/người/tháng cho tổng khoản đóng hưu trí bổ sung, hưu trí tự nguyện và bảo hiểm nhân thọ (nguồn thứ cấp luatvietnam.vn 'Theo quy định tại điểm a khoản 2 Điều 46 Nghị định 253, tổng thu nhập từ tiền lương, tiền công được trừ đi tối đa không quá 03 triệu đồng/tháng...'; chưa mở bản ký NĐ 253 nên phần mức 3 triệu là match-secondary)."
  - text: "Giảm trừ gia cảnh 15,5 triệu đồng/tháng cho người nộp thuế và 6,2 triệu đồng/tháng cho mỗi người phụ thuộc (Điều 10)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "a) Mức giảm trừ đối với người nộp thuế là 15,5 triệu đồng/tháng (186 triệu đồng/năm); b) Mức giảm trừ đối với mỗi người phụ thuộc là 6,2 triệu đồng/tháng."
    verdict: match
    note: "Điều 10 khoản 1 (OCR trang 8, đối chiếu ảnh)."
  - text: "Biểu thuế 5 bậc, bậc đầu 5% cho phần đến 10 triệu đồng/tháng (Điều 9)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "Bậc 1 | Đến 120 | Đến 10 | 5; Bậc 2 | Trên 120 đến 360 | Trên 10 đến 30 | 10; Bậc 3 | Trên 360 đến 720 | Trên 30 đến 60 | 20; Bậc 4 | Trên 720 đến 1.200 | Trên 60 đến 100 | 30; Bậc 5 | Trên 1.200 | Trên 100 | 35"
    verdict: match
    note: "Điều 9 khoản 2, bảng thuế suất (cột năm, cột tháng, thuế suất %). Đã đọc ảnh trang 8."
  - text: "Thuế người không có người phụ thuộc: lương 15,5 triệu nộp 0 đồng; 20 triệu nộp 225.000 đồng; 25,5 triệu nộp 500.000 đồng; 30 triệu nộp 950.000 đồng"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat109-2025.pdf
    quote: "Bậc 1 ... Đến 10 ... 5; Bậc 2 ... Trên 10 đến 30 ... 10 (Điều 9); a) Mức giảm trừ đối với người nộp thuế là 15,5 triệu đồng/tháng (Điều 10)"
    verdict: partial
    note: "Tính lại: 20-15,5=4,5 triệu x5%=225.000; 25,5-15,5=10 triệu x5%=500.000; 30-15,5=14,5: 10x5%+4,5x10%=500.000+450.000=950.000. Số học đúng. Nhưng 'lương' ở đây phải là thu nhập chịu thuế sau khi trừ BHXH/BHYT/BHTN bắt buộc (Điều 8 khoản 2), mà mục bỏ qua; người đóng bảo hiểm bắt buộc thực nộp ít hơn. Các số này là minh họa thu nhập sau trừ bảo hiểm bắt buộc. Quan trọng hơn câu kết 'Mua sản phẩm hưu trí không làm giảm bốn con số đó' là SAI: theo Điều 8 khoản 2 và NĐ 253 Điều 46, khoản đóng được trừ tới 3 triệu/tháng (với lương 30 triệu, trừ 3 triệu làm 14,5 -> 11,5 triệu tính thuế: 500.000+150.000=650.000, giảm 300.000/tháng)."
  - text: "Thông tư 67/2023/TT-BTC nhắc 'nghiệp vụ bảo hiểm hưu trí' trong nhóm phải đánh giá khả năng tài chính người mua (Điều 30 khoản 2 điểm b)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf
    quote: "b) Bảng câu hỏi đánh giá khả năng tài chính của bên mua bảo hiểm (đối với sản phẩm thuộc nghiệp vụ bảo hiểm hỗn hợp, sản phẩm bảo hiểm thuộc nghiệp vụ bảo hiểm liên kết đầu tư và nghiệp vụ bảo hiểm hưu trí)"
    verdict: match
    note: "Điều 30 khoản 2 điểm b (OCR trang 28 của 275, PDF ký quét ảnh, trang đầu ghi ký 01.12.2023, TT ban hành 02/11/2023). OCR có lỗi dấu nhỏ nhưng nội dung khớp. Chưa xác nhận hiệu lực/sửa đổi sau 2023."
  - text: "Hợp đồng trên một năm phải có tài liệu minh họa nêu rõ giá trị hoàn lại và quyền lợi nào có đảm bảo, quyền lợi nào không (Điều 29 khoản 1 điểm b)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2023/12/67-btc.signed.pdf
    quote: "b) Đối với những sản phẩm có giá trị hoàn lại, tài liệu minh họa bán hàng phải nêu rõ điều kiện để được nhận giá trị hoàn lại theo quy tắc, điều khoản sản phẩm bảo hiểm và những quyền lợi, kèm theo số tiền cụ thể mà bên mua bảo hiểm được hưởng khi nhận giá trị hoàn lại, nêu rõ những quyền lợi này là có đảm bảo hay không có đảm bảo;"
    verdict: partial
    note: "Điều 29 là 'Tài liệu minh hoạ bán hàng của sản phẩm bảo hiểm nhân thọ'. Điểm b áp dụng cho 'những sản phẩm có giá trị hoàn lại', không có điều kiện 'hợp đồng trên một năm' (cụm '01 năm' thuộc điểm d, về cảnh báo cam kết dài hạn). Sản phẩm bảo hiểm hưu trí lại theo khoản 2: 'thực hiện theo mẫu số 24-NT Phụ lục VIII', nên điểm b không phải điều khoản trực tiếp cho tài liệu minh họa hưu trí. Mục đọc sai điều kiện kích hoạt."
  - text: "Thông tư 67/2023/TT-BTC vẫn còn hiệu lực, sản phẩm vẫn hợp pháp"
    source_url: https://congbao.chinhphu.vn/van-ban/thong-tu-so-67-2023-tt-btc-40528/47265.htm

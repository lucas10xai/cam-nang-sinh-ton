suggested_edits:
  - "tldr, steps 2 và Bẫy 3: bỏ 'Yêu cầu này làm được ngay từ tổng đài' và câu 'Điều 11 khoản 1 điểm a cho phép yêu cầu phong tỏa ngay từ tổng đài'. Thay bằng 'Điều 11 khoản 1 điểm a cho phép phong tỏa tài khoản theo yêu cầu của chủ tài khoản; hỏi ngân hàng của bạn xem hotline có nhận yêu cầu này không, và nếu không thì khóa tạm thẻ/ứng dụng qua hotline trước'. Cần xác nhận kênh với từng ngân hàng."
  - "Steps 1 và 5: gắn nhãn 'thực hành khuyến nghị, không có điều luật quy định' hoặc dẫn hướng dẫn chính thức của nhà mạng; sửa Ghi chú 'từng bước đều đứng trên câu chữ' thành chỉ nói phần phong tỏa (Điều 11) và giấy tờ (Điều 17)."
  - "Pháp luật VN, đoạn 'Vì sao phải làm nhanh': bỏ hoặc gắn nhãn suy ra; nêu rõ Điều 291 là tội của người thu thập từ 20 tài khoản trở lên hoặc thu lợi từ 20 triệu, không chứng minh tốc độ ra tay."
  - "Bullet Điều 29 khoản 1: bỏ 'giữ kín mã và báo mất', chỉ nói nghĩa vụ tuân thủ biện pháp an toàn theo hướng dẫn của tổ chức cung ứng dịch vụ."

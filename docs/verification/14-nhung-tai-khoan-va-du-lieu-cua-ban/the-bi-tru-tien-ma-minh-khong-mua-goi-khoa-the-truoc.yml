suggested_edits:
  - "Chi phí và Pháp luật VN (Điều 19 khoản 2 điểm d): ghi 'tối đa 30 ngày làm việc với thẻ có BIN do Ngân hàng Nhà nước cấp, hạn cụ thể ghi trong hợp đồng; thẻ quốc tế do hợp đồng quy định. Hết hạn mà chưa xác định được lỗi, ngân hàng có 15 ngày làm việc để thỏa thuận hoặc tạm bồi hoàn (Điều 19 khoản 3 điểm b)'."

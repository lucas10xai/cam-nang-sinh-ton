suggested_edits:
  - "Mục 'Đăng ký SIM': sửa bullet 1 và 2 thành 'Với số thuê bao di động trả trước, ba số đầu của mỗi mạng...' (thêm 'trả trước'); sửa bullet 3 thành 'SIM thuê bao di động giao tiếp người-người (H2H) thứ hai trở đi' (dựa vào quote Điều 18.2.b)."
  - "Bỏ hoặc gắn nhãn 'suy ra, không phải chữ của nghị định' cho đoạn 'Chỉ cần một lần đọc được tin nhắn... Mỗi SIM mở thêm là một số...'; nêu thêm rằng nhà mạng còn phải khớp 03 trường với CSDL dân cư và video call (Điều 18.2.a, c)."
  - "Bẫy 3: bỏ câu 'Các con số về số thuê bao mỗi người trong bài cũ không còn đúng' hoặc đối chiếu NĐ 49/2017 và nêu số cụ thể trước/sau."
  - "Bẫy 2 / tldr: thay 'Nhập sai ba lần' bằng 'nhập sai quá số lần cho phép (thường 3 lần, tùy nhà mạng)' hoặc dẫn hướng dẫn nhà mạng; gắn nhãn 'khuyến nghị kỹ thuật' cho 'sáu số' và 'nửa phút'."

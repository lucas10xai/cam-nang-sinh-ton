  - text: "Dưới cả hai ngưỡng (loại B) thì chỉ cần mã OTP"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-25-vbhn-nhnn-469216.htm
    quote: "Giao dịch loại B: - SMS OTP hoặc Voice OTP hoặc Email OTP; - Hoặc Thẻ ma trận OTP; - Hoặc Soft OTP/ Token OTP loại cơ bản hoặc nâng cao; - Hoặc hai kênh; - Hoặc khớp đúng thông tin sinh trắc học thiết bị(1); - Hoặc FIDO; - Hoặc chữ ký điện tử an toàn."

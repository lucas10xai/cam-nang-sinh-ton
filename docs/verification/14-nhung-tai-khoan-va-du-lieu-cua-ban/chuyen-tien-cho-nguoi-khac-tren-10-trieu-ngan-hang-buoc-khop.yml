  - text: "Chuyển tiền giữa tài khoản/thẻ/ví của người khác nhau là loại B khi từng lệnh không quá 10 triệu và tổng trong ngày không quá 20 triệu; vượt một trong hai thì loại C (Phụ lục 01 nhóm I.3)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-25-vbhn-nhnn-469216.htm
    quote: "(i) G ≤ 10 triệu VND. (ii) G + Tksth ≤ 20 triệu VND. [loại B] ... Giao dịch thỏa mãn một trong các trường hợp sau: 1. Trường hợp 1: Giao dịch thỏa mãn các điều kiện: (i) G ≤ 10 triệu VND. (ii) G + Tksth > 20 triệu VND. (iii) G + T ≤ 1,5 tỷ VND. 2. Trường hợp 2: Giao dịch thỏa mãn các điều kiện: (i) G > 10 triệu VND. (ii) G ≤ 500 triệu VND. (iii) G + T ≤ 1,5 tỷ VND. [loại C]"
    verdict: partial
    note: "Bảng PDF đọc từ ảnh trang 79 Công báo 206 (nhóm I.3, cột B và C). Ngưỡng 10 triệu/20 triệu đúng. Thiếu điều kiện: (1) Tksth = tổng giá trị các giao dịch loại A, B (và C2 của tổ chức) đã thực hiện của một tài khoản/thẻ/ví trong nhóm loại hình giao dịch, KHÔNG gồm giao dịch chủ động trích nợ, và 'được tính giá trị bằng 0 tại thời điểm đầu ngày hoặc ngay sau khi khách hàng có phát sinh giao dịch trong ngày sử dụng hình thức xác nhận cho giao dịch loại C hoặc loại D' (tức bộ đếm 20 triệu về 0 sau mỗi lần đã xác nhận bằng sinh trắc học: không phải tổng cả ngày). (2) Loại C chỉ tới G ≤ 500 triệu (và G+T ≤ 1,5 tỷ); G > 500 triệu là loại D (trường hợp 3)."
  - text: "Khi tổng giá trị vượt 1,5 tỷ đồng thì lên loại D, cũng buộc khớp khuôn mặt, chỉ khác OTP phải là loại nâng cao, FIDO hoặc chữ ký điện tử an toàn"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-25-vbhn-nhnn-469216.htm
    quote: "Giao dịch loại D: Soft OTP/Token OTP loại nâng cao hoặc FIDO hoặc chữ ký điện tử an toàn, - Và kết hợp khớp đúng thông tin sinh trắc học."
    verdict: partial
    note: "Đúng mục D (cá nhân), nhưng điều kiện lên loại D chưa đủ: Phụ lục 01 nhóm I.3 còn loại D khi 'Trường hợp 3: G > 500 triệu VND' (một lệnh trên 500 triệu), và khi 1 lệnh ≤ 10 triệu/≤ 500 triệu nhưng G + T > 1,5 tỷ. Bản soạn chỉ nêu '1,5 tỷ'."
  - text: "Khách hàng cá nhân, giao dịch loại C: OTP gửi qua SMS hoặc Voice, hoặc Soft OTP, kết hợp khớp đúng thông tin sinh trắc học (Phụ lục 02)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-25-vbhn-nhnn-469216.htm
    quote: "Giao dịch loại C: - OTP gửi qua SMS/Voice hoặc Soft OTP/Token OTP loại cơ bản. - Và kết hợp khớp đúng thông tin sinh trắc học."
    verdict: match

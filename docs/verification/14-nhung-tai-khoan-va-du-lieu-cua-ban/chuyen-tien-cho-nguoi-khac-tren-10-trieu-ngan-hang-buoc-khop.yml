suggested_edits:
  - "Bỏ steps[1] và câu 'Nếu từ chối quét: một chuyến ra quầy...' ở Chi phí, hoặc đổi thành: 'Nếu không quét được, hỏi ngân hàng cách xác thực khác; pháp luật chưa buộc ngân hàng phải có (Điều 10 khoản 4 chỉ riêng người khuyết tật)'. Dựa vào quote Điều 10 khoản 4 và nhận định 'Chỗ còn treo' của chính mục."
  - "tldr, steps[0], Nói dễ hiểu: đổi 'tổng các lệnh trong ngày trên 20 triệu' thành 'tổng các lệnh nhỏ đã làm (chưa tính từ lần xác nhận sinh trắc học gần nhất trong ngày) cộng lệnh này trên 20 triệu'. Căn cứ Ghi chú Tksth ở Phụ lục 01."
  - "Pháp luật VN, gạch loại D: sửa thành 'Lên loại D khi một lệnh trên 500 triệu đồng, hoặc khi tổng giá trị trong ngày (G + T) vượt 1,5 tỷ đồng' (Phụ lục 01 nhóm I.3, trường hợp 1-3)."
  - "Gạch ISO 30107: thêm 'hoặc tương đương' và dẫn 'phát hiện giả mạo dựa trên NIST SP 800-63B, ISO 30107 hoặc FIDO'; gạch khóa chức năng: thêm 'ngân hàng phải kiểm tra khách hàng trước khi mở khóa'."
  - "Thêm legal_refs: Điều 8 khoản 6 TT 50 (kiểm tra khi truy cập lần đầu/thiết bị khác); ghi mốc áp dụng Phụ lục mới 01/07/2026 theo khoản 2 Điều 12 TT 77/2025; điền effective_from."
  - "Chỗ 'phải khớp khuôn mặt': ghi 'khớp thông tin sinh trắc học (thường là khuôn mặt)'."

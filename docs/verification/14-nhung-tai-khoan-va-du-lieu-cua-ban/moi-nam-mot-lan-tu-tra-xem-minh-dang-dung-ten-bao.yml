claims:
  - text: "Khi tự kiểm tra thấy thông tin không đúng, có quyền yêu cầu doanh nghiệp cập nhật lại thông tin thuê bao (Điều 24 khoản 4)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Yêu cầu doanh nghiệp viễn thông cập nhật lại thông tin thuê bao của mình theo quy định khi có thay đổi giấy tờ tùy thân đã xuất trình khi giao kết hợp đồng hoặc khi tự kiểm tra thông tin thuê bao của mình, phát hiện thông tin thuê bao của mình không đúng hoặc khi nhận được thông báo của doanh nghiệp cung cấp dịch vụ viễn thông di động mặt đất về thông tin thuê bao không đúng quy định."
    verdict: match
    note: "Công báo số 31+32 (09/01/2025). Đối chiếu thêm bản hợp nhất 19/2026/VBHN-NĐ-BKHCN (07/9/2026, bản đăng luatvietnam.vn): Điều 24 giữ nguyên."
  - text: "Quyền yêu cầu doanh nghiệp chấm dứt hợp đồng đối với các số dùng thông tin trên giấy tờ tùy thân của mình (Điều 24 khoản 5)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Yêu cầu doanh nghiệp cung cấp dịch vụ viễn thông di động mặt đất chấm dứt hợp đồng theo mẫu, điều kiện giao dịch chung đối với các số thuê bao sử dụng thông tin trên giấy tờ tùy thân hoặc giấy tờ tổ chức của mình."
    verdict: match
    note: ""
  - text: "Đăng ký trực tuyến chỉ được 03 số thuê bao đầu tiên trên một giấy tờ (Điều 16 khoản 3)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Việc đăng ký thông tin thuê bao theo hình thức trực tuyến chỉ áp dụng đối với 03 số thuê bao đầu tiên trên 01 giấy tờ quy định tại Điều 17 Nghị định này."
    verdict: match
    note: "Cùng khoản: hình thức trực tuyến là 'thông qua sử dụng ứng dụng của chính doanh nghiệp'; ứng dụng không xác thực được thì phải đăng ký trực tiếp."
  - text: "Từ số thứ tư trở lên phải giao kết hợp đồng tại điểm có địa chỉ xác định do chính doanh nghiệp thiết lập (Điều 21 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Đối với số thuê bao thứ tư trở lên, thực hiện giao kết hợp đồng theo mẫu với doanh nghiệp cung cấp dịch vụ viễn thông di động mặt đất tại điểm có địa chỉ xác định do chính doanh nghiệp cung cấp dịch vụ viễn thông di động mặt đất thiết lập."
    verdict: match
    note: "Điều 21 áp dụng cho 'số thuê bao di động trả trước của mỗi mạng viễn thông di động'."
  - text: "Kích hoạt SIM thứ hai trở đi phải xác thực bằng mã OTP gửi tới SIM đăng ký trước đó (Điều 18 khoản 2 điểm b)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "b) Khi đăng ký, kích hoạt từ SIM thuê bao di động H2H thứ hai trở đi phải xác thực thông qua mã xác thực một lần (mã OTP) gửi đến SIM đăng ký, kích hoạt trước đó;"
    verdict: partial
    note: "Nguồn chỉ nói 'SIM thuê bao di động H2H' (người-người); bản soạn bỏ giới hạn. Vế 'nên việc kích hoạt số đứng tên bạn thường cần mã xác thực mà bạn nhận được' là suy luận. Không dùng cho hành động nào trong steps."
  - text: "Doanh nghiệp phải lưu cả số lượng số thuê bao mà một cá nhân đang sử dụng (Điều 22 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "số lượng số thuê bao mà cá nhân, tổ chức đang sử dụng;"
    verdict: match
    note: "Điều 22 khoản 2: doanh nghiệp 'xây dựng hệ thống kỹ thuật, cơ sở dữ liệu thông tin thuê bao tập trung để nhập, lưu giữ, quản lý thông tin'."
  - text: "Nghị định 49/2017/NĐ-CP đã bị bãi bỏ (Điều 84 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Bãi bỏ Nghị định số 25/2011/NĐ-CP ngày 06 tháng 4 năm 2011 của Chính phủ ... Nghị định số 49/2017/NĐ-CP ngày 24 tháng 4 năm 2017 của Chính phủ sửa đổi, bổ sung Điều 15 của Nghị định số 25/2011/NĐ-CP"
    verdict: match
    note: "Điều 84 khoản 2 (cùng bãi bỏ NĐ 25/2011, 81/2016). Câu 'một người được mấy số trả lời theo Nghị định 163' đúng ở chỗ 03 số/giấy tờ cho đăng ký trực tuyến; NĐ 163 không đặt trần tổng số."
  - text: "Bẫy 1: Khoản 2 Điều 24 chỉ cho phép đăng ký cho chính mình, con đẻ hoặc con nuôi dưới 15 tuổi và người thuộc quyền giám hộ"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Cá nhân chỉ thực hiện giao kết hợp đồng theo mẫu, điều kiện giao dịch chung sử dụng các số thuê bao cho bản thân mình, con đẻ hoặc con nuôi dưới 15 tuổi và những người thuộc quyền giám hộ của mình theo quy định của pháp luật; cho các thiết bị dùng cho bản thân mình hoặc gia đình mình."
    verdict: partial
    note: "Thiếu vế 'cho các thiết bị dùng cho bản thân mình hoặc gia đình mình'. Điều 24 khoản 2 không được liệt kê trong legal_refs của mục này (chỉ có mục 12 dẫn)."
  - text: "Bẫy 2: không làm giấy yêu cầu chấm dứt, 'hợp đồng vẫn treo và trách nhiệm pháp lý với số đó vẫn mang tên mình'"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Chịu hoàn toàn trách nhiệm trước pháp luật trong việc sử dụng các số thuê bao đã được cung cấp."
    verdict: inference
    note: "Điều 24 khoản 1 và 3: thuê bao chịu trách nhiệm về giấy tờ và việc sử dụng số. Suy ra 'vẫn mang tên mình nếu chưa chấm dứt' hợp lý nhưng không phải chữ trực tiếp. Phần 'ra quầy ký giấy đề nghị chấm dứt hợp đồng, đừng chỉ nhắn tổng đài' (steps[2]) không có điều khoản nào quy định hình thức yêu cầu; Điều 25 khoản 7 chỉ nói 'Khi nhận được yêu cầu ... phải xác minh, thông báo tới thuê bao phải cập nhật lại thông tin..., thông báo kết quả'."
  - text: "steps[0]: 'mở app của từng nhà mạng, đăng nhập bằng chính số đang dùng và tra' (cách tự tra)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Triển khai, hướng dẫn để cá nhân, tổ chức tự kiểm tra được thông tin thuê bao di động mặt đất của mình trên ứng dụng của doanh nghiệp viễn thông hoặc nhắn tin theo cú pháp “TTTB” kết hợp với “Số giấy tờ tùy thân” gửi 1414, gửi lại bản tin thông báo cho cá nhân, tổ chức biết tối thiểu các thông tin sau: họ tên; ngày sinh; danh sách toàn bộ các số thuê bao mà cá nhân đang sử dụng (đối với thuê bao là cá nhân)"
    verdict: partial
    note: "Nguồn (Điều 25 khoản 5, không được dẫn trong legal_refs) cho hai cách tự tra: app nhà mạng HOẶC nhắn 'TTTB <số giấy tờ>' gửi 1414; mục chỉ nêu app và còn viết 'không gửi ảnh căn cước hay OTP cho dịch vụ kiểm tra SIM rác'. 'Đăng nhập bằng chính số đang dùng' không có trong nguồn: nguồn không nêu cách đăng nhập. Cú pháp 1414 là chữ của Nghị định, chưa kiểm xem nhà mạng còn vận hành không."
  - text: "Mỗi năm một lần (tần suất tự tra)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/12/43647/53840-1-202531-32163-2024-nd-cp.pdf
    quote: "Thường xuyên rà soát, khi phát hiện hoặc khi nhận được văn bản thông báo của cơ quan quản lý nhà nước về thuê bao có thông tin thuê bao không đúng quy định"
    verdict: not-found
    note: "Không có nguồn nào ghi 'mỗi năm một lần'; đây là khuyến nghị của biên tập. Nghị định chỉ quy định trách nhiệm 'thường xuyên rà soát' của doanh nghiệp."

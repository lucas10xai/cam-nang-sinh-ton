claims:
  - text: "Sự đồng ý chỉ có hiệu lực khi dựa trên sự tự nguyện và khi biết rõ loại dữ liệu, mục đích xử lý, bên kiểm soát, quyền và nghĩa vụ (Điều 9 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Sự đồng ý của chủ thể dữ liệu cá nhân chỉ có hiệu lực khi dựa trên sự tự nguyện và biết rõ các thông tin sau đây: a) Loại dữ liệu cá nhân được xử lý, mục đích xử lý dữ liệu cá nhân; b) Bên kiểm soát dữ liệu cá nhân hoặc bên kiểm soát và xử lý dữ liệu cá nhân; c) Các quyền, nghĩa vụ của chủ thể dữ liệu cá nhân."
    verdict: match
    note: "Công báo số 971+972 (24/7/2025), PDF có lớp chữ."
  - text: "Sự đồng ý phải thể hiện bằng phương thức rõ ràng, cụ thể, có thể in và sao chép bằng văn bản (Điều 9 khoản 3)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Sự đồng ý của chủ thể dữ liệu cá nhân được thể hiện bằng phương thức rõ ràng, cụ thể, có thể in, sao chép bằng văn bản, bao gồm cả dưới dạng điện tử hoặc định dạng kiểm chứng được."
    verdict: match
    note: "Bản soạn lược cụm 'bao gồm cả dưới dạng điện tử...'; không làm sai ý."
  - text: "Sự đồng ý phải thể hiện đối với từng mục đích (Điều 9 khoản 4 điểm a)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "a) Thể hiện sự đồng ý đối với từng mục đích;"
    verdict: match
    note: ""
  - text: "Cấm kèm điều kiện bắt buộc phải đồng ý với các mục đích khác nội dung thỏa thuận (Điều 9 khoản 4 điểm b)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "b) Không được kèm theo điều kiện bắt buộc phải đồng ý với các mục đích khác với nội dung thỏa thuận;"
    verdict: match
    note: ""
  - text: "Sự im lặng hoặc không phản hồi không được coi là sự đồng ý (Điều 9 khoản 4 điểm d)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "d) Sự im lặng hoặc không phản hồi không được coi là sự đồng ý."
    verdict: match
    note: ""
  - text: "Bẫy 3: sự đồng ý cũ có hiệu lực cho tới khi bạn thay đổi nó (Điều 9 khoản 4 điểm c)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "c) Sự đồng ý có hiệu lực cho đến khi chủ thể dữ liệu cá nhân thay đổi sự đồng ý đó hoặc theo quy định của pháp luật;"
    verdict: partial
    note: "Điều luật đúng, nhưng thiếu 'hoặc theo quy định của pháp luật'. Câu đặt trong ngữ cảnh 'sau khi họ đã đổi mục đích' dễ khiến người đọc hiểu sự đồng ý cũ phủ cả mục đích mới; trong khi điểm a buộc đồng ý theo từng mục đích. Cần nói rõ: mục đích mới cần sự đồng ý mới."
  - text: "Bên kiểm soát phải lưu trữ sự đồng ý; khi tranh chấp phải chứng minh (NĐ 356 Điều 6 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "Bên kiểm soát dữ liệu, bên kiểm soát và xử lý dữ liệu cá nhân phải lưu trữ sự đồng ý của chủ thể dữ liệu. Trong trường hợp có tranh chấp, trách nhiệm chứng minh sự đồng ý của chủ thể dữ liệu thuộc về bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân."
    verdict: match
    note: "Công báo số 18 (18/01/2026), PDF 2026_18_356/2025/NĐ-CP, trích được chữ."
  - text: "Cấm thiết lập phương thức mặc định đồng ý và chỉ dẫn không rõ ràng, gây hiểu lầm giữa đồng ý với không đồng ý (NĐ 356 Điều 6 khoản 3)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "không được thiết lập phương thức mặc định đồng ý hoặc tạo ra các chỉ dẫn không rõ ràng, gây hiểu lầm giữa đồng ý và không đồng ý cho chủ thể dữ liệu."
    verdict: match
    note: ""
  - text: "Khi xin đồng ý với dữ liệu nhạy cảm phải thông báo rõ (NĐ 356 Điều 6 khoản 4)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "Đối với việc xin sự đồng ý xử lý dữ liệu cá nhân nhạy cảm, chủ thể dữ liệu phải được thông báo rằng dữ liệu cần xử lý là dữ liệu cá nhân nhạy cảm."
    verdict: match
    note: ""
  - text: "Việc dùng dữ liệu khách hàng để kinh doanh dịch vụ quảng cáo bị giới hạn trong phạm vi được chuyển giao theo thỏa thuận, và phải bảo đảm quyền của chủ thể (Điều 28)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "chỉ được sử dụng dữ liệu cá nhân của khách hàng được bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân chuyển giao theo thỏa thuận hoặc thu thập qua hoạt động kinh doanh của mình để kinh doanh dịch vụ quảng cáo."
    verdict: partial
    note: "Thiếu vế 'hoặc thu thập qua hoạt động kinh doanh của mình'. Điều 28 khoản 3, 5, 8 (xử lý dữ liệu để quảng cáo phải được đồng ý; cho khách hàng cơ chế từ chối; có quyền yêu cầu ngừng nhận quảng cáo; quảng cáo theo hành vi chỉ thu thập khi có đồng ý) mới là phần sát nhất với việc 'bỏ chọn mục đích quảng cáo' nhưng không được dẫn."
  - text: "Điều 28 khoản 3: 'phải được sự đồng ý của khách hàng... cung cấp phương thức cho khách hàng để có thể từ chối nhận các thông tin quảng cáo' (khẳng định đề xuất, bản soạn chưa nêu)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Việc xử lý dữ liệu cá nhân của khách hàng để kinh doanh dịch vụ quảng cáo phải được sự đồng ý của khách hàng, trên cơ sở khách hàng biết rõ nội dung, phương thức, hình thức, tần suất giới thiệu sản phẩm; cung cấp phương thức cho khách hàng để có thể từ chối nhận các thông tin quảng cáo."
    verdict: match
    note: "Dùng làm căn cứ đề xuất sửa; không phải câu của bản soạn."
  - text: "Ghi chú: 'Nghị định cấm thẳng kiểu thiết lập mặc định đồng ý nên phần hướng dẫn đứng trên văn bản' và Bẫy 2 'đóng trang rồi coi như từ chối: không có bản ghi nào'"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "Các thiết lập mặc định sẵn có phải đảm bảo nguyên tắc bảo vệ dữ liệu cá nhân, tôn trọng các quyền của chủ thể dữ liệu cá nhân."
    verdict: inference
    note: "Phần 'đóng trang = không có bản ghi, không chứng minh được' là suy luận thực tế, không phải chữ của nguồn (luật còn đặt nghĩa vụ chứng minh lên bên kiểm soát, khoản 2). Bước 1 'chụp màn hình' là mẹo thực hành, nguồn không yêu cầu; nên gắn nhãn là lời khuyên."

  - text: "Nếu bạn bỏ số cũ mà không cập nhật: thông báo liên tục 5 ngày; tạm dừng một chiều sau 15 ngày kể từ ngày đầu thông báo; tạm dừng hai chiều sau 15 ngày nữa; thanh lý hợp đồng sau 5 ngày (Điều 25 NĐ 163)"

  - text: "Khi truy cập ứng dụng ngân hàng lần đầu hoặc trên thiết bị mới, bước kiểm tra khách hàng phải dùng SMS OTP/Voice OTP gửi tới số điện thoại đã đăng ký, hoặc Soft OTP/Token OTP (dẫn Điều 9 TT 50/2024)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-25-vbhn-nhnn-469216.htm
    quote: "Đối với khách hàng cá nhân, phải có chức năng kiểm tra khách hàng khi khách hàng truy cập lần đầu hoặc khi khách hàng truy cập trên thiết bị khác với thiết bị đã truy cập phần mềm ứng dụng Mobile Banking lần gần nhất. Việc kiểm tra khách hàng tối thiểu bao gồm: a) Khớp đúng SMS OTP hoặc Voice OTP thông qua số điện thoại đã được khách hàng đăng ký hoặc Soft OTP/Token OTP;"
    verdict: mismatch
    note: "Nội dung đúng nhưng nằm ở Điều 8 khoản 6 (Mobile Banking), KHÔNG phải Điều 9. Điều 9 là 'Truy cập phần mềm ứng dụng Online Banking' (đơn vị cấp tài khoản giao dịch điện tử; đăng nhập một lần). Bản soạn dẫn sai điều. Điều 8 khoản 6 còn có điểm b: khớp sinh trắc học nếu luật chuyên ngành đòi hỏi. Công báo số 206 (12/04/2026), VBHN 25/VBHN-NHNN."
  - text: "SMS OTP là hình thức xác nhận hợp lệ cho giao dịch loại B (Phụ lục 02)"

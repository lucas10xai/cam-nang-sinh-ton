  - "Gạch Nhà mạng thứ hai: bỏ 'Nếu bạn bỏ số cũ mà không cập nhật: thông báo liên tục 5 ngày; ...' (Điều 25 chỉ áp dụng khi thông tin thuê bao không đúng quy định). Thay bằng Điều 25 khoản 4: 'Số thuê bao đã bị thanh lý hợp đồng, chấm dứt cung cấp dịch vụ thì nhà mạng có quyền cấp cho người khác (trừ số đấu giá).' (dùng làm căn cứ Bẫy 1). Sửa legal_refs 'Điều 25' thành 'Điều 25 khoản 4'."
  - "Gạch Định danh điện tử: bỏ dẫn 'Điều 14 khoản 1 ... SMS'. Nếu giữ nội dung SMS, dẫn Điều 19 khoản 3 và chỉnh cho đúng nghĩa: 'Sự đồng ý của chủ thể danh tính điện tử cho một yêu cầu xác thực điện tử có thể thể hiện qua Ứng dụng định danh quốc gia, SMS qua số điện thoại chính chủ hoặc hình thức khác theo quy định.' Gạch 7 ngày: thêm 'là thời hạn kích hoạt tài khoản mới được cấp, không phải thời hạn đổi số'. Hoặc bỏ gạch này nếu không có cơ sở liên quan tới đổi số."
  - "steps[1]: giữ 'ngân hàng' (có căn cứ Điều 8 khoản 6 và Phụ lục 02); gắn nhãn 'lời khuyên' cho 'ví điện tử, VNeID' vì chưa có điều khoản dẫn; hoặc bổ sung nguồn thực hành (hướng dẫn của VNeID/ví)."
  - "Ghi chú: đổi 'trình tự suy ra trực tiếp từ văn bản' thành 'trình tự là lời khuyên rút ra từ quy định mã OTP gửi về số đã đăng ký (Điều 8 khoản 6, Điều 11, Phụ lục 02 TT 50) và việc nhà mạng có thể cấp lại số đã chấm dứt (Điều 25 khoản 4 NĐ 163)'."
  - "Chi phí: gắn nhãn 'ước lượng' cho 'vài chục nghìn' và 'một hai tháng' hoặc dẫn nguồn giá SIM."
  - "Điền effective_from cho 7 legal_refs: TT 50 '2025-01-01'; NĐ 163 '2024-12-24'; NĐ 69 '2024-07-01'."

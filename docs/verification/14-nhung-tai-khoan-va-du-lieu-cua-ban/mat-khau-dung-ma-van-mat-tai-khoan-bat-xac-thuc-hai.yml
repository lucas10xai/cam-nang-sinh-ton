  - "Ghi chú hoặc Lợi ích: gắn nhãn 'suy luận kỹ thuật' cho khuyến nghị xác nhận trên máy thay SMS, hoặc dẫn một nguồn quốc tế (CISA/NIST SP 800-63B) mô tả SMS là kênh yếu hơn; hiện không có nguồn."

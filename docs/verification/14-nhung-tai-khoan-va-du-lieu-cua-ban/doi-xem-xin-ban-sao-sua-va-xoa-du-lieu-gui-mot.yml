claims:
  - text: "Quyền xem, chỉnh sửa hoặc yêu cầu chỉnh sửa dữ liệu cá nhân (Điều 4 khoản 1 điểm c)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "c) Xem, chỉnh sửa hoặc yêu cầu chỉnh sửa dữ liệu cá nhân;"
    verdict: match
    note: "Công báo số 971+972."
  - text: "Quyền yêu cầu cung cấp, xóa, hạn chế xử lý, phản đối xử lý (Điều 4 khoản 1 điểm d)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "d) Yêu cầu cung cấp, xóa, hạn chế xử lý dữ liệu cá nhân; gửi yêu cầu phản đối xử lý dữ liệu cá nhân;"
    verdict: match
    note: ""
  - text: "Quyền khiếu nại, tố cáo, khởi kiện, bồi thường (Điều 4 khoản 1 điểm đ)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "đ) Khiếu nại, tố cáo, khởi kiện, yêu cầu bồi thường thiệt hại theo quy định của pháp luật;"
    verdict: match
    note: ""
  - text: "Cơ quan, tổ chức không được gây khó khăn, cản trở (Điều 4 khoản 4)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Cơ quan, tổ chức, cá nhân có trách nhiệm tạo điều kiện thuận lợi, không được gây khó khăn, cản trở việc thực hiện quyền và nghĩa vụ của chủ thể dữ liệu cá nhân theo quy định của pháp luật."
    verdict: match
    note: ""
  - text: "Yêu cầu rút lại sự đồng ý phải bằng văn bản, kể cả dạng điện tử, nên email là hình thức hợp lệ (Điều 10 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Yêu cầu rút lại sự đồng ý, yêu cầu hạn chế xử lý dữ liệu cá nhân của chủ thể dữ liệu cá nhân phải được thể hiện bằng văn bản, bao gồm cả dạng điện tử hoặc định dạng kiểm chứng được và được gửi cho bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân."
    verdict: partial
    note: "Điều 10 chỉ nói về yêu cầu RÚT LẠI ĐỒNG Ý / HẠN CHẾ XỬ LÝ, không phải yêu cầu xem/sao/sửa/xóa (các yêu cầu đó theo NĐ 356 Điều 5 khoản 1: 'theo quy trình, thủ tục, biểu mẫu' do bên kiểm soát xây dựng). 'Email là hình thức hợp lệ' là suy ra từ 'dạng điện tử', không phải chữ của luật; và còn 'theo thỏa thuận giữa các bên'."
  - text: "Bên kiểm soát phải chỉnh sửa khi chủ thể yêu cầu (Điều 13 khoản 1, 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân chỉnh sửa dữ liệu cá nhân sau khi chủ thể dữ liệu cá nhân yêu cầu hoặc chỉnh sửa dữ liệu cá nhân theo quy định của pháp luật;"
    verdict: match
    note: "Điều 13 khoản 1 còn cho tự chỉnh sửa 'đối với một số loại dữ liệu cá nhân theo thỏa thuận'."
  - text: "Khi không thể chỉnh sửa vì lý do chính đáng, phải thông báo (Điều 13 khoản 3)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Trường hợp không thể chỉnh sửa dữ liệu cá nhân vì lý do chính đáng, bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân phải thông báo để cơ quan, tổ chức, cá nhân yêu cầu biết."
    verdict: match
    note: ""
  - text: "Được xóa theo yêu cầu của chính bạn, với điều kiện chấp nhận rủi ro, thiệt hại và tuân thủ khoản 3 Điều 4 (Điều 14 khoản 1 điểm a)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "a) Chủ thể dữ liệu cá nhân có yêu cầu và chấp nhận các rủi ro, thiệt hại có thể xảy ra đối với mình. Yêu cầu của chủ thể dữ liệu cá nhân trong trường hợp này phải tuân thủ đầy đủ các nguyên tắc quy định tại khoản 3 Điều 4 của Luật này;"
    verdict: match
    note: ""
  - text: "Các trường hợp được từ chối xóa nằm ở Điều 19 (Điều 14 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Không thực hiện yêu cầu của chủ thể dữ liệu cá nhân về việc xóa, hủy dữ liệu cá nhân trong các trường hợp quy định tại Điều 19 của Luật này hoặc việc xóa, hủy dữ liệu cá nhân vi phạm quy định tại khoản 3 Điều 4 của Luật này."
    verdict: partial
    note: "Điều 19 là các trường hợp xử lý KHÔNG CẦN sự đồng ý. Ngoài ra khoản 2 còn một trường hợp từ chối thứ hai (xóa vi phạm Điều 4 khoản 3) bản soạn không nêu. 'Nghĩa vụ lưu trữ của luật chuyên ngành' trong Ghi chú không có trong nguồn dẫn: là suy luận (Điều 14 khoản 1 điểm c, e; Điều 19 khoản 1 điểm đ nói 'trường hợp khác theo quy định của pháp luật' nên hợp lý nhưng chưa phải chữ cụ thể về kế toán/ngân hàng/thuế)."
  - text: "Khi không thể xóa phải thông báo (Điều 14 khoản 5)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2025/6/45578/57730-1-2025971-97291-2025-qh15.pdf
    quote: "Trường hợp không thể xóa, hủy dữ liệu cá nhân vì lý do chính đáng sau khi nhận được yêu cầu của chủ thể dữ liệu cá nhân, bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân phải thông báo để chủ thể dữ liệu cá nhân biết."
    verdict: match
    note: ""
  - text: "Xem, cung cấp, chỉnh sửa: phản hồi trong 02 ngày làm việc; thực hiện trong 10 ngày, hoặc 15 ngày nếu phải yêu cầu bên thứ ba; gia hạn một lần không quá 10 ngày (NĐ 356 Điều 5 khoản 3)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "phải phản hồi trong thời hạn 02 ngày làm việc, cung cấp đầy đủ thông tin cho chủ thể dữ liệu cá nhân về thủ tục và thực hiện trong thời hạn 10 ngày. Trường hợp cần yêu cầu bên xử lý dữ liệu cá nhân, bên thứ ba chỉnh sửa dữ liệu cá nhân của chủ thể dữ liệu cá nhân thì thực hiện trong thời hạn 15 ngày."
    verdict: match
    note: "Công báo số 18/2026, PDF trích được chữ. Gia hạn: 'kéo dài thêm tối đa 01 lần gia hạn trong thời hạn không quá 10 ngày'. Lưu ý: 15 ngày áp dụng khi cần bên thứ ba CHỈNH SỬA; với yêu cầu xem/cung cấp qua bên thứ ba khoản 3 không nêu mốc riêng. Nguồn không nói '10 ngày' là ngày lịch hay ngày làm việc (chỉ '02 ngày làm việc' ghi rõ)."
  - text: "Xóa: phản hồi trong 02 ngày làm việc; thực hiện trong 20 ngày, hoặc 30 ngày nếu phải yêu cầu bên thứ ba; gia hạn một lần không quá 20 ngày (NĐ 356 Điều 5 khoản 4)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "phải phản hồi trong thời hạn 02 ngày làm việc, cung cấp đầy đủ thông tin cho chủ thể dữ liệu cá nhân về thủ tục và thực hiện trong thời hạn 20 ngày. Trường hợp cần yêu cầu bên xử lý dữ liệu cá nhân, bên thứ ba cung cấp, xóa, hạn chế xử lý dữ liệu của chủ thể dữ liệu cá nhân thì thực hiện trong thời hạn 30 ngày."
    verdict: match
    note: "Gia hạn: 'tối đa 01 lần gia hạn trong thời hạn không quá 20 ngày'; bên kiểm soát phải thông báo lý do và chứng minh cần thiết, hợp lý (khớp Chi phí)."
  - text: "Hạn 02 ngày làm việc chỉ bắt đầu từ lúc yêu cầu đúng thủ tục tới bên kiểm soát (Bẫy 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "Khi nhận được yêu cầu xóa dữ liệu cá nhân theo đúng thủ tục của chủ thể dữ liệu cá nhân"
    verdict: inference
    note: "Nguồn nói 'theo đúng thủ tục', suy ra đồng hồ chỉ chạy khi yêu cầu đúng thủ tục: hợp lý nhưng là suy luận. Điều 5 khoản 1 buộc bên kiểm soát 'xây dựng quy trình, thủ tục, biểu mẫu rõ ràng'; vì vậy bước 'gửi email cho bộ phận bảo vệ dữ liệu' chỉ chắc chắn kích hoạt hạn nếu đó là kênh/biểu mẫu mà bên kiểm soát công bố."
  - text: "tldr/steps: 'Gửi email cho bộ phận bảo vệ dữ liệu'"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-356-2025-nd-cp-468371.htm
    quote: "phải xây dựng quy trình, thủ tục, biểu mẫu rõ ràng để thực hiện các quyền của chủ thể dữ liệu cá nhân phù hợp với hoạt động xử lý dữ liệu cá nhân và trách nhiệm các bộ phận có liên quan"
    verdict: inference
    note: "Không có điều khoản nào quy định phải/được gửi 'email cho bộ phận bảo vệ dữ liệu'. Bản soạn là mẹo thực hành, trái với ngữ cảnh pháp lý (bên kiểm soát định kênh). Cần nói: dùng đúng kênh bên kiểm soát công bố (biểu mẫu/email chỉ định); email là kênh phụ để lưu dấu."

claims:
  - text: "Tạm thời chuyển công việc tối đa 60 ngày làm việc cộng dồn trong 01 năm; quá mức đó chỉ được khi người lao động đồng ý bằng văn bản (Điều 29 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "người sử dụng lao động được quyền tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động nhưng không được quá 60 ngày làm việc cộng dồn trong 01 năm; trường hợp chuyển người lao động làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm thì chỉ được thực hiện khi người lao động đồng ý bằng văn bản."
    verdict: match
    note: "Đọc từ DOCX 18/VBHN-VPQH tải trên trang Công báo."
  - text: "Chỉ được chuyển khi gặp khó khăn đột xuất (thiên tai, hỏa hoạn, dịch bệnh nguy hiểm), áp dụng biện pháp ngăn ngừa tai nạn, sự cố điện, nước, hoặc do nhu cầu sản xuất, kinh doanh"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Người sử dụng lao động quy định cụ thể trong nội quy lao động những trường hợp do nhu cầu sản xuất, kinh doanh mà người sử dụng lao động được tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động."
    verdict: partial
    note: "Điều 29 khoản 1 đoạn 2: 'nhu cầu sản xuất, kinh doanh' chỉ là căn cứ nếu nội quy lao động đã quy định cụ thể các trường hợp. Mục không nhắc điều kiện này (người đọc không biết đối chiếu nội quy). Đoạn 1 liệt kê đúng các căn cứ khác."
  - text: "Phải báo trước ít nhất 03 ngày làm việc, thông báo rõ thời hạn làm tạm thời và bố trí công việc phù hợp sức khỏe, giới tính (Điều 29 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "người sử dụng lao động phải báo cho người lao động biết trước ít nhất 03 ngày làm việc, thông báo rõ thời hạn làm tạm thời và bố trí công việc phù hợp với sức khỏe, giới tính của người lao động."
    verdict: match
    note: "Điều 29 khoản 2."
  - text: "Giữ nguyên lương công việc cũ trong 30 ngày làm việc nếu lương mới thấp hơn; lương mới ít nhất 85% lương cũ và không thấp hơn lương tối thiểu (Điều 29 khoản 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc. Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu."
    verdict: match
    note: "Điều 29 khoản 3. 'Giảm tối đa 15%' là phép tính từ 85%."
  - text: "Người không đồng ý mà phải ngừng việc được trả lương ngừng việc theo Điều 99 (Điều 29 khoản 4)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "4. Người lao động không đồng ý tạm thời làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc thì người sử dụng lao động phải trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này."
    verdict: partial
    note: "Điều kiện 'quá 60 ngày làm việc cộng dồn trong 01 năm' bị bỏ ở câu trong mục. Trong hạn 60 ngày, khoản 4 không cho người lao động từ chối rồi ngừng việc hưởng lương; xem potential_harm."
  - text: "Ngừng việc do lỗi của người sử dụng lao động thì trả đủ tiền lương theo hợp đồng (Điều 99 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "1. Nếu do lỗi của người sử dụng lao động thì người lao động được trả đủ tiền lương theo hợp đồng lao động;"
    verdict: match
    note: "Điều 99 khoản 1. Điều 99 khoản 3 (sự cố điện nước, thiên tai...) và khoản 2 (lỗi người lao động) không nhắc, không gây hiểu sai trong ngữ cảnh mục."
  - text: "Mức lương theo công việc hoặc chức danh không được thấp hơn mức lương tối thiểu (Điều 90 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "2. Mức lương theo công việc hoặc chức danh không được thấp hơn mức lương tối thiểu."
    verdict: match
    note: ""
  - text: "Sửa đổi hợp đồng phải báo trước ít nhất 03 ngày làm việc; thỏa thuận được thì ký phụ lục; không thỏa thuận được thì tiếp tục thực hiện hợp đồng đã giao kết (Điều 33)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "1. Trong quá trình thực hiện hợp đồng lao động, nếu bên nào có yêu cầu sửa đổi, bổ sung nội dung hợp đồng lao động thì phải báo cho bên kia biết trước ít nhất 03 ngày làm việc về nội dung cần sửa đổi, bổ sung. ... 3. Trường hợp hai bên không thỏa thuận được việc sửa đổi, bổ sung nội dung hợp đồng lao động thì tiếp tục thực hiện hợp đồng lao động đã giao kết."
    verdict: match
    note: "Điều 33 khoản 1, 3. Lưu ý: 03 ngày làm việc là thời hạn BÊN YÊU CẦU phải báo trước, không phải thời hạn người nhận phải trả lời (xem steps)."
  - text: "Người lao động nghỉ không cần báo trước khi không được bố trí đúng công việc/địa điểm (trừ Điều 29) hoặc không được trả đủ lương/trả lương không đúng thời hạn (Điều 35 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "a) Không được bố trí theo đúng công việc, địa điểm làm việc hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận, trừ trường hợp quy định tại Điều 29 của Bộ luật này; b) Không được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này;"
    verdict: partial
    note: "Điểm a khớp (có 'trừ Điều 29' đúng như mục tóm). Điểm b có ngoại lệ 'trừ khoản 4 Điều 97' mà mục bỏ. Rủi ro nghỉ ngang vẫn nằm ở việc người lao động tự chứng minh sai phạm (mục đã nhắc ở Bẫy 3)."
  - text: "Không báo trước 03 ngày làm việc, hoặc không nói rõ thời hạn: phạt 1.000.000 đến 3.000.000 đồng (NĐ 283/2026 Điều 17 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "1. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với người sử dụng lao động có hành vi tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động nhưng không báo cho người lao động trước 03 ngày làm việc hoặc không thông báo hoặc thông báo không rõ thời hạn làm tạm thời hoặc bố trí công việc không phù hợp với sức khỏe, giới tính của người lao động."
    verdict: match
    note: "PDF Công báo số 448 ngày 28-07-2026 có lớp chữ. Số tiền là mức CÁ NHÂN; doanh nghiệp gấp đôi (xem claim kế tiếp)."
  - text: "Chuyển không đúng lý do, quá thời hạn, hoặc không có văn bản đồng ý: phạt 3.000.000 đến 7.000.000 đồng và buộc bố trí lại đúng hợp đồng (Điều 17 khoản 2 điểm c, khoản 5 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "c) Chuyển người lao động làm công việc khác so với hợp đồng lao động không đúng lý do; thời hạn hoặc không có văn bản đồng ý của người lao động theo quy định của pháp luật. ... c) Buộc người sử dụng lao động bố trí người lao động làm công việc đúng với hợp đồng lao động đã giao kết khi có hành vi vi phạm quy định tại điểm c khoản 2 Điều này;"
    verdict: match
    note: "Điều 17 khoản 2 (mức 3.000.000 đến 7.000.000 đồng ghi ở đầu khoản 2) và khoản 5 điểm c."
  - text: "Các mức phạt trên là mức phạt cho đơn vị (mục không nói gấp đôi cho doanh nghiệp)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    verdict: partial
    note: "Điều 7 khoản 1: Điều 17 không thuộc danh sách ngoại lệ nên 1 đến 3 triệu và 3 đến 7 triệu là mức cá nhân; doanh nghiệp (khoản 2 điểm b) bị 2 đến 6 triệu và 6 đến 14 triệu. Mục ghi 'Cái giá phía đơn vị' nhưng nêu mức cá nhân, thiếu hệ số 02, dù legal_refs có dẫn Điều 7 khoản 1."
  - text: "Việc chuyển quá 60 ngày không có văn bản đồng ý thì người lao động mất 'toàn bộ phần chênh' lương"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"

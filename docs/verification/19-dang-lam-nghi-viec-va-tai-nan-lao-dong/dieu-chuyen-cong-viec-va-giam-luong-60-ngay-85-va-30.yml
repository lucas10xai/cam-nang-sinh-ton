potential_harm:
  - "[INFERENCE, pháp lý] Pháp luật VN dòng 'Người không đồng ý mà phải ngừng việc được trả lương ngừng việc (Điều 29 khoản 4)' không có điều kiện 'quá 60 ngày làm việc cộng dồn'; cùng với steps bước 2 ('chưa đồng ý thì gửi văn bản ... đề nghị giữ nguyên nội dung cũ'), người đọc có thể từ chối một lần chuyển việc hợp lệ trong hạn 60 ngày, ngừng việc và đòi lương ngừng việc; theo nguyên văn Điều 29 khoản 4 quyền này chỉ phát sinh khi chuyển quá 60 ngày không đồng ý. Hậu quả pháp lý với người từ chối trong hạn 60 ngày không được nguồn nào trong mục nêu."
suggested_edits:
  - "Pháp luật VN, dòng 'Người không đồng ý mà phải ngừng việc...': sửa thành 'Người lao động không đồng ý tạm thời làm công việc khác quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc thì được trả lương ngừng việc theo Điều 99' (Điều 29 khoản 4)."
  - "steps bước 2 và Bẫy 1: thay 'nêu ý kiến trong 03 ngày làm việc' bằng 'trả lời bằng văn bản càng sớm càng tốt (luật không đặt thời hạn trả lời); 03 ngày làm việc là thời hạn báo trước của bên yêu cầu (Điều 29 khoản 2, Điều 33 khoản 1)'. Tách rõ: chuyển tạm thời trong 60 ngày hợp lệ không cần đồng ý; sửa hợp đồng/giảm lương lâu dài cần thỏa thuận (Điều 33)."
  - "Chi phí: bỏ hoặc gắn nhãn 'suy ra' cho 'Toàn bộ phần chênh nếu việc mới kéo dài quá 60 ngày' (Điều 29, 33 không nói việc đòi phần chênh)."
  - "'Cái giá phía đơn vị': ghi 'mức cá nhân 1 đến 3 triệu và 3 đến 7 triệu; doanh nghiệp gấp đôi (2 đến 6 triệu và 6 đến 14 triệu), Điều 7 khoản 1 NĐ 283/2026'."
  - "Pháp luật VN, chuyển công việc: thêm 'nhu cầu sản xuất, kinh doanh chỉ là căn cứ khi nội quy lao động đã quy định cụ thể các trường hợp (Điều 29 khoản 1 đoạn 2)'."
  - "steps bước 4 và Bẫy 3: bỏ 'sáu tháng' hoặc nêu căn cứ; Điều 35 khoản 2 điểm b: thêm 'trừ trường hợp khoản 4 Điều 97'."

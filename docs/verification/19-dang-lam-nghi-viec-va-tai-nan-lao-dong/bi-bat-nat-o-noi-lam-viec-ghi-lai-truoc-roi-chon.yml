  basis: "BLLĐ: VBHN 18/VBHN-VPQH ngày 12/02/2026 (Công báo 131) liệt kê ba luật sửa đổi; NĐ 283 (15/07/2026) còn căn cứ \"Bộ luật Lao động số 45/2019/QH14\" nên BLLĐ còn hiệu lực tới 15/7/2026. NĐ 283: khoản 1 điều hiệu lực \"có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026\" và Điều 66 khoản 4 cho NĐ 12/2022 hết hiệu lực; không tìm thấy văn bản sửa đổi NĐ 283 (counter \"Văn bản sửa đổi\" trên Công báo hiển thị [0] cho cả VBHN đã được sửa nên không dùng làm bằng chứng). NĐ 161: OCR trang 7 \"có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026\". BLDS 2015: chỉ có bản Công báo (Hiệu lực 01/01/2017) và bài thứ cấp; chưa tìm được văn bản chính thống xác nhận không có BLDS mới nên ghi unconfirmed."

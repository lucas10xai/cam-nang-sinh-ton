claims:
  - text: "Ngược đãi người lao động, cưỡng bức lao động bị nghiêm cấm (Điều 8 khoản 2 BLLĐ)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "2. Ngược đãi người lao động, cưỡng bức lao động."
    verdict: "match"
    note: "Điều 8 là \"Các hành vi bị nghiêm cấm trong lĩnh vực lao động\". Đọc từ PDF Công báo số 131 (có lớp chữ), đối chiếu DOCX VBHN 18."
  - text: "Quấy rối tình dục tại nơi làm việc bị cấm (Điều 8 khoản 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "3. Quấy rối tình dục tại nơi làm việc."
    verdict: "match"
    note: ""
  - text: "Được nghỉ ngay không cần báo trước khi bị ngược đãi, đánh đập, nhục mạ, ảnh hưởng sức khỏe/nhân phẩm/danh dự; bị cưỡng bức lao động (Điều 35 khoản 2 điểm c)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "c) Bị người sử dụng lao động ngược đãi, đánh đập hoặc có lời nói, hành vi nhục mạ, hành vi làm ảnh hưởng đến sức khỏe, nhân phẩm, danh dự; bị cưỡng bức lao động;"
    verdict: "match"
    note: ""
  - text: "Được nghỉ ngay không cần báo trước khi bị quấy rối tình dục tại nơi làm việc (Điều 35 khoản 2 điểm d)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "d) Bị quấy rối tình dục tại nơi làm việc;"
    verdict: "match"
    note: "Khoản 2 mở đầu: \"Người lao động có quyền đơn phương chấm dứt hợp đồng lao động không cần báo trước trong trường hợp sau đây:\"."
  - text: "Nghỉ theo Điều 35 vẫn được trợ cấp thôi việc nửa tháng lương mỗi năm làm việc, với người làm từ đủ 12 tháng (Điều 34 khoản 9, Điều 46 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34 của Bộ luật này thì người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này."
    verdict: "partial"
    note: "Khoản 9 Điều 34 (\"Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35\") nằm trong danh sách nên kết luận đúng. Nhưng mục bỏ: (1) ngoại lệ người đã đủ điều kiện hưởng lương hưu; (2) Điều 46 khoản 2: thời gian tính trợ cấp = tổng thời gian làm việc thực tế TRỪ thời gian đã tham gia bảo hiểm thất nghiệp và thời gian đã được chi trả trợ cấp. Người đã đóng BHTN sẽ bị tính ít năm hơn \"số năm làm việc\" mà mục gợi ý."
  - text: "Thời hiệu: hòa giải 6 tháng, trọng tài 9 tháng, tòa án 1 năm, tính từ ngày phát hiện hành vi (Điều 190)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "3. Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: "match"
    note: "Khoản 1: hòa giải viên 06 tháng; khoản 2: Hội đồng trọng tài lao động 09 tháng; khoản 3: Tòa án 01 năm. Khoản 4 có trường hợp trừ thời gian bất khả kháng/trở ngại khách quan, mục không nhắc (không gây hại)."
  - text: "Phạt 50.000.000-75.000.000 đồng với cưỡng bức lao động hoặc ngược đãi người lao động chưa đến mức truy cứu TNHS (NĐ 283/2026 Điều 17 khoản 4 điểm a)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "4. Phạt tiền từ 50.000.000 đồng đến 75.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:\na) Cưỡng bức lao động hoặc ngược đãi người lao động nhưng chưa đến mức truy cứu trách nhiệm hình sự;"
    verdict: "partial"
    note: "Con số khớp. Nhưng Điều 7 khoản 1 NĐ 283: \"Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân; trừ trường hợp quy định tại: Điều 8; Điều 9; ... Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân.\" Điều 17 thuộc Chương II và không nằm trong danh sách ngoại lệ (Điều 7 khoản 1 liệt kê Điều 8, 9, ...), nên 50-75 triệu là mức cho cá nhân; doanh nghiệp/hợp tác xã/đơn vị sự nghiệp (Điều 7 khoản 2) bị gấp đôi (100-150 triệu). Mục không nói điều này."
  - text: "Phạt 15.000.000-30.000.000 đồng với quấy rối tình dục tại nơi làm việc chưa đến mức truy cứu TNHS (Điều 17 khoản 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "3. Phạt tiền từ 15.000.000 đồng đến 30.000.000 đồng đối với hành vi quấy rối tình dục tại nơi làm việc nhưng chưa đến mức truy cứu trách nhiệm hình sự."
    verdict: "partial"
    note: "Con số khớp. Khoản 3 không nêu chủ thể (khác khoản 4 \"người sử dụng lao động\"); Điều 7 khoản 1 vẫn quy mức này là mức cá nhân, tổ chức gấp đôi. Mục viết như thể người sử dụng lao động bị phạt mức đó mà không ghi chủ thể/quy tắc gấp đôi."
  - text: "Buộc xin lỗi công khai, trừ khi nạn nhân có đơn không yêu cầu (Điều 17 khoản 5 điểm d)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "d) Buộc xin lỗi công khai tại nơi cư trú, nơi làm việc, địa điểm khác hoặc trên phương tiện thông tin đại chúng, trừ trường hợp nạn nhân có đơn không yêu cầu."
    verdict: "match"
    note: ""
  - text: "Bồi thường tổn thất tinh thần do danh dự, nhân phẩm bị xâm phạm: thỏa thuận; không thỏa thuận được thì tối đa 10 lần mức lương cơ sở (BLDS Điều 592 khoản 2)"
    source_url: "https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2015/11/18397/12968-1-912015qh1313019pdf"
    quote: "Mức bồi thường bù đắp tổn thất về tinh thần do các bên thỏa thuận; nếu không thỏa thuận được thì mức tối đa cho một người có danh dự, nhân phẩm, uy tín bị xâm phạm không quá mười lần mức lương cơ sở do Nhà nước quy định."
    verdict: "match"
    note: "Mục \"Chi phí\" nêu \"tối đa 10 lần ... 25.300.000 đồng\" mà không ghi điều kiện \"nếu không thỏa thuận được\"; phần \"Pháp luật Việt Nam\" có ghi đủ. Cần bảo đảm người đọc không hiểu 10 lần là trần cho mọi thỏa thuận."
  - text: "Mức lương cơ sở 2.530.000 đồng/tháng (NĐ 161/2026 Điều 3 khoản 2); 10 lần = 25.300.000 đồng"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/5/161-ndcp.signed.pdf"
    quote: "2. Từ ngày 01 tháng 7 năm 2026, mức lương cơ sở là 2.530.000 đồng/tháng."
    verdict: "match"
    note: "PDF ký là ảnh quét (không có lớp chữ); chữ trích bằng OCR (macOS Vision) trang 3, khớp thêm với bài Chinhphu.vn xaydungchinhsach.chinhphu.vn/tu-01-7-chinh-phu-tang-luong-co-so-119260517100243881.htm. Phép tính 10 x 2.530.000 = 25.300.000 đúng."
  - text: "Bồi thường tiền lương những ngày không được làm việc 'nếu hành vi dẫn tới việc chấm dứt trái luật'"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Phải nhận người lao động trở lại làm việc theo hợp đồng lao động đã giao kết; phải trả tiền lương, đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp trong những ngày người lao động không được làm việc và phải trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động."
    verdict: "inference"
    note: "Đây là Điều 41 khoản 1 (người sử dụng lao động đơn phương chấm dứt trái pháp luật), KHÔNG có trong legal_refs và không được nêu số điều. Khi người lao động tự nghỉ theo Điều 35 khoản 2 thì Điều 41 không áp dụng; mục viết điều kiện mơ hồ."
internal_checks:
  - issue: "Mọi mức phạt (50-75 triệu, 15-30 triệu) trình bày như mức phạt thực tế của người sử dụng lao động, nhưng NĐ 283 Điều 7 khoản 1-2 quy các mức này là mức cá nhân và gấp đôi với tổ chức/doanh nghiệp. Người đọc sẽ đánh giá thấp mức phạt của công ty."
    severity: "error"
  - issue: "Trợ cấp thôi việc \"nửa tháng lương cho mỗi năm làm việc\" (Nói dễ hiểu, Chi phí, Pháp luật) bỏ Điều 46 khoản 2 (trừ thời gian đã tham gia BHTN) và ngoại lệ đủ điều kiện hưởng lương hưu; steps/tldr không nhắc. Dễ làm người đọc tự tính sai số tiền."
    severity: "error"
  - issue: "Câu \"Tiền lương những ngày không được làm việc, nếu hành vi dẫn tới việc chấm dứt trái luật\" không có căn cứ trong legal_refs (là Điều 41 khoản 1, chỉ áp dụng khi người sử dụng lao động chấm dứt trái luật, không phải khi người lao động nghỉ theo Điều 35)."
    severity: "warn"
  - issue: "legal_refs[].url của NĐ 283/2026 (datafiles ...283-ndcp.signed.pdf) và NĐ 161/2026 là PDF ảnh quét, không trích được chữ; văn bản đúng nhưng người đọc/kiểm chứng không tra được bằng máy. Nên đổi sang trang Công báo kèm DOCX (congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm)."
    severity: "warn"
  - issue: "Mục \"Chi phí\" nêu \"tối đa 10 lần mức lương cơ sở\" không kèm điều kiện \"nếu không thỏa thuận được\" (Điều 592 khoản 2)."
    severity: "warn"

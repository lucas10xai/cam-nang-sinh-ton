suggested_edits:
  - "Pháp luật Việt Nam > Mức phạt: thêm câu \"Các mức 50-75 triệu và 15-30 triệu là mức đối với cá nhân; tổ chức (doanh nghiệp, hợp tác xã...) bị phạt gấp đôi\" dựa vào Điều 7 khoản 1 và khoản 2 NĐ 283 (\"Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân\"). Sửa Nói dễ hiểu cho khớp."
  - "Phần trợ cấp thôi việc (Nói dễ hiểu, Chi phí, Pháp luật): ghi rõ \"nửa tháng lương cho mỗi năm làm việc, trừ thời gian đã tham gia bảo hiểm thất nghiệp và thời gian đã được trả trợ cấp (Điều 46 khoản 2), và không áp dụng nếu đã đủ điều kiện hưởng lương hưu (Điều 46 khoản 1)\"."
  - "Dòng \"Tiền lương những ngày không được làm việc\": chỉ giữ nếu thêm Điều 41 BLLĐ vào legal_refs và ghi rõ là trường hợp người sử dụng lao động đơn phương chấm dứt trái luật; hoặc xóa dòng này khỏi mục \"Số tiền có thể đòi\"."
  - "Mục Chi phí, dòng bồi thường tinh thần: thêm \"nếu hai bên không thỏa thuận được\" trước \"tối đa 10 lần mức lương cơ sở\"."
  - "Đổi url NĐ 283 và NĐ 161 sang trang Công báo có DOCX/PDF có chữ; xác nhận hiệu lực BLDS 2015 bằng nguồn chính thống trước khi nâng trạng thái."

  amended_by:
    - "Nghị định 35/2022/NĐ-CP (sửa khoản 2 Điều 4 và khoản 2 Điều 31 NĐ 145; nguồn thứ cấp hrvnacademy.com, lawgical.vn, lsvn.vn)"
    - "Nghị quyết 66.18/2026/NQ-CP ngày 18/05/2026, hiệu lực 01/07/2026 đến hết 28/02/2027: ngừng thủ tục giấy phép (Điều 21 đến 28 NĐ 145), thay bằng ký quỹ và thông báo hoạt động (nguồn chính thức là PDF ảnh quét; chữ lấy từ luatvietnam.vn, thứ cấp)"
  basis: "NĐ 145/2020: trang Công báo ghi 'Hiệu lực: 01/02/2021', không có văn bản thay thế toàn bộ được tìm thấy; trang thứ cấp lawgical.vn và hrvnacademy.com ghi 'hết hiệu lực một phần'. Điều 15, 30 và Phụ lục II chưa thấy bị sửa; Điều 21 đến 25 (cấp phép) bị ngừng thủ tục từ 01/07/2026 theo Nghị quyết 66.18/2026/NQ-CP; NĐ 283/2026 Điều 19 khoản 4 điểm a (chữ đọc được, Công báo số 448 ngày 28-07-2026) đã phản ánh cơ chế thông báo, và Điều 19 khoản 2 điểm b dùng 'doanh nghiệp không phải là doanh nghiệp cho thuê lại lao động'. Không tìm thấy trên nguồn chính thức đọc được văn bản nào tuyên NĐ 145/2020 hết hiệu lực toàn bộ nên ghi unconfirmed cho NĐ 145; BLLĐ (VBHN 18/VBHN-VPQH ngày 12/02/2026) còn hiệu lực; NĐ 283/2026 hiệu lực từ 10/09/2026 (Điều 66 khoản 1)."

potential_harm:
  - "[Pháp lý] Steps bước 1 ('trước khi ký, hỏi công ty cho thuê lại giấy phép hoạt động') và tldr có thể khiến người đọc từ chối hoặc nghi ngờ một doanh nghiệp hợp pháp mới (hoạt động theo cơ chế ký quỹ + thông báo từ 01/07/2026, không có giấy phép) hoặc, ngược lại, tin rằng chỉ cần 'có giấy phép' là hợp pháp mà không kiểm ký quỹ và thông báo hoạt động trên trang Sở Nội vụ."
  - "[Pháp lý] Bẫy 2 khẳng định 'danh mục không có công việc sản xuất phổ thông, chỉ có lập trình hệ thống máy sản xuất': sai chữ Phụ lục II (mục 8 và 9). Người đọc có thể kết luận sai về việc công việc của mình có hợp pháp qua cho thuê lại hay không."
suggested_edits:
  - "Chi phí, mục 'Phạt phía bên thuê lại': đưa phân biệt đối xử ra khỏi nhóm 40 đến 50 triệu; ghi: 'ngoài danh mục, dùng người của doanh nghiệp không phải là doanh nghiệp cho thuê lại lao động, chuyển người, thay người đình công hoặc bị cho thôi việc, không có thỏa thuận bồi thường tai nạn, hoặc ngoài ba trường hợp được phép: 40 đến 50 triệu (cá nhân), doanh nghiệp gấp đôi; phân biệt đối xử, không huấn luyện an toàn, không thông báo nội quy, không sơ cứu: 3 đến 5 triệu (cá nhân), doanh nghiệp gấp đôi' (NĐ 283/2026 Điều 19 khoản 1, 2, Điều 7 khoản 1)."
  - "Bẫy 2 và phần 'Danh mục công việc': liệt kê đủ 20 mục theo Phụ lục II NĐ 145/2020, gồm mục 8 'Sản xuất, lắp đặt thiết bị truyền hình, viễn thông', mục 9 'Vận hành/kiểm tra/sửa chữa máy móc xây dựng, hệ thống điện sản xuất', mục 16 'Scan, vẽ kỹ thuật công nghiệp/Trang trí nội thất'; bỏ câu 'chỉ có lập trình hệ thống máy sản xuất'; viết lại bẫy 2 thành 'đối chiếu công việc của bạn với từng mục của danh mục 20 công việc'."
  - "tldr, Nói dễ hiểu, Chi phí, steps bước 1, phần 'Giấy phép và ký quỹ': thay 'giấy phép hoạt động' bằng 'từ 01/07/2026 (Nghị quyết 66.18/2026/NQ-CP, đến hết 28/02/2027): doanh nghiệp cho thuê lại phải ký quỹ 2.000.000.000 đồng và thông báo hoạt động với Sở Nội vụ; doanh nghiệp đã có giấy phép còn hiệu lực không phải thông báo. Hỏi công ty bằng chứng ký quỹ/thông báo hoặc kiểm danh sách công khai của Sở Nội vụ'. Dựa vào NĐ 283/2026 Điều 19 khoản 4 điểm a và Nghị quyết 66.18 Phụ lục I.4 mục C.I, C.III, C.IX, C.XII.3, C.XIV; đọc lại và ghi nguồn chính thức khi có bản trích được chữ."
  - "Điều 53 khoản 4: thay 'doanh nghiệp không có giấy phép' bằng 'doanh nghiệp không phải là doanh nghiệp cho thuê lại lao động (NĐ 283/2026 Điều 19 khoản 2 điểm b)'; ghi chú VBHN 18/VBHN-VPQH vẫn dùng chữ 'Giấy phép' vì ban hành trước Nghị quyết."
  - "Bỏ 'giấy phép tối đa 60 tháng' khỏi Chi phí và Pháp luật VN (Điều 23 khoản 3 NĐ 145/2020) hoặc ghi 'chỉ với giấy phép cấp trước 01/07/2026'."
  - "Câu 'hết 12 tháng thì không tự động thành hợp đồng chính thức' gắn nhãn 'suy ra từ Điều 57 khoản 4, Điều 58 khoản 5' hoặc bỏ."
  - "Thêm vào legal_refs hoặc Nguồn: Nghị quyết 66.18/2026/NQ-CP ngày 18/05/2026 (toàn văn: https://xaydungchinhsach.chinhphu.vn/nghi-quyet-so-6618-2026-nq-cp-cat-giam-don-gian-hoa-tthc-dieu-kien-kinh-doanh-nhieu-nganh-linh-vuc-119260520145049455.htm, PDF ảnh quét) và NĐ 283/2026 Điều 19 khoản 4, khoản 6."

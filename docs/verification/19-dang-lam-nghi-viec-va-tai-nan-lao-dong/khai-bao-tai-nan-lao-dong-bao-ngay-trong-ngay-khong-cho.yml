    quote: Khai báo bằng cách nhanh nhất (trực tiếp hoặc điện thoại, fax, công điện, thư điện tử) với Thanh tra Sở Lao động - Thương binh và Xã hội, nơi xảy ra tai nạn; trường hợp tai nạn làm chết người đồng thời báo ngay cho cơ quan Công an huyện, quận, thị xã, thành phố thuộc tỉnh, thành phố thuộc thành phố trực thuộc Trung ương (sau đây gọi tắt là Công an cấp huyện)

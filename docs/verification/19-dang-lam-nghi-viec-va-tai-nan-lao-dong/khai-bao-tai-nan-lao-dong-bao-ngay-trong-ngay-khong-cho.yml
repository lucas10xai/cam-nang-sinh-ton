  - text: "Văn bản chính thức đã đổi cơ quan nhận khai báo: Sở Nội vụ và Công an cấp xã (Điều 45 khoản 1 Nghị định 129/2025/NĐ-CP)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-129-2025-nd-cp-45076.htm
    verdict: match
    quote: Sở Nội vụ và cơ quan công an cấp xã có trách nhiệm nhận khai báo tai nạn lao động theo quy định tại điểm a khoản 1, điểm a khoản 2 và điểm b khoản 3 Điều 10 Nghị định số 39/2016/NĐ-CP ngày 15 tháng 5 năm 2016 của Chính phủ quy định chi tiết thi hành một số điều của Luật An toàn, vệ sinh lao động.
    note: "Mục viết 'Điều 42 khoản ...' tương ứng: Cơ quan công an cấp xã có trách nhiệm: 1. Nhận khai báo tai nạn lao động, sự cố kỹ thuật gây mất an toàn, vệ sinh lao động của người sử dụng lao động theo quy định tại điểm b khoản 1 Điều 34 Luật An toàn vệ sinh lao động. (Điều 42). Bằng chứng để sửa mục, không phải khẳng định của mục."
  - text: "Hạn điều tra tính từ lúc nhận tin: 04 ngày (thương nhẹ), 07 ngày (nặng một người), 20 ngày (nặng từ hai người), 30 ngày (có người chết), 60 ngày (cần giám định kỹ thuật/pháp y) (Điều 35 khoản 6)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: "Thời hạn điều tra [...] được tính từ thời điểm nhận tin báo, khai báo tai nạn lao động đến khi công bố biên bản điều tra tai nạn lao động như sau: a) Không quá 04 ngày đối với tai nạn lao động làm bị thương nhẹ người lao động; b) Không quá 07 ngày đối với tai nạn lao động làm bị thương nặng một người lao động; c) Không quá 20 ngày đối với tai nạn lao động làm bị thương nặng từ hai người lao động trở lên; d) Không quá 30 ngày đối với tai nạn lao động chết người; không quá 60 ngày đối với tai nạn lao động cần phải giám định kỹ thuật hoặc giám định pháp y."
    note: "Ghi chú: cụm 'giám định kỹ thuật/pháp y' trong luật đứng cùng điểm d; mục diễn đạt tương đương."

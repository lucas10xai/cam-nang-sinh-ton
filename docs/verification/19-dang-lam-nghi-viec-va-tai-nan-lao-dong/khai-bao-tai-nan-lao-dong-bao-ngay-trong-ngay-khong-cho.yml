  doc: Luật An toàn, vệ sinh lao động 84/2015/QH13 (14/VBHN-VPQH); Nghị định 39/2016/NĐ-CP; Nghị định 283/2026/NĐ-CP
  in_force: unconfirmed
  effective_from: 2016-07-01
  amended_by:
    - Luật BHXH 41/2024/QH15 (có hiệu lực 01/7/2025, đã hợp nhất vào 14/VBHN-VPQH)
    - Nghị định 129/2025/NĐ-CP Điều 42, 45 (từ 01/7/2025; đổi cơ quan nhận khai báo của Nghị định 39/2016 Điều 10; hết hiệu lực 01/3/2027 trừ ngoại lệ tại Điều 80)
  basis: "Luật 84/2015/QH13 (hợp nhất tại 14/VBHN-VPQH ngày 16/9/2024, đã gộp sửa đổi của Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025). Nghị định 283/2026/NĐ-CP (15/7/2026), mục Căn cứ, vẫn liệt kê 'Luật An toàn, vệ sinh lao động số 84/2015/QH13' là căn cứ ban hành, tức luật còn được áp dụng đến 07/2026. Đã tìm văn bản thay thế toàn bộ: kết quả tìm kiếm thứ cấp (thuvienphapluat.vn) nói chưa có luật mới, dự án luật sửa đổi mới ở chương trình xây dựng pháp luật 2026. Không có bản VBHN nào mới hơn 14/VBHN-VPQH được kiểm tra, nên các sửa đổi sau 09/2024 (nếu có) chưa loại trừ hoàn toàn bằng nguồn chính thức. Nghị định 39/2016/NĐ-CP: còn hiệu lực nhưng Điều 10 khoản 1 điểm a và Phụ lục III đã bị Nghị định 129/2025 Điều 45 thay cơ quan/mẫu (đọc bản PDF Công báo 783+784 trên congbao.chinhphu.vn); chưa tra được bản hợp nhất chính thức của NĐ 39 nên để unconfirmed. Nghị định 283/2026/NĐ-CP ký 15/7/2026, Điều 80: 'Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026' và thay Nghị định 12/2022/NĐ-CP (hết hiệu lực cùng ngày). Văn bản mới, đọc bản DOCX trên congbao.chinhphu.vn; chưa thấy văn bản sửa đổi nhưng chưa có bằng chứng tra cứu chính thức."
deliberate_vn_deviation: []
potential_harm:
  - Bước 1 ('Đưa người bị nạn đi cấp cứu trước') không nhắc gọi 115/sơ cứu tại chỗ và không nói tránh di chuyển người nghi chấn thương cột sống/đầu (tai nạn lao động hay là ngã cao, đè ép). Làm đúng nguyên văn có thể di chuyển sai cách. [INFERENCE từ nguyên tắc sơ cứu phổ biến; không có nguồn y tế nào được mở trong lượt kiểm này, cần người kiểm y tế xác nhận].
suggested_edits:
  - "tldr và thân bài 'Pháp luật Việt Nam' mục Khai báo: đổi 'Thanh tra Sở Lao động - Thương binh và Xã hội' thành 'Sở Nội vụ (cơ quan quản lý nhà nước về lao động cấp tỉnh) và Công an cấp xã' dựa vào Điều 45 khoản 1 và Điều 42 Nghị định 129/2025/NĐ-CP; đổi 'Công an cấp huyện' thành 'Công an cấp xã'; đổi 'mẫu Phụ lục III' thành 'Mẫu số 01 Phụ lục II Nghị định 129/2025/NĐ-CP' (Điều 45 khoản 2). Ghi chú Nghị định 129 hết hiệu lực 01/3/2027 trừ ngoại lệ (Điều 80)."
  - "Mục Mức phạt: thêm Điều 32 khoản 3 điểm đ NĐ 283/2026 (20–25 triệu đồng, không khai báo/khai báo không kịp thời/khai báo sai sự thật về tai nạn lao động) — quote: 'không khai báo hoặc khai báo không kịp thời hoặc khai báo sai sự thật về tai nạn lao động'. Thêm câu: mức tiền nêu là mức của cá nhân, tổ chức bị phạt gấp 02 lần (Điều 7 khoản 1)."
  - "Điều 31 khoản 1: sửa thành 'không báo cáo kịp thời khi phát hiện nguy cơ xảy ra sự cố kỹ thuật, tai nạn lao động hoặc bệnh nghề nghiệp'; Điều 31 khoản 3: nêu đủ 'không thống kê; không báo cáo định kỳ/không đầy đủ/không chính xác/không đúng thời hạn' và nói rõ đây là phạt báo cáo định kỳ, không phải khai báo ngay."
  - "Gia hạn điều tra: thêm điều kiện 'chỉ với bị thương nặng, chết người và có tình tiết phức tạp; Trưởng đoàn phải báo cáo và được người ra quyết định thành lập Đoàn đồng ý'."
  - "Mục Chi phí/Pháp luật: thêm điều kiện 'tai nạn không hoàn toàn do lỗi của người lao động' vào mức bồi thường Điều 38 khoản 4 và nhắc Điều 40 (mâu thuẫn cá nhân không liên quan công việc, tự hủy hoại, ma túy/chất gây nghiện thì không hưởng chế độ từ NSDLĐ)."
  - "Bước 1: thêm 'gọi 115 và sơ cứu tại chỗ; không di chuyển người nghi chấn thương cột sống/đầu trừ khi nơi đó đang nguy hiểm' (cần nguồn y tế được duyệt)."
  - "Bước 4 và Bẫy 3: gắn nhãn 'suy ra từ mức sàn Điều 38 khoản 4', không trình bày như quy định."

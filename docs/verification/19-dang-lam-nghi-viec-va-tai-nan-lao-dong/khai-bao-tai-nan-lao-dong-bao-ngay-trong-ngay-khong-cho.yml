    quote: Khi xảy ra hoặc có nguy cơ xảy ra tai nạn lao động, sự cố kỹ thuật gây mất an toàn, vệ sinh lao động tại nơi làm việc thì người bị tai nạn hoặc người biết sự việc phải báo ngay cho người phụ trách trực tiếp, người sử dụng lao động biết để kịp thời có biện pháp xử lý, khắc phục hậu quả xảy ra
    note: ""
  - text: "Tai nạn làm chết người hoặc bị thương nặng từ hai người lao động trở lên: NSDLĐ khai báo ngay với cơ quan quản lý nhà nước về lao động cấp tỉnh; có người chết thì báo ngay Công an cấp huyện (Điều 34 khoản 1 điểm b)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: partial
    quote: Đối với các vụ tai nạn quy định tại điểm a khoản này làm chết người hoặc làm bị thương nặng từ hai người lao động trở lên thì người sử dụng lao động có trách nhiệm khai báo ngay với cơ quan quản lý nhà nước về lao động cấp tỉnh nơi xảy ra tai nạn; trường hợp tai nạn làm chết người thì phải đồng thời báo ngay cho cơ quan Công an huyện, quận, thị xã, thành phố thuộc tỉnh, thành phố thuộc thành phố trực thuộc Trung ương (sau đây gọi chung là cấp huyện)
    note: Khớp chữ luật 14/VBHN-VPQH. Nhưng (1) điểm c/d cùng khoản loại trừ lĩnh vực phóng xạ, dầu khí, giao thông vận tải, lực lượng vũ trang (khai báo theo luật chuyên ngành) và người lao động không theo hợp đồng lao động (khai báo với UBND cấp xã) — mục không nêu; (2) từ 01/7/2025 cấp huyện không còn, Nghị định 129/2025 Điều 42 giao Công an cấp xã nhận khai báo (xem claim kế tiếp). Mục viết 'Công an cấp huyện' theo chữ luật nhưng thực tế người đọc phải báo Công an cấp xã.
  - text: Khai báo với 'Thanh tra Sở Lao động - Thương binh và Xã hội' nơi xảy ra tai nạn, nội dung theo mẫu Phụ lục III (Điều 10 khoản 1, Nghị định 39/2016/NĐ-CP) — cũng là chữ trong tldr ('Thanh tra Sở Lao động')
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-39-2016-nd-cp-19831.htm

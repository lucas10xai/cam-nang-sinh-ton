    quote: Đối với tai nạn lao động được quy định tại các điểm b, c và d của khoản này có tình tiết phức tạp thì được gia hạn thời gian điều tra một lần nhưng thời hạn gia hạn không vượt quá thời hạn quy định tại các điểm này; Trưởng đoàn điều tra phải báo cáo việc gia hạn và được sự đồng ý của người ban hành quyết định thành lập Đoàn điều tra tai nạn lao động

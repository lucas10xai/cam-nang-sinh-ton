claims:
  - text: 12 ngày (điều kiện bình thường), 14 ngày (chưa thành niên, khuyết tật, nghề nặng nhọc, độc hại, nguy hiểm), 16 ngày (đặc biệt nặng nhọc, độc hại, nguy hiểm) cho người làm đủ 12 tháng
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Người lao động làm việc đủ 12 tháng cho một người sử dụng lao động thì được nghỉ hằng năm, hưởng nguyên lương theo hợp đồng lao động như sau: a) 12 ngày làm việc đối với người làm công việc trong điều kiện bình thường; b) 14 ngày làm việc đối với người lao động chưa thành niên, lao động là người khuyết tật, người làm nghề, công việc nặng nhọc, độc hại, nguy hiểm; c) 16 ngày làm việc đối với người làm nghề, công việc đặc biệt nặng nhọc, độc hại, nguy hiểm."
    verdict: match
    note: BLLĐ Điều 113 khoản 1. tldr viết "14 hoặc 16 ngày với nghề nặng nhọc" bỏ nhóm chưa thành niên/khuyết tật (thân bài đủ).
  - text: Cứ đủ 05 năm làm việc cho một người sử dụng lao động thì thêm 01 ngày
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Cứ đủ 05 năm làm việc cho một người sử dụng lao động thì số ngày nghỉ hằng năm của người lao động theo quy định tại khoản 1 Điều 113 của Bộ luật này được tăng thêm tương ứng 01 ngày.
    verdict: match
    note: BLLĐ Điều 114.
  - text: Thâm niên tính tại chính nơi đó, không cộng thâm niên ở chỗ làm cũ
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Cứ đủ 05 năm làm việc cho một người sử dụng lao động
    verdict: inference
    note: Mục tự ghi "Suy ra". Hợp lý từ câu chữ, ngoại lệ NĐ 145 Điều 66 khoản 3 chỉ cho khu vực nhà nước.
  - text: "Ngoại lệ: khu vực nhà nước và doanh nghiệp nhà nước được cộng thâm niên liên tục"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2020/12/32732/33806-1-20201203-1204145-2020-nd-cp.pdf
    quote: Toàn bộ thời gian người lao động làm việc tại các cơ quan, tổ chức, đơn vị thuộc khu vực nhà nước và doanh nghiệp nhà nước được tính là thời gian làm việc để tính ngày nghỉ hằng năm tăng thêm theo quy định tại Điều 114 của Bộ luật Lao động nếu người lao động tiếp tục làm việc tại các cơ quan, tổ chức, đơn vị thuộc khu vực nhà nước và doanh nghiệp nhà nước.
    verdict: partial
    note: NĐ 145/2020 Điều 66 khoản 3. Mục bỏ điều kiện "nếu người lao động tiếp tục làm việc tại" khu vực nhà nước/DNNN (không phải "liên tục" theo nghĩa không đứt quãng) và đổi sang khu vực tư thì mất; cũng đang trích dẫn "theo báo cáo kiểm chứng".
  - text: "Làm chưa đủ 12 tháng: nghỉ theo tỷ lệ tương ứng số tháng làm việc"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Người lao động làm việc chưa đủ 12 tháng cho một người sử dụng lao động thì số ngày nghỉ hằng năm theo tỷ lệ tương ứng với số tháng làm việc.
    verdict: match
    note: BLLĐ Điều 113 khoản 2.
  - text: "Công thức: (ngày phép + ngày thâm niên) / 12 × số tháng làm việc thực tế; tháng lẻ tính 1 tháng nếu ngày làm việc + ngày nghỉ có hưởng lương ≥ 50% ngày làm việc bình thường"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2020/12/32732/33806-1-20201203-1204145-2020-nd-cp.pdf
    quote: lấy số ngày nghỉ hằng năm cộng với số ngày được nghỉ tăng thêm theo thâm niên (nếu có), chia cho 12 tháng, nhân với số tháng làm việc thực tế trong năm để tính thành số ngày được nghỉ hằng năm. | chiếm tỷ lệ từ 50% số ngày làm việc bình thường trong tháng theo thỏa thuận thì tháng đó được tính là 01 tháng làm việc để tính ngày nghỉ hằng năm.
    verdict: match
    note: NĐ 145/2020 Điều 66 khoản 1, 2.
  - text: Lịch nghỉ do người sử dụng lao động quy định sau khi tham khảo ý kiến và phải thông báo trước; thỏa thuận nghỉ nhiều lần hoặc gộp tối đa 03 năm một lần
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Người sử dụng lao động có trách nhiệm quy định lịch nghỉ hằng năm sau khi tham khảo ý kiến của người lao động và phải thông báo trước cho người lao động biết. Người lao động có thể thỏa thuận với người sử dụng lao động để nghỉ hằng năm thành nhiều lần hoặc nghỉ gộp tối đa 03 năm một lần.
    verdict: match
    note: BLLĐ Điều 113 khoản 4.
  - text: Tính thêm thời gian đi đường từ ngày thứ 03 (đường bộ, sắt, thủy), chỉ 01 lần nghỉ trong năm
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Khi nghỉ hằng năm, nếu người lao động đi bằng các phương tiện đường bộ, đường sắt, đường thủy mà số ngày đi đường cả đi và về trên 02 ngày thì từ ngày thứ 03 trở đi được tính thêm thời gian đi đường ngoài ngày nghỉ hằng năm và chỉ được tính cho 01 lần nghỉ trong năm.
    verdict: match
    note: 'BLLĐ Điều 113 khoản 6. Khoản 5 (tạm ứng lương) cũng khớp: "được tạm ứng tiền lương theo quy định tại khoản 3 Điều 101".'
  - text: Phép chưa nghỉ chỉ được trả tiền khi thôi việc, bị mất việc làm
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Trường hợp do thôi việc, bị mất việc làm mà chưa nghỉ hằng năm hoặc chưa nghỉ hết số ngày nghỉ hằng năm thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ.
    verdict: inference
    note: BLLĐ Điều 113 khoản 3 chỉ nêu trường hợp được thanh toán; chữ "chỉ" (tldr, Nói dễ hiểu) là suy ra từ việc luật không nêu trường hợp khác. Mục thân đã thừa nhận "Luật chỉ nêu trường hợp này"; tldr/Nói dễ hiểu nên viết "luật chỉ quy định trả tiền khi ...".
  - text: Lương làm căn cứ trả phép chưa nghỉ là lương theo hợp đồng của tháng trước liền kề tháng thôi việc, mất việc
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2020/12/32732/33806-1-20201203-1204145-2020-nd-cp.pdf
    quote: Tiền lương làm căn cứ trả cho người lao động những ngày chưa nghỉ hằng năm hoặc chưa nghỉ hết số ngày nghỉ hằng năm theo khoản 3 Điều 113 của Bộ luật Lao động là tiền lương theo hợp đồng lao động của tháng trước liền kề tháng người lao động thôi việc, bị mất việc làm.
    verdict: match
    note: NĐ 145/2020 Điều 67 khoản 3. Công thức "lương tháng / ngày làm việc × ngày chưa nghỉ" mục tự ghi là suy ra, không có trong Điều 67.
  - text: Không có quy định quy đổi phép chưa nghỉ thành 300%; 300% thuộc Điều 98 khoản 1 điểm c cho làm thêm ngày lễ/nghỉ có hưởng lương
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày.
    verdict: match
    note: Phần 300% khớp Điều 98.1.c. Phần "không có quy định quy đổi 300%" là khẳng định phủ định; đọc Điều 113, 114 và NĐ 145 Điều 65–67 không thấy hệ số nào. Câu "Đi làm trong ngày nghỉ có hưởng lương đã duyệt vẫn có thể rơi vào Điều 98.1.c (theo báo cáo kiểm chứng)" là suy luận từ cụm "ngày nghỉ có hưởng lương".
  - text: "Thời gian được tính là làm việc để tính phép: thử việc nếu tiếp tục làm; TNLĐ/bệnh nghề nghiệp cộng dồn ≤ 6 tháng; ốm cộng dồn ≤ 02 tháng/năm; thai sản; ngừng việc không do lỗi NLĐ; nghỉ không hưởng lương cộng dồn ≤ 01 tháng/năm"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2020/12/32732/33806-1-20201203-1204145-2020-nd-cp.pdf
    quote: Thời gian thử việc nếu người lao động tiếp tục làm việc cho người sử dụng lao động sau khi hết thời gian thử việc. ... Thời gian nghỉ việc không hưởng lương nếu được người sử dụng lao động đồng ý nhưng cộng dồn không quá 01 tháng trong một năm. ... Thời gian nghỉ do tai nạn lao động, bệnh nghề nghiệp nhưng cộng dồn không quá 6 tháng. ... Thời gian nghỉ do ốm đau nhưng cộng dồn không quá 02 tháng trong một năm. ... Thời gian nghỉ hưởng chế độ thai sản theo quy định của pháp luật về bảo hiểm xã hội. ... Thời gian phải ngừng việc, nghỉ việc không do lỗi của người lao động.
    verdict: match
    note: NĐ 145/2020 Điều 65 khoản 2, 4, 5, 6, 7, 9. Mục bỏ các khoản 1, 3, 8, 10; nghỉ không hưởng lương cần "được người sử dụng lao động đồng ý" (mục ghi "điều kiện chi tiết chưa có trong bản nháp").
  - text: "Vi phạm quy định nghỉ hằng tuần, nghỉ hằng năm, nghỉ lễ tết: phạt 10–20 triệu, mức cố định"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với người sử dụng lao động có hành vi vi phạm quy định của pháp luật về nghỉ hằng tuần hoặc nghỉ hằng năm hoặc nghỉ lễ, tết.
    verdict: match
    note: NĐ 283 Điều 24 khoản 2. Mức cho tổ chức gấp 02 lần theo Điều 7 khoản 1; Điều 24 không thuộc danh sách ngoại lệ.
  - text: "Không trả đủ tiền lương ngày chưa nghỉ khi thôi việc, mất việc: phạt 5–10 triệu (1–10 người), tới 40–50 triệu (từ 301 người), kèm buộc trả đủ cộng lãi"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: không trả hoặc trả không đủ tiền lương của người lao động trong những ngày chưa nghỉ hằng năm hoặc chưa nghỉ hết số ngày nghỉ hằng năm khi người lao động thôi việc, bị mất việc làm; ... a) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; ... đ) Từ 40.000.000 đồng đến 50.000.000 đồng đối với vi phạm từ 301 người lao động trở lên. | a) Buộc người sử dụng lao động trả đủ tiền lương cộng với khoản tiền lãi của số tiền lương chậm trả, trả thiếu
    verdict: match
    note: NĐ 283 Điều 23 khoản 2 và khoản 5 điểm a.

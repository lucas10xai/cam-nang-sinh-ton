claims:
  - text: NSDLĐ phải kịp thời sơ cứu, cấp cứu và tạm ứng chi phí sơ cứu, cấp cứu, điều trị (Điều 38 khoản 1)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: Kịp thời sơ cứu, cấp cứu cho người lao động bị tai nạn lao động và phải tạm ứng chi phí sơ cứu, cấp cứu và điều trị cho người lao động bị tai nạn lao động hoặc bệnh nghề nghiệp
    note: ""
  - text: "NSDLĐ thanh toán chi phí y tế từ sơ cứu đến điều trị ổn định: phần đồng chi trả + chi phí ngoài danh mục BHYT với người có thẻ, toàn bộ với người không có thẻ (Điều 38 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: "Thanh toán chi phí y tế từ khi sơ cứu, cấp cứu đến khi điều trị ổn định cho người bị tai nạn lao động hoặc bệnh nghề nghiệp như sau: a) Thanh toán phần chi phí đồng chi trả và những chi phí không nằm trong danh mục do bảo hiểm y tế chi trả đối với người lao động tham gia bảo hiểm y tế; [...] c) Thanh toán toàn bộ chi phí y tế đối với người lao động không tham gia bảo hiểm y tế"
    note: ""
  - text: Phải trả đủ lương trong thời gian điều trị, phục hồi chức năng (Điều 38 khoản 3)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: Trả đủ tiền lương cho người lao động bị tai nạn lao động, bệnh nghề nghiệp phải nghỉ việc trong thời gian điều trị, phục hồi chức năng lao động
    note: ""
  - text: Hạn 05 ngày trả bồi thường/trợ cấp sau kết luận giám định (Điều 38 khoản 7)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: partial
    quote: Thực hiện bồi thường, trợ cấp đối với người bị tai nạn lao động, bệnh nghề nghiệp trong thời hạn 05 ngày, kể từ ngày có kết luận của Hội đồng giám định y khoa về mức suy giảm khả năng lao động hoặc kể từ ngày Đoàn điều tra tai nạn lao động công bố biên bản điều tra tai nạn lao động đối với các vụ tai nạn lao động chết người
    note: Đúng, nhưng tldr/thân chỉ nêu mốc 'kết luận giám định'; luật còn mốc thứ hai 'kể từ ngày Đoàn điều tra công bố biên bản' với vụ chết người.
  - text: Báo ngay cho người phụ trách trực tiếp và NSDLĐ (Điều 34 khoản 1 điểm a)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: Khi xảy ra hoặc có nguy cơ xảy ra tai nạn lao động, sự cố kỹ thuật gây mất an toàn, vệ sinh lao động tại nơi làm việc thì người bị tai nạn hoặc người biết sự việc phải báo ngay cho người phụ trách trực tiếp, người sử dụng lao động biết để kịp thời có biện pháp xử lý, khắc phục hậu quả xảy ra
    note: ""
  - text: Từ chối hoặc cố ý chậm cấp cứu người bệnh là hành vi bị nghiêm cấm (Điều 7 khoản 2, Luật KBCB 15/2023/QH15)
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-15-2023-qh15-38900.htm
    verdict: match
    quote: Từ chối hoặc cố ý chậm cấp cứu người bệnh, trừ trường hợp quy định tại Điều 40 của Luật này.
    note: Câu 'bệnh viện không được từ chối cấp cứu' (tldr) bỏ mệnh đề ngoại lệ 'trừ trường hợp Điều 40'; thân bài đã xử lý ngoại lệ ở bullet kế (Điều 40 khoản 1).
  - text: Dù người hành nghề từ chối vì vượt khả năng/ngoài phạm vi, vẫn phải sơ cứu, cấp cứu, theo dõi, chăm sóc, điều trị cho đến khi được tiếp nhận hoặc chuyển đi (Điều 40 khoản 1)
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-15-2023-qh15-38900.htm
    verdict: match
    quote: Tiên lượng tình trạng bệnh vượt quá khả năng hoặc không thuộc phạm vi hành nghề của mình nhưng phải giới thiệu người bệnh đến người hành nghề khác hoặc cơ sở khám bệnh, chữa bệnh khác phù hợp để khám bệnh, chữa bệnh và phải thực hiện việc sơ cứu, cấp cứu, theo dõi, chăm sóc, điều trị người bệnh cho đến khi người bệnh được người hành nghề khác tiếp nhận hoặc chuyển đi cơ sở khám bệnh, chữa bệnh khác;
    note: ""
  - text: "Định nghĩa 'người bệnh không có thân nhân' gồm điểm a: người bệnh cấp cứu không giấy tờ tùy thân, không thân nhân đi cùng, không thông tin liên lạc — mục dẫn là 'Điều 3 khoản 10'"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-15-2023-qh15-38900.htm
    verdict: mismatch
    quote: "Người bệnh không có thân nhân là người thuộc một trong các trường hợp sau đây: a) Người bệnh đang trong tình trạng cấp cứu không có giấy tờ tùy thân, không có thân nhân đi cùng, không có thông tin để liên lạc với thân nhân;"
    note: "Nội dung đúng nhưng SAI SỐ ĐIỀU: định nghĩa nằm ở Điều 2 (Giải thích từ ngữ) khoản 10; Điều 3 là 'Nguyên tắc trong khám bệnh, chữa bệnh'. Sai ở thân bài (2 chỗ: Pháp luật VN và Ghi chú Bẫy 2) và legal_refs."
  - text: Phạt 2–4 triệu đồng mỗi người lao động, tối đa 75 triệu đồng, với NSDLĐ không kịp thời sơ cứu/cấp cứu (Điều 34 khoản 1 điểm a, NĐ 283/2026)
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    verdict: partial
    quote: "Phạt tiền từ 2.000.000 đồng đến 4.000.000 đồng khi vi phạm đối với mỗi người lao động nhưng tối đa không quá 75.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: a) Không kịp thời sơ cứu hoặc cấp cứu cho người lao động bị tai nạn lao động;"
    note: Số tiền khớp nhưng là mức của cá nhân; Điều 7 khoản 1 NĐ 283/2026 (Điều 34 không nằm trong ngoại lệ) tổ chức bị phạt gấp 02 lần. Mục không nêu hệ số, nên công ty thực tế có thể chịu 4–8 triệu/người (cách áp trần 75 triệu cho tổ chức chưa rõ, không tự suy).
  - text: Phạt cả hành vi 'không tạm ứng chi phí sơ cứu, cấp cứu' và 'không thanh toán toàn bộ chi phí y tế với người không có BHYT' (Điều 34 khoản 1 điểm c)
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    verdict: partial
    quote: Không tạm ứng chi phí sơ cứu, chi phí cấp cứu hoặc không thanh toán toàn bộ chi phí y tế từ khi sơ cứu, cấp cứu đến khi điều trị ổn định đối với người lao động bị tai nạn lao động, bệnh nghề nghiệp không tham gia bảo hiểm y tế;
    note: "Điểm c chỉ phạt hành vi không tạm ứng khi người lao động KHÔNG tham gia BHYT; cụm 'không tham gia BHYT' đứng cuối cho cả hai hành vi. Mục (cả Pháp luật VN và Bẫy 3: 'Nghị định 283/2026 phạt đúng hành vi không tạm ứng') đọc như phạt không tạm ứng với mọi người lao động. Với người có BHYT, hành vi liên quan là điểm b (không thanh toán đồng chi trả/ngoài danh mục), mục không nêu."
  - text: Điểm e phạt thực hiện không đúng thời hạn việc bồi thường, trợ cấp (Điều 34 khoản 1 điểm e)
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    verdict: match
    quote: Không thực hiện hoặc thực hiện không đủ hoặc thực hiện không đúng thời hạn việc bồi thường hoặc chế độ trợ cấp cho người lao động bị tai nạn lao động, bệnh nghề nghiệp theo quy định của pháp luật.
    note: ""

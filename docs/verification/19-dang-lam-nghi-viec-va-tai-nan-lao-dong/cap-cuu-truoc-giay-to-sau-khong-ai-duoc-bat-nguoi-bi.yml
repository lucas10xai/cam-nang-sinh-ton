potential_harm:
  - Bước 1 ('Đưa người bị nạn tới cơ sở cấp cứu gần nhất ngay; không chờ công ty') và Chi phí (đã nhắc 'chấn thương đầu, cột sống, mất máu nhiều') không có bước gọi 115/sơ cứu/cầm máu và không cảnh báo tránh di chuyển người nghi chấn thương cột sống hoặc đầu. Người đọc làm đúng nguyên văn (tự bê/chở đi) có thể làm nặng thêm tổn thương hoặc chậm sơ cứu tại chỗ. [INFERENCE từ nguyên tắc sơ cứu phổ biến; không mở được nguồn y tế chính thức trong lượt này, cần người kiểm y tế xác nhận.]
suggested_edits:
  - "Sửa 'Điều 3 khoản 10' thành 'Điều 2 khoản 10' ở legal_refs, mục Pháp luật Việt Nam và Ghi chú (Bẫy 2). Dựa vào Luật KBCB: 'Điều 2. Giải thích từ ngữ … 10. Người bệnh không có thân nhân là…'."
  - "Mục Mức phạt: viết đúng điểm c: 'không tạm ứng chi phí sơ cứu, cấp cứu hoặc không thanh toán toàn bộ chi phí y tế với người lao động KHÔNG tham gia BHYT'; thêm điểm b (không thanh toán đồng chi trả/ngoài danh mục BHYT với người có BHYT). Sửa câu ở Bẫy 3 tương ứng."
  - "Thêm câu: mức phạt nêu là mức của cá nhân, tổ chức gấp 02 lần (Điều 7 khoản 1 NĐ 283/2026), và NĐ 283/2026 có hiệu lực từ 10/9/2026."
  - "Bước 1: thêm 'gọi 115, sơ cứu tại chỗ (cầm máu, giữ ấm); không di chuyển người nghi chấn thương cột sống/đầu trừ khi nơi đó nguy hiểm' (cần nguồn y tế được duyệt)."
  - "Bước 3 và Bước 2: gắn nhãn là lời khuyên thực hành, không phải quy định; bỏ hoặc nguồn hóa câu 'thẻ BHYT sẽ bổ sung sau'."
  - "tldr/thân: thêm mốc thứ hai của hạn 05 ngày ('kể từ ngày Đoàn điều tra công bố biên bản' với vụ chết người) và nhắc Điều 40 Luật 84/2015 (không hưởng chế độ từ NSDLĐ trong 3 trường hợp)."

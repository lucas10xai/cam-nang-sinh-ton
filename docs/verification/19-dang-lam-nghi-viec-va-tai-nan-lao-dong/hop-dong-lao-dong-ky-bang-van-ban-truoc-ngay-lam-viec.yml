result: "pass-with-edits"
claims:
  - text: "Phải giao kết hợp đồng lao động trước khi nhận người lao động vào làm việc (Điều 13 khoản 2)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "2. Trước khi nhận người lao động vào làm việc thì người sử dụng lao động phải giao kết hợp đồng lao động với người lao động."
    verdict: "match"
    note: ""
  - text: "Tên gọi khác nhưng có nội dung việc làm có trả công, tiền lương, quản lý-điều hành-giám sát thì vẫn là hợp đồng lao động (Điều 13 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "Trường hợp hai bên thỏa thuận bằng tên gọi khác nhưng có nội dung thể hiện về việc làm có trả công, tiền lương và sự quản lý, điều hành, giám sát của một bên thì được coi là hợp đồng lao động."
    verdict: "match"
    note: ""
  - text: "Hợp đồng bằng văn bản, 02 bản, mỗi bên giữ 01 bản (Điều 14 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này."
    verdict: "match"
    note: ""
  - text: "Hợp đồng giao kết điện tử dưới dạng thông điệp dữ liệu có giá trị như văn bản (Điều 14 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "Hợp đồng lao động được giao kết thông qua phương tiện điện tử dưới hình thức thông điệp dữ liệu theo quy định của pháp luật về giao dịch điện tử có giá trị như hợp đồng lao động bằng văn bản."
    verdict: "match"
    note: ""
  - text: "Chỉ hợp đồng dưới 01 tháng mới được giao kết bằng lời nói, trừ vài trường hợp (Điều 14 khoản 2)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "2. Hai bên có thể giao kết hợp đồng lao động bằng lời nói đối với hợp đồng có thời hạn dưới 01 tháng, trừ trường hợp quy định tại khoản 2 Điều 18, điểm a khoản 1 Điều 145 và khoản 1 Điều 162 của Bộ luật này."
    verdict: "match"
    note: "Điều 14 khoản 2 loại trừ các trường hợp tại khoản 2 Điều 18, điểm a khoản 1 Điều 145 và khoản 1 Điều 162 (chưa mở các điều này để xác minh nội dung); mục ghi \"trừ vài trường hợp riêng\", đủ để không sai."
  - text: "Nội dung chủ yếu của hợp đồng gồm mức lương, hình thức trả lương, thời hạn trả lương, phụ cấp (điểm đ) và bảo hiểm xã hội, y tế, thất nghiệp (điểm i) (Điều 21 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "đ) Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác;\n...\ni) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;"
    verdict: "match"
    note: ""
  - text: "'Mức đóng bảo hiểm phải nhìn thấy được ngay trên hợp đồng' / steps và tldr: hợp đồng phải 'ghi mức lương và mức đóng bảo hiểm'"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "i) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;"
    verdict: "inference"
    note: "Điều 21 khoản 1 điểm i chỉ đòi hợp đồng có nội dung \"Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp\", không đòi ghi \"mức đóng\". Mục tự ghi \"suy ra\" ở thân nhưng tldr và step 2 phát biểu như yêu cầu. Nên viết \"có nội dung về BHXH, BHYT, BHTN; kiểm mức lương làm căn cứ đóng\"."
  - text: "Hợp đồng gồm hai loại; xác định thời hạn không quá 36 tháng (Điều 20 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Hợp đồng lao động phải được giao kết theo một trong các loại sau đây:\na) Hợp đồng lao động không xác định thời hạn ...;\nb) Hợp đồng lao động xác định thời hạn là hợp đồng mà trong đó hai bên xác định thời hạn, thời điểm chấm dứt hiệu lực của hợp đồng trong thời gian không quá 36 tháng kể từ thời điểm có hiệu lực của hợp đồng."
    verdict: "match"
    note: ""
  - text: "Hết hạn mà vẫn làm: trong 30 ngày phải ký hợp đồng mới; quá 30 ngày không ký thì thành hợp đồng không xác định thời hạn (Điều 20 khoản 2 điểm a, b)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "a) Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng đã giao kết; \nb) Nếu hết thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn mà hai bên không ký kết hợp đồng lao động mới thì hợp đồng đã giao kết theo quy định tại điểm b khoản 1 Điều này trở thành hợp đồng lao động không xác định thời hạn;"
    verdict: "match"
    note: ""
  - text: "Ký tiếp hợp đồng xác định thời hạn thì chỉ được ký thêm 01 lần (Điều 20 khoản 2 điểm c)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "c) Trường hợp hai bên ký kết hợp đồng lao động mới là hợp đồng lao động xác định thời hạn thì cũng chỉ được ký thêm 01 lần, sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn, trừ hợp đồng lao động đối với người được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước và trường hợp quy định tại khoản 1 Điều 149, khoản 2 Điều 151 và khoản 4 Điều 177 của Bộ luật này."
    verdict: "partial"
    note: "Mục (Pháp luật VN và Bẫy 3) nói \"chỉ được ký thêm đúng 01 lần\" không kèm ngoại lệ (giám đốc doanh nghiệp có vốn nhà nước; Điều 149 khoản 1, Điều 151 khoản 2, Điều 177 khoản 4: lao động có chuyên môn kỹ thuật cao... người lao động cao tuổi). Có thể làm người thuộc ngoại lệ hiểu sai quyền của mình."
  - text: "Thử việc tối đa 180/60/30/06 ngày theo từng nhóm công việc (Điều 25)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Không quá 180 ngày đối với công việc của người quản lý doanh nghiệp theo quy định của Luật Doanh nghiệp, Luật Quản lý, sử dụng vốn nhà nước đầu tư vào sản xuất, kinh doanh tại doanh nghiệp;\n2. Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên;\n3. Không quá 30 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ;\n4. Không quá 06 ngày làm việc đối với công việc khác."
    verdict: "match"
    note: "Câu mở đầu Điều 25: \"chỉ được thử việc một lần đối với một công việc\"; mục không nhắc nhưng không sai."
  - text: "Lương thử việc ít nhất 85% mức lương của công việc đó (Điều 26)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó."
    verdict: "match"
    note: ""
  - text: "Khi chấm dứt hợp đồng, người sử dụng lao động phải cung cấp bản sao tài liệu liên quan quá trình làm việc nếu người lao động yêu cầu, chi phí do người sử dụng lao động trả (Điều 48 khoản 3 điểm b); dùng để đòi khi bị giữ cả hai bản"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    verdict: "inference"
    note: "Điều khoản đúng nhưng áp dụng \"khi chấm dứt hợp đồng\" và cho \"tài liệu liên quan đến quá trình làm việc\"; mục dùng làm căn cứ cho tình huống công ty giữ cả hai bản trong thời gian còn làm việc là suy luận."
  - text: "Phạt 2-5 triệu (1-10 người lao động) ... 20-25 triệu (từ 301 người) với giao kết không bằng văn bản (từ đủ 01 tháng), sai loại hợp đồng, thiếu nội dung chủ yếu (NĐ 283/2026 Điều 15 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "a) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;\nb) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 11 người đến 50 người lao động;\nc) Từ 10.000.000 đồng đến 15.000.000 đồng đối với vi phạm từ 51 người đến 100 người lao động;\nd) Từ 15.000.000 đồng đến 20.000.000 đồng đối với vi phạm từ 101 người đến 300 người lao động;\nđ) Từ 20.000.000 đồng đến 25.000.000 đồng đối với vi phạm từ 301 người lao động trở lên."
    verdict: "partial"
    note: "Hành vi và con số khớp. Nhưng Điều 7 khoản 1 NĐ 283 (chính mục dẫn trong legal_refs, nhưng không dùng trong thân): \"Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân.\" Điều 15 thuộc Chương II và không nằm trong danh sách ngoại lệ, nên các mức này là mức cá nhân; doanh nghiệp/hợp tác xã bị gấp đôi (4-10 triệu ... 40-50 triệu). Mục \"Chi phí\" viết như mức phạt chung."
  - text: "Phạt 20-25 triệu với giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ hoặc buộc đặt tiền/tài sản bảo đảm (Điều 15 khoản 2 điểm a, b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "2. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:\na) Giữ bản chính giấy tờ tùy thân, văn bằng hoặc chứng chỉ của người lao động khi giao kết hoặc thực hiện hợp đồng lao động;\nb) Buộc người lao động thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện hợp đồng lao động;"
    verdict: "partial"
    note: "Con số khớp; cùng thiếu quy tắc gấp đôi cho tổ chức (Điều 7). Biện pháp buộc trả lại giấy tờ (khoản 3 điểm d) và trả tiền kèm lãi (điểm đ) đúng như mục nêu."
  - text: "Biện pháp buộc giao kết bằng văn bản, đúng loại hợp đồng, trả lại bản chính giấy tờ đã giữ (Điều 15 khoản 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "a) Buộc người sử dụng lao động giao kết hợp đồng lao động bằng văn bản với người lao động khi có hành vi giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên quy định tại khoản 1 Điều này;\n...\nc) Buộc người sử dụng lao động giao kết đúng loại hợp đồng với người lao động đối với hành vi giao kết không đúng loại hợp đồng lao động với người lao động quy định tại khoản 1 Điều này;\nd) Buộc người sử dụng lao động trả lại bản chính giấy tờ tùy thân; văn bằng; chứng chỉ đã giữ của người lao động đối với hành vi vi phạm quy định tại điểm a khoản 2 Điều này;"
    verdict: "match"
    note: ""
internal_checks:
  - issue: "legal_refs có \"Nghị định 283/2026/NĐ-CP Điều 7 khoản 1\" nhưng thân không dùng nội dung điều này (mức phạt cá nhân/tổ chức gấp đôi). Thiếu nội dung làm sai mức phạt hiển thị cho doanh nghiệp (4-10 triệu thay vì 2-5 triệu, v.v.). Lỗi khớp article-claim."
    severity: "error"
  - issue: "tldr/step 2 yêu cầu hợp đồng \"ghi mức đóng bảo hiểm\"; Điều 21 khoản 1 điểm i chỉ yêu cầu nội dung \"Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp\". Mục thân tự nhận \"suy ra\" nhưng tldr/steps không ghi nhãn."
    severity: "warn"
  - issue: "\"Chỉ được ký thêm 01 lần\" hợp đồng xác định thời hạn bỏ các ngoại lệ trong Điều 20 khoản 2 điểm c (giám đốc doanh nghiệp có vốn nhà nước; Điều 149 khoản 1, 151 khoản 2, 177 khoản 4)."
    severity: "warn"
  - issue: "Step 4 \"Trước ngày hợp đồng hết hạn, gửi văn bản đề nghị ký hợp đồng mới\" là lời khuyên thực hành; Điều 20 khoản 2 điểm a quy định hai bên phải ký trong 30 ngày SAU khi hợp đồng hết hạn. Không mâu thuẫn nhưng nên ghi là lời khuyên, kèm câu \"trong thời gian chưa ký hợp đồng mới, quyền, nghĩa vụ thực hiện theo hợp đồng cũ\"."
    severity: "warn"

result: "pass-with-edits"
claims:
  - text: "Bảo lưu thời gian đóng BHXH khi nghỉ việc chưa đủ điều kiện hưởng lương hưu / chưa hưởng BHXH một lần / chưa hưởng trợ cấp hằng tháng (Điều 71)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "Người lao động khi nghỉ việc mà chưa đủ điều kiện để hưởng lương hưu theo quy định tại Điều 64, Điều 65 của Luật này hoặc chưa hưởng bảo hiểm xã hội một lần theo quy định tại Điều 70 của Luật này hoặc chưa hưởng trợ cấp hằng tháng theo quy định tại Điều 23 của Luật này thì được bảo lưu thời gian đóng bảo hiểm xã hội."
    verdict: "match"
    note: "Mục dùng \"và\" nối ba điều kiện; luật dùng \"hoặc\". Không đổi kết luận thực tế."
  - text: "Sổ BHXH cấp cho từng người; bản điện tử và bản giấy có giá trị pháp lý như nhau (Điều 25)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "1. Sổ bảo hiểm xã hội được cấp cho từng người lao động, ...\n2. Sổ bảo hiểm xã hội được cấp bằng bản điện tử, bản giấy và có giá trị pháp lý như nhau."
    verdict: "match"
    note: ""
  - text: "'Đổi tỉnh không làm mất sổ và không buộc phải rút' (suy từ Điều 25)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: ""
    verdict: "inference"
    note: "Điều 25 không nói gì về đổi tỉnh. Kết luận hợp lý từ việc sổ cấp theo từng người nhưng là suy luận; mục để chung câu với nội dung Điều 25."
  - text: "Danh sách đóng các trường hợp được rút BHXH một lần: đủ tuổi hưu chưa đủ 15 năm; định cư nước ngoài; ung thư, bại liệt, xơ gan mất bù, lao nặng, AIDS; suy giảm khả năng lao động từ 81% hoặc khuyết tật đặc biệt nặng; điểm đ (Điều 70 khoản 1)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "a) Đủ tuổi hưởng lương hưu mà chưa đủ 15 năm đóng bảo hiểm xã hội.\nb) Ra nước ngoài để định cư;\nc) Người đang mắc một trong những bệnh ung thư, bại liệt, xơ gan mất bù, lao nặng, AIDS;\nd) Người có mức suy giảm khả năng lao động từ 81% trở lên; người khuyết tật đặc biệt nặng;\nđ) Người lao động có thời gian đóng bảo hiểm xã hội trước ngày Luật này có hiệu lực thi hành, sau 12 tháng không thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc mà cũng không tham gia bảo hiểm xã hội tự nguyện và có thời gian đóng bảo hiểm xã hội chưa đủ 20 năm;\ne) Trường hợp quy định tại các điểm d, đ và e khoản 1 Điều 2 của Luật này khi phục viên, xuất ngũ, thôi việc không thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc mà cũng không tham gia bảo hiểm xã hội tự nguyện và không đủ điều kiện để hưởng lương hưu."
    verdict: "partial"
    note: "Mục nói \"danh sách đóng\" nhưng bỏ điểm e (quân nhân, công an...) và khoản 2 (áp dụng cho khoản 2 Điều 2). Điểm đ nêu \"trước ngày luật có hiệu lực\" mà không ghi mốc (Luật 41/2024 \"có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025\"). Với người đóng trước 01/7/2025, điểm đ thực tế cho rút sau 12 tháng nghỉ nếu <20 năm đóng; mục chỉ nói \"Nghỉ việc bình thường ở tuổi 40 không nằm trong danh sách đó, trừ khi rơi vào điểm đ\" - chưa nêu rằng với đa số người đã đóng trước 7/2025 điều kiện điểm đ là điều kiện phổ biến. Phần mục không sai nhưng dễ gây hiểu lầm."
  - text: "Mức rút một lần: 1,5 tháng/năm đóng trước 2014; 02 tháng/năm từ 2014; chưa đủ một năm thì bằng số tiền đã đóng, không quá 02 tháng (Điều 70 khoản 3)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "a) Bằng 1,5 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội đối với năm đóng trước năm 2014.\n...\nb) Bằng 02 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội đối với năm đóng từ năm 2014 trở đi;\nc) Trường hợp thời gian đóng bảo hiểm xã hội chưa đủ một năm thì mức hưởng bằng số tiền đã đóng nhưng không quá 02 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội."
    verdict: "match"
    note: "Khoản 3 loại trừ số tiền ngân sách hỗ trợ đóng tự nguyện (khoản 4 cho phép tính cả với điểm c, d khoản 1); mục không nhắc, không ảnh hưởng người đọc thông thường."
  - text: "Lương hưu: đủ tuổi theo Điều 169 khoản 2 BLLĐ và có từ đủ 15 năm đóng bắt buộc (Điều 64 khoản 1 điểm a)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "1. Đối tượng quy định tại các điểm a, b, c, g, h, i, k, l, m và n khoản 1 và khoản 2 Điều 2 của Luật này khi nghỉ việc có thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở lên thì được hưởng lương hưu nếu thuộc một trong các trường hợp sau đây:\na) Đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động;"
    verdict: "match"
    note: "Có các điều kiện nghỉ hưu sớm khác (điểm b, c; Điều 65 suy giảm khả năng lao động với 20 năm) mà mục không nhắc; tldr \"phải đủ 15 năm đóng và đủ tuổi\" đúng cho trường hợp thông thường."
  - text: "Nữ: 45% bình quân tiền lương đóng tương ứng 15 năm, mỗi năm thêm 2%, tối đa 75% (Điều 66 khoản 1 điểm a)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "a) Đối với lao động nữ bằng 45% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 2%, mức tối đa bằng 75%;"
    verdict: "match"
    note: ""
  - text: "Nam: 45% tương ứng 20 năm, mỗi năm thêm 2%, tối đa 75%; nam đóng 15 đến dưới 20 năm: 40% tại 15 năm, mỗi năm thêm 1% (Điều 66 khoản 1 điểm b)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "b) Đối với lao động nam bằng 45% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 20 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 2%, mức tối đa bằng 75%.\nTrường hợp lao động nam có thời gian đóng bảo hiểm xã hội từ đủ 15 năm đến dưới 20 năm, mức lương hưu hằng tháng bằng 40% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 1%."
    verdict: "match"
    note: ""
  - text: "Trợ cấp một lần khi nghỉ hưu: 0,5 tháng bình quân cho mỗi năm đóng vượt 35 năm (nam)/30 năm (nữ); và '02 lần mức đó' với những năm đóng sau tuổi nghỉ hưu (Điều 68)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "2. Mức hưởng trợ cấp một lần cho mỗi năm đóng cao hơn quy định tại khoản 1 Điều này bằng 0,5 lần của mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này cho mỗi năm đóng cao hơn đến tuổi nghỉ hưu theo quy định của pháp luật.\nTrường hợp người lao động đã đủ điều kiện hưởng lương hưu theo quy định tại Điều 64 và Điều 65 của Luật này mà tiếp tục đóng bảo hiểm xã hội thì mức trợ cấp bằng 02 lần của mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này cho mỗi năm đóng cao hơn số năm quy định tại khoản 1 Điều này kể từ sau thời điểm đủ tuổi nghỉ hưu theo quy định của pháp luật đến thời điểm nghỉ hưu."
    verdict: "partial"
    note: "Luật: 0,5 lần và 02 lần \"mức bình quân tiền lương\" (cùng đơn vị). Câu của mục \"bằng 02 lần mức đó\" (mức đó = 0,5 tháng) bị hiểu thành 1 tháng thay vì 02 tháng bình quân. Phần này không nằm trong tldr nhưng là con số trong thân."
  - text: "Tuổi nghỉ hưu từ 2021: nam 60 tuổi 03 tháng, nữ 55 tuổi 04 tháng; mỗi năm thêm 03 tháng (nam) và 04 tháng (nữ); đến 62 tuổi vào 2028 và 60 tuổi vào 2035 (Điều 169 khoản 2 BLLĐ)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "2. Tuổi nghỉ hưu của người lao động trong điều kiện lao động bình thường được điều chỉnh theo lộ trình cho đến khi đủ 62 tuổi đối với lao động nam vào năm 2028 và đủ 60 tuổi đối với lao động nữ vào năm 2035. \nKể từ năm 2021, tuổi nghỉ hưu của người lao động trong điều kiện lao động bình thường là đủ 60 tuổi 03 tháng đối với lao động nam và đủ 55 tuổi 04 tháng đối với lao động nữ; sau đó, cứ mỗi năm tăng thêm 03 tháng đối với lao động nam và 04 tháng đối với lao động nữ."
    verdict: "match"
    note: "Điều 169 khoản 3, 4 (nghỉ sớm/muộn tối đa 05 tuổi) không được nhắc; tldr nêu 61 tuổi 6 tháng/57 tuổi mà không ghi \"điều kiện lao động bình thường\"."
  - text: "Năm 2026: nam 61 tuổi 6 tháng, nữ 57 tuổi (suy ra từ Điều 169 khoản 2)"
    source_url: "https://xaydungchinhsach.chinhphu.vn/tra-cuu-tuoi-nghi-huu-thoi-diem-nghi-huu-cua-nguoi-lao-dong-theo-nam-sinh-119241029170451525.htm"
    quote: "Năm 2026, độ tuổi nghỉ hưu của người lao động nam là 61 tuổi 6 tháng, lao động nữ là 57 tuổi."
    verdict: "inference"
    note: "Phép tính: nam 60 tuổi 03 tháng + 5 năm x 03 tháng = 61 tuổi 6 tháng; nữ 55 tuổi 04 tháng + 5 x 04 tháng = 57 tuổi 0 tháng; khớp. Quote là tóm tắt của báo Chinhphu.vn (thứ cấp, không phải chữ của Điều 169), nên giữ inference; mục tự gắn nhãn \"suy ra\"."
  - text: "Người đang hưởng trợ cấp thất nghiệp được chuyển nơi hưởng khi có nhu cầu (Luật Việc làm 74/2025 Điều 41 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    quote: "1. Trong thời gian hưởng trợ cấp thất nghiệp, người lao động được chuyển nơi hưởng trợ cấp thất nghiệp khi có nhu cầu."
    verdict: "match"
    note: "Câu \"nên đổi tỉnh giữa chừng không mất tháng trợ cấp còn lại\" là suy luận (luật chỉ nói được chuyển nơi hưởng)."
  - text: "Điều kiện hưởng trợ cấp thất nghiệp: đóng BHTN từ đủ 12 tháng trong 24 tháng trước khi chấm dứt hợp đồng, nộp hồ sơ trong 03 tháng (Điều 38 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    quote: "a) Chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc theo quy định của pháp luật mà không thuộc một trong các trường hợp người lao động đơn phương chấm dứt hợp đồng lao động trái pháp luật theo quy định của Bộ luật Lao động hoặc người lao động nghỉ việc khi đủ điều kiện hưởng lương hưu.\nb) Đã đóng bảo hiểm thất nghiệp từ đủ 12 tháng trở lên trong thời gian 24 tháng trước khi chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc theo quy định của pháp luật.\nTrường hợp người lao động làm việc theo hợp đồng lao động có thời hạn từ đủ 01 tháng đến dưới 12 tháng thì phải đóng đủ 12 tháng trở lên trong thời gian 36 tháng trước khi chấm dứt hợp đồng lao động.\nc) Đã nộp đủ hồ sơ hưởng trợ cấp thất nghiệp trong thời hạn 03 tháng kể từ ngày chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc."
    verdict: "partial"
    note: "Thân mục bỏ: ngoại lệ 36 tháng cho hợp đồng từ 01 đến dưới 12 tháng, và điều kiện (d) không có việc làm/không thuộc các trường hợp loại trừ trong 10 ngày làm việc. Điểm a nằm trong Ghi chú Bẫy 3 nhưng không ở phần điều kiện. Không sai nhưng thiếu."
  - text: "Mức hưởng 60% bình quân 6 tháng đóng BHTN gần nhất, trần 05 lần mức lương tối thiểu vùng, thời gian hưởng tối đa 12 tháng (Điều 39 khoản 1, 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    quote: "1. Mức hưởng trợ cấp thất nghiệp hằng tháng bằng 60% mức bình quân tiền lương tháng đóng bảo hiểm thất nghiệp của 06 tháng đã đóng bảo hiểm thất nghiệp gần nhất trước khi chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc nhưng tối đa không quá 05 lần mức lương tối thiểu tháng theo vùng do Chính phủ công bố được áp dụng tại tháng cuối cùng đóng bảo hiểm thất nghiệp.\n2. ... nhưng thời gian hưởng trợ cấp thất nghiệp tối đa 12 tháng."
    verdict: "match"
    note: ""
  - text: "Nghỉ ngang không báo trước: mất trợ cấp thôi việc, bồi thường nửa tháng lương và tiền lương những ngày không báo trước (Điều 40 BLLĐ)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Không được trợ cấp thôi việc.\n2. Phải bồi thường cho người sử dụng lao động nửa tháng tiền lương theo hợp đồng lao động và một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước."
    verdict: "match"
    note: "Điều 40 là \"Nghĩa vụ của người lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật\" (kèm khoản 3 hoàn trả chi phí đào tạo). Mục không nêu số ngày báo trước (Điều 35 khoản 1: 45/30/03 ngày) nên step 3 thiếu cơ sở số liệu."
  - text: "'Phần lớn người rút tiêu hết trong vòng một năm' (Chi phí)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: ""
    verdict: "not-found"
    note: "Câu thống kê không có nguồn trong mục hoặc nguồn dẫn."
  - text: "'Người thiếu vài năm có thể đóng tiếp tự nguyện cho đủ' 15 năm (Bẫy 1)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    quote: "Người tham gia bảo hiểm xã hội tự nguyện được hưởng lương hưu khi đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động và có thời gian đóng bảo hiểm xã hội từ đủ 15 năm trở lên. (Điều 98)"
    verdict: "inference"
    note: "Điều 64 (được mục dẫn) ghi \"thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm\", không nói tự nguyện cộng vào. Điều 98 (không được dẫn) quy định lương hưu cho người tham gia tự nguyện \"có thời gian đóng bảo hiểm xã hội từ đủ 15 năm\". Khẳng định gần đúng nhưng điều luật mục dẫn không hỗ trợ; cần dẫn Điều 98 và kiểm cách cộng thời gian bắt buộc + tự nguyện."
internal_checks:

suggested_edits:
  - "Điều 68 (Pháp luật > Lương hưu): viết \"0,5 lần mức bình quân tiền lương làm căn cứ đóng BHXH cho mỗi năm đóng vượt 35 năm (nam)/30 năm (nữ) đến tuổi nghỉ hưu; 02 lần mức bình quân tiền lương đó cho mỗi năm đóng sau tuổi nghỉ hưu\". Dựa vào quote Điều 68 khoản 2."
  - "Điều 70 khoản 1: thêm điểm e và ghi \"khoản 1 áp dụng cho người thuộc khoản 1 Điều 2; khoản 2 cho khoản 2 Điều 2\", bỏ cụm \"danh sách đóng\" hoặc liệt kê đủ; ở điểm đ ghi \"trước ngày 01/7/2025\"."
  - "Step 3 và Bẫy 3: nêu số ngày báo trước (Điều 35 khoản 1: ít nhất 45 ngày/30 ngày/03 ngày làm việc tùy loại hợp đồng) và thêm Điều 35 vào legal_refs."
  - "Xóa hoặc dẫn nguồn cho câu \"Phần lớn người rút tiêu hết trong vòng một năm\"."
  - "Bẫy 1: dẫn thêm Điều 98 Luật BHXH 41/2024 cho đóng tự nguyện, hoặc bỏ câu \"đóng tiếp tự nguyện cho đủ\"."
  - "Điều kiện trợ cấp thất nghiệp: thêm \"với hợp đồng 01 đến dưới 12 tháng thì 12 tháng trong 36 tháng\" và loại trừ nghỉ khi đủ điều kiện hưởng lương hưu; tldr tuổi hưu ghi \"điều kiện lao động bình thường\"."

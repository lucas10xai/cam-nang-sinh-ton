validity:
  doc: "Luật BHXH 41/2024/QH15; Luật Việc làm 74/2025/QH15; BLLĐ 45/2019/QH14 (VBHN 18/VBHN-VPQH)"
  in_force: true
  effective_from: "2025-07-01 (Luật BHXH); 2026-01-01 (Luật Việc làm); 2021-01-01 (BLLĐ)"
  amended_by: []
  basis: "Luật BHXH: Điều hiệu lực \"Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025\" (bản Công báo 987+988); Luật Việc làm Điều 54 khoản 1 \"có hiệu lực thi hành từ ngày 01 tháng 01 năm 2026\" và khoản 2 cho Luật Việc làm 2013 hết hiệu lực. NĐ 283/2026/NĐ-CP (15/07/2026) lấy cả \"Luật Việc làm số 74/2025/QH15\", \"Luật Bảo hiểm xã hội số 41/2024/QH15\" và \"Bộ luật Lao động số 45/2019/QH14\" làm căn cứ, nên cả ba còn hiệu lực ít nhất tới 15/07/2026. VBHN 18 (12/02/2026) cho BLLĐ. Không tìm thấy luật sửa đổi Luật BHXH/Việc làm sau đó (kết quả tìm kiếm không đưa ra, nhưng đây chỉ là bằng chứng vắng mặt; counter \"sửa đổi\" của Công báo hiển thị 0 cho mọi văn bản nên không dùng)."

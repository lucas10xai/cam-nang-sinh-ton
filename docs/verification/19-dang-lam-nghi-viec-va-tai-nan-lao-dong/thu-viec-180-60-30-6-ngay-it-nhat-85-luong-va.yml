    note: BLLĐ Điều 26. Câu "tính trên mức lương công việc, không tính trên lương tối thiểu vùng" là diễn giải hợp lý, không phải chữ của luật.
  - text: Hết thời gian thử việc phải thông báo kết quả; đạt thì tiếp tục hợp đồng/phải giao kết hợp đồng; không đạt thì chấm dứt
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Khi kết thúc thời gian thử việc, người sử dụng lao động phải thông báo kết quả thử việc cho người lao động. Trường hợp thử việc đạt yêu cầu thì người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động hoặc phải giao kết hợp đồng lao động đối với trường hợp giao kết hợp đồng thử việc.
    verdict: match
    note: BLLĐ Điều 27 khoản 1.
  - text: Trong thời gian thử việc mỗi bên có quyền hủy bỏ không cần báo trước, không phải bồi thường; người lao động rời đi không mất trợ cấp
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Trong thời gian thử việc, mỗi bên có quyền hủy bỏ hợp đồng thử việc hoặc hợp đồng lao động đã giao kết mà không cần báo trước và không phải bồi thường.
    verdict: inference
    note: BLLĐ Điều 27 khoản 2 khớp phần "không báo trước, không bồi thường". Vế "không mất trợ cấp" không có trong Điều 27; trợ cấp thôi việc chỉ phát sinh khi làm đủ 12 tháng (Điều 46), nên thử việc không có trợ cấp để "mất".
  - text: Phải giao kết hợp đồng lao động trước khi nhận người vào làm việc
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Trước khi nhận người lao động vào làm việc thì người sử dụng lao động phải giao kết hợp đồng lao động với người lao động.
    verdict: match
    note: BLLĐ Điều 13 khoản 2.
  - text: Hợp đồng phải bằng văn bản, 02 bản, mỗi bên giữ 01 bản
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này.
    verdict: partial
    note: "BLLĐ Điều 14 khoản 1. Mục bỏ ngoại lệ khoản 2: hợp đồng dưới 01 tháng có thể bằng lời nói (trừ các trường hợp Điều 18 khoản 2...), và hợp đồng điện tử tương đương văn bản."
  - text: "Hợp đồng xác định thời hạn hết hạn mà vẫn làm: trong 30 ngày phải ký mới, quá 30 ngày thành không xác định thời hạn; chỉ ký thêm 01 lần hợp đồng xác định thời hạn"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; ... Nếu hết thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn mà hai bên không ký kết hợp đồng lao động mới thì hợp đồng đã giao kết theo quy định tại điểm b khoản 1 Điều này trở thành hợp đồng lao động không xác định thời hạn; c) Trường hợp hai bên ký kết hợp đồng lao động mới là hợp đồng lao động xác định thời hạn thì cũng chỉ được ký thêm 01 lần, sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn, trừ hợp đồng lao động đối với người được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước
    verdict: partial
    note: BLLĐ Điều 20 khoản 2. Đúng cho hợp đồng xác định thời hạn hết hạn; mục bỏ ngoại lệ (giám đốc DN có vốn nhà nước, Điều 149 khoản 1, 151 khoản 2, 177 khoản 4). Xem claim sau về việc áp vào thử việc.
  - text: 'Step 4 / Bẫy 3: "Thử việc xong mà chưa có hợp đồng ... đối chiếu Điều 20 khoản 2 (30 ngày, thêm 01 lần)"; "Điều 20 khoản 2 buộc trong 30 ngày phải ký hợp đồng mới" khi hết thử việc công ty không ký'
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Khi hợp đồng lao động quy định tại điểm b khoản 1 Điều này hết hạn mà người lao động vẫn tiếp tục làm việc thì thực hiện như sau: | Trường hợp thử việc đạt yêu cầu thì ... hoặc phải giao kết hợp đồng lao động đối với trường hợp giao kết hợp đồng thử việc."
    verdict: mismatch
    note: Điều 20 khoản 2 chỉ áp dụng khi "hợp đồng lao động quy định tại điểm b khoản 1" (xác định thời hạn, ≤ 36 tháng) hết hạn. Thử việc xong mà chưa ký hợp đồng thì căn cứ là Điều 27 khoản 1 (phải giao kết hợp đồng lao động) và Điều 13 khoản 2, không có cơ chế "30 ngày, quá hạn thành không xác định thời hạn" như Điều 20.2 cho trường hợp này. Hợp đồng thử việc không thuộc điểm b khoản 1.
  - text: "Phạt 2–5 triệu (bốn hành vi: thử việc quá 01 lần; quá thời gian/vượt Điều 25; lương thử việc thấp hơn thỏa thuận hoặc dưới 85%; không giao kết hợp đồng khi thử việc đạt); 500 nghìn–1 triệu (thử việc với hợp đồng dưới 01 tháng; không thông báo kết quả)"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: "Phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: a) Thử việc đối với người lao động làm việc theo hợp đồng lao động có thời hạn dưới 01 tháng; b) Không thông báo kết quả thử việc cho người lao động khi thời gian thử việc kết thúc. 2. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: a) Yêu cầu người lao động thử việc quá 01 lần đối với một công việc; b) Thử việc quá thời gian thỏa thuận hoặc vượt quá điều kiện quy định tại Điều 25 của Bộ luật Lao động; c) Trả lương thử việc thấp hơn thỏa thuận hoặc thấp hơn 85% mức lương của công việc đó; d) Không giao kết hợp đồng lao động khi thử việc đạt yêu cầu"
    verdict: match
    note: NĐ 283 Điều 16 khoản 1, 2. Mức cá nhân; tổ chức gấp 02 lần theo Điều 7 khoản 1, Điều 16 không thuộc ngoại lệ.
  - text: 'Chi phí: bốn hành vi đều "bị buộc trả đủ tiền lương của công việc đó"; thân bài tách "buộc trả đủ lương và buộc giao kết hợp đồng"'
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: 3. Biện pháp khắc phục hậu quả a) Buộc người sử dụng lao động trả đủ tiền lương của công việc đó cho người lao động khi có hành vi vi phạm quy định tại điểm a khoản 1, điểm a, b, c khoản 2 Điều này; b) Buộc người sử dụng lao động giao kết hợp đồng lao động với người lao động khi có hành vi vi phạm quy định tại điểm d khoản 2 Điều này.
    verdict: partial
    note: NĐ 283 Điều 16 khoản 3. Hành vi "không giao kết hợp đồng khi thử việc đạt" (điểm d) bị buộc giao kết hợp đồng, không phải buộc trả đủ lương; buộc trả đủ lương còn áp dụng cả hành vi khoản 1 điểm a (thử việc với hợp đồng dưới 01 tháng). Mục "Chi phí" gộp sai; thân bài đúng hơn.
  - text: "Giao kết hợp đồng không bằng văn bản với công việc từ đủ 01 tháng: phạt 2–5 triệu, buộc giao kết bằng văn bản"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên; ... a) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; | a) Buộc người sử dụng lao động giao kết hợp đồng lao động bằng văn bản với người lao động khi có hành vi giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên
    verdict: match
    note: NĐ 283 Điều 15 khoản 1 điểm a, khoản 3 điểm a. Điều 15 còn có các bậc cao hơn theo số người.
  - text: 'Bẫy 2 / Step 2: lương thực nhận ít nhất 85%, "mọi khoản khấu trừ có trong hợp đồng, có bảng kê"; "mọi khoản khấu trừ phải nằm trong hợp đồng, có bảng kê theo Điều 95 khoản 3"'
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Người sử dụng lao động chỉ được khấu trừ tiền lương của người lao động để bồi thường thiệt hại do làm hư hỏng dụng cụ, thiết bị, tài sản của người sử dụng lao động theo quy định tại Điều 129 của Bộ luật này. | Mức khấu trừ tiền lương hằng tháng không được quá 30% tiền lương thực trả hằng tháng của người lao động
    verdict: mismatch
    note: BLLĐ Điều 102 khoản 1, 3. Pháp luật chỉ cho khấu trừ để bồi thường thiệt hại theo Điều 129 và tối đa 30% lương thực trả hằng tháng; tiền ăn, đồng phục, "đào tạo" ghi trong hợp đồng không tự hợp pháp. Điều 95 khoản 3 chỉ buộc thông báo bảng kê ghi nội dung và số tiền bị khấu trừ, không nói khoản khấu trừ hợp pháp nếu có trong hợp đồng.

claims:
  - text: Thời gian thử việc do hai bên thỏa thuận; chỉ thử việc một lần cho một công việc; không quá 180 ngày với công việc của người quản lý doanh nghiệp
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Thời gian thử việc do hai bên thỏa thuận căn cứ vào tính chất và mức độ phức tạp của công việc nhưng chỉ được thử việc một lần đối với một công việc và bảo đảm điều kiện sau đây: 1. Không quá 180 ngày đối với công việc của người quản lý doanh nghiệp theo quy định của Luật Doanh nghiệp, Luật Quản lý, sử dụng vốn nhà nước đầu tư vào sản xuất, kinh doanh tại doanh nghiệp;"
    verdict: partial
    note: BLLĐ Điều 25. Số liệu khớp, nhưng "người quản lý doanh nghiệp" phải hiểu theo Luật Doanh nghiệp/Luật Quản lý vốn nhà nước (người đại diện theo pháp luật, giám đốc, thành viên HĐQT...), không phải mọi "quản lý" (trưởng bộ phận). Mục không nêu giới hạn này.
  - text: Không quá 60 ngày (cao đẳng trở lên); 30 ngày (trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ); 06 ngày làm việc (công việc khác)
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: 2. Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên; 3. Không quá 30 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ; 4. Không quá 06 ngày làm việc đối với công việc khác.
    verdict: match
    note: BLLĐ Điều 25 khoản 2, 3, 4.
  - text: Không áp dụng thử việc với hợp đồng có thời hạn dưới 01 tháng
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Không áp dụng thử việc đối với người lao động giao kết hợp đồng lao động có thời hạn dưới 01 tháng.
    verdict: match
    note: BLLĐ Điều 24 khoản 3.
  - text: Lương thử việc ít nhất 85% mức lương của công việc đó
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó.

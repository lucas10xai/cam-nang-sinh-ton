  basis: 'Bản Công báo số 131 (28/02/2026), ký 05/03/2026, là văn bản hợp nhất BLLĐ gồm các sửa đổi tới 01/7/2026. NĐ 283 (Công báo số 448, 28/07/2026) vẫn ghi "Căn cứ Bộ luật Lao động số 45/2019/QH14" và Điều 66 khoản 1: "Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026", đã qua ngày 08/11/2026; Điều 66 khoản 4 cho NĐ 12/2022/NĐ-CP hết hiệu lực. Không thấy văn bản sửa NĐ 283 trên trang Công báo (mục quan hệ văn bản hiển thị [0], chưa chắc đã cập nhật).'
deliberate_vn_deviation: []
potential_harm:
  - 'Steps[1] "kiểm tra ... mọi khoản khấu trừ có trong hợp đồng, có bảng kê" và Bẫy 2: người đọc có thể chấp nhận các khoản khấu trừ ghi trong hợp đồng (tiền ăn, đồng phục, "đào tạo") là hợp pháp trong khi Điều 102 khoản 1 chỉ cho khấu trừ để bồi thường thiệt hại theo Điều 129 (tối đa 30%/tháng) — làm mất cơ hội đòi lại tiền lương.'
  - "Steps[3] và Bẫy 3: dẫn Điều 20 khoản 2 như quyền sau thử việc; người đọc có thể chờ 30 ngày hoặc tin hợp đồng tự thành không xác định thời hạn trong khi căn cứ đúng là Điều 27 khoản 1 (phải giao kết hợp đồng), có thể bỏ lỡ việc đòi giao kết ngay."
suggested_edits:
  - 'Steps[1] và Bẫy 2: bỏ "mọi khoản khấu trừ có trong hợp đồng"; viết "Khoản khấu trừ chỉ hợp pháp khi để bồi thường thiệt hại do làm hư hỏng dụng cụ, thiết bị, tài sản theo Điều 129, tối đa 30% lương thực trả hằng tháng sau khi trừ bảo hiểm và thuế (Điều 102 khoản 1, 3); bảng kê theo Điều 95 khoản 3 phải ghi rõ nội dung và số tiền khấu trừ". Thêm Điều 102 vào legal_refs.'
  - 'Steps[3] và Bẫy 3: tách hai trường hợp. (a) Thử việc đạt mà không ký: Điều 27 khoản 1 ("phải giao kết hợp đồng lao động") + Điều 13 khoản 2 + phạt Điều 16 khoản 2 điểm d NĐ 283. (b) Hợp đồng xác định thời hạn hết hạn mà vẫn làm: Điều 20 khoản 2 (30 ngày, thêm 01 lần, ngoại lệ giám đốc DN có vốn nhà nước).'
  - 'Chi phí/NĐ 283: sửa "buộc trả đủ tiền lương" để chỉ áp dụng cho khoản 1 điểm a và khoản 2 điểm a, b, c; điểm d là buộc giao kết hợp đồng (Điều 16 khoản 3).'
  - 'Điều 25 khoản 1: ghi "người quản lý doanh nghiệp theo Luật Doanh nghiệp, Luật Quản lý, sử dụng vốn nhà nước đầu tư vào sản xuất, kinh doanh tại doanh nghiệp", tránh hiểu mọi chức danh quản lý.'
  - Xóa hoặc gắn nguồn cho ý "nửa năm ấy không có bảo hiểm thất nghiệp" và "thời gian thử việc không được tính vào hợp đồng chính".

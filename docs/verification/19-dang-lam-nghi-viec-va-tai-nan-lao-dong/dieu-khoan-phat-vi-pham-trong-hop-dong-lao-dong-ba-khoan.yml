suggested_edits:
  - "tldr và 'Nói dễ hiểu': sau 'Chỉ ba khoản được đòi' thêm điều kiện: 'trần 03 tháng lương chỉ áp cho thiệt hại không nghiêm trọng do sơ suất, giá trị không quá 10 tháng lương tối thiểu vùng; làm mất tài sản hoặc tiêu hao vật tư quá định mức thì bồi thường một phần hoặc toàn bộ theo Điều 129 khoản 2'. Dựa vào quote Điều 129 khoản 1 đoạn 2 và khoản 2."
  - "Thêm Điều 129 khoản 2 và Điều 130 khoản 1 vào legal_refs và phần Pháp luật VN (bồi thường căn cứ lỗi, mức thiệt hại thực tế, hoàn cảnh gia đình)."
  - "Điều 41: sửa dòng 'Nếu hai bên thỏa thuận chấm dứt...' thành 'Nếu người sử dụng lao động không muốn nhận lại và người lao động đồng ý thì ngoài các khoản ở khoản 1 và trợ cấp thôi việc, hai bên thỏa thuận khoản bồi thường thêm ít nhất 02 tháng lương (Điều 41 khoản 3)'."
  - "Phần 'Hai chỗ duy nhất tiền phạt ... còn đứng được' và Bẫy 3: đổi 'tiền phạt' thành 'bồi thường theo thỏa thuận bí mật kinh doanh (Điều 21 khoản 2)' và 'hoàn trả chi phí đào tạo (Điều 62, Điều 40 khoản 3)'; bỏ hoặc gắn nhãn 'theo cách hiểu của chúng tôi' cho câu 'chỉ có giá trị khi bên kia tự nguyện trả' và 'Điều 418 không mở đường cho phạt trong hợp đồng lao động'."
  - "steps bước 2: thay 'ba trần: 30% lương tháng, 03 tháng lương, 10 tháng lương tối thiểu vùng' bằng 'hai trần (30% lương thực trả mỗi tháng; 03 tháng lương) và một điều kiện áp dụng (thiệt hại dưới 10 tháng lương tối thiểu vùng, do sơ suất, không nghiêm trọng)'."
  - "Bẫy 1: thêm 'cộng chi phí đào tạo nếu có hợp đồng đào tạo nghề theo Điều 62 (Điều 40 khoản 3)' và bỏ vế 'không phải nộp lại tiền thưởng' nếu không có nguồn."
  - "Phần Chi phí 'Phạt hành chính 20.000.000 đến 40.000.000 đồng; doanh nghiệp gấp đôi': có thể ghi rõ '40.000.000 đến 80.000.000 đồng với doanh nghiệp (Điều 7 khoản 1 NĐ 283/2026)'."

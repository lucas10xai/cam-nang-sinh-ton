    verdict: match
    quote: "Đối tượng quy định tại khoản 1 Điều 2 của Luật này khi chết hoặc bị Tòa án tuyên bố là đã chết thuộc một trong các trường hợp sau đây thì thân nhân quy định tại khoản 2 Điều này được hưởng tiền tuất hằng tháng: a) Có thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở lên; [...] c) Chết do tai nạn lao động, bệnh nghề nghiệp theo quy định của pháp luật về an toàn, vệ sinh lao động;"
    note: Kết luận của mục là suy ra hợp lý từ cấu trúc 'thuộc một trong các trường hợp'; chữ luật không nói 'không áp 15 năm'. Giữ match vì cấu trúc điều khoản rõ.
  - text: Không thuộc diện hằng tháng thì xét tuất một lần, tính theo số năm đóng, không thấp hơn 03 tháng mức bình quân tiền lương làm căn cứ đóng (Điều 88, 89)
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm

claims:
  - text: "Khoản 1: thân nhân hưởng một lần 36 lần lương cơ sở tại tháng chết, kèm chế độ tử tuất theo Luật BHXH, khi đang làm việc/chết trong điều trị lần đầu/chết trong điều trị chưa giám định (Điều 53)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: "Thân nhân người lao động được hưởng trợ cấp một lần bằng ba mươi sáu lần mức lương cơ sở tại tháng người lao động bị chết và được hưởng chế độ tử tuất theo quy định của Luật Bảo hiểm xã hội khi thuộc một trong các trường hợp sau đây: 1. Người lao động đang làm việc bị chết do tai nạn lao động, bệnh nghề nghiệp; 2. Người lao động bị chết trong thời gian điều trị lần đầu do tai nạn lao động, bệnh nghề nghiệp; 3. Người lao động bị chết trong thời gian điều trị thương tật, bệnh tật mà chưa được giám định mức suy giảm khả năng lao động"
    note: ""
  - text: Lương cơ sở 2.530.000 đ từ 01/7/2026 nên 36 lần = 91.080.000 đ (Điều 3 khoản 2, NĐ 161/2026/NĐ-CP)
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/5/161-ndcp.signed.pdf
    verdict: match
    quote: Từ ngày 01 tháng 7 năm 2026, mức lương cơ sở là 2.530.000 đồng/tháng.
    note: "Bản ký số là ảnh quét, không trích chữ được; đã OCR (Apple Vision) trang 3 và đọc lại: dòng này đọc rõ, khớp bản tin BHXH Việt Nam (baohiemxahoi.gov.vn) nói lương cơ sở 2.530.000 đ/tháng từ 01/7/2026. Phép nhân trong mục (5×2.530.000=12.650.000; 17,5×=44.275.000; 36×=91.080.000; 30%×=759.000; 168%×=4.250.400) đã tính lại và đúng."
  - text: "Khoản 2: mai táng 10 lần mức tham chiếu tại tháng chết khi chết do TNLĐ, BNN (Điều 85 khoản 1 điểm b, khoản 2, Luật BHXH 41/2024)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm
    verdict: match
    quote: Chết do tai nạn lao động, bệnh nghề nghiệp theo quy định của pháp luật về an toàn, vệ sinh lao động; [...] Mức trợ cấp mai táng bằng 10 lần mức tham chiếu tại tháng mà người quy định tại khoản 1 Điều này chết.
    note: "Nguồn: xaydungchinhsach.chinhphu.vn (cổng chính phủ, không phải Công báo)."
  - text: Mức tham chiếu bằng 2.530.000 đ ('mức tham chiếu cùng mức đó') nên mai táng = 25.300.000 đ
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-41-2024-qh15-bao-hiem-xa-hoi-119240723163650489.htm

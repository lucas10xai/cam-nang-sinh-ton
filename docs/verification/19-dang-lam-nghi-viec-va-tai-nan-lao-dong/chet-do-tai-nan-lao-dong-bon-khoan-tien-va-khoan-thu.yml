  - "Mốc 90 ngày: nêu điều kiện 'người lao động đang tham gia BHXH bắt buộc' và thêm Điều 92 khoản 1 (nộp quá hạn phải có văn bản giải trình) để người đọc không hiểu là mất quyền."

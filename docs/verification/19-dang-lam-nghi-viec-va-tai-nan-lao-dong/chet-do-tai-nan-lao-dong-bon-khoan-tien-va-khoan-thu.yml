    quote: "Thân nhân của đối tượng quy định tại khoản 1 Điều này được hưởng trợ cấp tuất hằng tháng, bao gồm: a) Các con [...] hưởng đến khi đủ 18 tuổi; b) Con bị suy giảm khả năng lao động từ 81% trở lên; c) Vợ, chồng đủ tuổi theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động. [...]"
    note: Điều 86 khoản 2–3 đặt điều kiện thân nhân (tuổi, suy giảm ≥81%, nghĩa vụ nuôi dưỡng) và loại trừ người có thu nhập ≥ mức tham chiếu; không đủ điều kiện thì xét tuất một lần. Nói dễ hiểu liệt kê '1.265.000 đồng mỗi thân nhân' như quyền mặc nhiên; chỉ cuối bài có câu 'căn cứ vào quan hệ và mức suy giảm…' (nhưng lại ghi nhầm 'mức suy giảm của thân nhân theo Điều 86' không nêu hết điều kiện tuổi/nuôi dưỡng).
  - text: Điều kiện 15 năm đóng không áp cho chết do TNLĐ vì điểm c khoản 1 Điều 86 là căn cứ riêng

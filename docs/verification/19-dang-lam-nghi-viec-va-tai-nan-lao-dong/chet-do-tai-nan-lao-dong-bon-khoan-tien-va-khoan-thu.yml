    quote: Khi chưa bãi bỏ mức lương cơ sở thì mức tham chiếu quy định tại Luật này bằng mức lương cơ sở. Tại thời điểm mức lương cơ sở bị bỏ thì mức tham chiếu không thấp hơn mức lương cơ sở đó.
    note: Mục dẫn Điều 3 khoản 2 NĐ 161/2026 (chỉ nêu lương cơ sở) và Điều 7 Luật BHXH (nói mức tham chiếu do Chính phủ quyết định). Việc mức tham chiếu = lương cơ sở đến từ Điều 141 khoản 13 Luật BHXH 41/2024 (đã trích), mục không dẫn. legal_refs cần thêm điều này; số 25.300.000 đúng nếu điều này còn áp dụng.
  - text: "Khoản 3: tuất hằng tháng 50% mức tham chiếu mỗi thân nhân, 70% khi không có người trực tiếp nuôi dưỡng, tối đa 04 thân nhân/người chết (Điều 86 khoản 1 điểm c, Điều 87)"

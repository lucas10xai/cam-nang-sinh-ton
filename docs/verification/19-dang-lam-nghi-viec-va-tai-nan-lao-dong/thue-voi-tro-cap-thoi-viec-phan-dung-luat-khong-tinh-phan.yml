claims:
  - text: "Trợ cấp thôi việc, trợ cấp mất việc làm không thuộc thu nhập chịu thuế từ tiền lương, tiền công (Luật TNCN 109/2025 Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: "c) Các khoản phụ cấp, trợ cấp, thu nhập khác trừ các khoản: ... trợ cấp hưu trí một lần, trợ cấp tuất hàng tháng và các khoản trợ cấp khác theo quy định của pháp luật về bảo hiểm xã hội; trợ cấp thôi việc, trợ cấp mất việc làm; trợ cấp mang tính chất bảo trợ xã hội và các khoản phụ cấp, trợ cấp, thu nhập khác không mang tính chất tiền lương, tiền công do Chính phủ quy định."
    verdict: "match"
    note: "Đọc từ DOCX trên trang Công báo (PDF ký của datafiles/congbaocdn là ảnh quét). Điều 3 khoản 2 là \"Thu nhập từ tiền lương, tiền công\"; lưu ý câu cuối còn giao Chính phủ quy định thêm; Chính phủ đã ban hành NĐ 253/2026/NĐ-CP (mục không dẫn, xem dòng dưới)."
  - text: "Trợ cấp thôi việc trả đúng pháp luật lao động nằm ngoài thu nhập chịu thuế, không ngưỡng, không hạn mức (suy ra từ Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: "trợ cấp thôi việc, trợ cấp mất việc làm;"
    verdict: "inference"
    note: "Luật không ghi điều kiện hay hạn mức cho hai khoản này nên suy luận đúng cho khoản trả đúng luật; mục đã gắn nhãn \"suy ra\". Cần đọc cùng NĐ 253/2026/NĐ-CP (xem dòng dưới)."
  - text: "Phần trợ cấp trả thêm ngoài quy định của luật lao động (tự nguyện, thỏa thuận, 'hỗ trợ') vẫn vào thu nhập chịu thuế; 'Bẫy 1': không có mức miễn riêng cho phần vượt; tldr: 'khoản trả thêm (tính thuế)'"
    source_url: "https://sme.misa.vn/349075/nghi-dinh-253-ve-thue-tncn/"
    quote: "Điểm h khoản 3 điều 8 nghị định 253/2026/NĐ-CP quy định: Điều 8. ... 3. Các khoản phụ cấp, trợ cấp, thu nhập khác, trừ các khoản sau: ... h) Trợ cấp khó khăn đột xuất, trợ cấp thất nghiệp, trợ cấp thôi việc, trợ cấp mất việc làm theo quy định của pháp luật Trường hợp tổ chức, doanh nghiệp có quy định cụ thể tại quy chế tài chính hoặc quy chế nội bộ hoặc hợp đồng lao động hoặc thỏa ước lao động về mức trợ cấp thôi việc, trợ cấp mất việc làm cao hơn mức quy định của pháp luật thì phần chi trả thực tế vượt mức này cũng không tính vào thu nhập chịu thuế của người lao động"
    verdict: "mismatch"
    note: "CHỮ TRÍCH LÀ TỪ BẢN SAO THỨ CẤP (MISA SME trích điểm h khoản 3 Điều 8 NĐ 253/2026/NĐ-CP ngày 30/6/2026, hiệu lực 01/7/2026); đã đối chiếu thêm luatvietnam.vn và ecn.net.vn cùng nêu điểm này. Chưa lấy được văn bản NĐ 253 từ Công báo/vbpl để đối chiếu nguyên văn, và thuvienphapluat/Anthropic web_search không phải nguồn chính. Nếu trích đúng, khẳng định của mục sai: phần trả cao hơn luật vẫn không tính thuế nếu được ghi cụ thể trong quy chế tài chính/nội bộ, hợp đồng lao động hoặc thỏa ước lao động; chỉ phần trả thêm không có căn cứ đó mới tính thuế. Mục dẫn \"cơ chế đó không có trong luật Việt Nam\" cho mức miễn vượt luật, mâu thuẫn trực tiếp."
  - text: "Giảm trừ gia cảnh 15,5 triệu đồng/tháng (186 triệu/năm) với người nộp thuế; 6,2 triệu đồng/tháng với mỗi người phụ thuộc (Điều 10 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: "a) Mức giảm trừ đối với người nộp thuế là 15,5 triệu đồng/tháng (186 triệu đồng/năm);\nb) Mức giảm trừ đối với mỗi người phụ thuộc là 6,2 triệu đồng/tháng."
    verdict: "match"
    note: "Giảm trừ chỉ áp dụng cho thu nhập tiền lương, tiền công của cá nhân cư trú (\"đối với thu nhập từ tiền lương, tiền công của người nộp thuế là cá nhân cư trú\")."
  - text: "Biểu thuế lũy tiến từng phần 5 bậc: đến 120 triệu/năm 5%; trên 120-360: 10%; 360-720: 20%; 720-1.200: 30%; trên 1.200: 35% (Điều 9 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: "1 Đến 120 Đến 10 5 | 2 Trên 120 đến 360 Trên 10 đến 30 10 | 3 Trên 360 đến 720 Trên 30 đến 60 20 | 4 Trên 720 đến 1.200 Trên 60 đến 100 30 | 5 Trên 1.200 Trên 100 35"
    verdict: "match"
    note: "Bảng gốc có cột \"Bậc thuế / Phần thu nhập tính thuế/năm (triệu đồng) / Phần thu nhập tính thuế/tháng (triệu đồng) / Thuế suất (%)\"; dấu | do kiểm chứng viên thêm để phân dòng."
  - text: "Luật có hiệu lực từ 01/7/2026; quy định về tiền lương, tiền công của cá nhân cư trú áp dụng từ kỳ tính thuế năm 2026 (Điều 29)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: "1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026, trừ trường hợp quy định tại khoản 2 Điều này.\n2. Các quy định liên quan đến thu nhập từ kinh doanh, từ tiền lương, tiền công của cá nhân cư trú áp dụng từ kỳ tính thuế năm 2026."
    verdict: "match"
    note: "Mục chỉ nói hiệu lực 01/7/2026; nên ghi thêm khoản 2 (áp dụng từ kỳ tính thuế 2026) để người nghỉ việc trước 1/7/2026 không áp dụng nhầm."
  - text: "Trợ cấp thôi việc: nửa tháng lương cho mỗi năm làm việc, người làm thường xuyên từ đủ 12 tháng (Điều 46 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34 của Bộ luật này thì người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này."
    verdict: "partial"
    note: "Bỏ ngoại lệ (đủ điều kiện hưởng lương hưu; tự ý bỏ việc 5 ngày) và Điều 46 khoản 2: thời gian làm việc để tính = tổng thời gian làm việc thực tế TRỪ thời gian đã tham gia BHTN và thời gian đã được trả trợ cấp. \"Ba con số để tự kiểm\" (số năm làm việc x nửa tháng x lương bình quân) vì thế dễ sai so với số đúng."
  - text: "Tiền lương tính trợ cấp thôi việc là bình quân 06 tháng liền kề theo hợp đồng lao động trước khi thôi việc (Điều 46 khoản 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "3. Tiền lương để tính trợ cấp thôi việc là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc."
    verdict: "match"
    note: ""
  - text: "Khoản 'hỗ trợ' ghi trong biên bản thỏa thuận không có căn cứ pháp luật, hay phần chênh do tính sai số năm, đều chịu thuế (suy ra từ Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    quote: ""
    verdict: "inference"
    note: "Mục tự gắn nhãn \"suy ra\". Với NĐ 253 Điều 8 khoản 3 điểm h (thứ cấp), khoản trả vượt luật chỉ chịu thuế khi không được ghi cụ thể trong quy chế/hợp đồng/thỏa ước; \"biên bản thỏa thuận\" riêng lẻ có thể không đủ điều kiện miễn. Cần đọc nguyên văn NĐ 253 để kết luận."

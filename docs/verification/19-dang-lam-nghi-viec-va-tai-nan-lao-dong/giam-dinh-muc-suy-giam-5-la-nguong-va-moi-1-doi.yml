    quote: "Người lao động bị tai nạn lao động, bệnh nghề nghiệp được giám định hoặc giám định lại mức suy giảm khả năng lao động khi thuộc một trong các trường hợp sau đây: a) Sau khi bị thương tật, bệnh tật lần đầu đã được điều trị ổn định còn di chứng ảnh hưởng tới sức khỏe; b) Sau khi thương tật, bệnh tật tái phát đã được điều trị ổn định; c) Đối với trường hợp thương tật hoặc bệnh nghề nghiệp không có khả năng điều trị ổn định theo quy định của Bộ trưởng Bộ Y tế thì người lao động được làm thủ tục giám định trước hoặc ngay trong quy trình điều trị"
    note: ""
  - text: "Giám định tổng hợp: vừa tai nạn vừa bệnh nghề nghiệp; tai nạn nhiều lần; nhiều bệnh nghề nghiệp (Điều 47 khoản 2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: match
    quote: "Người lao động được giám định tổng hợp mức suy giảm khả năng lao động khi thuộc một trong các trường hợp sau đây: a) Vừa bị tai nạn lao động vừa bị bệnh nghề nghiệp; b) Bị tai nạn lao động nhiều lần; c) Bị nhiều bệnh nghề nghiệp"
    note: ""
  - text: Giám định lại sau 24 tháng kể từ kết luận liền kề trước; sớm hơn khi bệnh nghề nghiệp làm suy giảm nhanh (Điều 47 khoản 3)

suggested_edits:
  - "Chi phí: bỏ chữ 'mức trần' ở '4.250.400 đồng một tháng tại 100%'; thêm 'chưa gồm khoản theo số năm đóng quỹ (Điều 49 khoản 2 điểm b) và trợ cấp phục vụ (Điều 52)'."
  - "tldr và Nói dễ hiểu: '12.650.000 đồng' → 'ít nhất 12.650.000 đồng (5 lần lương cơ sở) cộng khoản theo số năm đóng quỹ (Điều 48 khoản 2 điểm b)'; thêm điều kiện đang tham gia bảo hiểm TNLĐ-BNN và Điều 45 khoản 1."
  - "Pháp luật VN: chuyển câu 'đơn vị trả phí khám giám định dưới 5%…' sang dẫn Điều 38 khoản 2 điểm b và thêm vào legal_refs; thêm điều kiện của Điều 42 khoản 1 ('kết quả đủ điều kiện để điều chỉnh tăng mức hưởng')."
  - "Thống nhất câu 24 tháng ở Chi phí và Bẫy 1 theo Điều 47 khoản 3: 'giám định lại sau 24 tháng kể từ kết luận liền kề trước đó (trường hợp tái phát); sớm hơn khi bệnh nghề nghiệp suy giảm nhanh theo quy định của Bộ trưởng Bộ Y tế'."
  - "Điều 38 khoản 4: thêm điều kiện 'không hoàn toàn do lỗi của chính người lao động' và nhắc Điều 38 khoản 5 (≥40% nếu do lỗi chính họ) và Điều 40."
  - "Bước 4: ghi rõ 'chỉ làm được sau 24 tháng kể từ kết luận liền kề trước' hoặc dẫn khoản 3 trong chính bước."

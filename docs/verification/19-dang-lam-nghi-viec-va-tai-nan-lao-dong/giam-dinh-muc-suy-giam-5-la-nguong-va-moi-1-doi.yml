  basis: "Luật 84/2015/QH13 (hợp nhất tại 14/VBHN-VPQH ngày 16/9/2024, đã gộp sửa đổi của Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025). Nghị định 283/2026/NĐ-CP (15/7/2026), mục Căn cứ, vẫn liệt kê 'Luật An toàn, vệ sinh lao động số 84/2015/QH13' là căn cứ ban hành, tức luật còn được áp dụng đến 07/2026. Đã tìm văn bản thay thế toàn bộ: kết quả tìm kiếm thứ cấp (thuvienphapluat.vn) nói chưa có luật mới, dự án luật sửa đổi mới ở chương trình xây dựng pháp luật 2026. Không có bản VBHN nào mới hơn 14/VBHN-VPQH được kiểm tra, nên các sửa đổi sau 09/2024 (nếu có) chưa loại trừ hoàn toàn bằng nguồn chính thức. NĐ 161/2026 (15/5/2026): chỉ đọc được qua OCR bản quét; Điều 3 khoản 2 nêu mức 2.530.000 đ từ 01/7/2026, khoản 4 cho phép Chính phủ điều chỉnh sau; chưa thấy văn bản điều chỉnh."

    note: 'BLLĐ Điều 47 khoản 1. Điều 34 khoản 11: "cho người lao động thôi việc theo quy định tại Điều 42 và Điều 43".'
  - text: Mức sàn 02 tháng chỉ áp dụng khi thời gian làm việc để tính trợ cấp mất việc làm ít hơn 24 tháng
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2020/12/32732/33806-1-20201203-1204145-2020-nd-cp.pdf

  - text: "Thời gian làm việc thực tế gồm thử việc, nghỉ ốm đau/thai sản BHXH, TNLĐ mà được trả lương, nghỉ hằng tuần/nghỉ hưởng nguyên lương, ngừng việc không do lỗi NLĐ; làm tròn: tháng lẻ ≤ 06 tháng tính 1/2 năm, trên 06 tháng tính 01 năm"

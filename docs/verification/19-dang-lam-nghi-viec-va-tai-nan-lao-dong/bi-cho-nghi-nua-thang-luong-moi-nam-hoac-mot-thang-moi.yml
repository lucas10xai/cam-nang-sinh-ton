    quote: "Tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động bao gồm: thời gian người lao động đã trực tiếp làm việc; thời gian thử việc; thời gian được người sử dụng lao động cử đi học; thời gian nghỉ hưởng chế độ ốm đau, thai sản theo quy định của pháp luật về bảo hiểm xã hội; ... thời gian ngừng việc không do lỗi của người lao động; ... | trường hợp có tháng lẻ ít hơn hoặc bằng 06 tháng được tính bằng 1/2 năm, trên 06 tháng được tính bằng 01 năm làm việc."
    verdict: match
    note: "NĐ 145/2020 Điều 8 khoản 3 điểm a, c; điểm b còn gồm cả thời gian không phải tham gia BHTN nhưng được trả khoản tương đương. Điều 8 khoản 5 điểm a: lương bình quân 06 tháng liền kề."
  - text: Hai bên thanh toán đầy đủ trong 14 ngày làm việc kể từ ngày chấm dứt hợp đồng; kéo dài không quá 30 ngày trong bốn trường hợp
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày: a) Người sử dụng lao động không phải là cá nhân chấm dứt hoạt động; b) Người sử dụng lao động thay đổi cơ cấu, công nghệ hoặc vì lý do kinh tế; c) Chia, tách, hợp nhất, sáp nhập; bán, cho thuê, chuyển đổi loại hình doanh nghiệp; ... d) Do thiên tai, hỏa hoạn, địch họa hoặc dịch bệnh nguy hiểm."

    note: "Đúng là điều luật chỉ nói 'bản sao các tài liệu liên quan đến quá trình làm việc'; kết luận về thẻ/hộp thư là suy ra từ chỗ luật im lặng, không phải chữ của luật."
  - text: "Phần tài liệu vượt quá 'tài liệu liên quan đến quá trình làm việc của người lao động' (danh sách khách hàng, dữ liệu đồng nghiệp, mã nguồn) 'có thể bị coi là vi phạm nghĩa vụ bảo mật'"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "(không có câu tương ứng trong văn bản được dẫn)"

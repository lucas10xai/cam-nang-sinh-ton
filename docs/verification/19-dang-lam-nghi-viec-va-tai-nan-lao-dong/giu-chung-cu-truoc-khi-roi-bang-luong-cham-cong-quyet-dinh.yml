    note: "Không có điều khoản bảo mật trong nguồn mục dẫn (BLLĐ Điều 48; Điều 125 sa thải vì tiết lộ bí mật nằm ở điều khác, không được dẫn). Là cảnh báo thận trọng hợp lý nhưng cần ghi 'suy ra' hoặc dẫn Điều 125/Bộ luật Dân sự."
  - text: "Bảng chấm công, bảng lương, quyết định phân công, khen thưởng/kỷ luật, biên bản họp 'đều xin được bằng một lá đơn' theo Điều 48 khoản 3 điểm b"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu."
    verdict: partial

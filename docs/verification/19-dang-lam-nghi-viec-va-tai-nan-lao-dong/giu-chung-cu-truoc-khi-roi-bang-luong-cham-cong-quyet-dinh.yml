claims:
  - text: "NSDLĐ phải cung cấp bản sao tài liệu liên quan quá trình làm việc nếu NLĐ yêu cầu; chi phí sao, gửi do NSDLĐ trả (Điều 48 khoản 3 điểm b)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    verdict: match
    note: "Trích từ DOCX VBHN 18/VBHN-VPQH tải từ trang Công báo; PDF BLLĐ gốc mục dẫn là ảnh quét không trích được chữ."
  - text: "NSDLĐ hoàn thành thủ tục xác nhận thời gian đóng BHXH, BHTN và trả lại bản chính giấy tờ đã giữ (Điều 48 khoản 3 điểm a)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động;"
    verdict: match
    note: ""
  - text: "Hạn thanh toán 14 ngày làm việc kể từ ngày chấm dứt HĐLĐ; kéo dài không quá 30 ngày trong bốn trường hợp (Điều 48 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày:"
    verdict: match
    note: "Bốn trường hợp (a-d) khớp: NSDLĐ không phải cá nhân chấm dứt hoạt động; thay đổi cơ cấu, công nghệ/lý do kinh tế; chia tách, sáp nhập...; thiên tai, hỏa hoạn, địch họa, dịch bệnh nguy hiểm."
  - text: "Thời hiệu 06 tháng/09 tháng/01 năm tính từ ngày phát hiện hành vi; tldr: 'thời hiệu đòi tiền 01 năm'"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: match
    note: "Khoản 1 = 06 tháng hòa giải viên, khoản 2 = 09 tháng trọng tài, khoản 4 = bất khả kháng/trở ngại khách quan. Tldr chỉ nêu '01 năm' (mốc kiện tòa), không nêu 06/09 tháng; không sai nhưng nên ghi 'kiện tòa'. Lưu ý: 01 năm tính từ 'ngày phát hiện hành vi', không phải ngày nghỉ việc."
  - text: "NSDLĐ phải lập, quản lý hồ sơ sức khỏe và thông báo kết quả khám để NLĐ biết (Điều 27 khoản 2 Luật ATVSLĐ)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Người sử dụng lao động có trách nhiệm lập và quản lý hồ sơ sức khỏe của người lao động, hồ sơ sức khỏe của người bị bệnh nghề nghiệp; thông báo kết quả khám sức khỏe, khám phát hiện bệnh nghề nghiệp để người lao động biết;"
    verdict: match
    note: "PDF Công báo 871+872 trích được chữ."
  - text: "Phạt 1.000.000-2.000.000 đồng với vi phạm từ 01 đến 10 NLĐ, cho nhóm hành vi: thanh toán không đúng hạn, không trả đủ trợ cấp thôi việc, không hoàn thành xác nhận bảo hiểm/trả giấy tờ, không cung cấp bản sao tài liệu khi có yêu cầu (NĐ 283/2026 Điều 18 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "không cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu sau khi chấm dứt hợp đồng lao động theo một trong các mức sau đây: a) Từ 1.000.000 đồng đến 2.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;"
    verdict: partial
    note: "Khớp, nhưng (1) mức này là mức cá nhân, tổ chức/doanh nghiệp gấp đôi theo Điều 7 khoản 1 ('Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân'); mục không nêu nên người đọc tưởng công ty bị phạt 1-2 triệu. (2) Điều luật chỉ phạt khi NLĐ yêu cầu 'sau khi chấm dứt hợp đồng lao động'; lời khuyên gửi đơn 'trước ngày cuối' hợp lý nhưng nếu công ty không cung cấp thì căn cứ phạt tính theo yêu cầu sau chấm dứt (nên gửi lại sau ngày chấm dứt). (3) Khoản 4 còn biện pháp buộc trả đủ trợ cấp cộng lãi, mục không nêu."
  - text: "Công ty 'không được thu tiền photo'"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    verdict: match
    note: "Diễn đạt 'không được thu tiền photo' là cách nói của mục, tương đương."
  - text: "Điều 48 khoản 3 điểm b 'không nói công ty phải cấp lại thứ bạn không còn truy cập được' (thẻ ra vào, hộp thư, tài khoản)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "(không có câu tương ứng trong văn bản được dẫn)"

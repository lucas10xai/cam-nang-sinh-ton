  - text: "Step 4: 'xin bản sao kết quả khám và hồ sơ sức khỏe theo Điều 48 khoản 3 BLLĐ' (mục 09 cùng chương) / 'kết quả khám sức khỏe' nằm trong tài liệu giữ"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "thông báo kết quả khám sức khỏe, khám phát hiện bệnh nghề nghiệp để người lao động biết;"
    verdict: inference

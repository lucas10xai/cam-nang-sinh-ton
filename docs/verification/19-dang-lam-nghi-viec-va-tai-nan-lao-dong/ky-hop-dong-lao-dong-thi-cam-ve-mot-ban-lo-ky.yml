claims:
  - text: "Hợp đồng lao động làm thành 02 bản, người lao động giữ 01 bản, trừ hợp đồng dưới 01 tháng (Điều 14 khoản 1 BLLĐ)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "1. Hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này."
    verdict: partial
    note: "DOCX 18/VBHN-VPQH. Đúng ý. Điều bị bỏ: (a) cùng khoản: 'Hợp đồng lao động được giao kết thông qua phương tiện điện tử dưới hình thức thông điệp dữ liệu ... có giá trị như hợp đồng lao động bằng văn bản' (hợp đồng điện tử, tình huống phổ biến, không có 'hai bản giấy'); (b) khoản 2: bằng lời nói chỉ khi hợp đồng dưới 01 tháng, 'trừ trường hợp quy định tại khoản 2 Điều 18, điểm a khoản 1 Điều 145 và khoản 1 Điều 162'. Mục viết 'trừ hợp đồng có thời hạn dưới 01 tháng' mà không nêu các ngoại lệ của ngoại lệ."
  - text: "Phạt 2.000.000 đến 5.000.000 đồng với vi phạm từ 01 đến 10 người lao động khi giao kết không bằng văn bản, không đúng loại hoặc không đầy đủ nội dung chủ yếu (Điều 9 khoản 1 NĐ 12/2022)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "a) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;"
    verdict: match
    note: "Con số đúng nhưng nguồn đúng hiện hành là NĐ 283/2026 Điều 15 khoản 1 điểm a (PDF Công báo số 448 ngày 28-07-2026), không phải NĐ 12/2022. Nội dung hành vi ở Điều 15 khoản 1 NĐ 283 khớp mô tả của mục: 'giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên; ... giao kết không đúng loại hợp đồng lao động ...; giao kết hợp đồng lao động không đầy đủ các nội dung chủ yếu'. Điều 9 khoản 1 NĐ 12/2022 (bản vcci.com.vn, thứ cấp) có cùng mức."
  - text: "Căn cứ pháp lý của mức phạt là Nghị định 12/2022/NĐ-CP (Điều 6, Điều 9)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "4. Nghị định số 12/2022/NĐ-CP ngày 17 tháng 01 năm 2022 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực thi hành."
    verdict: mismatch
    note: "NĐ 283/2026 Điều 66 khoản 4: NĐ 12/2022 hết hiệu lực từ 10/09/2026 (khoản 1: 'Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026'). Ngày kiểm là 2026-11-08, mục dẫn văn bản đã hết hiệu lực. Điều 67 (chuyển tiếp) chỉ cho áp NĐ cũ với hành vi xảy ra và kết thúc trước 10/09/2026. Trang vcci.com.vn dùng làm nguồn vẫn ghi 'Còn hiệu lực', lạc hậu so với Công báo."
  - text: "Tổ chức bị phạt gấp 02 lần mức của cá nhân (Điều 6 khoản 3 NĐ 12/2022)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    verdict: match
    note: "Điều 7 khoản 1 NĐ 283/2026; Điều 15 không thuộc danh sách ngoại lệ nên doanh nghiệp bị 4.000.000 đến 10.000.000 đồng. Chữ tương ứng trong NĐ 12/2022 nằm ở Điều 6 khoản 1 (câu 'Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân') và khoản 3 chỉ liệt kê tổ chức: mục dẫn 'khoản 3' cho hệ số 02 chưa chính xác; hệ số nằm ở khoản 1 NĐ 12/2022 / khoản 1 Điều 7 NĐ 283."
  - text: "Cơ quan lao động còn buộc giao kết lại bằng văn bản"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "a) Buộc người sử dụng lao động giao kết hợp đồng lao động bằng văn bản với người lao động khi có hành vi giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên quy định tại khoản 1 Điều này;"
    verdict: partial
    note: "Điều 15 khoản 3 điểm a NĐ 283/2026. Biện pháp này chỉ áp cho hành vi không giao kết bằng văn bản; mục viết như áp cho toàn bộ nhóm hành vi (không đúng loại, thiếu nội dung chủ yếu có biện pháp riêng: điểm c buộc giao kết đúng loại hợp đồng). Cũng không có biện pháp nào buộc giao 'bản' hợp đồng."
  - text: "Thời hiệu: hòa giải viên 06 tháng, Hội đồng trọng tài 09 tháng, Tòa án 01 năm (Điều 190 BLLĐ); kiện ra tòa thời hiệu một năm kể từ ngày biết quyền bị xâm phạm"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "3. Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: match
    note: "Điều 190 khoản 1 (06 tháng), khoản 2 (09 tháng), khoản 3 (01 năm). Khoản 4: thời gian bất khả kháng, trở ngại khách quan không tính vào thời hiệu (mục không nhắc, không gây hại)."
  - text: "Nội dung chủ yếu của hợp đồng gồm 10 nhóm, gồm mức lương, thời hạn, thời giờ làm việc, BHXH"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "d) Thời hạn của hợp đồng lao động; đ) Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác; ... g) Thời giờ làm việc, thời giờ nghỉ ngơi; ... i) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;"
    verdict: match

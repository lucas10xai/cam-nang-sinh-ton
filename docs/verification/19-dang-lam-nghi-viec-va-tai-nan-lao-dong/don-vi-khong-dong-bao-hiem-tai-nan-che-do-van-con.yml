  basis: "Luật 84/2015/QH13 (hợp nhất tại 14/VBHN-VPQH ngày 16/9/2024, đã gộp sửa đổi của Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025). Nghị định 283/2026/NĐ-CP (15/7/2026), mục Căn cứ, vẫn liệt kê 'Luật An toàn, vệ sinh lao động số 84/2015/QH13' là căn cứ ban hành, tức luật còn được áp dụng đến 07/2026. Đã tìm văn bản thay thế toàn bộ: kết quả tìm kiếm thứ cấp (thuvienphapluat.vn) nói chưa có luật mới, dự án luật sửa đổi mới ở chương trình xây dựng pháp luật 2026. Không có bản VBHN nào mới hơn 14/VBHN-VPQH được kiểm tra, nên các sửa đổi sau 09/2024 (nếu có) chưa loại trừ hoàn toàn bằng nguồn chính thức. Luật BHXH 41/2024: hiệu lực 01/7/2025 (Điều 141 chuyển tiếp trên trang xaydungchinhsach.chinhphu.vn), NĐ 283/2026 (15/7/2026) liệt kê Luật này trong căn cứ. NĐ 161/2026 (15/5/2026): Điều 3 khoản 2 đọc qua OCR bản quét, nêu hiệu lực từ 01/7/2026; không thấy văn bản sửa/thay trong lượt tra. Nghị định 283/2026/NĐ-CP ký 15/7/2026, Điều 80: 'Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026' và thay Nghị định 12/2022/NĐ-CP (hết hiệu lực cùng ngày). Văn bản mới, đọc bản DOCX trên congbao.chinhphu.vn; chưa thấy văn bản sửa đổi nhưng chưa có bằng chứng tra cứu chính thức."

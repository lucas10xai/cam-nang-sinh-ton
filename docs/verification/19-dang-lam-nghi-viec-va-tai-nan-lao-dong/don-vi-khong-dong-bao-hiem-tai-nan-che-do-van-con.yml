suggested_edits:
  - "tldr và Nói dễ hiểu: thêm 'ít nhất' và nhắc khoản trợ cấp theo số năm đóng quỹ (Điều 48 khoản 2 điểm b: 0,5 tháng lương đóng quỹ cho năm đầu, +0,3 tháng mỗi năm tiếp) — 12.650.000 đ chỉ là điểm a. Tương tự thêm Điều 49 khoản 2 điểm b và Điều 52 cho mức hằng tháng; bỏ cách nói 4.250.400 là mức chốt."
  - "Mục Chi phí: đổi 'hằng tháng 1% quỹ tiền lương' thành 'tối đa 1% quỹ tiền lương (Điều 44 khoản 1)'."
  - "tldr/tiêu đề: thêm điều kiện 'người lao động thuộc diện tham gia BHXH bắt buộc' (Điều 39 khoản 4) và nhắc Điều 40 (ba trường hợp không hưởng chế độ từ NSDLĐ)."
  - "Điều 43 khoản 3 NĐ 283/2026: nêu điều kiện điểm a/b, phạt cảnh cáo dưới 400.000 đ (khoản 1), phạt trốn đóng 18–20% (Điều 44 khoản 2), và ghi mức phạt là mức cá nhân, tổ chức gấp 02 lần (Điều 7 khoản 1)."
  - "Bước 5: gắn nhãn 'suy ra', nêu cơ quan nhận đơn theo tổ chức hiện nay (Sở Nội vụ) hoặc bỏ nếu không có nguồn; thêm cơ sở pháp lý khiếu nại/tố cáo/khởi kiện nếu giữ."
  - "Nguồn NĐ 283/2026: thay URL PDF ký số (ảnh quét) bằng link congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm hoặc DOCX đính kèm."

    quote: Suy giảm 5% khả năng lao động thì được hưởng năm lần mức lương cơ sở, sau đó cứ suy giảm thêm 1% thì được hưởng thêm 0,5 lần mức lương cơ sở
    note: "Công thức và số học đúng (5×2.530.000=12.650.000). Nhưng tldr/Nói dễ hiểu đặt 12.650.000 là số đơn vị phải trả 'đúng mức quỹ lẽ ra trả'; quỹ còn trả thêm điểm b (0,5 tháng lương đóng quỹ cho năm đầu, +0,3 tháng mỗi năm tiếp): Ngoài mức trợ cấp quy định tại điểm a khoản này, còn được hưởng thêm khoản trợ cấp tính theo số năm đã đóng vào Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp, từ một năm trở xuống thì được tính bằng 0,5 tháng, sau đó cứ thêm mỗi năm đóng vào quỹ được tính thêm 0,3 tháng tiền lương đóng vào quỹ của tháng liền kề trước tháng bị tai nạn lao động hoặc được xác định mắc bệnh nghề nghiệp. Con số trong tldr là mức tối thiểu của riêng điểm a, bỏ điểm b → hiểu sai số tiền đòi được. Mục 14 cùng chương có nêu điểm b."
  - text: Suy giảm từ 31% hưởng hằng tháng 30% lương cơ sở, +2% mỗi 1%; 31% = 759.000 đ, 100% = 4.250.400 đ/tháng (Điều 49 khoản 2 điểm a)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    verdict: partial
    quote: Suy giảm 31% khả năng lao động thì được hưởng bằng 30% mức lương cơ sở, sau đó cứ suy giảm thêm 1% thì được hưởng thêm 2% mức lương cơ sở
    note: "Số học đúng (30%+69×2%=168%×2.530.000=4.250.400). Thiếu điểm b khoản 2 Điều 49 (cộng thêm theo số năm đóng quỹ) và trợ cấp phục vụ Điều 52; 4.250.400 không phải mức cuối cùng của người suy giảm 100%. Quote điểm b: Ngoài mức trợ cấp quy định tại điểm a khoản này, hằng tháng còn được hưởng thêm một khoản trợ cấp tính theo số năm đã đóng vào Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp, từ một năm trở xuống được tính bằng 0,5%, sau đó cứ thêm mỗi năm đóng vào quỹ được tính thêm 0,3% mức tiền lương đóng vào quỹ của tháng liền kề trước tháng bị tai nạn lao động hoặc được xác định mắc bệnh nghề nghiệp"
  - text: "Chết do TNLĐ: thân nhân hưởng một lần 36 lần lương cơ sở = 91.080.000 đ (Điều 53)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf

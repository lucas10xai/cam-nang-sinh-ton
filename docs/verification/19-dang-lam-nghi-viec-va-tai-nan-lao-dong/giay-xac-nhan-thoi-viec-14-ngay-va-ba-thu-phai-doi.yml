  basis: "VBHN 18/VBHN-VPQH ngày 12/02/2026 (Công báo 131) là bản hợp nhất mới nhất đọc được; NĐ 283 (15/07/2026) lấy \"Bộ luật Lao động số 45/2019/QH14\" làm căn cứ. NĐ 283: điều hiệu lực \"Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026\" và NĐ 12/2022 \"hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực thi hành\"; ngày hôm nay 2026-11-08 đã qua mốc. Không tìm thấy văn bản sửa đổi/thay thế NĐ 283 (các bài thứ cấp tháng 9-10/2026 mô tả nghị định đang áp dụng); counter \"sửa đổi\" của trang Công báo hiển thị 0 cho mọi văn bản nên không dùng. Mục không dựa vào NĐ 145/2020 nên không cần xét hiệu lực NĐ đó."

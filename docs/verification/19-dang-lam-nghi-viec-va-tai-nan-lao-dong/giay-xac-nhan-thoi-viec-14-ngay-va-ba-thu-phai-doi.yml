suggested_edits:
  - "Sửa tiêu đề, tldr và đoạn Nói dễ hiểu: \"Trong 14 ngày làm việc (tối đa 30 ngày trong bốn trường hợp) đơn vị phải thanh toán đầy đủ các khoản tiền liên quan quyền lợi (Điều 48 khoản 1). Ngoài ra đơn vị phải hoàn thành thủ tục xác nhận thời gian đóng BHXH/BHTN, trả bản chính giấy tờ và cấp bản sao tài liệu khi bạn yêu cầu (Điều 48 khoản 3), luật không ghi thời hạn riêng cho ba việc này\". Dựa vào quote Điều 48 khoản 1 và khoản 3."
  - "Mục Pháp luật > Mức phạt: thêm \"Các mức này là mức đối với cá nhân; doanh nghiệp/tổ chức bị phạt gấp đôi (Điều 7 khoản 1, 2 NĐ 283)\", sửa tldr/Nói dễ hiểu tương ứng (ví dụ \"1-2 triệu với cá nhân, 2-4 triệu với tổ chức, vi phạm 1-10 người\")."
  - "Bỏ câu \"hồ sơ hưởng trợ cấp thất nghiệp bị treo\" hoặc gắn nhãn suy ra/dẫn Luật Việc làm 74/2025 Điều 38."
  - "Câu \"luật không buộc giấy đó phải ghi lý do thôi việc ... do đơn vị tự thêm\": gắn \"suy ra từ Điều 48 khoản 3\" hoặc dẫn văn bản hướng dẫn hiện hành."
  - "Đổi url NĐ 283 sang trang Công báo có DOCX."

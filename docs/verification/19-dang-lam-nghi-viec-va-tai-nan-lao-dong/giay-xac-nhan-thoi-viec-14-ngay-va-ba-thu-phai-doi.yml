claims:
  - text: "Trong 14 ngày làm việc kể từ ngày chấm dứt HĐLĐ, hai bên thanh toán đầy đủ các khoản tiền liên quan đến quyền lợi mỗi bên (Điều 48 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày:"
    verdict: "match"
    note: "Mục \"Chi phí/Thời hạn\" và \"Pháp luật VN\" trình bày đúng khoản 1."
  - text: "Kéo dài tối đa 30 ngày trong bốn trường hợp (Điều 48 khoản 1 a-d)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "a) Người sử dụng lao động không phải là cá nhân chấm dứt hoạt động;\nb) Người sử dụng lao động thay đổi cơ cấu, công nghệ hoặc vì lý do kinh tế;\nc) Chia, tách, hợp nhất, sáp nhập; bán, cho thuê, chuyển đổi loại hình doanh nghiệp; chuyển nhượng quyền sở hữu, quyền sử dụng tài sản của doanh nghiệp, hợp tác xã;\nd) Do thiên tai, hỏa hoạn, địch họa hoặc dịch bệnh nguy hiểm."
    verdict: "match"
    note: ""
  - text: "Người sử dụng lao động phải hoàn thành thủ tục xác nhận thời gian đóng BHXH, BHTN và trả lại bản chính giấy tờ đã giữ (Điều 48 khoản 3 điểm a)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động;"
    verdict: "match"
    note: ""
  - text: "Cung cấp bản sao tài liệu liên quan đến quá trình làm việc nếu người lao động yêu cầu, chi phí do người sử dụng lao động trả (Điều 48 khoản 3 điểm b)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    verdict: "match"
    note: ""
  - text: "tldr / Nói dễ hiểu: 'Hạn 14 ngày làm việc, tối đa 30 ngày' gắn với ba việc (chốt thời gian đóng BH, trả bản chính, cấp bản sao); 'Trong 14 ngày làm việc ... đơn vị phải chốt thời gian đóng bảo hiểm, trả lại bản chính giấy tờ và cấp bản sao'"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "1. Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, ...\n3. Người sử dụng lao động có trách nhiệm sau đây: a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác ... b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc ..."
    verdict: "mismatch"
    note: "Mốc 14/30 ngày của khoản 1 chỉ áp dụng cho việc THANH TOÁN các khoản tiền. Khoản 3 (ba việc) không nêu thời hạn nào. Tìm trong VBHN 18 và Luật BHXH 41/2024 (Điều 13 khoản 3 chỉ nói \"Phối hợp với cơ quan bảo hiểm xã hội trong việc xác nhận thời gian đóng bảo hiểm xã hội khi người lao động chấm dứt hợp đồng lao động\") không thấy mốc 14 ngày cho ba việc này. Tiêu đề, tldr và đoạn Nói dễ hiểu gán sai thời hạn; phần thân (mục \"Thời hạn đã có mức\") lại viết đúng, nên mục tự mâu thuẫn."
  - text: "Phạt 1.000.000-2.000.000 đồng với vi phạm từ 01 đến 10 người lao động (Điều 18 khoản 2 điểm a)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "2. Phạt tiền đối với người sử dụng lao động có một trong các hành vi: ... không hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác đã giữ của người lao động sau khi chấm dứt hợp đồng lao động theo quy định của pháp luật; không cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu sau khi chấm dứt hợp đồng lao động theo một trong các mức sau đây:\na) Từ 1.000.000 đồng đến 2.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;"
    verdict: "partial"
    note: "Con số và hành vi khớp. Nhưng Điều 7 khoản 1: \"Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân.\" (Điều 18 thuộc Chương II, không nằm trong danh sách ngoại lệ). Mức 1-2 triệu là mức cá nhân; công ty bị 2-4 triệu. Mục không nêu. Cùng Điều 18 khoản 2 còn phạt hành vi không trả/ trả thiếu trợ cấp thôi việc, trả chậm các khoản quyền lợi."
  - text: "Các bậc phạt 11-50 / 51-100 / 101-300 / 301+ người lao động (Điều 18 khoản 2 điểm b-đ)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "b) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 11 người đến 50 người lao động;\nc) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 51 người đến 100 người lao động;\nd) Từ 10.000.000 đồng đến 15.000.000 đồng đối với vi phạm từ 101 người đến 300 người lao động;\nđ) Từ 15.000.000 đồng đến 20.000.000 đồng đối với vi phạm từ 301 người lao động trở lên."
    verdict: "partial"
    note: "Số khớp từng bậc; thiếu quy tắc gấp đôi cho tổ chức (xem trên)."
  - text: "Buộc hoàn thành thủ tục xác nhận và trả lại giấy tờ đã giữ (Điều 18 khoản 4 điểm b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "b) Buộc người sử dụng lao động hoàn thành thủ tục xác nhận và trả lại những giấy tờ khác đã giữ của người lao động cho người lao động đối với hành vi không hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy khác đã giữ của người lao động sau khi chấm dứt hợp đồng lao động theo quy định của pháp luật quy định tại khoản 2 Điều này;"
    verdict: "match"
    note: ""
  - text: "Buộc trả đủ trợ cấp thôi việc/mất việc làm cùng tiền lãi theo lãi suất tiền gửi không kỳ hạn cao nhất của NHTM nhà nước (Điều 18 khoản 4 điểm a)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "a) Buộc người sử dụng lao động trả đủ tiền trợ cấp thôi việc hoặc trợ cấp mất việc làm cho người lao động cộng với khoản tiền lãi của số tiền chưa trả tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt đối với hành vi không trả hoặc trả không đủ tiền trợ cấp thôi việc hoặc trợ cấp mất việc làm cho người lao động quy định tại khoản 2 Điều này;"
    verdict: "match"
    note: ""
  - text: "Thời hiệu: hòa giải 6 tháng, trọng tài 9 tháng, tòa án 1 năm (Điều 190)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: "3. Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: "match"
    note: "Khoản 1 = 06 tháng (hòa giải viên), khoản 2 = 09 tháng (Hội đồng trọng tài). tldr \"Kiện trong 1 năm\" đúng cho Tòa án; không thay thế mốc tố cáo/xử phạt hành chính (thời hiệu xử phạt theo NĐ 283 Điều 3 khoản 4, mục không nhắc)."
  - text: "'Không chốt được thời gian đóng BHTN thì hồ sơ hưởng trợ cấp thất nghiệp bị treo'"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    quote: ""
    verdict: "not-found"
    note: "Không có câu nào trong các nguồn dẫn nói vậy. Nhận định thực tế hợp lý nhưng không có nguồn; nên bỏ hoặc gắn nhãn \"suy ra\"."
  - text: "'Không thứ nào là giấy xác nhận thôi việc theo mẫu chung; luật không buộc ghi lý do thôi việc; dòng \"tự nguyện xin nghỉ vì lý do cá nhân\" do đơn vị tự thêm'"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    quote: ""
    verdict: "inference"
    note: "Điều 48 khoản 3 không nhắc \"giấy xác nhận thôi việc\". Điều này là suy từ sự vắng mặt của quy định trong Điều 48; chưa tra các văn bản hướng dẫn (NĐ 145/2020 hoặc văn bản thay thế) nên không thể khẳng định \"luật không buộc\". Nên gắn \"suy ra từ Điều 48 khoản 3\" hoặc dẫn văn bản hướng dẫn."
internal_checks:
  - issue: "Tiêu đề, tldr và Nói dễ hiểu gắn mốc \"14 ngày làm việc, tối đa 30 ngày\" cho ba việc (chốt thời gian đóng BH, trả bản chính giấy tờ, cấp bản sao), trong khi Điều 48 khoản 1 áp dụng mốc đó cho thanh toán tiền; khoản 3 không có thời hạn. Mục tự mâu thuẫn: phần \"Thời hạn đã có mức\" nói đúng là \"để hai bên thanh toán đầy đủ các khoản tiền\"."

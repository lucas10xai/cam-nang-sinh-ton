suggested_edits:
  - "Sửa mục 'Đường dân sự' (Pháp luật VN, dòng cuối) dựa vào Điều 190 khoản 1, 2, 3 và Điều 188 khoản 1 điểm d: bỏ 'sau khi đã hòa giải ở mức 06 tháng và trọng tài ở mức 09 tháng'; viết: 'Thời hiệu yêu cầu hòa giải viên là 06 tháng, Hội đồng trọng tài 09 tháng, Tòa án 01 năm kể từ ngày phát hiện hành vi; tranh chấp về BHXH không bắt buộc qua hòa giải.' Thêm nhãn 'chưa kiểm' nếu giữ việc áp Điều 190 cho đòi BHXH."
  - "Thay 'thanh tra lao động cấp tỉnh' (tldr, steps, Chi phí) bằng cơ quan có căn cứ: cơ quan bảo hiểm xã hội (Luật BHXH Điều 35) và Sở Nội vụ nơi đơn vị đặt trụ sở (NĐ 283/2026 Điều 54 khoản 2, Điều 57), hoặc ghi 'cơ quan có thẩm quyền xử phạt theo NĐ 283/2026 Điều 54 đến 57'."
  - "Chi phí/Nói dễ hiểu: ghi rõ '17% và 8% là phần BHXH; BHYT và BHTN đóng thêm' hoặc bổ sung mức BHYT, BHTN kèm nguồn; thêm một câu về Điều 33 khoản 5 (tháng nghỉ không lương từ 14 ngày làm việc trở lên có thể không đóng)."
  - "Bỏ hoặc gắn nguồn cho 'mất luôn trợ cấp thất nghiệp' và 'không tính vào thời gian đóng để hưởng trợ cấp thất nghiệp' (dẫn Luật Việc làm 74/2025/QH15 sau khi kiểm), và thêm Điều 64 khoản 1 Luật BHXH vào legal_refs nếu giữ 'mười tháng không tính vào 15 năm' (kèm điều kiện đủ tuổi nghỉ hưu)."
  - "Bẫy 2: thay 'Khoản 2 Điều 35 Bộ luật Lao động không có trường hợp đó' bằng 'khoản 2 Điều 35 không liệt kê đích danh việc không đóng BHXH'."
  - "Điều 39 (Pháp luật VN, Chậm đóng và trốn đóng): thêm 'trừ trường hợp có lý do chính đáng theo quy định của Chính phủ (Điều 39 khoản 2)'. Câu '150.000.000 đồng' gắn nhãn 'suy ra từ Điều 7 khoản 1 NĐ 283/2026'."

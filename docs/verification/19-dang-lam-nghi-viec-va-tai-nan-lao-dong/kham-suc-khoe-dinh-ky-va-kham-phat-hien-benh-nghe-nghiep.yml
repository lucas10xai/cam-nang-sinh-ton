  - text: "Phạt 1.000.000-3.000.000 đồng/NLĐ, tối đa 75.000.000 đồng với NSDLĐ không tổ chức khám định kỳ hoặc khám BNN (NĐ 283/2026 Điều 33 khoản 2)"

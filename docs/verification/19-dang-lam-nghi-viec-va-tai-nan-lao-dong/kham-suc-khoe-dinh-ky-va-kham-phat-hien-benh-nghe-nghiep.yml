claims:
  - text: "Hàng năm NSDLĐ phải tổ chức khám sức khỏe ít nhất một lần; nghề nặng nhọc, độc hại, nguy hiểm... người khuyết tật, chưa thành niên, cao tuổi: ít nhất 06 tháng một lần (Điều 21 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Hàng năm, người sử dụng lao động phải tổ chức khám sức khỏe ít nhất một lần cho người lao động; đối với người lao động làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hoặc đặc biệt nặng nhọc, độc hại, nguy hiểm, người lao động là người khuyết tật, người lao động chưa thành niên, người lao động cao tuổi được khám sức khỏe ít nhất 06 tháng một lần."
    verdict: match
    note: "Đọc từ PDF Công báo số 871+872 (congbaocdn.chinhphu.vn). Tldr chỉ nêu 'nghề nặng nhọc, độc hại' (bỏ nguy hiểm, người khuyết tật, chưa thành niên, cao tuổi); thân nêu đủ."
  - text: "Lần khám phải có: lao động nữ khám chuyên khoa phụ sản; người tiếp xúc yếu tố có nguy cơ gây bệnh nghề nghiệp phải được khám phát hiện bệnh nghề nghiệp (Điều 21 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Khi khám sức khỏe theo quy định tại khoản 1 Điều này, lao động nữ phải được khám chuyên khoa phụ sản, người làm việc trong môi trường lao động tiếp xúc với các yếu tố có nguy cơ gây bệnh nghề nghiệp phải được khám phát hiện bệnh nghề nghiệp."
    verdict: match
    note: "Mục diễn đạt 'khám bệnh nghề nghiệp là phần bắt buộc của lần khám định kỳ' cho người tiếp xúc yếu tố có nguy cơ: đúng, nhưng tldr/Nói dễ hiểu viết như mọi người làm nghề độc hại đều 06 tháng có khám BNN: đúng ý Điều 21 khoản 1+2."
  - text: "Ba mốc khám ngoài lịch: trước khi bố trí làm việc; trước khi chuyển sang nghề nặng nhọc, độc hại, nguy hiểm hơn; sau khi bị TNLĐ/BNN đã phục hồi tiếp tục làm việc, trừ trường hợp đã khám giám định (Điều 21 khoản 3)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Người sử dụng lao động tổ chức khám sức khỏe cho người lao động trước khi bố trí làm việc và trước khi chuyển sang làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hơn hoặc sau khi bị tai nạn lao động, bệnh nghề nghiệp đã phục hồi sức khỏe, tiếp tục trở lại làm việc, trừ trường hợp đã được Hội đồng y khoa khám giám định mức suy giảm khả năng lao động."
    verdict: match
    note: ""
  - text: "Phải khám tại cơ sở khám bệnh, chữa bệnh bảo đảm yêu cầu chuyên môn, nên phòng y tế công ty tự khám không thay được (Điều 21 khoản 4)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Người sử dụng lao động tổ chức khám sức khỏe cho người lao động, khám phát hiện bệnh nghề nghiệp tại cơ sở khám bệnh, chữa bệnh bảo đảm yêu cầu, điều kiện chuyên môn kỹ thuật."
    verdict: partial

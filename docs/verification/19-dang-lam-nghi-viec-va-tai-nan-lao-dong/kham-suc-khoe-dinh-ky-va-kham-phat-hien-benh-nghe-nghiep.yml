  - text: "Người được chẩn đoán BNN phải được đưa đến cơ sở đủ điều kiện để điều trị theo phác đồ do Bộ trưởng Bộ Y tế quy định (Điều 21 khoản 5)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Người sử dụng lao động đưa người lao động được chẩn đoán mắc bệnh nghề nghiệp đến cơ sở khám bệnh, chữa bệnh đủ điều kiện chuyên môn kỹ thuật để điều trị theo phác đồ điều trị bệnh nghề nghiệp do Bộ trưởng Bộ Y tế quy định."
    verdict: match
    note: ""
  - text: "Chi phí khám, khám BNN, điều trị BNN theo khoản 1, 2, 3, 5 do NSDLĐ chi trả, hạch toán chi phí được trừ thuế (Điều 21 khoản 6)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Chi phí cho hoạt động khám sức khỏe, khám phát hiện bệnh nghề nghiệp, điều trị bệnh nghề nghiệp cho người lao động do người sử dụng lao động chi trả quy định tại các khoản 1, 2, 3 và 5 Điều này được hạch toán vào chi phí được trừ khi xác định thu nhập chịu thuế theo Luật thuế thu nhập doanh nghiệp"

  - text: "Công ty căn cứ tiêu chuẩn sức khỏe và kết quả khám để sắp xếp công việc; lập, quản lý hồ sơ sức khỏe và thông báo kết quả khám để NLĐ biết (Điều 27 khoản 1, 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm
    quote: "Người sử dụng lao động có trách nhiệm lập và quản lý hồ sơ sức khỏe của người lao động, hồ sơ sức khỏe của người bị bệnh nghề nghiệp; thông báo kết quả khám sức khỏe, khám phát hiện bệnh nghề nghiệp để người lao động biết;"

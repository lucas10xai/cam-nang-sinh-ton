suggested_edits:
  - "Pháp luật VN 'Mức phạt': thêm 'mức trên là mức cá nhân; doanh nghiệp (tổ chức) gấp đôi theo Điều 7 khoản 1, 2 NĐ 283/2026'; thêm số tiền cho khoản 3 (5.000.000-10.000.000 đồng/người, tối đa 75.000.000 đồng)."
  - "Điều 21 khoản 4: đổi 'nên một buổi khám do phòng y tế công ty tự làm không thay được' thành 'chỉ hợp lệ khi thực hiện tại cơ sở khám bệnh, chữa bệnh đủ điều kiện chuyên môn kỹ thuật'."
  - "Điều 6 khoản 1 điểm c: thêm điều kiện 'được trả phí khám giám định chủ động khi kết quả đủ điều kiện điều chỉnh tăng mức hưởng trợ cấp'."
  - "Danh mục bệnh: bỏ cụm 'nhóm bệnh do yếu tố vật lý' (không có trong phần đọc được của Điều 3), chỉ nói 'danh sách các bệnh (ví dụ bệnh điếc nghề nghiệp do tiếng ồn, mục 18, Phụ lục XVIII)'. Dẫn nguồn chính thống cho TT 60 (Công báo hoặc Bộ Y tế) và điều khoản thi hành để xác nhận 15/02/2026."
  - "Chi phí: gắn nguồn hoặc đổi 'thường ... lớn hơn rất nhiều' thành nhận định không số liệu; Bẫy 2: bỏ chữ 'chỉ có giá trị khi', thay 'hồ sơ theo dõi nhiều năm giúp chứng minh' nếu có nguồn."
  - "Step 1: đổi giọng 'chưa làm đúng khoản 2 Điều 21' thành 'có thể chưa khám phát hiện bệnh nghề nghiệp; hỏi lại bằng văn bản' (suy luận, không phải quy định biểu mẫu). Step 4: gắn nhãn 'diễn giải Điều 48 khoản 3 điểm b + Điều 27 khoản 2'."
  - "Tldr: bổ sung 'hoặc nguy hiểm; người khuyết tật, chưa thành niên, cao tuổi' để khớp Điều 21 khoản 1."

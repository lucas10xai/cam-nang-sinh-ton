    note: "Mục viết 'Điều 24 khoản 4 phạt 5.000.000-10.000.000 đồng với việc huy động vượt quá số giờ' mà KHÔNG nêu điều kiện '1-10 người'. Thực tế là thang 5 bậc đến 60-75 triệu (cá nhân); gấp đôi cho doanh nghiệp. Dễ làm người đọc tưởng mức trần là 10 triệu. Số tiền ở bậc 1 đúng, nhưng diễn đạt gây hiểu lầm."
  - text: "NĐ 283 Điều 24 khoản 1 điểm b: phạt 2.000.000-5.000.000 đồng với không thông báo văn bản cho Sở Nội vụ khi làm thêm từ trên 200 đến 300 giờ/năm"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "1. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: ... b) Không thông báo bằng văn bản cho Sở Nội vụ nơi tổ chức làm thêm giờ và nơi đặt trụ sở chính về việc tổ chức làm thêm giờ từ trên 200 giờ đến 300 giờ trong một năm."

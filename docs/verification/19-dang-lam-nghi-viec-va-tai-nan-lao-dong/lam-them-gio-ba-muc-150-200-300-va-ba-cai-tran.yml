claims:
  - text: Làm thêm ngày thường ít nhất 150%, ngày nghỉ hằng tuần 200%, ngày lễ/tết/nghỉ có hưởng lương 300%
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Vào ngày thường, ít nhất bằng 150%; b) Vào ngày nghỉ hằng tuần, ít nhất bằng 200%; c) Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày.
    verdict: match
    note: BLLĐ Điều 98 khoản 1. Điều kiện "chưa kể lương ngày lễ ... đối với người lao động hưởng lương ngày" đúng như mục nêu.
  - text: Làm việc ban đêm trả thêm ít nhất 30%; làm thêm ban đêm trả thêm 20% (cộng dồn ba tầng)
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Người lao động làm việc vào ban đêm thì được trả thêm ít nhất bằng 30% tiền lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc của ngày làm việc bình thường. | Người lao động làm thêm giờ vào ban đêm thì ngoài việc trả lương theo quy định tại khoản 1 và khoản 2 Điều này, người lao động còn được trả thêm 20% tiền lương tính theo đơn giá tiền lương hoặc tiền lương theo công việc làm vào ban ngày
    verdict: match
    note: BLLĐ Điều 98 khoản 2, 3. "Cộng dồn ba tầng" là cách đọc đúng của cụm "ngoài việc trả lương theo khoản 1 và khoản 2".
  - text: Làm thêm phải được người lao động đồng ý; không quá 40 giờ/tháng, 200 giờ/năm; 12 giờ/ngày khi tính theo tuần
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: a) Phải được sự đồng ý của người lao động; b) Bảo đảm số giờ làm thêm của người lao động không quá 50% số giờ làm việc bình thường trong 01 ngày; trường hợp áp dụng quy định thời giờ làm việc bình thường theo tuần thì tổng số giờ làm việc bình thường và số giờ làm thêm không quá 12 giờ trong 01 ngày; không quá 40 giờ trong 01 tháng; c) Bảo đảm số giờ làm thêm của người lao động không quá 200 giờ trong 01 năm, trừ trường hợp quy định tại khoản 3 Điều này.
    verdict: match
    note: BLLĐ Điều 107 khoản 2.
  - text: Mở trần 300 giờ/năm cho nhóm ngành (dệt, may, da, giày, điện, điện tử, chế biến nông lâm diêm thủy sản; điện, viễn thông, lọc dầu, cấp thoát nước) và các trường hợp c, d, đ
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Người sử dụng lao động được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm trong một số ngành, nghề, công việc hoặc trường hợp sau đây: a) Sản xuất, gia công xuất khẩu sản phẩm hàng dệt, may, da, giày, điện, điện tử, chế biến nông, lâm, diêm nghiệp, thủy sản; b) Sản xuất, cung cấp điện, viễn thông, lọc dầu; cấp, thoát nước;"
    verdict: match
    note: BLLĐ Điều 107 khoản 3 điểm a, b; điểm c, d, đ cũng khớp phần mô tả trong mục.
  - text: Làm thêm tới 300 giờ phải thông báo bằng văn bản cho cơ quan chuyên môn về lao động cấp tỉnh, hiện là Sở Nội vụ
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: Không thông báo bằng văn bản cho Sở Nội vụ nơi tổ chức làm thêm giờ và nơi đặt trụ sở chính về việc tổ chức làm thêm giờ từ trên 200 giờ đến 300 giờ trong một năm.
    verdict: match
    note: 'BLLĐ Điều 107 khoản 4: "phải thông báo bằng văn bản cho cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh". Tên "Sở Nội vụ" lấy từ NĐ 283 Điều 24 khoản 1 điểm b; NĐ 145/2020 Điều 62 vẫn ghi Sở LĐTBXH (mục đã ghi chú đúng).'
  - text: Bắt buộc làm thêm dù không muốn chỉ trong hai nhóm (lệnh động viên/quốc phòng an ninh; bảo vệ tính mạng, tài sản phòng chống thiên tai, hỏa hoạn, dịch bệnh, thảm họa), và vẫn được từ chối nếu có nguy cơ ảnh hưởng tính mạng, sức khỏe
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: "Người sử dụng lao động có quyền yêu cầu người lao động làm thêm giờ vào bất kỳ ngày nào mà không bị giới hạn về số giờ làm thêm theo quy định tại Điều 107 của Bộ luật này và người lao động không được từ chối trong trường hợp sau đây: 1. Thực hiện lệnh động viên, huy động bảo đảm nhiệm vụ quốc phòng, an ninh theo quy định của pháp luật; 2. Thực hiện các công việc nhằm bảo vệ tính mạng con người, tài sản của cơ quan, tổ chức, cá nhân trong phòng ngừa, khắc phục hậu quả thiên tai, hỏa hoạn, dịch bệnh nguy hiểm và thảm họa, trừ trường hợp có nguy cơ ảnh hưởng đến tính mạng, sức khỏe của người lao động theo quy định của pháp luật về an toàn, vệ sinh lao động."
    verdict: partial
    note: BLLĐ Điều 108. Mục không nói rằng trong hai nhóm này luật bỏ trần giờ làm thêm của Điều 107 ("không bị giới hạn về số giờ làm thêm"); người đọc có thể hiểu trần 40/200 giờ luôn tuyệt đối.
  - text: Mỗi lần trả lương phải thông báo bảng kê ghi rõ tiền lương, lương làm thêm, lương ban đêm, khấu trừ
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Mỗi lần trả lương, người sử dụng lao động phải thông báo bảng kê trả lương cho người lao động, trong đó ghi rõ tiền lương, tiền lương làm thêm giờ, tiền lương làm việc vào ban đêm, nội dung và số tiền bị khấu trừ (nếu có).
    verdict: match
    note: BLLĐ Điều 95 khoản 3.
  - text: Chậm lương vì bất khả kháng không quá 30 ngày; chậm từ 15 ngày trở lên phải đền bù ít nhất bằng lãi kỳ hạn 01 tháng
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Trường hợp vì lý do bất khả kháng mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng không thể trả lương đúng hạn thì không được chậm quá 30 ngày; nếu trả lương chậm từ 15 ngày trở lên thì người sử dụng lao động phải đền bù cho người lao động một khoản tiền ít nhất bằng số tiền lãi của số tiền trả chậm tính theo lãi suất huy động tiền gửi có kỳ hạn 01 tháng
    verdict: match
    note: BLLĐ Điều 97 khoản 4.
  - text: Phạt 5.000.000–10.000.000 đồng (1–10 người) khi không trả/trả không đủ lương làm thêm; bậc cao nhất 40–50 triệu với từ 301 người; buộc trả đủ + lãi suất tiền gửi không kỳ hạn cao nhất của NHTM nhà nước
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: không trả hoặc trả không đủ tiền lương làm thêm giờ; ... a) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; ... đ) Từ 40.000.000 đồng đến 50.000.000 đồng đối với vi phạm từ 301 người lao động trở lên. | a) Buộc người sử dụng lao động trả đủ tiền lương cộng với khoản tiền lãi của số tiền lương chậm trả, trả thiếu cho người lao động tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt
    verdict: match
    note: "NĐ 283 Điều 23 khoản 2 (a, đ) và khoản 5 điểm a. Các bậc giữa (11–50: 10–20tr; 51–100: 20–30tr; 101–300: 30–40tr) cũng khớp."
  - text: "Huy động làm thêm không có sự đồng ý của người lao động (trừ Điều 108): phạt 20–25 triệu"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: b) Huy động người lao động làm thêm giờ mà không được sự đồng ý của người lao động, trừ trường hợp theo quy định tại Điều 108 của Bộ luật Lao động.
    verdict: match
    note: NĐ 283 Điều 24 khoản 3 (mức "Từ 20.000.000 đồng đến 25.000.000 đồng" nằm ở câu dẫn khoản 3).
  - text: "Huy động làm thêm vượt số giờ: 5–10tr (1–10 người); 10–20tr (11–50); 20–40tr (51–100); 40–60tr (101–300); 60–75tr (từ 301)"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: "huy động người lao động làm thêm giờ vượt quá số giờ theo quy định của pháp luật theo một trong các mức sau đây: a) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; b) Từ 10.000.000 đồng đến 20.000.000 đồng đối với vi phạm từ 11 người đến 50 người lao động; c) Từ 20.000.000 đồng đến 40.000.000 đồng đối với vi phạm từ 51 người đến 100 người lao động; d) Từ 40.000.000 đồng đến 60.000.000 đồng đối với vi phạm từ 101 người đến 300 người lao động; đ) Từ 60.000.000 đồng đến 75.000.000 đồng đối với vi phạm từ 301 người lao động trở lên."
    verdict: match
    note: NĐ 283 Điều 24 khoản 4.
  - text: "Không thông báo văn bản cho Sở Nội vụ khi làm thêm từ trên 200 đến 300 giờ/năm: phạt 2–5 triệu"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: "Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: ... b) Không thông báo bằng văn bản cho Sở Nội vụ nơi tổ chức làm thêm giờ và nơi đặt trụ sở chính về việc tổ chức làm thêm giờ từ trên 200 giờ đến 300 giờ trong một năm."
    verdict: match
    note: NĐ 283 Điều 24 khoản 1 điểm b.
  - text: Mức phạt trong NĐ là mức của cá nhân; tổ chức (doanh nghiệp) gấp 02 lần; Điều 23, 24 không thuộc ngoại lệ; NĐ 283 hiệu lực từ 10/9/2026
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/7/28/470103-1785229247_v1_1785229756_signed.pdf
    quote: "Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân; trừ trường hợp quy định tại: Điều 8; Điều 9; khoản 3 Điều 10; khoản 3, 4, 5, 6 Điều 19; khoản 2, 4 Điều 36; ... Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân. | Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026."
    verdict: match
    note: NĐ 283 Điều 7 khoản 1 và Điều 66 khoản 1. Danh sách ngoại lệ không có Điều 23, Điều 24 nên "gấp 02 lần" áp dụng cho tổ chức.
  - text: "Bước 4: nộp đơn tới hòa giải viên lao động cấp huyện trong 6 tháng kể từ ngày phát hiện hành vi"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Thời hiệu yêu cầu hòa giải viên lao động thực hiện hòa giải tranh chấp lao động cá nhân là 06 tháng kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm. | Hòa giải viên lao động là người do Chủ tịch Ủy ban nhân dân cấp tỉnh bổ nhiệm để hòa giải tranh chấp lao động
    verdict: partial
    note: 'BLLĐ Điều 190 khoản 1 xác nhận "06 tháng"; Điều 184 khoản 1: hòa giải viên do Chủ tịch UBND cấp tỉnh bổ nhiệm; Điều 181 khoản 3: cơ quan chuyên môn về lao động thuộc UBND là đầu mối tiếp nhận yêu cầu. Chữ "cấp huyện" không có trong BLLĐ hợp nhất (tìm "cấp huyện" chỉ ra đăng ký nội quy, đình công). Cũng không có legal_refs nào dẫn Điều 190/184 cho bước này.'
internal_checks:
  - issue: 'Steps[3] ghi "hòa giải viên lao động cấp huyện": BLLĐ hợp nhất (VBHN 18) không có thẩm quyền "cấp huyện" cho hòa giải viên (Điều 184: do Chủ tịch UBND cấp tỉnh bổ nhiệm; Điều 181 khoản 3: cơ quan chuyên môn về lao động thuộc UBND là đầu mối tiếp nhận). Bước cũng không có legal_refs (Điều 190, 184, 188) và thân mục chỉ nhắc ở phần "Ghi chú", không ở "Pháp luật Việt Nam".'

  - text: "NĐ 283 Điều 24 khoản 4: phạt 5.000.000-10.000.000 đồng với huy động làm thêm vượt số giờ"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "4. Phạt tiền đối với người sử dụng lao động khi có một trong các hành vi: ... huy động người lao động làm thêm giờ vượt quá số giờ theo quy định của pháp luật theo một trong các mức sau đây: a) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; b) Từ 10.000.000 đồng đến 20.000.000 đồng đối với vi phạm từ 11 người đến 50 người lao động; c) Từ 20.000.000 đồng đến 40.000.000 đồng đối với vi phạm từ 51 người đến 100 người lao động; d) Từ 40.000.000 đồng đến 60.000.000 đồng đối với vi phạm từ 101 người đến 300 người lao động; đ) Từ 60.000.000 đồng đến 75.000.000 đồng đối với vi phạm từ 301 người lao động trở lên."

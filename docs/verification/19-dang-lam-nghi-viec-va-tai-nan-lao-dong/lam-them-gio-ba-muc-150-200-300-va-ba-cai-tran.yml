    note: "Tìm 'từ chối' trong toàn VBHN 18 (chỉ có ở Điều 108 và các điều thương lượng tập thể) và NĐ 145/2020 (phần làm thêm giờ): không có câu cấm kỷ luật vì từ chối làm thêm. Chỉ suy ra được gián tiếp từ điểm a khoản 2 Điều 107 (phải có sự đồng ý). Nên viết là suy luận hoặc bỏ."
  - text: "Người hưởng lương tháng thì khoản 300% đã bao gồm ngày lễ (mục 'Ghi chú')"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: ""
    verdict: not-found
    note: "Điều 98 khoản 1 điểm c chỉ nói 300% 'chưa kể tiền lương ngày lễ... đối với người lao động hưởng lương ngày'. Không có câu nào nói rõ 300% 'đã bao gồm' với người hưởng lương tháng; đây là diễn giải ngược (argumentum a contrario), không phải câu chữ luật. Cần gắn nhãn suy luận hoặc dẫn nguồn khác."
claims_internal_check:
  - text: "Chi phí: '40 giờ một tháng là 480 giờ một năm, gần ba tháng làm việc bình thường'"
    verdict: mismatch
    note: "Tự mâu thuẫn với trần 200/300 giờ/năm trong cùng mục (Điều 107 khoản 2c, 3). 40x12=480 không thể hợp pháp: trần thực tế là 200 giờ (300 ở nhóm đặc biệt). 300 giờ ≈ 7,5 tuần 40 giờ; 200 giờ = 5 tuần. Lỗi số liệu/diễn đạt của bản nháp, cần sửa."
validity:
  doc: "BLLĐ 45/2019/QH14, VBHN 18/VBHN-VPQH ngày 12/02/2026 (Công báo số 131, ngày 28/02/2026); NĐ 283/2026/NĐ-CP ngày 15/7/2026 (Công báo số 448)"
  in_force: true
  effective_from: "BLLĐ: 2021-01-01 (VBHN ghi: 'có hiệu lực kể từ ngày 01 tháng 01 năm 2021'); NĐ 283: 2026-09-10 (Điều 66 khoản 1: 'có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026')"
  amended_by: ["BLLĐ sửa bởi Luật 71/2025/QH15, 113/2025/QH15, 124/2025/QH15 (đã hợp nhất, không đụng Điều 95/97/98/104/107/108)"]
  note: "NĐ 283 Điều 66 khoản 4: NĐ 12/2022/NĐ-CP hết hiệu lực từ ngày 283 có hiệu lực. Mục cũng cần lưu ý Điều 67 khoản 1 (hành vi xảy ra trước 10/9/2026 áp dụng NĐ cũ). Không truy cập được vbpl.vn để đối chiếu thứ hai; trang congbao không hiện trạng thái hiệu lực (trường để trống) nên kết luận 'còn hiệu lực' dựa vào chính văn bản và không thấy văn bản thay thế/sửa trong tìm kiếm ngày 2026-11-08."
suggested_edits:
  - "Sửa 'Chi phí': bỏ '40 giờ một tháng là 480 giờ một năm' (mâu thuẫn trần 200/300 giờ); dùng 200 hoặc 300 giờ/năm."
  - "Điều 24 khoản 4: nêu đủ thang phạt theo số người (5-10tr cho 1-10 người ... 60-75tr cho >=301 người), nhắc doanh nghiệp x2."
  - "Điều 23 khoản 2: nêu thang theo số người hoặc ghi rõ 'bậc thấp nhất'."
  - "Bỏ hoặc gắn nhãn suy luận: 'không được lấy từ chối làm thêm làm căn cứ kỷ luật' và 'lương tháng thì 300% đã gồm ngày lễ'."
  - "Nghị định 145/2020 (điều về thông báo làm thêm 200-300 giờ) vẫn ghi 'Sở Lao động - Thương binh và Xã hội'; mục dùng 'Sở Nội vụ' theo NĐ 283 - hợp lý nhưng nên ghi rõ nguồn của tên gọi."
  - "Đề xuất: giữ nguyên trạng thái, KHÔNG nâng lên source-checked cho tới khi sửa các mục mismatch/not-found."

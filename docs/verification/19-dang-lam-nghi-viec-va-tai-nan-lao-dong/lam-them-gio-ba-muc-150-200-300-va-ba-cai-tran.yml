claims:
  - text: "Làm thêm ngày thường ít nhất 150%, ngày nghỉ hằng tuần ít nhất 200%, ngày lễ/tết/nghỉ có hưởng lương ít nhất 300% (chưa kể lương ngày lễ với người hưởng lương ngày)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "a) Vào ngày thường, ít nhất bằng 150%; b) Vào ngày nghỉ hằng tuần, ít nhất bằng 200%; c) Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày."
    verdict: match
    note: "Điều 98 khoản 1 (VBHN 18, Công báo số 131, tr.~63)."
  - text: "Làm việc ban đêm trả thêm ít nhất 30% (Điều 98 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "2. Người lao động làm việc vào ban đêm thì được trả thêm ít nhất bằng 30% tiền lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc của ngày làm việc bình thường."
    verdict: match
    note: ""
  - text: "Làm thêm giờ vào ban đêm được trả thêm 20% tính trên lương công việc ban ngày (Điều 98 khoản 3); ba tầng cộng dồn"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "3. Người lao động làm thêm giờ vào ban đêm thì ngoài việc trả lương theo quy định tại khoản 1 và khoản 2 Điều này, người lao động còn được trả thêm 20% tiền lương tính theo đơn giá tiền lương hoặc tiền lương theo công việc làm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết."

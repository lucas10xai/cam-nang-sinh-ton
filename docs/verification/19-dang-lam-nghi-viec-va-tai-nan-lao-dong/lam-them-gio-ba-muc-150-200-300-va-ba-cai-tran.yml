  - text: "Điều 108: buộc làm thêm khi lệnh động viên/quốc phòng, bảo vệ tính mạng-tài sản trong thiên tai, hỏa hoạn, dịch bệnh; trừ khi có nguy cơ ảnh hưởng tính mạng, sức khỏe"

  - text: "Trần 200 giờ/năm; mở lên 300 giờ/năm cho nhóm ngành (dệt may da giày, điện, điện tử, chế biến nông lâm diêm thủy sản; điện, viễn thông, lọc dầu, cấp thoát nước; lao động trình độ cao; việc cấp bách; nhóm Chính phủ quy định)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "c) Bảo đảm số giờ làm thêm của người lao động không quá 200 giờ trong 01 năm, trừ trường hợp quy định tại khoản 3 Điều này. 3. Người sử dụng lao động được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm trong một số ngành, nghề, công việc hoặc trường hợp sau đây: a) Sản xuất, gia công xuất khẩu sản phẩm hàng dệt, may, da, giày, điện, điện tử, chế biến nông, lâm, diêm nghiệp, thủy sản; b) Sản xuất, cung cấp điện, viễn thông, lọc dầu; cấp, thoát nước;"

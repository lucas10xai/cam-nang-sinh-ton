    note: ""
  - text: "NĐ 283 Điều 7 khoản 1: mức ghi trong nghị định là mức của cá nhân, tổ chức/doanh nghiệp phạt gấp đôi"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    verdict: match
    note: "Câu đầu: 'Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân; trừ trường hợp quy định tại: Điều 8; Điều 9; ...' - danh sách ngoại lệ không gồm Điều 23, Điều 24. Nghị định dùng chữ 'tổ chức' (khoản 2 liệt kê), mục dùng 'doanh nghiệp' - tương đương; nên dẫn đúng 'tổ chức'."
  - text: "Người sử dụng lao động không được lấy việc từ chối làm thêm làm căn cứ kỷ luật (mục 'Pháp luật Việt Nam' viết như một quy định)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: ""

claims:
  - text: "Trợ cấp thôi việc: nửa tháng lương mỗi năm cho người làm thường xuyên từ đủ 12 tháng, khi hợp đồng chấm dứt theo khoản 1, 2, 3, 4, 6, 7, 9, 10 Điều 34; trừ đủ điều kiện hưởng lương hưu và tự ý bỏ việc theo điểm e khoản 1 Điều 36 (Điều 46 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34 của Bộ luật này thì người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này."
    verdict: match
    note: "Chữ lấy từ DOCX chính thức tải trên trang Công báo vì PDF ký của 18/VBHN-VPQH là ảnh quét (không trích được chữ)."
  - text: "Thời gian tính trợ cấp = tổng thời gian làm việc thực tế trừ thời gian đã tham gia bảo hiểm thất nghiệp và thời gian đã được trả trợ cấp (Điều 46 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Thời gian làm việc để tính trợ cấp thôi việc là tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động trừ đi thời gian người lao động đã tham gia bảo hiểm thất nghiệp theo quy định của pháp luật về bảo hiểm thất nghiệp và thời gian làm việc đã được người sử dụng lao động chi trả trợ cấp thôi việc, trợ cấp mất việc làm."
    verdict: match
    note: ""
  - text: "Lương tính trợ cấp là bình quân 06 tháng liền kề theo hợp đồng trước khi thôi việc (Điều 46 khoản 3; NĐ 145 Điều 8 khoản 5)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "3. Tiền lương để tính trợ cấp thôi việc là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc."
    verdict: match
    note: "NĐ 145 Điều 8 khoản 5 điểm a: 'là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc, mất việc làm.'"
  - text: "Trợ cấp mất việc làm: 01 tháng lương mỗi năm, ít nhất 02 tháng lương, cho người mất việc theo khoản 11 Điều 34 (Điều 47 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "1. Người sử dụng lao động trả trợ cấp mất việc làm cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên mà bị mất việc làm theo quy định tại khoản 11 Điều 34 của Bộ luật này, cứ mỗi năm làm việc trả 01 tháng tiền lương nhưng ít nhất bằng 02 tháng tiền lương."
    verdict: match
    note: "Điều 34 khoản 11: 'Người sử dụng lao động cho người lao động thôi việc theo quy định tại Điều 42 và Điều 43 của Bộ luật này.'"
  - text: "Sàn 02 tháng chỉ áp dụng khi thời gian làm việc để tính trợ cấp mất việc làm ít hơn 24 tháng (NĐ 145 Điều 8 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-145-2020-nd-cp-32732.htm
    quote: "nhưng thời gian làm việc để tính trợ cấp mất việc làm quy định tại khoản 3 Điều này ít hơn 24 tháng thì người sử dụng lao động có trách nhiệm chi trả trợ cấp mất việc làm cho người lao động ít nhất bằng 02 tháng tiền lương."
    verdict: match
    note: "Nguồn: Công báo số 1203+1204 (28/12/2020), PDF chữ trích được. Hiệu lực nghị định: xem validity."
  - text: "Thời gian làm việc thực tế gồm làm việc trực tiếp, thử việc, được cử đi học, nghỉ ốm/thai sản theo BHXH, nghỉ điều trị TNLĐ-BNN có lương, nghỉ hằng tuần/hưởng nguyên lương, ngừng việc không do lỗi NLĐ (NĐ 145 Điều 8 khoản 3 điểm a)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-145-2020-nd-cp-32732.htm
    quote: "Tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động bao gồm: thời gian người lao động đã trực tiếp làm việc; thời gian thử việc; thời gian được người sử dụng lao động cử đi học; thời gian nghỉ hưởng chế độ ốm đau, thai sản theo quy định của pháp luật về bảo hiểm xã hội; thời gian nghỉ việc để điều trị, phục hồi chức năng lao động khi bị tai nạn lao động, bệnh nghề nghiệp mà được người sử dụng lao động trả lương theo quy định của pháp luật về an toàn, vệ sinh lao động;"
    verdict: match
    note: "Phần còn lại ('thời gian ngừng việc không do lỗi của người lao động; thời gian nghỉ hằng tuần theo Điều 111, nghỉ việc hưởng nguyên lương theo Điều 112, Điều 113, Điều 114, khoản 1 Điều 115') cũng khớp."
  - text: "Làm tròn: tháng lẻ ≤ 06 tháng tính 1/2 năm, trên 06 tháng tính 01 năm (NĐ 145 Điều 8 khoản 3 điểm c)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-145-2020-nd-cp-32732.htm
    quote: "trường hợp có tháng lẻ ít hơn hoặc bằng 06 tháng được tính bằng 1/2 năm, trên 06 tháng được tính bằng 01 năm làm việc."
    verdict: match
    note: "Cùng điểm c: 'được tính theo năm (đủ 12 tháng)'."
  - text: "Trong 14 ngày làm việc kể từ ngày chấm dứt, hai bên thanh toán đầy đủ; kéo dài không quá 30 ngày trong bốn trường hợp (Điều 48 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "1. Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày:"
    verdict: match

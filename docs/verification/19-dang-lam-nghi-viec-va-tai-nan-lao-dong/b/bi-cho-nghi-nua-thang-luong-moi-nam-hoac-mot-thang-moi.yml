  - text: "NSDLĐ phải hoàn thành thủ tục xác nhận thời gian đóng BHXH, BHTN, trả bản chính giấy tờ đã giữ, và cung cấp bản sao tài liệu nếu NLĐ yêu cầu (Điều 48 khoản 3)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động; b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu."
    verdict: match
    note: ""

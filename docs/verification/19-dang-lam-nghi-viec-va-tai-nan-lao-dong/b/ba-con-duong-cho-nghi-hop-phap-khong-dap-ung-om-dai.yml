  - "tldr, Nói dễ hiểu, tiêu đề, Ghi chú: thay 'chỉ qua ba cửa' bằng 'ba con đường thường gặp' và thêm câu: 'Điều 36 khoản 1 còn các căn cứ khác (không có mặt sau thời hạn tạm hoãn, đủ tuổi nghỉ hưu, tự ý bỏ việc, khai không trung thực); Điều 34 còn hết hạn hợp đồng, thỏa thuận, sa thải.' Dựa vào Điều 36 khoản 1 điểm a-g và Điều 34."
  - "Mục 'Ba cửa đơn phương' ở Pháp luật VN: đổi thành 'Ba căn cứ của Điều 36 hay gặp (điểm a, b, c)'; giữ riêng 'Đường thứ ba: cơ cấu (Điều 42)'. Hoặc đếm lại: không đáp ứng (36.1.a), ốm dài (36.1.b), cơ cấu (Điều 42); điểm c (thiên tai, di dời) để ở đoạn 'căn cứ khác'."
  - "Pháp luật VN, Điều 42: thêm điều kiện 'ảnh hưởng đến việc làm của nhiều người lao động' (khoản 3) / 'nhiều người có nguy cơ mất việc làm' (khoản 4) và 'trong trường hợp không thể giải quyết được việc làm' (khoản 5)."
  - "Điều 36 điểm a: viết 'phải tham khảo ý kiến tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện' (nguyên văn)."

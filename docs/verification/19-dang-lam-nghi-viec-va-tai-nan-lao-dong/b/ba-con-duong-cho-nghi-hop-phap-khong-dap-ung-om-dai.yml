  - text: "Điểm b: ốm đau, tai nạn điều trị 12 tháng liên tục (không xác định thời hạn), 06 tháng liên tục (hợp đồng 12-36 tháng), quá nửa thời hạn (dưới 12 tháng) mà khả năng lao động chưa hồi phục (Điều 36 khoản 1 điểm b)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "b) Người lao động bị ốm đau, tai nạn đã điều trị 12 tháng liên tục đối với người làm việc theo hợp đồng lao động không xác định thời hạn hoặc đã điều trị 06 tháng liên tục đối với người làm việc theo hợp đồng lao động xác định thời hạn có thời hạn từ 12 tháng đến 36 tháng hoặc quá nửa thời hạn hợp đồng lao động đối với người làm việc theo hợp đồng lao động xác định thời hạn có thời hạn dưới 12 tháng mà khả năng lao động chưa hồi phục."

  - text: "Những lúc bị cấm đơn phương chấm dứt: đang điều trị, nghỉ hằng năm/việc riêng, nữ mang thai, nghỉ thai sản hoặc nuôi con dưới 12 tháng tuổi; trừ điểm b khoản 1 Điều 36 (Điều 37)"

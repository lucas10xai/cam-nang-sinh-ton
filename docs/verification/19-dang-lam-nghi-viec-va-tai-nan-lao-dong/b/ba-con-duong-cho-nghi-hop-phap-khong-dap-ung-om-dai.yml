  - text: "Thay đổi cơ cấu, công nghệ gồm thay đổi cơ cấu tổ chức/tổ chức lại lao động, quy trình-công nghệ-máy móc, sản phẩm; lý do kinh tế gồm khủng hoảng, suy thoái, thực hiện chính sách/cam kết quốc tế (Điều 42 khoản 1, 2)"

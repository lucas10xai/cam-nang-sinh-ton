claims:
  - text: "Thu nhập từ tiền lương, tiền công gồm phụ cấp, trợ cấp, thu nhập khác, trừ một danh sách; trong danh sách trừ có trợ cấp thôi việc, trợ cấp mất việc làm (Luật TNCN 109/2025 Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "match"
    quote: "2. Thu nhập từ tiền lương, tiền công, bao gồm: […] c) Các khoản phụ cấp, trợ cấp, thu nhập khác trừ các khoản: […] trợ cấp thôi việc, trợ cấp mất việc làm; trợ cấp mang tính chất bảo trợ xã hội và các khoản phụ cấp, trợ cấp, thu nhập khác không mang tính chất tiền lương, tiền công do Chính phủ quy định."
    note: "Luật chỉ ghi \"trợ cấp thôi việc, trợ cấp mất việc làm\" mà không ghi \"trả đúng luật lao động\"; cụm \"theo quy định của pháp luật\" nằm ở NĐ 253/2026 Điều 8 khoản 3 điểm h (xem claim dưới)."
  - text: "Trong danh sách trừ ra có trợ cấp tai nạn lao động, bệnh nghề nghiệp; trợ cấp một lần khi sinh con/nhận nuôi; trợ cấp suy giảm khả năng lao động; trợ cấp hưu trí một lần; trợ cấp tuất hằng tháng và trợ cấp khác theo pháp luật BHXH (Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "match"
    quote: "trợ cấp tai nạn lao động, bệnh nghề nghiệp, trợ cấp một lần khi sinh con hoặc nhận nuôi con nuôi, trợ cấp do suy giảm khả năng lao động, trợ cấp hưu trí một lần, trợ cấp tuất hàng tháng và các khoản trợ cấp khác theo quy định của pháp luật về bảo hiểm xã hội"
  - text: "\"Phần trả thêm ngoài luật\" (đơn vị tự nguyện trả thêm, khoản \"hỗ trợ\" ghi trong biên bản) vẫn vào thu nhập chịu thuế, không có mức miễn riêng; cơ chế miễn thuế ngoài mức luật \"không có trong luật Việt Nam\" (tldr, Nói dễ hiểu, Pháp luật VN \"Phần tính thuế\", Bẫy 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-253-2026-nd-cp-469959.htm"
    verdict: "mismatch"
    quote: "h) Trợ cấp khó khăn đột xuất, trợ cấp thất nghiệp, trợ cấp thôi việc, trợ cấp mất việc làm theo quy định của pháp luật. […] Trường hợp tổ chức, doanh nghiệp có quy định cụ thể tại quy chế tài chính hoặc quy chế nội bộ hoặc hợp đồng lao động hoặc thỏa ước lao động về mức trợ cấp thôi việc, trợ cấp mất việc làm cao hơn mức quy định của pháp luật thì phần chi trả thực tế vượt mức này cũng không tính vào thu nhập chịu thuế của người lao động;"
    note: "NĐ 253/2026/NĐ-CP (ngày 30/6/2026, hiệu lực 01/7/2026, hướng dẫn Luật TNCN 109/2025) Điều 8 khoản 3 điểm h: trợ cấp thôi việc, mất việc theo quy định pháp luật không tính thuế; nếu quy chế tài chính/quy chế nội bộ/hợp đồng lao động/thỏa ước lao động quy định mức cao hơn luật thì phần chi trả thực tế vượt mức đó CŨNG không tính vào thu nhập chịu thuế. Vì vậy câu \"phần thêm thì tính (thuế), không có mức miễn riêng\" sai trong trường hợp có văn bản nội bộ/hợp đồng/thỏa ước nêu mức cao hơn. Mục không dẫn NĐ 253 (thiếu trong legal_refs). Khoản trả thêm không có căn cứ trong các văn bản đó (ví dụ chỉ nêu trong một biên bản thỏa thuận lúc nghỉ) thì lập luận của mục vẫn đúng ý, nhưng phải nói rõ điều kiện này."
  - text: "Trợ cấp thôi việc: nửa tháng tiền lương cho mỗi năm làm việc với người làm thường xuyên từ đủ 12 tháng (Điều 46 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "partial"
    quote: "mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội […] 2. Thời gian làm việc để tính trợ cấp thôi việc là tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động trừ đi thời gian người lao động đã tham gia bảo hiểm thất nghiệp"
    note: "tldr \"nửa tháng lương mỗi năm làm việc\" và Chi phí \"số năm làm việc\" bỏ qua khoản 2: phải trừ thời gian đã đóng BHTN, nên \"số năm làm việc\" dùng để tự kiểm không phải toàn bộ thâm niên. Với người đã đóng BHTN toàn bộ thời gian từ 2009 thì thường không còn năm nào tính trợ cấp thôi việc. Cũng bỏ ngoại lệ đủ điều kiện hưởng lương hưu."
  - text: "Tiền lương tính trợ cấp thôi việc là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi thôi việc (Điều 46 khoản 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "3. Tiền lương để tính trợ cấp thôi việc là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc."
  - text: "Giảm trừ gia cảnh 15,5 triệu đồng/tháng (186 triệu đồng/năm) cho người nộp thuế, 6,2 triệu đồng/tháng cho mỗi người phụ thuộc; trừ trước khi tính thuế (Điều 10 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "match"
    quote: "1. Giảm trừ gia cảnh là số tiền được trừ vào thu nhập chịu thuế trước khi tính thuế đối với thu nhập từ tiền lương, tiền công của người nộp thuế là cá nhân cư trú. Giảm trừ gia cảnh gồm: […] a) Mức giảm trừ đối với người nộp thuế là 15,5 triệu đồng/tháng (186 triệu đồng/năm); […] b) Mức giảm trừ đối với mỗi người phụ thuộc là 6,2 triệu đồng/tháng."
    note: "Khoản 2 cho phép điều chỉnh mức giảm trừ theo biến động giá; tldr \"sau khi trừ giảm trừ 15.500.000 đồng một tháng\" đúng tại thời điểm kiểm."
  - text: "Biểu thuế lũy tiến 5 bậc: đến 120 triệu/năm 5%; trên 120-360: 10%; trên 360-720: 20%; trên 720-1.200: 30%; trên 1.200: 35% (Điều 9 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "match"
    quote: "Đến 120 Đến 10 5 […] Trên 120 đến 360 Trên 10 đến 30 10 […] Trên 360 đến 720 Trên 30 đến 60 20 […] Trên 720 đến 1.200 Trên 60 đến 100 30 […] Trên 1.200 Trên 100 35"
    note: "Trích từng dòng của bảng (cột: phần thu nhập tính thuế/năm, /tháng, thuế suất %). Biểu này áp dụng cho thu nhập tính thuế khoản 2 Điều 8 của Luật."
  - text: "Luật TNCN 109/2025/QH15 hiệu lực từ 01/7/2026"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "match"
    quote: "1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026, trừ trường hợp quy định tại khoản 2 Điều này. […] 2. Các quy định liên quan đến thu nhập từ kinh doanh, từ tiền lương, tiền công của cá nhân cư trú áp dụng từ kỳ tính thuế năm 2026."
    note: "Phần tiền lương, tiền công của cá nhân cư trú áp dụng từ kỳ tính thuế năm 2026."
  - text: "Khoản trả thêm ngoài luật \"cộng vào thu nhập chịu thuế, không có mức miễn riêng\" (Bẫy 1, suy ra từ Điều 3 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "inference"
    quote: "b) Tiền thù lao, các khoản lợi ích bằng tiền hoặc không bằng tiền dưới mọi hình thức;"
    note: "Mục tự gắn nhãn \"suy ra\", nhưng tldr, Nói dễ hiểu và bước 1-2 dùng nó như kết luận chắc chắn. Điều 3 khoản 2 điểm a, b cho thấy lợi ích bằng tiền dưới mọi hình thức là thu nhập chịu thuế, nhưng không giải quyết phần trợ cấp vượt mức; việc đó do NĐ 253 Điều 8 khoản 3 điểm h quy định (mismatch ở trên)."
  - text: "\"Hỏi trước khi ký biên bản nhận tiền thì đơn vị còn phải giải trình; hỏi sau thì phải chờ quyết toán thuế và tự làm hồ sơ\" (Bẫy 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-109-2025-qh15-468671.htm"
    verdict: "not-found"
    note: "Không có điều khoản nào trong Luật TNCN được dẫn nói về nghĩa vụ giải trình hay thủ tục sau quyết toán; đây là mô tả thực tiễn không có nguồn."

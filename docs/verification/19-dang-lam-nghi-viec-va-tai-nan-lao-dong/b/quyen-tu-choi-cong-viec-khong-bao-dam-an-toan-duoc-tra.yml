suggested_edits:
  - "Mức phạt: ghi rõ 5.000.000-10.000.000 đồng (Điều 34 khoản 2) và 20.000.000-25.000.000 đồng (Điều 33 khoản 7 điểm a) là mức cá nhân; doanh nghiệp gấp đôi (Điều 7 khoản 1)."
  - "Mục 'Điều công ty bị nghiêm cấm': thêm Điều 33 khoản 10 NĐ 283/2026: phạt 30.000.000-40.000.000 đồng khi buộc NLĐ làm việc, không cho rời nơi làm việc, hoặc buộc tiếp tục làm khi nguy cơ chưa được khắc phục."
  - "tldr: đổi 'tự ý vắng từ 05 ngày làm việc liên tục không báo thì mất bảo vệ' thành 'tự ý bỏ việc không có lý do chính đáng từ 05 ngày làm việc liên tục là căn cứ để công ty đơn phương chấm dứt, không báo trước và không trợ cấp thôi việc (Điều 36 khoản 1 điểm e, Điều 46 khoản 1); đã báo ngay và có nguy cơ thật thì (suy ra) vẫn trong quyền Điều 6'."
  - "Chi phí: bỏ 'bị trừ lương những ngày không vào, bị kỷ luật' hoặc gắn nhãn 'suy ra'/'rủi ro thực tế'."
  - "Ghi chú, câu 'Bạn không cần chứng minh mình đúng trước khi rời': đổi thành 'Bạn không phải chờ chứng minh trước khi rời, nhưng quyền chỉ áp dụng khi nguy cơ thật sự rõ và nghiêm trọng (Điều 6 khoản 1 điểm đ), nên phải ghi lại giờ, người nhận tin, ảnh'."
  - "Bẫy 1: thêm 'không có lý do chính đáng' khi nói 05 ngày làm việc liên tục."
  - "Phần Phía hợp đồng lao động: Điều 35 khoản 2 điểm a: thêm 'trừ trường hợp Điều 29' và lưu ý khác biệt giữa 'điều kiện làm việc theo thỏa thuận' với 'điều kiện an toàn'."

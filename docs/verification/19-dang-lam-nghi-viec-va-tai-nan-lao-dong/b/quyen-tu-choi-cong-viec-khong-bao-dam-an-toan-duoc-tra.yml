claims:
  - text: "Điều 6 khoản 1 điểm đ: được từ chối làm việc hoặc rời nơi làm việc mà vẫn được trả đủ lương, không bị coi là vi phạm kỷ luật, khi thấy rõ có nguy cơ TNLĐ đe dọa nghiêm trọng tính mạng hoặc sức khỏe"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Từ chối làm công việc hoặc rời bỏ nơi làm việc mà vẫn được trả đủ tiền lương và không bị coi là vi phạm kỷ luật lao động khi thấy rõ có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng tính mạng hoặc sức khỏe của mình"
    verdict: "match"
    note: " Nguồn: bản Công báo số 871+872 (PDF có lớp chữ)."
  - text: "Điều 6 khoản 1 điểm đ: phải báo ngay cho người quản lý trực tiếp; chỉ tiếp tục làm khi người quản lý trực tiếp và người phụ trách an toàn, vệ sinh lao động đã khắc phục"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "báo ngay cho người quản lý trực tiếp để có phương án xử lý; chỉ tiếp tục làm việc khi người quản lý trực tiếp và người phụ trách công tác an toàn, vệ sinh lao động đã khắc phục các nguy cơ để bảo đảm an toàn, vệ sinh lao động;"
    verdict: "match"
    note: "Câu bắt đầu 'nhưng phải' ở cuối trang trước (đã đối chiếu qua ngắt trang)."
  - text: "Điều 12 khoản 1: nghiêm cấm buộc NLĐ làm việc/không được rời nơi làm việc khi có nguy cơ TNLĐ đe dọa nghiêm trọng, hoặc buộc tiếp tục làm khi nguy cơ chưa được khắc phục"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "buộc người lao động phải làm việc hoặc không được rời khỏi nơi làm việc khi có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng sức khỏe, tính mạng của họ hoặc buộc người lao động tiếp tục làm việc khi các nguy cơ đó chưa được khắc phục."
    verdict: "match"
  - text: "Điều 12 khoản 5: cấm phân biệt đối xử vì lý do NLĐ từ chối làm việc hoặc rời nơi làm việc khi thấy rõ nguy cơ"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "phân biệt đối xử vì lý do người lao động từ chối làm công việc hoặc rời bỏ nơi làm việc khi thấy rõ có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng tính mạng hoặc sức khỏe của mình;"
    verdict: "match"
  - text: "Nghị định 283/2026 Điều 34 khoản 2: phạt 5.000.000-10.000.000 đồng với 01-10 NLĐ khi phân biệt đối xử vì lý do từ chối"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "phân biệt đối xử vì lý do người lao động từ chối làm công việc hoặc rời bỏ nơi làm việc khi thấy rõ có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng tính mạng hoặc sức khỏe của mình"
    verdict: "match"
    note: "Mức: 'a) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động' (cùng khoản; bậc cao nhất 40-50 triệu cho 301 NLĐ trở lên). Mức này là mức cá nhân; Điều 34 không thuộc ngoại lệ Điều 7 khoản 1 nên doanh nghiệp bị gấp đôi (10-20 triệu) - mục không nêu."
  - text: "Nghị định 283/2026 Điều 33 khoản 7 điểm a: phạt 20.000.000-25.000.000 đồng nếu không thực hiện ngay biện pháp khắc phục hoặc ngừng hoạt động của máy, thiết bị, nơi làm việc có nguy cơ gây TNLĐ, BNN"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: a) Không thực hiện ngay những biện pháp khắc phục hoặc ngừng hoạt động của máy, thiết bị, nơi làm việc có nguy cơ gây tai nạn lao động, bệnh nghề nghiệp;"
    verdict: "match"
    note: "Cũng là mức cá nhân (doanh nghiệp gấp đôi). Mục bỏ Điều 33 khoản 10: 'Phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng đối với người sử dụng lao động có một trong các hành vi... a) Buộc người lao động phải làm việc khi có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng sức khỏe, tính mạng của họ không đúng quy định của pháp luật' - đây mới là chế tài trực tiếp cho hành vi ở Điều 12 khoản 1 mà mục nêu ở phần 'Điều công ty bị nghiêm cấm'."
  - text: "Điều 35 khoản 2 điểm a: đơn phương chấm dứt không cần báo trước khi không được bố trí đúng công việc, địa điểm hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận (a); ngược đãi, đánh đập, nhục mạ (c); quấy rối tình dục (d)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Không được bố trí theo đúng công việc, địa điểm làm việc hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận, trừ trường hợp quy định tại Điều 29 của Bộ luật này;"
    verdict: "partial"
    note: "Điều kiện 'trừ trường hợp Điều 29' bị bỏ. Điều 35 khoản 2 điểm c gồm 'bị người sử dụng lao động ngược đãi, đánh đập hoặc có lời nói, hành vi nhục mạ, hành vi làm ảnh hưởng đến sức khỏe, nhân phẩm, danh dự; bị cưỡng bức lao động' - mục rút gọn đúng ý. Mục không nói rõ 'điều kiện làm việc theo thỏa thuận' có hẹp hơn 'không an toàn' (an toàn không nhất thiết được ghi trong thỏa thuận): đối chiếu giữa Điều 6 ATVSLĐ và Điều 35 là suy luận. Nguồn: bản hợp nhất 18/VBHN-VPQH (Công báo, tệp DOCX đọc được) là văn bản hợp nhất chính thức của BLLĐ 45/2019/QH14; bản PDF gốc ở legal_refs (45.signed.pdf) là ảnh quét, không trích được chữ nên nguyên văn lấy từ bản hợp nhất."
  - text: "Điều 36 khoản 1 điểm e: NSDLĐ được đơn phương chấm dứt khi NLĐ tự ý bỏ việc không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Người lao động tự ý bỏ việc mà không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên;"
    verdict: "match"
  - text: "Điều 46 khoản 1: trường hợp điểm e khoản 1 Điều 36 bị loại khỏi diện được trợ cấp thôi việc"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này."
    verdict: "match"
  - text: "Suy ra: 'Đã báo ngay và nguy cơ chưa được khắc phục thì bạn vẫn đang dùng quyền theo Điều 6' (mục tự gắn 'suy ra')"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Người lao động tự ý bỏ việc mà không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên;"
    verdict: "inference"
    note: "Mục đã gắn nhãn 'suy ra từ Điều 6 khoản 1 điểm đ và Điều 36 khoản 1 điểm e', đúng cách. Lập luận hợp lý: Điều 36 điểm e chỉ áp dụng cho bỏ việc 'không có lý do chính đáng'; Điều 6 không trực tiếp nói ngày thứ 5 trở đi. Tranh chấp về 'thấy rõ nguy cơ' vẫn có thể xảy ra (xem bên dưới)."
  - text: "tldr: 'Phải báo ngay cho quản lý trực tiếp; tự ý vắng từ 05 ngày làm việc liên tục không báo thì mất bảo vệ'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Người lao động tự ý bỏ việc mà không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên;"
    verdict: "inference"
    note: "Điều 36 khoản 1 điểm e nói 'không có lý do chính đáng', không nói 'không báo'. 'Mất bảo vệ nếu không báo' là diễn giải của mục (báo ngay là điều kiện quyền ở Điều 6 khoản 1 điểm đ, nhưng hậu quả cụ thể không được luật nói rõ). Nên gắn nhãn suy ra ở tldr."
  - text: "Ghi chú: 'Bạn không cần chứng minh mình đúng trước khi rời khỏi chỗ nguy hiểm'"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "khi thấy rõ có nguy cơ xảy ra tai nạn lao động đe dọa nghiêm trọng tính mạng hoặc sức khỏe của mình"
    verdict: "partial"
    note: "Quyền phụ thuộc điều kiện 'thấy rõ có nguy cơ... đe dọa nghiêm trọng tính mạng hoặc sức khỏe'; luật không ghi ai chứng minh. Nếu bị tranh chấp, nguy cơ có thật hay không sẽ bị xem xét; ghi giờ, ảnh, tin nhắn (steps 2) là chính là để chứng minh. Câu 'không cần chứng minh' đúng khi hành động tức thời, dễ bị hiểu thành bảo vệ tuyệt đối."
  - text: "Chi phí: 'Làm sai thì ... bị trừ lương những ngày không vào, bị kỷ luật'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: ""
    verdict: "not-found"
    note: "Không có điều luật trong nguồn mục nêu 'trừ lương' hay kỷ luật cho trường hợp báo sai/không báo; Điều 6 khoản 1 điểm đ chỉ nói quyền có điều kiện. Hậu quả cụ thể của việc không báo là suy luận."
  - text: "Step 3: 'Không xin nghỉ phép hay nghỉ không lương để tránh nguy hiểm: luật cho hưởng đủ lương'"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "mà vẫn được trả đủ tiền lương và không bị coi là vi phạm kỷ luật lao động"
    verdict: "match"
    note: "Lời khuyên hợp lý từ Điều 6 khoản 1 điểm đ; điều kiện 'báo ngay' và 'thấy rõ nguy cơ' vẫn áp dụng. Step 4 'chỉ quay lại khi ... đã khắc phục' khớp điểm đ."

claims:
  - text: "Điều 48 khoản 3 điểm a: hoàn thành thủ tục xác nhận BHXH/BHTN và trả lại giấy tờ bản chính đã giữ"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động;"
    verdict: "match"
    note: " Nguồn: bản hợp nhất 18/VBHN-VPQH (Công báo, tệp DOCX đọc được) là văn bản hợp nhất chính thức của BLLĐ 45/2019/QH14; bản PDF gốc ở legal_refs (45.signed.pdf) là ảnh quét, không trích được chữ nên nguyên văn lấy từ bản hợp nhất."
  - text: "Điều 48 khoản 3 điểm b: cung cấp bản sao tài liệu về quá trình làm việc khi NLĐ yêu cầu; chi phí sao, gửi do NSDLĐ trả"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    verdict: "match"
    note: "Điều luật không liệt kê cụ thể bảng lương, chấm công, quyết định, biên bản họp: mục suy ra 'nghĩa là ... đều xin được' từ cụm 'tài liệu liên quan đến quá trình làm việc'; hợp lý nhưng là diễn giải."
  - text: "Điều 48 khoản 1: thanh toán trong 14 ngày làm việc từ ngày chấm dứt HĐ; kéo dài không quá 30 ngày trong 4 trường hợp"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày:"
    verdict: "match"
    note: "4 trường hợp a-d khớp danh sách trong mục. Đây là hạn thanh toán tiền, KHÔNG phải hạn cung cấp bản sao (Điều 48 khoản 3 không nêu hạn)."
  - text: "Điều 190 khoản 1: 06 tháng yêu cầu hòa giải viên"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Thời hiệu yêu cầu hòa giải viên lao động thực hiện hòa giải tranh chấp lao động cá nhân là 06 tháng kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: "match"
  - text: "Điều 190 khoản 2: 09 tháng yêu cầu Hội đồng trọng tài lao động"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Thời hiệu yêu cầu Hội đồng trọng tài lao động giải quyết tranh chấp lao động cá nhân là 09 tháng kể từ ngày phát hiện ra hành vi"
    verdict: "match"
  - text: "Điều 190 khoản 3: 01 năm yêu cầu Tòa án"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi"
    verdict: "match"
  - text: "Điều 190 khoản 4: trừ thời gian bất khả kháng/trở ngại khách quan nếu chứng minh được"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Trường hợp người yêu cầu chứng minh được vì sự kiện bất khả kháng, trở ngại khách quan hoặc lý do khác theo quy định của pháp luật mà không thể yêu cầu đúng thời hạn quy định tại Điều này thì thời gian có sự kiện bất khả kháng, trở ngại khách quan hoặc lý do đó không tính vào thời hiệu"
    verdict: "match"
  - text: "tldr / Nói dễ hiểu: 'thời hiệu đòi tiền là 01 năm'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi"
    verdict: "partial"
    note: "01 năm chỉ là thời hiệu yêu cầu TÒA ÁN; yêu cầu hòa giải viên là 06 tháng và trọng tài 09 tháng (Điều 190). Tldr gọn thành 'thời hiệu đòi tiền 01 năm' dễ khiến người đọc nghĩ mọi đường đều 01 năm, và không nói mốc tính (từ ngày phát hiện hành vi vi phạm). Thân mục có nêu đủ ba mốc."
  - text: "Điều 27 khoản 2 Luật ATVSLĐ: NSDLĐ lập và quản lý hồ sơ sức khỏe, thông báo kết quả khám để NLĐ biết"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Người sử dụng lao động có trách nhiệm lập và quản lý hồ sơ sức khỏe của người lao động, hồ sơ sức khỏe của người bị bệnh nghề nghiệp; thông báo kết quả khám sức khỏe, khám phát hiện bệnh nghề nghiệp để người lao động biết;"
    verdict: "match"
    note: "Luật chỉ nói 'thông báo để biết', không nói 'cấp bản sao kết quả khám'. 'Kết quả khám là thứ bạn có quyền nhận' là diễn giải; quyền xin bản sao dựa vào Điều 48 khoản 3 điểm b."
  - text: "Điều 18 khoản 2 NĐ 283/2026: phạt 1.000.000-2.000.000 đồng với 1-10 NLĐ cho hành vi không thanh toán đúng hạn, không trả đủ trợ cấp thôi việc, không hoàn thành thủ tục xác nhận bảo hiểm và trả giấy tờ, không cung cấp bản sao tài liệu khi có yêu cầu"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "không cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu sau khi chấm dứt hợp đồng lao động theo một trong các mức sau đây: a) Từ 1.000.000 đồng đến 2.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;"
    verdict: "partial"
    note: "Hành vi bị phạt gắn với yêu cầu 'sau khi chấm dứt hợp đồng lao động'. Step 1 khuyên gửi đơn TRƯỚC ngày cuối: yêu cầu gửi trước có thể chưa kích hoạt hành vi vi phạm hành chính. Mức là mức cá nhân; doanh nghiệp gấp đôi (Điều 7 khoản 1), mục không nêu. Bậc cao (11 NLĐ trở lên) bị bỏ, không sai vì mục ghi rõ '1 đến 10'."
  - text: "Step 1: gửi đơn TRƯỚC ngày cuối 'ít nhất vài ngày'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: ""
    verdict: "inference"
    note: "Không điều luật nào đặt thời điểm gửi yêu cầu trước ngày cuối; Điều 48 khoản 3 điểm b và Điều 18 khoản 2 NĐ 283 gắn nghĩa vụ/chế tài với việc yêu cầu sau khi chấm dứt. Lời khuyên thực tiễn hợp lý (tránh bị khóa hệ thống) nhưng nên gắn nhãn là lời khuyên và khuyên gửi lại yêu cầu sau ngày chấm dứt."
  - text: "Chi phí: 'Nếu phải ra tòa thì thêm án phí và nhiều buổi nghỉ làm'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: ""
    verdict: "not-found"
    note: "Không có trong nguồn mục dẫn; xung đột với mục 19-06 ('Bắt đầu kiện không mất án phí'). Tra cứu thứ cấp (kết quả tìm kiếm, chưa mở văn bản gốc) cho thấy Nghị quyết 326/2016/UBTVQH14 Điều 12 miễn án phí cho NLĐ trong nhiều loại tranh chấp đòi tiền lương, trợ cấp."
  - text: "Bẫy 2: 'Thứ có giá là bản sao do công ty cấp, bản có ký và đóng dấu, hoặc thư điện tử từ địa chỉ công ty gửi cho chính bạn. Ảnh chụp màn hình thì giữ thêm'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: ""
    verdict: "inference"
    note: "Lời khuyên về giá trị chứng cứ; không có điều luật trong nguồn mục (Bộ luật Tố tụng dân sự, Luật Giao dịch điện tử không được dẫn). Không sai theo nguyên tắc chung nhưng nên gắn nhãn kinh nghiệm thực tiễn."

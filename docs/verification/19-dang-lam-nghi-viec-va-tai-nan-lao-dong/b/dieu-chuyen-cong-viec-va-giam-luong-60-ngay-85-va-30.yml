suggested_edits:
  - "steps[1] và Bẫy 1: đổi 'gửi văn bản nêu ý kiến trong 03 ngày làm việc' thành 'khi nhận thông báo sửa đổi, bổ sung hợp đồng hoặc thông báo chuyển việc, trả lời bằng văn bản càng sớm càng tốt; giữ nguyên nội dung cũ nếu chưa đồng ý (Điều 33 khoản 3)'. Dựa vào quote Điều 33 khoản 1 (03 ngày là thời hạn NSDLĐ báo trước)."
  - "Pháp luật VN 'Tiền lương khi bị chuyển': đổi dòng 'Người không đồng ý mà phải ngừng việc được trả lương ngừng việc' thành 'Người không đồng ý tạm thời làm công việc khác quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc thì được trả lương ngừng việc theo Điều 99 (Điều 29 khoản 4)'."
  - "Chi phí: thêm 'mức phạt trên là mức cá nhân; doanh nghiệp bị phạt gấp 02 lần (Điều 7 khoản 1 Nghị định 283/2026): 2.000.000-6.000.000 đồng và 6.000.000-14.000.000 đồng'. Dựa vào quote Điều 7 khoản 1."
  - "Chi phí: bỏ hoặc sửa gạch đầu dòng 'Toàn bộ phần chênh nếu việc mới kéo dài quá 60 ngày...' vì không có nguồn; có thể thay bằng 'Quá 60 ngày làm việc cộng dồn thì chỉ được chuyển khi bạn đồng ý bằng văn bản'. Tách '30 ngày giữ lương cũ' ra khỏi nhóm 'bị lấy đi'."
  - "Pháp luật VN và Bẫy 3: nêu ngoại lệ Điều 35 khoản 2 điểm b ('trừ trường hợp quy định tại khoản 4 Điều 97') và nhắc cắt lương chỉ là vi phạm khi chưa có chữ ký thỏa thuận (Điều 33)."
  - "Thêm vào Pháp luật VN câu Điều 29 khoản 1 đoạn 2: nhu cầu sản xuất, kinh doanh phải được quy định cụ thể trong nội quy lao động; hướng dẫn đối chiếu nội quy là bước hữu ích."

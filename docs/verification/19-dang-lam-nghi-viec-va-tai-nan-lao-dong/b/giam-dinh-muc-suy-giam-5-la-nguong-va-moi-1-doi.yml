  basis: "Luật 84/2015/QH13: bản hợp nhất 14/VBHN-VPQH ngày 16/9/2024 (Công báo 1171+1172 ngày 29/10/2024) có chú thích sửa đổi bởi Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025. Trang Công báo của Luật gốc để trống ô 'Ngày hết hiệu lực' và mục sửa đổi, nên không dùng làm bằng chứng. Tìm kiếm thứ cấp (tháng 11/2026) cho thấy dự án Luật ATVSLĐ sửa đổi mới được Chính phủ trình Quốc hội ngày 21/10/2026, chưa thấy văn bản thông qua; chưa mở được vbpl.vn/văn bản hợp nhất mới hơn 14/VBHN. ND 161/2026: bản ảnh ký số 19/05/2026, Điều 3.2 hiệu lực 01/7/2026; nguồn thứ cấp nói thay Nghị định 73/2024; Điều 3.4 tự nói Chính phủ điều chỉnh mức lương cơ sở sau, nên số tiền trong mục sẽ đổi khi mức lương cơ sở đổi."

  - 'tldr và Nói dễ hiểu: thêm "chưa gồm khoản cộng theo số năm đóng quỹ" cạnh 12.650.000 và 759.000; thêm bullet cho Điều 49.2.b.'
  - 'Giám định lại: sửa "sau 24 tháng" thành "nếu thương tật tái phát đã điều trị ổn định, giám định lại sau 24 tháng kể từ kết luận trước (Điều 47.1.b, 47.3)".'
  - 'Chi phí, câu "luật đã chỉ rõ ai trả": thêm một câu nêu khoảng trống (tự đi giám định, kết quả <5%/không tăng mức) hoặc bỏ câu "đã chỉ rõ".'
  - 'Pháp luật VN: thêm điều kiện Điều 45 (tham gia BH TNLĐ-BNN, không thuộc Điều 40.1) và điều kiện "không hoàn toàn do lỗi" cho Điều 38.4.'

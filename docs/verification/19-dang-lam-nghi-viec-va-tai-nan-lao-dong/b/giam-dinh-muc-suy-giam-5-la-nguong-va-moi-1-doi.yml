claims:
  - text: "Ba lúc được giám định/giám định lại: sau điều trị ổn định lần đầu; sau tái phát đã ổn định; không thể điều trị ổn định thì giám định trước/ngay trong quy trình điều trị (Điều 47.1)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: a) Sau khi bị thương tật, bệnh tật lần đầu đã được điều trị ổn định còn di chứng ảnh hưởng tới sức khỏe; b) Sau khi thương tật, bệnh tật tái phát đã được điều trị ổn định; c) Đối với trường hợp thương tật hoặc bệnh nghề nghiệp không có khả năng điều trị ổn định theo quy định của Bộ trưởng Bộ Y tế thì người lao động được làm thủ tục giám định trước hoặc ngay trong quy trình điều trị.
    verdict: match
    note: Điểm c chỉ áp "theo quy định của Bộ trưởng Bộ Y tế"; tldr nói gọn "nếu không thể ổn định".
  - text: Giám định tổng hợp (Điều 47.2)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: "2. Người lao động được giám định tổng hợp mức suy giảm khả năng lao động khi thuộc một trong các trường hợp sau đây: a) Vừa bị tai nạn lao động vừa bị bệnh nghề nghiệp; b) Bị tai nạn lao động nhiều lần; c) Bị nhiều bệnh nghề nghiệp."
    verdict: match
    note: ""
  - text: 'Giám định lại sau 24 tháng kể từ kết luận liền kề trước (Điều 47.3); "Nói dễ hiểu": "Giám định lại sau 24 tháng"'
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: 3. Người lao động quy định tại điểm b khoản 1 Điều này được giám định lại tai nạn lao động, bệnh nghề nghiệp sau 24 tháng, kể từ ngày người lao động được Hội đồng giám định y khoa kết luận tỷ lệ suy giảm khả năng lao động liền kề trước đó; trường hợp do tính chất của bệnh nghề nghiệp khiến người lao động suy giảm sức khỏe nhanh thì thời gian giám định được thực hiện sớm hơn theo quy định của Bộ trưởng Bộ Y tế.
    verdict: partial
    note: 24 tháng chỉ áp cho người thuộc điểm b khoản 1 (tái phát đã điều trị ổn định). Câu "Giám định lại sau 24 tháng" ở Nói dễ hiểu và bullet Pháp luật VN bỏ giới hạn này, người đọc có thể nghĩ mọi người đều phải chờ 24 tháng.
  - text: "Ngưỡng hưởng chế độ: suy giảm từ 5% trở lên (Điều 45.2)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: "Người lao động tham gia bảo hiểm tai nạn lao động, bệnh nghề nghiệp được hưởng chế độ tai nạn lao động khi có đủ các điều kiện sau đây: [...] 2. Suy giảm khả năng lao động từ 5% trở lên do bị tai nạn quy định tại khoản 1 Điều này; 3. Người lao động không được hưởng chế độ do Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp chi trả nếu thuộc một trong các nguyên nhân quy định tại khoản 1 Điều 40 của Luật này."
    verdict: partial
    note: Ngưỡng 5% đúng nhưng đi kèm điều kiện phải tham gia BH TNLĐ-BNN và không thuộc ba nguyên nhân Điều 40.1 (mâu thuẫn cá nhân không liên quan công việc, tự hủy hoại, ma túy). Mục không nêu.
  - text: "Phí giám định: đơn vị trả với trường hợp <5% do đơn vị giới thiệu; quỹ trả với trường hợp đủ điều kiện hưởng (Điều 42.1, Điều 38.2.b)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: 1. Trả phí khám giám định thương tật, bệnh tật do tai nạn lao động, bệnh nghề nghiệp đối với các trường hợp đủ điều kiện hưởng theo quy định tại Điều 45 và Điều 46 của Luật này; trả phí khám giám định đối với trường hợp người lao động chủ động đi khám giám định mức suy giảm khả năng lao động theo quy định tại điểm b khoản 1 và khoản 3 Điều 47 của Luật này mà kết quả khám giám định đủ điều kiện để điều chỉnh tăng mức hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp.
    verdict: partial
    note: 'Hai trường hợp được nêu đúng, nhưng câu "luật đã chỉ rõ ai trả" bỏ qua trường hợp trống: người lao động tự đi giám định mà kết quả <5% hoặc không làm tăng mức hưởng thì luật không nói quỹ hay đơn vị trả.'
  - text: "Trợ cấp một lần 5-30%: 5% = 5 lần lương cơ sở, +0,5 lần mỗi 1% (Điều 48.1, 48.2.a); 5% = 12.650.000; 30% = 17,5 lần = 44.275.000"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: 1. Người lao động bị suy giảm khả năng lao động từ 5% đến 30% thì được hưởng trợ cấp một lần. [...] a) Suy giảm 5% khả năng lao động thì được hưởng năm lần mức lương cơ sở, sau đó cứ suy giảm thêm 1% thì được hưởng thêm 0,5 lần mức lương cơ sở;
    verdict: match
    note: 5 x 2.530.000 = 12.650.000; (5 + 25 x 0,5) = 17,5 lần = 44.275.000, đúng.
  - text: "Cộng thêm theo số năm đóng quỹ: <=1 năm 0,5 tháng, mỗi năm thêm 0,3 tháng (Điều 48.2.b)"
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: b) Ngoài mức trợ cấp quy định tại điểm a khoản này, còn được hưởng thêm khoản trợ cấp tính theo số năm đã đóng vào Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp, từ một năm trở xuống thì được tính bằng 0,5 tháng, sau đó cứ thêm mỗi năm đóng vào quỹ được tính thêm 0,3 tháng tiền lương đóng vào quỹ của tháng liền kề trước tháng bị tai nạn lao động hoặc được xác định mắc bệnh nghề nghiệp;
    verdict: match
    note: Tldr và Nói dễ hiểu "quỹ trả 12.650.000 đồng" bỏ phần này (mục ghi riêng ở Pháp luật VN).
  - text: Từ 31% trợ cấp hằng tháng; 31% là 759.000 đồng/tháng (Điều 49.1, 49.2.a)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: 1. Người lao động bị suy giảm khả năng lao động từ 31% trở lên thì được hưởng trợ cấp hằng tháng. 2. [...] a) Suy giảm 31% khả năng lao động thì được hưởng bằng 30% mức lương cơ sở, sau đó cứ suy giảm thêm 1% thì được hưởng thêm 2% mức lương cơ sở;

  - text: 'Phần Chi phí: 4.250.400 đồng/tháng tại 100% là "mức trần"'
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: b) Ngoài mức trợ cấp quy định tại điểm a khoản này, hằng tháng còn được hưởng thêm một khoản trợ cấp tính theo số năm đã đóng vào Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp, từ một năm trở xuống được tính bằng 0,5%, sau đó cứ thêm mỗi năm đóng vào quỹ được tính thêm 0,3% mức tiền lương đóng vào quỹ của tháng liền kề trước tháng bị tai nạn lao động hoặc được xác định mắc bệnh nghề nghiệp; [...]
    verdict: mismatch
    note: 4.250.400 chỉ là phần Điều 49.2.a ở 100% ((30% + 69 x 2%) x 2.530.000). Với điểm b và trợ cấp phục vụ Điều 52 (bằng một lần lương cơ sở hằng tháng khi >=81% kèm liệt cột sống/mù hai mắt/cụt liệt hai chi/tâm thần) tổng nhận có thể cao hơn, nên không phải "mức trần".
  - text: Trợ cấp phục vụ bằng mức lương cơ sở hằng tháng khi >=81% và liệt cột sống/mù hai mắt/cụt, liệt hai chi/bệnh tâm thần (Điều 52)
    source_url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/9/42949/52251-1-20241171-117214-vbhn-vpqh.pdf
    quote: Người lao động bị suy giảm khả năng lao động từ 81% trở lên mà bị liệt cột sống hoặc mù hai mắt hoặc cụt, liệt hai chi hoặc bị bệnh tâm thần thì ngoài mức hưởng quy định tại Điều 49 của Luật này, hằng tháng còn được hưởng trợ cấp phục vụ bằng mức lương cơ sở.

  - "Pháp luật Việt Nam, Loại và thời hạn: sau câu \"chỉ được ký thêm 01 lần\" thêm \"trừ giám đốc doanh nghiệp có vốn nhà nước và các trường hợp Điều 149 khoản 1, Điều 151 khoản 2, Điều 177 khoản 4 BLLĐ\"; Thử việc: thêm \"nhân viên nghiệp vụ\" ở bậc 30 ngày và \"chỉ thử việc một lần cho một công việc\"."

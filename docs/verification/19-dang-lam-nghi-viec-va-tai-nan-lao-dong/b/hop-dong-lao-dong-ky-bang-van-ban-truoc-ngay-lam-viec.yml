claims:
  - text: "Hợp đồng gọi tên khác nhưng có nội dung việc làm có trả công, tiền lương và sự quản lý, điều hành, giám sát của một bên thì được coi là hợp đồng lao động (Điều 13 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "Trường hợp hai bên thỏa thuận bằng tên gọi khác nhưng có nội dung thể hiện về việc làm có trả công, tiền lương và sự quản lý, điều hành, giám sát của một bên thì được coi là hợp đồng lao động."
  - text: "Trước khi nhận người lao động vào làm việc, NSDLĐ phải giao kết hợp đồng lao động (Điều 13 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "2. Trước khi nhận người lao động vào làm việc thì người sử dụng lao động phải giao kết hợp đồng lao động với người lao động."
    note: "\"Ngày đầu tiên đi làm mà chưa có giấy là vi phạm của phía thuê\" là suy ra hợp lý từ câu trên."
  - text: "Hợp đồng phải bằng văn bản, làm 02 bản, mỗi bên giữ 01; hợp đồng điện tử dạng thông điệp dữ liệu có giá trị như văn bản (Điều 14 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "1. Hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này. […] Hợp đồng lao động được giao kết thông qua phương tiện điện tử dưới hình thức thông điệp dữ liệu theo quy định của pháp luật về giao dịch điện tử có giá trị như hợp đồng lao động bằng văn bản."
  - text: "Chỉ hợp đồng có thời hạn dưới 01 tháng được giao kết bằng lời nói, trừ vài trường hợp riêng (Điều 14 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "2. Hai bên có thể giao kết hợp đồng lao động bằng lời nói đối với hợp đồng có thời hạn dưới 01 tháng, trừ trường hợp quy định tại khoản 2 Điều 18, điểm a khoản 1 Điều 145 và khoản 1 Điều 162 của Bộ luật này."
    note: "Nói dễ hiểu viết \"Chỉ hợp đồng dưới 01 tháng mới được thỏa thuận miệng\" không kèm ngoại lệ; thân bài có \"trừ vài trường hợp riêng\" nhưng không nêu cụ thể (Điều 18 k2, Điều 145 k1 a, Điều 162 k1) và luật viết \"có thể\" bằng lời nói."
  - text: "Nội dung chủ yếu của hợp đồng gồm mức lương theo công việc/chức danh, hình thức, thời hạn trả lương, phụ cấp, các khoản bổ sung; và bảo hiểm xã hội, y tế, thất nghiệp (Điều 21 khoản 1 điểm đ, i)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "đ) Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác; […] i) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;"
    note: "Mục gán điểm i là \"bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp\" đúng, nhưng xem claim kế tiếp."
  - text: "Mức đóng bảo hiểm phải nhìn thấy được ngay trên hợp đồng (tldr \"ghi mức lương, mức đóng bảo hiểm\"; bước 2; Việc cần làm: \"có ghi mức lương và mức đóng bảo hiểm\")"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "inference"
    quote: "i) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;"
    note: "Điều 21 khoản 1 điểm i chỉ đòi hợp đồng có nội dung \"Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp\"; không đòi ghi \"mức đóng\". Mục tự thừa nhận là \"suy ra\", nhưng tldr và steps (là lớp người đọc dừng ở đó) trình bày như yêu cầu của luật, và dùng \"mức đóng bảo hiểm\" làm tiêu chí kiểm hợp đồng. Hợp đồng không ghi mức đóng vẫn không thiếu nội dung chủ yếu theo chữ của điều khoản; người đọc dùng tiêu chí này có thể khẳng định sai là hợp đồng vi phạm."
  - text: "Hợp đồng gồm hai loại; loại xác định thời hạn không quá 36 tháng (Điều 20 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "b) Hợp đồng lao động xác định thời hạn là hợp đồng mà trong đó hai bên xác định thời hạn, thời điểm chấm dứt hiệu lực của hợp đồng trong thời gian không quá 36 tháng kể từ thời điểm có hiệu lực của hợp đồng."
  - text: "Hợp đồng xác định thời hạn hết hạn mà vẫn làm: trong 30 ngày phải ký mới; quá 30 ngày không ký thì trở thành không xác định thời hạn (Điều 20 khoản 2 điểm a, b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "a) Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; […] b) Nếu hết thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn mà hai bên không ký kết hợp đồng lao động mới thì hợp đồng đã giao kết theo quy định tại điểm b khoản 1 Điều này trở thành hợp đồng lao động không xác định thời hạn;"
  - text: "Nếu ký tiếp hợp đồng xác định thời hạn thì chỉ được ký thêm 01 lần (Điều 20 khoản 2 điểm c)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "partial"
    quote: "c) Trường hợp hai bên ký kết hợp đồng lao động mới là hợp đồng lao động xác định thời hạn thì cũng chỉ được ký thêm 01 lần, sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn, trừ hợp đồng lao động đối với người được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước và trường hợp quy định tại khoản 1 Điều 149, khoản 2 Điều 151 và khoản 4 Điều 177 của Bộ luật này."
    note: "Mục bỏ các ngoại lệ (giám đốc doanh nghiệp có vốn nhà nước; Điều 149 k1, Điều 151 k2, Điều 177 k4 BLLĐ: nhóm lao động đặc thù, người cao tuổi...). Người thuộc ngoại lệ có thể ký nhiều lần hợp đồng xác định thời hạn hợp pháp; Bẫy 3 viết \"chỉ được ký thêm đúng 01 lần\" không điều kiện."
  - text: "Thời gian thử việc tối đa: 180 ngày (quản lý doanh nghiệp); 60 ngày (cao đẳng trở lên); 30 ngày (trung cấp, công nhân kỹ thuật); 06 ngày làm việc (việc khác) (Điều 25)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "partial"
    quote: "chỉ được thử việc một lần đối với một công việc […] 2. Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên; […] 3. Không quá 30 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ; […] 4. Không quá 06 ngày làm việc đối với công việc khác."
    note: "Mục bỏ \"nhân viên nghiệp vụ\" ở bậc 30 ngày và bỏ điều kiện \"chỉ được thử việc một lần đối với một công việc\". Điều 25 viết \"Không quá\", mục viết \"tối đa\" (cùng nghĩa). Số ngày đúng."
  - text: "Lương thử việc ít nhất 85% mức lương của công việc đó (Điều 26)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó."
  - text: "Phạt 2-5 triệu đồng (01 đến 10 người) ... 20-25 triệu đồng (từ 301 người) khi giao kết hợp đồng không bằng văn bản với việc từ đủ 01 tháng, không đúng loại, hoặc không đủ nội dung chủ yếu (Điều 15 khoản 1 NĐ 283/2026)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "1. Phạt tiền đối với người sử dụng lao động khi có một trong các hành vi: giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên; […] giao kết không đúng loại hợp đồng lao động với người lao động; giao kết hợp đồng lao động không đầy đủ các nội dung chủ yếu của hợp đồng lao động theo quy định của pháp luật theo một trong các mức sau đây: […] a) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; […] đ) Từ 20.000.000 đồng đến 25.000.000 đồng đối với vi phạm từ 301 người lao động trở lên. || Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân […] Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    note: "Các con số khớp. Nhưng đây là mức đối với cá nhân; doanh nghiệp bị phạt gấp 02 lần (Điều 7 khoản 1; Điều 15 không thuộc ngoại lệ). Mục ghi Điều 7 khoản 1 trong legal_refs nhưng không nêu quy tắc này ở thân; các mục 03, 04, 06, 21, 22 cùng chương có nêu. Người đọc dễ hiểu doanh nghiệp chỉ bị 2-5 triệu thay vì 4-10 triệu (và 40-50 triệu từ 301 người trở lên)."
  - text: "Phạt 20-25 triệu đồng nếu giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ hoặc buộc người lao động đặt tiền/tài sản bảo đảm (Điều 15 khoản 2 điểm a, b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "2. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: […] a) Giữ bản chính giấy tờ tùy thân, văn bằng hoặc chứng chỉ của người lao động khi giao kết hoặc thực hiện hợp đồng lao động; […] b) Buộc người lao động thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện hợp đồng lao động;"
    note: "Cùng vấn đề cá nhân/tổ chức (doanh nghiệp: 40-50 triệu). Mục viết \"giữ bản chính căn cước\": luật viết \"giấy tờ tùy thân\"; thay thế đồng nghĩa chấp nhận được."
  - text: "NĐ 283 buộc NSDLĐ giao kết hợp đồng bằng văn bản, giao kết đúng loại hợp đồng, trả lại bản chính giấy tờ đã giữ (Điều 15 khoản 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "match"
    quote: "a) Buộc người sử dụng lao động giao kết hợp đồng lao động bằng văn bản với người lao động […] c) Buộc người sử dụng lao động giao kết đúng loại hợp đồng với người lao động đối với hành vi giao kết không đúng loại hợp đồng lao động với người lao động quy định tại khoản 1 Điều này; […] d) Buộc người sử dụng lao động trả lại bản chính giấy tờ tùy thân; văn bằng; chứng chỉ đã giữ của người lao động"
    note: "Mục viết \"Điều 15\" chung (đúng nội dung khoản 3)."
  - text: "Khi chấm dứt hợp đồng, NSDLĐ phải cung cấp bản sao tài liệu liên quan quá trình làm việc nếu NLĐ yêu cầu, chi phí sao gửi do NSDLĐ trả (Điều 48 khoản 3 điểm b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "match"
    quote: "b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    note: "Bẫy 2 dùng điều này cho tình huống \"bị giữ cả hai bản\" của hợp đồng; điều khoản áp dụng khi chấm dứt hợp đồng, còn \"bản sao hợp đồng\" là một loại tài liệu liên quan quá trình làm việc (suy ra hợp lý)."
  - text: "Ví dụ: hợp đồng ghi 5.000.000 đồng, thỏa thuận miệng 8.000.000 đồng thì mọi khoản đóng bảo hiểm, trợ cấp thôi việc và tiền làm thêm đều tính trên 5.000.000 đồng; \"không có giấy thì không đòi được phần chênh\" (Chi phí)"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    verdict: "not-found"
    note: "Các điều khoản được dẫn không quy định hệ quả này (không có điều khoản về hợp đồng ghi lương thấp hơn thỏa thuận miệng). Đây là mô tả thực tiễn; lời khẳng định \"không đòi được\" quá tuyệt đối: Điều 13 khoản 1 và Điều 3 khoản 1 BLLĐ cho phép xác định quan hệ lao động theo nội dung thực tế, người lao động vẫn có thể chứng minh bằng chứng khác."

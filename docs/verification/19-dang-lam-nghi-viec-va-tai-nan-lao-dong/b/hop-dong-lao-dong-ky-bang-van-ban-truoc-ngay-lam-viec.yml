  - "tldr, steps (bước 2) và \"Việc cần làm\": thay \"ghi mức đóng bảo hiểm\" bằng \"có nội dung về bảo hiểm xã hội, y tế, thất nghiệp (Điều 21 khoản 1 điểm i)\"; nếu muốn khuyên kiểm mức đóng thì ghi là lời khuyên, không phải yêu cầu của luật."

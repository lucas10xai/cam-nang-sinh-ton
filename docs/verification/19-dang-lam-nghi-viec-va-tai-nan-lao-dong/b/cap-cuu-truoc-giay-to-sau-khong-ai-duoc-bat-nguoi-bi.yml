validity:
  doc: Luật ATVSLĐ 84/2015/QH13 (VBHN 14); Luật KCB 15/2023/QH15; Nghị định 283/2026/NĐ-CP
  in_force: unconfirmed
  effective_from: 2016-07-01
  amended_by:
    - Luật BHXH 41/2024/QH15 (chỉ các điều BHXH của luật ATVSLĐ)
  basis: "Luật 84/2015/QH13: bản hợp nhất 14/VBHN-VPQH ngày 16/9/2024 (Công báo 1171+1172 ngày 29/10/2024) có chú thích sửa đổi bởi Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025. Trang Công báo của Luật gốc để trống ô 'Ngày hết hiệu lực' và mục sửa đổi, nên không dùng làm bằng chứng. Tìm kiếm thứ cấp (tháng 11/2026) cho thấy dự án Luật ATVSLĐ sửa đổi mới được Chính phủ trình Quốc hội ngày 21/10/2026, chưa thấy văn bản thông qua; chưa mở được vbpl.vn/văn bản hợp nhất mới hơn 14/VBHN. Luật KCB 15/2023: tải PDF Công báo 489+490 (19/02/2023), trang Công báo không hiển thị thông tin hết hiệu lực/sửa đổi; chưa tra được văn bản sửa đổi sau 2023. ND 283/2026: Công báo 448, hiệu lực 10/09/2026, Lược đồ không có văn bản thay thế; chưa đủ để khẳng định."

suggested_edits:
  - "Pháp luật Việt Nam, Lương hưu và Bẫy 1: thêm Điều 98 Luật BHXH 41/2024 (\"Người tham gia bảo hiểm xã hội tự nguyện được hưởng lương hưu khi đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động và có thời gian đóng bảo hiểm xã hội từ đủ 15 năm trở lên\") và bỏ câu \"hạ mốc 20 năm cũ\" nếu không dẫn được luật cũ; nói rõ Điều 64 dùng chữ \"đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm\"."
  - "Pháp luật Việt Nam, \"Danh sách đóng\": thêm điểm e và ghi rõ khoản 1 chỉ cho công dân Việt Nam thuộc diện bắt buộc (khoản 2 áp dụng cho người nước ngoài); thêm điều kiện \"không tham gia BHXH tự nguyện\" vào điểm đ."
  - "Trợ cấp thất nghiệp: thêm ngoại lệ \"hợp đồng từ đủ 01 đến dưới 12 tháng thì phải đóng đủ 12 tháng trong 36 tháng\" (Điều 38 khoản 1 điểm b)."
  - "Chi phí: bỏ hoặc dẫn nguồn câu \"Phần lớn người rút tiêu hết trong vòng một năm\"."
  - "Tuổi nghỉ hưu: thêm \"trong điều kiện lao động bình thường; khoản 3, 4 Điều 169 cho phép nghỉ sớm hoặc muộn tối đa 05 tuổi\"."

id: "doi-tinh-doi-viec-giu-thoi-gian-dong-dung-rut-bao-hiem"
checker: "agent-V3b19dB"
checked_at: "2026-11-08"
content_sha256: "1a5a7c7cb4da2d4eb0d2b1baa7ba3f63884b79dc831f1e037836a0af82f4dc2c"
result: "pass-with-edits"
claims:
  - text: "Người lao động nghỉ việc chưa đủ điều kiện hưởng lương hưu, chưa hưởng BHXH một lần, chưa hưởng trợ cấp hằng tháng thì được bảo lưu thời gian đóng (Điều 71)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "Người lao động khi nghỉ việc mà chưa đủ điều kiện để hưởng lương hưu theo quy định tại Điều 64, Điều 65 của Luật này hoặc chưa hưởng bảo hiểm xã hội một lần theo quy định tại Điều 70 của Luật này hoặc chưa hưởng trợ cấp hằng tháng theo quy định tại Điều 23 của Luật này thì được bảo lưu thời gian đóng bảo hiểm xã hội."
    note: "Luật 41/2024/QH15, Công báo 987+988, PDF có lớp chữ. \"Đổi tỉnh/đổi việc không phải rút\" là suy ra hợp lý (Điều 71 không nhắc nơi làm việc)."
  - text: "Sổ BHXH cấp cho từng người, bản điện tử và bản giấy có giá trị pháp lý như nhau (Điều 25)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "1. Sổ bảo hiểm xã hội được cấp cho từng người lao động […] 2. Sổ bảo hiểm xã hội được cấp bằng bản điện tử, bản giấy và có giá trị pháp lý như nhau."
    note: "Câu \"Đổi tỉnh không làm mất sổ và không buộc phải rút\" của mục là suy ra, không phải chữ của Điều 25."
  - text: "Danh sách đóng các trường hợp được rút BHXH một lần (Điều 70 khoản 1): a) đủ tuổi hưu chưa đủ 15 năm đóng; b) ra nước ngoài định cư; c) ung thư, bại liệt, xơ gan mất bù, lao nặng, AIDS; d) suy giảm khả năng lao động từ 81% hoặc khuyết tật đặc biệt nặng; đ) có thời gian đóng trước ngày luật có hiệu lực, sau 12 tháng không thuộc đối tượng bắt buộc, không tham gia tự nguyện, đóng chưa đủ 20 năm"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "partial"
    quote: "1. Đối tượng quy định tại khoản 1 Điều 2 của Luật này đã chấm dứt tham gia bảo hiểm xã hội mà có đề nghị thì được hưởng bảo hiểm xã hội một lần nếu thuộc một trong các trường hợp sau đây: […] a) Đủ tuổi hưởng lương hưu mà chưa đủ 15 năm đóng bảo hiểm xã hội. […] đ) Người lao động có thời gian đóng bảo hiểm xã hội trước ngày Luật này có hiệu lực thi hành, sau 12 tháng không thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc mà cũng không tham gia bảo hiểm xã hội tự nguyện và có thời gian đóng bảo hiểm xã hội chưa đủ 20 năm; […] e) Trường hợp quy định tại các điểm d, đ và e khoản 1 Điều 2 của Luật này khi phục viên, xuất ngũ, thôi việc không thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc mà cũng không tham gia bảo hiểm xã hội tự nguyện và không đủ điều kiện để hưởng lương hưu."
    note: "Mục liệt kê đúng a-d và đ nhưng bỏ điểm e (quân nhân/công an phục viên, xuất ngũ), bỏ Điều 70 khoản 2 (người lao động nước ngoài theo khoản 2 Điều 2) và thiếu điều kiện \"không tham gia BHXH tự nguyện\" đã có trong điểm đ. Điều 70 khoản 1 chỉ áp dụng đối tượng khoản 1 Điều 2 (công dân Việt Nam thuộc diện bắt buộc). Mục gọi là \"danh sách đóng\", step 2 viết \"Chỉ rút khi rơi đúng một trường hợp của Điều 70 khoản 1\" là chính xác với người Việt thuộc diện bắt buộc nhưng không nêu hai giới hạn trên. Câu \"nghỉ việc bình thường ở tuổi 40 không nằm trong danh sách đó, trừ khi rơi vào điểm đ\" đúng, và đ là điều kiện hẹp (đóng trước hiệu lực 01/7/2025, nghỉ đủ 12 tháng, chưa đủ 20 năm)."
  - text: "Mức rút một lần: 1,5 tháng bình quân tiền lương đóng cho mỗi năm trước 2014; 02 tháng cho mỗi năm từ 2014; chưa đủ một năm thì bằng số tiền đã đóng nhưng không quá 02 tháng (Điều 70 khoản 3)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "a) Bằng 1,5 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội đối với năm đóng trước năm 2014. […] b) Bằng 02 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội đối với năm đóng từ năm 2014 trở đi; […] c) Trường hợp thời gian đóng bảo hiểm xã hội chưa đủ một năm thì mức hưởng bằng số tiền đã đóng nhưng không quá 02 tháng mức bình quân tiền lương tháng đóng bảo hiểm xã hội."
    note: "Khoản 3 loại phần ngân sách hỗ trợ đóng tự nguyện ra khỏi mức tính (không liên quan người lao động có hợp đồng). Phép tính \"mười năm từ 2014 = 20 tháng\" đúng."
  - text: "Lương hưu cần đủ tuổi theo Điều 169 khoản 2 BLLĐ và 15 năm đóng bắt buộc; \"hạ mốc 20 năm cũ xuống 15 năm\" (Điều 64)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "partial"
    quote: "1. Đối tượng quy định tại các điểm a, b, c, g, h, i, k, l, m và n khoản 1 và khoản 2 […] khi nghỉ việc có thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở lên thì được hưởng lương hưu nếu thuộc một trong các trường hợp sau đây: […] a) Đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động;"
    note: "Điều kiện chính đúng (tuổi theo khoản 2 Điều 169 + 15 năm). Thiếu: (1) điểm b khoản 1 (nghề nặng nhọc, độc hại/vùng khó khăn: nghỉ sớm theo khoản 3 Điều 169); (2) Điều 64 nói \"đóng bảo hiểm xã hội bắt buộc\" 15 năm, còn người tham gia tự nguyện theo Điều 98 (\"có thời gian đóng bảo hiểm xã hội từ đủ 15 năm trở lên\"); Bẫy 1 khuyên \"đóng tiếp tự nguyện cho đủ\" mà không dẫn Điều 98 và không nói cách cộng hai loại thời gian; (3) \"mốc 20 năm cũ\" không có trong Luật 41/2024 (là luật trước), không kiểm được trong nguồn này."
  - text: "Lương hưu lao động nữ 45% tương ứng 15 năm, mỗi năm thêm 2%, tối đa 75%; nam 45% tương ứng 20 năm, mỗi năm thêm 2%, tối đa 75% (Điều 66 khoản 1 điểm a, b)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "a) Đối với lao động nữ bằng 45% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 2%, mức tối đa bằng 75%; […] b) Đối với lao động nam bằng 45% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 20 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 2%, mức tối đa bằng 75%."
  - text: "Nam đóng từ đủ 15 đến dưới 20 năm: 40% tại mốc 15 năm, mỗi năm thêm 1% (Điều 66 khoản 1)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "Trường hợp lao động nam có thời gian đóng bảo hiểm xã hội từ đủ 15 năm đến dưới 20 năm, mức lương hưu hằng tháng bằng 40% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội quy định tại Điều 72 của Luật này tương ứng 15 năm đóng bảo hiểm xã hội, sau đó cứ thêm mỗi năm đóng thì tính thêm 1%."
  - text: "Trợ cấp một lần khi nghỉ hưu: 0,5 lần bình quân tiền lương làm căn cứ đóng cho mỗi năm đóng vượt 35 (nam)/30 (nữ) năm; 02 lần cho năm đóng sau tuổi nghỉ hưu (Điều 68)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "match"
    quote: "1. Lao động nam có thời gian đóng bảo hiểm xã hội cao hơn 35 năm, lao động nữ có thời gian đóng bảo hiểm xã hội cao hơn 30 năm […] Mức hưởng trợ cấp một lần cho mỗi năm đóng cao hơn quy định tại khoản 1 Điều này bằng 0,5 lần của mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội […] mức trợ cấp bằng 02 lần của mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội"
    note: "Luật viết \"lần của mức bình quân tiền lương\", mục viết \"0,5 tháng bình quân\" (tương đương nếu mức bình quân tính theo tháng; Điều 72 là bình quân tiền lương tháng)."
  - text: "Tuổi nghỉ hưu: từ 2021 nam 60 tuổi 03 tháng, nữ 55 tuổi 04 tháng; mỗi năm tăng 03 tháng (nam) và 04 tháng (nữ); đến 62 tuổi năm 2028 (nam) và 60 tuổi năm 2035 (nữ) (Điều 169 khoản 2 BLLĐ)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "2. Tuổi nghỉ hưu của người lao động trong điều kiện lao động bình thường được điều chỉnh theo lộ trình cho đến khi đủ 62 tuổi đối với lao động nam vào năm 2028 và đủ 60 tuổi đối với lao động nữ vào năm 2035. […] Kể từ năm 2021, tuổi nghỉ hưu của người lao động trong điều kiện lao động bình thường là đủ 60 tuổi 03 tháng đối với lao động nam và đủ 55 tuổi 04 tháng đối với lao động nữ; sau đó, cứ mỗi năm tăng thêm 03 tháng đối với lao động nam và 04 tháng đối với lao động nữ."
    note: "Mục nêu đúng nhưng chỉ trong \"điều kiện lao động bình thường\"; khoản 3, 4 cho nghỉ sớm/muộn tối đa 05 tuổi (nghề nặng nhọc, độc hại...). Câu \"năm 2026 nam 61 tuổi 6 tháng, nữ 57 tuổi\" là suy ra: 60t3th + 5x3th = 61t6th; 55t4th + 5x4th = 57t0th; phép tính đúng, đúng như mục ghi nhãn \"suy ra\"."
  - text: "Người đang hưởng trợ cấp thất nghiệp được chuyển nơi hưởng khi có nhu cầu (Luật Việc làm 74/2025 Điều 41 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    verdict: "match"
    quote: "1. Trong thời gian hưởng trợ cấp thất nghiệp, người lao động được chuyển nơi hưởng trợ cấp thất nghiệp khi có nhu cầu."
    note: "\"nên đổi tỉnh giữa chừng không mất tháng trợ cấp còn lại\" là suy ra từ câu này; Điều 41 khoản 1 không nói về việc bảo toàn số tháng còn lại."
  - text: "Điều kiện hưởng trợ cấp thất nghiệp: đóng từ đủ 12 tháng trong 24 tháng trước khi chấm dứt; nộp hồ sơ trong 03 tháng (Điều 38 khoản 1)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    verdict: "partial"
    quote: "b) Đã đóng bảo hiểm thất nghiệp từ đủ 12 tháng trở lên trong thời gian 24 tháng trước khi chấm dứt hợp đồng lao động […] Trường hợp người lao động làm việc theo hợp đồng lao động có thời hạn từ đủ 01 tháng đến dưới 12 tháng thì phải đóng đủ 12 tháng trở lên trong thời gian 36 tháng trước khi chấm dứt hợp đồng lao động. […] c) Đã nộp đủ hồ sơ hưởng trợ cấp thất nghiệp trong thời hạn 03 tháng kể từ ngày chấm dứt hợp đồng lao động"
    note: "Thiếu ngoại lệ hợp đồng từ đủ 01 tháng đến dưới 12 tháng (đóng đủ 12 tháng trong 36 tháng). Điều 38 còn điều kiện điểm a (không phải chấm dứt trái pháp luật hoặc nghỉ khi đủ điều kiện hưu) và điểm d (10 ngày làm việc không có việc làm thuộc diện BHXH bắt buộc...), Chính phủ quy định chi tiết (khoản 2)."
  - text: "Điều 38 khoản 1 điểm a loại trừ người lao động đơn phương chấm dứt hợp đồng trái pháp luật khỏi diện hưởng trợ cấp thất nghiệp (Bẫy 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    verdict: "match"
    quote: "a) Chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc theo quy định của pháp luật mà không thuộc một trong các trường hợp người lao động đơn phương chấm dứt hợp đồng lao động trái pháp luật theo quy định của Bộ luật Lao động hoặc người lao động nghỉ việc khi đủ điều kiện hưởng lương hưu."
  - text: "Mức trợ cấp thất nghiệp 60% bình quân tiền lương 06 tháng đóng BHTN gần nhất, tối đa 05 lần lương tối thiểu vùng; tối đa 12 tháng (Điều 39 khoản 1, 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-74-2025-qh15-45562.htm"
    verdict: "match"
    quote: "1. Mức hưởng trợ cấp thất nghiệp hằng tháng bằng 60% mức bình quân tiền lương tháng đóng bảo hiểm thất nghiệp của 06 tháng đã đóng bảo hiểm thất nghiệp gần nhất trước khi chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc nhưng tối đa không quá 05 lần mức lương tối thiểu tháng theo vùng do Chính phủ công bố […] nhưng thời gian hưởng trợ cấp thất nghiệp tối đa 12 tháng."
  - text: "Nghỉ ngang trái pháp luật: không được trợ cấp thôi việc, bồi thường nửa tháng lương và tiền lương những ngày không báo trước (BLLĐ Điều 40)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "Điều 40. Nghĩa vụ của người lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật […] 1. Không được trợ cấp thôi việc. […] 2. Phải bồi thường cho người sử dụng lao động nửa tháng tiền lương theo hợp đồng lao động và một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước."
    note: "Khoản 3 (hoàn trả chi phí đào tạo) không được nêu; không ảnh hưởng ý chính."
  - text: "\"Phần lớn người rút tiêu hết trong vòng một năm\" (Chi phí)"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/9/41-2024-qh15.pdf"
    verdict: "not-found"
    note: "Số liệu hành vi không có nguồn trong mục và không do luật quy định; không tìm thấy thống kê chính thức trong các nguồn được dẫn."
internal_checks:
  - issue: "Bẫy 1 khuyên \"đóng tiếp tự nguyện cho đủ\" 15 năm nhưng legal_refs chỉ có Điều 64, mà Điều 64 khoản 1 nói \"thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm\"; quy định cho người tham gia tự nguyện nằm ở Điều 98 (không được dẫn). Thân bài ghi \"15 năm đóng bắt buộc\" ở phần Lương hưu nhưng tldr/Chi phí chỉ ghi \"15 năm đóng\". Người đọc có thể chọn sai cách bù thời gian. Cần dẫn Điều 98 và nói cách tính hai loại thời gian (nguồn đã kiểm không nói trực tiếp cộng dồn)."

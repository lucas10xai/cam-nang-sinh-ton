suggested_edits:
  - "tldr + Chi phí: sửa 'có thể làm mất 02 tháng lương cùng trợ cấp' thành: ký đơn xin nghỉ (khoản 9) là nghỉ theo ý bạn: vẫn được trợ cấp thôi việc nếu đủ 12 tháng và đúng luật (Điều 46 khoản 1), nhưng khó đòi khoản bồi thường Điều 41 (ít nhất 02 tháng lương) và trợ cấp mất việc Điều 47 (chỉ khi mất việc do cơ cấu/kinh tế/chia tách, khoản 11 Điều 34)."
  - "Chi phí, bullet 'Nửa tháng lương cho mỗi năm làm việc, nếu là trợ cấp thôi việc': bỏ khỏi danh sách 'khoản mất' hoặc ghi rõ điều kiện (chỉ mất nếu nghỉ trái luật theo Điều 40 hoặc tự ý bỏ việc 05 ngày theo Điều 36 khoản 1 điểm e)."
  - "Điều 36 khoản 3: sửa thành 'miễn báo trước chỉ với điểm d (không có mặt tại nơi làm việc sau thời hạn Điều 31) và điểm e (tự ý bỏ việc 05 ngày làm việc liên tục)'; đủ tuổi nghỉ hưu vẫn phải báo trước (khoản 2)."
  - "Điều 35 khoản 2: thêm ngoại lệ 'trừ Điều 29' (điểm a) và 'trừ khoản 4 Điều 97' (điểm b)."
  - "Bỏ hoặc gắn nhãn 'suy ra' cho: 'tiền tư vấn và án phí... lớn hơn khoản đang tranh', 'khoản vượt không còn cửa để đòi', 'Hai chế độ này không gộp'. Thống nhất với 19-06 về án phí."
  - "Mức phạt: ghi rõ mức Điều 18 khoản 1 là mức cá nhân, doanh nghiệp gấp đôi (Điều 7 khoản 1)."

validity:
  doc: "Bộ luật Lao động 45/2019/QH14 (VBHN 18); Nghị định 145/2020/NĐ-CP (Điều 15, 21, 23, 30, Phụ lục II); Nghị định 283/2026/NĐ-CP (Điều 19); Nghị quyết 66.18/2026/NQ-CP"
  in_force: unconfirmed
  effective_from: "BLLĐ 2021-01-01; Nghị định 145/2020 2021-02-01; Nghị định 283/2026 2026-09-10; Nghị quyết 66.18/2026/NQ-CP 2026-07-01 (theo nguồn thứ cấp)"
  amended_by: ["Nghị quyết 66.18/2026/NQ-CP của Chính phủ (từ 01/07/2026; bãi bỏ cấp/gia hạn/cấp lại/thu hồi giấy phép cho thuê lại lao động, sửa ký quỹ, thêm thông báo hoạt động) - theo Công văn 4848/SNV-LĐTLDN ngày 01/7/2026 của Sở Nội vụ Hà Nội và các bài thuvienphapluat.vn/luatvietnam.vn; văn bản gốc chưa mở được"]
  basis: "Nghị định 283/2026 hiệu lực 10/09/2026 (Điều 66 khoản 1; trang Công báo ghi 'Hiệu lực: 10/09/2026') và Điều 19 khoản 4 điểm a nhắc cơ chế thông báo hoạt động cho thuê lại lao động và 'giấy phép ... còn hiệu lực'. Công báo trang Nghị định 145/2020 ghi 'Hiệu lực: 01/02/2021', bảng quan hệ văn bản nạp bằng JS không đọc được; tra cứu thứ cấp ghi trạng thái 'hết hiệu lực một phần' (lawgical.vn, hrvnacademy.com) không có số điều. Vì Nghị định 145/2020 hết hiệu lực một phần mà chưa xác định chính xác điều nào (ít nhất Điều 22-28 về giấy phép; có thể cả Điều 15-21 về ký quỹ), nên Nghị định 145 ghi unconfirmed cho các điều được dẫn (15, 21, 23, 30, Phụ lục II). BLLĐ Điều 53-58 và Nghị định 283 Điều 19: còn hiệu lực (căn cứ ban hành Nghị định 283 là Bộ luật Lao động 45/2019/QH14; VBHN 18 ngày 12/02/2026)."

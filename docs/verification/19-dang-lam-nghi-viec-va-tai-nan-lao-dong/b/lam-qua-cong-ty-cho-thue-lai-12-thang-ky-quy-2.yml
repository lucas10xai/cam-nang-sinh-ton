  - issue: "legal_refs dẫn 'Điều 21 khoản 2', 'Điều 23 khoản 3', 'Điều 15 khoản 2', 'Điều 30 và Phụ lục II' nhưng không dẫn Nghị quyết 66.18/2026/NQ-CP, văn bản làm thay đổi toàn bộ khâu giấy phép; Nguồn ghi 'Tra ngày 3/11/2026' cho trạng thái mà Nghị quyết có hiệu lực từ 01/7/2026."
    severity: error
  - issue: "'Bẫy 2: làm công nhân sản xuất trong nhà máy qua công ty dịch vụ nhân sự' - Điều 19 khoản 2 điểm a chỉ có khung 40-50 triệu (cá nhân) / 80-100 triệu (tổ chức) cho việc dùng người ngoài danh mục; bẫy này đúng ý nhưng số phạt sai như trên."
    severity: warn
  - issue: "Chi phí viết 'Công ty cho thuê lại phải ký quỹ 2.000.000.000 đồng tại ngân hàng và có giấy phép hoạt động, mỗi giấy phép tối đa 60 tháng' - câu gộp ba điều kiện của một chế độ đã đổi; 'tối đa 60 tháng' là Điều 23 khoản 3 điểm a, 'ký quỹ' là Điều 21 khoản 2. Không mâu thuẫn số nhưng mất hiệu lực cùng nhau."
    severity: warn
  - issue: "'Lưu ý: hết 12 tháng thì quan hệ với bên thuê lại không tự động trở thành hợp đồng chính thức' - suy ra, không có chữ trong luật."

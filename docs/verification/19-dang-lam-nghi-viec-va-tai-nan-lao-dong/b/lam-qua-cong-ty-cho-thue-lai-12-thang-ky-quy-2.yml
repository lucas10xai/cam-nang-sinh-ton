suggested_edits:
  - "Viết lại toàn bộ phần giấy phép (tldr, Nói dễ hiểu, Chi phí, Pháp luật VN 'Giấy phép và ký quỹ', steps[0], Thứ tự làm, tiêu đề) theo chế độ từ 01/07/2026: doanh nghiệp cho thuê lại phải ký quỹ và thông báo hoạt động với Sở Nội vụ; doanh nghiệp có giấy phép cũ còn hiệu lực thì không phải thông báo (Nghị định 283/2026 Điều 19 khoản 4 điểm a; Nghị quyết 66.18/2026/NQ-CP Phụ lục I.4). Mở văn bản gốc Nghị quyết 66.18 để trích nguyên văn và xác nhận mức ký quỹ mới trước khi giữ con số 2.000.000.000 đồng."
  - "Chi phí/Pháp luật VN: sửa 'phân biệt đối xử về điều kiện lao động: phạt từ 40.000.000 đồng đến 50.000.000 đồng' - đưa 'phân biệt đối xử' sang khung 3.000.000-5.000.000 đồng (Điều 19 khoản 1 điểm d); khung 40.000.000-50.000.000 đồng chỉ cho: việc ngoài danh mục, nguồn không phải doanh nghiệp cho thuê lại, chuyển NLĐ cho đơn vị khác, thay thế người đình công/bị cho thôi việc, không có thỏa thuận bồi thường TNLĐ, không thuộc ba trường hợp được dùng (khoản 2 điểm a-g)."
  - "Thêm 'mức phạt trên là mức với cá nhân; bên thuê lại là doanh nghiệp bị gấp 02 lần (Điều 7 khoản 1 Nghị định 283/2026), tức 6.000.000-10.000.000 và 80.000.000-100.000.000 đồng'; sửa Bẫy 2 tương ứng."
  - "Pháp luật VN 'Danh mục công việc': liệt kê đủ 20 mục theo Phụ lục II (thêm mục 8 'Sản xuất, lắp đặt thiết bị truyền hình, viễn thông', mục 9 'Vận hành/kiểm tra/sửa chữa máy móc xây dựng, hệ thống điện sản xuất', 'Trang trí nội thất' ở mục 16); sửa Bẫy 2: không viết 'chỉ có lập trình hệ thống máy sản xuất' mà hướng người đọc 'đối chiếu công việc của mình với từng dòng của Phụ lục II'."
  - "Thêm khung phạt phía doanh nghiệp cho thuê lại (Điều 19 khoản 5: trả lương thấp hơn người cùng việc 10.000.000-100.000.000 đồng theo số người và buộc trả chênh lệch; khoản 6: vượt 12 tháng/ngoài danh mục/không bảo đảm ký quỹ 80.000.000-100.000.000 đồng) vì đây là khung gần nhất với quyền lợi người lao động."
  - "Điều 53 khoản 3: nêu đủ ba trường hợp cấm (đình công/tranh chấp; không có thỏa thuận bồi thường TNLĐ-BNN; thay thế người bị cho thôi việc do cơ cấu/công nghệ/kinh tế/chia tách hợp nhất sáp nhập)."
  - "Bổ sung Nghị quyết 66.18/2026/NQ-CP vào legal_refs và Nguồn, cập nhật 'Tra ngày' sau khi đã đọc văn bản gốc."

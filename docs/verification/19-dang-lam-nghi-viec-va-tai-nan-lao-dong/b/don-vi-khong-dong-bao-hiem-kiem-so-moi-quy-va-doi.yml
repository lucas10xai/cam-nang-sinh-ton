suggested_edits:
  - "Ghi chú/Pháp luật VN 'Đường dân sự': viết lại 'Có 01 năm để yêu cầu Tòa án giải quyết kể từ ngày phát hiện hành vi (Điều 190 khoản 3). Tranh chấp về bảo hiểm xã hội không bắt buộc qua hòa giải viên (Điều 188 khoản 1 điểm d)'; bỏ 'sau khi đã hòa giải ở mức 06 tháng và trọng tài ở mức 09 tháng'. Dựa vào quote Điều 190 khoản 3 và Điều 188 khoản 1."
  - "tldr, steps[3], Chi phí, Ghi chú: thay 'thanh tra lao động cấp tỉnh' bằng 'cơ quan bảo hiểm xã hội cấp tỉnh hoặc Sở Nội vụ' (Điều 54 khoản 2, 5; Điều 57 khoản 1), hoặc ghi rõ tên cơ quan chỉ khi có điều luật hiện hành nêu tên; tách 'thời hiệu xử phạt hành chính 01 năm (Điều 3 khoản 4 Nghị định 283/2026)' khỏi 'thời hiệu 01 năm kiện ra tòa'."
  - "Bẫy 2: bỏ 'và bạn mất luôn trợ cấp thất nghiệp' hoặc dẫn đúng điều Luật Việc làm 74/2025 và mở nguồn đó."
  - "Chi phí: thêm 'Phần 25% chỉ là bảo hiểm xã hội; bảo hiểm y tế, thất nghiệp, tai nạn lao động tính riêng' hoặc bỏ câu 'Cộng lại là 25%'."
  - "Pháp luật VN 'Chậm đóng và trốn đóng': nêu đủ Điều 38 khoản 2-3 (không đăng ký/đăng ký thiếu người trong 60 ngày) và Điều 39 khoản 2 (có lý do chính đáng thì không bị coi là trốn đóng); thêm Điều 43 khoản 1-2 và Điều 44 khoản 1 vào phần mức phạt hoặc ghi 'chỉ nêu các khung liên quan tới đóng thiếu tiền'."

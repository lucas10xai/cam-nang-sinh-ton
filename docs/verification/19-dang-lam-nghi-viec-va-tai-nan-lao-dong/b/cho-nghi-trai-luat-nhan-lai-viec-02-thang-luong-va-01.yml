claims:
  - text: "Điều 41 khoản 1: phải nhận trở lại, trả lương + BHXH/BHYT/BHTN những ngày không làm, trả thêm ít nhất 02 tháng lương"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Phải nhận người lao động trở lại làm việc theo hợp đồng lao động đã giao kết; phải trả tiền lương, đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp trong những ngày người lao động không được làm việc và phải trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động."
    verdict: "match"
    note: "Cũng khớp dòng 'Vi phạm thời hạn báo trước... trả một khoản tiền tương ứng với tiền lương... những ngày không báo trước' và đoạn 'không còn vị trí... thỏa thuận sửa đổi, bổ sung hợp đồng' trong cùng khoản. Nguồn: bản hợp nhất 18/VBHN-VPQH (Công báo, tệp DOCX đọc được) là văn bản hợp nhất chính thức của BLLĐ 45/2019/QH14; bản PDF gốc ở legal_refs (45.signed.pdf) là ảnh quét, không trích được chữ nên nguyên văn lấy từ bản hợp nhất."
  - text: "Điều 41 khoản 2: không muốn tiếp tục thì thêm trợ cấp thôi việc theo Điều 46"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Trường hợp người lao động không muốn tiếp tục làm việc thì ngoài khoản tiền phải trả quy định tại khoản 1 Điều này người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này để chấm dứt hợp đồng lao động."
    verdict: "match"
  - text: "Điều 41 khoản 3: không nhận lại, NLĐ đồng ý: thỏa thuận bồi thường thêm ít nhất 02 tháng lương"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "hai bên thỏa thuận khoản tiền bồi thường thêm cho người lao động nhưng ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động để chấm dứt hợp đồng lao động."
    verdict: "match"
    note: "Mục nói 'Có trường hợp cộng thêm 02 tháng nữa' và 'ba mức tăng dần': đúng ý khoản 3; 'tăng dần theo mức độ NSDLĐ muốn cắt' là diễn giải của mục, không phải chữ luật."
  - text: "Điều 40: NLĐ đơn phương trái luật: không trợ cấp thôi việc, bồi thường nửa tháng lương + ngày không báo trước, hoàn trả chi phí đào tạo"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Phải bồi thường cho người sử dụng lao động nửa tháng tiền lương theo hợp đồng lao động và một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước."
    verdict: "match"
    note: "Khoản 1 'Không được trợ cấp thôi việc' và khoản 3 'hoàn trả... chi phí đào tạo quy định tại Điều 62' cũng có trong điều."
  - text: "Điều 190 khoản 1-3: 06 tháng hòa giải viên, 09 tháng trọng tài, 01 năm tòa, tính từ ngày phát hiện hành vi"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm."
    verdict: "match"
    note: "Khoản 1 (06 tháng, hòa giải viên) và khoản 2 (09 tháng, Hội đồng trọng tài lao động) cùng cấu trúc câu, đã đối chiếu."
  - text: "Điều 190 khoản 4: trừ thời gian bất khả kháng/trở ngại khách quan nếu chứng minh được"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Trường hợp người yêu cầu chứng minh được vì sự kiện bất khả kháng, trở ngại khách quan hoặc lý do khác theo quy định của pháp luật mà không thể yêu cầu đúng thời hạn quy định tại Điều này thì thời gian có sự kiện bất khả kháng, trở ngại khách quan hoặc lý do đó không tính vào thời hiệu"
    verdict: "match"
    note: "Mục bỏ 'hoặc lý do khác theo quy định của pháp luật' (rút gọn, không sai ý)."
  - text: "Phạt 1.000.000-2.000.000 đồng với 1-10 NLĐ khi không trả/trả không đủ tiền theo quy định khi đơn phương chấm dứt trái pháp luật (Điều 18 khoản 2 NĐ 283/2026)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "không trả hoặc trả không đủ tiền cho người lao động theo quy định của pháp luật khi đơn phương chấm dứt hợp đồng lao động trái pháp luật"
    verdict: "match"
    note: "Mức: 'a) Từ 1.000.000 đồng đến 2.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động' (cùng khoản). Mục chỉ nêu bậc thấp nhất, đã ghi rõ 'từ 1 đến 10 người'."
  - text: "Điều 7 khoản 1: mức trong nghị định là mức của cá nhân, tổ chức gấp đôi"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    verdict: "match"
    note: "Điều 18 không nằm trong danh sách ngoại lệ ở Điều 7 khoản 1 (danh sách gồm Điều 8, 9, khoản 3 Điều 10, khoản 3-6 Điều 19...), nên mức Điều 18 là mức cá nhân; doanh nghiệp gấp đôi (Điều 7 khoản 2 điểm b: doanh nghiệp)."
  - text: "Quyền khởi kiện 'mất đi' nếu hai bên đã ký thỏa thuận chấm dứt theo khoản 3 Điều 34; 'không còn chỗ để nói tới Điều 41'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: "Hai bên thỏa thuận chấm dứt hợp đồng lao động."
    verdict: "inference"
    note: "Điều 34 khoản 3 chỉ liệt kê 'thỏa thuận' là một căn cứ chấm dứt; không điều nào nói quyền yêu cầu giải quyết tranh chấp mất đi vì đã ký. Khẳng định tuyệt đối là suy luận của mục; thỏa thuận bị ép buộc/vi phạm tự nguyện vẫn có thể bị tranh chấp (không có điều luật nào trong nguồn mục dẫn nói ngược lại)."
  - text: "'Ký nhận quyết định là nhận giấy, không phải đồng ý với nội dung, nên quyền yêu cầu giải quyết tranh chấp không mất đi vì đã ký nhận'"
    source_url: "https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm"
    quote: ""
    verdict: "not-found"

claims:
  - text: "Điều 21 khoản 1: hàng năm khám ít nhất một lần; nghề nặng nhọc, độc hại, nguy hiểm..., NLĐ khuyết tật, chưa thành niên, cao tuổi khám ít nhất 06 tháng một lần"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Hàng năm, người sử dụng lao động phải tổ chức khám sức khỏe ít nhất một lần cho người lao động; đối với người lao động làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hoặc đặc biệt nặng nhọc, độc hại, nguy hiểm, người lao động là người khuyết tật, người lao động chưa thành niên, người lao động cao tuổi được khám sức khỏe ít nhất 06 tháng một lần."
    verdict: "match"
    note: " Nguồn: bản Công báo số 871+872 (PDF có lớp chữ)."
  - text: "Điều 21 khoản 2: lao động nữ khám chuyên khoa phụ sản; người tiếp xúc yếu tố nguy cơ bệnh nghề nghiệp phải được khám phát hiện bệnh nghề nghiệp"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "lao động nữ phải được khám chuyên khoa phụ sản, người làm việc trong môi trường lao động tiếp xúc với các yếu tố có nguy cơ gây bệnh nghề nghiệp phải được khám phát hiện bệnh nghề nghiệp."
    verdict: "match"
    note: "Khám bệnh nghề nghiệp bắt buộc với người 'tiếp xúc với các yếu tố có nguy cơ gây bệnh nghề nghiệp', không phải mọi người làm nghề nặng nhọc."
  - text: "Điều 21 khoản 3: ba mốc khám ngoài lịch (trước khi bố trí làm việc; trước khi chuyển sang nghề nặng nhọc, độc hại hơn; sau TNLĐ/BNN đã phục hồi tiếp tục làm việc, trừ khi đã giám định)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Người sử dụng lao động tổ chức khám sức khỏe cho người lao động trước khi bố trí làm việc và trước khi chuyển sang làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hơn hoặc sau khi bị tai nạn lao động, bệnh nghề nghiệp đã phục hồi sức khỏe, tiếp tục trở lại làm việc, trừ trường hợp đã được Hội đồng y khoa khám giám định mức suy giảm khả năng lao động."
    verdict: "match"
  - text: "Điều 21 khoản 4: khám tại cơ sở khám bệnh, chữa bệnh bảo đảm yêu cầu, điều kiện chuyên môn kỹ thuật"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Người sử dụng lao động tổ chức khám sức khỏe cho người lao động, khám phát hiện bệnh nghề nghiệp tại cơ sở khám bệnh, chữa bệnh bảo đảm yêu cầu, điều kiện chuyên môn kỹ thuật."
    verdict: "match"
    note: "Câu 'nên một buổi khám do phòng y tế công ty tự làm không thay được' là suy ra của mục: luật không nói về phòng y tế công ty; phòng y tế có thể là cơ sở khám bệnh nếu đủ điều kiện."
  - text: "Điều 21 khoản 5: đưa người được chẩn đoán BNN đến cơ sở đủ điều kiện điều trị theo phác đồ Bộ trưởng Bộ Y tế quy định"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Người sử dụng lao động đưa người lao động được chẩn đoán mắc bệnh nghề nghiệp đến cơ sở khám bệnh, chữa bệnh đủ điều kiện chuyên môn kỹ thuật để điều trị theo phác đồ điều trị bệnh nghề nghiệp do Bộ trưởng Bộ Y tế quy định."
    verdict: "match"
  - text: "Điều 21 khoản 6: chi phí khám/khám BNN/điều trị BNN theo khoản 1, 2, 3, 5 do NSDLĐ chi trả, hạch toán chi phí được trừ thuế"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Chi phí cho hoạt động khám sức khỏe, khám phát hiện bệnh nghề nghiệp, điều trị bệnh nghề nghiệp cho người lao động do người sử dụng lao động chi trả quy định tại các khoản 1, 2, 3 và 5 Điều này được hạch toán vào chi phí được trừ khi xác định thu nhập chịu thuế"
    verdict: "match"
    note: "Khớp cả tldr 'Công ty phải tổ chức và trả tiền'. Chi phí khoản 4 không nằm trong danh sách trả (không ảnh hưởng)."
  - text: "Điều 27 khoản 2: lập và quản lý hồ sơ sức khỏe; thông báo kết quả khám để NLĐ biết (khoản 1: căn cứ tiêu chuẩn sức khỏe và kết quả khám để sắp xếp công việc)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Người sử dụng lao động có trách nhiệm lập và quản lý hồ sơ sức khỏe của người lao động, hồ sơ sức khỏe của người bị bệnh nghề nghiệp; thông báo kết quả khám sức khỏe, khám phát hiện bệnh nghề nghiệp để người lao động biết;"
    verdict: "match"
    note: "Khoản 1: 'Người sử dụng lao động phải căn cứ vào tiêu chuẩn sức khỏe quy định cho từng loại nghề, công việc và kết quả khám sức khỏe để sắp xếp công việc phù hợp cho người lao động.' khớp. Luật nói 'thông báo để biết', không nói 'lấy một bản kết quả' (step 2 là lời khuyên thực tiễn)."
  - text: "Điều 6 khoản 1 điểm c: quyền được chăm sóc sức khỏe, khám phát hiện BNN, đóng BH TNLĐ-BNN, trả phí giám định, chủ động đi giám định"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "Được thực hiện chế độ bảo hộ lao động, chăm sóc sức khỏe, khám phát hiện bệnh nghề nghiệp; được người sử dụng lao động đóng bảo hiểm tai nạn lao động, bệnh nghề nghiệp;"
    verdict: "match"
    note: "Phần 'được trả phí khám giám định thương tật, bệnh tật... và được chủ động đi khám giám định... được trả phí khám giám định trong trường hợp kết quả khám giám định đủ điều kiện để điều chỉnh tăng mức hưởng' cùng điểm c. Mục bỏ điều kiện 'trong trường hợp... đủ điều kiện điều chỉnh tăng mức hưởng' khi nêu 'chủ động đi khám giám định' (không gây hại, bỏ ý phụ)."
  - text: "Thông tư 60/2025/TT-BYT Điều 1: phạm vi (danh mục BNN được hưởng BHXH, hướng dẫn chẩn đoán, giám định)"
    source_url: "https://bvdkbaclieu.gov.vn/upload/1000079/20260305/686_Thong-tu-60-2025-TT-BYT_5eaf1a4c81.pdf"
    quote: "Thông tư này quy định về danh mục bệnh nghề nghiệp được hưởng bảo hiểm xã hội và hướng dẫn chẩn đoán, giám định mức suy giảm khả năng lao động do bệnh nghề nghiệp."
    verdict: "match"
    note: "PDF 176 trang; chỉ 3 trang đầu có lớp chữ (trích được), phần còn lại (phụ lục, có thể cả điều hiệu lực) là ảnh quét. Ngày ban hành 31/12/2025 khớp tiêu đề văn bản."
  - text: "Thông tư 60/2025/TT-BYT Điều 3: từng bệnh một mục với phụ lục riêng; mở đầu bụi phổi silic (mục 1) và amiăng (mục 2); điếc nghề nghiệp do tiếng ồn (mục 18)"
    source_url: "https://bvdkbaclieu.gov.vn/upload/1000079/20260305/686_Thong-tu-60-2025-TT-BYT_5eaf1a4c81.pdf"
    quote: "Bệnh điếc nghề nghiệp do tiếng ồn và hướng dẫn chẩn đoán, giám định mức suy giảm khả năng lao động quy định tại Phụ lục XVIII ban hành kèm theo Thông tư này."
    verdict: "partial"
    note: "Mục 1 'Bệnh bụi phổi silic nghề nghiệp... Phụ lục I', mục 2 'Bệnh bụi phổi amiăng nghề nghiệp... Phụ lục II' khớp. Tuy nhiên văn bản trích được là danh sách phẳng 24 mục; không thấy tiêu đề 'nhóm bệnh do yếu tố vật lý' như mục viết ('nhóm bệnh do yếu tố vật lý có bệnh điếc nghề nghiệp do tiếng ồn'). Phụ lục chưa đọc được (ảnh quét). Nên bỏ chữ 'nhóm bệnh do yếu tố vật lý'."
  - text: "Thông tư 60/2025/TT-BYT hiệu lực từ 15/02/2026"
    source_url: "https://storage-vnportal.vnpt.vn/gov-lan/5962/FileQuanTriTinTuc/167_SYT-NV1_08-01-2026_CV%20Tri%E1%BB%83n%20khai%20th%E1%BB%B1c%20hi%E1%BB%87n%20TT__60_2025_TT_BYT.signed.pdf"
    quote: "Thông tư có hiệu lực thi hành từ ngày 15/02/2026 (đính kèm)."
    verdict: "match-secondary"
    note: "Nguồn: công văn triển khai của Sở Y tế (nguồn thứ cấp, địa phương). Điều khoản hiệu lực trong chính Thông tư nằm ở trang ảnh quét không trích được chữ nên chưa đối chiếu nguyên văn."
  - text: "Nghị định 283/2026/NĐ-CP Điều 33 khoản 2: phạt 1.000.000-3.000.000 đồng cho mỗi NLĐ, tối đa 75.000.000 đồng, nếu không tổ chức khám định kỳ hoặc khám phát hiện BNN"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng khi vi phạm với mỗi người lao động nhưng tối đa không quá 75.000.000 đồng đối với người sử dụng lao động có hành vi không tổ chức khám sức khỏe định kỳ hoặc khám phát hiện bệnh nghề nghiệp cho người lao động."
    verdict: "match"
    note: "Khoản 11 điểm a: biện pháp khắc phục 'Buộc tổ chức khám... Trường hợp người lao động đã tự thực hiện việc khám thì buộc thanh toán chi phí' (mục không nêu, hữu ích). Đây là mức cá nhân; doanh nghiệp gấp đôi (Điều 7 khoản 1; Điều 33 không thuộc ngoại lệ) - mục không nêu."
  - text: "Nghị định 283/2026/NĐ-CP Điều 33 khoản 3: không khám trước khi chuyển sang nghề nặng nhọc, độc hại hơn bị phạt nặng hơn"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    quote: "Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng khi vi phạm với mỗi người lao động nhưng tối đa không quá 75.000.000 đồng đối với người sử dụng lao động có hành vi không tổ chức khám sức khỏe cho người lao động trước khi chuyển sang làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hơn"
    verdict: "match"
    note: "Khoản 3 cũng gồm khám 'sau khi bị tai nạn lao động, bệnh nghề nghiệp đã phục hồi sức khỏe, tiếp tục trở lại làm việc'. Mục chỉ nói 'nặng hơn' không nêu số - đúng nhưng thiếu số cụ thể."
  - text: "tldr: 'nghề nặng nhọc, độc hại thì 06 tháng một lần, có khám phát hiện bệnh nghề nghiệp'"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-84-2015-qh13-15356.htm"
    quote: "đối với người lao động làm nghề, công việc nặng nhọc, độc hại, nguy hiểm hoặc đặc biệt nặng nhọc, độc hại, nguy hiểm, người lao động là người khuyết tật, người lao động chưa thành niên, người lao động cao tuổi được khám sức khỏe ít nhất 06 tháng một lần."
    verdict: "partial"
    note: "06 tháng áp dụng cả cho khuyết tật, chưa thành niên, cao tuổi (tldr bỏ). Khám phát hiện BNN áp dụng cho người 'tiếp xúc với các yếu tố có nguy cơ gây bệnh nghề nghiệp' (khoản 2), không đồng nghĩa với mọi nghề nặng nhọc/nguy hiểm. Thân mục nêu đủ; chỉ tldr/Nói dễ hiểu gọn quá."
  - text: "Bẫy 3: quyền giám định và quyền hưởng chế độ gắn với thời gian tiếp xúc và hồ sơ; đổi công ty không mất hết quyền với bệnh cũ"
    source_url: "https://bvdkbaclieu.gov.vn/upload/1000079/20260305/686_Thong-tu-60-2025-TT-BYT_5eaf1a4c81.pdf"
    quote: "Thời gian bảo đảm là khoảng thời gian kể từ khi người lao động đã thôi tiếp xúc với"
    verdict: "inference"
    note: "Điều 2 khoản 3 Thông tư 60 (lớp chữ OCR có lỗi chính tả nhỏ nên chỉ trích đoạn đầu; câu đầy đủ: '...đến thời điểm vẫn còn khả năng phát bệnh do yếu tố có hại đó') định nghĩa 'thời gian bảo đảm' (còn có thể phát bệnh sau khi thôi tiếp xúc), ủng hộ ý 'đổi việc không mất quyền' nhưng mục không dẫn khoản này; ý 'hồ sơ nằm ở nơi đã dùng bạn... bệnh nghề nghiệp chỉ có giá trị khi có hồ sơ theo dõi nhiều năm' và 'một bệnh nghề nghiệp phát hiện muộn thường đã ở mức đổi nghề' là nhận định không có nguồn."
internal_checks:
  - issue: "Chi phí: 'Một bệnh nghề nghiệp phát hiện muộn thường đã ở mức suy giảm khả năng lao động đủ để đổi nghề, và tiền điều trị... lớn hơn rất nhiều' là nhận định y tế/kinh tế không có nguồn, trong mục không dẫn nghiên cứu hay thống kê."
    severity: "warn"

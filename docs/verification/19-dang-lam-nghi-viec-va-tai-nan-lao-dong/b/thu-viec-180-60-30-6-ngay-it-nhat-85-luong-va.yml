claims:
  - text: "Thử việc tối đa 180 ngày (quản lý doanh nghiệp), 60 ngày (cao đẳng trở lên), 30 ngày (trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ), 06 ngày làm việc (việc khác); chỉ một lần cho một công việc (Điều 25)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Thời gian thử việc do hai bên thỏa thuận căn cứ vào tính chất và mức độ phức tạp của công việc nhưng chỉ được thử việc một lần đối với một công việc và bảo đảm điều kiện sau đây: 1. Không quá 180 ngày đối với công việc của người quản lý doanh nghiệp ...; 2. Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên; 3. Không quá 30 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ; 4. Không quá 06 ngày làm việc đối với công việc khác."
    verdict: match
    note: "Chữ lấy từ DOCX chính thức tải trên trang Công báo vì PDF ký của 18/VBHN-VPQH là ảnh quét. Điểm 1 viện dẫn 'theo quy định của Luật Doanh nghiệp, Luật Quản lý, sử dụng vốn nhà nước ...' (mục đã lược)."
  - text: "Lương thử việc ít nhất bằng 85% mức lương của công việc đó (Điều 26)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó."
    verdict: match
    note: ""
  - text: "Hết thời gian thử việc phải thông báo kết quả; đạt thì tiếp tục hợp đồng hoặc phải giao kết hợp đồng lao động nếu chỉ có hợp đồng thử việc (Điều 27 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "1. Khi kết thúc thời gian thử việc, người sử dụng lao động phải thông báo kết quả thử việc cho người lao động. Trường hợp thử việc đạt yêu cầu thì người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động hoặc phải giao kết hợp đồng lao động đối với trường hợp giao kết hợp đồng thử việc."
    verdict: match
    note: ""
  - text: "Trong thời gian thử việc mỗi bên được hủy bỏ không cần báo trước và không phải bồi thường (Điều 27 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "2. Trong thời gian thử việc, mỗi bên có quyền hủy bỏ hợp đồng thử việc hoặc hợp đồng lao động đã giao kết mà không cần báo trước và không phải bồi thường."
    verdict: match
    note: "Câu mục thêm 'không mất trợ cấp' không có trong điều này (xem claim riêng)."
  - text: "Người lao động rời đi trong thời gian thử việc 'không mất trợ cấp, không phải đền'"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "mỗi bên có quyền hủy bỏ hợp đồng thử việc hoặc hợp đồng lao động đã giao kết mà không cần báo trước và không phải bồi thường."
    verdict: partial
    note: "'Không phải bồi thường' đúng nguyên văn; 'không mất trợ cấp' không có trong Điều 27 (trợ cấp thôi việc chỉ phát sinh từ đủ 12 tháng, Điều 46 khoản 1), là diễn giải không nguồn."
  - text: "Không áp dụng thử việc với hợp đồng có thời hạn dưới 01 tháng (Điều 24 khoản 3)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "3. Không áp dụng thử việc đối với người lao động giao kết hợp đồng lao động có thời hạn dưới 01 tháng."
    verdict: match
    note: ""
  - text: "Phải giao kết hợp đồng trước khi nhận người vào làm việc (Điều 13 khoản 2) và bằng văn bản, làm thành 02 bản (Điều 14 khoản 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "2. Trước khi nhận người lao động vào làm việc thì người sử dụng lao động phải giao kết hợp đồng lao động với người lao động."
    verdict: match
    note: "Điều 14 khoản 1: 'phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này' (khoản 2: miệng được với hợp đồng dưới 01 tháng). Mục không nêu ngoại lệ này nhưng tập trung thử việc nên chấp nhận."
  - text: "Hợp đồng xác định thời hạn hết hạn mà vẫn làm: trong 30 ngày phải ký mới; quá 30 ngày thành không xác định thời hạn; ký tiếp xác định thời hạn chỉ thêm 01 lần (Điều 20 khoản 2)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "c) Trường hợp hai bên ký kết hợp đồng lao động mới là hợp đồng lao động xác định thời hạn thì cũng chỉ được ký thêm 01 lần, sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn, trừ hợp đồng lao động đối với người được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước và trường hợp quy định tại khoản 1 Điều 149, khoản 2 Điều 151 và khoản 4 Điều 177 của Bộ luật này."
    verdict: partial
    note: "Điểm a, b khớp (30 ngày; quá 30 ngày thành không xác định thời hạn). Điểm c có ngoại lệ (giám đốc doanh nghiệp có vốn nhà nước; Điều 149 khoản 1, Điều 151 khoản 2, Điều 177 khoản 4) mà mục không nêu; steps[3] và Bẫy 3 viết như quy tắc tuyệt đối."
  - text: "Phạt 500.000-1.000.000 đồng: thử việc với hợp đồng dưới 01 tháng; không thông báo kết quả thử việc (Điều 16 khoản 1 NĐ 283)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "1. Phạt tiền từ 500.000 đồng đến 1.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: a) Thử việc đối với người lao động làm việc theo hợp đồng lao động có thời hạn dưới 01 tháng; b) Không thông báo kết quả thử việc cho người lao động khi thời gian thử việc kết thúc."
    verdict: match
    note: ""
  - text: "Phạt 2.000.000-5.000.000 đồng với bốn hành vi: thử việc quá 01 lần/công việc; quá thời gian thỏa thuận hoặc vượt Điều 25; trả lương thử việc dưới thỏa thuận hoặc dưới 85%; không giao kết hợp đồng khi thử việc đạt (Điều 16 khoản 2)"

suggested_edits:
  - "Chi phí, đoạn 'Thời gian thử việc không được tính vào hợp đồng chính ...': xóa hoặc thay bằng 'Thời gian thử việc được tính vào thời gian làm việc để tính phép năm nếu bạn tiếp tục làm (NĐ 145/2020 Điều 65 khoản 2)'; bỏ câu về bảo hiểm thất nghiệp (không có nguồn)."
  - "Bẫy 2 và steps[1]: thay 'mọi khoản khấu trừ phải nằm trong hợp đồng, có bảng kê' bằng 'khấu trừ lương chỉ hợp lệ để bồi thường thiệt hại do làm hư hỏng dụng cụ, thiết bị, tài sản (Điều 102 khoản 1, Điều 129); tối đa 30% lương thực trả hằng tháng sau khi trừ bảo hiểm và thuế (Điều 102 khoản 3); phải có bảng kê (Điều 95 khoản 3)'. Thêm Điều 102 vào legal_refs."
  - "Chi phí, phần NSDLĐ: tách bốn hành vi mức 2-5 triệu; ghi 'buộc trả đủ tiền lương' cho ba hành vi (quá 01 lần, quá thời gian/Điều 25, lương dưới 85%) và 'buộc giao kết hợp đồng' cho hành vi không ký khi thử việc đạt; nêu hành vi thứ tư chỉ khi hai bên có hợp đồng thử việc."
  - "Mức phạt Điều 15 khoản 1: thêm 'với 1-10 người lao động; mức tăng theo số người đến 20.000.000-25.000.000 đồng từ 301 người' (Điều 15 khoản 1 điểm a-đ)."
  - "steps[3]/Bẫy 3: thêm ngoại lệ Điều 20 khoản 2 điểm c (giám đốc doanh nghiệp có vốn nhà nước và các trường hợp nêu) hoặc ghi 'trừ trường hợp luật quy định'."
  - "Câu 'không mất trợ cấp': xóa, giữ đúng Điều 27 khoản 2 ('không cần báo trước và không phải bồi thường')."

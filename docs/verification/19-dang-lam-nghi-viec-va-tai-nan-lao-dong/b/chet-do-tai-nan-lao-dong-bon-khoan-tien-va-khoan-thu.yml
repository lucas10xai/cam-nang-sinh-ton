suggested_edits:
  - 'Chi phí/tldr/Pháp luật VN: thêm "ít nhất 30 tháng lương (nếu tai nạn không hoàn toàn do lỗi của người chết; do lỗi hoàn toàn thì ít nhất 40% mức đó, Điều 38.5)" và nhắc Điều 40.1.'
  - 'Chi phí: dẫn Điều 141 khoản 13 Luật BHXH 41/2024 làm căn cứ "mức tham chiếu bằng mức lương cơ sở khi chưa bãi bỏ lương cơ sở"; gắn nhãn "tạm tính theo cầu nối này" cho 25.300.000, 1.265.000, 1.771.000; bỏ "ND 161/2026" khỏi căn cứ của mức tham chiếu.'
  - 'Steps[0]: thay "giấy tờ chứng minh quan hệ với người mất" bằng danh mục Điều 90.1 (sổ BHXH, giấy chứng tử, tờ khai, biên bản điều tra TNLĐ, biên bản giám định cho thân nhân suy giảm >=81% nếu thuộc diện); chuyển "giấy tờ chứng minh quan hệ" thành lời khuyên thực hành.'
  - "Mốc 90 ngày và Bẫy 3: thêm Điều 92.1 (quá hạn vẫn nộp, kèm giải trình bằng văn bản); ghi 30 ngày của đơn vị tính từ khi nhận đủ hồ sơ."
  - "Thêm 1-2 câu: nếu đơn vị không đóng BH TNLĐ-BNN thì chính đơn vị phải trả khoản tương ứng khoản 1-3 (Điều 39.4; xem mục 19-13)."

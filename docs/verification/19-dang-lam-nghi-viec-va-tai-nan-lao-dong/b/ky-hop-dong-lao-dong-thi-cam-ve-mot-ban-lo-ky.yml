claims:
  - text: "Hợp đồng lao động làm thành 02 bản, NLĐ giữ 01 bản, NSDLĐ giữ 01 bản, trừ hợp đồng dưới 01 tháng"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "1. Hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản, trừ trường hợp quy định tại khoản 2 Điều này."
    verdict: partial
    note: "Điều 14 khoản 1 (VBHN 18; mục dẫn URL vanban.chinhphu.vn đúng văn bản Luật 45/2019/QH14 nhưng đó là trang metadata, tôi đọc chữ từ VBHN 18). Ngoại lệ của khoản 1 trỏ sang khoản 2: 'Hai bên có thể giao kết hợp đồng lao động bằng lời nói đối với hợp đồng có thời hạn dưới 01 tháng, trừ trường hợp quy định tại khoản 2 Điều 18, điểm a khoản 1 Điều 145 và khoản 1 Điều 162 của Bộ luật này.' Mục viết 'trừ hợp đồng có thời hạn dưới 01 tháng' bỏ các ngoại lệ của ngoại lệ (Điều 18 khoản 2: nhóm lao động thời vụ ủy quyền ký - phải bằng văn bản; Điều 145 khoản 1 điểm a: sử dụng người chưa đủ 15 tuổi; Điều 162 khoản 1: lao động là người giúp việc gia đình). Mục cũng bỏ đoạn 2: 'Hợp đồng lao động được giao kết thông qua phương tiện điện tử dưới hình thức thông điệp dữ liệu ... có giá trị như hợp đồng lao động bằng văn bản.' - quan trọng vì step 1 'cầm về một bản' không áp cho hợp đồng điện tử như nhau."
  - text: "Phạt 2.000.000-5.000.000 đồng với vi phạm 01-10 NLĐ khi giao kết không bằng văn bản, không đúng loại hợp đồng hoặc không đầy đủ nội dung chủ yếu"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "a) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động;"
    verdict: match
    note: "Điều 15 khoản 1 điểm a Nghị định 283/2026/NĐ-CP (hiệu lực 10/09/2026): 'giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên; ... giao kết không đúng loại hợp đồng lao động với người lao động; giao kết hợp đồng lao động không đầy đủ các nội dung chủ yếu của hợp đồng lao động theo quy định của pháp luật theo một trong các mức sau đây:'. NHƯNG mục dẫn Điều 9 khoản 1 Nghị định 12/2022/NĐ-CP, văn bản đã HẾT HIỆU LỰC (xem claim sau). Số tiền không đổi, điều khoản đã đổi số."
  - text: "Nghị định 12/2022/NĐ-CP (Điều 9 khoản 1, Điều 6 khoản 3) là văn bản xử phạt hiện hành"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "4. Nghị định số 12/2022/NĐ-CP ngày 17 tháng 01 năm 2022 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực thi hành."
    verdict: mismatch
    note: "Nghị định 283/2026/NĐ-CP Điều 66 khoản 4; Điều 66 khoản 1: 'Nghị định này có hiệu lực thi hành từ ngày 10 tháng 9 năm 2026.' Hôm nay 2026-11-08 đã sau ngày đó, nên Nghị định 12/2022 hết hiệu lực. Trang VCCI mà mục dẫn vẫn hiển thị 'Hiệu lực văn bản: Còn hiệu lực' (đọc ngày 2026-11-08) - tình trạng lạc hậu và là nguồn thứ cấp. Nguồn đúng: Điều 15 khoản 1 và Điều 7 khoản 1 Nghị định 283/2026."
  - text: "Tổ chức bị phạt gấp 02 lần mức của cá nhân"

    quote: "a) Buộc người sử dụng lao động giao kết hợp đồng lao động bằng văn bản với người lao động khi có hành vi giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên quy định tại khoản 1 Điều này;"
    verdict: partial
    note: "Điều 15 khoản 3 điểm a, c: chỉ áp cho 'giao kết không bằng văn bản' (điểm a) và 'không đúng loại hợp đồng' (điểm c: 'Buộc người sử dụng lao động giao kết đúng loại hợp đồng'). Với 'thiếu nội dung chủ yếu' không có biện pháp buộc giao kết lại tại khoản 3. Mục viết 'Cơ quan lao động còn buộc giao kết lại bằng văn bản' ngay sau câu nêu cả ba hành vi, nên rộng hơn nguồn. Cũng 'cơ quan lao động' không phải tên cơ quan trong Nghị định 283 (thẩm quyền: UBND cấp xã/tỉnh, Sở Nội vụ lập biên bản - Điều 54, 55)."
  - text: "Nghị định không có mức phạt riêng cho việc không giao bản hợp đồng cho NLĐ; cái bị phạt là giao kết không bằng văn bản / sai loại / thiếu nội dung chủ yếu (Ghi chú)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm
    quote: "1. Phạt tiền đối với người sử dụng lao động khi có một trong các hành vi: giao kết hợp đồng lao động không bằng văn bản với người lao động làm công việc có thời hạn từ đủ 01 tháng trở lên;"

claims:
  - text: "Ngược đãi người lao động và cưỡng bức lao động bị nghiêm cấm (Điều 8 khoản 2)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "Điều 8. Các hành vi bị nghiêm cấm trong lĩnh vực lao động […] 2. Ngược đãi người lao động, cưỡng bức lao động."
    note: "Bản hợp nhất 18/VBHN-VPQH (Công báo 131), PDF có lớp chữ (trùng byte với tệp tải trên congbao.chinhphu.vn)."
  - text: "Quấy rối tình dục tại nơi làm việc bị nghiêm cấm (Điều 8 khoản 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "3. Quấy rối tình dục tại nơi làm việc."
  - text: "Được đơn phương chấm dứt hợp đồng không cần báo trước khi bị ngược đãi/nhục mạ, cưỡng bức lao động (điểm c) hoặc quấy rối tình dục (điểm d) (Điều 35 khoản 2)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "2. Người lao động có quyền đơn phương chấm dứt hợp đồng lao động không cần báo trước trong trường hợp sau đây: […] c) Bị người sử dụng lao động ngược đãi, đánh đập hoặc có lời nói, hành vi nhục mạ, hành vi làm ảnh hưởng đến sức khỏe, nhân phẩm, danh dự; bị cưỡng bức lao động; […] d) Bị quấy rối tình dục tại nơi làm việc;"
    note: "Điểm c nói rõ chủ thể là \"người sử dụng lao động\"; bắt nạt bởi đồng nghiệp/quản lý trực tiếp không tự động rơi vào điểm c (mục đã nêu hạn chế này ở Ghi chú). Không thấy yêu cầu báo trước bổ sung trong thân Điều 35 và NĐ 145/2020 Điều 7 chỉ nói về ngành nghề đặc thù (điểm d khoản 1)."
  - text: "Nghỉ theo Điều 35 vẫn được trợ cấp thôi việc nửa tháng lương mỗi năm làm việc, với người làm từ đủ 12 tháng (Điều 34 khoản 9, Điều 46 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "partial"
    quote: "9. Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35 của Bộ luật này. […] mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội […] 2. Thời gian làm việc để tính trợ cấp thôi việc là tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động trừ đi thời gian người lao động đã tham gia bảo hiểm thất nghiệp"
    note: "Đúng ý nhưng thiếu hai điều kiện: (1) Điều 46 khoản 2 trừ thời gian đã tham gia bảo hiểm thất nghiệp nên người đã đóng BHTN từ 2009 thường không còn năm nào để tính; (2) loại trừ người đủ điều kiện hưởng lương hưu. Nói dễ hiểu ghi \"vẫn có trợ cấp thôi việc\" không kèm điều kiện nên có thể gây hiểu sai."
  - text: "Phạt 50.000.000-75.000.000 đồng với cưỡng bức lao động/ngược đãi chưa đến mức truy cứu TNHS (Điều 17 khoản 4 điểm a NĐ 283/2026)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "4. Phạt tiền từ 50.000.000 đồng đến 75.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây: […] a) Cưỡng bức lao động hoặc ngược đãi người lao động nhưng chưa đến mức truy cứu trách nhiệm hình sự; || Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân […] Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    note: "Số tiền đúng, nhưng là mức phạt đối với cá nhân; Điều 7 khoản 1 NĐ 283 nhân đôi cho tổ chức (doanh nghiệp), mà Điều 17 không nằm trong danh sách ngoại lệ của Điều 7 khoản 1. Mục không nói điều này (các mục 01, 03, 04, 06, 21, 22 cùng chương có nói). Người đọc dễ hiểu doanh nghiệp bị phạt 50-75 triệu, đúng ra 100-150 triệu."
  - text: "Phạt 15.000.000-30.000.000 đồng với quấy rối tình dục tại nơi làm việc chưa đến mức truy cứu TNHS (Điều 17 khoản 3)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "3. Phạt tiền từ 15.000.000 đồng đến 30.000.000 đồng đối với hành vi quấy rối tình dục tại nơi làm việc nhưng chưa đến mức truy cứu trách nhiệm hình sự. || Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân […] Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    note: "Cùng vấn đề mức phạt cá nhân/tổ chức. Khoản 3 không giới hạn chủ thể là người sử dụng lao động."
  - text: "Buộc xin lỗi công khai, trừ khi nạn nhân có đơn không yêu cầu (Điều 17 khoản 5 điểm d)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "match"
    quote: "d) Buộc xin lỗi công khai tại nơi cư trú, nơi làm việc, địa điểm khác hoặc trên phương tiện thông tin đại chúng, trừ trường hợp nạn nhân có đơn không yêu cầu."
  - text: "Bồi thường tổn thất tinh thần do xâm phạm danh dự, nhân phẩm: thỏa thuận, không được thì tối đa 10 lần mức lương cơ sở (BLDS Điều 592 khoản 2)"
    source_url: "https://congbao.chinhphu.vn/van-ban/luat-so-91-2015-qh13-18397.htm"
    verdict: "match"
    quote: "Mức bồi thường bù đắp tổn thất về tinh thần do các bên thỏa thuận; nếu không thỏa thuận được thì mức tối đa cho một người có danh dự, nhân phẩm, uy tín bị xâm phạm không quá mười lần mức lương cơ sở do Nhà nước quy định."
    note: "Công báo 1245+1246. Mức tối đa chỉ áp dụng khi không thỏa thuận được và tính cho mỗi người bị xâm phạm; mục nêu đúng."
  - text: "Mức lương cơ sở 2.530.000 đồng nên 10 lần = 25.300.000 đồng (NĐ 161/2026 Điều 3 khoản 2)"
    source_url: "https://hdnd.dongnai.gov.vn/vi/news/kinh-te-xa-hoi/chinh-phu-ban-hanh-nghi-dinh-161-2026-nd-cp-ve-muc-luong-co-so-2302.html"
    verdict: "match-secondary"
    quote: "Theo Nghị định, từ ngày 01/07/2026, mức lương cơ sở được điều chỉnh từ 2.340.000 đồng lên 2.530.000 đồng/tháng (tăng 190.000 đồng)."
    note: "PDF ký số của NĐ 161/2026 (datafiles.chinhphu.vn/.../161-ndcp.signed.pdf) là ảnh quét, không trích được chữ (pdftotext ra ~180 byte) và không tìm được trang Công báo/bản DOCX; không OCR được. Chỉ xác nhận qua trang tin của HĐND tỉnh Đồng Nai (thứ cấp). Phép nhân 10 x 2.530.000 = 25.300.000 là tính đúng. Cần người kiểm lại đúng Điều 3 khoản 2 trên bản có chữ."
  - text: "Thời hiệu: hòa giải 06 tháng, trọng tài 09 tháng, Tòa án 01 năm kể từ ngày phát hiện hành vi (Điều 190)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "1. Thời hiệu yêu cầu hòa giải viên lao động thực hiện hòa giải tranh chấp lao động cá nhân là 06 tháng kể từ ngày phát hiện ra hành vi […] 2. Thời hiệu yêu cầu Hội đồng trọng tài lao động giải quyết tranh chấp lao động cá nhân là 09 tháng kể từ ngày phát hiện ra hành vi […] 3. Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi"
    note: "Điều 190 khoản 4 còn cho trừ thời gian bất khả kháng/trở ngại khách quan (mục không nêu, ít quan trọng). Điều 190 là thời hiệu cho tranh chấp lao động cá nhân; thời hiệu đòi bồi thường tổn thất tinh thần theo BLDS (đã nêu trong mục cùng các mốc này) chưa được kiểm tra và không do Điều 190 quy định."
  - text: "Bước \"viết đơn nêu đúng lý do theo Điều 35 khoản 2, gửi người sử dụng lao động và giữ bản gửi\""
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "inference"
    note: "Điều 35 khoản 2 không quy định hình thức đơn hay nghĩa vụ nêu lý do; đây là lời khuyên thực hành hợp lý (để chứng minh), không phải chữ của luật. Điều 39 và Điều 40 BLLĐ: nếu chấm dứt không đúng Điều 35/36/37 thì là trái pháp luật, người lao động mất trợ cấp thôi việc, bồi thường nửa tháng lương và tiền lương những ngày không báo trước. Mục chỉ nhắc ở Bẫy 1, không nêu rủi ro này khi lý do không chứng minh được."

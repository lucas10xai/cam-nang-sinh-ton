  - issue: "Step 4/Bẫy 1 gợi ý nghỉ ngay không báo trước nhưng không nêu rủi ro: nếu người sử dụng lao động tranh chấp và người lao động không chứng minh được hành vi, việc nghỉ thành \"trái pháp luật\" (Điều 39, 40 BLLĐ) với hậu quả mất trợ cấp và phải bồi thường. Đây là thiếu điều kiện có thể gây thiệt hại cho người đọc làm theo nguyên văn."
    severity: "warn"

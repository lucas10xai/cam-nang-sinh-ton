  - issue: "legal_refs[].url của NĐ 283 (datafiles .../283-ndcp.signed.pdf) và NĐ 161 (datafiles .../161-ndcp.signed.pdf) là bản quét ảnh, đúng văn bản nhưng không trích chữ được; nên thay bằng trang Công báo congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm (có tệp PDF/DOCX có chữ). URL BLLĐ congbaocdn đúng văn bản 18/VBHN-VPQH và có lớp chữ. Không URL nào trỏ nhầm văn bản. Khoản 4 điểm a của Điều 17 khớp nội dung; Điều 3 khoản 2 NĐ 161 chưa đối chiếu được trên bản chữ."

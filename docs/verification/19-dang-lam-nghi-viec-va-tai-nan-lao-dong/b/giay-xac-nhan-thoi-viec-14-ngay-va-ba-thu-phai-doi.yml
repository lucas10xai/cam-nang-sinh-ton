suggested_edits:
  - "tldr và Nói dễ hiểu: bỏ gắn \"14 ngày làm việc, tối đa 30 ngày\" với ba việc (xác nhận BHXH/BHTN, trả bản chính, cấp bản sao). Viết: \"Trong 14 ngày làm việc (tối đa 30 ngày trong bốn trường hợp) hai bên thanh toán đủ các khoản tiền; đơn vị còn phải xác nhận thời gian đóng bảo hiểm, trả bản chính giấy tờ, cấp bản sao khi bạn yêu cầu\" (Điều 48 khoản 1 và khoản 3; khoản 3 không ghi hạn ngày)."
  - "Pháp luật Việt Nam, Mức phạt: thêm \"Các mức trên là mức đối với cá nhân; tổ chức phạt gấp 02 lần (Điều 7 khoản 1, NĐ 283/2026/NĐ-CP)\" và thêm điều kiện \"với vi phạm từ 01 đến 10 người lao động\" vào tldr/Nói dễ hiểu; thêm Điều 7 khoản 1 vào legal_refs."
  - "Chi phí: xóa hoặc dẫn nguồn câu \"Không chốt được thời gian đóng bảo hiểm thất nghiệp thì hồ sơ hưởng trợ cấp thất nghiệp bị treo\" (không có nguồn)."
  - "Phần \"Ba việc...\" (dòng cuối): sửa câu \"Luật cũng không buộc giấy đó phải ghi lý do thôi việc\" thành \"Điều 48 khoản 3 không đòi mẫu giấy xác nhận hay lý do thôi việc; riêng việc NSDLĐ phải thông báo bằng văn bản về chấm dứt hợp đồng nằm ở Điều 45 khoản 1\"."
  - "Biện pháp buộc: tách điểm a (trợ cấp + lãi) khỏi điểm b (xác nhận + trả giấy tờ) bằng ghi chú rằng điểm a thuộc hành vi không trả trợ cấp."
  - "Bẫy 3: gắn nhãn \"lời khuyên\" cho câu \"Ký sớm là tự bỏ mốc thời gian đó\" hoặc bỏ."

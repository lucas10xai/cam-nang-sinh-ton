claims:
  - text: "Hai bên thanh toán đầy đủ các khoản tiền liên quan quyền lợi trong 14 ngày làm việc kể từ ngày chấm dứt hợp đồng (Điều 48 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "Điều 48. Trách nhiệm khi chấm dứt hợp đồng lao động […] 1. Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày:"
  - text: "Kéo dài không quá 30 ngày trong bốn trường hợp: (1) NSDLĐ không phải cá nhân chấm dứt hoạt động; (2) đổi cơ cấu/công nghệ/lý do kinh tế; (3) chia tách, hợp nhất, sáp nhập, bán, cho thuê, chuyển đổi loại hình, chuyển nhượng tài sản; (4) thiên tai, hỏa hoạn, địch họa, dịch bệnh nguy hiểm (Điều 48 khoản 1)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "a) Người sử dụng lao động không phải là cá nhân chấm dứt hoạt động; […] b) Người sử dụng lao động thay đổi cơ cấu, công nghệ hoặc vì lý do kinh tế; […] d) Do thiên tai, hỏa hoạn, địch họa hoặc dịch bệnh nguy hiểm."
    note: "Thân bài đúng. tldr và đoạn Nói dễ hiểu viết \"tối đa 30 ngày\" mà không nói chỉ trong bốn trường hợp."
  - text: "Trong 14 ngày làm việc (tối đa 30 ngày) đơn vị phải chốt thời gian đóng bảo hiểm, trả bản chính giấy tờ và cấp bản sao tài liệu (tldr, Nói dễ hiểu, Bẫy 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "inference"
    quote: "Điều 48. Trách nhiệm khi chấm dứt hợp đồng lao động […] 1. Trong thời hạn 14 ngày làm việc kể từ ngày chấm dứt hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên, trừ trường hợp sau đây có thể kéo dài nhưng không được quá 30 ngày: || 3. Người sử dụng lao động có trách nhiệm sau đây: […] a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động;"
    note: "Hạn 14 ngày/30 ngày ở khoản 1 áp dụng cho việc \"thanh toán các khoản tiền\". Khoản 3 (ba việc: xác nhận thời gian đóng BHXH/BHTN, trả bản chính, cấp bản sao) không ghi thời hạn. NĐ 283 Điều 18 khoản 2 cũng phạt \"không thực hiện đúng quy định về thời hạn thanh toán\" tách khỏi \"không hoàn thành thủ tục xác nhận\"; không thấy hạn ngày cho ba việc. Mục ghi hạn 14 ngày cho cả ba việc là suy ra, không phải chữ của luật (không có quote nào nối hạn đó với khoản 3)."
  - text: "Ba việc NSDLĐ phải làm: hoàn thành thủ tục xác nhận thời gian đóng BHXH/BHTN; trả lại bản chính giấy tờ đã giữ; cấp bản sao tài liệu về quá trình làm việc nếu người lao động yêu cầu, chi phí do NSDLĐ trả (Điều 48 khoản 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động; […] b) Cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu. Chi phí sao, gửi tài liệu do người sử dụng lao động trả."
    note: "Luật nối điểm a bằng một câu ghép (xác nhận thời gian đóng và trả bản chính) nên \"ba việc\" là cách đếm tách của mục, chấp nhận được."
  - text: "Phạt 1.000.000-2.000.000 đồng nếu không hoàn thành thủ tục xác nhận/không trả giấy tờ/không cấp bản sao, với vi phạm từ 01 đến 10 người lao động (Điều 18 khoản 2 điểm a NĐ 283/2026)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "không hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác đã giữ của người lao động sau khi chấm dứt hợp đồng lao động theo quy định của pháp luật; không cung cấp bản sao các tài liệu liên quan đến quá trình làm việc của người lao động nếu người lao động có yêu cầu sau khi chấm dứt hợp đồng lao động theo một trong các mức sau đây: […] a) Từ 1.000.000 đồng đến 2.000.000 đồng đối với vi phạm từ 01 người đến 10 người lao động; || Mức phạt tiền quy định đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này là mức phạt đối với cá nhân […] Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân."
    note: "Số tiền đúng nhưng là mức đối với cá nhân; doanh nghiệp bị phạt gấp 02 lần (Điều 7 khoản 1; Điều 18 không nằm trong ngoại lệ). tldr/Nói dễ hiểu ghi \"bị phạt 1.000.000 đến 2.000.000 đồng\" không kèm điều kiện \"01 đến 10 người\" và không nói gấp đôi."
  - text: "Các bậc phạt còn lại: 11-50 người 2-5 triệu; 51-100 người 5-10 triệu; 101-300 người 10-15 triệu; từ 301 người 15-20 triệu (Điều 18 khoản 2 b-đ)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "partial"
    quote: "b) Từ 2.000.000 đồng đến 5.000.000 đồng đối với vi phạm từ 11 người đến 50 người lao động; […] c) Từ 5.000.000 đồng đến 10.000.000 đồng đối với vi phạm từ 51 người đến 100 người lao động; […] d) Từ 10.000.000 đồng đến 15.000.000 đồng đối với vi phạm từ 101 người đến 300 người lao động; […] đ) Từ 15.000.000 đồng đến 20.000.000 đồng đối với vi phạm từ 301 người lao động trở lên."
    note: "Số khớp từng bậc. Cùng vấn đề: thiếu câu gấp đôi cho tổ chức."
  - text: "Biện pháp buộc hoàn thành thủ tục xác nhận và trả lại giấy tờ đã giữ (Điều 18 khoản 4 điểm b)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "match"
    quote: "b) Buộc người sử dụng lao động hoàn thành thủ tục xác nhận và trả lại những giấy tờ khác đã giữ của người lao động cho người lao động"
  - text: "Buộc trả đủ trợ cấp thôi việc/mất việc cùng tiền lãi theo lãi suất tiền gửi không kỳ hạn cao nhất của NHTM nhà nước tại thời điểm xử phạt (Điều 18 khoản 4 điểm a)"
    source_url: "https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm"
    verdict: "match"
    quote: "a) Buộc người sử dụng lao động trả đủ tiền trợ cấp thôi việc hoặc trợ cấp mất việc làm cho người lao động cộng với khoản tiền lãi của số tiền chưa trả tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt"
    note: "Điểm a áp dụng cho hành vi không trả/trả không đủ trợ cấp, không phải cho ba việc ở Điều 48 khoản 3; mục đặt dưới \"Biện pháp buộc phải làm\" của mục này nên dễ bị hiểu nhầm là biện pháp của cùng hành vi."
  - text: "Thời hiệu: hòa giải 6 tháng, trọng tài 9 tháng, tòa án 1 năm (Điều 190)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "match"
    quote: "1. Thời hiệu yêu cầu hòa giải viên lao động thực hiện hòa giải tranh chấp lao động cá nhân là 06 tháng kể từ ngày phát hiện ra hành vi […] 2. Thời hiệu yêu cầu Hội đồng trọng tài lao động giải quyết tranh chấp lao động cá nhân là 09 tháng kể từ ngày phát hiện ra hành vi […] 3. Thời hiệu yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân là 01 năm kể từ ngày phát hiện ra hành vi"
    note: "tldr/Nói dễ hiểu chỉ nói \"Kiện trong 1 năm\"."
  - text: "\"Luật cũng không buộc giấy đó phải ghi lý do thôi việc\"; không có mẫu \"giấy xác nhận thôi việc\" chung"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "inference"
    quote: "Điều 45. Thông báo chấm dứt hợp đồng lao động […] 1. Người sử dụng lao động phải thông báo bằng văn bản cho người lao động về việc chấm dứt hợp đồng lao động khi hợp đồng lao động chấm dứt theo quy định của Bộ luật này, trừ trường hợp quy định tại các khoản 4, 5, 6, 7 và 8 Điều 34 của Bộ luật này."
    note: "Điều 48 khoản 3 thực sự không nói tới giấy ghi lý do/mẫu, nhưng Điều 45 khoản 1 buộc NSDLĐ thông báo bằng văn bản về việc chấm dứt hợp đồng (NĐ 283 Điều 18 khoản 1 phạt 1-3 triệu nếu không thông báo). Mục không nhắc nghĩa vụ này. Khẳng định \"luật không buộc ghi lý do\" là suy ra từ sự im lặng của Điều 48; không có điều khoản nào bác bỏ, nhưng cũng không có chữ nào xác nhận."
  - text: "Không chốt được thời gian đóng bảo hiểm thất nghiệp thì hồ sơ hưởng trợ cấp thất nghiệp bị treo (Chi phí)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "not-found"
    note: "Không có điều khoản nào trong nguồn được dẫn nói điều này; đây là khẳng định thực tiễn không có cơ sở trích dẫn. Luật Việc làm 74/2025 (không được dẫn) mới là nơi quy định hồ sơ."
  - text: "Ký biên bản \"đã nhận đủ, không thắc mắc gì\" trước khi nhận tiền là \"tự bỏ mốc thời gian đó\" (Bẫy 3)"
    source_url: "https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf"
    verdict: "inference"
    note: "Luật không có quy định về hệ quả pháp lý của biên bản ký như vậy; đây là lời khuyên phòng ngừa hợp lý nhưng không có căn cứ trích dẫn."

    - Luật BHXH 41/2024/QH15 (Điều 139, hiệu lực 01/7/2025)
    - Nghị định 128/2025/NĐ-CP và 129/2025/NĐ-CP (phân định thẩm quyền hai cấp, hiệu lực 01/7/2025, theo nguồn thứ cấp tcnnld.vn; chưa mở toàn văn)
  basis: "Luật 84/2015/QH13: bản hợp nhất 14/VBHN-VPQH ngày 16/9/2024 (Công báo 1171+1172 ngày 29/10/2024) có chú thích sửa đổi bởi Luật BHXH 41/2024/QH15 hiệu lực 01/7/2025. Trang Công báo của Luật gốc để trống ô 'Ngày hết hiệu lực' và mục sửa đổi, nên không dùng làm bằng chứng. Tìm kiếm thứ cấp (tháng 11/2026) cho thấy dự án Luật ATVSLĐ sửa đổi mới được Chính phủ trình Quốc hội ngày 21/10/2026, chưa thấy văn bản thông qua; chưa mở được vbpl.vn/văn bản hợp nhất mới hơn 14/VBHN. Nghị định 39/2016: trang Công báo trống ô hết hiệu lực; nguồn thứ cấp cho biết vẫn áp dụng nhưng phần cơ quan tiếp nhận đã đổi theo ND 128/129/2025. ND 283/2026: trang Công báo ghi ban hành 15/07/2026, hiệu lực 10/09/2026, mục Lược đồ không có văn bản thay thế/sửa đổi; chưa đủ để khẳng định."
deliberate_vn_deviation: []
potential_harm:
  - 'steps[0] và tldr ("Đưa người bị nạn đi cấp cứu trước") không nói gọi 115, không có sơ cứu và không có cảnh báo di chuyển: làm đúng nguyên văn có thể khiến đồng nghiệp tự chở người nghi chấn thương cột sống, bị mắc kẹt, điện giật hoặc chảy máu nhiều đi bằng xe cá nhân, làm nặng thêm hoặc chậm cứu chữa. (Đánh giá dựa trên nguyên tắc sơ cứu chung; chưa đối chiếu hướng dẫn Bộ Y tế/Hội Chữ thập đỏ trong lượt kiểm này.)'
  - Chỉ dẫn khai báo tới "Thanh tra Sở LĐTBXH" và "Công an cấp huyện" có thể đưa người đọc tới cơ quan không còn tồn tại hoặc không còn chức năng này, làm chậm khai báo vụ chết người.
suggested_edits:
  - 'tldr, Nói dễ hiểu, Pháp luật VN: thay "Thanh tra Sở Lao động - Thương binh và Xã hội" bằng "cơ quan quản lý nhà nước về lao động cấp tỉnh (nhiều nơi nay là Sở Nội vụ)" và "Công an cấp huyện" bằng "Công an nơi xảy ra tai nạn (từ 01/7/2025 là Công an cấp xã theo Nghị định 129/2025/NĐ-CP)"; mở toàn văn Nghị định 129/2025 để trích Điều 42 trước khi sửa.'
  - 'steps[0]: thêm "Gọi 115 ngay; làm theo hướng dẫn của tổng đài. Không di chuyển người nghi chấn thương cột sống/bị mắc kẹt/điện giật khi chưa an toàn, trừ khi hiện trường còn nguy hiểm" và đối chiếu hướng dẫn sơ cứu của Bộ Y tế hoặc Hội Chữ thập đỏ.'
  - "Pháp luật VN, khoản khai báo: thêm điểm c và d Điều 34.1 (luật chuyên ngành; người lao động không theo hợp đồng lao động khai báo cho UBND cấp xã)."
  - 'Chi phí và Bồi thường: thêm điều kiện mở đầu Điều 38.4 ("không hoàn toàn do lỗi của chính người này") và một câu về Điều 40 khoản 1 (ba trường hợp không được hưởng).'
  - "Hạn điều tra: ghi gia hạn chỉ áp dụng cho mốc 07, 20, 30/60 ngày khi có tình tiết phức tạp (Điều 35.6)."
  - 'Điều 31.1 ND 283/2026: sửa "nguy cơ hoặc tai nạn" thành "nguy cơ xảy ra sự cố kỹ thuật, tai nạn lao động hoặc bệnh nghề nghiệp"; ghi rõ Điều 31.3 là phạt thống kê/báo cáo định kỳ.'
  - Bỏ hoặc gắn nhãn "suy ra" cho câu "khoản chênh lệch đó không đòi lại được nếu biên bản ghi tự nguyện" (Bẫy 3) và "giấy ra viện là chứng cứ đầu tiên" (Bẫy 2).
  - Xóa "Điều 9" khỏi mục Nguồn hoặc đưa vào thân bài.

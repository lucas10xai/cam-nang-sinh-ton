suggested_edits:
  - "tldr và Nói dễ hiểu: thay 'tối đa 03 tháng lương, không quá 30% lương tháng' bằng 'thiệt hại không nghiêm trọng do sơ suất, giá trị không quá 10 tháng lương tối thiểu vùng thì bồi thường nhiều nhất 03 tháng lương; mỗi tháng chỉ khấu trừ không quá 30% lương thực trả. Mất hoặc hỏng nặng thì bồi thường theo Điều 129' (dựa quote Điều 129 khoản 1 đoạn 2 và khoản 2)."
  - "Nói dễ hiểu: bỏ hoặc đổi 'Điều khoản phạt vi phạm trong hợp đồng không có hiệu lực' thành 'Phạt tiền, cắt lương thay xử lý kỷ luật là hành vi bị cấm (Điều 127 khoản 2)'; bỏ cụm 'không có hiệu lực' vì không có chữ nguồn."
  - "Thống nhất cách đếm: ghi 'bốn khoản được đòi: bồi thường hư hỏng/mất tài sản (Điều 129), chi phí đào tạo (Điều 62), bí mật kinh doanh (Điều 21 khoản 2), bồi thường khi tự nghỉ trái luật (Điều 40)' hoặc sửa tiêu đề; đổi 'Hai chỗ duy nhất' cho khớp."
  - "Bẫy 1: bổ sung 'Điều 40 khoản 3: phải hoàn trả chi phí đào tạo nếu có hợp đồng đào tạo' và đổi 'Khoản 2 Điều 127 cấm đúng hình thức đó' thành 'điều khoản này có thể thuộc diện bị cấm theo Điều 127 khoản 2 nếu bị dùng thay xử lý kỷ luật'."
  - "Thay 'nộp đơn tới thanh tra lao động' bằng cơ quan có tên trong Nghị định 283/2026 (Sở Nội vụ, UBND cấp xã/tỉnh) hoặc 'cơ quan quản lý lao động ở địa phương'."
  - "Thêm vào đối chiếu chi phí đào tạo: phải có hợp đồng đào tạo nghề bằng văn bản và chi phí 'có chứng từ hợp lệ' (Điều 62 khoản 1, 3)."

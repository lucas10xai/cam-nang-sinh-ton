  - text: "Hợp đồng đào tạo nghề: chi phí đào tạo và trách nhiệm hoàn trả là nội dung buộc phải có (Điều 62)"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm

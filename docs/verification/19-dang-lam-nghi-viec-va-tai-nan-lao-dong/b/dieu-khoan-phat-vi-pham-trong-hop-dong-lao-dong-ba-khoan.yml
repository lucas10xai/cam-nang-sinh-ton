  - text: "Khấu trừ hằng tháng không quá 30% tiền lương thực trả sau khi trừ BH bắt buộc và thuế TNCN"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "3. Mức khấu trừ tiền lương hằng tháng không được quá 30% tiền lương thực trả hằng tháng của người lao động sau khi trích nộp các khoản bảo hiểm xã hội bắt buộc, bảo hiểm y tế, bảo hiểm thất nghiệp, thuế thu nhập cá nhân."
    verdict: match
    note: "Điều 102 khoản 3."
  - text: "Thiệt hại không nghiêm trọng do sơ suất, giá trị không quá 10 tháng lương tối thiểu vùng: bồi thường nhiều nhất 03 tháng lương"
    source_url: https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-18-vbhn-vpqh-468971.htm
    quote: "Trường hợp người lao động gây thiệt hại không nghiêm trọng do sơ suất với giá trị không quá 10 tháng lương tối thiểu vùng do Chính phủ công bố được áp dụng tại nơi người lao động làm việc thì người lao động phải bồi thường nhiều nhất là 03 tháng tiền lương và bị khấu trừ hằng tháng vào lương theo quy định tại khoản 3 Điều 102 của Bộ luật này."
    verdict: partial
    note: "Điều 129 khoản 1 đoạn 2 khớp. Nhưng tldr/Nói dễ hiểu ('chỉ ba khoản được đòi', 'bồi thường hỏng dụng cụ, tối đa 03 tháng lương, không quá 30% lương tháng') nói như mức 03 tháng là trần chung. Thực tế đoạn 1 khoản 1 và khoản 2 Điều 129 cho phép bồi thường theo quy định pháp luật/nội quy, mất tài sản bồi thường 'một phần hoặc toàn bộ theo thời giá thị trường' - trần 03 tháng chỉ áp cho thiệt hại không nghiêm trọng do sơ suất và dưới 10 tháng lương tối thiểu vùng. Người đọc có thể tưởng mọi khoản bồi thường bị khóa ở 03 tháng. Mục có nêu điều kiện ở phần Chi phí và Bẫy 2 nhưng không ở tldr."
  - text: "NLĐ tự nghỉ trái luật: mất trợ cấp thôi việc, bồi thường nửa tháng lương + lương những ngày không báo trước, hoàn trả chi phí đào tạo (Điều 40)"

suggested_edits:
  - "Pháp luật VN, mục 'Người sử dụng lao động đơn phương' bullet thứ 3: sửa thành 'Không phải báo trước chỉ khi người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 31 (điểm d) hoặc tự ý bỏ việc 05 ngày làm việc liên tục (điểm e); trường hợp đủ tuổi nghỉ hưu (điểm đ) vẫn phải báo trước theo khoản 2' (Điều 36 khoản 2, 3)."
  - "Chi phí và tldr: bỏ trợ cấp thôi việc khỏi danh sách 'khoản mất' khi nghỉ theo Điều 35; ghi rõ 'xin nghỉ đúng luật vẫn được trợ cấp thôi việc (Điều 46 khoản 1, khoản 9 Điều 34), nhưng mất cơ hội Điều 41 (>= 02 tháng lương) và, nếu thực chất bị cắt giảm theo Điều 42/43, mất trợ cấp mất việc làm Điều 47'."
  - "Bẫy 1: thêm điều kiện 'nếu việc mất việc thuộc Điều 42, 43' trước câu về Điều 47; gắn nhãn 'suy ra' cho 'mất cửa Điều 41'."
  - "Điều 35 khoản 2: thêm các ngoại lệ 'trừ Điều 29', 'trừ khoản 4 Điều 97', 'trừ thỏa thuận khác' (nghỉ hưu), 'cưỡng bức lao động'; bỏ cụm 'hai tháng' hoặc dẫn nguồn."
  - "Step 1: giữ lời khuyên 'yêu cầu văn bản thông báo' (Điều 45 khoản 1), tách 'ghi rõ lý do và ngày hiệu lực' thành lời khuyên thực hành, không viện dẫn Điều 45."
  - "Chi phí: bỏ hoặc dẫn nguồn cho 'tiền tư vấn và án phí ... lớn hơn khoản đang tranh'; thống nhất với mục 06."
  - "Mức phạt: nêu mức tiền cho Điều 18 khoản 2 (1.000.000-2.000.000 đồng với 1-10 NLĐ) và ghi 'doanh nghiệp gấp đôi (Điều 7 khoản 1)'. Trợ cấp thôi việc: thêm 'trừ thời gian đã đóng BHTN' (Điều 46 khoản 2)."

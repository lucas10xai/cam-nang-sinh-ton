suggested_edits:
  - 'tldr và tiêu đề: đổi "chỉ qua ba cửa" thành "ba đường thường gặp" hoặc nêu đủ: Điều 36 khoản 1 (a–g), sa thải (Điều 125), cho thôi việc vì cơ cấu/kinh tế (Điều 42) và vì chia tách, sáp nhập, bán, cho thuê (Điều 43).'
  - 'Step 3 và Bẫy 3: thêm điều kiện "khi ảnh hưởng đến việc làm của nhiều người lao động" (Điều 42 khoản 3, 4) cho phương án sử dụng lao động và "khi không thể giải quyết được việc làm" (Điều 42 khoản 5) cho trợ cấp mất việc làm.'
  - 'Step 2/Bẫy 2: ghi rõ phạm vi "Điều 37 là hạn chế quyền đơn phương chấm dứt theo Điều 36" và không khẳng định áp dụng cho cho-thôi-việc theo Điều 42 khi chưa có căn cứ; hoặc tách lời khuyên.'
  - 'Chi phí: sửa báo trước thành "45 / 30 / 03 ngày làm việc tùy loại hợp đồng; riêng ốm dài (điểm b) luôn 03 ngày làm việc" (Điều 36 khoản 2 điểm c).'

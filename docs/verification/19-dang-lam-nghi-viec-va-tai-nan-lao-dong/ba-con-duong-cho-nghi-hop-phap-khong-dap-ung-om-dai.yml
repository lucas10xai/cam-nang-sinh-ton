  - text: "Điểm c: thiên tai, hỏa hoạn, dịch bệnh nguy hiểm, địch họa hoặc di dời, thu hẹp sản xuất theo yêu cầu cơ quan nhà nước, đã tìm mọi biện pháp vẫn buộc phải giảm chỗ làm việc"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf

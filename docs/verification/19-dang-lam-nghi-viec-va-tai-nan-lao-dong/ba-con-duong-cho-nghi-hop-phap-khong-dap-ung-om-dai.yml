    note: Điều 36 khoản 1 có bảy trường hợp (a–g), không chỉ a, b, c; còn có sa thải (Điều 34 khoản 8, Điều 125), hết hạn, thỏa thuận (Điều 34). "Chỉ qua ba cửa" là nói quá. Điều 34 khoản 11 (Điều 42–43) cũng gồm chia tách, sáp nhập, bán, cho thuê (thân bài chỉ nhắc ở "mất việc").
  - text: Báo trước 45 ngày (không xác định thời hạn), 30 ngày (12–36 tháng), 3 ngày làm việc (dưới 12 tháng và trường hợp điểm b khoản 1); miễn báo trước cho điểm d, e
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: a) Ít nhất 45 ngày đối với hợp đồng lao động không xác định thời hạn; b) Ít nhất 30 ngày đối với hợp đồng lao động xác định thời hạn có thời hạn từ 12 tháng đến 36 tháng; c) Ít nhất 03 ngày làm việc đối với hợp đồng lao động xác định thời hạn có thời hạn dưới 12 tháng và đối với trường hợp quy định tại điểm b khoản 1 Điều này; | Khi đơn phương chấm dứt hợp đồng lao động quy định tại điểm d và điểm e khoản 1 Điều này thì người sử dụng lao động không phải báo trước cho người lao động.
    verdict: match
    note: BLLĐ Điều 36 khoản 2, 3. Khoản 2 áp dụng cho điểm a, b, c, đ, g; điểm b luôn 03 ngày làm việc bất kể loại hợp đồng, nên câu Chi phí "45 ngày với hợp đồng không xác định thời hạn" không áp dụng cho ốm dài.
  - text: "Những lúc bị cấm đơn phương chấm dứt: đang điều trị, điều dưỡng theo chỉ định (trừ điểm b); nghỉ hằng năm, nghỉ việc riêng, nghỉ khác được đồng ý; nữ mang thai, nghỉ thai sản hoặc nuôi con dưới 12 tháng"
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Người lao động ốm đau hoặc bị tai nạn, bệnh nghề nghiệp đang điều trị, điều dưỡng theo chỉ định của cơ sở khám bệnh, chữa bệnh có thẩm quyền, trừ trường hợp quy định tại điểm b khoản 1 Điều 36 của Bộ luật này. 2. Người lao động đang nghỉ hằng năm, nghỉ việc riêng và trường hợp nghỉ khác được người sử dụng lao động đồng ý. 3. Người lao động nữ mang thai; người lao động đang nghỉ thai sản hoặc nuôi con dưới 12 tháng tuổi.

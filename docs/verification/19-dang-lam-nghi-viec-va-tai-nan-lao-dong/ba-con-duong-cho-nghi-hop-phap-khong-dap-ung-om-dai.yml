  - text: "Điểm b: ốm đau, tai nạn điều trị 12 tháng liên tục (hợp đồng không xác định thời hạn), 06 tháng liên tục (12–36 tháng), quá nửa thời hạn (dưới 12 tháng), mà khả năng lao động chưa hồi phục"

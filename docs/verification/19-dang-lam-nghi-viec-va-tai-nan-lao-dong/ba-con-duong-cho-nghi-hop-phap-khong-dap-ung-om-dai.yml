  - issue: 'Step 3 và Bẫy 3 đòi "phương án sử dụng lao động" và coi việc không có phương án là thiếu sót cho mọi vụ cho thôi vì cơ cấu; Điều 42 khoản 3, 4 chỉ buộc phương án khi ảnh hưởng đến việc làm của "nhiều người lao động" (kinh tế: "nhiều người lao động có nguy cơ mất việc làm"). Điều 42 khoản 5 (trợ cấp mất việc) chỉ khi "không thể giải quyết được việc làm". Thiếu điều kiện có thể gây hiểu sai.'

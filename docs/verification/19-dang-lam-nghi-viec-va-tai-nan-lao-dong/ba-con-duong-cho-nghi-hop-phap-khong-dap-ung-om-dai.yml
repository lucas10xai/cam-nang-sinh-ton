  - text: Thay đổi cơ cấu, công nghệ gồm ... lý do kinh tế gồm khủng hoảng/suy thoái; chính sách pháp luật khi cơ cấu lại kinh tế hoặc cam kết quốc tế
    source_url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/3/5/468971-1772684381_v1_1772690833_signed.pdf
    quote: Thay đổi cơ cấu tổ chức, tổ chức lại lao động; ... Thay đổi quy trình, công nghệ, máy móc, thiết bị sản xuất, kinh doanh gắn với ngành, nghề sản xuất, kinh doanh của người sử dụng lao động; c) Thay đổi sản phẩm hoặc cơ cấu sản phẩm. ... Khủng hoảng hoặc suy thoái kinh tế; Thực hiện chính sách, pháp luật của Nhà nước khi cơ cấu lại nền kinh tế hoặc thực hiện cam kết quốc tế.

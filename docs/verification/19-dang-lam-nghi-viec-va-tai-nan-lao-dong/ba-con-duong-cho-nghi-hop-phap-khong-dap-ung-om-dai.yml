  - issue: Step 2/Bẫy 2 áp Điều 37 (không được đơn phương chấm dứt khi đang điều trị, nghỉ phép, mang thai/nuôi con dưới 12 tháng) cho mọi "quyết định chấm dứt"; Điều 37 là hạn chế của quyền đơn phương theo Điều 36, mục không nói rõ phạm vi (không chứng minh áp dụng cho cho-thôi-việc theo Điều 42).
    severity: warn
  - issue: 'Chi phí: "45 ngày với hợp đồng không xác định thời hạn, 30 ngày ... 3 ngày làm việc ... dưới 12 tháng" quên rằng với điểm b (ốm dài) báo trước luôn 03 ngày làm việc (Điều 36 khoản 2 điểm c); thân bài có ghi đúng, tldr cũng chung chung.'
    severity: warn
  - issue: "legal_refs dẫn NĐ 145 Điều 8 khoản 1, 2 nhưng thân bài không dùng NĐ 145; nguồn thứ ba (NĐ 145) nên bỏ hoặc nêu cách dùng (lý do chính đáng khi bỏ việc: Điều 8 khoản 1 điểm b dẫn Điều 125 khoản 4)."
    severity: warn
  - issue: Số liệu tldr/steps (12, 6 tháng; 45, 30, 3 ngày; 30 ngày; 12 tháng tuổi) có trong thân và khớp nhau; legal_refs url đúng văn bản. Mốc 05 ngày liên tục (Điều 36 điểm e) và 05/30, 20/365 (Điều 125) đã tách rõ, không mâu thuẫn. Mục 04 (cùng chương) viết Điều 42/43 và mức phạt Điều 18 khoản 2, không mâu thuẫn với mục 05.
    severity: warn

suggested_edits:
  - 'Tiêu đề: thay "khi đó là người cấp cứu" bằng "khi đó là người bệnh đi cấp cứu" (Điều 33 khoản 1 điểm a).'
  - 'Nói dễ hiểu/tldr: thêm cụm "ngoài người lái" hoặc nói "chỉ chở một người ngồi sau" nếu đó là cách đếm đúng; hiện nguồn chỉ ghi "chỉ được chở một người" nên cân nhắc giữ nguyên chữ luật và nêu "chở theo 02 người/03 người" như NĐ 168.'
  - 'Ghi chú "Chưa rõ: hai người ngồi sau": giữ, nhưng nên viết đúng vào "tối đa hai người" (Điều 33 khoản 1) thay vì "hai người ngồi sau".'

claims:
  - text: Điểm GPLX gồm 12 điểm, cập nhật vào CSDL ngay sau khi quyết định xử phạt có hiệu lực
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: 1. Điểm của giấy phép lái xe được dùng để quản lý việc chấp hành pháp luật về trật tự, an toàn giao thông đường bộ của người lái xe trên hệ thống cơ sở dữ liệu về trật tự, an toàn giao thông đường bộ, bao gồm 12 điểm.
    verdict: match
    note: 'Điều 58 khoản 1. Câu "cập nhật ... ngay sau khi quyết định xử phạt có hiệu lực thi hành" nằm cùng khoản: "Dữ liệu về điểm trừ giấy phép lái xe của người vi phạm sẽ được cập nhật vào hệ thống cơ sở dữ liệu ngay sau khi quyết định xử phạt có hiệu lực thi hành". Đối chiếu bản chinhphu.vn.'
  - text: Chưa hết điểm và 12 tháng không bị trừ thì phục hồi đủ 12 điểm
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: 2. Giấy phép lái xe chưa bị trừ hết điểm và không bị trừ điểm trong thời hạn 12 tháng từ ngày bị trừ điểm gần nhất thì được phục hồi đủ 12 điểm.
    verdict: match
    note: Điều 58 khoản 2.
  - text: Hết điểm thì không được lái; sau ít nhất 06 tháng được thi kiến thức pháp luật, đạt thì phục hồi 12 điểm
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: 3. Trường hợp giấy phép lái xe bị trừ hết điểm thì người có giấy phép lái xe không được điều khiển phương tiện tham gia giao thông đường bộ theo giấy phép lái xe đó. Sau thời hạn ít nhất là 06 tháng kể từ ngày bị trừ hết điểm, người có giấy phép lái xe được tham gia kiểm tra nội dung kiến thức pháp luật về trật tự, an toàn giao thông đường bộ theo quy định tại khoản 7 Điều 61 của Luật này do lực lượng Cảnh sát giao thông tổ chức, có kết quả đạt yêu cầu thì được phục hồi đủ 12 điểm.
    verdict: match
    note: Điều 58 khoản 3.
  - text: Bằng đổi/cấp lại/nâng hạng giữ nguyên số điểm
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: 4. Giấy phép lái xe sau khi đổi, cấp lại, nâng hạng được giữ nguyên số điểm của giấy phép lái xe trước khi đổi, cấp lại, nâng hạng.
    verdict: match
    note: Điều 58 khoản 4.
  - text: "Mức trừ điểm: 2 điểm (chở từ 3 người, ngược chiều đường một chiều), 4 điểm, 6 điểm, 10 điểm"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: a) Thực hiện hành vi quy định tại điểm b khoản 3; khoản 5; điểm b, điểm c, điểm d khoản 6; điểm a khoản 7 Điều này bị trừ điểm giấy phép lái xe 02 điểm; b) Thực hiện hành vi quy định tại điểm đ khoản 4; điểm a khoản 6; điểm c, điểm d, điểm đ khoản 7; điểm a khoản 8 Điều này bị trừ điểm giấy phép lái xe 04 điểm; c) Thực hiện hành vi quy định tại điểm b khoản 7, điểm c khoản 9 Điều này bị trừ điểm giấy phép lái xe 06 điểm; d) Thực hiện hành vi quy định tại điểm b khoản 8, khoản 10 Điều này bị trừ điểm giấy phép lái xe 10 điểm.
    verdict: match
    note: "Điều 7 khoản 13 điểm a-d. Đối chiếu: điểm b khoản 3 = chở từ 03 người (2 điểm); điểm a khoản 7 = ngược chiều/vỉa hè (2); điểm đ khoản 4 = dùng ô, điện thoại (4); điểm c khoản 7 = đèn tín hiệu (4); điểm a khoản 8 = quá tốc độ trên 20 km/h (4); điểm b khoản 7 = đường cao tốc (6); điểm b khoản 8 = nồng độ cồn 50-80 mg (10). Mọi ví dụ trong mục khớp."
  - text: "Chở hai người (ngoài ngoại lệ), không đội mũ/không cài quai, đỗ xe sai: phạt 400.000-600.000 nhưng không có trong danh sách trừ điểm"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: d) Dừng xe, đỗ xe ở lòng đường gây cản trở giao thông; ... g) Chở theo 02 người trên xe, trừ trường hợp ...; h) Không đội "mũ bảo hiểm cho người đi mô tô, xe máy" ... ; i) Chở người ngồi trên xe không đội "mũ bảo hiểm cho người đi mô tô, xe máy" ...
    verdict: match
    note: Điều 7 khoản 2 điểm d, e, g, h, i (khoản 2 không có trong danh sách khoản 13; khoản 13 chỉ liệt kê điểm b khoản 3; khoản 5; ... như trích ở claim 5). Trích rút gọn bằng "..." giữa các điểm liền kề.
  - text: Lái xe bằng đã hết điểm phạt như không có bằng, 2.000.000-4.000.000 đồng với xe đến 125 cm³
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: a) Không có giấy phép lái xe hoặc sử dụng giấy phép lái xe đã bị trừ hết điểm hoặc sử dụng giấy phép lái xe không do cơ quan có thẩm quyền cấp, giấy phép lái xe bị tẩy xóa, giấy phép lái xe không còn hiệu lực, giấy phép lái xe không phù hợp với loại xe đang điều khiển;
    verdict: match
    note: "Điều 18 khoản 5 điểm a (khoản 5 mức 2-4 triệu, xe mô tô hai bánh đến 125 cm³ hoặc điện đến 11 kW). Xe trên 125 cm³: 6-8 triệu (khoản 7 điểm b) — mục không nêu, không gây hại."
  - text: 'Cách tra điểm: "chưa đọc được hướng dẫn chi tiết"'
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: đồng thời cập nhật thông tin về giấy phép lái xe bị trừ điểm trên Trang thông tin điện tử của Cục Cảnh sát giao thông.
    verdict: partial
    note: 'Điều 50 khoản 1 điểm b NĐ 168 (trong đoạn về thông báo trừ điểm): thông báo qua "tài khoản của công dân đăng ký trên Cổng dịch vụ công, Ứng dụng giao thông trên thiết bị di động" và cập nhật trên Trang thông tin điện tử của Cục CSGT. Mục nói chưa có hướng dẫn tra cứu và chỉ nhắc hỏi đơn vị cấp bằng/CSGT: có nguồn để bổ sung (trang Cục CSGT, cổng dịch vụ công, ứng dụng giao thông).'
internal_checks:
  - issue: 'Bước 1 "Coi điểm bị trừ ngay khi quyết định xử phạt có hiệu lực, không phải khi nộp phạt" khớp Điều 58 khoản 1. Tuy nhiên "Bẫy 1: nộp phạt xong là hết" và bước 1 là diễn giải; "không phải khi nộp phạt" không phải chữ của luật (suy ra từ "có hiệu lực thi hành"). Chấp nhận, ghi warn.'
    severity: warn
  - issue: 'Chi phí: "mất ít nhất 6 tháng không được lái xe theo bằng đó" đúng; nhưng "Ghi chú: Số điểm cho từng lỗi cụ thể trong nghị định có thể đã đổi sau các văn bản sửa đổi" là lời cảnh báo mơ hồ, không nêu văn bản sửa đổi nào; không mâu thuẫn số.'
    severity: warn
  - issue: Các số trong tldr (12 điểm, 12 tháng, 6 tháng) có trong thân và khớp Điều 58. Con số 2-4-6-10 điểm nhất quán với mục 2 (2 điểm chở ba người) và mục 5 (2/4/6 điểm). Không mâu thuẫn trong chương.
    severity: warn
  - issue: Điều 58 khoản 1 viết "Điểm của giấy phép lái xe ... bao gồm 12 điểm" nhưng mục dùng "Bằng lái có 12 điểm"; chấp nhận cách nói thường.
    severity: warn
  - issue: "legal_refs: URL vbpl.vn đúng văn bản (Luật 36), chỉ trả khung; URL NĐ 168 đúng văn bản. Điều 7 khoản 13 và Điều 18 khoản 5 điểm a khớp khẳng định."
    severity: warn
validity:
  doc: Luật 36/2024/QH15 (Điều 58) và Nghị định 168/2024/NĐ-CP (Điều 7 khoản 13, Điều 18)
  in_force: unconfirmed
  effective_from: 2025-01-01
  amended_by: []
  basis: 'Điều 53 khoản 1 Nghị định 168: "Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2025". Chưa tìm được văn bản chính thống nêu 168 hết hiệu lực hay còn nguyên Điều 7/18. Có Nghị định 336/2025/NĐ-CP (22/12/2025, hiệu lực 01/03/2026) mà bản tóm tắt chinhphu.vn nói "bãi bỏ một số điều, khoản, điểm" của NĐ 100/2019 "được sửa đổi, bổ sung bởi" NĐ 123/2021 và NĐ 168/2024; PDF toàn văn của 336 là ảnh quét (không trích được chữ), bản thuvienphapluat bị chặn 403, nên không xác định được 336 có đụng tới Điều 7/18 của NĐ 168 hay không. Không kết luận còn hiệu lực chỉ vì không thấy văn bản thay thế. Luật: Điều 90 khoản 1 hiệu lực 01/01/2025. Điều 58 khoản 6 giao Chính phủ "quy định lộ trình thực hiện Điều này"; chưa kiểm tra lộ trình đó.'

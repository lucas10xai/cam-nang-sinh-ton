suggested_edits:
  - 'Mục Ghi chú "Chưa rõ: cách tra điểm": thay bằng "Thông báo trừ điểm và cập nhật điểm được thực hiện qua tài khoản đăng ký trên Cổng dịch vụ công, ứng dụng giao thông trên thiết bị di động và trang thông tin điện tử của Cục Cảnh sát giao thông (Điều 50 khoản 1 điểm b, NĐ 168/2024/NĐ-CP)". Quote: "thông báo trừ điểm giấy phép lái xe thực hiện bằng văn bản ... hoặc thực hiện thông báo bằng phương thức điện tử thông qua tài khoản của công dân đăng ký trên Cổng dịch vụ công, Ứng dụng giao thông trên thiết bị di động".'
  - 'Mục Ghi chú cuối: câu "có thể đã đổi sau các văn bản sửa đổi" nên nêu cụ thể hoặc bỏ; đối chiếu thêm Nghị định 336/2025/NĐ-CP (hiệu lực 01/03/2026) xem có đụng Điều 7 NĐ 168 không.'
  - 'legal_refs: thêm "Điều 51 khoản 2 NĐ 168" (tự động phục hồi 12 điểm sau 12 tháng) làm nguồn trực tiếp cho thủ tục phục hồi.'

claims:
  - text: Hạng A1 cấp cho xe mô tô hai bánh đến 125 cm³ hoặc điện đến 11 kW
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: a) Hạng A1 cấp cho người lái xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW;
    verdict: match
    note: Điều 57 khoản 1 điểm a. Đối chiếu qua bản toàn văn Luật 36/2024/QH15 trên xaydungchinhsach.chinhphu.vn (Cổng TTĐT Chính phủ), nguồn chính thống trích được chữ; trang vbpl.vn ở mục Nguồn chỉ trả khung, không trích được nội dung.
  - text: Hạng A cấp cho xe trên 125 cm³ hoặc điện trên 11 kW và lái được xe hạng A1
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: b) Hạng A cấp cho người lái xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 hoặc có công suất động cơ điện trên 11 kW và các loại xe quy định cho giấy phép lái xe hạng A1;
    verdict: match
    note: Điều 57 khoản 1 điểm b. Đối chiếu qua bản toàn văn Luật 36/2024/QH15 trên xaydungchinhsach.chinhphu.vn (Cổng TTĐT Chính phủ), nguồn chính thống trích được chữ; trang vbpl.vn ở mục Nguồn chỉ trả khung, không trích được nội dung.
  - text: Bằng A1, A, B1 không có thời hạn
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: a) Giấy phép lái xe các hạng A1, A, B1 không thời hạn;
    verdict: match
    note: Điều 57 khoản 5 điểm a. Đối chiếu qua bản toàn văn Luật 36/2024/QH15 trên xaydungchinhsach.chinhphu.vn (Cổng TTĐT Chính phủ), nguồn chính thống trích được chữ; trang vbpl.vn ở mục Nguồn chỉ trả khung, không trích được nội dung.
  - text: Đủ 18 tuổi mới được cấp bằng A1, A
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: b) Người đủ 18 tuổi trở lên được cấp giấy phép lái xe hạng A1, A, B1, B, C1,
    verdict: match
    note: Điều 59 khoản 1 điểm b. Đối chiếu qua bản toàn văn Luật 36/2024/QH15 trên xaydungchinhsach.chinhphu.vn (Cổng TTĐT Chính phủ), nguồn chính thống trích được chữ; trang vbpl.vn ở mục Nguồn chỉ trả khung, không trích được nội dung.
  - text: Bằng cấp trước 01/01/2025 vẫn dùng được
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: 1. Giấy phép lái xe được cấp trước ngày Luật này có hiệu lực thi hành được tiếp tục sử dụng theo thời hạn ghi trên giấy phép lái xe.
    verdict: match
    note: Đây là khoản 1 Điều 89; mục dẫn "Điều 89 khoản 2" cho câu này (xem suggested_edits). Luật có hiệu lực 01/01/2025 (Điều 90 khoản 1).
  - text: Bằng A1 cũ (chưa đổi, cấp lại) lái xe 50 đến dưới 175 cm³ hoặc điện 4 đến dưới 14 kW
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: a) Giấy phép lái xe hạng A1 được tiếp tục điều khiển xe mô tô hai bánh có dung tích xi-lanh từ 50 cm3 đến dưới 175 cm3 hoặc có công suất động cơ điện từ 04 kW đến dưới 14 kW;
    verdict: match
    note: Điều 89 khoản 2 điểm a. Điều kiện đi kèm "chưa thực hiện đổi, cấp lại" có ở chapeau khoản 2 và có trong "Nói dễ hiểu".
  - text: Bằng A2 cũ lái xe từ 175 cm³ trở lên
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: b) Giấy phép lái xe hạng A2 được tiếp tục điều khiển xe mô tô hai bánh có dung tích xi-lanh từ 175 cm3 trở lên hoặc có công suất động cơ điện từ 14 kW trở lên và các loại xe quy định cho giấy phép lái xe hạng A1 quy định tại điểm a khoản này;
    verdict: match
    note: Điều 89 khoản 2 điểm b.
  - text: Khi đổi/cấp lại, A1 cũ thành hạng A hạn chế dưới 175 cm³ (mục không nêu)
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: a) Giấy phép lái xe hạng A1 được đổi, cấp lại sang giấy phép lái xe hạng A với điều kiện hạn chế là chỉ được điều khiển xe mô tô hai bánh có dung tích xi-lanh đến dưới 175 cm3 hoặc có công suất động cơ điện đến dưới 14 kW;
    verdict: partial
    note: Điều 89 khoản 3 điểm a. Mục nói "bằng A1 cũ ... chưa đổi hoặc cấp lại" đúng, nhưng không nói người đổi/cấp lại bằng A1 cũ sẽ nhận hạng A hạn chế (<175 cm³/<14 kW), không phải "A1 mới" (≤125 cm³). Người đọc có thể hiểu sai khi đi đổi bằng. Đề xuất bổ sung một câu.
  - text: Phạt 2.000.000-4.000.000 đồng, mô tô hai bánh đến 125 cm³ hoặc điện đến 11 kW, không có bằng/bằng hết điểm/không phù hợp loại xe
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: "5. Phạt tiền từ 2.000.000 đồng đến 4.000.000 đồng đối với người điều khiển xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW và các loại xe tương tự xe mô tô thực hiện một trong các hành vi vi phạm sau đây: a) Không có giấy phép lái xe hoặc sử dụng giấy phép lái xe đã bị trừ hết điểm hoặc sử dụng giấy phép lái xe không do cơ quan có thẩm quyền cấp, giấy phép lái xe bị tẩy xóa, giấy phép lái xe không còn hiệu lực, giấy phép lái xe không phù hợp với loại xe đang điều khiển;"
    verdict: match
    note: Điều 18 khoản 5 điểm a, NĐ 168 (bản chinhphu.vn, nguồn chính thống).
  - text: Phạt 6.000.000-8.000.000 đồng, xe trên 125 cm³ hoặc điện trên 11 kW, có bằng không phù hợp hoặc không có bằng
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: "7. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với người điều khiển xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 trở lên hoặc có công suất động cơ điện trên 11 kW, xe mô tô ba bánh thực hiện một trong các hành vi vi phạm sau đây: a) Có giấy phép lái xe nhưng không phù hợp với loại xe đang điều khiển; b) Không có giấy phép lái xe hoặc sử dụng giấy phép lái xe đã bị trừ hết điểm,"
    verdict: match
    note: Điều 18 khoản 7 điểm a, b. Khoản này gồm cả xe mô tô ba bánh (mục không nói, không gây hại).
  - text: Luật tính xe điện theo công suất động cơ (trên 11 kW là hạng A)
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-luat-trat-tu-an-toan-giao-thong-duong-bo-119240909105718285.htm
    quote: b) Hạng A cấp cho người lái xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 hoặc có công suất động cơ điện trên 11 kW
    verdict: match
    note: Điều 57 khoản 1 điểm b.
  - text: '"Nghị định 168/2024/NĐ-CP được ghi là hết hiệu lực một phần ở nguồn tôi dùng"'
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm

claims:
  - text: 'Phạt 4.000.000-6.000.000 đồng: đi ngược chiều đường một chiều hoặc biển "Cấm đi ngược chiều"; đi trên vỉa hè (trừ vào nhà, cơ quan)'
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: '7. Phạt tiền từ 4.000.000 đồng đến 6.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây: a) Đi ngược chiều của đường một chiều, đi ngược chiều trên đường có biển "Cấm đi ngược chiều", trừ hành vi vi phạm quy định tại điểm b khoản này và các trường hợp xe ưu tiên đang đi làm nhiệm vụ khẩn cấp theo quy định; điều khiển xe đi trên vỉa hè, trừ trường hợp điều khiển xe đi qua vỉa hè để vào nhà, cơ quan;'
    verdict: match
    note: Điều 7 khoản 7 điểm a.
  - text: "Phạt 4-6 triệu: đi vào đường cao tốc"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: b) Điều khiển xe đi vào đường cao tốc, trừ xe phục vụ việc quản lý, bảo trì đường cao tốc;
    verdict: match
    note: Điều 7 khoản 7 điểm b.
  - text: "Phạt 4-6 triệu: không chấp hành hiệu lệnh của đèn tín hiệu giao thông"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: c) Không chấp hành hiệu lệnh của đèn tín hiệu giao thông;
    verdict: partial
    note: Điều 7 khoản 7 điểm c. Lỗi là "không chấp hành hiệu lệnh của đèn tín hiệu" (gồm cả đèn vàng), mục chỉ nói "vượt đèn đỏ"/"dừng chờ đèn đỏ". Đúng ý nhưng thu hẹp.
  - text: "Phạt 4-6 triệu: không chấp hành hiệu lệnh người điều khiển giao thông; không nhường xe ưu tiên"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: d) Không chấp hành hiệu lệnh, hướng dẫn của người điều khiển giao thông hoặc người kiểm soát giao thông; đ) Không nhường đường hoặc gây cản trở xe được quyền ưu tiên đang phát tín hiệu ưu tiên đi làm nhiệm vụ.
    verdict: match
    note: Điều 7 khoản 7 điểm d, đ.
  - text: "Trừ 2 điểm: ngược chiều, vỉa hè (điểm a khoản 7)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: a) Thực hiện hành vi quy định tại điểm b khoản 3; khoản 5; điểm b, điểm c, điểm d khoản 6; điểm a khoản 7 Điều này bị trừ điểm giấy phép lái xe 02 điểm;
    verdict: match
    note: Điều 7 khoản 13 điểm a.
  - text: "Trừ 4 điểm: không chấp hành đèn tín hiệu, hiệu lệnh người điều khiển, không nhường xe ưu tiên"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: b) Thực hiện hành vi quy định tại điểm đ khoản 4; điểm a khoản 6; điểm c, điểm d, điểm đ khoản 7; điểm a khoản 8 Điều này bị trừ điểm giấy phép lái xe 04 điểm;
    verdict: match
    note: Điều 7 khoản 13 điểm b (điểm c, d, đ khoản 7). Mục ghi đúng điểm d, đ khoản 7 trừ 4 điểm.
  - text: "Trừ 6 điểm: vào đường cao tốc"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: c) Thực hiện hành vi quy định tại điểm b khoản 7, điểm c khoản 9 Điều này bị trừ điểm giấy phép lái xe 06 điểm;
    verdict: match
    note: Điều 7 khoản 13 điểm c.
  - text: "Phạt 6-8 triệu: quá tốc độ trên 20 km/h (trừ 4 điểm); nồng độ cồn 50-80 mg (trừ 10 điểm)"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: "8. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây: a) Điều khiển xe chạy quá tốc độ quy định trên 20 km/h; b) Điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn vượt quá 50 miligam đến 80 miligam/100 mililít máu hoặc vượt quá 0,25 miligam đến 0,4 miligam/1 lít khí thở."
    verdict: match
    note: 'Điều 7 khoản 8 điểm a, b; trừ điểm: khoản 13 điểm b (điểm a khoản 8: 4 điểm) và điểm d (điểm b khoản 8: 10 điểm), đã trích ở các claim trên (điểm d: "d) Thực hiện hành vi quy định tại điểm b khoản 8, khoản 10 Điều này bị trừ điểm giấy phép lái xe 10 điểm.").'
  - text: "Ngoại lệ: qua vỉa hè vào nhà, cơ quan; xe ưu tiên làm nhiệm vụ khẩn cấp được đi ngược chiều"
    source_url: https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-168-2024-nd-cp-quy-dinh-xu-phat-vi-pham-hanh-chinh-ve-trat-tu-atgt-duong-bo-119241231164556785.htm
    quote: trừ các trường hợp xe ưu tiên đang đi làm nhiệm vụ khẩn cấp theo quy định; điều khiển xe đi trên vỉa hè, trừ trường hợp điều khiển xe đi qua vỉa hè để vào nhà, cơ quan;
    verdict: match
    note: Điều 7 khoản 7 điểm a.

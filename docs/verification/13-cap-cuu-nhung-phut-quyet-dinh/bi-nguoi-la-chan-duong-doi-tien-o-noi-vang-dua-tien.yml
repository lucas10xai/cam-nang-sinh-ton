claims:
  - text: "Điều 168 khoản 1: dùng vũ lực/đe dọa dùng vũ lực ngay tức khắc... nhằm chiếm đoạt tài sản thì phạt tù 03-10 năm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Người nào dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản, thì bị phạt tù từ 03 năm đến 10 năm."
    verdict: match
    note: "Bản trong mục bỏ cụm “hoặc có hành vi khác”; không đổi nghĩa. PDF trích chữ được (có vài lỗi flate ở trang cuối, không ảnh hưởng Điều 168/22)."
  - text: "Điều 168 khoản 2: phạt tù 07-15 năm, gồm có tổ chức; gây thương tích 11%-30%; chiếm đoạt 50-dưới 200 triệu"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Phạm tội thuộc một trong các trường hợp sau đây, thì bị phạt tù từ 07 năm đến 15 năm: a) Có tổ chức; ... c) Gây thương tích hoặc gây tổn hại cho sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30%; d) Sử dụng vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác; đ) Chiếm đoạt tài sản trị giá từ 50.000.000 đồng đến dưới 200.000.000 đồng;"
    verdict: match
    note: "Các con số khớp. Mục viết “có hung khí” cho điểm d (luật: “vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác”) là diễn đạt gọn, chấp nhận được."
  - text: "Danh sách tình tiết khoản 2 trong mục (có hung khí, có tổ chức, thương tích 11-30%, 50-<200 triệu) nối bằng “hoặc” như thể là đầy đủ"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "e) Phạm tội đối với người dưới 16 tuổi, phụ nữ mà biết là có thai, người già yếu hoặc người không có khả năng tự vệ; g) Gây ảnh hưởng xấu đến an ninh, trật tự, an toàn xã hội; h) Tái phạm nguy hiểm."
    verdict: partial
    note: "Khoản 2 có 8 điểm (a-h), mục chỉ nêu 4 mà không nói “ví dụ”. Cũng không nêu khoản 3 (12-20 năm) và khoản 4 (18-20 năm, chung thân, kể cả “Làm chết người”). Không gây hại nhưng nên ghi “một trong các trường hợp, ví dụ”."
  - text: "Điều 22 khoản 1: chỉ là phòng vệ chính đáng khi chống trả cần thiết người đang có hành vi xâm phạm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Phòng vệ chính đáng là hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên."
    verdict: match
    note: "Mục chỉ viết “chống trả cần thiết người đang có hành vi xâm phạm”, đúng ý nhưng lược “quyền hoặc lợi ích chính đáng của mình, của người khác”."
  - text: "Điều 22 khoản 2: chống trả rõ ràng quá mức cần thiết thì vẫn phải chịu trách nhiệm hình sự"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất và mức độ nguy hiểm cho xã hội của hành vi xâm hại. Người có hành vi vượt quá giới hạn phòng vệ chính đáng phải chịu trách nhiệm hình sự theo quy định của Bộ luật này."
    verdict: match
    note: ""
  - text: "113 tiếp nhận tin báo về cướp giật, gây rối, bạo hành và các hành vi có dấu hiệu tội phạm"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "113 – Lực lượng Công an: Tiếp nhận tin báo về cướp giật, trộm cắp, gây rối, bạo hành, tai nạn giao thông và các hành vi có dấu hiệu tội phạm, ảnh hưởng đến an ninh trật tự."
    verdict: match
    note: "Nguồn là trang tin của Công an tỉnh Điện Biên (cơ quan công an, đã mở được, chữ trích được), không phải văn bản quy phạm. Mức độ tin cậy chấp nhận được cho đầu số."
  - text: "Gọi 113 miễn phí trên toàn quốc"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "Theo quy định của Luật Viễn thông, các cuộc gọi đến số khẩn cấp hoàn toàn miễn phí."
    verdict: match
    note: "Cụm “toàn quốc” trong trang gắn với số 112; với 113 trang nói bấm trực tiếp không cần mã vùng khi cùng khu vực, gọi sang địa phương khác phải thêm mã vùng. Mục không nói điều này (xem suggested_edits)."
  - text: "Đưa tiền, không giằng co thì an toàn hơn chống lại"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Mục tự nhận (Ghi chú) đây là suy luận, không có nghiên cứu/hướng dẫn nào. Điều 22 không dặn nên hay không nên chống trả. Evidence C phù hợp. Không có hướng dẫn công an/Bộ Công an được dẫn."
  - text: "Đưa tiền không xóa hành vi cướp và không làm mất quyền yêu cầu xử lý (Bẫy 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Hợp lý theo cấu thành Điều 168 (chiếm đoạt bằng đe dọa), nhưng không có câu nào trong nguồn nói vậy."
  - text: "Đuổi theo đánh khi người ta đã bỏ chạy thì không còn là phòng vệ (Bẫy 2)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên."
    verdict: inference
    note: "Suy ra từ “đang có hành vi xâm phạm”; luật không nói riêng trường hợp bỏ chạy."
  - text: "Đưa điện thoại đang mở khóa/mã khóa hoặc đi theo lên xe 'biến một vụ mất đồ thành một vụ khác nặng hơn' (Bẫy 3 / steps[2])"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: ""
    verdict: not-found
    note: "Không nguồn nào được dẫn nói điều này. Lời khuyên an toàn có lý (không để lộ mã khóa, không bị đưa đi nơi khác) nhưng mục không dẫn bất kỳ hướng dẫn nào."

suggested_edits:
  - "Mục Pháp luật, khoản 2 Điều 168: đổi “khi có hung khí, có tổ chức, ...” thành “Phạm tội thuộc một trong các trường hợp sau, ví dụ: có tổ chức; sử dụng vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác; ...” và thêm một dòng nói khoản 3-4 nặng hơn (12-20 năm; 18-20 năm, chung thân khi làm chết người...), dựa vào quote khoản 2 điểm e-h và khoản 3, 4."
  - "Thêm câu giới hạn phạm vi: Điều 168 áp dụng khi có vũ lực hoặc đe dọa dùng vũ lực ngay tức khắc; các kiểu đòi tiền khác có thể là tội khác."
  - "Làm rõ steps[2]: “Nếu bị buộc đưa điện thoại thì đưa máy, không đưa mật khẩu/mã mở khóa”, hoặc bỏ, vì không nguồn."
  - "Lợi ích: thêm nửa câu “bấm trực tiếp không cần mã vùng khi ở cùng khu vực” nếu giữ câu “miễn phí”, theo trang Công an Điện Biên."
  - "Chỗ nào nói “nghĩa là ... tự đẩy mình vào khung rất nặng” nên ghi nhãn suy ra từ Điều 168."

  basis: "Hướng dẫn của bệnh viện chuyên ngành, không có ngày hiệu lực. Ngày đăng 04/01/2022 trên trang. Không thấy hướng dẫn mới hơn cùng đơn vị trong phạm vi tra cứu nhưng chưa tra tìm; NHS Burns and scalds (xem xét 31/03/2026) cho 20 phút làm mát và tương thích."
deliberate_vn_deviation:
  - "Mốc thời gian làm mát: Viện Bỏng 'tốt nhất trong 30 phút từ sau khi bị bỏng. Sau khoảng thời gian trên, ngâm rửa ít tác dụng'; NHS: 'as soon as possible, within 3 hours'. Thời lượng: VN khung 15-30-45 phút, NHS 20 phút."
  - "Băng: VN 'băng ép nhẹ bằng băng sạch'; NHS phủ màng bọc thực phẩm lỏng (không quấn), không dùng băng dính."
potential_harm:
  - "tldr/steps[0] 'trong 30 phút đầu nếu được' không nói rõ 'quá 30 phút vẫn nên làm mát'. Người đến muộn có thể bỏ qua làm mát (NHS: làm trong 3 giờ). Nhẹ-vừa; sửa lời là đủ."
  - "steps[0]/tldr ngâm '20 phút liên tục' không kèm điều kiện bỏng rộng (>10% diện tích cơ thể) hoặc trẻ nhỏ cần kiểm soát để tránh hạ thân nhiệt (nguồn có nêu, mục chỉ để trong Bẫy 2)."
suggested_edits:
  - "Nêu rõ trong tldr/Lợi ích: nguồn là hướng dẫn cho trẻ em (Viện Bỏng) và đối chiếu thêm NHS cho người lớn; thêm NHS 'Burns and scalds' vào mục Nguồn."
  - "steps[0]: đổi 'trong 30 phút đầu nếu được' thành 'càng sớm càng tốt; quá 30 phút vẫn nên làm mát nếu chưa quá vài giờ' (NHS 'within 3 hours'). Thêm 'cởi bỏ quần áo, nhẫn gần vùng bỏng (trừ chỗ dính vào da)'."
  - "steps[3]: thêm bỏng do hóa chất hoặc điện giật cần đi cấp cứu ngay (NHS: 'has been caused by an acid or chemical, or by electricity') hoặc nêu mục này chỉ cho bỏng nhiệt và trỏ 13-21 (hóa chất) / 13-18 (điện giật)."
  - "steps[1]: đổi 'kem đánh răng, nước mắm, mỡ trăn' thành 'bất kỳ chất gì (thuốc mỡ, dầu, nước mắm, nước tương)' theo đúng quote hoặc gắn 'ví dụ: kem đánh răng, mỡ trăn' là ví dụ của người soạn."
  - "steps[3]: nếu muốn giữ 'hai bàn tay', ghi 'hai bàn tay của chính người bị bỏng (trẻ em)'; người lớn đối chiếu thêm NHS (bỏng lớn hoặc sâu)."

  - issue: "Mục Lợi ích ghi 'Thời gian ngâm rửa 15-30-45 phút' còn title/tldr ghi '20 phút' (đã nêu 'nằm giữa khung' trong Ghi chú); không mâu thuẫn thực chất, 20 phút khớp NHS."
    severity: warn

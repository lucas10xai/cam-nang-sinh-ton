claims:
  - text: "Thời gian vàng để vi phẫu nối chi thể thường trong 6 đến 8 giờ đầu; bảo quản lạnh đúng cách thì kéo dài được"
    source_url: http://phacdo.soytequangninh.gov.vn/news/tin-tuc-su-kien/benh-vien-bai-chay-vi-phau-tai-lap-tuan-hoan-trong-thoi-gian-vang-bao-ton-ban-ngon-tay-bi-chan-thuong-phuc-tap-dut-gan-roi-cho-nguoi-benh-tai-nan-lao-dong.html
    quote: "“thời gian vàng” để thực hiện vi phẫu nối chi thể đạt hiệu quả cao nhất thường trong vòng 6–8 giờ đầu kể từ khi xảy ra tổn thương, đặc biệt với các trường hợp đứt rời hoàn toàn. Trong điều kiện bảo quản lạnh đúng cách (bọc phần chi thể đứt rời bằng gạc sạch, cho vào túi kín và đặt trong túi nước đá, tránh tiếp xúc trực tiếp với đá), thời gian có thể kéo dài hơn."
    verdict: match
    note: "Số 6-8 giờ chỉ là 'theo các chuyên gia', không có trích dẫn nghiên cứu."
  - text: "Đặt túi trong thùng nước đá đang tan, tỉ lệ đá và nước là 1/4; không để phần đứt chạm trực tiếp vào đá"
    source_url: http://phacdo.soytequangninh.gov.vn/news/tin-tuc-su-kien/benh-vien-bai-chay-vi-phau-tai-lap-tuan-hoan-trong-thoi-gian-vang-bao-ton-ban-ngon-tay-bi-chan-thuong-phuc-tap-dut-gan-roi-cho-nguoi-benh-tai-nan-lao-dong.html
    quote: "Bảo quản trong túi linon sạch và đặt túi trong thùng nước đá lạnh đang tan (tỉ lệ đá/nước là ¼). Lưu ý: Tránh để chi thể tiếp xúc trực tiếp với đá."
    verdict: match
    note: "Việt Đức: 'Đặt túi đựng chi thể vào một túi khác có chứa đá lạnh' (túi trong túi); không nêu tỉ lệ. Hai nguồn khác cách đặt nhưng cùng nguyên tắc."
  - text: "Băng ép nhẹ vùng chảy máu; nếu phải dùng garo thì nới lỏng garo và đến viện trong vòng 2 giờ"
    source_url: http://phacdo.soytequangninh.gov.vn/news/tin-tuc-su-kien/benh-vien-bai-chay-vi-phau-tai-lap-tuan-hoan-trong-thoi-gian-vang-bao-ton-ban-ngon-tay-bi-chan-thuong-phuc-tap-dut-gan-roi-cho-nguoi-benh-tai-nan-lao-dong.html
    quote: "Sử dụng băng hoặc vải sạch để băng ép nhẹ nhàng vùng chảy máu. + Trong trường hợp máu chảy nhiều, có thể dùng garo, nhưng phải đảm bảo nới lỏng garo và đến bệnh viện trong vòng 2 giờ."
    verdict: partial
    note: "Câu nguồn khớp nhưng (1) nguồn nói 'băng ép nhẹ nhàng', mục steps[0] viết 'Ép mạnh' (mục 12 cùng chương cũng nói ấn mạnh); (2) 'nới lỏng garo' trái với mục 12: 'Nới ga rô chỉ do nhân viên y tế làm'; (3) nguồn là bài tin của bệnh viện tỉnh, không phải hướng dẫn sơ cứu Bộ Y tế/Hội Chữ thập đỏ."
  - text: "Bọc phần đứt bằng gạc sạch (gạc ẩm) cho vào túi nilon kín; tiêu đề ghi 'bọc gạc ẩm'"
    source_url: http://phacdo.soytequangninh.gov.vn/news/tin-tuc-su-kien/benh-vien-bai-chay-vi-phau-tai-lap-tuan-hoan-trong-thoi-gian-vang-bao-ton-ban-ngon-tay-bi-chan-thuong-phuc-tap-dut-gan-roi-cho-nguoi-benh-tai-nan-lao-dong.html
    quote: "Bọc chi thể trong một lớp vải sạch hoặc gạc y tế."

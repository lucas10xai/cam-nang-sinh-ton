  - "steps[3] 'Không dừng ở trạm y tế xã hay bệnh viện huyện' + không có bước gọi 115: nếu còn chảy máu, người bị nạn có thể bị chở đường dài mà không được cầm máu/cấp cứu; trái 'cơ sở y tế gần nhất' của hai nguồn."
  - "'Bọc gạc ẩm' không nói ẩm bằng gì: gạc nhúng nước máy hoặc ngâm nước có thể làm hỏng phần đứt (Việt Đức dặn không ngâm)."
suggested_edits:
  - "steps[0]: bỏ 'Nếu đã dùng garo thì phải nới lỏng garo...'. Thay bằng: 'Ép trực tiếp bằng gạc sạch. Chỉ đặt garo khi ép vẫn không cầm máu; đã đặt thì không tự nới, ghi giờ và gọi 115' (căn cứ: mục 13-12; quote Bãi Cháy 'có thể dùng garo, nhưng phải ... nới lỏng garo và đến bệnh viện trong vòng 2 giờ' cần đối chiếu lại với hướng dẫn cầm máu của Bộ Y tế/Hội Chữ thập đỏ)."

    note: "Cả hai nguồn đều nói đến cơ sở y tế gần nhất (Bãi Cháy: 'Nhanh chóng đến cơ sở Y tế gần nhất'). Mục dặn ngược lại 'không dừng ở trạm y tế xã hay bệnh viện huyện' và 'Bẫy 3' là kết luận của người soạn, không nguồn nào nói; lại không có câu gọi 115. Ý 'chuyển thẳng nơi có vi phẫu' hợp lý về mặt chuyên môn nhưng là suy ra, và nếu còn chảy máu nhiều thì phải cầm máu/cấp cứu ở nơi gần nhất."
  - text: "Việt Đức nối lại ngón trỏ đứt rời sau 25 giờ thiếu máu nhờ phần đứt được bảo quản đúng; mục kết luận 'quá 8 giờ vẫn phải đi'"
    source_url: https://benhvienvietduc.org/ky-tich-lan-dau-tien-tai-viet-nam-vi-phau-thuat-thanh-cong-cuu-song-ngon-tay-thuy-thu-bi-dut-roi-sau-25-gio.html
    quote: "Tổng thời gian thiếu máu lên tới 25 giờ. ... cấu trúc ngón tay (bao gồm: xương, da, dây thần kinh, mạch máu) có khả năng chịu thiếu máu tốt hơn so với phần chi thể có nhiều cơ nên phần ngón tay bị thiếu máu 25 giờ nhưng vẫn có thể được nối lại."
    verdict: partial

  - text: "Phần dính bùn đất rửa nhanh dưới vòi nước sạch rồi bọc lại; nhưng Việt Đức dặn không rửa, không ngâm"
    source_url: https://benhvienvietduc.org/ky-tich-lan-dau-tien-tai-viet-nam-vi-phau-thuat-thanh-cong-cuu-song-ngon-tay-thuy-thu-bi-dut-roi-sau-25-gio.html
    quote: "Không rửa, không ngâm chi thể đứt rời vào bất kỳ dung dịch nào. Trong trường hợp phần đứt rời trong môi trường bẩn nhiều dị vật, có thể rửa dưới vòi nước sạch, tốt hơn là nước uống tinh khiết hoặc nước đun sôi để nguội."
    verdict: match
    note: "Mục tổng hợp đúng hai nguồn. Bãi Cháy: rửa bằng nước muối sinh lý hoặc nước sạch."
  - text: "Đưa người bị nạn tới khoa chấn thương chỉnh hình/phẫu thuật tạo hình có kính vi phẫu. Không dừng ở trạm y tế xã hay bệnh viện huyện"
    source_url: https://benhvienvietduc.org/ky-tich-lan-dau-tien-tai-viet-nam-vi-phau-thuat-thanh-cong-cuu-song-ngon-tay-thuy-thu-bi-dut-roi-sau-25-gio.html
    quote: "Đưa người bị nạn đến cơ sở y tế gần nhất để được xử trí và hướng dẫn tiếp theo."

deliberate_vn_deviation:
  - "Bãi Cháy cho 'rửa bằng nước muối sinh lý hoặc nước sạch'; Việt Đức dặn 'không rửa, không ngâm ... nếu bẩn thì rửa dưới vòi nước sạch'. Hai bệnh viện trong nước đã lệch nhau; nguồn quốc tế (Rochester EMS) gói trong gạc tẩm nước muối vô trùng."
  - "Cả hai bài VN nói 'có thể dùng garo, nhưng nới lỏng và đến viện trong 2 giờ'. Hướng dẫn cầm máu hiện hành (ép trực tiếp trước, garo khi ép không cầm, không tự nới garo) trái với việc nới; mục 13-12 đã theo hướng này nhưng không được kiểm lại bằng nguồn quốc tế trong lượt này (không mở được stopthebleed.org, StatPearls bị reCAPTCHA chặn)."
potential_harm:

    severity: warn
  - issue: "steps[0] 'đưa đi khám ngoại thần kinh' không nêu mức khẩn; đây là chương cấp cứu, trong khi triệu chứng 'yếu nửa người' và 'ngủ nhiều' (thân và NHS) là dấu hiệu cần gọi cấp cứu."
    severity: error
  - issue: "Thân không giải thích được bước 'đừng bỏ qua dù người bệnh nói không nhớ có té' (nguồn nói 'không có cơ chế chấn thương rõ ràng'); Ghi chú Bẫy 2 viết đúng, nhưng steps[2] nói 'không nhớ'."
    severity: warn
  - issue: "Chi phí 'phần lớn chi phí dừng ở lần chụp và lần khám lại', 'vài ngày nằm viện' không có nguồn."
    severity: warn
  - issue: "Mục tự ghi mức B và 'không có văn bản BYT'; cả hai nguồn là truyền thông bệnh viện (108, Huế). Quy tắc chương 13: không chấp nhận tờ rơi bệnh viện làm nguồn duy nhất cho con số: số 5/100.000 và 58/100.000 chỉ dựa vào bài báo cáo ca của BV Huế (trích tài liệu [1] chưa rõ)."
    severity: warn
validity:
  doc: "Bệnh viện TƯ Quân đội 108 (06/10/2020) và Bệnh viện Đại học Y-Dược Huế (bài tham khảo); không có văn bản pháp luật"
  in_force: unconfirmed
  effective_from: "2020-10-06"
  amended_by: []
  basis: "Hai bài truyền thông bệnh viện, không có 'ngày hiệu lực' hay hướng dẫn thay thế. Đối chiếu bổ sung: NHS 'Subdural haematoma' (xem lại 10/07/2025, hạn xem lại 10/07/2028)."
deliberate_vn_deviation:
  - "Nguồn VN dẫn (108, Huế) chỉ nêu 'đi khám' và không nêu mốc cấp cứu; NHS xếp yếu liệt một phần cơ thể, khó đi/thăng bằng, khó tỉnh vào mức 'Call 999'. Mục theo nguồn VN, lệch so với NHS."
potential_harm:
  - "steps[0] và tldr 'yếu nửa người: đi khám ngoại thần kinh' không nói gọi 115: yếu liệt nửa người mới xuất hiện cũng là dấu hiệu đột quỵ (cần cấp cứu ngay, mục 03 cùng chương), người đọc có thể chờ lịch khám; NHS xếp vào mức 'Call 999'."
  - "Không có cảnh báo nếu người bệnh buồn ngủ khó tỉnh, nôn, co giật, đau đầu tăng nhanh: các dấu hiệu máu tụ lan rộng/chèn ép não cần cấp cứu ngay."
suggested_edits:
  - "tldr và steps: thêm 'Nếu yếu liệt nửa người mới xuất hiện, nói ngọng, khó tỉnh, nôn nhiều, co giật: gọi 115, không chờ lịch khám'; vẫn giữ 'chụp cắt lớp vi tính sọ' cho các dấu hiệu nhẹ hơn (dựa vào NHS: 'Call 999 if ... numbness or weakness in part of their body')."
  - "Tiêu đề/tldr: ghi nguồn cho 'đi loạng choạng, nói chậm, ngủ nhiều' là NHS (hoặc bỏ); sửa 'dù người bệnh nói không nhớ có té' thành 'dù không có chấn thương rõ ràng (BV 108)'."
  - "steps[1]: thêm 'mang theo danh sách thuốc; nếu đang dùng thuốc chống đông/chống kết tập tiểu cầu, báo ngay' và ghi nguồn NHS ('you take medicine to thin your blood')."
  - "Bẫy 1 và Bẫy 3: bỏ 'thuốc bổ và thuốc ngủ' và 'Liều và hướng xử trí bị tính sai' hoặc ghi rõ là suy luận."
  - "Chi phí: bỏ hoặc dẫn nguồn; thêm một nguồn y khoa gốc (hướng dẫn BYT/hội thần kinh/NHS) cho số 5 và 58/100.000."

  - "tldr và Bẫy 1: 'cần triệu chứng dưới 270 phút' và '270 phút là hạn cuối ... qua mốc đó thì mất một lựa chọn điều trị' có thể khiến người đến muộn, ngủ dậy mới thấy triệu chứng hoặc không rõ giờ nghĩ là đã hết cơ hội và không đi viện. QĐ 3312 mục 4.5/2.3.4 và NINDS cho thấy vẫn có điều trị tới 24 giờ cho một số người."
suggested_edits:
  - "tldr: đổi 'Thuốc tiêu huyết khối cần triệu chứng dưới 270 phút, nên không chờ xem có đỡ không' thành 'Thuốc tiêu huyết khối thường quy cần triệu chứng dưới 270 phút; nhiều ca vẫn điều trị được muộn hơn nên vẫn phải đi viện ngay, kể cả khi ngủ dậy mới thấy', dựa vào QĐ 3312 mục 4.5 và NINDS 'some people benefit from treatment up to 24 hours'."
  - "Ghi chú Bẫy 1: bỏ 'hạn cuối' và 'mất một lựa chọn điều trị', thay bằng mô tả đúng 4.2.2 ('điều kiện của tiêu huyết khối thường quy')."
  - "Nguồn: thêm NINDS Signs and Symptoms (ninds.nih.gov/health-information/stroke/signs-and-symptoms) làm nguồn cho FAST, gọi cấp cứu, không tự lái xe, ghi giờ."
  - "Ghi chú Bẫy 2: bỏ lý do 'tài liệu xếp rối loạn tri giác và rối loạn ngôn ngữ vào nhóm biểu hiện khởi phát' làm lý do không cho uống thuốc; dẫn nguồn 'không cho uống thuốc' (Phú Lâm/HCDC) hoặc ghi 'suy ra'."
  - "Chi phí: bỏ hoặc dẫn nguồn cho 'bảo hiểm y tế trả phần lớn' và 'mỗi phút chờ là một phần vùng não chết thêm'."

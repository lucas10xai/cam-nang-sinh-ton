  basis: "Hướng dẫn y tế không có ngày hiệu lực. Tờ rơi HCDC cập nhật 21/04/2024. Chưa đối chiếu được hướng dẫn AHA/ERC bản gốc (không mở được); NSW Gov (9/12/2024) cùng hướng."
deliberate_vn_deviation:
  - "BV Bỏng QG VN cho 'túm vào quần áo khô để kéo' người bị nạn khi đã cách điện; mục chọn 'gạt dây bằng que khô, không kéo tay trần' (gần với NSW: dùng vật không dẫn điện). Khác nhau về kỹ thuật, không mâu thuẫn về nguyên tắc cách điện."
potential_harm:
  - "steps[1] 'Không cắt được thì đứng trên vật khô, dùng cán chổi hoặc que gỗ khô gạt dây điện ra' không giới hạn điện áp: với điện cao thế (đường dây trên cao, trạm biến áp) cán chổi/que gỗ KHÔNG an toàn (NSW: 'unless higher than household voltage is involved'). Người đọc làm theo nguyên văn ở hiện trường cao thế có thể bị điện giật. steps[2] chỉ xét dây cao thế 'rơi xuống đất', không xét nạn nhân đang dính vào đường dây cao thế/trạm điện."
suggested_edits:
  - "steps[1]: thêm điều kiện 'chỉ với điện gia dụng/hạ thế (dây trong nhà); nếu là điện cao thế hoặc nghi cao thế thì không lại gần, đứng cách xa và gọi điện lực/115' (dựa NSW: 'unless higher than household voltage is involved, free the victim ... using a dry stick, board, rope, clothing, plastic pipe or other non-conducting device')."
  - "Mục Lợi ích: sửa liệt kê năm bước đúng thứ tự tờ rơi: (1) ngắt điện, đưa ra khỏi hiện trường; (2) đánh giá, kiểm tra mạch/nhịp thở; (3) ngưng tim ngưng thở thì hồi sức tim phổi ngay; (4) gọi 115 và cơ sở y tế; (5) trong lúc chờ, CPR liên tục."
  - "steps[4]/tldr: dùng 'hồi sức tim phổi (ép tim, nếu biết thì kèm thổi ngạt)' hoặc nêu 'ép tim' kèm ghi chú nguồn nói hồi sức tim phổi."
  - "steps[2] và Bẫy 3: gắn nhãn 'suy ra từ hướng dẫn quốc tế (ví dụ CDC: never touch a fallen power line)' vì hai nguồn của mục không nói."

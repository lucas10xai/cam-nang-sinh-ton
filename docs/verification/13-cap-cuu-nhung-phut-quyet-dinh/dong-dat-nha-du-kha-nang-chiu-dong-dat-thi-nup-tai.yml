claims:
  - text: "Yêu cầu không sụp đổ: kết cấu phải chịu được tác động động đất thiết kế mà không sụp đổ cục bộ hay toàn phần, giữ toàn vẹn, còn một phần khả năng chịu tải (mục 2.1)"

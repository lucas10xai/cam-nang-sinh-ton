validity:
  doc: "TCVN 9386:2012 Thiết kế công trình chịu động đất (chuyển đổi từ TCXDVN 375:2006); công bố bởi Bộ KH&CN"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Kết quả tìm kiếm thứ cấp (ketcausoft.com 13/01/2026; thuvienphapluat/vietq liệt kê) cho thấy Bộ KH&CN công bố TCVN 9386:2025 (Quyết định 4647/QĐ-BKHCN ngày 31/12/2025; TCVN 9386-1:2025 và 9386-5:2025) 'ban hành nhằm thay thế phiên bản năm 2012', phân vùng theo địa danh hành chính hiện tại và 2 loại phổ phản ứng. Nghĩa là TCVN 9386:2012 mà mục dẫn rất có thể đã bị thay thế và Phụ lục H (bảng gia tốc nền theo địa danh) có thể đã đổi. Không mở được văn bản chính thức (thuvienphapluat 403), nên in_force: unconfirmed, nhưng có dấu hiệu mạnh là lạc hậu."
deliberate_vn_deviation:
  - "Hành động 'nhà cũ dễ sập, cửa vài bước thì chạy ra ngoài' lệch hướng dẫn quốc tế (CDC/FEMA/USGS-ShakeOut: Drop-Cover-Hold On tại chỗ, không chạy ra ngoài lúc đang rung). Mục không trình bày là ngoại lệ có chủ ý và không dẫn nguồn trong nước (Bộ Xây dựng/Bộ NN&MT/Viện Vật lý địa cầu) cho lời khuyên chạy ra ngoài."
potential_harm:
  - "Step 2/title dạy chạy ra ngoài lúc đang rung ở nhà cũ: nguy cơ bị gạch/ngói/ban công/kính rơi từ mặt tiền hoặc ngã khi đang rung. CDC: nguyên nhân tử vong chính là vật liệu xây dựng đổ và vật nặng rơi. Nguồn quốc tế khuyến nghị Drop-Cover-Hold On tại chỗ rồi di chuyển khi hết rung. Lời khuyên chạy ra là ý của người soạn, không nguồn, và còn phụ thuộc điều kiện không đo được ('nhà đủ khả năng chịu động đất')."
  - "Tldr/step 1 điều kiện 'nhà xây theo chuẩn kháng chấn': người đọc không biết nhà mình có phải hay không (tiêu chuẩn không cho cách nhận biết), nên dễ tự coi nhà là 'cũ' hoặc 'đủ chuẩn' sai và chọn nhánh sai."
suggested_edits:
  - "Tldr/title/steps: viết lại hành động chính thành 'Khi đang rung: quỳ xuống (Drop), che đầu và cổ dưới bàn chắc (Cover), bám chặt (Hold on) cho đến khi hết rung; tránh cửa sổ/kính' theo CDC (quote 'COVER your head and neck... HOLD ON to your shelter ... until the shaking stops'). Bỏ nhánh 'chạy ra bãi trống khi đang rung'; thay bằng 'hết rung mới ra ngoài theo lối thoát đã chọn, tránh mặt tiền/dây điện'."
  - "Nếu vẫn muốn giữ nhánh nhà dễ sập, phải dẫn nguồn trong nước hoặc quốc tế xác nhận và gắn nhãn 'suy ra từ ...'; thêm cảnh báo gạch rơi khi chạy qua ngoài mặt tiền (đang mâu thuẫn với Bẫy 3)."
  - "legal_refs và thân bài: sửa 'mục 3.1.3' thành 'Lời giới thiệu và mục 3.2.1(4),(5)'; ghi rõ ag = γI·agR, Phụ lục H là agR; chỉ nói Hà Nội nội thành (trừ Long Biên 0,0747g, Tây Hồ 0,0819g...) ... hoặc bỏ liệt kê quận khỏi mục."
  - "Cập nhật nguồn: kiểm TCVN 9386-1:2025 (QĐ 4647/QĐ-BKHCN ngày 31/12/2025) và thay legal_refs/nguồn; nếu số phân vùng đổi, sửa bảng. Dùng bản PDF chính thức (không phải trang khoa trường)."
  - "Step 3 và 4: ghi nhãn 'suy ra' hoặc dẫn nguồn (CDC/Bộ Y tế/Bộ NN&MT) cho 'không thang máy/không nhảy lầu' và 'hỏi năm xây/bản vẽ'; đổi 'cửa chỉ vài bước' thành tiêu chí đo được hoặc bỏ."

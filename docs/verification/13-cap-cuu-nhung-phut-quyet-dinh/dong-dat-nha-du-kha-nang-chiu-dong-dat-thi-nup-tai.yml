      COVER your head and neck (and your entire body if possible) underneath a sturdy table or desk. If there is no shelter nearby, get down near an interior wall or next to low-lying furniture that won't fall on you, and cover your head and neck with your arms and hands. ... HOLD ON to your shelter (or to your head and neck) until the shaking stops.
    verdict: partial
    note: "Mục KHÔNG dẫn nguồn nào cho phần hành động (chỉ dẫn TCVN thiết kế). Tôi đối chiếu CDC (Reviewed Aug 21, 2026): 'DROP down onto your hands and knees' trước, rồi cover và hold on. Mục thiếu 'DROP' (quỳ xuống bằng tay và gối) và 'tránh cửa sổ/kính' nhưng đúng hướng. Tóm tắt Việt: quỳ xuống, che đầu cổ dưới bàn chắc, bám tới khi hết rung."
  - text: "Step 2/title: nhà cũ dễ sập, cửa ra sân chỉ vài bước thì chạy ra bãi trống"
    source_url: https://www.cdc.gov/earthquakes/safety/index.html
    quote: |-
      During an earthquake, most deaths and injuries are caused by collapsing building materials and heavy falling objects, such as bookcases, cabinets, and heating units.
    verdict: not-found
    note: "Không có nguồn nào trong mục (kể cả TCVN) nói chạy ra ngoài nếu nhà cũ, và CDC không có hướng dẫn này: CDC dạy Drop-Cover-Hold On trong nhà và 'If you are outside, stay outside' (infographic). Hướng dẫn quốc tế (CDC/FEMA/Red Cross/USGS) không khuyến nghị chạy ra ngoài khi đang rung vì nguy cơ gạch/kính rơi từ mặt tiền. Đây là lời khuyên của người soạn. Tóm tắt Việt: CDC: nguyên nhân chết chính là vật liệu xây dựng đổ và vật nặng rơi."
  - text: "Step 3: không nhảy lầu, không vào thang máy, không chen xuống cầu thang lúc đang rung"
    source_url: https://www.cdc.gov/earthquakes/safety/index.html
    quote: |-
      Drop to your hands and knees, cover your head and neck, and hold on to your shelter until shaking stops.
    verdict: inference
    note: "Phần 'không ... thang máy/nhảy lầu/chen cầu thang' không có trong nguồn đã dẫn hay CDC trang này (không thấy từ khóa 'elevator'). Hợp lý nhưng là suy ra."
  - text: "Step 4: kiểm tra trước (đếm số bước ra sân, chọn bàn chắc, hỏi nhà xây năm nào có bản vẽ)"
    source_url: https://www.cdc.gov/earthquakes/safety/index.html

internal_checks:
  - issue: "Bẫy 3 viết 'Gạch và tấm đan phía trên khung cửa là thứ rơi trước' (khung cửa không chắc nhất) nhưng không có nguồn; đồng thời CDC (nguồn quốc tế) không dạy đứng ở khung cửa. Ngược lại, step 2 dạy chạy ra ngoài từ nhà cũ qua khung cửa/lối đi dưới mặt tiền, mâu thuẫn tinh thần cảnh báo gạch rơi của chính Bẫy 3."
    severity: error
  - issue: "legal_refs.article ghi 'mục 3.1.3 (động đất mạnh, yếu, rất yếu)'. Trong bản PDF dẫn, mục 3.1.3 là phần nền đất; phân loại nằm ở Lời giới thiệu và 3.2.1. Thân bài 'Pháp luật Việt Nam' lặp 'mục 3.1.3' ba lần."
    severity: error
  - issue: "Ba ngưỡng 0,08g/0,04g áp dụng cho ag (gia tốc thiết kế = γI × agR). Phụ lục H cho agR. Thân bài ghi 'Hà Nội 0,0976g đến 0,1032g, tức nằm trong nhóm phải tính kháng chấn' — kết luận đúng (agR > 0,08g, còn nếu γI=0,75 thì ag>0,0732 vẫn có thể <0,08) nhưng lẫn agR với ag và 'đến 0,1032g' chỉ trích hai quận trong khi cả nội thành có Long Biên 0,0747g (<0,08g)."
    severity: warn
  - issue: "Tiêu chuẩn thiết kế công trình chỉ áp dụng cho công trình xây MỚI/thiết kế; mục tự nói điều này ở Ghi chú. Không có cách nào người đọc 'biết nhà đủ khả năng chịu động đất' (Ghi chú thừa nhận). Tiêu đề và steps vẫn dùng điều kiện này để rẽ nhánh hành động (núp vs chạy)."
    severity: error
  - issue: "Điều kiện 'cửa ra sân chỉ vài bước' không định nghĩa 'vài bước' (mấy mét, bao nhiêu giây); 'tường gạch không giằng' không đo được cho người dân."
    severity: warn
  - issue: "Chi phí 'Không mất tiền' khớp thân bài; không có số liệu mâu thuẫn khác. Không có số tiền/ngày."

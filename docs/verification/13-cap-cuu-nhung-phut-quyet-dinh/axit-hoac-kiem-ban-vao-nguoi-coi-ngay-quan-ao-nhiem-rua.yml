claims:
  - text: Cởi ngay quần áo dính hóa chất
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: match
    quote: Nhanh chóng cởi bỏ quần áo bị dính hoá chất, chánh tiếp xúc với bất cứ vật liệu nào dính hoá chất.
    note: Bài về bỏng hóa chất Ở TRẺ EM (20/04/2022). Giày/đồng hồ trong steps là suy ra hợp lý, không phải chữ của nguồn.
  - text: Rửa vùng bỏng dưới nước chảy liên tục ít nhất 30 phút
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: partial
    quote: Thời gian ngâm rửa nước sạch với bỏng hoá chất từ 30 - 60 phút và thường kéo dài hơn so với bỏng nhiệt.
    note: "Nguồn nói 'ngâm rửa bằng nước sạch' 30–60 phút, không nói 'nước mát chảy liên tục'. Quan trọng hơn: nguồn có dòng riêng 'Bỏng do vôi bột: Cần lau sạch vôi bám bằng khăn khô.' (Bước 1) mà mục không nêu: hóa chất dạng bột khô phải gạt/lau khô trước rồi mới rửa nhiều nước."
  - text: Không dùng nước ấm để rửa
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: match
    quote: Không dùng nước ấm rửa vì làm tăng khả năng ngấm của hoá chất.
    note: ""
  - text: "Hóa chất vào mắt: rửa ít nhất 15–30 phút dưới vòi nước sạch hoặc nước muối sinh lý"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: match
    quote: Rửa mắt liên tục dưới vòi nước sạch hoặc dùng bình nước muối sinh lý (NaCl 0,9%) xối mạnh vào mắt trong ít nhất 15–30 phút.
    note: Bài Viện Bỏng cùng mục ghi mắt 'ít nhất 10 - 15 phút'; mục chọn khoảng dài hơn, an toàn hơn.
  - text: Lộn mi trên và mi dưới để rửa sạch hóa chất đọng
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: match
    quote: Lộn mi trên và mi dưới để rửa sạch hóa chất còn đọng trong túi kết mạc và chân mi.
    note: ""
  - text: Không băng kín mắt khi chưa rửa sạch; không nhỏ thuốc trước khi rửa
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: match
    quote: Băng kín mắt khi chưa rửa sạch hóa chất hoặc tự ý nhỏ bất kỳ loại thuốc nào trước khi rửa mắt.
    note: ""
  - text: Gắp bỏ mảnh hóa chất bám vào mắt
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: partial
    quote: Nếu có bụi vôi, mảnh hóa chất bám vào mắt, cần gắp bỏ hết trước hoặc trong quá trình rửa (nên thực hiện bởi nhân viên y tế nếu có thể).
    note: Mục bỏ vế 'nên thực hiện bởi nhân viên y tế nếu có thể'; người thường không nên tự gắp trong mắt.
  - text: Bỏng kiềm nguy hiểm hơn bỏng axit vì kiềm thẩm thấu sâu
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: match
    quote: Nguy hiểm hơn vì hóa chất kiềm có khả năng thẩm thấu sâu vào nhãn cầu, gây tổn thương nghiêm trọng hơn.
    note: ""
  - text: Không đổ giấm hoặc nước vôi để trung hòa (step 4, Bẫy 1)
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: partial
    quote: Việc trung hoà chỉ tiến hành sau khi đã ngâm rửa vết bỏng bằng nước sạch (trung hoà ngay lập tức có thể làm nặng lên tổn thương do phản ứng với tác nhân gây bỏng còn sót lại).
    note: Nguồn cho phép trung hòa SAU khi rửa (nước chanh/giấm với kiềm; nước xà phòng loãng/nước vôi nhì với axit); mục cấm tuyệt đối — an toàn hơn nguồn, chấp nhận được nhưng nên nói rõ là cố ý. Cụm 'phản ứng trung hòa tỏa nhiệt' không có trong nguồn (nguồn chỉ nói 'làm nặng lên tổn thương').
  - text: Không thoa kem đánh răng, dầu ăn
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: not-found
    note: Không có trong hai nguồn đã mở. Khuyến cáo phổ biến nhưng không phải chữ của nguồn dẫn.
  - text: Bỏng rộng, bỏng ở mặt hoặc choáng thì gọi 115, tới cơ sở chuyên khoa bỏng
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    verdict: inference
    note: Nguồn chỉ nói 'Nhanh chóng chuyển nạn nhân tới cơ sở y tế gần nhất'; ngưỡng 'rộng/mặt/choáng → 115' do biên tập viên suy ra.
  - text: "Bẫy 2: nước trong chậu bẩn dần sau vài phút; Bẫy 3: băng kín mắt giữ hóa chất trong túi kết mạc"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    verdict: inference
    note: Cơ chế do tác giả suy ra; nguồn chỉ nêu lệnh 'không băng kín mắt khi chưa rửa sạch'.

potential_harm:
  - "Step 2 'Rửa vùng bỏng dưới vòi nước…' vô điều kiện: nguồn Viện Bỏng ghi riêng 'Bỏng do vôi bột: Cần lau sạch vôi bám bằng khăn khô' — hóa chất dạng bột khô cần phủi/lau khô phần thừa rồi mới xả nước nhiều; xả nước ngay lên cục bột dày có thể tạo dung dịch kiềm đậm đặc tại chỗ [INFERENCE về cơ chế]. Mục không có bước này."
  - "Không nhắc người sơ cứu tự bảo vệ (nguồn: 'người cấp cứu cần được bảo vệ như: đeo khẩu trang, đi găng tay…') và không dặn tránh để nước rửa chảy sang mắt/vùng da lành (nguồn mắt Viện Bỏng: 'Không để nước nhiễm bẩn chảy sang mắt kia')."
  - "'Gắp bỏ mảnh hóa chất bám vào mắt' bị cắt mất 'nên thực hiện bởi nhân viên y tế nếu có thể' → người đọc có thể tự gắp trong mắt."
suggested_edits:
  - "steps[1] và 'Nói dễ hiểu': thêm bước trước khi rửa: 'Hóa chất dạng bột khô (vôi bột…): phủi/lau sạch bột bằng khăn khô, tránh chạm tay trần, rồi mới xả nước nhiều' — dựa vào quote 'Bỏng do vôi bột: Cần lau sạch vôi bám bằng khăn khô.'"
  - Ghi rõ nguồn da là hướng dẫn cho trẻ em và đối chiếu thêm nguồn người lớn/quốc tế (AHA/ERC/NHS) hoặc Bộ Y tế.
  - Sửa 'phản ứng trung hòa tỏa nhiệt' thành 'có thể làm nặng thêm tổn thương' (đúng chữ nguồn); nói rõ nguồn cho phép trung hòa chỉ sau khi rửa.
  - "Mục 'Lợi ích' về mắt: giữ vế 'nên thực hiện bởi nhân viên y tế nếu có thể' khi nói về gắp mảnh hóa chất."
  - Bỏ 'kem đánh răng, dầu ăn' khỏi phần trích nguồn hoặc đánh dấu là khuyến cáo chung ngoài hai nguồn.

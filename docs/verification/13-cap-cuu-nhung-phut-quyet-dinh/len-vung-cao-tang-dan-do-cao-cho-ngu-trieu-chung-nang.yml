suggested_edits:
  - "Bẫy 2: bỏ 'đúng kiểu lên nhanh mà hướng dẫn cảnh báo', hoặc viết lại: 'Quy tắc dựa vào độ cao chỗ ngủ. Đi lên đỉnh trong ngày rồi về ngủ ở thấp ít stress hơn, nhưng nếu ngủ lên cao ngay đêm đầu thì nguy cơ tăng', dựa vào quote 'day trips ... are much less stressful on the body'."
  - "Thêm quy tắc ngày đầu của CDC: không đi thẳng từ dưới 1.200 m lên chỗ ngủ trên 2.750 m trong một ngày."
  - "tldr/steps: đổi 'khoảng 500 mét' thành 'không quá 500 mét'."
  - "Ghi chú: đổi 'số liệu đo đạc chính thức' thành 'số liệu do Cục Đo đạc công bố, báo tường thuật', hoặc dẫn công bố gốc của Cục cho 3.147,3 m."
  - "Câu 'Việt Nam chưa ban hành hướng dẫn riêng' đổi thành 'chưa tìm thấy hướng dẫn riêng của Việt Nam'; gắn nhãn 'suy ra' cho ý 'không có vùng dân cư sống ở độ cao lớn'."
  - "Câu 'xuống và oxy hiệu quả hơn thuốc': ghi rõ là với phù phổi; với phù não thì CDC dùng thuốc dexamethasone phối hợp (do nhân viên y tế chỉ định)."

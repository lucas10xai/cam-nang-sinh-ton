  amended_by: []
  basis: "Trang Sở Y tế Gia Lai còn đăng tài liệu (thư viện hướng dẫn chuyên môn); tìm kiếm không thấy văn bản thay thế/bãi bỏ, nhưng trang tình trạng hiệu lực thuvienphapluat/vbpl không truy cập được nên không xác nhận được. Bản PDF không có ngày hết hiệu lực."
deliberate_vn_deviation:
  - "Mục (theo bài medinet) dặn 'không tự dùng thuốc giảm đau' mà không nhắc aspirin nhai 150-300 mg; ERC 2021 khuyến cáo sơ cứu nhân viên khuyến khích nhai aspirin khi nghi nhồi máu cơ tim ở người lớn tỉnh. Phân tích: tổng đài 115/người sơ cứu có thể hướng dẫn; mục không nên cấm chung chung."
potential_harm:
  - "tldr 'Cửa sổ can thiệp ... 0 đến 12 giờ' không điều kiện có thể khiến người bệnh đau ngực đã 12-48 giờ nghĩ rằng đã quá muộn và không đi (tài liệu: 12-48 giờ vẫn bắt buộc chụp và can thiệp nếu đau ngực tái phát, rối loạn nhịp hoặc huyết động không ổn định)."
  - "Câu 'không tự dùng thuốc giảm đau' không phân biệt aspirin: người đọc có thể bỏ aspirin trong khi ERC khuyến cáo nhai 150-300 mg sớm (đồng thời chống chỉ định khi dị ứng hoặc đau ngực chưa rõ nguyên nhân/chấn thương, và mục 08 cùng chương: nghi bóc tách động mạch chủ thì aspirin có hại), nên cần diễn đạt 'làm theo hướng dẫn của tổng đài 115'."
suggested_edits:
  - "Nguồn: đổi 'Trung tâm Kiểm soát bệnh tật Thành phố Hồ Chí Minh' thành 'Trung tâm Y tế khu vực Phú Lâm' (dựa vào trang medinet: 'Trung Tâm Y tế khu vực Phú Lâm', 'Cập nhật: 8:12, 30/9/2025')."
  - "'Lợi ích' / Nguồn: đổi 'mục 4.3' thành 'mục 4.2' cho cửa sổ 0-12 giờ và mốc 120 phút; bỏ '4.3.1.4' khỏi danh sách mục; giữ 4.3.1.3 và 4.3.2."
  - "tldr: viết 'Với nhồi máu cơ tim có ST chênh lên (bác sĩ xác định bằng điện tâm đồ), can thiệp ưu tiên trong 12 giờ đầu; sau 12 giờ vẫn phải đi nếu còn đau, hồi hộp, choáng' (dựa vào quote 'Từ 12 - 48 giờ...')."
  - "steps[2]: thay 'không tự dùng thuốc giảm đau' bằng 'không tự uống thuốc giảm đau; làm theo hướng dẫn của 115 về aspirin' và ghi rõ aspirin (nếu 115 hoặc nhân viên y tế đồng ý, không dị ứng) theo ERC 2021 150-300 mg nhai."
  - "Thêm bước: nếu người bệnh bất tỉnh, không thở bình thường thì ép tim và dùng AED (xem mục 01 chương 13)."

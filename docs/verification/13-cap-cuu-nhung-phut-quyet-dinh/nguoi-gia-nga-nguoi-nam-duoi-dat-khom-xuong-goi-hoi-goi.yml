deliberate_vn_deviation:
  - "Không có hướng dẫn quốc tế nào được đối chiếu trong mục. NHS (nhs.uk/conditions/falls, rà soát 06/03/2025) cho phép nhẹ nhàng giúp người ngã tự đứng lên nếu họ không có dấu hiệu chấn thương và gọi cấp cứu khi nghi chấn thương đầu, lưng, cổ, hông hoặc không dậy được; mục lệch ở chỗ cấm bế/kéo dậy tuyệt đối và bỏ điều kiện chấn thương."
potential_harm:
  - "steps/tldr: gọi 115 chỉ khi 'không đứng dậy được hoặc yếu tay, méo miệng, nói khó'. Người ngã đập đầu, đau cổ, lưng hoặc hông nhưng vẫn đứng được, hoặc đang dùng thuốc chống đông, không được dặn gọi cấp cứu hay đi khám. NHS liệt kê nghi chấn thương đầu, lưng, cổ, hông là điều kiện gọi cấp cứu."
  - "steps bước 2: 'Nhìn ngực xem có thở' không có bước tiếp theo. Người đọc làm đúng nguyên văn mà thấy không thở hoặc thở ngáp có thể không biết phải ép tim, làm chậm cứu chữa. Cần nối sang mục 13-01 (AHA: không đáp ứng + thở bất thường là ngừng tim)."
suggested_edits:
  - "tldr/steps bước 4: sửa thành 'Gọi 115 nếu người ngã không đứng dậy được, nghi đập đầu, đau cổ, lưng hoặc hông, hoặc có yếu tay, méo miệng, nói khó', dựa vào NHS 'may have injured the head, back, neck or hip; cannot get up'."
  - "steps bước 2: thêm 'Không thở hoặc chỉ thở ngáp: gọi 115 và ép tim theo mục 13-01', dựa vào AHA 6.1 khuyến nghị 1."
  - "steps bước 3 và Ghi chú: đổi 'Không bế hay kéo ngồi dậy' thành 'Không tự nhấc người; chỉ nhẹ nhàng đỡ dậy khi họ tỉnh, không đau, tự làm được', theo NHS 'Carefully help them get up if they can, but do not try to lift them yourself'; hoặc dẫn nguồn khác cho lệnh cấm tuyệt đối."
  - "Ghi chú Bẫy 1: bỏ câu 'Kéo ngồi lên làm cơn nặng thêm trước khi có ai đo huyết áp' (không có nguồn) hoặc dẫn nguồn."
  - "Ghi chú Bẫy 2: đổi 'Quyết định 3312 xếp đúng mấy dấu hiệu đó vào nhóm phải xét tái tưới máu' thành mô tả đúng chữ của QĐ (3.1: biểu hiện khởi phát hay gặp; thời điểm khởi phát quan trọng để xét tái tưới máu) hoặc ghi 'suy ra'."
  - "Chi phí: bỏ hoặc dẫn nguồn cho 'vài trăm nghìn tới vài triệu đồng'; dẫn Thông tư 02/2020/TT-BTTTT cho 115 miễn phí; sửa 'đăng ngày' thành 'cập nhật ngày' 2/10/2026."

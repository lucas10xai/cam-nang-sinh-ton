  in_force: unconfirmed
  effective_from: "2021-12-31"
  amended_by: []
  basis: "luatvietnam.vn ghi hiệu lực từ ngày ký 31/12/2021, “Ngày hết hiệu lực: Đang cập nhật”; thuvienphapluat.vn chặn nên không đọc được tình trạng hiệu lực. Tìm kiếm tháng 11/2026: QĐ 3878/QĐ-BYT (2024) và kế hoạch 10/2026 vẫn dẫn QĐ 5968; có QĐ 2956/QĐ-BYT 2026 về tiêu chuẩn chất lượng lâm sàng HIV/AIDS nhưng chưa thấy văn bản thay thế QĐ 5968. Không có bằng chứng trực tiếp nên ghi unconfirmed. Hướng dẫn quốc tế mới hơn (CDC 2025) khớp các mốc chính."
deliberate_vn_deviation: []
potential_harm:
  - "steps[1] “thấy khỏe hay buồn nôn nhẹ cũng không tự dừng” không kèm “tác dụng phụ nặng thì đến cơ sở y tế ngay”: người đọc có thể cố uống tiếp khi có phản ứng nặng (phát ban nặng, vàng da, nôn liên tục không giữ được thuốc...). Nguồn QĐ 5968 có vế này. Mức độ: thấp-vừa; cần bổ sung."
  - "Mục không nói tới rửa vết thương/niêm mạc ngay tại chỗ (QĐ 5968 bước 1) trong khi người đọc có thể mất vài giờ mới tới cơ sở y tế; thiếu bước này không gây hại trực tiếp nhưng bỏ lỡ sơ cứu ban đầu cho phơi nhiễm qua da/niêm mạc."
suggested_edits:
  - "steps[1]: đổi thành “Uống thuốc kháng vi rút đủ 28 ngày liên tục; tác dụng phụ nhẹ, thoáng qua như buồn nôn thì không tự dừng, nhưng nếu có phản ứng nặng thì quay lại cơ sở y tế ngay”. Dựa vào quote QĐ 5968 mục 6."
  - "Thêm vào steps trước bước đầu (hoặc Lợi ích): “Nếu phơi nhiễm qua vết thương: rửa ngay dưới vòi nước sạch bằng xà phòng, không nặn bóp; qua mắt: rửa bằng NaCl 0,9% hoặc nước sạch liên tục 5 phút”. Dựa vào quote QĐ 5968 mục 5 bước 1."
  - "Lợi ích: thêm điều kiện chỉ định “không chỉ định khi nguồn khẳng định HIV âm tính hoặc dịch không có nguy cơ (nước bọt, nước tiểu, mồ hôi, nước mắt)”, dựa vào quote QĐ 5968 mục 2; và sửa “đừng chờ biết người kia có nhiễm hay không” thành “nếu không rõ tình trạng của người kia, coi là có nguy cơ”."
  - "Mục Nguồn: thêm toàn văn QĐ 5968/QĐ-BYT (mục II Chương 2) và CDC MMWR 2025 (https://www.cdc.gov/mmwr/volumes/74/rr/rr7401a1.htm) làm nguồn chính; ghi “ngày 31/12/2021”."
  - "Bỏ mốc tuổi “từ 10 tuổi” hoặc ghi “người lớn và trẻ em chọn phác đồ khác nhau, do bác sĩ quyết định”."
  - "Bổ sung (một dòng) chỉ định PEP gồm quan hệ không an toàn/hiếp dâm, và việc tránh thai khẩn cấp theo QĐ 5968."

potential_harm:
  - "Bước 2 chỉ nói 'đứng sau lưng, một tay đỡ trước ngực' mà không nói cho nạn nhân cúi người ra trước khi vỗ lưng (AHA/ERC: nghiêng người ra trước để dị vật rơi ra miệng thay vì tụt sâu hơn). Không gây hại nặng nhưng làm giảm hiệu quả; nên thêm."
  - "Steps không có trường hợp mang thai muộn/rất béo (ấn bụng không làm được: dùng ấn ngực) và không nhắc gọi 115 sớm trong lúc cứu người còn tỉnh (trang 115 có nhắc). Thiếu điều kiện, có thể làm chậm gọi cấp cứu."
suggested_edits:
  - "Phần Lợi ích: sửa 'Lặp lại theo chu kỳ.' thành câu có nguồn AHA 2025 (5 vỗ lưng xen 5 ấn bụng, lặp tới khi dị vật ra hoặc nạn nhân bất tỉnh) và dẫn trực tiếp heart.org/AHA Part 7/Part 6 (DOI 10.1161/CIR.0000000000001369 và CIR.0000000000001370); hoặc bỏ gán nguồn 115."
  - "Step 1: gắn nhãn 'suy ra từ hướng dẫn AHA/ERC' hoặc dẫn nguồn AHA cho 'còn ho thì để tự ho'; xóa câu 'vỗ sai lúc có thể đẩy dị vật vào sâu hơn' khỏi Bẫy 1 (nguồn nói về máy hút) hoặc dẫn nguồn khác."
  - "Step 2: thêm 'cho người đó cúi người ra trước' (AHA/ERC) và 'gọi 115 hoặc nhờ người gọi ngay' vào tldr/steps."
  - "Step 5/tldr: 'bất tỉnh không thở được: ép tim ngay' (thêm điều kiện theo quote 115). Bẫy 2: bỏ cụm 'Hướng dẫn nói ...' hoặc chỉ giữ 'vùng trên rốn'."

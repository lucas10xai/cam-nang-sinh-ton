    severity: warn
  - issue: "Bẫy 2 ('đặt nắm tay quá cao lên xương ức hoặc quá thấp xuống bụng dưới ... Hướng dẫn nói ...') và Bẫy 1 ('vỗ sai lúc có thể đẩy dị vật vào sâu hơn') được viết như lời của hướng dẫn nhưng nguồn chỉ nói 'vùng trên rốn'; hai bẫy này là suy diễn của người soạn."
    severity: warn
  - issue: "Nguồn duy nhất là một bài truyền thông của Trung tâm 115 TP.HCM; chương này yêu cầu đối chiếu AHA/ERC. Chưa có nguồn AHA/ERC/Bộ Y tế mở được trực tiếp trong mục."
    severity: warn
  - issue: "Không có mâu thuẫn số nội bộ: các con số 5 / 5 / 1 tuổi / 115 trong tldr, steps khớp thân bài."
    severity: warn

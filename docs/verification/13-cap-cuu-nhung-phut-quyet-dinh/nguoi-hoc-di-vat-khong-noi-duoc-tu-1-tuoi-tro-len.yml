  basis: "Hướng dẫn y tế không có ngày hiệu lực; trang 115 đăng 5/4/2026 và trích AHA 2025 nên là bản mới. Chưa mở được AHA 2025 (403) nên chưa xác nhận người lớn/trẻ >= 1 tuổi trong văn bản gốc; chưa thấy hướng dẫn mới hơn."

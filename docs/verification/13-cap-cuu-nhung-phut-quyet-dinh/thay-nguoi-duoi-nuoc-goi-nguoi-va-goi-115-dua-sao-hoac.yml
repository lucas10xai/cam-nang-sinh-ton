    quote: Tuyệt đối không nhảy xuống nước nếu không biết bơi. Vì nạn nhân lúc này trong tình trạng hoảng loạn, dễ níu chặt lấy bất cứ thứ gì với được, kể cả người cứu nạn.
    note: ""
  - text: "Người không biết bơi: ném khúc gỗ, phao cho bám; chỉ xuống cứu khi biết bơi"
    source_url: https://bvdklangson.com.vn/y-hoc-thuong-thuc/cach-so-cap-cuu-nguoi-bi-duoi-nuoc.html
    verdict: match
    quote: Nếu không biết bơi ta phải tìm khúc gỗ, phao... ném xuống cho họ bám vào để lên bờ hoặc chạy ngay đi tìm người đến cứu. … Chỉ xuống cứu khi người cứu biết bơi, nếu không biết bơi cần gọi người hỗ trợ hoặc dùng thuyền nếu có để ra cứu.
    note: "Nguồn còn: 'Không nên nhảy xuống vùng nước mà không biết nơi đó nông hay sâu'."
  - text: "Không dốc ngược nạn nhân cho nước ra: mất thời gian hô hấp nhân tạo, nước trong phổi không nhiều"
    source_url: https://bvdklangson.com.vn/y-hoc-thuong-thuc/cach-so-cap-cuu-nguoi-bi-duoi-nuoc.html
    verdict: partial
    quote: Nhiều người thường có thói quen dốc ngược nạn nhân, vác lên vai rồi chạy, đây là hành động hoàn toàn sai vì thứ nhất, nó làm mất thời gian quý giá để hô hấp nhân tạo cứu sống bệnh nhân.
    note: Nguồn nói mất thời gian 'hô hấp nhân tạo' (thổi ngạt) và ép tim; mục viết 'mất thời gian ép tim' — thiếu thổi ngạt. Bài Lạng Sơn dùng tỉ lệ cũ 15/2 và 30/2, viết cho TRẺ.

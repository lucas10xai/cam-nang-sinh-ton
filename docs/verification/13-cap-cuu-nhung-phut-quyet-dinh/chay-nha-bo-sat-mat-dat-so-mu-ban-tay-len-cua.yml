claims:
  - text: Người phát hiện cháy phải báo ngay cho lực lượng PCCC&CNCH, cơ quan Công an hoặc UBND cấp xã gần nhất (Điều 6 khoản 1)
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf
    verdict: match
    quote: Người phát hiện cháy, tình huống cứu nạn, cứu hộ thì báo ngay cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ, cơ quan Công an hoặc Ủy ban nhân dân cấp xã nơi gần nhất.
    note: PDF là ảnh quét (không trích được chữ, không có OCR); đã đọc trực tiếp ảnh trang 5.
  - text: Số điện thoại báo cháy thống nhất cả nước là 114 (Điều 6 khoản 2)
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf
    verdict: match
    quote: Số điện thoại báo cháy, báo tình huống cứu nạn, cứu hộ được quy định thống nhất trong cả nước là 114.
    note: Ảnh trang 5.
  - text: Nhà ở phải bố trí, duy trì lối thoát nạn, lối ra khẩn cấp (Điều 20 khoản 2 điểm b)
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf
    verdict: partial
    quote: Bố trí, duy trì lối thoát nạn, lối ra khẩn cấp hoặc lối đi bảo đảm việc thoát nạn.
    note: Ảnh trang 17. Khoản 2 áp dụng cho 'Nhà ở không thuộc loại hình quy định tại khoản 3 và khoản 4'; mục bỏ điều kiện áp dụng.
  - text: Khi di chuyển phải thấp người hoặc bò, men theo tường
    source_url: https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm
    verdict: match
    quote: Khi di chuyển cần thấp người (như cúi khom hoặc bò) và men theo tường.
    note: Nguồn nói 'cúi khom hoặc bò'; tiêu đề/step ghi 'bò sát đất'.
  - text: Kiểm tra nhiệt độ cửa trước khi mở; mở thì tránh mặt sang một bên; cửa quá nóng tuyệt đối không mở, tìm lối thoát khác
    source_url: https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm
    verdict: match
    quote: Khi mở cửa cần mở cửa cần kiểm tra nhiệt độ của cửa; khi mở cần tránh mặt, tránh người sang một bên đề phòng lửa tạt. Nếu nhiệt độ cửa quá cao, tuyệt đối không được mở cửa và tìm ngay lối thoát khác.
    note: ""
  - text: Dùng mu bàn tay kiểm tra độ nóng của cửa
    source_url: https://congan.hatinh.gov.vn/tdpl/he-thong-van-ban-phap-luat/nhung-ky-nang-vang-de-thoat-hiem-khi-chay-nha_1684048203.caht
    verdict: match
    quote: Chỉ cho trẻ cách dùng mu bàn tay để kiểm tra độ nóng của cửa trước khi mở và sử dụng một lối thoát nạn khác nếu cửa bị nóng.
    note: Nguồn Công an Hà Tĩnh (dạy trẻ), không phải bài của Cục; bài Cục chỉ nói 'kiểm tra nhiệt độ của cửa'.
  - text: Không dùng thang máy; không quay lại lấy tài sản
    source_url: https://congan.khanhhoa.gov.vn/vi/cong-an-tinh-khanh-hoa-khuyen-cao-an-toan-phong-chay-chua-chay-va-cuu-nan-cuu-ho-dip-le-quoc-khanh
    verdict: match
    quote: không chen lấn, không sử dụng thang máy và không quay lại khu vực cháy để lấy tài sản.
    note: ""
  - text: Không bao giờ quay lại ngôi nhà đang cháy sau khi đã ra
    source_url: https://congan.hatinh.gov.vn/tdpl/he-thong-van-ban-phap-luat/nhung-ky-nang-vang-de-thoat-hiem-khi-chay-nha_1684048203.caht
    verdict: match
    quote: Dạy trẻ không bao giờ được quay lại bên trong một ngôi nhà đang cháy một khi chúng đã thoát nạn được ra ngoài.
    note: ""
  - text: Đi thang bộ (steps[2])
    source_url: https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm
    verdict: inference
    note: Bài Cục chỉ nói theo đèn EXIT/loa chỉ dẫn; 'đi thang bộ' suy ra từ 'không thang máy'.
  - text: "Không xuống được: đóng cửa, chặn khe, gọi 114 báo vị trí (steps[4])"
    source_url: https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm
    verdict: not-found
    quote: Nếu không có lối thoát khác hoặc không thể ra cửa, hay nhanh chóng di chuyển ra ban công, cửa sổ và hô to, ra hiệu bằng dùng đồ vật sáng màu. Gọi điện thoại báo cho Cảnh sát PCCC&CNCH số 114 hoặc báo cho người thân.
    note: Nguồn Cục KHÔNG có 'đóng cửa, chặn khe'; có 'ra ban công/cửa sổ, hô to, ra hiệu đồ vật sáng màu' và 'Tuyệt đối không nhảy từ tầng quá cao'. Đóng cửa/chặn khe là khuyến cáo phổ biến nhưng ngoài nguồn dẫn.
  - text: Gọi 114 sau khi ra được (steps[3])
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf
    verdict: partial
    quote: Người phát hiện cháy, tình huống cứu nạn, cứu hộ thì báo ngay cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ…
    note: "Luật và Cục: báo ngay/đồng thời hô hoán; steps xếp 'Gọi 114' sau 'ra được rồi'."
  - text: Bản hợp nhất còn hiệu lực
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf
    verdict: match
    quote: "Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ số 55/2024/QH15 ngày 29 tháng 11 năm 2024 của Quốc hội, có hiệu lực kể từ ngày 01 tháng 7 năm 2025, được sửa đổi, bổ sung bởi: 1. Luật số 118/2025/QH15 ngày 10 tháng 12 năm 2025 của Quốc hội sửa đổi, bổ sung một số điều của 10 luật có liên quan đến an ninh, trật tự, có hiệu lực kể từ ngày 01 tháng 7 năm 2026;"
    note: Ảnh trang 1. Điều 6 không có chú thích sửa đổi ở trang 5.

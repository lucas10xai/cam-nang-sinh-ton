validity:
  doc: "QĐ 1904/QĐ-BYT ngày 30/5/2014 (Hướng dẫn quy trình kỹ thuật chuyên ngành Hồi sức cấp cứu và chống độc); BV Nhi TW 2/6/2023; ERC Guidelines 2025 Paediatric Life Support"
  in_force: unconfirmed
  effective_from: "2014-05-30"
  amended_by: []
  basis: "Trang bìa PDF xác nhận số/ngày. Nội dung dẫn AHA 2005 và 2010 (tài liệu tham khảo), cũ hơn ERC 2025 và AHA 2020/2025. Chưa kiểm vbpl.vn/moh.gov.vn xem QĐ 1904 có bị thay thế không."
deliberate_vn_deviation:
  - "QĐ 1904: tần số '100 lần/phút', kỹ thuật nhũ nhi '2 ngón tay' (người cứu không chuyên/1 người), sau 2 lần thổi ngạt kiểm tra mạch. ERC 2025 PLS: 100-120/phút, 'two-thumb encircling technique ... recommended for all situations' (đã đổi so với 2021), 5 nhịp thổi đầu, không bắt kiểm mạch. Mục theo bài BV Nhi TW (5 nhịp, 100) nhưng bỏ phần kỹ thuật tay."
  - "QĐ 1904: tiêu chí 15:2 là 'có từ 2 người'; ERC 2025: tiêu chí là người cứu được huấn luyện PBLS (còn lại 30:2)."
potential_harm:
  - "Mục không nêu kỹ thuật tay cho nhũ nhi (hai ngón cái ôm ngực theo ERC 2025/QĐ 1904 'nên'; hoặc hai ngón tay khi một người). Nguồn bài đuối nước viết 'một tay đặt vuông góc với lồng ngực': người đọc làm theo cả bàn tay lên ngực nhũ nhi có thể ép sai vị trí/quá sâu (ERC: không quá 6 cm) hoặc sai tay."
  - "'Khoảng 100 lần mỗi phút' và 'Ai đếm nhịp chậm hơn con số 100' thấp hơn 100-120 của nguồn BV Nhi TW và ERC; người đếm nhịp 80-99 vẫn nghĩ đạt."
  - "steps[4] 'có từ hai người trở lên thì dùng 15:2': ERC 2025 chỉ cho 15:2 nếu được huấn luyện PBLS; người không được huấn luyện nên dùng 30:2. Đảo thành 15:2 làm giảm số lần ép tim/phút của người cứu không chuyên."
  - "Không có bước kiểm tra phản ứng/thở nên người đọc có thể ép tim trẻ đang thở yếu nhưng còn thở, hoặc không bắt đầu vì không biết thở ngáp = không thở."
suggested_edits:
  - "tldr, steps[3], Nói dễ hiểu, Ghi chú: thống nhất 'ấn sâu ít nhất 1/3 bề dày ngực (khoảng 4 cm ở nhũ nhi), 100 đến 120 lần mỗi phút'; xóa 'trên 100' và 'khoảng 100'. Dựa vào quote nguồn BV Nhi TW ('Tốc độ ép tim 100 -120 lần/phút') và ERC 2025."
  - "steps[3]: thêm kỹ thuật cho nhũ nhi: 'hai ngón cái ôm ngực (nếu có thể) hoặc hai ngón tay; ép ngay dưới đường ngang hai núm vú, nửa dưới xương ức'. Dựa vào QĐ 1904 (đoạn 'Trẻ nhũ nhi') và ERC 2025."
  - "steps[4]: đổi tiêu chí 15:2 thành 'nếu có hai người cứu được huấn luyện' hoặc chỉ nêu 30:2 cho người không chuyên; dẫn ERC 2025 và QĐ 1904 ('có thể áp dụng')."
  - "Thêm bước đầu: kiểm tra phản ứng (vỗ nhẹ lòng bàn chân/gọi), nhìn ngực, thở ngáp = không thở (dựa vào bài BV Nhi TW bước 3) và ghi rõ 5 nhịp thổi đầu bắt nguồn từ hướng dẫn đuối nước/ERC, QĐ 1904 ghi 2 lần."
  - "Nguồn/Pháp luật: sửa 'tr. 267-270' và tên quy trình thành 'Quy trình kỹ thuật ép tim ngoài lồng ngực (mục lục tr. 257; trang in 268-270)' và thêm quy trình tr. 371-373; ghi rõ QĐ 1904 dựa AHA 2005/2010."
  - "Bẫy 1: bỏ 'trẻ ngừng tim thường vì thiếu oxy trước' hoặc gắn 'suy ra'; thêm 'nếu không thể/không muốn thổi ngạt, vẫn ép tim liên tục còn hơn không làm gì' (ERC 2025: compression-only CPR)."

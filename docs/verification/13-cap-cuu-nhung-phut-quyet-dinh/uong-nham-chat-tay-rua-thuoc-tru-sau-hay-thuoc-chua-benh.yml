validity:
  doc: "BV Nhi Trung ương 'Ngộ độc thuốc và hóa chất tại nhà' (không rõ ngày); BV Mắt Hà Nội 'Cấp cứu bỏng hóa chất tại mắt' (02/05/2026); BV Bạch Mai 25 năm Trung tâm Chống độc (02/12/2023)"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. Bài BV Nhi TW trang tôi mở không hiện ngày đăng (không đối chiếu được mới/cũ). Poison Control (Mỹ) hiện hành: 'Do not induce vomiting. Ipecac syrup is no longer recommended' => nguồn Nhi TW khuyến cáo gây nôn lệch hướng dẫn quốc tế hiện hành."
deliberate_vn_deviation:
  - "BV Nhi TW (VN): gây nôn bằng ngón tay ở trẻ tỉnh táo, chưa nôn, trừ hôn mê/co giật/chất ăn mòn/xăng dầu. Poison Control (Mỹ): 'Do not induce vomiting. Ipecac syrup is no longer recommended.' Mục chọn theo hướng quốc tế (không gây nôn) nhưng không nói rõ rằng nguồn VN lệch; cần ghi nhận trong thân."
  - "Poison Control: uống một ít nước/sữa ngay nếu chất nuốt gây rát/ăn mòn và người tỉnh/nuốt được; BV Nhi TW: cho uống Oresol sau nôn. Mục: 'Không cho uống sữa hay nước' vô điều kiện."
  - "Poison Control: gọi trung tâm chống độc (1-800-222-1222 ở Mỹ) ngay cả khi không có triệu chứng; VN không có số trung tâm chống độc quốc gia được nguồn nêu (mục thừa nhận)."
potential_harm:
  - "steps[0]/tldr: 'không cho uống sữa hay nước' vô điều kiện: với chất gây rát/ăn mòn mà người còn tỉnh, nuốt được, hướng dẫn quốc tế (Poison Control) là uống ngay một ít nước hoặc sữa; người làm đúng nguyên văn bỏ qua bước pha loãng sớm (mức nhẹ-vừa; nên nêu điều kiện, nghe theo tư vấn trung tâm chống độc)."
  - "steps[2] 'đưa ngay tới cơ sở có chống độc, không dừng ở trạm y tế xã': người ở xa cơ sở chống độc có thể đi một quãng dài không được hỗ trợ đường thở/hô hấp, hoặc bỏ qua cơ sở gần nhất mà BV Nhi TW khuyên ('cơ sở y tế gần nhất'), làm chậm cứu chữa; bước này không có nguồn. Đặc biệt với thuốc trừ sâu photpho hữu cơ cần xử trí tại chỗ nhanh."
  - "steps[0] 'Không móc họng cho nôn': an toàn hơn hướng dẫn BV Nhi TW; không có hại nhưng khác nguồn trích; cần ghi rõ để người đọc không bối rối khi thấy bài của bệnh viện."
  - "steps[4]/Nói dễ hiểu: 'với mắt thì phải banh mi ra rửa' khác nguồn (BV Mắt: 'lộn mi trên và dưới'; BV Nhi TW: ngụp mặt vào chậu nước và chớp mắt liên tục); người không biết cách lộn mi có thể tự gây tổn thương mắt đã bỏng hóa chất."
suggested_edits:
  - "steps[0]/tldr: đổi thành 'Không móc họng cho nôn (nhất là với chất ăn mòn, xăng dầu, người li bì/co giật). Chỉ cho uống một ít nước hoặc sữa nếu người tỉnh táo, nuốt được và chất nuốt gây rát; còn lại hỏi ý kiến cơ sở chống độc/115.' Dựa Poison Control: 'Drink a small amount of water or milk immediately if...' và BV Nhi TW: 'tuyệt đối không gây nôn ... hóa chất có tính chất ăn mòn như axit, bazơ, xăng dầu'. Nói rõ trong thân: bài BV Nhi TW còn cho gây nôn ở trẻ tỉnh, nhưng hướng dẫn quốc tế hiện nay không khuyến cáo (Poison Control: 'Do not induce vomiting')."
  - "steps[2]: sửa thành 'Gọi 115 hoặc đưa ngay tới cơ sở y tế gần nhất (nguồn BV Nhi TW); nếu có thể, hỏi để chuyển tuyến tới cơ sở chống độc' và bỏ câu 'không dừng ở trạm y tế xã' cùng Bẫy 3 hoặc gắn nguồn cụ thể (văn bản/hướng dẫn Bộ Y tế về chuyển tuyến ngộ độc)."
  - "tldr/Nói dễ hiểu: tách 'mắt rửa ít nhất 15 đến 30 phút (BV Mắt HN)' khỏi 'da rửa liên tục dưới vòi nước sạch (BV Nhi TW)'; nếu giữ '15 phút' cho da thì bổ sung nguồn (Poison Control: 'rinse for at least 15 minutes')."
  - "steps[4]: thay 'banh mi ra' bằng cách BV Nhi TW cho trẻ ('ngụp mặt vào chậu nước, chớp mắt liên tục, nhỏ nước muối sinh lý') hoặc 'mở mi ra, xối nước' kèm 'tháo kính áp tròng (Poison Control)'."
  - "Bỏ 'Liều gây chết của thuốc trừ sâu photpho hữu cơ tính bằng miligam' và các nhắc 'thuốc trừ sâu' nếu không bổ sung nguồn về xử trí thuốc trừ sâu (hoặc thêm nguồn Bộ Y tế/Trung tâm Chống độc Bạch Mai cho nhóm này); ghi rõ nguồn BV Nhi TW viết cho trẻ em."

claims:
  - text: "Gọi cấp cứu 115 hoặc đưa ngay tới cơ sở y tế; mang theo thuốc/hóa chất nghi ngờ"
    source_url: https://benhviennhitrunguong.gov.vn/ngo-doc-thuoc-va-hoa-chat-tai-nha-tai-nan-thuong-gap-o-tre-nho-nhung-hau-qua-khon-luong.html
    quote: "Gọi cấp cứu 115 hoặc nhanh chóng đưa trẻ tới ngay cơ sở y tế gần nhất. Lưu ý: Khi đi cha mẹ nhớ cầm theo thuốc hoặc hóa chất nghi ngờ gây ngộ độc cho trẻ, điều này sẽ giúp cho bác sĩ gợi ý được nguyên nhân và có phương án giải độc phù hợp."
    verdict: match
    note: "Nguồn nói 'cơ sở y tế gần nhất' (không nói 'cơ sở có chống độc'); step 3 của mục viết 'đưa ngay tới cơ sở có chống độc, không dừng ở trạm y tế xã' là bổ sung không có trong nguồn (xem claim dưới). Nguồn nói về TRẺ em; mục viết chung cho mọi người."
  - text: "steps[0]/tldr: 'Không móc họng cho nôn' (vô điều kiện)"
    source_url: https://benhviennhitrunguong.gov.vn/ngo-doc-thuoc-va-hoa-chat-tai-nha-tai-nan-thuong-gap-o-tre-nho-nhung-hau-qua-khon-luong.html
    quote: "Nếu thấy trẻ tỉnh táo, chưa bị nôn trớ, còn phản ứng tốt, cha mẹ dùng ngón tay của mình (tốt nhất nên quấn thêm miếng gạc mềm, sạch) kích thích vào vùng sàn họng trẻ (chỗ lưỡi gà), giúp trẻ có thể nôn để loại bớt chất độc hại ra ngoài cơ thể."
    verdict: mismatch
    note: "Nguồn chính của mục (BV Nhi TW) KHUYẾN CÁO gây nôn bằng ngón tay ở trẻ tỉnh táo, chưa nôn, nhiều trường hợp; chỉ chống chỉ định khi hôn mê/li bì/co giật/nghi chất ăn mòn/xăng dầu: 'Cha mẹ tuyệt đối không gây nôn cho trẻ trong trường hợp trẻ hôn mê, li bì, co giật hoặc nghi ngờ uống phải các hóa chất có tính chất ăn mòn như axit, bazơ, xăng dầu,…'. Mục đã chép đúng phần chống chỉ định ở 'Lợi ích' nhưng KHÔNG nêu phần khuyến cáo gây nôn, rồi viết 'Không móc họng cho nôn' vô điều kiện ở tldr/steps và Ghi chú tuyên bố 'đọc được nguyên văn' trong bài. Hướng dẫn quốc tế phản đối gây nôn tại nhà: Poison Control (Mỹ): 'Do not induce vomiting. Ipecac syrup is no longer recommended.' Mục đi theo hướng quốc tế an toàn hơn nhưng trình bày như thể nguồn VN nói vậy; ghi sai lệch nguồn cần được nêu minh bạch (deliberate_vn_deviation)."
  - text: "Chống chỉ định gây nôn khi chất độc là chất ăn mòn, chất bay hơi (xăng dầu), hôn mê hoặc co giật"

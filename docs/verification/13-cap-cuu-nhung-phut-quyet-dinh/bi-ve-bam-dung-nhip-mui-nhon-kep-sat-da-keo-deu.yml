validity:
  doc: "Quyết định 5642/QĐ-BYT ngày 31/12/2015 của Bộ Y tế (Hướng dẫn chẩn đoán và điều trị một số bệnh truyền nhiễm), chương Bệnh sốt mò"
  in_force: unconfirmed
  effective_from: "2015-12-31"
  amended_by: []
  basis: "PDF tại kcb.vn tải được (86 trang; trang bìa ghi 'Ban hành kèm theo Quyết định số 5642/QĐ-BYT ngày 31/12/2015'; chương sốt mò ở mục 10, trang 60-63). Chưa tìm được văn bản sửa đổi/thay thế cũng chưa xem được bảng hiệu lực trên Công báo/vbpl, nên không kết luận còn hiệu lực. Hướng dẫn CDC về ve (trang đề 9/6/2026) là bản hiện hành."
deliberate_vn_deviation: []
potential_harm:
  - "Bước 5/tldr: 'Sốt trong ba tuần sau thì báo bác sĩ'. CDC khuyên báo bác sĩ khi có phát ban hoặc sốt trong vài tuần. Người bị ve cắn chỉ có phát ban (ví dụ ban đỏ lan rộng, thường gặp ở bệnh Lyme) hoặc khởi phát sau tuần thứ ba có thể không đi khám vì nghĩ chưa đến hạn hoặc không sốt, làm chậm chẩn đoán/điều trị bệnh do ve."
  - "Phần 'Lợi ích'/'Pháp luật Việt Nam' đưa phác đồ kháng sinh của sốt mò (doxycyclin, azithromycin kèm liều) trong mục dành cho ve bám, dễ khiến người đọc tự uống kháng sinh sau khi bị ve cắn; không có căn cứ rằng đó là dự phòng cho ve."
suggested_edits:
  - "Viết lại cơ sở bằng chứng cho đúng đối tượng: thay mục Nguồn và legal_refs bằng hướng dẫn gắp ve của CDC (cdc.gov/ticks/after-a-tick-bite/index.html, quote: 'Pull tick away from the skin with steady, even pressure. Don't twist or jerk the tick.') và nguồn VN về bệnh do ve (nếu có). Chuyển toàn bộ phần sốt mò sang mục riêng (ấu trùng mò) hoặc xóa khỏi mục này."
  - "Bước 5 và tldr: đổi 'Sốt trong ba tuần' thành 'Có ban hoặc sốt trong vài tuần sau khi gắp ve, báo bác sĩ: nói rõ ngày và nơi bị ve cắn', dựa vào quote 'If you develop a rash or fever within several weeks of removing a tick, see your doctor'."
  - "Bước 1: thêm 'nếu phần miệng còn lại và không gắp dễ dàng bằng nhíp thì để nguyên' và 'không chờ đến cơ sở y tế mới gắp' (CDC: 'Do not wait to go to a healthcare provider to remove the tick')."
  - "Xóa 'dưới vú' khỏi Bẫy 3 hoặc thay bằng 'nách, ngực, cổ, bẹn, bụng' đúng văn bản."
  - "Bỏ phần liều doxycyclin/azithromycin khỏi mục này, hoặc ghi rõ đây là điều trị sốt mò đã chẩn đoán, không tự dùng."
  - "Bẫy 1: bỏ 'cồn' khỏi danh sách chất không được dùng để ép ve nhả, hoặc dẫn nguồn; tách rõ 'dịch từ ve đẩy vào da' với 'phần miệng gãy do xoay/giật'."

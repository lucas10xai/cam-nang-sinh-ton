deliberate_vn_deviation:
  - "Mức khẩn: NHS và thực hành quốc tế coi glôcôm góc đóng cấp là cấp cứu xử trí ngay (đến A&E/gọi xe cấp cứu, không tự lái xe); mục dùng 'ngay trong ngày'. Không thấy VN nguồn ghi 'trong ngày'; đây là lệch do người soạn."
potential_harm:
  - "'Đi khám mắt ngay trong ngày' (tiêu đề, tldr, steps[0]) có thể khiến người bệnh trì hoãn nhiều giờ; glôcôm góc đóng cấp gây tổn thương thị thần kinh không hồi phục (chính tài liệu: 'không có khả năng hồi phục'), NHS xếp là cấp cứu xử trí ngay."
  - "Mục không dặn tránh tự lái xe khi đang đau, nhìn mờ vì cơn cấp (NHS: 'Do not drive to A&E')."
suggested_edits:
  - "Tiêu đề, tldr, steps[0]: đổi 'ngay trong ngày' thành 'ngay (đi cấp cứu mắt, không chờ)'; nếu xa bệnh viện mắt thì tới khoa cấp cứu/mắt gần nhất. Dựa vào quote NHS 'This is a medical emergency that may require immediate treatment' và QĐ 40 'Tích cực, khẩn trương làm hạ nhãn áp'."
  - "Thêm vào steps: nhờ người chở, không tự lái xe khi nhìn mờ, đau dữ dội (NHS 'Do not drive to A&E')."
  - "steps[1] và Bẫy 2: bỏ khẳng định 'không chườm nóng' như thể là chữ của QĐ 40, hoặc ghi rõ là lời dặn thận trọng; sửa 'nhỏ thuốc giảm đau' thành 'tự nhỏ thuốc mua sẵn'."
  - "Mục 'Lợi ích': thêm câu 'Các thuốc dưới đây do bác sĩ chỉ định và theo dõi, không tự dùng'; nêu đủ 'chẹn bêta... thận trọng nếu có bệnh phổi, tim, mạch' và 'acetazolamid chỉ dùng chờ phẫu thuật, bổ sung kali'."
  - "Bẫy 1: sửa 'dấu hiệu quyết định là mắt đỏ, nhãn áp tăng rất cao' thành 'tiêu chuẩn chẩn đoán là thị lực giảm nhiều, nhãn áp cao, đồng tử giãn méo, góc tiền phòng đóng'."
  - "Chi phí: bỏ 'vài trăm nghìn' và 'BHYT trả một phần' hoặc dẫn nguồn giá/BHYT."

validity:
  doc: Bạch Mai (27/05/2014), BV TWQĐ 108, Báo Chính phủ/Bộ Y tế — hướng dẫn chuyên môn, không phải văn bản pháp luật
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Bài Bạch Mai đăng 2014 (tham chiếu NEJM 2003); CDC trả 403 nên không đối chiếu; chỉ đối chiếu được NHS (heatstroke: recovery position, kiểm tra thở/mạch, CPR; gọi 999 nếu còn mệt sau 30 phút)."
deliberate_vn_deviation:
  - "Bạch Mai/108 (nước ấm + quạt, hoặc nước 25–30 độ) và Báo CP/Bộ Y tế (nước mát) khác nhau; NHS: 'Wrap the person in a cool, wet sheet, or fan them or sponge them down with cold water while you wait for help to arrive.' Nguồn VN cho uống khi tỉnh; NHS cho sốc nhiệt: gọi 999 và làm mát, không hướng dẫn uống."
potential_harm:
  - "Hôn mê/lú lẫn: mục chỉ bảo 'đặt nằm nghiêng… gọi 115', không bảo kiểm tra thở/mạch và ép tim nếu không thở bình thường (NHS + BV 108 bài B đều có). Người ngừng tuần hoàn có thể bị chậm ép tim."
  - "Phân tầng gọi 115 quá hẹp (chỉ lú lẫn/co giật/hôn mê); theo nguồn Bộ Y tế buồn nôn/nôn, đau đầu dữ dội, khó thở, yếu liệt đã là mức nặng; NHS: còn mệt sau 30 phút làm mát → gọi cấp cứu. Người đọc theo tiêu đề 'chóng mặt buồn nôn' có thể chờ tại chỗ thay vì gọi."
  - "Say nắng là cấp cứu mà tiên lượng phụ thuộc thời gian (Bạch Mai: 'Tiên lượng xấu tỉ lệ với thời gian từ lúc tăng thân nhiệt tới lúc được điều trị'); mục không có ngưỡng thời gian/dấu hiệu rõ để gọi 115 ngay."
suggested_edits:
  - "steps[3] và tldr: tách 'gọi 115 ngay' khi có BẤT KỲ dấu hiệu nặng theo nguồn Bộ Y tế (buồn nôn/nôn, đau đầu dữ dội, khó thở, lú lẫn, co giật, ngất/hôn mê) hoặc còn mệt sau ~30 phút làm mát (NHS)."
  - "steps[3] thêm: 'Nếu bất tỉnh và không thở bình thường: ép tim ngoài lồng ngực (xem mục 01), không chỉ đặt nằm nghiêng' — dựa vào NHS ('carry out CPR if they show no sign of life') và 108 bài B."
  - "Mục Nguồn: thay URL 108 hoặc thêm URL bài 'Say nắng, say nóng vẫn là những vấn đề cấp thiết…' làm nguồn của câu 'uống khi tỉnh táo'."
  - "Sửa Bẫy 2: bỏ 'Cả ba hướng dẫn'; chỉ ghi hai nguồn (báo CP, BV 108 bài B)."
  - Thống nhất nhiệt độ nước làm mát; ghi Bạch Mai viết 'nước ấm' (2014) và bất đồng 'chườm đá' giữa các nguồn VN.
  - Thêm ghi chú tổng đài 113 (Thông tư 42/2026/TT-BYT, hiệu lực 01/11/2026) khi chốt cách ghi số cấp cứu toàn chương.

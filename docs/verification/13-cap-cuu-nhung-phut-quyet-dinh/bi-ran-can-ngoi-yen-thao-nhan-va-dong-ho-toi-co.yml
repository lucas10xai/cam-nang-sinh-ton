validity:
  doc: "Quyết định 5152/QĐ-BYT ngày 12/12/2014 (Hướng dẫn chẩn đoán và điều trị rắn lục xanh đuôi đỏ cắn); đối chiếu WHO SEARO Guidelines for the Management of Snakebites, 2nd ed., 2016"
  in_force: unconfirmed
  effective_from: "2014-12-12"
  amended_by: []
  basis: "Không mở được văn bản Quyết định gốc; thuvienphapluat chỉ trả khung (ngày hiệu lực 'Đã biết'). Bản đăng lại Quảng Trị 2020 vẫn dùng. QĐ đã 12 năm tuổi, trước WHO SEARO 2016 (khuyến cáo pressure-pad/băng ép bất động cho nghi rắn hổ); chưa tra được phiên bản thay thế của Bộ Y tế."
deliberate_vn_deviation:
  - "QĐ 5152 (rắn lục) cho băng ép tương đối chặt/ga-rô tĩnh mạch; WHO SEARO 2016 khuyến cáo pressure-pad hoặc băng ép bất động nếu không loại trừ rắn hổ, và dặn giữ nguyên băng ga-rô nạn nhân đã tự buộc cho tới khi tới cơ sở có hồi sức. Mục không có cả hai."
  - "Mục bổ sung 'hỏi trước cơ sở có huyết thanh' (QĐ nói chuyển viện ngay); WHO nhấn mạnh vận chuyển nhanh tới nơi hồi sức."
potential_harm:
  - "Tldr/steps dạy chung cho mọi rắn, cấm ga-rô và không có băng ép/băng bất động: người bị rắn hổ/cạp nia cắn (độc thần kinh, tiến triển liệt hô hấp nhanh) mất biện pháp làm chậm hấp thu nọc mà WHO khuyến cáo. Cần giới hạn phạm vi hoặc bổ sung nhánh."
  - "Step 4 'Hỏi trước cơ sở nào có huyết thanh' trước khi đi: người đọc có thể mất thời gian gọi điện hoặc bỏ qua bệnh viện gần nhất có khả năng hồi sức (liệt hô hấp, sốc, sốc phản vệ). Nguồn QĐ: 'chuyển ngay'; WHO: tới nơi có thể điều trị 'as quickly ... as possible'. Phải đảo thứ tự: đi ngay (nhờ người gọi trên đường) và đến cơ sở gần nhất có khả năng cấp cứu nếu chưa biết nơi có huyết thanh."
  - "Bẫy 3 nói tuyến huyện 'thường không có' huyết thanh, không nguồn; nếu sai/lạc hậu, dẫn đến bỏ qua cơ sở có sẵn huyết thanh gần hơn."
suggested_edits:
  - "Tiêu đề/tldr: thu hẹp thành 'Bị rắn lục cắn (rắn lục xanh đuôi đỏ)' hoặc thêm câu 'Chưa biết loài: nếu nghi rắn hổ mang/cạp nia, băng ép bất động theo WHO'. Dẫn WHO SEARO 2016 (quote 'Unless the possibility of an elapid bite can confidently be excluded, apply pressure-pad immobilization')."
  - "Steps: thêm bước 'băng ép tại chỗ cắn trở lên gốc chi, tương đối chặt nhưng vẫn sờ thấy mạch' (QĐ 5152) hoặc nêu rõ lý do không dạy; sửa 'không buộc ga-rô' thành 'không ga-rô động mạch chặt' theo quote nguồn."
  - "Step 4: viết lại thành 'đưa đi ngay tới cơ sở cấp cứu gần nhất có khả năng hồi sức; trên đường nhờ người gọi 115/hỏi nơi có huyết thanh' ; xóa 'hỏi trước' làm điều kiện trước khi đi."
  - "Xóa hoặc dẫn nguồn cho: 'ngang tầm tim', 'tuyến huyện thường không có huyết thanh', 'Bạch Mai, Chợ Rẫy', 'có khi qua hai tỉnh'; xóa 'không hút bằng miệng' khỏi lời nguồn hoặc dẫn WHO ('Avoid any interference with the bite wound (incisions, rubbing, vigorous cleaning...)')."
  - "legal_refs: đổi url sang văn bản Quyết định 5152/QĐ-BYT gốc nếu tìm được; nếu không, ghi 'bản đăng lại'. Sửa 'rửa vết thương' kèm 'nhẹ nhàng' theo WHO (tránh chà xát mạnh)."

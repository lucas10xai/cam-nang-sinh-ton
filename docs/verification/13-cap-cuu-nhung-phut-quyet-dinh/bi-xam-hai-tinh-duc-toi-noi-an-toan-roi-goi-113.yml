  - "'Đừng tắm... đừng dọn phòng' vô điều kiện, không nói gì về đi tiểu/uống nước/đánh răng, và không nói người bị hại vẫn có thể tắm nếu không chịu nổi (đừng hiểu ngược chỉ ở cuối)."

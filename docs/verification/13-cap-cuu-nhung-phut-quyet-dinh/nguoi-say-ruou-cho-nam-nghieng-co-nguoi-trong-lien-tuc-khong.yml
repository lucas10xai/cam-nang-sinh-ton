    severity: error
  - issue: "tldr/steps[3] liệt kê 4 dấu hiệu gọi 115, mục Lợi ích 5 dấu hiệu, nguồn có 8. Ba nhóm dấu hiệu bị bỏ (yếu liệt một bên/nói ngọng; nhìn mờ/nhìn đôi; nôn nhiều/đau bụng/chướng) gồm các dấu hiệu gợi ý đột quỵ hoặc ngộ độc methanol."
    severity: error
  - issue: "'Gọi không tỉnh, thở chậm...' dùng '115' còn mục 13-49 (cùng chương) dùng '113 hoặc 115' theo Thông tư 42/2026/TT-BYT hiệu lực 01/11/2026 và nói người dân vẫn gọi được cả 113/114/115. Mục này không nhắc đến 113 nên hai mục lệch nhau."
    severity: warn
  - issue: "Đoạn 'đánh thức vài giờ một lần' dễ bị hiểu là chỉ cần kiểm tra mỗi vài giờ; đã có câu 'trông liên tục' nhưng steps[2] đặt hai việc cạnh nhau, cần nói rõ: người trông phải để ý hơi thở liên tục, còn đánh thức là kiểm tra thêm."
    severity: warn
  - issue: "Phần Nguồn ghi 'Tra ngày 3/11/2026' đã đúng mốc; con số 200-400 mg/dL có trong thân, không có số nào trong tldr/steps vắng mặt trong thân."
    severity: warn
validity:
  doc: "Bệnh viện Bạch Mai, Trung tâm chống độc (03/02/2017), bài báo y học thường thức; Trung tâm cấp cứu 115 TP.HCM (trang liên hệ)"
  in_force: unconfirmed
  effective_from: "2017-02-03"
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. Bài Bạch Mai ban hành 03/02/2017 (9 năm trước), thực chất là bài báo lại từ Dân trí, không phải văn bản hướng dẫn chính thức của Bộ Y tế. NHS (rà soát 04/06/2026) khuyên gọi 999 ngay khi nghi ngộ độc rượu, ngưỡng thấp hơn mục này. Không tìm được hướng dẫn mới hơn của Bộ Y tế/AHA/ERC về người say rượu."
deliberate_vn_deviation:
  - "Bạch Mai: đưa đi viện khi có 1 trong 8 dấu hiệu; NHS: gọi 999 khi nghi ngộ độc rượu, và dặn không cho ăn (Bạch Mai dặn cho ăn cháo loãng nếu tỉnh). Mục này theo Bạch Mai và còn thêm câu trông tại nhà nếu còn tỉnh (suy ra)."
  - "Bạch Mai dặn 'nghiêng sang bên phải'; ERC/AHA chỉ cần tư thế nằm nghiêng có miệng thấp, không quy định bên."
potential_harm:
  - "steps[0] 'đầu kê cao': nếu người đọc kê gối cao cho người say đang buồn ngủ/bất tỉnh, cổ có thể gập và làm tắc đường thở; nguồn không có chi tiết này."
  - "tldr/steps[3] bỏ các dấu hiệu nhìn mờ/nhìn đôi, yếu liệt một bên, nói ngọng, nôn nhiều/đau bụng: người nhà có thể 'trông tại nhà' khi thực ra là ngộ độc rượu giả pha methanol hoặc đột quỵ/chấn thương đầu."
  - "Ghi chú 'người còn tỉnh, gọi dậy được, thở đều thì trông tại nhà' là suy ra, không có nguồn; NHS khuyên gọi cấp cứu ngay khi nghi ngộ độc rượu."
suggested_edits:
  - "Xóa 'đầu kê cao' ở steps[0], 'Nói dễ hiểu' và mục Lợi ích (căn cứ: bài Bạch Mai chỉ nói nằm nghiêng sang bên phải)."
  - "Thêm đủ 8 dấu hiệu của Bạch Mai vào mục Lợi ích và rút gọn vào steps[3]/tldr, ít nhất: yếu liệt một bên hoặc nói ngọng khi tỉnh, nhìn mờ/nhìn đôi, nôn nhiều/đau bụng (căn cứ: danh sách 8 biểu hiện của Bạch Mai)."
  - "Thêm hướng dẫn khi co giật: giữ nằm nghiêng, không nhét vật vào miệng (căn cứ: quote co giật của Bạch Mai)."
  - "Đổi câu 'phải trông tại nhà' ở Ghi chú thành ghi nhãn 'suy ra' hoặc bỏ, và thêm 'nghi ngộ độc rượu thì gọi cấp cứu' theo NHS; ghi vào Ghi chú sự khác biệt với NHS."
  - "Sửa steps[2] 'Đắp chăn, nhất là nơi lạnh hoặc mở cửa sổ' thành 'Đắp chăn, tránh để nơi lạnh' (căn cứ: NHS 'keep them warm')."
  - "Thống nhất cách ghi số cấp cứu giữa 13-46 và 13-49 (113/115)."

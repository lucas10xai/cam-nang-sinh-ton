result: pass-with-edits
claims:
  - text: "Đặt người say nằm nghiêng sang bên phải (tư thế nghiêng an toàn) để dẫn lưu đờm dãi, hạn chế hít vào phổi khi nôn"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "sau khi uống rượu, bị say cần đặt người say nằm nghiêng sang bên phải. Đây là tư thế nghiêng an toàn, có tác dụng dẫn lưu đờm dãi ra ngoài, hạn chế nguy cơ hít vào phổi, đặc biệt trong trường hợp bệnh nhân bị nôn."
    verdict: match
    note: "Nguồn trong nước. ERC/AHA không bắt buộc phải là bên phải (chỉ cần nằm nghiêng, miệng thấp); không gây hại."
  - text: "Cứ vài giờ đánh thức người say dậy để tránh hôn mê mà không biết"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "Trong khi để bệnh nhân nằm nghiêng, cứ vài giờ phải đánh thức bệnh nhân dậy, tránh bị hôn mê mà không biết."
    verdict: match
    note: ""
  - text: "Đặt nằm nghiêng sang phải, ĐẦU KÊ CAO (steps[0], Nói dễ hiểu, và gán cho Bạch Mai ở mục Lợi ích)"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "Không có câu nào trong bài Bạch Mai nói 'đầu kê cao'; bài chỉ nói 'đặt người say nằm nghiêng sang bên phải'."
    verdict: not-found
    note: "Chi tiết 'đầu kê cao' do người soạn thêm. NHS còn nói 'sit them up if they're awake, or put them in the recovery position if they've passed out' - không có kê gối cho người bất tỉnh. Với người say sắp mất ý thức, gối kê cao có thể gập cổ, làm tắc đường thở."
  - text: "Dấu hiệu phải đưa vào viện: bất tỉnh, co giật, thở khò khè/ứ đờm/thở yếu/không đều/chậm, da môi móng tím hoặc nhợt lạnh, đái ỉa ra quần"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "- Tê, yếu chân tay một bên chân tay hoặc một bên mặt, nói ngọng trong khi đã tỉnh táo. ... - Nhìn mờ, nhìn một vật thành hai. - Nôn nhiều, đau bụng, bụng chướng."
    verdict: partial
    note: "Nguồn có 8 dấu hiệu; mục chỉ nêu 5 (bất tỉnh, co giật, thở, da tím, đái ỉa). Thiếu: tê/yếu một bên hoặc nói ngọng khi tỉnh (đột quỵ/chấn thương đầu), nhìn mờ/nhìn đôi (dấu hiệu gợi ý ngộ độc methanol, nguồn nhắc rượu giả), nôn nhiều/đau bụng/chướng bụng, đái ít. tldr và steps[3] chỉ có 4 dấu hiệu nên người đọc có thể bỏ sót."
  - text: "Co giật: gọi 115; nguồn dặn khi co giật giữ nằm nghiêng, không để va đập, không cho vật cứng vào miệng, thở yếu/tím tái thì hô hấp nhân tạo"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "Co giật. Khi bệnh nhân bị co giật, giữ tư thế nằm nghiên an toàn. Không để người bệnh ngã hoặc va đập vào các vật cứng, không cho các vật cứng vào miệng. Quan sát kỹ người bệnh, nếu thở yếu, ngừng thở hoặc tím tái thì hô hấp nhân tạo."
    verdict: partial
    note: "Mục chỉ ghi 'co giật thì gọi 115', bỏ hướng dẫn trong lúc chờ (không nhét vật vào miệng, nằm nghiêng). Nguồn chỉ nói 'đưa đến cơ sở y tế', không nói 'gọi 115'; việc gọi 115 là suy ra hợp lý."
  - text: "Mức cồn trong máu 200 đến 400 mg/dL đã gây ức chế hô hấp, thở yếu, giảm thân nhiệt và hôn mê"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "Từ 200 – 400mg/dL, người say bị ức chế hô hấp, thở yếu, thở chậm, ngừng thở, thở khò khè, ứ đọng đờm dãi, ho hoặc khạc yếu, giảm thân nhiệt (da lạnh), đái ỉa ra quần, tụt huyết áp, hôn mê."
    verdict: match
    note: "Bài ghi 'nồng độ rượu trong máu', đơn vị mg/dL, đúng như mục."
  - text: "Đắp chăn cho người say, nhất là nơi lạnh; người say nằm nơi lạnh dễ hạ thân nhiệt"
    source_url: https://www.nhs.uk/conditions/alcohol-poisoning/
    quote: "keep them warm with a jacket or blanket"
    verdict: match
    note: "Bản NHS (xem lại 04/06/2026). Bạch Mai chỉ nói 'giảm thân nhiệt (da lạnh)' ở mức cồn 200-400, không hướng dẫn đắp chăn. Phần 'mở cửa sổ' trong steps[2] là cách nói khó hiểu, nên bỏ."
  - text: "Bẫy 2: đổ cà phê, dội nước lạnh, bắt đi bộ cho tỉnh không làm giảm cồn và còn gây hại"
    source_url: https://www.nhs.uk/conditions/alcohol-poisoning/
    quote: "do not give them coffee or drinks containing caffeine because this can dehydrate people with alcohol poisoning; do not put them in a cold shower or bath because there's a risk they could get too cold, fall or lose consciousness in the water"
    verdict: partial
    note: "NHS khớp cà phê và tắm nước lạnh. 'Bắt đi bộ' và vế 'không làm giảm lượng cồn trong máu' không có trong NHS hay Bạch Mai: suy ra. Tóm tắt Việt: không cho cà phê (mất nước), không tắm nước lạnh (lạnh, ngã, mất ý thức)."
  - text: "Người còn tỉnh, gọi dậy được, thở đều thì trông tại nhà (Ghi chú)"
    source_url: https://www.nhs.uk/conditions/alcohol-poisoning/
    quote: "Call 999 if: you think someone has alcohol poisoning"
    verdict: inference
    note: "Không nguồn nào dặn 'trông tại nhà nếu còn tỉnh và thở đều'. Bạch Mai chỉ nêu ngưỡng 8 dấu hiệu để đưa đi viện; NHS gọi cấp cứu ngay khi nghi ngộ độc rượu. Tóm tắt Việt: NHS bảo gọi 999 nếu nghi ngộ độc rượu."
  - text: "Gọi cấp cứu 115: bấm số 115 trên điện thoại"
    source_url: https://ttcc115.medinet.gov.vn/trung-tam-cap-cuu-115-tphcm-cm7/Contact.aspx
    quote: "Để gọi cấp cứu, nhấn số 115 trên điện thoại"
    verdict: match
    note: "Trang Trung tâm cấp cứu 115 TP.HCM. Chú ý: mục 13-49 viết 113 hoặc 115 do Thông tư 42/2026/TT-BYT (hiệu lực 01/11/2026); mục này chỉ ghi 115 (xem internal_checks)."
  - text: "Da lạnh tím thì gọi 115"
    source_url: https://bachmai.gov.vn/bai-viet/8-dau-hieu-cua-nguoi-say-ruou-can-nhap-vien-ngay?id=40c426de-8996-f44c-dc28-346659b6bf98
    quote: "Da, môi, móng tay tím tái hoặc nhợt, lạnh."
    verdict: match
    note: ""
internal_checks:

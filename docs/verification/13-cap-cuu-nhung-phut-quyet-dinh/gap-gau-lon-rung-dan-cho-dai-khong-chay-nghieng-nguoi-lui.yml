claims:
  - text: "Bị chó cắn: xối rửa vết cắn/cào dưới vòi nước chảy liên tục ít nhất 15 phút, dùng xà phòng (QĐ 1622/QĐ-BYT)"
    source_url: https://hcdc.vn/nhung-viec-can-lam-ngay-sau-khi-bi-cho-can-xbcwu7.html
    quote: "Xối rửa kỹ tất cả các vết cắn hoặc vết cào dưới vòi nước chảy liên tục trong ít nhất 15 phút. Bạn có thể sử dụng xà phòng hoặc các chất tẩy rửa thông thường như dầu gội, sữa tắm."
    verdict: match-secondary
    note: "Bản chữ của chính QĐ 1622/QĐ-BYT KHÔNG đọc được: trang BV Nhi TW (legal_refs.url) chỉ là trang đăng, link PDF trỏ syt.kontum.gov.vn không tải được (không có phản hồi). HCDC TP.HCM là bản dẫn lại, ghi nguồn QĐ 1622. Hướng dẫn quốc tế (xem claim kế) khớp con số 15 phút."
  - text: "Rửa vết thương dưới nước xà phòng ít nhất 15 phút rồi tìm chăm sóc y tế (đối chiếu hướng dẫn quốc tế)"
    source_url: https://www.who.int/news-room/fact-sheets/detail/rabies
    quote: "If a person is bitten or scratched by a potentially rabid animal, they should immediately and always wash the wound with water and soap for at least 15 minutes and seek medical attention."
    verdict: match
    note: "WHO fact sheet Rabies, cập nhật 17/9/2026. Tóm tắt: bị cắn/cào thì rửa ngay bằng nước xà phòng ít nhất 15 phút và đi khám. Không có lệch giữa VN và WHO về mốc này."
  - text: "Sau khi rửa, sát khuẩn bằng cồn 70 độ"
    source_url: https://hcdc.vn/nhung-viec-can-lam-ngay-sau-khi-bi-cho-can-xbcwu7.html
    quote: "Sau khi rửa sạch, sát khuẩn vết thương bằng cồn 70 độ hoặc cồn i-ốt."
    verdict: match-secondary
    note: "Nguồn thứ cấp (dẫn QĐ 1622). Bản dẫn còn cho phép cồn i-ốt; mục chỉ nêu cồn 70 độ (không sai, chỉ hẹp hơn). WHO không nêu bước sát khuẩn."
  - text: "Không băng kín, không nặn máu, không khâu kín ngay; nếu buộc phải khâu thì trì hoãn vài giờ đến ba ngày, khâu thưa sau khi tiêm huyết thanh kháng dại"
    source_url: https://hcdc.vn/nhung-viec-can-lam-ngay-sau-khi-bi-cho-can-xbcwu7.html
    quote: "Không băng kín vết thương, không làm dập nát thêm hoặc nặn máu. Tránh khâu kín vết thương ngay lập tức. Nếu bắt buộc phải khâu, hãy trì hoãn khâu sau vài giờ đến 3 ngày và nên khâu thưa, ngắt quãng sau khi đã tiêm huyết thanh kháng dại (nếu có chỉ định) vào tất cả các vết thương."
    verdict: match-secondary
    note: "Nguồn thứ cấp. Mục bỏ cụm 'nếu có chỉ định' và bỏ ý kháng sinh/uốn ván (bản dẫn: 'bác sĩ có thể chỉ định sử dụng kháng sinh và tiêm phòng uốn ván')."
  - text: "Sau sơ cứu tới ngay cơ sở y tế để bác sĩ quyết định tiêm vắc xin"
    source_url: https://hcdc.vn/nhung-viec-can-lam-ngay-sau-khi-bi-cho-can-xbcwu7.html
    quote: "Sau khi sơ cứu vết thương, việc quan trọng nhất là đến ngay cơ sở y tế gần nhất để được thăm khám và tư vấn điều trị dự phòng kịp thời."
    verdict: match-secondary
    note: "Nguồn thứ cấp."
  - text: "Tiêm kháng thể (huyết thanh/globulin kháng dại) 'nếu vết thương nặng'"
    source_url: https://www.who.int/news-room/fact-sheets/detail/rabies
    quote: "Category III - single or multiple transdermal bites or scratches, contamination of mucous membrane or broken skin with saliva from animal licks, exposures due to direct contact with bats (severe exposure) | Wound washing, immediate vaccination and administration of rabies immunoglobulin/monoclonal antibodies"
    verdict: partial
    note: "WHO: mọi vết cắn/cào xuyên da (một hoặc nhiều) là mức III, chỉ định kháng thể. 'Vết thương nặng' dễ bị hiểu là vết to/sâu/chảy nhiều, khiến người đọc cho rằng vết cắn nhỏ không cần kháng thể. Mục có nói bác sĩ quyết định, nhưng nên viết rõ tiêu chí. Chưa đối chiếu được chữ của QĐ 1622 về phân độ."
  - text: "Gặp gấu: không quay lưng bỏ chạy, không leo cây, lùi từng bước chậm theo hướng nghiêng người, mắt nhìn con vật"
    source_url: https://www.nps.gov/subjects/bears/safety.htm
    quote: "If the bear is stationary, move away slowly and sideways; this allows you to keep an eye on the bear and avoid tripping. Moving sideways is also non-threatening to bears. Do NOT run, but if the bear follows, stop and hold your ground. Bears can run as fast as a racehorse both uphill and down. Like dogs, they will chase fleeing animals. Do NOT climb a tree. Both grizzlies and black bears can climb trees."
    verdict: match
    note: "Nguồn ngoài danh sách nguồn của mục (US National Park Service, cập nhật 8/9/2025). Tóm tắt: nếu gấu đứng yên thì lùi chậm, nghiêng người; không chạy; không leo cây vì gấu leo cây được. Khớp bước 1 và 3 với gấu. Mục tự nhận chưa có văn bản VN."
  - text: "Nói to giọng trầm, giơ hai tay cho mình trông lớn hơn"
    source_url: https://www.nps.gov/subjects/bears/safety.htm
    quote: "Identify yourself by talking calmly so the bear knows you are a human and not a prey animal. Remain still; stand your ground but slowly wave your arms. ... A scream or sudden movement may trigger an attack."
    verdict: partial
    note: "NPS: nói bình tĩnh, giọng thấp, vẫy tay chậm; cảnh báo la hét hoặc động tác đột ngột có thể kích hoạt tấn công. 'Nói to' có thể bị hiểu là la lớn. Đề nghị 'nói bình tĩnh, giọng trầm', 'giơ/vẫy tay chậm'."
  - text: "Không nằm xuống"
    source_url: https://www.nps.gov/subjects/bears/safety.htm
    quote: "Black Bears: If you are attacked by a black bear, DO NOT PLAY DEAD. ... Brown/Grizzly Bears: If you are attacked by a brown/grizzly bear, leave your pack on and PLAY DEAD."
    verdict: partial
    note: "Đúng với gấu đen (gấu ngựa/gấu chó ở VN thuộc nhóm gấu đen/gấu chó, [INFERENCE] không có nguồn VN xác nhận loài). Mục tách 'nằm xuống' chỉ là xử lý một tình huống cụ thể, nhưng bước 1 viết vô điều kiện. Chấp nhận được, nên ghi 'khi chưa bị tấn công'."
  - text: "Gặp lợn rừng: đứng lại, không chạy, không leo cây, lùi chậm"
    source_url: https://www.forestwildlife.org/what-to-do-if-you-see-a-wild-boar/
    quote: "If there is a tree nearby, climb the tree. Alternatively, you can scramble up on top of the nearest car, boulder, fence, or building."
    verdict: mismatch
    note: "Không tìm được hướng dẫn cơ quan chính thống (VN hay quốc tế) cho lợn rừng; mục cũng thừa nhận. Chỉ tìm được blog (không đủ làm nguồn y tế) nhưng nó ĐỐI NGHỊCH với 'không leo cây': khi bị lợn rừng lao tới thì leo lên chỗ cao được khuyên. Bước 1 'không leo cây' đúng cho gấu nhưng áp cho lợn rừng là chưa có cơ sở, có thể tước đường thoát. Cùng blog đồng ý 'Do not run' và lùi chậm khi chưa bị đuổi. Verdict nêu theo claim gộp 'gấu, lợn rừng' dùng chung bước."
  - text: "Đàn chó (dại) cũng xử lý bằng 'đứng lại, không chạy, nghiêng người lùi chậm' (tiêu đề)"
    source_url: https://www.nps.gov/subjects/bears/safety.htm
    quote: "Do NOT run, but if the bear follows, stop and hold your ground. ... Like dogs, they will chase fleeing animals."
    verdict: not-found
    note: "Không có nguồn nào mở được hướng dẫn xử trí khi gặp đàn chó. Thân bài và steps chỉ nói gấu, lợn rừng và sơ cứu vết chó cắn; tiêu đề hứa nội dung về đàn chó nhưng không có. Câu NPS chỉ so sánh gấu với chó, không phải hướng dẫn cho chó."

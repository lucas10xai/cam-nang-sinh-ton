potential_harm:
  - "Bước 5 / tldr: 'tiêm kháng thể nếu vết thương nặng'. Theo WHO, bất kỳ vết cắn/cào xuyên da nào (mức III) đều chỉ định kháng thể cùng vắc xin. Người đọc có vết cắn nhỏ nhưng xuyên da có thể bỏ qua hoặc không yêu cầu kháng thể, làm chậm điều trị dự phòng bệnh dại (gần như tử vong 100% khi phát bệnh)."
  - "Bước 1: 'không leo cây' áp cho cả lợn rừng. Nguồn (blog, chưa phải chính thống) khuyên leo lên chỗ cao khi bị lợn rừng lao tới; không có nguồn chính thống nào ủng hộ 'không leo cây' cho lợn rừng, và đây là lời khuyên vô điều kiện có thể làm người đọc bỏ qua đường thoát duy nhất."
suggested_edits:
  - "Bước 5, tldr và 'Lợi ích' (chó cắn): đổi 'tiêm kháng thể nếu vết thương nặng' thành 'bác sĩ phân độ phơi nhiễm; mọi vết cắn hoặc cào làm rách da đều có thể cần cả vắc xin lẫn huyết thanh/kháng thể kháng dại, đừng tự coi vết nhỏ là không cần', dựa vào quote WHO Category III. Thêm cụm 'nếu có chỉ định' và kháng sinh/uốn ván cho khớp bản dẫn QĐ 1622."
  - "Bước 1 và 2: tách riêng gấu và lợn rừng. Gấu: 'không chạy, không leo cây, nói bình tĩnh giọng trầm, vẫy tay chậm, lùi chậm nghiêng người' (dựa vào NPS). Lợn rừng: bỏ 'không leo cây' hoặc bỏ lợn rừng khỏi tldr/tiêu đề cho tới khi có nguồn chính thống; nếu giữ, ghi rõ 'chưa có hướng dẫn chính thống'."
  - "Bước 2: 'Nói to giọng trầm' đổi thành 'nói bình tĩnh, giọng trầm'; 'giơ hai tay' đổi thành 'giơ/vẫy tay chậm'. Bước 1: thêm 'khi chưa bị tấn công' sau 'không nằm xuống'."
  - "Tiêu đề và thân: hoặc bổ sung hướng dẫn gặp đàn chó có nguồn, hoặc bỏ 'đàn chó dại' khỏi tiêu đề."
  - "Thêm vào legal_refs một URL tải được chữ của QĐ 1622 (PDF) và ghi quote nguyên văn mốc 15 phút; sửa mục Nguồn để dẫn NPS cho phần gấu và WHO cho mốc 15 phút/phân độ."

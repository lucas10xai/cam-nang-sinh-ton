deliberate_vn_deviation:
  - "BV Nhi Trung ương: 'Nếu thấy trẻ tỉnh táo, chưa bị nôn trớ, còn phản ứng tốt, cha mẹ dùng ngón tay của mình ... kích thích vào vùng sàn họng trẻ ... giúp trẻ có thể nôn'. Mục (và NHS: 'do not try to make someone sick') chọn không gây nôn. Mục lệch nguồn VN dẫn theo hướng an toàn nhưng không nói rõ sự lệch này; nên ghi chú để người đọc không thấy nguồn mâu thuẫn."
  - "Hướng dẫn quốc tế không thống nhất về uống nước/sữa sau khi nuốt chất ăn mòn: NHS 'do not give the person anything to eat or drink'; Poison Control Mỹ cho uống ít nước/sữa nếu tỉnh, chất ăn mòn/kích ứng. Mục chọn theo NHS."
potential_harm:
  - "Steps bước 3 'Gọi 115 hoặc đưa ngay tới cơ sở có chống độc, không dừng ở trạm y tế xã': người đọc ở xa Hà Nội/TP.HCM có thể tự chở nạn nhân đường xa (nhiều giờ) thay vì tới cơ sở gần nhất hoặc gọi 115 để được điều phối/hướng dẫn; nguồn dẫn nói 'cơ sở y tế gần nhất'. Nạn nhân tụt ý thức, co giật hoặc suy hô hấp trên đường mà không có hỗ trợ. Cần sửa: gọi 115 ngay; nếu phải tự đưa đi thì tới cơ sở y tế gần nhất có cấp cứu và gọi trước để được chuyển tuyến."
  - "Steps bước 1 'không cho uống sữa hay nước' là tuyệt đối, không nguồn VN dẫn; hướng dẫn quốc tế bất đồng (NHS cấm, Poison Control cho uống ít nước/sữa khi nuốt chất ăn mòn tỉnh táo). Chấp nhận được là ưu tiên gọi 115/trung tâm chống độc, nhưng mục không nêu tổng đài chống độc nào, nên người đọc không có chỗ hỏi trường hợp cụ thể."
suggested_edits:
  - "steps[2] và Bẫy 3: bỏ 'không dừng ở trạm y tế xã' và khẳng định trạm không có thuốc giải độc/xét nghiệm (không có nguồn); viết: 'Gọi 115 ngay. Nếu tự đưa đi, tới cơ sở y tế gần nhất có cấp cứu, mang theo vỏ chai/mẫu; cơ sở sẽ chuyển tuyến chống độc nếu cần' theo quote BV Nhi TW 'Gọi cấp cứu 115 hoặc nhanh chóng đưa trẻ tới ngay cơ sở y tế gần nhất'."
  - "tldr và 'Nói dễ hiểu': sửa 'da hoặc mắt rửa ít nhất 15 phút' thành 'mắt: 15-30 phút (BV Mắt HN); da: rửa liên tục dưới vòi nước sạch (nguồn BV Nhi TW không ghi số phút)', hoặc dẫn nguồn khác cho mốc phút của da."
  - "steps[4]: đổi 'banh mi ra' thành 'lộn mi trên và mi dưới' theo BV Mắt HN."
  - "Ghi chú: nêu rõ BV Nhi TW còn hướng dẫn gây nôn ở trẻ tỉnh táo, mục chọn không làm vì NHS/chống chỉ định chất ăn mòn/xăng dầu; thêm nguồn NHS Poisoning (https://www.nhs.uk/conditions/poisoning/)."
  - "Bỏ hoặc gắn 'suy ra' cho: cơ chế viêm phổi hít do pha loãng; 'liều gây chết photpho hữu cơ tính bằng miligam'; 'nơi tiếp nhận ngộ độc nặng ở phía bắc'."
  - "Nguồn Bạch Mai: chỉ dẫn trang bachmai.gov.vn cho địa chỉ bệnh viện; trang chanthuongvacotsong.bachmai.gov.vn là của Khoa Chấn thương chỉnh hình và cột sống, địa chỉ/điện thoại ở chân trang không phải của Trung tâm Chống độc; mục đã tránh nêu số, giữ nguyên."
  - "Phạm vi: nguồn nói về trẻ em; nếu mục nhắm người lớn (thuốc trừ sâu, uống nhầm thuốc), cần thêm nguồn người lớn (Bộ Y tế hướng dẫn xử trí ngộ độc cấp, hoặc trung tâm chống độc) hoặc giới hạn tiêu đề về 'trẻ nhỏ và người lớn uống nhầm hóa chất gia dụng'."

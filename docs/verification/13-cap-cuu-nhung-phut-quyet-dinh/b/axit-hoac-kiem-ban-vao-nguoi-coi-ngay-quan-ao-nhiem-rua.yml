  basis: "Hai bài của bệnh viện, không phải văn bản Bộ Y tế có số hiệu và không có ngày hiệu lực. Bài Bệnh viện Bỏng đã 4 năm tuổi. Không tìm hướng dẫn mới hơn của Bộ Y tế trong phạm vi kiểm. Hướng dẫn quốc tế đối chiếu: NHS acid-and-chemical-burns (page last reviewed 05 June 2024) khớp phần lớn."
deliberate_vn_deviation:
  - "Nguồn VN (Bệnh viện Bỏng) cho trung hòa nhẹ sau khi rửa (giấm, chanh, nước xà phòng, đường, mật ong); NHS: Do not put anything on the burn, such as skin creams or other chemicals. Mục theo NHS và cấm trung hòa, nhưng lại ghi nguồn là Bệnh viện Bỏng; cần ghi rõ đây là chọn lọc có chủ ý và lý do."
  - "NHS cho cool or lukewarm water; nguồn VN cấm nước ấm. Mục theo nguồn VN (an toàn)."
potential_harm:
  - "Step 2 và tldr bảo rửa ngay bằng nước nhưng bỏ sót bước phủi hóa chất khô trước. Nguồn Bệnh viện Bỏng ghi: Bỏng do vôi bột: Cần lau sạch vôi bám bằng khăn khô; NHS: Carefully brush dry chemicals off the skin. Vôi bột/xi măng khô là tình huống rất phổ biến ở Việt Nam; dội nước thẳng lên bột khô có thể gây phản ứng và làm bỏng nặng thêm."
  - "Ngưỡng gọi 115 (chỉ khi bỏng rộng, bỏng mặt hoặc choáng) thấp hơn hướng dẫn NHS (mọi hóa chất dính da hoặc mắt). Người đọc có thể không gọi cấp cứu khi hóa chất dính mắt hoặc vùng nhỏ. Mục đã nói thêm phải đến cơ sở chuyên khoa ở Ghi chú, nhưng steps/tldr thì không."
  - "Không có bước tự bảo vệ người sơ cứu (găng tay, tránh dính hóa chất sang mình); Bệnh viện Bỏng ghi: Khi hoá chất có độc tính mạnh, bản thân người cấp cứu cần được bảo vệ như: đeo khẩu trang, đi găng tay, mang quần áo bảo hộ."
suggested_edits:
  - "steps, thêm bước trước bước 2: Nếu hóa chất ở dạng bột khô (vôi bột, xi măng), phủi hoặc lau sạch bằng khăn khô trước khi rửa nước. Dựa vào quote nguồn 1: Bỏng do vôi bột: Cần lau sạch vôi bám bằng khăn khô."
  - "tldr/steps: gọi 115 khi hóa chất dính mắt hoặc vùng da lớn, mặt, bộ phận sinh dục, hoặc người choáng; mọi bỏng hóa chất đều cần cơ sở y tế đánh giá. Dựa vào NHS: Call 999 if you have got an acid or chemical on your skin, or in your eyes."
  - "Lợi ích/Ghi chú: sửa chia thành ba bước thành bốn bước (hoặc trích cụ thể bước 1 và 3); sửa lời Phản ứng trung hòa tỏa nhiệt thành trung hòa ngay có thể làm tổn thương nặng hơn do phản ứng với hóa chất còn sót (đúng chữ nguồn)."
  - "Step 4: giữ lệnh không trung hòa nhưng ghi rõ nguồn VN cho phép trung hòa nhẹ SAU rửa và mục khuyên bỏ qua để tránh sai; thay cụm không thoa kem đánh răng, dầu ăn bằng không bôi bất cứ thứ gì lên vết bỏng và ghi nguồn NHS."
  - "Ghi lời dặn ở mắt: sau rửa đậy nhẹ gạc vô trùng (không băng chặt) và đi ngay cơ sở nhãn khoa (Bệnh viện Mắt Hà Nội); ghi chỗ lệch 10 - 15 phút (Bệnh viện Bỏng) với 15 - 30 phút."

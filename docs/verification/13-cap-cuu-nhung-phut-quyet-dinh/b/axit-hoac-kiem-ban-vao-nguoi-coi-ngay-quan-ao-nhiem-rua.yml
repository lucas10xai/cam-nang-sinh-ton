claims:
  - text: "Cởi ngay quần áo (giày, đồng hồ) dính hóa chất"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Nhanh chóng cởi bỏ quần áo bị dính hoá chất, chánh tiếp xúc với bất cứ vật liệu nào dính hoá chất."
    verdict: match
    note: "Nguồn chỉ nói quần áo và vật liệu dính hóa chất; giày, đồng hồ là suy rộng hợp lý. Bài viết cho trẻ em (20/04/2022), nguồn mở được qua curl -k (lỗi chuỗi chứng chỉ SSL ở trình đọc)."
  - text: "Rửa vùng bỏng dưới nước chảy ít nhất 30 phút"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Thời gian ngâm rửa nước sạch với bỏng hoá chất từ 30 - 60 phút và thường kéo dài hơn so với bỏng nhiệt."
    verdict: match
    note: "Nguồn nói nước sạch, ngâm rửa; không nói chảy liên tục/mát. NHS (acid-and-chemical-burns, review 05/06/2024) ghi: Put the affected area under cool or lukewarm running water or pour lots of water over it for about 1 hour. Phù hợp."
  - text: "Không dùng nước ấm"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Không dùng nước ấm rửa vì làm tăng khả năng ngấm của hoá chất."
    verdict: match
    note: "NHS cho phép cool or lukewarm; mục theo nguồn VN, an toàn hơn."
  - text: "Hóa chất vào mắt: rửa 15 đến 30 phút"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    quote: "Rửa mắt liên tục dưới vòi nước sạch hoặc dùng bình nước muối sinh lý (NaCl 0,9%) xối mạnh vào mắt trong ít nhất 15–30 phút."
    verdict: match
    note: "Bài đăng 02/05/2026. Lưu ý bài Bệnh viện Bỏng (nguồn 1) ghi bỏng mắt rửa ít nhất 10 - 15 phút; hai nguồn lệch nhau, mục chọn khoảng dài hơn (an toàn)."
  - text: "Lộn mi trên và mi dưới khi rửa mắt"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    quote: "Lộn mi trên và mi dưới để rửa sạch hóa chất còn đọng trong túi kết mạc và chân mi."
    verdict: match
    note: ""
  - text: "Không băng kín mắt khi chưa rửa sạch; không nhỏ thuốc trước khi rửa"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    quote: "Băng kín mắt khi chưa rửa sạch hóa chất hoặc tự ý nhỏ bất kỳ loại thuốc nào trước khi rửa mắt."
    verdict: match
    note: "Câu nằm dưới tiêu đề Không được. Nguồn còn dặn sau rửa: đậy nhẹ mắt bằng gạc vô trùng (không băng chặt), chuyển ngay đến cơ sở nhãn khoa. Mục không nói rằng bỏng kiềm nguy hiểm hơn do lý do gì ngoài kiềm thẩm thấu sâu; xem claim sau."
  - text: "Bỏng kiềm nguy hiểm hơn bỏng axit vì kiềm thẩm thấu sâu vào nhãn cầu"
    source_url: https://benhvienmathanoi.gov.vn/capcuubonghoachattaimat/
    quote: "Nguy hiểm hơn vì hóa chất kiềm có khả năng thẩm thấu sâu vào nhãn cầu, gây tổn thương nghiêm trọng hơn."
    verdict: match
    note: ""
  - text: "Bệnh viện Bỏng chia sơ cứu bỏng hóa chất thành ba bước (bước 1 tách khỏi tác nhân, bước 3 ngâm rửa)"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Bước 4: Nhanh chóng chuyển nạn nhân tới cơ sở y tế gần nhất"
    verdict: mismatch
    note: "Bài có BỐN bước (1 đưa khỏi tác nhân, 2 đánh giá hô hấp tuần hoàn, 3 sơ cấp cứu, 4 chuyển cơ sở y tế), không phải ba. Mục viết chia thành ba bước ở Lợi ích và thứ tự ba bước ở Ghi chú. Lỗi mô tả nguồn, không đổi hướng dẫn."
  - text: "Việc trung hòa chỉ tiến hành sau khi đã ngâm rửa bằng nước sạch"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Việc trung hoà chỉ tiến hành sau khi đã ngâm rửa vết bỏng bằng nước sạch (trung hoà ngay lập tức có thể làm nặng lên tổn thương do phản ứng với tác nhân gây bỏng còn sót lại)."
    verdict: match
    note: "Nhưng nguồn CHO PHÉP trung hòa sau rửa (axit nhẹ với bỏng kiềm: chanh, giấm; kiềm nhẹ/nước xà phòng với bỏng axit; đường/mật ong với bỏng vôi). Step 4 của mục cấm tuyệt đối đổ giấm hoặc nước vôi để trung hòa: xem deliberate_vn_deviation. Câu Phản ứng trung hòa tỏa nhiệt (Bẫy 1) không có chữ trong nguồn: suy ra."
  - text: "Không thoa kem đánh răng, dầu ăn hay vôi lên vết bỏng"
    source_url: https://www.nhs.uk/conditions/acid-and-chemical-burns/
    quote: "Do not put anything on the burn, such as skin creams or other chemicals."
    verdict: inference
    note: "Hai nguồn trong mục không nhắc kem đánh răng, dầu ăn. NHS (tương đương, nguồn quốc tế ngoài mục) ủng hộ nguyên tắc không bôi gì. Đề xuất ghi nguồn NHS vào mục hoặc gắn nhãn suy ra."
  - text: "Bỏng rộng, bỏng ở mặt hoặc người choáng thì gọi 115, đưa tới cơ sở có chuyên khoa bỏng"
    source_url: https://www.nhs.uk/conditions/acid-and-chemical-burns/
    quote: "Call 999 if: you or someone else has got an acid or chemical on your skin, or in your eyes"
    verdict: partial
    note: "Nguồn VN trong mục không nêu 115. NHS gọi cấp cứu cho MỌI trường hợp hóa chất dính da hoặc mắt, không chỉ bỏng rộng/mặt/choáng. Ngưỡng 115 của mục hẹp hơn hướng dẫn quốc tế. Tóm tắt Việt: gọi cấp cứu ngay khi hóa chất dính da hoặc mắt."
  - text: "Phải rửa nước chảy, không rửa trong chậu (Bẫy 2)"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-hoa-chat-o-tre-em
    quote: "Ngâm rửa vùng bỏng bằng nước sạch càng sớm càng tốt"
    verdict: inference
    note: "Nguồn nói ngâm rửa nước sạch; không nói nước chảy hay chậu bẩn dần. Chữ nước chảy liên tục của mục là suy ra (NHS ghi running water)."

claims:
  - text: "Hạ đường huyết là khi glucose huyết tương dưới 70 mg/dL (3,9 mmol/L)"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Hạ đường huyết được định nghĩa khi nồng độ glucose huyết tương thấp dưới 70 mg/dL (hay 3,9 mmol/L) gây ra các triệu chứng như suy giảm chức năng não"
    verdict: match
    note: "Trang HCDC trả chữ đúng (chữ số tách dòng trong HTML)."
  - text: "Người còn tỉnh: cho ngay 15 g glucose đường miệng"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Khi đường máu < 70 mg/dL cần cung cấp ngay 15g glucose đường miệng."
    verdict: partial
    note: "Nguồn đặt điều kiện nhóm 'Trường hợp còn tỉnh, ăn uống được'. Steps bước 1 chỉ ghi 'Người còn tỉnh', thiếu 'ăn uống được'/nuốt được (xem potential_harm)."
  - text: "15 g tương đương 3 thìa cà phê đường pha nước"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Tương đương 3 thìa cà phê đường hoặc mật ong pha trong nước hoặc 1 cốc (300 ml) nước trái cây (như táo nho) hoặc 3 chiếc bánh quy."
    verdict: match
    note: "Nguồn đồng thời nêu 1 cốc 300 ml nước trái cây và 3 bánh quy."
  - text: "15 g tương đương nửa cốc nước ngọt hoặc 3 viên kẹo (steps bước 1 và 'Nói dễ hiểu')"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Tương đương 3 thìa cà phê đường hoặc mật ong pha trong nước hoặc 1 cốc (300 ml) nước trái cây (như táo nho) hoặc 3 chiếc bánh quy."
    verdict: mismatch
    note: "Nguồn không có 'nửa cốc nước ngọt' lẫn 'kẹo'; nguồn là 1 cốc 300 ml nước trái cây hoặc 3 bánh quy. Thân mục (Lợi ích) chép đúng 300 ml/bánh quy, nên steps/tldr mâu thuẫn thân. 'Nước ngọt' không rõ loại (nước ngọt không đường/ăn kiêng không có glucose), '3 viên kẹo' phụ thuộc cỡ kẹo."
  - text: "15 phút sau kiểm tra lại, còn thấp thì lặp lại 15 g"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Kiểm tra lại đường máu sau 15 phút. Nếu vẫn thấp lặp lại 15g glucose."
    verdict: match
    note: ""
  - text: "Không dùng thực phẩm nhiều chất béo hoặc đạm vì làm chậm hấp thu"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Tuyệt đối không dùng thực phẩm nhiều chất béo hoặc protein vì sẽ làm chậm hấp thu glucose"
    verdict: match
    note: ""
  - text: "Không cải thiện sau hai lần xử trí thì đưa tới cơ sở y tế"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Nếu tình trạng không cải thiện sau hai lần xử trí cần đưa ngay người bệnh đến cơ sở y tế gần nhất."
    verdict: match
    note: ""
  - text: "Người lú lẫn/mê man: không cho ăn uống (nguy cơ sặc)"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Tuyệt đối không cho ăn uống vì có thể gây sặc vào đường hô hấp dẫn đến nguy hiểm cho tính mạng."
    verdict: match
    note: "Nguồn đặt tiêu đề nhóm 'rối loạn ý thức, hôn mê'. Mục viết 'lú lẫn hoặc mê man' là diễn đạt gần đúng."
  - text: "Có glucagon thì tiêm bắp 1 mg rồi gọi cấp cứu"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Nếu có sẵn tiêm bắp Glucagon 1 mg cần được thực hiện ngay. Người thân hoặc nhân viên chăm sóc cần được hướng dẫn vị trí và cách sử dụng thuốc. ... Sau đó cần gọi cấp cứu hoặc đưa người bệnh đến bệnh viện gần nhất."
    verdict: match
    note: "Nguồn không ghi chữ '115'; số 115 chỉ thấy ở nguồn khác (BV Nhi TW: 'Gọi cấp cứu 115'). Trình tự steps bước 5 ('gọi 115 (có glucagon thì tiêm)') hơi đảo so với nguồn 'tiêm ngay ... sau đó gọi cấp cứu'; người không có/không biết dùng glucagon phải gọi 115 ngay."
  - text: "Sau khi đường máu ổn định nên ăn nhẹ có carbohydrate và protein để ngừa tái phát (mục viết: 'bữa ăn nhẹ có tinh bột', không có trong steps)"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Khi đường máu ổn định người bệnh nên ăn nhẹ thêm bữa có carbohydrate và protein để ngăn ngừa hạ đường huyết tái phát."
    verdict: partial
    note: "Nguồn nói carbohydrate VÀ protein; mục (Bẫy 3) chỉ nói 'tinh bột'. Bước này vắng hẳn trong steps/tldr dù thân coi là bẫy."
  - text: "Bẫy 3: cơn hạ đường huyết quay lại 'sau một hai giờ'"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "để ngăn ngừa hạ đường huyết tái phát."
    verdict: inference
    note: "Mốc 'một hai giờ' không có trong nguồn."
  - text: "Người không bị đái tháo đường thì cho đường không phải cách xử trí mặc định; run, vã mồ hôi còn do sốt, tim nhanh, lo lắng"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Hạ đường huyết thường xuất hiện đột ngột với các biểu hiện thể chất và thần kinh."
    verdict: inference
    note: "Nguồn không bàn người không đái tháo đường hay nguyên nhân khác của run/vã mồ hôi. Là suy diễn hợp lý, nên gắn nhãn."
  - text: "Bài dẫn lại hướng dẫn BV Nội tiết TW (2023) và Quyết định 5481/QĐ-BYT ngày 30/12/2020"
    source_url: https://hcdc.vn/xu-tri-ha-duong-huyet--ban-da-biet-cach-chua-7M9Q0n.html
    quote: "Quyết định 5481/QĐ-BYT ngày 30/12/2020 của Bộ Y tế về việc ban hành tài liệu chuyên môn “Hướng dẫn chẩn đoán và điều trị đái tháo đường típ 2”"
    verdict: match
    note: "Cũng liệt kê 'American Diabetes Association (2024). Glycemic Goals and Hypoglycemia: Standards of care in Diabetes-2025'. Không mở được toàn văn QĐ 5481; ADA trả 403 nên không đối chiếu được nguyên văn ADA."
  - text: "Quy tắc 15-15 theo ADA Standards of Care 2025 (đối chiếu quốc tế)"
    source_url: https://diabetesjournals.org/care/article/48/Supplement_1/S128/157566/6-Glycemic-Goals-and-Hypoglycemia-Standards-of
    quote: "(không mở được: HTTP 403)"
    verdict: unreachable
    note: "ADA bị chặn 403, chưa đối chiếu được độc lập 15-20 g/15 phút và việc dùng nước ngọt có đường. Mục không dẫn nguồn quốc tế nào."

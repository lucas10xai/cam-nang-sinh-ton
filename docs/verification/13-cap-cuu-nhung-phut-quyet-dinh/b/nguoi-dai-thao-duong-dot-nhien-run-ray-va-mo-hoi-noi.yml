deliberate_vn_deviation: []
potential_harm:
  - "Steps bước 1 'nửa cốc nước ngọt hoặc 3 viên kẹo': không có trong nguồn. 'Nước ngọt' không đường/ăn kiêng không chứa glucose, kẹo cỡ nhỏ không đủ 15 g; người đọc làm đúng nguyên văn có thể không nâng được đường huyết trong mốc 15 phút và làm chậm xử trí."
  - "Steps bước 1 chỉ ghi 'Người còn tỉnh' mà nguồn ghi 'còn tỉnh, ăn uống được'; tiêu đề lại nêu triệu chứng 'nói không rõ' (nguồn xếp nói khó là triệu chứng thần kinh nặng). Người đọc có thể đút nước ngọt cho người nói khó, lơ mơ, nuốt kém và gây sặc. Cần tiêu chí rõ: tỉnh hoàn toàn, tự cầm cốc và nuốt được; nếu không thì không đút và gọi 115."
suggested_edits:
  - "steps[0], tldr-liên quan và 'Nói dễ hiểu': đổi 'nửa cốc nước ngọt hoặc 3 viên kẹo' thành 'một cốc 300 ml nước trái cây hoặc 3 chiếc bánh quy' (nguồn HCDC: 'Tương đương 3 thìa cà phê đường hoặc mật ong pha trong nước hoặc 1 cốc (300 ml) nước trái cây ... hoặc 3 chiếc bánh quy'). Nếu muốn giữ 'nước ngọt' hay 'kẹo', phải có nguồn và ghi rõ 'loại có đường'."
  - "steps[0]: đổi 'Người còn tỉnh' thành 'Người tỉnh, tự nuốt được' (nguồn: 'Trường hợp còn tỉnh, ăn uống được')."
  - "steps: thêm bước 'Khi đường máu ổn định, cho ăn nhẹ có carbohydrate và protein để ngừa tái phát' (quote HCDC: 'nên ăn nhẹ thêm bữa có carbohydrate và protein'); sửa Bẫy 3 từ 'tinh bột' thành 'carbohydrate và protein'."
  - "steps[4]: viết 'gọi 115 ngay; nếu có glucagon và biết dùng thì tiêm bắp 1 mg' để người không có glucagon không chậm gọi."
  - "Bẫy 3: bỏ 'sau một hai giờ' hoặc gắn 'suy ra'. Dòng 'người không bị đái tháo đường' gắn 'suy ra' hoặc bỏ."
  - "Nguồn: bổ sung nguồn quốc tế (ADA Standards of Care 2025 mục 6 hoặc hướng dẫn BV Nội tiết TW bản gốc) sau khi mở được."

validity:
  doc: "Bệnh viện Bãi Cháy (04/03/2026); Bệnh viện Hữu nghị Việt Đức (09/12/2025); đối chiếu AAOS OrthoInfo"
  in_force: unconfirmed
  effective_from: "2026-03-04"
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. Hai bài tin bệnh viện mới (2025-2026). AAOS OrthoInfo nhất quán ở nguyên tắc túi kín, không chạm đá; khác ở 'gạc ẩm' (AAOS) và 'không rửa/ngâm' (Việt Đức). Không có hướng dẫn Bộ Y tế VN riêng cho bảo quản chi đứt rời trong phạm vi kiểm."
deliberate_vn_deviation:
  - "Việt Đức: không rửa, không ngâm phần đứt; Bãi Cháy: rửa nước muối sinh lý hoặc nước sạch; AAOS: rửa nhẹ bằng nước/nước muối vô trùng, bọc gạc ẩm. Ba nguồn không thống nhất; mục chọn 'bọc luôn nếu sạch, rửa nhanh nếu bẩn', là một cách hòa giải của người soạn."
potential_harm:
  - "steps[0]/tldr 'Ép mạnh' chỗ chảy máu: nguồn Bãi Cháy 'băng ép nhẹ nhàng'. Với ngón đứt gần rời, ép mạnh có thể làm tổn thương thêm mô còn sống. Nếu chảy máu nặng, hướng dẫn chuẩn là ép trực tiếp chắc; cần giữ nhất quán và ghi điều kiện."
  - "steps[0] 'Nếu đã dùng garo thì phải nới lỏng garo': người dân tự nới garo khi mất máu nặng có thể chảy máu lại nguy hiểm; mâu thuẫn mục 12 (chỉ nhân viên y tế nới)."
  - "steps[3] 'Không dừng ở trạm y tế xã hay bệnh viện huyện... Làm vậy mất vài giờ': nếu người bị nạn chảy máu nặng, sốc, hoặc cách xa bệnh viện có vi phẫu, bỏ qua cơ sở gần nhất có thể làm chậm cầm máu/cứu mạng; cả hai nguồn dẫn đều viết 'cơ sở y tế gần nhất'. Tính mạng người bị nạn ưu tiên hơn ngón tay."
  - "steps[1] 'gạc ẩm' đi cùng 'Bọc... cho vào túi': người dân có thể làm ướt phần đứt rồi cho nước vào túi; Việt Đức dặn tránh nước, AAOS dặn túi kín không rách để nước vào. Thiếu cảnh báo túi phải kín nước."
suggested_edits:
  - "tldr, steps[0], 'Nói dễ hiểu': đổi 'Ép mạnh' thành 'Băng ép chắc nhưng nhẹ nhàng' hoặc ghi rõ 'ép trực tiếp liên tục; nếu máu vẫn chảy nhiều và ép không cầm thì gọi 115'; dựa quote Bãi Cháy 'băng ép nhẹ nhàng vùng chảy máu'."
  - "steps[0]: bỏ lệnh 'phải nới lỏng garo' dành cho người dân; thay bằng 'Nếu máu chảy nhiều và ép không cầm mới dùng garo, ghi giờ đặt, đưa tới viện trong vòng 2 giờ; không tự nới (xem mục 12); nhân viên y tế sẽ nới'. Dẫn quote Bãi Cháy 'có thể dùng garo, nhưng phải đảm bảo nới lỏng garo và đến bệnh viện trong vòng 2 giờ' và gắn nhãn khác biệt."
  - "steps[3] và Bẫy 3: sửa thành 'Gọi 115 hoặc đến cơ sở y tế gần nhất để cầm máu, đồng thời yêu cầu chuyển tới nơi có vi phẫu' và bỏ lời khuyên 'không dừng ở trạm y tế'; dựa quote Việt Đức 'Đưa người bị nạn đến cơ sở y tế gần nhất để được xử trí và hướng dẫn tiếp theo'."
  - "steps[1]: bỏ '(gạc ẩm)' hoặc ghi rõ 'gạc hơi ẩm nước muối sinh lý (AAOS)' kèm 'túi kín không rách, không để nước vào túi' và nêu khác biệt Việt Đức/Bãi Cháy/AAOS."
  - "Tiêu đề/tldr: bỏ 'ngón chân' hoặc gắn nhãn suy ra (nguồn chỉ nói ngón tay/bàn tay); bỏ cơ chế 'lạnh cóng', 'dây chằng trương lên' ở Bẫy 1 hoặc gắn nhãn suy ra; ghi 'quá 8 giờ vẫn nên đi' là suy ra từ ca 25 giờ."

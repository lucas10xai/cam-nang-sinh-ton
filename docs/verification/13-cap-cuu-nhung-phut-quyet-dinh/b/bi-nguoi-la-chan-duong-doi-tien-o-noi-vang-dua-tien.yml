claims:
  - text: "Điều 168 khoản 1: phạt tù 03 năm đến 10 năm với người dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc làm cho nạn nhân không thể chống cự nhằm chiếm đoạt tài sản"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Người nào dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản, thì bị phạt tù từ 03 năm đến 10 năm."
    verdict: match
    note: "Trích từ PDF VBHN 135/VBHN-VPQH tải trực tiếp, chữ trích được."
  - text: "Điều 168 khoản 2: phạt tù 07-15 năm khi có hung khí, có tổ chức, gây thương tích 11%-30%, chiếm đoạt 50 triệu đến dưới 200 triệu"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "2. Phạm tội thuộc một trong các trường hợp sau đây, thì bị phạt tù từ 07 năm đến 15 năm: a) Có tổ chức; ... c) Gây thương tích hoặc gây tổn hại cho sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30%; d) Sử dụng vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác; đ) Chiếm đoạt tài sản trị giá từ 50.000.000 đồng đến dưới 200.000.000 đồng;"
    verdict: partial
    note: "Số khớp. Mục viết “có hung khí” còn luật là “sử dụng vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác”; liệt kê chỉ 4/8 tình tiết nhưng viết như danh sách đầy đủ (thiếu: chuyên nghiệp, nạn nhân dưới 16 tuổi/phụ nữ có thai/người già yếu, ảnh hưởng an ninh trật tự, tái phạm nguy hiểm). Khoản 3 (12-20 năm) và 4 (18-20 năm, chung thân, làm chết người) không nêu. Không gây hiểu sai về hành động, chỉ cần thêm “ví dụ”."
  - text: "Điều 22 khoản 1: phòng vệ chính đáng chỉ khi chống trả cần thiết người đang xâm phạm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên. Phòng vệ chính đáng không phải là tội phạm."
    verdict: match
    note: ""
  - text: "Điều 22 khoản 2: chống trả rõ ràng quá mức cần thiết thì vẫn phải chịu trách nhiệm hình sự"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất và mức độ nguy hiểm cho xã hội của hành vi xâm hại. Người có hành vi vượt quá giới hạn phòng vệ chính đáng phải chịu trách nhiệm hình sự theo quy định của Bộ luật này."
    verdict: match
    note: ""
  - text: "113 tiếp nhận tin báo về cướp giật, gây rối, bạo hành và các hành vi có dấu hiệu tội phạm"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "113 – Lực lượng Công an: Tiếp nhận tin báo về cướp giật, trộm cắp, gây rối, bạo hành, tai nạn giao thông và các hành vi có dấu hiệu tội phạm, ảnh hưởng đến an ninh trật tự."
    verdict: match
    note: "Cổng thông tin Công an tỉnh Điện Biên (cơ quan nhà nước), không phải Bộ Công an."
  - text: "Gọi 113 miễn phí trên toàn quốc"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "Theo quy định của Luật Viễn thông, các cuộc gọi đến số khẩn cấp hoàn toàn miễn phí."
    verdict: match
    note: "Trang dẫn Luật Viễn thông nhưng không trích điều; chưa mở Luật Viễn thông. Trang cũng nói bấm trực tiếp không cần mã vùng khi cùng khu vực; mục không nêu."
  - text: "Đưa tiền, không giằng co thì an toàn hơn chống lại"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Mục Ghi chú tự nhận đây là suy luận, không có nghiên cứu. Đúng quy trình (evidence C). Giữ nhãn “suy ra”."
  - text: "Step 3: không đưa điện thoại đang mở khóa/mã khóa, không đi theo lên xe để lấy thêm tiền"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: not-found
    note: "Không có nguồn nào trong mục. Ghi chú Bẫy 3 nói “biến vụ mất đồ thành vụ khác nặng hơn” cũng không có nguồn."
  - text: "Step 2: nhớ mặt, giọng nói, biển số, hướng đi"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: ""
    verdict: inference
    note: "Nguồn không nói gì về cung cấp đặc điểm nhận dạng. Lời khuyên thông thường, không có nguồn trích."
internal_checks:
  - issue: "Chi phí nói “có khi cả điện thoại và đồng hồ” bị lấy, nhưng step 3 dặn không đưa điện thoại đang mở khóa; hai chỗ không mâu thuẫn hẳn nhưng người đọc có thể không biết ưu tiên khi kẻ cướp đòi điện thoại."
    severity: warn
  - issue: "Mục dặn “không đưa điện thoại” (steps, Bẫy 3) không có cơ sở trong thân ngoài lời khẳng định không nguồn."
    severity: warn
  - issue: "Điều 168 khoản 2 trình bày như danh sách đầy đủ nhưng chỉ nêu 4/8 tình tiết; khoản 3-4 (đến chung thân) không nhắc."
    severity: warn
  - issue: "Lợi ích: “Bạn kiếm lại được số tiền đó” không có cơ sở; không có nguồn nói người bị cướp lấy lại được tài sản."
    severity: warn
  - issue: "legal_refs url (3 mục) đúng là VBHN 135/VBHN-VPQH; Điều 168 khoản 1, khoản 2, Điều 22 khớp khẳng định."
    severity: warn

potential_harm:
  - "Step 3 “Không đưa điện thoại đang mở khóa hay mã khóa” viết vô điều kiện, không nguồn. Nếu kẻ cướp có hung khí và đòi điện thoại, từ chối có thể làm leo thang bạo lực, đi ngược nguyên tắc chính của mục (mất đồ còn kiếm lại được, giữ an toàn thân thể)."
suggested_edits:
  - "Step 3 và Bẫy 3: sửa thành “Nếu họ đòi điện thoại, đưa điện thoại; không đưa mã khóa hoặc không mở khóa sẵn cho họ nếu còn kịp, và không đi theo họ”, hoặc bỏ phần điện thoại nếu không có nguồn. Dán nhãn “suy ra”."
  - "Pháp luật VN, khoản 2: thêm “ví dụ” trước các tình tiết hoặc liệt kê đủ, và thêm dòng khoản 3-4 (12-20 năm; 18-20 năm, chung thân khi làm chết người), dựa trên quote Điều 168 khoản 3, 4."
  - "Lợi ích: bỏ hoặc nhãn “suy ra” cho câu “Bạn kiếm lại được số tiền đó”."

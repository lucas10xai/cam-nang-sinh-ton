  basis: "Trang đầu VBHN 135 liệt kê các luật sửa đổi đến Luật 86/2025/QH15; Điều 22 và 168 có trong bản hợp nhất. Bài Học viện Chính trị CAND ngày 07/10/2026 gọi BLHS sửa đổi 2026 là “dự thảo” (chưa đọc hết nội dung bài, bị rút gọn); chưa thấy luật sửa đổi thông qua trước 08/11/2026. Nên kiểm lại khi Quốc hội họp xong."

    severity: warn
validity:
  doc: "Hướng dẫn xử trí hạ thân nhiệt (Bạch Mai 2017; Báo SKĐS 2015; Nghị định 200/2025/NĐ-CP; đối chiếu NHS 2025, ERC 2025 First Aid)"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Các bài nguồn VN cũ (2015, 2017). ERC First Aid 2025 (DOI 10.1016/j.resuscitation.2025.110752) là hướng dẫn mới hơn, nội dung ngắn hơn (bỏ quần áo ướt, bọc chăn cách nhiệt, chắn gió, cách nền lạnh) và không có 'gạc ấm cổ-ngực-háng'. Nghị định 200/2025/NĐ-CP: hiệu lực từ 2025-08-23 (Điều 53 khoản 1) nhưng chưa tra sửa đổi nên unconfirmed. Không đặt true."
deliberate_vn_deviation:
  - "VN (SKĐS 2015): 'trên 33 độ chỉ cần ủ ấm thông thường' và 'đắp gạc ấm lên cổ, lồng ngực, háng' và 'không cố làm ấm tay và chân'. Quốc tế (NHS 2025): mọi nghi ngờ hạ thân nhiệt là cấp cứu: 'Go to A&E or call 999'; ERC 2025: 'Prevention of hypothermia ... remove wet clothes and use blankets', cách nhiệt khỏi nền, chắn gió, không có bước 'gạc ấm' hay 'không làm ấm tay chân trước'. Mục theo nguồn VN mà không ghi sự lệch."
potential_harm:
  - "steps[3] / tldr: 'Người lú lẫn, gọi không đáp: gọi 115' ngầm báo người run rẩy, nói ngọng, đi loạng choạng (đã là hạ thân nhiệt) thì chưa cần gọi. NHS/Bạch Mai/SKĐS: nghi hạ thân nhiệt là gọi cấp cứu ngay. Người đọc làm đúng chữ có thể chờ tới khi lú lẫn mới gọi, làm chậm cứu chữa."
  - "Ghi chú: 'thân nhiệt xuống dưới 33 độ thì phải tới cơ sở y tế' cùng 'trên 33 độ chỉ cần ủ ấm' (Lợi ích): người đọc không đo được thân nhiệt trung tâm bằng nhiệt kế gia dụng (Bạch Mai: nhiệt kế gia dụng không xác định hạ thân nhiệt) nhưng được cho một ngưỡng để quyết định có đi viện hay không; nguồn NHS không có ngưỡng này."
  - "steps[2] 'Cho uống nước ấm từng ngụm' không điều kiện 'tỉnh táo, nuốt được'. Người đang nói ngọng, loạng choạng, lú lẫn có nguy cơ sặc; NHS: 'if they're fully awake'."
  - "Thiếu bước theo dõi hơi thở và hồi sinh khi ngừng thở/không đáp: SKĐS (nguồn dẫn) và ERC 2025 đều có; mục bỏ hoàn toàn. Người đọc chỉ có 'gọi 115' khi lú lẫn, không có hướng dẫn nếu nạn nhân ngừng thở."
  - "steps[1] không nói thao tác nhẹ nhàng (SKĐS: 'Các động tác với người bệnh cần phải nhẹ nhàng để tránh nguy cơ ngừng tim'; Bạch Mai: 'không trở người nhiều'). Mục cho lệnh thay đồ ướt, quấn chăn, đắp gạc nhưng không giới hạn thao tác mạnh; ở hạ thân nhiệt nặng, thao tác mạnh có thể gây loạn nhịp."
suggested_edits:
  - "tldr, steps[3]: đổi thành 'Nghi hạ thân nhiệt (run lẩy bẩy, nói ngọng, loạng choạng, da lạnh xám): gọi 115 ngay, trong lúc chờ thì thay đồ ướt, ủ ấm. Nếu lú lẫn, không đáp, hoặc ngừng thở: gọi 115, theo dõi hơi thở, ngừng thở thì ép tim theo hướng dẫn tổng đài.' Dựa vào quote NHS 'Go to A&E or call 999 if you think... hypothermia', Bạch Mai 'Gọi trợ giúp y tế ngay lập tức', SKĐS 'Gọi xe cấp cứu... theo dõi hơi thở'."
  - "steps[2]: 'Chỉ cho uống nước ấm (không rượu) khi người đó tỉnh táo, tự cầm và nuốt được', dựa vào NHS 'if they're fully awake'."
  - "steps[1]: 'Thay đồ ướt, bọc chăn khô kể cả đầu, cách khỏi nền lạnh, chắn gió; thao tác nhẹ nhàng, không xoa bóp', dựa vào ERC 2025 (Wet clothing removal; Ground isolation; Wind protection) và NHS. Bỏ hoặc dán nhãn 'theo báo SKĐS 2015' cho 'đắp gạc ấm lên cổ-ngực-háng' và 'không làm ấm tay chân trước'."
  - "Bỏ 'Từ 33 độ... chỉ cần ủ ấm' ra khỏi lời khuyên hành động và bỏ câu 'thân nhiệt xuống dưới 33 độ thì phải tới cơ sở y tế' trong Ghi chú; thay bằng 'mọi nghi hạ thân nhiệt đều cần cơ sở y tế đánh giá' (NHS: 'It's a medical emergency that needs to be treated in hospital')."
  - "Chi phí: sửa 'Túi chườm' thành 'chăn giữ nhiệt/chăn khô', bỏ 'túi chườm' vì step cấm chườm nóng."
  - "Pháp luật VN: bỏ legal_refs hoặc thay bằng nguồn đúng cho '115 là cấp cứu y tế' (Bộ Y tế/Cục Quản lý Khám chữa bệnh về tổng đài cấp cứu 115). Nghị định 200/2025 Điều 3 khoản 4 chỉ liệt kê 112 liên thông 113-114-115."
  - "Nguồn y tế: bổ sung ERC 2025 First Aid hoặc NHS/Red Cross làm nguồn gốc; ghi rõ bài Bạch Mai là bản dịch từ health.gov.il."

  basis: "Chưa mở trang Bộ Y tế/Công báo để xem tình trạng hiệu lực QĐ 5968. Trang Bệnh Nhiệt đới TW đăng ngày 08/06/2026 vẫn dẫn QĐ 5968 làm tài liệu tham khảo số 1 (dấu hiệu còn dùng, không phải bằng chứng hiệu lực). CDC nPEP 2025 (MMWR RR 74(1), 08/05/2025) là hướng dẫn quốc tế mới nhất tôi tìm thấy; mốc 24 giờ/72 giờ/28 ngày khớp."
deliberate_vn_deviation:
  - "Theo dõi xét nghiệm: VN (QĐ 5968) 1 tháng và 3 tháng; CDC 2025 là 4-6 tuần và 12 tuần, kèm HIV Ag/Ab + NAT chẩn đoán, và có khám theo dõi 24 giờ. Khác biệt nhỏ, không gây hại, nhưng mục nên ghi “làm theo lịch bác sĩ hẹn”."
potential_harm: []

  - "Steps: thêm “nếu có tác dụng phụ nặng (phát ban, vàng da, nôn nhiều) thì liên hệ cơ sở y tế chứ không tự bỏ”, và “lịch xét nghiệm theo hẹn của bác sĩ”."
  - "Thêm nơi đến: nêu cụ thể “khoa cấp cứu hoặc phòng khám ngoại trú HIV” và nhắc vẫn nên đi dù quá 72 giờ để được tư vấn."
  - "Nguồn: dẫn bản QĐ 5968/QĐ-BYT từ trang Bộ Y tế/Công báo (hiện chỉ có bản sao bệnh viện) và CDC MMWR RR 74(1) làm nguồn quốc tế; thêm legal_refs."

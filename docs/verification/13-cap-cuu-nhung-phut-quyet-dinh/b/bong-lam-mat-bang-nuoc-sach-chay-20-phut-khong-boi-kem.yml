claims:
  - text: "Ngâm rửa nước sạch càng sớm càng tốt, tốt nhất trong 30 phút sau khi bỏng"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Thời điểm ngâm rửa bằng nước mát càng sớm càng tốt, tốt nhất trong 30 phút từ sau khi bị bỏng. Sau khoảng thời gian trên, ngâm rửa ít tác dụng."
    verdict: match
    note: "Trang Viện Bỏng Quốc gia (cert SSL không xác thực được bằng công cụ đọc, tải bằng curl -k, ngày 04/01/2022). Nguồn là hướng dẫn cho TRẺ EM ('Bỏng nhiệt ở trẻ em'); mục áp dụng cho mọi người. 'Sau khoảng thời gian trên, ngâm rửa ít tác dụng' không có trong mục."
  - text: "Nước sạch nhiệt độ 16-20 độ C"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Yêu cầu là nước sạch, nhiệt độ nước tiêu chuẩn là từ 16 - 20 độ C. Tuy nhiên, vì là cấp cứu, cần tận dụng nguồn nước sẵn có ngay tại nơi bị nạn."
    verdict: match
    note: "Nguồn cho phép dùng nước sẵn có; mục chỉ ghi 'nước sạch mát' trong steps, 16-20 độ ở thân."
  - text: "Thời gian ngâm rửa 15-30-45 phút, thường tới khi hết đau rát"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Thời gian ngâm rửa từ 15 - 30 - 45 phút (thường tới khi hết đau rát)."
    verdict: match
    note: "Cũng trong trang: 'Đặc biệt với trẻ em, khi thời tiết lạnh nên rút bớt thời gian ngâm, đề phòng nhiễm lạnh.'"
  - text: "Con số 20 phút (title, tldr, steps)"
    source_url: https://www.ahajournals.org/doi/10.1161/CIR.0000000000001281
    quote: "It may be reasonable to cool thermal burns for 5 to 20 minutes."
    verdict: inference
    note: "AHA/Red Cross 2024 (COR 2b, B-NR): làm mát 5-20 phút; 'There is a lack of international consensus about the optimal duration'. Viện Bỏng: 15-30-45 phút. 20 phút nằm trong cả hai khung, không phải con số của nguồn nào; mục tự thừa nhận. Hợp lý, không gây hại."
  - text: "Không dùng nước đá, không ngâm nước ấm"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Không dùng nước đá gây nhiễm lạnh cho nạn nhân. Không dùng nước ấm, có nhiệt độ cao hơn (ít tác dụng hạ nhiệt, giảm đau)."
    verdict: match
    note: "AHA 2024 mềm hơn: 'If clean running water is not available, it may be reasonable to cool superficial burns (with the skin intact) with ice wrapped in cloth' (COR 2b), tối đa 10 phút. Mục theo Viện Bỏng; xem deliberate_vn_deviation."
  - text: "Không bôi kem đánh răng, nước mắm, mỡ trăn (steps)"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Đắp các loại thuốc mỡ, dầu, nước mắm, nước tương hoặc bất kỳ chất gì khi không có ý kiến của nhân viên y tế."
    verdict: partial
    note: "Nước mắm có tên; 'kem đánh răng', 'mỡ trăn' thuộc 'bất kỳ chất gì' nhưng không được nêu. Bẫy 1 nói 'Tất cả nằm trong danh sách cấm vì làm bẩn vết thương và che mất độ sâu' - lý do này không có trong nguồn."
  - text: "Không chọc nốt phồng; băng ép nhẹ"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Không làm vỡ, làm trợt vòm nốt phồng."
    verdict: match
    note: "Nguồn: 'Băng ép nhẹ vết bỏng làm hạn chế tạo nốt phồng, giảm phù nề chi bị bỏng. Băng ép cần tiến hành sớm, trách băng quá chặt gây chèn ép vùng bỏng.' Với bỏng mặt/sinh dục: 'chỉ cần phủ một lớp gạc.'"
  - text: "Đi viện nếu bỏng rộng hơn hai bàn tay, hoặc ở mặt, tay, chân, sinh dục, hoặc lơ mơ, sốt cao, khó thở (steps, tldr)"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Diện tích bỏng lớn hơn/bằng 2 bàn tay cơ thể. Bỏng kèm chấn thương. Bỏng ở vùng đầu, mặt, cổ, bàn tay, bàn chân, sinh dục. Lơ mơ, lẫn lộn. Sốt cao, co giật, chân tay lạnh. Bỏ bú, khó thở, xanh tím, đái ít, bụng chướng."
    verdict: partial
    note: "(1) Ngưỡng nguồn là 'lớn hơn/bằng 2 bàn tay' (mục Lợi ích ghi đúng 'hơn hoặc bằng'); title/tldr/steps/Nói dễ hiểu ghi 'rộng hơn hai bàn tay', bỏ 'bằng'. (2) Nguồn là hướng dẫn cho trẻ em; bàn tay là bàn tay của người bị bỏng. (3) AHA 2024: 'Large partial-thickness burns (partial-thickness burns that involve the face, hands, feet, or genitalia), all full-thickness burns, and concern for inhalation injury (soot around the nose or mouth, difficulty breathing) require hospital treatment' - mục không có bỏng toàn bộ chiều dày/bỏng đường thở, bỏng kèm chấn thương, bỏng điện/hóa chất."
  - text: "Nước chảy liên tục cho vùng bỏng nhiệt (đối chiếu quốc tế)"
    source_url: https://www.ahajournals.org/doi/10.1161/CIR.0000000000001281
    quote: "Thermal burns should be cooled immediately, preferably with clean running water."
    verdict: match
    note: "AHA/Red Cross 2024, COR 1, B-NR. Bản gương PDF cùng DOI (sae-emergencias.org). Tóm tắt: làm mát ngay bằng nước sạch chảy."
  - text: "Trẻ nhỏ/bỏng rộng có nguy cơ hạ thân nhiệt khi ngâm nước lạnh lâu (Bẫy 2)"
    source_url: https://www.ahajournals.org/doi/10.1161/CIR.0000000000001281
    quote: "Preadolescent children with thermal burns being actively cooled with running water should be monitored for signs or symptoms of hypothermia."
    verdict: partial
    note: "AHA 2024 COR 1, C-LD. Viện Bỏng: 'việc tưới rửa nước cần kiểm soát chặt chẽ khi diện bỏng rộng trên 10% diện tích cơ thể, nhất là trẻ em nhỏ tuổi'. Mục đưa cảnh báo ở Bẫy 2 nhưng steps ('20 phút liên tục') không kèm điều kiện này."
  - text: "Quần áo, nhẫn, đồng hồ: cởi bỏ tại vùng bỏng (nguồn dặn, mục bỏ)"
    source_url: https://vienbongquocgia.vn/huong-dan-so-cap-cuu-bong/huong-dan-so-cap-cuu-bong-nhiet-o-tre-em
    quote: "Kết hợp nhanh chóng cởi bò quần áo chật, nhẫn hoặc đồng hồ tại vùng bỏng."
    verdict: not-found
    note: "Mục không có bước này (không phải khẳng định sai, là chỗ thiếu); nhẫn/đồng hồ dễ siết khi sưng. Ghi ở suggested_edits."

validity:
  doc: "Hướng dẫn sơ cấp cứu bỏng nhiệt ở trẻ em, Viện Bỏng Quốc gia Lê Hữu Trác (04/01/2022); AHA/Red Cross First Aid 2024"
  in_force: unconfirmed
  effective_from: "2022-01-04 (ngày đăng trên trang)"
  amended_by: []
  basis: "Hướng dẫn y tế, không có 'hiệu lực'. Trang đăng 04/01/2022. AHA/Red Cross 2024 (Circulation 2024;150) là hướng dẫn mới hơn, khung 5-20 phút, không mâu thuẫn mục. Không thấy phiên bản mới hơn của Viện Bỏng; không kiểm được."
deliberate_vn_deviation:
  - "Thời gian làm mát: Viện Bỏng 15-30-45 phút; AHA 2024 5-20 phút ('lack of international consensus'). Mục chọn 20 phút (trong cả hai)."
  - "Nước đá: Viện Bỏng 'Không dùng nước đá'; AHA 2024 cho phép đá bọc vải ≤10 phút cho bỏng nông khi không có nước chảy (COR 2b). Mục theo Viện Bỏng (an toàn hơn cho bỏng rộng và trẻ nhỏ)."
potential_harm:
  - "steps[0] '20 phút liên tục' không kèm điều kiện: nguồn (Viện Bỏng) cần kiểm soát chặt khi bỏng >10% diện tích cơ thể, nhất là trẻ nhỏ, mùa lạnh (rút ngắn thời gian, giữ ấm phần không bỏng); AHA: theo dõi hạ thân nhiệt ở trẻ chưa dậy thì. Làm đúng nguyên văn với trẻ nhỏ bỏng rộng có thể gây hạ thân nhiệt; Bẫy 2 có cảnh báo nhưng không ở steps. Mức: trung bình."
  - "steps[3] (đi viện) bỏ dấu hiệu AHA 'bỏng toàn bộ chiều dày' và 'nghi tổn thương đường thở (muội quanh mũi miệng, khó thở)', bỏng kèm chấn thương: người bỏng nhà cháy, hít khói chỉ có 'khó thở' mới thấy. Mức: thấp-trung bình."
suggested_edits:
  - "title/tldr/steps/Nói dễ hiểu: đổi 'rộng hơn hai bàn tay' thành 'lớn hơn hoặc bằng hai bàn tay (bàn tay của người bị bỏng)', dựa vào quote 'Diện tích bỏng lớn hơn/bằng 2 bàn tay cơ thể'."
  - "steps[0]: thêm 'Bỏng rộng hoặc trẻ nhỏ, trời lạnh: rút ngắn thời gian, giữ ấm phần cơ thể không bị bỏng, theo dõi rét run', dựa vào Viện Bỏng (>10% diện tích cơ thể) và AHA 2024 ('monitored for signs or symptoms of hypothermia')."
  - "steps: thêm 'Cởi bỏ quần áo chật, nhẫn, đồng hồ ở vùng bỏng trước khi sưng' (Viện Bỏng: 'cởi bỏ quần áo chật, nhẫn hoặc đồng hồ tại vùng bỏng')."
  - "steps[3]: thêm bỏng nghi chiều sâu (da trắng/đen, không đau), bỏng kèm hít khói/muội quanh mũi miệng, bỏng kèm chấn thương; thêm 'bỏng điện hoặc hóa chất: làm theo mục khác' (AHA 2024: 'all full-thickness burns, and concern for inhalation injury')."
  - "Bẫy 1: thay 'Tất cả nằm trong danh sách cấm vì làm bẩn vết thương và che mất độ sâu' bằng 'Viện Bỏng cấm đắp thuốc mỡ, dầu, nước mắm, nước tương hoặc bất kỳ chất gì khi chưa có ý kiến nhân viên y tế'; lý do 'che độ sâu' ghi là suy ra."
  - "Ghi rõ ở Nguồn rằng bài của Viện Bỏng là hướng dẫn cho trẻ em; thêm AHA/Red Cross 2024 (https://www.ahajournals.org/doi/10.1161/CIR.0000000000001281) làm nguồn quốc tế cho 'làm mát ngay bằng nước chảy' và khung 5-20 phút."

  in_force: unconfirmed
  effective_from: 2024-11-05
  amended_by: []
  basis: 'Bản PDF bvtn.org.vn: trang 1 (quyết định) là ảnh quét, phần văn bản trích được ghi "Quyết định số /QĐ-BYT ngày tháng năm 2024" (trống); số/ngày chỉ xác nhận qua luatvietnam.vn (thứ cấp): "Số hiệu 3312/QĐ-BYT", "Ngày ban hành 05/11/2024", Điều 3 "có hiệu lực kể từ ngày ký, ban hành và thay thế Quyết định số 5331/QĐ-BYT ngày 23 tháng 12 năm 2020". Ô "Tình trạng hiệu lực" bị che (cần đăng nhập). Chưa có bằng chứng sơ cấp về việc còn hiệu lực/chưa bị thay thế.'
deliberate_vn_deviation: []
potential_harm:
  - 'Bẫy 1: "270 phút là hạn cuối để dùng thuốc tiêu huyết khối, không phải hạn để quan sát. Qua mốc đó thì mất một lựa chọn điều trị" + tldr. Người đọc có triệu chứng quá 4,5 giờ hoặc ngủ dậy mới thấy triệu chứng có thể kết luận đã hết cách và trì hoãn/bỏ đi viện, trong khi QĐ 3312 vẫn cho tiêu huyết khối 4,5–9 giờ theo hình ảnh, đột quỵ thức giấc và lấy huyết khối cơ học tới 24 giờ. Mọi trường hợp đột quỵ nghi ngờ đều phải gọi 115 bất kể giờ.'
suggested_edits:
  - 'tldr: thay "Thuốc tiêu huyết khối cần triệu chứng dưới 270 phút, nên không chờ xem có đỡ không" bằng "Điều trị mở lại mạch máu phụ thuộc giờ khởi phát (thường trong 4,5 giờ, một số ca tới 9 giờ hoặc hơn khi có hình ảnh phù hợp), nên gọi 115 ngay và ghi giờ" — dựa vào quote mục 4.2.2 và 4.5.2 ("trong khoảng 4,5-9 giờ có thể dùng thuốc tiêu huyết khối đường tĩnh mạch nếu thỏa mãn").'
  - 'Bẫy 1: bỏ "hạn cuối ... mất một lựa chọn". Viết: "Mốc 270 phút là điều kiện thông thường; ngoài mốc vẫn có thể có điều trị nhưng chọn lọc hơn. Đừng chờ; đi càng sớm càng nhiều lựa chọn."'
  - 'Mục Nguồn: thêm AHA/Red Cross 2024 First Aid (FAST) và/hoặc bài HCDC 30/9/2025 cho các bước người dân (cười/giơ tay/nói, gọi 115, không cho uống thuốc, đầu nghiêng); gắn nhãn "suy ra" cho "không chở xe máy" và "không cho ăn uống".'
  - 'Định nghĩa TIA: viết đủ "triệu chứng thần kinh khu trú do thiếu máu não ở một khu vực hoặc võng mạc ... không có tổn thương nhồi máu cấp trên hình ảnh cộng hưởng từ".'
  - Bỏ hoặc tìm nguồn cho "Quỹ bảo hiểm y tế trả phần lớn" và "mỗi phút chờ là một phần vùng não chết thêm".

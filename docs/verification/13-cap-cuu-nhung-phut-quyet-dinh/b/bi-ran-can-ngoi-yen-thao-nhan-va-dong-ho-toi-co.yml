validity:
  doc: "Quyết định 5152/QĐ-BYT ngày 12/12/2014 của Bộ Y tế (Hướng dẫn chẩn đoán và xử trí rắn lục xanh đuôi đỏ cắn); WHO Guidelines for the management of snakebites (2016); ERC 2025 First Aid"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Chỉ có bản đăng lại (2020, sửa 22/08/2022) trên trang Bệnh viện Quảng Trị; không mở được văn bản gốc, không tìm thấy dấu hiệu thay thế bằng hướng dẫn mới hơn. Có thể đã có hướng dẫn Bộ Y tế mới về rắn độc cắn (chưa tra). WHO Treatment page (2016/2019) còn đang dùng: 'Never use a tight arterial tourniquet'. ERC 2025: 'Do not apply a pressure dressing, ice, heat, or use tourniquets' (cho European viper)."
deliberate_vn_deviation:
  - "QĐ 5152/QĐ-BYT (rắn lục): 'Băng ép tại chỗ cắn trở lên gốc chi... Băng tương đối chặt nhưng không quá mức'. ERC 2025 (rắn lục châu Âu): 'Do not apply a pressure dressing, ice, heat, or use tourniquets'. WHO: PIB 'only recommended for bites by neurotoxic snakes that do not cause local swelling'. Hướng dẫn VN cho rắn lục cho băng ép nhẹ, ERC cấm băng ép cho rắn lục. Mục thì không băng ép (đúng với ERC, lệch với QĐ 5152) nhưng không ghi sự lệch."
potential_harm:
  - "Tiêu đề/tldr/step 3 'Không buộc ga-rô' cho mọi rắn cắn mà không nêu băng ép bất động cho rắn có nọc thần kinh (cạp nong, cạp nia, hổ mang). WHO coi PIB là phương án cho các loài này; người bị rắn thần kinh cắn làm đúng nguyên văn mục thì thiếu biện pháp làm chậm lan nọc (potential delay in effective first aid). Nguồn mục dẫn không phải cho các loài này."
  - "Thiếu hướng dẫn tư thế vận chuyển và theo dõi thở: WHO: 'Many people die every year on the way to a health facility as a result of being transported lying flat on their backs and having their upper airway obstructed by vomit, or paralysis of muscles in the tongue. Keep them on their left side'. Mục viết 'Ngồi hoặc nằm yên... không tự đi lại', không có tư thế nghiêng trái, không có 'theo dõi hơi thở, sẵn sàng hồi sức'."
  - "Step 4 'hỏi trước cơ sở nào có huyết thanh... hoặc gọi 115 nhờ điều phối' có thể làm chậm khởi hành nếu người đọc dừng để gọi hỏi nhiều nơi trước khi đi; mục không nói 'đi ngay trong lúc gọi' hoặc 'đến cơ sở cấp cứu gần nhất nếu không biết nơi nào có'. Nguồn QĐ: 'chuyển nạn nhân đến bệnh viện ngay'; WHO: transport 'without delay'. Bẫy 3 nói 'tới bệnh viện huyện... rồi nằm chờ' là sai, nhưng cách mục đối phó (hỏi trước) có thể tốn thời gian; nguồn nào cũng không cho ưu tiên hỏi trước."
  - "steps[0] 'ngang tầm tim' và 'không tự đi lại' không kèm 'dừng mọi vận động, đừng uống rượu/cà phê', một số nơi dùng 'ngang tầm tim' mà nguồn mục dẫn không có; không gây hại rõ nhưng là hướng dẫn không nguồn."
suggested_edits:
  - "Tiêu đề, tldr, steps: thu hẹp hoặc nêu rõ phạm vi. Đề xuất 'Bị rắn độc cắn (rắn lục, hổ mang, cạp nong...): ...' và thêm bước 'nếu biết hoặc nghi là rắn hổ mang/cạp nong (liệt, sụp mi, khó thở, không sưng), hỏi tổng đài 115 về băng ép bất động'. Dựa vào quote WHO 'only recommended for bites by neurotoxic snakes that do not cause local swelling' và QĐ 5152 (hướng dẫn riêng rắn lục xanh đuôi đỏ). Nếu không thêm nguồn cho rắn thần kinh thì ghi rõ 'mục này chỉ cho rắn lục'."
  - "step 3, Bẫy 1: chỉnh 'không buộc ga-rô' thành 'không buộc ga-rô chặt vào động mạch' khớp quote 'không garô động mạch', hoặc chọn một dòng nhất quán với WHO 'Never use a tight arterial tourniquet' và nói rõ có/không băng ép."
  - "step 4: 'Đi ngay đến cơ sở cấp cứu gần nhất có khoa cấp cứu/hồi sức; vừa đi vừa gọi 115 hỏi nơi có huyết thanh; không đợi', dựa vào quote QĐ 5152 'Phải chuyển nạn nhân đến bệnh viện ngay' và WHO 'transported to a health facility without delay'."
  - "Thêm bước vận chuyển: 'Nằm nghiêng trái, miệng hướng xuống nếu nôn hoặc mệt; theo dõi thở; thở yếu thì gọi 115 và hồi sức', dựa vào WHO ('Keep them on their left side with mouth turned down')."
  - "step 5: 'Không cố bắt hay giết rắn; nếu rắn đã chết hoặc bắt được an toàn thì mang theo hoặc chụp ảnh', dựa vào quote QĐ 5152 'phải đem cùng với bệnh nhân đến bệnh viện để nhận dạng' (bỏ phần chụp ảnh nếu muốn bám sát nguồn)."
  - "Bỏ 'ngang tầm tim' hoặc dán nguồn. Bỏ 'hút bằng miệng' khỏi 'văn bản xếp vào loại gây hại' và nguồn bằng WHO ('suction') / ERC ('never try to suck out the venom')."
  - "Mục 'Ở Việt Nam. Huyết thanh... tập trung ở tuyến tỉnh... Chợ Rẫy... tuyến huyện thường không có': bỏ hoặc dẫn nguồn (Bộ Y tế/Trung tâm chống độc); trang Bạch Mai đã dẫn không chứa câu này."
  - "legal_refs: thay URL bằng văn bản QĐ 5152/QĐ-BYT gốc (Bộ Y tế/Cục Quản lý Khám chữa bệnh), điền effective_from, điền quote."

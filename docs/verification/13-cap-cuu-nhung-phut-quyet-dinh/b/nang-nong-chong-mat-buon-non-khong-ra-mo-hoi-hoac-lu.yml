    severity: warn
validity:
  doc: "Hướng dẫn y tế: BV Bạch Mai (2014), BV TWQĐ 108 (2023), Báo Chính phủ dẫn Bộ Y tế (2023); đối chiếu CDC (tờ rơi Heat-Related Illnesses)"
  in_force: unconfirmed
  effective_from: "2014"
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. Nguồn VN dùng cũ (2014–2023), chưa tìm được hướng dẫn mới hơn của Bộ Y tế VN trong phiên này. Phía quốc tế, Wilderness Medical Society 2024 (Eifling et al., Wilderness & Environmental Medicine, doi 10.1177/10806032241227924) theo kết quả tìm kiếm khuyến cáo ngâm nước đá/nước lạnh toàn thân là ưu tiên đối với sốc nhiệt; KHÔNG mở được toàn văn (trang SAGE lỗi kết nối), chỉ thấy qua tìm kiếm thứ cấp nên không dùng làm claim."
deliberate_vn_deviation:
  - "Mục 22 (theo BV 108 bài 2020 và Báo Chính phủ) cho uống nước khi người nghi sốc nhiệt còn tỉnh; CDC (tờ rơi Heat-Related Illnesses) ghi cho 'HEAT STROKE': 'Do not give the person anything to drink' (chỉ cho nhấp nước ở 'HEAT EXHAUSTION'). Hướng dẫn VN cũng lệch ở chỗ nhấn mạnh quạt/nước ấm bốc hơi; hướng dẫn quốc tế hiện đại (WMS 2024, chưa mở được toàn văn) ưu tiên ngâm nước lạnh cho sốc nhiệt gắng sức."
  - "CDC: gọi 911 ngay với mọi nghi sốc nhiệt. Mục 22 chỉ gọi 115 khi lú lẫn/co giật/hôn mê."
potential_harm:
  - "Bước 4 chỉ gọi 115 khi đã lú lẫn/co giật/hôn mê. Người nghi sốc nhiệt (nhiệt cao, da nóng, không ra mồ hôi, chóng mặt, buồn nôn) còn tỉnh làm đúng nguyên văn sẽ chỉ làm mát và có thể không gọi 115/không đi viện; Bạch Mai: 'Tiên lượng xấu tỉ lệ với thời gian từ lúc tăng thân nhiệt tới lúc được điều trị'. Có thể làm chậm cứu chữa."
  - "Bước 3 'Chỉ cho uống khi người bệnh còn tỉnh và uống được' không kèm giới hạn 'người nghi sốc nhiệt thì tốt nhất không uống gì, ưu tiên làm mát' như CDC; người đang nhiễu ý thức sớm, chưa nhận ra lú lẫn, có thể bị sặc. Mức: trung bình."
suggested_edits:
  - "steps[3] + tldr: thêm bước gọi 115 (hoặc 113, xem mục 49) ngay từ đầu cho mọi người nghi sốc nhiệt (thân nhiệt cao, da nóng, nôn, chóng mặt kèm không ra mồ hôi), không chờ lú lẫn. Dựa vào Bạch Mai 'Tất cả bn sốc nhiệt đều phải cho vào viện theo dõi' và 108 'chuyển ngay vào viện nếu nghi ngờ sốc nhiệt'."
  - "steps[2]: đổi thành 'Chỉ cho nhấp nước từng ngụm khi còn hoàn toàn tỉnh; người nghi sốc nhiệt, ưu tiên làm mát, không ép uống' và ghi rõ đây là hướng dẫn VN, CDC không cho uống ở sốc nhiệt."
  - "Phần Lợi ích/Bẫy 2: sửa 'Cả ba hướng dẫn' thành 'Báo Chính phủ và 108 (bài 2020)'; sửa URL nguồn 108 hoặc thêm bài 'Say nắng, say nóng vẫn là...' vào mục Nguồn; bỏ gán 'bỏ bớt quần áo bên ngoài' cho 108."
  - "Cân nhắc thêm ý ngâm/dội nước lạnh toàn thân (WMS 2024) sau khi mở được toàn văn để xác nhận; hiện mục chỉ nói 'nước mát' và khăn lạnh, chưa nêu phương án làm mát mạnh nhất."

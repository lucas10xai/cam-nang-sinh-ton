claims:
  - text: "Bạch Mai: sốc nhiệt là tăng thân nhiệt quá mức, thường trên 40 độ, kèm tổn thương thần kinh và bí mồ hôi"
    source_url: "https://bachmai.gov.vn/bai-viet/say-nang-va-benh-ly-than-nhiet?id=aa64d8a6-5900-e87e-e5d4-b34b5c0b70b9"
    quote: "Sốc nhiệt hay say nắng (heat stroke): là tình trạng tăng thân nhiệt quá mức, thường > 40 độ, thường kèm theo đáp ứng viêm hệ thống dẫn tới tổn thương cơ quan đích cùng với tổn thương thần kinh, và tình trạng bí mồ hôI (anhidrosis)"
    verdict: match
    note: "Bài đăng 27/05/2014 (ThS.BS Nguyễn Hữu Quân, Khoa Cấp cứu), đã 12 năm. Trích đúng chính tả nguồn."
  - text: "Bạch Mai hướng dẫn cởi quần áo, lau bằng nước ấm rồi quạt, đặt gói đá ở cổ, nách, bẹn"
    source_url: "https://bachmai.gov.vn/bai-viet/say-nang-va-benh-ly-than-nhiet?id=aa64d8a6-5900-e87e-e5d4-b34b5c0b70b9"
    quote: "Cởi bỏ quần áo bệnh nhân lau bằng nước ấm sau đó dùng quạt thổi."
    verdict: match
    note: "Ý gói đá ở cổ/nách/bẹn: 'Biện pháp hỗ trợ khác là đặt các gói đá lạnh và cổ, nách, bẹn'. Lưu ý: bước 2 của mục nói 'nước mát', Bạch Mai nói 'nước ấm' (bốc hơi, tránh co mạch); mục đã ghi đúng Bạch Mai ở phần Lợi ích nhưng bước hành động lấy 'nước mát' từ Báo Chính phủ/108 (không mâu thuẫn nghiêm trọng)."
  - text: "Bạch Mai: hạ nhiệt nhanh và dừng khi thân nhiệt về 38 độ"
    source_url: "https://bachmai.gov.vn/bai-viet/say-nang-va-benh-ly-than-nhiet?id=aa64d8a6-5900-e87e-e5d4-b34b5c0b70b9"
    quote: "Lý tưởng là giảm nhiệt độ 0,2 độ C/phút. Nên dừng khi nhiệt độ = 38 độ."
    verdict: match
    note: "Đây là hướng dẫn tại khoa Cấp cứu (có đo thân nhiệt trung tâm), không phải bước người dân tự làm. Mục không đưa số này vào steps/tldr, đúng."
  - text: "Bệnh viện 108: phòng 20–22 độ, xối nước 25–30 độ, phủ gạc ướt 20–25 độ rồi quạt"
    source_url: "https://benhvien108.vn/canh-bao-soc-nhiet-do-nang-nong-va-cach-phong-tranh.htm"
    quote: "Đặt bệnh nhân trong phòng lạnh 20- 22 độ C và quạt - Xối nước lạnh 25- 30 độ C vào bệnh nhân hoặc phủ gạc ướt, lạnh 20-25 độ C vào bệnh nhân và quạt"
    verdict: match
    note: "Gộp hai gạch đầu dòng liền kề của nguồn. Nguồn gốc 2023 (BS Nguyễn Đức Lộc, Nguyễn Thị Huyền Trang, Khoa Hồi sức nội và chống độc, 108)."
  - text: "108: vừa vận chuyển vừa hạ nhiệt, không chờ đủ phương tiện làm mát (step 2 'đừng chờ đủ đá')"
    source_url: "https://benhvien108.vn/canh-bao-soc-nhiet-do-nang-nong-va-cach-phong-tranh.htm"
    quote: "Việc hạ thân nhiệt bệnh nhân bằng mọi cách cần được thực hiện, tuy nhiên không được gây cản trở việc vận chuyển bệnh nhân đến cơ sở y tế gần nhất, có thể vận chuyển bằng xe có điều hòa nhiệt độ hoặc mở cửa sổ, vừa vận chuyển vừa hạ nhiệt bệnh nhân."
    verdict: match
    note: "Nguồn không nói 'chờ đủ đá làm mất phút đầu' (Bẫy 3 là suy ra, hợp lý nhưng không phải chữ của nguồn)."
  - text: "Bệnh viện 108 (bài được dẫn ở mục): chỉ cho uống nước/dung dịch điện giải khi người bệnh tỉnh táo, uống được"
    source_url: "https://benhvien108.vn/canh-bao-soc-nhiet-do-nang-nong-va-cach-phong-tranh.htm"
    quote: "Cho uống nhiều nước hoặc dung dịch điện giải nếu bệnh nhân tỉnh táo, có thể uống được"
    verdict: partial
    note: "Câu này KHÔNG có trong URL ghi ở mục Nguồn (bài 'Cảnh báo sốc nhiệt...'); nó nằm ở bài khác của 108 'Say nắng, say nóng vẫn là những vấn đề cấp thiết trong mùa hè' (benhvien108.vn/“-say-nang-say-nong”-van-la-nhung-van-de-cap-thiet-trong-mua-he.htm, mục 5.5, bài 2020). Bài khác đó còn nói 'nhiều nước' chứ không 'từng ngụm'. Sai URL dẫn nguồn."
  - text: "Báo Điện tử Chính phủ (dẫn Bộ Y tế): nếu uống được thì cho uống từng ngụm nhỏ nước mát; mức độ nặng gọi 115 hoặc đưa đến cơ sở y tế"
    source_url: "https://baochinhphu.vn/cach-phong-tranh-va-xu-tri-khi-say-nang-dot-quy-do-nong-10223052317263386.htm"
    quote: "Nếu nạn nhân uống được nước, cho uống từng ngụm nhỏ nước mát. Tốt nhất là uống nước có bổ sung muối và khoáng chất như nước Oresol pha đúng liều lượng theo hướng dẫn sử dụng. ... Nếu nạn nhân có các biểu hiện ở mức độ nặng, cần gọi ngay cấp cứu 115 hoặc nhanh chóng đưa nạn nhân đến cơ sở y tế gần nhất."
    verdict: match
    note: "Hai câu liền đoạn (dấu ... = lược bỏ). Bài 23/05/2023. Cùng bài: 'Mức độ nặng' gồm 'co giật, ngất xỉu hoặc hôn mê' (không có chữ 'lú lẫn')."
  - text: "Mục: 'Cả ba hướng dẫn đều đặt điều kiện người bệnh còn tỉnh và uống được' (Bẫy 2)"
    source_url: "https://bachmai.gov.vn/bai-viet/say-nang-va-benh-ly-than-nhiet?id=aa64d8a6-5900-e87e-e5d4-b34b5c0b70b9"
    quote: ""
    verdict: mismatch
    note: "Bài Bạch Mai (mục Ngoài bệnh viện) không có điều kiện 'tỉnh/uống được' cho việc uống nước; chỉ khoa Cấp cứu mới nói uống NaCl 0,1% cho lả nhiệt nhẹ. Chỉ 2/3 nguồn (Báo Chính phủ, 108 bài khác) có điều kiện này. Sửa 'cả ba' thành 'hai trong ba'."
  - text: "Người lú lẫn, co giật, hôn mê: đặt nằm nghiêng, không đưa gì vào miệng"
    source_url: "https://suckhoedoisong.vn/nang-nhu-do-lua-bac-si-bach-mai-chi-cach-nhan-biet-som-say-nang-de-tranh-nguy-hiem-tinh-mang-169260525161204489.htm"
    quote: "Nếu bất tỉnh, đặt nằm nghiêng an toàn và gọi cấp cứu ngay."
    verdict: partial
    note: "Nguồn chỉ nói 'bất tỉnh'. Với 'lú lẫn' còn tỉnh, hoặc đang co giật, không nguồn nào trong mục nói nằm nghiêng (cấp cứu thông thường: co giật thì bảo vệ khỏi chấn thương, nằm nghiêng sau cơn). 'Dễ sặc nước vào đường thở' là suy luận không có trong nguồn. URL này không nằm trong mục Nguồn của mục 22 (có trong mục 23)."
  - text: "Người nghi sốc nhiệt: không cho uống nếu lú lẫn; còn tỉnh thì cho uống (so với CDC)"
    source_url: "https://www.cdc.gov/disasters/extremeheat/pdf/Heat_Related_Illness.pdf"
    quote: "HEAT STROKE ... Call 911 right away-heat stroke is a medical emergency. Move the person to a cooler place. Help lower the person's temperature with cool cloths or a cool bath. Do not give the person anything to drink"
    verdict: partial
    note: "Tiếng Việt: CDC (tờ rơi Heat-Related Illnesses) với sốc nhiệt: GỌI 911 NGAY, đưa vào chỗ mát, hạ nhiệt bằng khăn lạnh/tắm mát, KHÔNG cho uống gì. Mục 22 cho uống khi còn tỉnh (theo nguồn VN) và chỉ gọi 115 khi lú lẫn/co giật/hôn mê. Xem deliberate_vn_deviation."
internal_checks:
  - issue: "steps chỉ yêu cầu gọi 115 ở bước 4 cho người lú lẫn/co giật/hôn mê. Người nghi sốc nhiệt còn tỉnh (da nóng khô, nôn, chóng mặt, nhiệt >40) không có bước 'gọi 115/đưa đi viện' nào, dù Bạch Mai ghi 'Tất cả bn sốc nhiệt đều phải cho vào viện theo dõi' và mục tự nói ở phần Ghi chú rằng người còn tỉnh vẫn cần đi viện."
    severity: warn

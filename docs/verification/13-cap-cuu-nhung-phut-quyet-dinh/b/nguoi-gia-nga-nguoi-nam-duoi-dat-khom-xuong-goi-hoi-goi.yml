  - text: "Lời dặn: đứng lên từ từ sau khi ngồi/nằm; choáng thì dừng, ngồi hoặc nằm nơi an toàn, báo người thân"
    source_url: https://hcdc.vn/phong-ngua-te-nga-cho-nguoi-cao-tuoi-nhan-dien-nguy-co-chu-dong-phong-ngua-aV9cMP.html
    quote: hãy đứng lên từ từ sau khi ngồi hoặc nằm, tránh vội vàng khi di chuyển và hạn chế mang vác nặng khi lên xuống cầu thang. Nếu cảm thấy choáng hoặc mất thăng bằng, cần dừng lại, ngồi hoặc nằm xuống nơi an toàn và báo cho người thân.
    verdict: match
    note: ""
  - text: QĐ 3312 xếp liệt mặt, liệt nửa người, rối loạn ngôn ngữ, nhìn đôi, thất điều, chóng mặt vào nhóm biểu hiện khởi phát của nhồi máu não
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Biểu hiện khởi phát hay gặp của nhồi máu não thường đột ngột với sự xuất hiện đơn độc hoặc phối hợp của các dấu hiệu và triệu chứng hay gặp sau: + Liệt nửa người, liệt một chi hoặc liệt tứ chi (hiếm gặp) ... + Nhìn đôi + Rối loạn ngôn ngữ + Liệt mặt + Thất điều + Chóng mặt (hiếm khi xuất hiện đơn độc)"
    verdict: match
    note: Số/ngày 3312/QĐ-BYT 05/11/2024 chỉ xác nhận qua bản thứ cấp (luatvietnam.vn), vì trang 1 PDF là ảnh quét. Mục 3.1 Lâm sàng của bài "Hướng dẫn chẩn đoán và điều trị nhồi máu não cấp".
  - text: Thời điểm khởi phát/lần cuối thấy bình thường rất quan trọng để xét tái tưới máu; ngủ dậy có triệu chứng/không người chứng kiến = đột quỵ không rõ thời điểm khởi phát
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Thời điểm khởi phát triệu chứng hoặc thời điểm cuối cùng thấy người bệnh còn bình thường: là rất quan trọng để xét điều trị tái tưới máu. Nếu ngủ dậy đã có triệu chứng hoặc không có người chứng kiến thì gọi là đột quỵ không rõ thời điểm khởi phát."
    verdict: match
    note: ""
  - text: "Đột quỵ không rõ thời điểm: bác sĩ phải dựa vào hình ảnh học chứ không dựa vào giờ"
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: Do đó, trên các người bệnh đột quỵ không rõ giờ khởi phát, nếu có bất tương xứng tăng tín hiệu trên DWI nhưng chưa bất thường trên xung FLAIR, thì ước lượng giờ khởi phát đột quỵ vẫn còn nằm trong cửa sổ 4,5 giờ và chỉ định tiêu huyết khối tĩnh mạch.
    verdict: partial
    note: Tài liệu dùng hình ảnh (DWI/FLAIR, tưới máu) để ước lượng giờ/chọn ca khi không rõ giờ; câu "không dựa vào giờ" là diễn giải quá tay (vẫn tính từ lúc ngủ, ví dụ "Trong vòng 9 giờ kể từ điểm giữa giấc ngủ").
  - text: '"Không bế hay kéo ngồi dậy" (steps, tldr) người ngã'
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: If a person has been injured, is responsive, and is breathing normally and the nature of the injury suggests a neck, back, hip, or pelvic injury, the person should be left in the position in which they were found to avoid potential further injury unless the area is unsafe.
    verdict: partial
    note: cpr.heart.org trả 403; quote đọc từ bản gương u1-cd-cpr.sc.heart.org (2024 AHA and American Red Cross Guidelines for First Aid, Circulation 2024;150:e519, doi 10.1161/CIR.0000000000001281). Khuyến cáo có điều kiện (nghi chấn thương cổ/lưng/hông/chậu); mục viết vô điều kiện. Cả hai nguồn trong mục (HCDC, QĐ 3312) KHÔNG nói "đừng bế/kéo dậy".
  - text: Gọi 115 nếu không đứng dậy được hoặc yếu tay, méo miệng, nói khó
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: Any abnormalities in responsiveness or breathing and any major injuries should be viewed as an emergency and should prompt activation of EMS. ... Loss of vision, hearing, speech, movement, or balance
    verdict: partial
    note: 'cpr.heart.org trả 403; quote đọc từ bản gương u1-cd-cpr.sc.heart.org (2024 AHA and American Red Cross Guidelines for First Aid, Circulation 2024;150:e519, doi 10.1161/CIR.0000000000001281). Danh sách "signs of a first aid emergency" còn có: "Unresponsiveness or new confusion", "Breathing that is absent, abnormal sounding", "Severe pain", "Broken and dislocated limbs". Mục chỉ liệt kê 2 nhóm, thiếu mất ý thức/lú lẫn mới, không thở bình thường (→ mục 01), đau dữ dội/nghi gãy xương, đập đầu.'
  - text: Nhìn ngực xem có thở (steps bước 2)
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: First aid providers should assess the ill or injured person by checking for responsiveness, breathing, and potential injuries.
    verdict: partial
    note: "cpr.heart.org trả 403; quote đọc từ bản gương u1-cd-cpr.sc.heart.org (2024 AHA and American Red Cross Guidelines for First Aid, Circulation 2024;150:e519, doi 10.1161/CIR.0000000000001281). Bước kiểm tra có đủ nhưng steps/tldr không nói làm gì khi KHÔNG tỉnh/không thở bình thường (gọi 115 + ép tim, xem mục 01): xem potential_harm."
  - text: Gọi 115 không mất tiền
    source_url: https://mst.gov.vn/mien-phi-cac-cuoc-goi-den-so-113-114-115-197140697.htm
    quote: Người sử dụng dịch vụ điện thoại cố định mặt đất hoặc dịch vụ thông tin di động mặt đất gọi đến các số dịch vụ khẩn cấp (113, 114, 115) được miễn phí.
    verdict: match-secondary
    note: Nguồn thứ cấp (bản tin Cổng Bộ KH&CN 2020 về TT 02/2020/TT-BTTTT); mục 02 không dẫn nguồn cho câu này.
  - text: "Bẫy 1: kéo ngồi lên làm cơn (đột quỵ) nặng thêm"
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: ""
    verdict: not-found
    note: Không có câu nào trong QĐ 3312 (tìm "kéo", "bế", "tư thế") hoặc bài HCDC nói kéo ngồi dậy làm đột quỵ nặng thêm. Cơ chế này không có nguồn, nên gắn nhãn suy luận hoặc bỏ. (Điều "đo huyết áp trước khi kéo dậy" cũng không có nguồn.)
  - text: "Bẫy 2: QĐ 3312 xếp đúng mấy dấu hiệu (yếu tay, méo miệng, nói khó) vào nhóm phải xét tái tưới máu"
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Thời điểm khởi phát triệu chứng hoặc thời điểm cuối cùng thấy người bệnh còn bình thường: là rất quan trọng để xét điều trị tái tưới máu."
    verdict: partial
    note: Tài liệu xếp các dấu hiệu đó vào "biểu hiện khởi phát hay gặp của nhồi máu não"; giờ khởi phát mới là yếu tố xét tái tưới máu. Cách diễn đạt của mục gộp hai ý.
  - text: 'Chi phí: chụp X-quang/cắt lớp "vài trăm nghìn tới vài triệu đồng", BHYT trả một phần; xe cấp cứu'
    source_url: https://hcdc.vn/phong-ngua-te-nga-cho-nguoi-cao-tuoi-nhan-dien-nguy-co-chu-dong-phong-ngua-aV9cMP.html
    quote: ""

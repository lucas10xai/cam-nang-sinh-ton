  basis: 'Bản PDF bvtn.org.vn: trang 1 (quyết định) là ảnh quét, phần văn bản trích được ghi "Quyết định số /QĐ-BYT ngày tháng năm 2024" (trống); số/ngày chỉ xác nhận qua luatvietnam.vn (thứ cấp): "Số hiệu 3312/QĐ-BYT", "Ngày ban hành 05/11/2024", Điều 3 "có hiệu lực kể từ ngày ký, ban hành và thay thế Quyết định số 5331/QĐ-BYT ngày 23 tháng 12 năm 2020". Ô "Tình trạng hiệu lực" bị che (cần đăng nhập). Chưa có bằng chứng sơ cấp về việc còn hiệu lực/chưa bị thay thế.'
deliberate_vn_deviation: []
potential_harm:
  - 'steps/tldr: kiểm tra "nhìn ngực xem có thở" nhưng chỉ gọi 115 khi "không đứng dậy được hoặc yếu tay, méo miệng, nói khó". Người đọc làm đúng nguyên văn có thể không gọi 115/không bắt đầu CPR khi người ngã bất tỉnh, thở ngáp hoặc không thở, hay khi đập đầu/đau dữ dội/nghi gãy xương (AHA/Red Cross 2024 coi các dấu hiệu này đều cần gọi cấp cứu). Cần nhánh rõ: không đáp ứng + không thở bình thường → gọi 115 và ép tim (mục 01).'
  - '"Không bế hay kéo ngồi dậy" nêu vô điều kiện: AHA/Red Cross chỉ khuyến cáo để nguyên tư thế khi nghi chấn thương cổ/lưng/hông/chậu; nguồn không cấm đỡ người tỉnh, thở bình thường, không nghi chấn thương ngồi dậy từ từ. Nên viết thành điều kiện (chưa có nguồn nào trong lượt này nói rõ chuẩn đỡ dậy cho người cao tuổi, nên đây chỉ là ghi nhận lệch phạm vi).'
suggested_edits:
  - 'tldr và steps: thêm "Không đáp ứng hoặc không thở bình thường: gọi 115 ngay và ép tim (xem mục 01)" làm bước đầu tiên sau bước kiểm tra thở; thêm đập đầu, đau dữ dội, nghi gãy xương, lú lẫn mới vào lý do gọi 115. Căn cứ: AHA/Red Cross 2024 "Any abnormalities in responsiveness or breathing and any major injuries should be viewed as an emergency".'
  - 'Bước 3 "Không bế hay kéo ngồi dậy": sửa thành "Nếu nghi đau cổ/lưng/hông hoặc đập đầu, hoặc có dấu hiệu đột quỵ, để nguyên tư thế" và dẫn nguồn AHA/Red Cross 2024 (Rec 5.1 #5); không gán câu này cho HCDC/QĐ 3312.'
  - 'Bẫy 1: bỏ câu "Kéo ngồi lên làm cơn nặng thêm trước khi có ai đo huyết áp" hoặc gắn nhãn suy luận; Bẫy 2: sửa thành "QĐ 3312 liệt kê các dấu hiệu này là biểu hiện khởi phát của nhồi máu não và nhấn mạnh giờ khởi phát để xét tái tưới máu".'
  - 'Mục Lợi ích, câu "bác sĩ phải dựa vào hình ảnh học chứ không dựa vào giờ": sửa thành "bác sĩ dùng thêm hình ảnh học (MRI/CT tưới máu) để chọn người bệnh phù hợp" (QĐ 3312 mục 4.4-4.5).'
  - 'Mục Chi phí: dẫn nguồn giá/BHYT hoặc bỏ "vài trăm nghìn tới vài triệu đồng"; thêm nguồn cho "gọi 115 không mất tiền" (bản tin MST/TT 02/2020/TT-BTTTT).'

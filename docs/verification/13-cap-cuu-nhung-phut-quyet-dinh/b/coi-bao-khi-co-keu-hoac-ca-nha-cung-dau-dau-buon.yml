potential_harm:
  - "Steps bước 3 'không đi đóng van bình gas' không phân biệt cảnh báo CO (cháy không hoàn toàn) với rò rỉ gas/mùi gas. Nếu thật sự rò rỉ LPG, để nguyên van mở trong khi chờ có thể gây cháy nổ; người đọc có thể hiểu là cấm đóng van ngay cả khi đóng được trong vài giây. NHS chỉ khuyên ngừng dùng thiết bị nếu làm được an toàn. Cần sửa thành 'ra ngoài trước; chỉ tắt thiết bị nếu ở ngay cạnh và mất vài giây, không tìm nguyên nhân'."

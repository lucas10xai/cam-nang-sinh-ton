claims:
  - text: "Không rút vật đâm ra"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Nếu các vết thương chảy máu có dị vật như mảnh gỗ, kim loại hoặc bất kỳ vật gì đâm vào và vẫn cắm ở vết thương thì KHÔNG được rút dị vật ra."
    verdict: match
    note: "Bệnh viện Nhi Trung ương (2016, sửa 2021), tham khảo St John New Zealand. Không thuộc AHA/ERC/WHO/CDC/NHS/Bộ Y tế; xem claim tiếp theo."
  - text: "Không rút vật vì vật đang bịt chỗ rách; ép quanh vật"
    source_url: https://www.redcross.org.uk/first-aid/learn-first-aid/bleeding-heavily
    quote: "Do not remove it – it's helping plug the hole and stop the blood flow. Instead, apply pressure around the object. Removing the object from the wound can make the bleeding much worse."
    verdict: match
    note: "British Red Cross (tổ chức sơ cứu quốc tế, không nằm trong danh sách nguồn bắt buộc của quy trình). Tóm tắt Việt: không rút vật cắm vì nó đang chèn lỗ thủng; ép quanh vật; rút ra có thể làm chảy máu nặng hơn. Chưa mở được AHA/ERC/NHS cho đoạn này."
  - text: "Ép mép vết thương sát với dị vật để bịt kín"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Bịt kín vết thương bằng cách ép mép vết thương sát với dị vật."
    verdict: match
    note: ""
  - text: "Quấn vải/khăn thành vòng đệm quanh vật rồi băng ép, không gây áp lực trực tiếp lên vật"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Dùng miếng vải vuông hoặc một khăn tam giác quấn lại thành vòng đệm xung quanh dị vật, sau đó dùng băng ép lại như với vết thương không có dị vật, chú ý không gây áp lực trực tiếp lên dị vật."
    verdict: match
    note: ""
  - text: "Không băng quá chặt như ga rô"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Dùng băng cuộn hoặc dây vải băng ép miếng gạc hoặc miếng vải vào vết thương. Không băng quá chặt như hình thức ga rô."
    verdict: partial
    note: "Câu nằm trong mục “Nâng cao vùng bị tổn thương”, không phải mục vết thương đâm xuyên (mục 3). Nguồn dùng cho vết thương thông thường; mục lại ghép vào step 3 vật cắm. Tourniquet vẫn được các hướng dẫn quốc tế dùng khi chảy máu đe dọa tính mạng ở tay chân mà ép trực tiếp không cầm được (xem potential_harm)."
  - text: "Gọi 115 càng sớm càng tốt (step 4)"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Nếu vết thương nặng hay tình trạng nạn nhân xấu thì gọi cấu cứu 115 càng sớm càng tốt."
    verdict: partial
    note: "Nguồn gắn lời gọi 115 với điều kiện “vết thương nặng hay tình trạng nạn nhân xấu”; mục đặt 115 ở bước cuối. British Red Cross xếp “Call 999” ở bước 2, ngay sau khi ép chảy máu, và không để cuối."
  - text: "Giữ người bị thương yên tại chỗ"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Kể cả khi bị thương ở tay hay nửa trên của người, bệnh nhân cũng cần được nghỉ ngơi trong tư thế thuận tiện ít nhất 10 phút để giúp cầm máu."
    verdict: partial
    note: "Nguồn nói “nghỉ ngơi tuyệt đối ... ít nhất 10 phút”, không nói “giữ yên tại chỗ chờ 115” cho vật cắm."
  - text: "Không tự chở bằng xe máy"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: "Nếu vết thương nhỏ và nạn nhân có thể di chuyển bằng ô tô xe máy thông thường thì chuyển ngay nạn nhân tới cơ sở y tế gần đó."
    verdict: inference
    note: "Không có câu nào trong nguồn cấm chở bằng xe máy cho vết thương có vật cắm; mục tự suy ra (Bẫy 3 nói “mọi rung lắc làm nó ngoáy trong thịt”, không nguồn). Hợp lý về y khoa nhưng phải dán nhãn “suy ra”. Nguồn còn chỉ ra chuyển ngay bằng xe thường chỉ cho vết thương nhỏ."
  - text: "Vật ở bụng hay ngực thì để nguyên, không ấn lên vật"
    source_url: https://benhviennhitrunguong.gov.vn/so-cuu-nan-nhan-co-vet-thuong-chay-mau.html
    quote: ""
    verdict: inference
    note: "Nguồn không đề cập vị trí bụng/ngực. Nguyên tắc chung (không rút, không ấn lên vật) áp dụng, nhưng riêng thủ thuật “bịt kín” vết thương ở ngực chưa có nguồn."

    severity: warn
  - issue: "Bẫy 1 và Bẫy 3 (“rút ra để xem sâu bao nhiêu”, “xe máy làm vật ngoáy”) không có nguồn; Chi phí không có con số nào."
    severity: warn
  - issue: "Không có legal_refs (đúng, mục y tế). Nguồn duy nhất là trang bệnh viện nhi (tham khảo St John NZ), không phải AHA/ERC/Bộ Y tế. Hướng dẫn cho trẻ em/ người lớn chưa phân biệt."
    severity: warn
  - issue: "Mục không nêu ngoại lệ: vật cắm làm tắc đường thở (má, miệng, họng) hoặc cản trở ép tim khi ngừng tuần hoàn. Tôi chưa mở nguồn AHA/ERC/Red Cross Mỹ để trích nguyên văn ngoại lệ này; ghi cần kiểm."

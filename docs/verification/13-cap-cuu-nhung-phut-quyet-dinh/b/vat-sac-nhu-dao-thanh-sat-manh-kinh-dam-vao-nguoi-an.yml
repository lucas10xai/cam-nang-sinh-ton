validity:
  doc: "Hướng dẫn sơ cứu chảy máu, Bệnh viện Nhi Trung ương (đăng 24/09/2016, sửa 14/07/2021), tham khảo St John (New Zealand)"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. Trang đăng 2016, chỉnh 2021 (meta modified_time 2021-07-14), cũ hơn 5 năm. British Red Cross (trang còn hoạt động, chưa thấy ngày sửa) có cùng nguyên tắc không rút vật. Chưa kiểm AHA/ERC mới nhất."
deliberate_vn_deviation:
  - "Nguồn VN (BV Nhi TW) dặn “Không băng quá chặt như hình thức ga rô” như quy tắc chung; hướng dẫn quốc tế gần đây (Red Cross, PAcT kit của British Red Cross) dùng tourniquet cho chảy máu đe dọa tính mạng ở tay chân khi ép trực tiếp không cầm được. Quy tắc VN này đến từ tài liệu cũ (2016)."
potential_harm:
  - "Step 3 “không băng chặt như ga rô” viết vô điều kiện. Nếu vật cắm ở tay/chân và máu phun/chảy ồ ạt không cầm được bằng ép quanh vật, người đọc có thể không dùng garô theo hướng dẫn quốc tế và để mất máu nguy kịch. Cần điều kiện: nếu cầm không được, gọi 115 và làm theo tổng đài viên; garô chỉ khi được hướng dẫn hoặc đã học."
  - "Step 4 đặt “Gọi 115” ở cuối. Vật cắm sâu là vết thương nặng; làm đúng thứ tự có thể trì hoãn gọi cấp cứu. Nên gọi 115 ngay (bật loa) khi bắt đầu ép."
  - "Step 1 “không tự chở bằng xe máy” không nguồn, nếu 115 không tới được (vùng xa) người đọc không biết lựa chọn thay thế; nguồn nói vết thương nhỏ thì chuyển ngay bằng xe thường."
  - "Thiếu ngoại lệ: vật cắm làm tắc đường thở hoặc cản trở ép tim khi ngừng tuần hoàn (chưa kiểm nguồn nên không khẳng định nguyên văn)."
suggested_edits:
  - "Steps: đổi thứ tự, đưa “Gọi 115 ngay (bật loa) rồi mới ép quanh vật”, dựa trên British Red Cross: “Step 2. Call 999.” và nguồn BV Nhi: “gọi cấp cứu 115 càng sớm càng tốt”."
  - "Step 3: sửa thành “băng ép đủ chặt để cầm máu nhưng không chặn hết máu cả chi như dây buộc; nếu máu vẫn chảy ồ ạt từ tay/chân, nói với tổng đài 115 và làm theo hướng dẫn của họ (có thể phải dùng garô)”."
  - "Step 1: bỏ “không tự chở bằng xe máy” hoặc dán nhãn “suy ra” và nêu điều kiện (chỉ khi 115 không đến được thì chở bằng phương tiện êm nhất, giữ vật cố định)."
  - "Nguồn: thêm một hướng dẫn trong danh sách bắt buộc (AHA/ERC/NHS/WHO) cho đoạn vật cắm và ngoại lệ đường thở/ép tim; hiện chỉ có BV Nhi TW và British Red Cross."

claims:
  - text: Pin cúc áo gây tổn thương nặng chỉ trong vài giờ đầu; cơ chế dòng điện, hydroxyl, tăng pH; thủng thực quản/khí quản/động mạch chủ; có thể tử vong trong vòng 2 giờ
    source_url: https://vov.gov.vn/noi-soi-cap-cuu-thanh-cong-be-trai-4-tuoi-nuot-phai-pin-cuc-ao-dtnew-1070104
    quote: “Pin cúc áo có cực âm và cực dương sát nhau, khi nuốt vào trong đường tiêu hoá, gặp nước, dịch nhày sẽ sinh ra dòng điện, giải phóng nhanh và nhiều hydroxyl radical (OH•), tăng nhanh pH, gây ăn mòn mạnh, rất dễ thủng thực quản, thủng lan sang khí quản, động mạch chủ, thủng dạ dày,... trường hợp nặng có thể gây tử vong trong vòng 2 giờ.
    verdict: match
    note: VOV 10/03/2025, lời TS.BS Ninh Quốc Đạt. Đúng với "chỉ trong vài giờ đầu" ở đoạn trên cùng bài.
  - text: "Ca bé trai 4 tuổi: thực quản quanh pin loét hết, phía trên và dưới phù nề chít hẹp"
    source_url: https://vov.gov.vn/noi-soi-cap-cuu-thanh-cong-be-trai-4-tuoi-nuot-phai-pin-cuc-ao-dtnew-1070104
    quote: Khi tiến hành nội soi, ekip thấy thực quản chu vi xung quanh pin đã loét hết, phía trên và phía dưới dị vật đều phù nề chít hẹp hết đường ra cũng như đường xuống dạ dày.
    verdict: match
    note: Bài nói đã nội soi sau khoảng 3,5 giờ từ lúc nuốt (14h → 17h30 chuyển viện), gắp mất 3 giờ, không mổ mở.
  - text: BV Nhi TW mổ bé gái bị rò khí - thực quản sau nuốt pin
    source_url: https://benhviennhitrunguong.gov.vn/phau-thuat-thanh-cong-cuu-song-benh-nhi-ro-khi-thuc-quan-do-nuot-phai-pin.html
    quote: Các bác sĩ Khoa Ngoại tổng hợp, Bệnh viện Nhi Trung ương đã tiếp nhận và phẫu thuật nội soi thành công, cứu sống bé gái N.M.A (22 tháng tuổi, ở Thái Bình) bị tổn thương thực quản phức tạp do nuốt phải dị vật là pin dạng cúc áo.
    verdict: partial
    note: Bài nói bệnh nhi đến muộn (khoảng một tuần ho, khò khè rồi mới chụp X-quang), phẫu thuật nội soi (không phải "mổ cấp cứu" mở) - mục tả "mổ cấp cứu" hơi khác. Không phải khẳng định số liệu then chốt.
  - text: Không cho ăn, không cho uống nước để "trôi xuống"
    source_url: https://www.cuh.nhs.uk/patient-information/button-battery-ingestion-in-children-advice-for-parents-and-carers/
    quote: Prior to arrival at hospital, where there is known or suspected button battery ingestion within the last 12 hours, it is advised that the children over the age of 12 months are given 2 teaspoons (10ml) of honey every 10 minutes.
    verdict: mismatch
    note: "NHS (Cambridge University Hospitals, bệnh viện NHS) khuyên: trẻ trên 12 tháng nghi nuốt pin trong 12 giờ qua cho 10 ml mật ong mỗi 10 phút trên đường tới viện. Mục tuyệt đối \"không cho ăn\" - lệch hướng dẫn quốc tế (ESPGHAN/NASPGHAN, Children's Health Queensland cũng khuyến cáo mật ong/sucralfate trong 12 giờ, chưa mở được toàn văn). Mục không nêu hoặc giải thích sự lệch này. Mật ong không dùng cho dưới 12 tháng."
  - text: "Nuốt từ hai viên nam châm: các viên hút nhau qua thành ruột, hoại tử, thủng; chỉ gắp được ở cơ sở có nội soi + phẫu thuật"
    source_url: https://www.cuh.nhs.uk/patient-information/button-battery-ingestion-in-children-advice-for-parents-and-carers/
    quote: Button batteries can get stuck within the food pipe (oesophagus) or the windpipe (trachea or bronchus) and have the potential to cause a hole through the wall of the food pipe or wind pipe, which is a serious complication.
    verdict: not-found
    note: Mục không có nguồn nào cho nam châm (mục Nguồn chỉ có VOV và BV Nhi TW đều nói về pin). Tiêu đề, tldr, steps và toàn bộ phần nam châm là khẳng định không có nguồn trong mục. Không mở được ESPGHAN 2026 (Wiley 403) trong thời gian. Quote ở đây chỉ là câu pin, không phải nam châm.
  - text: Không dừng ở trạm y tế xã/phòng khám không có nội soi; đi thẳng bệnh viện có nội soi
    source_url: https://vov.gov.vn/noi-soi-cap-cuu-thanh-cong-be-trai-4-tuoi-nuot-phai-pin-cuc-ao-dtnew-1070104
    quote: Sau 3 giờ nỗ lực, bác sĩ Quách Văn Nam (Khoa Tiêu hoá) cùng ekip đã thành công lấy được dị vật mà không cần can thiệp phẫu thuật mở, giúp bé tránh khỏi nguy cơ thủng thực quản và hồi phục tốt hơn sau can thiệp.
    verdict: inference
    note: "Nguồn dẫn không có câu khuyên bỏ qua cơ sở y tế gần nhất; ca VOV thực tế đến bệnh viện gần nhà chụp X-quang rồi chuyển. Đây là suy ra; X-quang xác định vị trí pin (thực quản vs dạ dày) quyết định việc cấp cứu nội soi (NHS: pin đã vào dạ dày có thể theo dõi tại nhà)."
  - text: Không móc họng, không gây nôn
    source_url: https://benhviennhitrunguong.gov.vn/lien-tiep-tre-nhap-vien-do-hoc-di-vat-duong-tho-nguoi-lon-can-hoc-ngay-cach-so-cuu-dung.html
    quote: Tuyệt đối không dùng tay móc dị vật, không gây nôn hoặc cho ăn uống
    verdict: partial
    note: Câu này trong bài hóc dị vật đường thở BV Nhi TW (không nằm trong mục Nguồn của mục 45). Không có nguồn nào cho pin/nam châm cụ thể; "đẩy dị vật vào sâu và làm bỏng lan rộng" là suy luận.
  - text: "Khó thở, tím tái: xử trí hóc dị vật theo mục 43 rồi chuyển viện"
    source_url: https://benhviennhitrunguong.gov.vn/lien-tiep-tre-nhap-vien-do-hoc-di-vat-duong-tho-nguoi-lon-can-hoc-ngay-cach-so-cuu-dung.html
    quote: "Nếu trẻ tím tái, không khóc hoặc khóc yếu, ho không hiệu quả. Nhanh chóng gọi cấp cứu và thực hiện các thủ thuật sơ cứu sau:"
    verdict: inference
    note: Không nguồn nào nói trẻ nuốt pin mà khó thở thì vỗ lưng/ấn ngực. Pin ở thực quản chèn khí quản gây khó thở không giải được bằng thủ thuật hóc đường thở; chỉ đúng khi pin/dị vật đang ở đường thở. Đây là suy ra; cần gọi 115 ngay.

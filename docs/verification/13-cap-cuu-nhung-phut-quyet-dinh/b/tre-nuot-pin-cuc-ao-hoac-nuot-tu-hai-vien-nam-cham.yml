deliberate_vn_deviation:
  - Mật ong cho trẻ ≥12 tháng (≤12 giờ sau nuốt pin) hoặc sucralfate theo NHS/ESPGHAN/NASPGHAN; mục ghi tuyệt đối "không cho ăn", nguồn VN không đề cập. Mục không nêu đây là sự lệch có chủ ý.
potential_harm:
  - '"Không cho ăn... không cho uống" vô điều kiện: bỏ qua biện pháp giảm tổn thương trước viện theo NHS (mật ong 10 ml mỗi 10 phút cho trẻ >12 tháng nghi nuốt pin ≤12 giờ, không chậm đi viện). Làm theo nguyên văn không gây hại trực tiếp nhưng bỏ biện pháp được khuyến cáo.'
  - 'Phần nam châm không có nguồn: số "hai viên trở lên", "không đợi tự thải" và "gắp chỉ ở cơ sở có nội soi cùng phẫu thuật" chưa kiểm. Hướng dẫn quốc tế còn nêu 1 nam châm kèm vật kim loại cũng nguy hiểm. Người đọc nuốt 1 nam châm có thể bị trấn an sai.'
  - 'Step 4 "khó thở, tím tái: xử trí hóc dị vật theo mục 43" có thể làm người đọc vỗ lưng/ấn ngực trên trẻ có pin ở thực quản chèn ép khí quản, mất thời gian cấp cứu; nên là gọi 115/đi ngay, chỉ làm thủ thuật nếu dị vật gây tắc đường thở.'
  - Step 1 "không dừng ở trạm y tế xã" có thể làm người đọc bỏ qua chụp X-quang ở nơi gần nhất (cần để xác định vị trí pin), chậm trong 2 giờ; không nói gọi 115/xe cấp cứu.
suggested_edits:
  - Thêm nguồn gốc cho nam châm (ESPGHAN/NASPGHAN/AAP/NHS) hoặc bỏ nam châm khỏi tiêu đề/steps; chưa có nguồn thì không công bố phần này.
  - 'Step 2: thay "không cho ăn" bằng: "Không gây nôn. Nếu trẻ từ 12 tháng trở lên, mới nuốt trong 12 giờ, không khó thở, có thể cho 10 ml (2 thìa cà phê) mật ong mỗi 10 phút (tối đa 6 lần) trên đường đi viện, không được vì thế mà chậm trễ" hoặc nêu rõ là VN không hướng dẫn và để bác sĩ quyết (dựa vào quote CUH "it is advised that the children over the age of 12 months are given 2 teaspoons (10ml) of honey every 10 minutes").'
  - 'Step 4: đổi thành "Trẻ khó thở, thở rít, tím tái: gọi 115 ngay; chỉ làm thủ thuật hóc dị vật (mục 43) nếu trẻ không khóc/không ho được".'
  - 'Step 1: thêm "gọi 115 nếu xa" và "chụp X-quang xác định vị trí pin"; sửa "không dừng ở trạm y tế" thành "chuyển ngay tới nơi có chụp X-quang và nội soi, không chờ quan sát".'
  - 'Thân: gắn nhãn "suy luận" cho "đẩy dị vật vào sâu và làm bỏng lan rộng" và các câu về nam châm; sửa mâu thuẫn "không mất tiền".'

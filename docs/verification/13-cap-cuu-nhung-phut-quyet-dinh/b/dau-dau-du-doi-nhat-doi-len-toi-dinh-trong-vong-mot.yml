validity:
  doc: "Quyết định 3312/QĐ-BYT ngày 05/11/2024 (Hướng dẫn chẩn đoán và điều trị đột quỵ não)"
  in_force: unconfirmed
  effective_from: "2024-11-05"
  amended_by: []
  basis: "PDF có khối chữ ký số 'Ký bởi: BỘ Y TẾ, Ngày ký: 05-11-2024 18:22:47'. Không tìm văn bản thay thế/sửa đổi trong lần kiểm này nên chỉ ghi chưa xác nhận hiệu lực; chưa mở Công báo/CSDL. Quyết định 636/QĐ-BYT/2025: 'Điều 2. ... có hiệu lực kể từ ngày ký ban hành', cũng chưa xác nhận bị sửa. ICHD-3 là phiên bản hiện hành của phân loại đau đầu (chưa có ICHD-4 trong phạm vi tra cứu)."
deliberate_vn_deviation:
  - "Mục dùng 'đỉnh trong vòng một giờ' thay cho định nghĩa quốc tế 'đạt đỉnh trong <1 phút' (ICHD-3 4.4) và 'đau đầu sét đánh' của chính Quyết định 3312. Lệch theo hướng rộng hơn (nhạy hơn)."
potential_harm:
  - "Tiêu đề/tldr đặt ngưỡng 'một giờ' không có nguồn: người đau đầu rất dữ dội đạt đỉnh sau vài giờ có thể tự loại mình, người đau đầu nhẹ dần lên trong vài chục phút lại có thể bị dọa không cần thiết. Mức độ thấp-vừa; giải pháp là dùng đúng định nghĩa 'tức thì/dưới 1 phút' và 'dữ dội nhất đời'."
suggested_edits:
  - "Tiêu đề/tldr/Nói dễ hiểu: đổi 'lên tới đỉnh trong vòng một giờ' thành 'đau đầu dữ dội nhất đời, đến đỉnh gần như ngay lập tức (trong vài phút)'; dẫn ICHD-3 4.4 'reaching maximum intensity in <1 minute' hoặc bỏ mốc số khỏi tiêu đề."
  - "legal_refs 2: đổi 'mục 3.2.1 (chẩn đoán hình ảnh)' thành 'chương Phình động mạch não vỡ, mục 3.2 (Cận lâm sàng: Chọc dịch não tủy; Chẩn đoán hình ảnh) và mục 3.3 (Chẩn đoán xác định)'. Đổi 'CT là bước đầu' thành 'CT sọ não không cản quang (hoặc cộng hưởng từ) là cách thấy máu' hoặc gắn nhãn suy ra."
  - "legal_refs 3: đổi 'mục 4.1 (nguyên tắc chung)' thành 'chương Nhồi máu não cấp, mục 4.1' hoặc dùng câu 4.1 của chương Phình động mạch não vỡ 'Điều trị càng sớm càng tốt, ngăn chặn chảy máu tái phát...'."
  - "legal_refs 4 / Pháp luật Việt Nam: đổi 'mục 4.6' thành 'Phần I, mục 4.2'."
  - "steps 1: thêm 'không tự lái xe, nhờ người đi cùng' (suy ra; hoặc để 115 quyết định) và 'nếu lơ mơ, co giật, nôn nhiều thì gọi 115 ngay'."
  - "steps 2: gắn nhãn suy ra hoặc bỏ 'nói rõ cơn đau bắt đầu lúc mấy giờ' nếu không có nguồn."
  - "Thêm tên chương 3312 cho mọi số mục để khớp 'Nguồn'."

claims:
  - text: 'BYT: hỏi người bị hại đã tắm, thay quần áo... vì "có thể ảnh hưởng đến chứng cứ pháp y"; khuyến khích giữ quần áo, đồ lót'
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: hỏi người bị hại đã tắm, tiểu tiện, đại tiện, nôn, sử dụng dung dịch rửa vệ sinh hay thay quần áo kể từ sau sự việc đó hay chưa. Những việc này có thể ảnh hưởng đến chứng cứ pháp y. Khuyến khích bệnh nhân cố gắng nhớ và lưu lại những vật phẩm có thể lưu lại dấu tích của thủ phạm (tóc, tinh dịch, máu…) như quần áo, đồ lót hoặc các đồ vật khác để kịp thời thu thập bằng chứng.
    verdict: match
    note: PDF phụ lục QĐ 3133/QĐ-BYT lấy từ link tải trên trang SYT Đồng Nai (mục III 2.1). Nguồn là câu hỏi dành cho cán bộ y tế, không phải lệnh "đừng tắm" cho nạn nhân.
  - text: '"Đừng tắm, đừng giặt quần áo, đừng dọn phòng; cho quần áo, đồ lót vào túi giấy" (hướng dẫn cho nạn nhân)'
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: Các vật phẩm cần được lưu giữ theo các quy định chuyên ngành. Việc tự lưu giữ trong điều kiện không đảm bảo có thể làm mất giá trị pháp y của các vật phẩm.
    verdict: inference
    note: BYT không có câu "đừng tắm/dọn phòng/túi giấy"; mục suy từ phần hỏi của cán bộ y tế. Chính BYT cảnh báo người dân tự lưu giữ có thể làm mất giá trị pháp y. "Túi giấy" và "dọn phòng" không có trong nguồn.
  - text: Khám sinh dục trong 72 giờ chỉ xác định tổn thương thực thể ở gần 50%
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: ngay cả khi việc thăm khám cơ quan sinh dục được thực hiện trong vòng 72 giờ sau khi vụ hiếp dâm xảy ra, việc thăm khám chỉ xác định được tổn thương thực thể trong khoảng gần 50% trường hợp.
    verdict: match
    note: ""
  - text: '"Tới bệnh viện trong 72 giờ để khám, lấy chứng cứ, dự phòng" (72 giờ như hạn chót đi khám)'
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: Nếu vụ việc đã xảy ra hơn một tuần trước đó và nếu người bị hại không có vết thâm tím, vết rách, vết loét, chảy dịch, chảy máu hoặc không kêu đau, có nghĩa là có rất ít chỉ báo cho việc cần khám tiểu khung.
    verdict: partial
    note: '72 giờ trong QĐ 3133 chỉ là ngữ cảnh tỉ lệ phát hiện tổn thương, không phải thời hạn đi khám. BYT dùng mốc "hơn một tuần". WHO: tránh thai khẩn cấp trong 5 ngày; PEP HIV không muộn quá 72 giờ. Trình bày "trong 72 giờ" làm người đến sau 72 giờ nghĩ là hết cơ hội/không cần đi.'
  - text: "Xử trí: thuốc tránh thai khẩn cấp khi nguy cơ mang thai, dự phòng STI, chuyển gửi dự phòng HIV"
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: Khi nghi ngờ nguy cơ mang thai, cho người bị XHTD dùng thuốc tránh thai khẩn cấp phòng mang thai ngoài ý muốn; - Điều trị dự phòng các viêm nhiễm LTQĐTD như lậu, giang mai, chlamydia, trùng roi nếu có chỉ định.
    verdict: match
    note: 'Câu dự phòng HIV: "Điều trị dự phòng lây nhiễm HIV cho những người có nguy cơ: Chuyển gửi người bị XHTD đến cơ sở có chuyên môn phù hợp." Với trẻ em BYT "Không khuyến cáo việc sử dụng thuốc dự phòng sau phơi nhiễm HIV ở trẻ em trừ khi biết chắc kẻ xâm hại nhiễm HIV hoặc ở khu vực có tỷ lệ nhiễm cao" - mục không nêu ngoại lệ này khi bước 3 hứa chung "dự phòng... HIV".'
  - text: "Phụ lục 3: đường dây nóng 111 cho trẻ em là nạn nhân bạo lực, xâm hại"
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: "Đường dây nóng toàn quốc: 111 (tư vấn hỗ trợ trẻ em là nạn nhân bị bạo lực, xâm hại tình dục với trẻ em)"
    verdict: match
    note: ""
  - text: Gọi 113 sau khi tới nơi an toàn (tiêu đề, tldr, bước 1)
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: Chăm sóc y tế cho người bị XHTD ưu tiên trước hết vào các vấn đề sức khỏe của người bị hại. 2. Thu thập bằng chứng pháp y là ưu tiên thứ hai trừ trường hợp người bị hại được chuyển đến theo yêu cầu của cơ quan giám định.
    verdict: not-found
    note: 'Không nguồn nào trong mục nói gọi 113 hay nêu 113 là số công an. Nguồn BYT xếp chăm sóc y tế ưu tiên một, thu thập chứng cứ ưu tiên hai; mục đặt "gọi 113" và chứng cứ lên đầu, mâu thuẫn thứ tự ưu tiên, và mâu thuẫn "không phải trình báo trước mới được khám". Nguyên tắc 4 BYT: dịch vụ dựa trên nhu cầu và sự đồng thuận của người bị XHTD.'
  - text: Không phải trình báo trước mới được khám
    source_url: https://syt.dongnai.gov.vn/vi/van-ban/detail/Huong-dan-cham-soc-va-ho-tro-y-te-cho-nguoi-bi-xam-hai-tinh-duc-4261/
    quote: Tôn trọng quyền của người bị XHTD, các dịch vụ cung cấp dựa trên nhu cầu và sự đồng thuận của người bị XHTD hoặc người bảo hộ
    verdict: inference
    note: Suy ra từ nguyên tắc II.4 và đoạn "Trong trường hợp người bệnh và người nhà quyết định không báo cáo cơ quan chức năng mà cán bộ y tế phát hiện các vật phẩm...". Hợp lý nhưng không phải câu nguyên văn.
  - text: "PEP HIV: tốt nhất trong 24 giờ, không muộn hơn 72 giờ, 28 ngày (QĐ 5968/QĐ-BYT)"
    source_url: https://www.benhnhietdoi.vn/loai-benh/huong-dan-dieu-tri-du-phong-nhiem-hiv-prep-pep/
    quote: PEP là việc sử dụng thuốc ARV càng sớm càng tốt, tốt nhất trong vòng 24 giờ và không muộn hơn 72 giờ sau khi phơi nhiễm HIV. Thời gian điều trị chuẩn là 28 ngày liên tục.
    verdict: match-secondary
    note: Trang Bệnh viện Bệnh Nhiệt đới TW dẫn lại QĐ 5968/QĐ-BYT; không mở được bản gốc QĐ 5968 trong thời gian này nên chỉ match-secondary. Trang liệt kê "bị hiếp dâm" là tình huống phơi nhiễm.
  - text: Cơ quan tiến hành tố tụng phải giải thích quyền trợ giúp pháp lý cho người bị hại thuộc diện được trợ giúp và thông báo cho Trung tâm TGPL nhà nước (Điều 71 BLTTHS)
    source_url: https://lawplayer.com/vn/article/vn-congbao-470669/e0071
    quote: Trường hợp người bị buộc tội, người bị hại thuộc diện được trợ giúp pháp lý theo quy định của Luật Trợ giúp pháp lý thì cơ quan, người có thẩm quyền tiến hành tố tụng có trách nhiệm giải thích cho họ quyền được trợ giúp pháp lý; nếu họ đề nghị được trợ giúp pháp lý thì cơ quan, người có thẩm quyền tiến hành tố tụng thông báo cho Trung tâm trợ giúp pháp lý nhà nước.
    verdict: match-secondary
    note: 'LawPlayer (Văn bản hợp nhất 172/2026/VBHN-LQ-VPQH ngày 01/10/2026, Điều 71), bản sao thứ cấp. URL trong legal_refs (trang tgpl.angiang.gov.vn) tải được nhưng phần thân bài do JavaScript nạp, không trích được chữ nên không kiểm được trực tiếp. Mục viết "phải... thông báo" bỏ điều kiện "nếu họ đề nghị": đúng ý nhưng thiếu điều kiện.'
  - text: "WHO (đối chiếu quốc tế): tránh thai khẩn cấp trong 5 ngày; PEP HIV không muộn hơn 72 giờ"
    source_url: https://iris.who.int/server/api/core/bitstreams/2faedeba-98a0-4347-be03-111577199fa8/content
    quote: Offer emergency contraception to sexual assault survivors presenting within five days of sexual assault, ideally as soon as possible after the exposure. to maximize effectiveness.
    verdict: match
    note: 'WHO 2013 "Responding to intimate partner violence and sexual violence against women", Recommendation 12; Recommendation 15: "Consider offering HIV PEP for women presenting within 72 hours of sexual assault." Tóm tắt: EC trong 5 ngày; PEP trong 72 giờ. Mục chỉ có mốc 72 giờ.'

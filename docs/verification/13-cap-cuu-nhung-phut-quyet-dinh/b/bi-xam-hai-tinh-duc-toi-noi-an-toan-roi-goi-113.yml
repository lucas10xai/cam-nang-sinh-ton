validity:
  doc: Quyết định 3133/QĐ-BYT ngày 17/7/2020 (Hướng dẫn chăm sóc và hỗ trợ y tế cho người bị xâm hại tình dục); QĐ 5968/QĐ-BYT ngày 31/12/2021; BLTTHS 101/2015/QH13 Điều 71
  in_force: unconfirmed
  effective_from: 2020-07-17
  amended_by: []
  basis: 'Trang SYT Đồng Nai liệt kê QĐ 3133 là "Văn bản Quy phạm pháp luật", ngày ban hành 17/07/2020; không thấy ghi thay thế nhưng không có trang xác nhận hiệu lực từ Bộ Y tế/vbpl. BLTTHS: LawPlayer ghi VBHN 172/2026/VBHN-LQ-VPQH ngày 01/10/2026 (thứ cấp) cho thấy Điều 71 còn trong văn bản hợp nhất mới nhất.'
deliberate_vn_deviation: []
potential_harm:
  - '"Tới bệnh viện trong 72 giờ": người đến sau 72 giờ có thể bỏ qua việc đi khám; WHO: EC trong 5 ngày, và điều trị STI/viêm gan B/uốn ván/hỗ trợ tâm lý không phụ thuộc mốc 72 giờ. BYT: nên khám đến hơn 1 tuần nếu có tổn thương.'
  - 'Thứ tự "gọi 113, đừng tắm, giữ chứng cứ" đặt trước chăm sóc y tế, trong khi BYT xếp "chăm sóc y tế ưu tiên trước hết", chứng cứ ưu tiên hai: có thể làm người bị hại trì hoãn đi viện hoặc cảm thấy bị ép báo công an. Với chấn thương/chảy máu cần cấp cứu ngay thì lời khuyên "không tắm, không giặt" không được kèm "nếu bị thương nặng gọi 115/đi viện ngay".'
  - Bước 3 hứa "dự phòng HIV" cho mọi nạn nhân, nhưng BYT không khuyến cáo PEP HIV cho trẻ em trừ ngoại lệ; có thể gây kỳ vọng sai.
suggested_edits:
  - 'Đảo thứ tự bước 1: "Đến nơi an toàn. Nếu bị thương nặng hoặc cần cấp cứu, gọi 115 hoặc đi cấp cứu ngay. Khám y tế là ưu tiên; có thể báo công an (113) khi sẵn sàng hoặc nhờ bệnh viện hỗ trợ" (dựa vào quote nguyên tắc II.1-2 và II.4). Bỏ "gọi 113" khỏi tiêu đề hoặc nêu rõ là tùy chọn, không có trong BYT.'
  - Thay "tới bệnh viện trong 72 giờ" bằng "càng sớm càng tốt; thuốc dự phòng HIV phải bắt đầu trong 72 giờ (tốt nhất 24 giờ), thuốc tránh thai khẩn cấp trong 5 ngày; sau 72 giờ vẫn nên đi khám" (dựa vào quote PEP QĐ 5968 và WHO Recommendation 12/15).
  - 'Câu "đừng tắm, đừng giặt, túi giấy, đừng dọn phòng": gắn nhãn "suy ra từ hướng dẫn BYT; không bắt buộc, vẫn nên đi khám nếu đã tắm" và thêm lưu ý của BYT rằng tự lưu giữ có thể làm mất giá trị pháp y; hoặc dẫn nguồn quốc tế (WHO/NHS) cho "túi giấy".'
  - 'Bước 3: thêm "trẻ em: BYT không khuyến cáo PEP HIV thường quy; bác sĩ quyết định" và đổi thuật ngữ "Điều 71... phải thông báo" thành "thông báo cho Trung tâm TGPL nếu người bị hại đề nghị".'
  - "legal_refs: thay URL bằng văn bản hợp nhất BLTTHS trên Công báo/vbpl.vn, ghi số 101/2015/QH13 và VBHN."

validity:
  doc: Quyết định 1904/QĐ-BYT ngày 30/5/2014 (Hướng dẫn quy trình kỹ thuật chuyên ngành Hồi sức, cấp cứu và chống độc); Bệnh viện Nhi TW 02/06/2023; ERC 2021
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: PDF kcb.vn đăng 2021-07-23 (đường dẫn), nội dung đúng QĐ 1904; chưa tìm trang vbpl/Công báo xác nhận còn hiệu lực/bị thay thế. ERC 2021 là bản mới nhất ERC thấy được (hiện có ERC 2025 nhưng chưa kiểm). AHA 2020/2025 không mở được (403).
deliberate_vn_deviation:
  - "Tỷ lệ: BYT QĐ 1904 và mục dùng 30:2 (một người) và 15:2 (từ hai người) cho nhũ nhi, giống AHA 2020. ERC 2021 dùng 15:2 cho người được đào tạo PBLS và 30:2 cho người không chuyên qua điều phối viên (khuyến nghị 30:2 để giảm số lần chuyển). Không gây hại nhưng mục không nói đây là sự lệch giữa các hướng dẫn."
  - BV Nhi TW (nguồn của mục) 100-120 lần/phút; BYT QĐ 1904 là "100 lần/phút". Mục không chọn rõ.
potential_harm:
  - 'Thiếu kỹ thuật ép tim cho nhũ nhi (2 ngón tay/2 ngón cái ôm ngực) và nguồn BV Nhi TW tả "một tay": người đọc có thể ép nhũ nhi bằng cả gót bàn tay, gây tổn thương, hoặc ép không hiệu quả.'
  - 'Bẫy 3 gán cho nguồn lời khuyên "đừng ấn nông" trong khi nguồn dặn tránh ấn quá mạnh; không nêu giới hạn trên (ERC: không sâu hơn 6 cm).'
  - Mục tổng quát hóa quy trình đuối nước ("5 nhịp thở đầu") cho mọi trẻ không phản ứng; người đọc không nhận ra nhánh đuối nước có khác (ví dụ không dốc ngược nước) và mục không nói "nếu không dám/không biết thổi ngạt vẫn ép tim liên tục".
suggested_edits:
  - 'Step 4: thêm "Nhũ nhi: ép bằng hai ngón tay đặt dưới đường ngang hai núm vú, hoặc hai ngón cái với hai bàn tay ôm ngực (khi có hai người)" (dựa vào quote QĐ 1904 tr. 268 "Có thể dùng 2 ngón tay để ép tim..." và ERC "two-thumb encircling technique").'
  - 'Đổi "khoảng 100 lần mỗi phút" và "trên 100" thành thống nhất "100 đến 120 lần mỗi phút" (dựa vào "Tốc độ ép tim 100 -120 lần/phút", ERC). Đổi bẫy 3: "Ép đủ sâu (ít nhất 1/3 bề dày ngực) nhưng không quá mạnh" và sửa tldr/step cho cùng "1/3 đến 1/2".'
  - Sửa tên quy trình trong legal_refs và mục Pháp luật thành "Quy trình kỹ thuật ép tim ngoài lồng ngực (QĐ 1904/QĐ-BYT, tr. 267-270)".
  - 'Thêm câu: "Nếu bạn không biết/không dám thổi ngạt: vẫn ép tim liên tục" (dựa vào ERC 2021) hoặc gắn nhãn suy ra; gắn nhãn đây là quy trình cho trẻ không phản ứng, không thở (kể cả đuối nước).'
  - "Thêm related: mục 43 (hóc dị vật chuyển sang CPR khi trẻ mất ý thức)."

claims:
  - text: Thổi ngạt 5 nhịp đầu tiên; trẻ nhỏ trùm miệng lên cả mũi và miệng
    source_url: https://benhviennhitrunguong.gov.vn/5-buoc-cap-cuu-tre-duoi-nuoc-dung-cach-va-nhung-sai-lam-can-tranh.html
    quote: Với trẻ nhỏ, đặt miệng của bạn trên cả mũi và miệng của trẻ để thổi ngạt được kín. Với trẻ lớn hơn, một tay ép cánh mũi và đưa miệng của bạn thổi vào miệng của trẻ. Thổi chậm, đều trong 1- 2 giây và ngực của trẻ sẽ phồng lên, thổi ngạt 5 nhịp thở đầu tiên.
    verdict: match
    note: 'Bài viết về trẻ ĐUỐI NƯỚC (02/06/2023). ERC 2021: "In the unresponsive child, if breathing is absent or abnormal: give five initial rescue breaths." Áp dụng cho trẻ ngừng thở nói chung là đúng ERC nhưng AHA 2020 không có 5 nhịp thở đầu (chưa mở được AHA).'
  - text: Ép tim 1/2 dưới xương ức, lún khoảng 1/3 đến 1/2 đường kính trước sau, 100 lần/phút; chu kỳ 30:2
    source_url: https://benhviennhitrunguong.gov.vn/5-buoc-cap-cuu-tre-duoi-nuoc-dung-cach-va-nhung-sai-lam-can-tranh.html
    quote: "Ngay sau thổi ngạt 5 nhịp đầu tiên, tiến hành ép tim ngoài lồng ngực. Sử dụng một tay đặt vuông góc với lồng ngực, (trẻ lớn/người lớn có thể dùng hai tay).Vị trí ép tim: 1/2 dưới xương ức, ấn xuống ngực sâu khoảng 1/3 -1/2 lồng ngực theo đường kính trước sau. Tốc độ ép tim 100 -120 lần/phút. Những lần tiếp theo tiếp tục thực hiện theo chu kỳ 30 lần ép tim/2 lần thổi ngạt."
    verdict: partial
    note: Nguồn ghi tốc độ 100-120 lần/phút (mục viết "khoảng 100" ở tldr/step và "trên 100" ở ghi chú). Nguồn nói "Sử dụng một tay" - không phải kỹ thuật chuẩn cho nhũ nhi (2 ngón/2 ngón cái ôm ngực); mục không nêu kỹ thuật tay nào cho nhũ nhi.
  - text: "QĐ 1904/QĐ-BYT: tỷ lệ 30:2 khi có một người, 15:2 khi có từ hai người trở lên"
    source_url: https://kcb.vn/upload/2005611/20210723//H%E1%BB%93i-s%E1%BB%A9c-c%E1%BA%A5p-c%E1%BB%A9u-Ch%E1%BB%91ng-%C4%91%E1%BB%99c.pdf
    quote: "Tiến hành ép tim ngoài lồng ngực: thông khí nhân tạo 30:2 nếu Ngƣời bệnhlà ngƣời lớn, trẻ nhỏ và nhũ nhi khi có 1 ngƣời cấp cứu. Tỷ lệ 15:2 nếu Ngƣời bệnhlà trẻ nhỏ hoặc nhũ nhi khi có trên 2 ngƣời cấp cứu."
    verdict: match
    note: 'Văn bản trong PDF có lỗi OCR font. Phần nhũ nhi (tr. 268) ghi "Nếu có từ 2 Người thực hiện cấp cứu trở lên có thể áp dụng tỷ lệ ép tim/thông khí 15/2 đến khi đặt được đường thở hỗ trợ". "trên 2" ở mục 1.2 khác "từ 2 trở lên" ở phần nhũ nhi: nguồn tự không nhất quán. Mục dùng "từ hai người trở lên" (khớp phần nhũ nhi).'
  - text: "Nhũ nhi dưới 1 tuổi: ép nửa dưới xương ức, lún 1/3 đến 1/2 bề dày lồng ngực, tần số 100 lần/phút"
    source_url: https://kcb.vn/upload/2005611/20210723//H%E1%BB%93i-s%E1%BB%A9c-c%E1%BA%A5p-c%E1%BB%A9u-Ch%E1%BB%91ng-%C4%91%E1%BB%99c.pdf
    quote: Ép tại ½ dƣới xƣơng ức, lún từ 1/3 đến ½ bề dầy lồng ngực và tần số 100 lần/phút
    verdict: match
    note: Dòng này nằm ở mục 1.2 chung (ngay trước "2. Trẻ nhũ nhi (dưới 1 tuổi)"). Mục dẫn "Quyết định 1904/QĐ-BYT, quy trình hồi sinh tim phổi cơ bản" nhưng tiêu đề thực trong PDF là "QUY TRÌNH KỸ THUẬT ÉP TIM NGOÀI LỒNG NGỰC" (trang 267-269).
  - text: "Kỹ thuật ép tim nhũ nhi: 2 ngón tay (một người) hoặc 2 ngón cái ôm ngực (nhiều người) - mục không nêu"
    source_url: https://kcb.vn/upload/2005611/20210723//H%E1%BB%93i-s%E1%BB%A9c-c%E1%BA%A5p-c%E1%BB%A9u-Ch%E1%BB%91ng-%C4%91%E1%BB%99c.pdf
    quote: Có thể dùng 2 ngón tay để ép tim (nếu là ngƣời cấp cứu không chuyên hoặc chỉ có 1 Ngƣời thực hiệncấp cứu) với tỷ lệ ép tim/thông khí là 30/2 - Nếu có từ 2 Ngƣời thực hiệncấp cứu trở lên có thể áp dụng tỷ lệ ép tim/thông khí 15/2 đến khi đặt được đường thở hỗ trợ.
    verdict: partial
    note: 'Mục thiếu hẳn kỹ thuật tay. ERC 2021: "Preferably use a two-thumb encircling technique for chest compression in infants... Single rescuers might alternatively use a two-finger technique." Ép bằng bàn tay người lớn lên ngực nhũ nhi là sai kỹ thuật.'
  - text: Gọi 115 và bật loa ngoài, tiếp tục ép tim thổi ngạt trong khi gọi
    source_url: https://cprguidelines-old.erc.edu/assets/guidelines/European-Resuscitation-Council-Guidelines-2021-Pa.pdf
    quote: If there is only one rescuer, with a mobile phone, he or she should call help first (and activate the speaker function) immediately after the initial rescue breaths. Proceed to the next step while waiting for an answer. If no phone is readily available perform 1 min of CPR before leaving the child.
    verdict: inference
    note: 'Không nguồn VN trong mục nói "bật loa ngoài". ERC 2021 (EN, mục PBLS): người cứu một mình gọi (loa ngoài) NGAY SAU 5 nhịp thở đầu; có từ hai người thì người thứ hai gọi ngay: "a second rescuer should call the EMS immediately upon recognition of unconsciousness, preferably using the speaker function". Mục đặt gọi 115 trước thổi ngạt; hợp lý nhưng khác thứ tự ERC (không gây hại).'
  - text: "Ép tim: không ấn nông vì sợ gãy xương sườn"
    source_url: https://benhviennhitrunguong.gov.vn/5-buoc-cap-cuu-tre-duoi-nuoc-dung-cach-va-nhung-sai-lam-can-tranh.html
    quote: Khi ép tim ngoài lồng ngực, không ấn ngực quá mạnh sẽ gây gãy xương sườn, đụng dập phổi.
    verdict: mismatch
    note: Nguồn mục dẫn (BV Nhi TW) liệt kê "ấn ngực quá mạnh" như sai lầm cần tránh; mục viết ngược "Đừng ấn nông vì sợ gãy xương sườn... Hướng dẫn yêu cầu lún từ một phần ba". Độ sâu 1/3 đúng với ERC ("at least one third of the AP dimension... never deeper than the adult 6 cm limit") nhưng mục gán sai cho nguồn và bỏ giới hạn trên.
  - text: 'Thân: "Hướng dẫn của bệnh viện yêu cầu ép nhanh, trên 100 lần mỗi phút"'
    source_url: https://benhviennhitrunguong.gov.vn/5-buoc-cap-cuu-tre-duoi-nuoc-dung-cach-va-nhung-sai-lam-can-tranh.html
    quote: Tốc độ ép tim 100 -120 lần/phút.
    verdict: mismatch
    note: 'Nguồn nói 100-120, không "trên 100". Mâu thuẫn nội bộ: tldr/step "khoảng 100", thân "trên 100", BYT QĐ 1904 "100 lần/phút". ERC: 100-120/phút.'
  - text: Năm bước cấp cứu trẻ (gọi 115, đưa ra khỏi nước, kiểm tra thở, hồi sinh...)
    source_url: https://benhviennhitrunguong.gov.vn/5-buoc-cap-cuu-tre-duoi-nuoc-dung-cach-va-nhung-sai-lam-can-tranh.html
    quote: cần nhanh chóng tìm sự trợ giúp của những người xung quanh khi thấy trẻ bị đuối nước bằng cách gọi to, gọi cấp cứu 115.
    verdict: match
    note: Nguồn là hướng dẫn cho trẻ đuối nước; mục tổng quát hóa cho "trẻ dưới 1 tuổi không phản ứng, không thở bình thường" mà không dán nhãn.
  - text: 'Bẫy: "Chỉ ấn ngực mà không thổi ngạt... trẻ ngừng tim thường vì thiếu oxy trước"'
    source_url: https://cprguidelines-old.erc.edu/assets/guidelines/European-Resuscitation-Council-Guidelines-2021-Pa.pdf
    quote: In cases where PBLS providers are unable or unwilling to start with ventilations, they should proceed with compressions and add into the sequence ventilations as soon as these can be performed.
    verdict: inference
    note: 'Không có trong nguồn VN. ERC cũng nói người không thể/không muốn thổi ngạt vẫn nên ép tim; ERC dispatcher-assisted: "If bystanders cannot provide rescue breaths, they should proceed with chest compressions only." Mục nên nói rõ: nếu không dám thổi ngạt vẫn ép tim.'

  - issue: '(d) legal_refs url kcb.vn/…Chống-độc.pdf đúng là QĐ 1904/QĐ-BYT (PDF 9 MB tải được, trích chữ được); tên quy trình ghi sai ("hồi sinh tim phổi cơ bản" vs tiêu đề thật "Quy trình kỹ thuật ép tim ngoài lồng ngực"). effective_from: null.'

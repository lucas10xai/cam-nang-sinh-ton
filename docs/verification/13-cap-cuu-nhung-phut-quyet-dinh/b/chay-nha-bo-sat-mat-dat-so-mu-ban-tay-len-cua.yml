    severity: warn
  - issue: "steps[4] 'đóng cửa, chặn khe' không có cơ sở trong nguồn nào của mục; steps[4] thiếu ý 'ra ban công/cửa sổ, hô to, ra hiệu' có trong nguồn Báo CP."
    severity: warn
  - issue: "legal_refs: cả 3 ref trỏ đúng văn bản (Luật 55/2024/QH15, bản hợp nhất 58/VBHN-VPQH) và Điều 6.1, 6.2, 20.2.b đúng khẳng định tương ứng. Nhưng trường quote để null và effective_from để null (luật có hiệu lực 01/07/2025)."
    severity: warn
  - issue: "Nói số điện thoại thống nhất: mục 24 'gọi 114' khớp Luật; mục 49 nêu 113 (Tổng đài tích hợp, TT 42/2026/TT-BYT chỉ nói về thông tin y tế). Không mâu thuẫn trực tiếp nhưng chương cần ghi rõ 114 = cháy, 115/113 = y tế."
    severity: warn

claims:
  - text: "Luật PCCC và CNCH Điều 6 khoản 1: người phát hiện cháy phải báo ngay cho lực lượng PCCC và CNCH, Công an hoặc UBND cấp xã gần nhất"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf"
    quote: "Người phát hiện cháy, tình huống cứu nạn, cứu hộ thì báo ngay cho lực lượng phòng cháy, chữa cháy và cứu nạn, cứu hộ, cơ quan Công an hoặc Ủy ban nhân dân cấp xã nơi gần nhất."
    verdict: match
    note: "PDF 58/VBHN-VPQH là bản quét ảnh, không có lớp chữ; tôi OCR trang 5 bằng macOS Vision và sửa dấu tay cho khớp (đọc lại được rõ). Mục dùng 'phải báo ngay'; nhưng steps[3] đặt 'Gọi 114' SAU khi ra được nhà, lệch chữ 'báo ngay'."
  - text: "Điều 6 khoản 2: số điện thoại báo cháy thống nhất cả nước là 114"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf"
    quote: "Số điện thoại báo cháy, báo tình huống cứu nạn, cứu hộ được quy định thống nhất trong cả nước là 114."
    verdict: match
    note: "OCR trang 5 (cùng bản quét). Lưu ý bối cảnh: Quyết định 1166/QĐ-TTg ngày 29/6/2026 tích hợp 113/114/115; TP.HCM nói giai đoạn chuyển tiếp cả ba số vẫn dùng được; luật này vẫn ghi 114."
  - text: "Điều 20 khoản 2 điểm b: nhà ở phải bố trí, duy trì lối thoát nạn, lối ra khẩn cấp hoặc lối đi bảo đảm thoát nạn"
    source_url: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/58-vbhn-vpqh.pdf"
    quote: "Bố trí, duy trì lối thoát nạn, lối ra khẩn cấp hoặc lối đi bảo đảm việc thoát nạn."
    verdict: match
    note: "OCR trang 17. Khoản 2 áp dụng cho 'Nhà ở không thuộc loại hình quy định tại khoản 3 và khoản 4' (nhà ở theo quy chuẩn viện dẫn / thuộc diện cơ sở quản lý theo Điều 23); mục lược ngoại lệ này, không gây hiểu sai nghiêm trọng."
  - text: "Cục Cảnh sát PCCC&CNCH: thấp người (cúi khom hoặc bò), men theo tường khi di chuyển"
    source_url: "https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm"
    quote: "Khi di chuyển cần thấp người (như cúi khom hoặc bò) và men theo tường."
    verdict: match
    note: "Bài 15/09/2023. Nguồn nói 'cúi khom hoặc bò', tiêu đề mục nói 'bò sát mặt đất' mạnh hơn một chút."
  - text: "Kiểm tra nhiệt độ cửa trước khi mở; mở thì tránh sang bên; cửa quá nóng thì tuyệt đối không mở, tìm lối khác"
    source_url: "https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm"
    quote: "Khi mở cửa cần mở cửa cần kiểm tra nhiệt độ của cửa; khi mở cần tránh mặt, tránh người sang một bên đề phòng lửa tạt. Nếu nhiệt độ cửa quá cao, tuyệt đối không được mở cửa và tìm ngay lối thoát khác."
    verdict: match
    note: "Giữ nguyên lỗi lặp chữ của nguồn."
  - text: "Dùng mu bàn tay kiểm tra độ nóng của cửa"
    source_url: "https://congan.hatinh.gov.vn/tdpl/he-thong-van-ban-phap-luat/nhung-ky-nang-vang-de-thoat-hiem-khi-chay-nha_1684048203.caht"
    quote: "Chỉ cho trẻ cách dùng mu bàn tay để kiểm tra độ nóng của cửa trước khi mở và sử dụng một lối thoát nạn khác nếu cửa bị nóng."
    verdict: match
    note: "Câu nằm trong đoạn dạy trẻ em (dẫn Cục Cảnh sát PCCC&CNCH, 14/05/2023); mục áp dụng cho mọi người, hợp lý."
  - text: "Không dùng thang máy và không quay lại khu vực cháy để lấy tài sản"
    source_url: "https://congan.khanhhoa.gov.vn/vi/cong-an-tinh-khanh-hoa-khuyen-cao-an-toan-phong-chay-chua-chay-va-cuu-nan-cuu-ho-dip-le-quoc-khanh"
    quote: "Khi thoát qua khu vực có khói, cần cúi thấp người, dùng khăn hoặc vải che mũi, miệng; không chen lấn, không sử dụng thang máy và không quay lại khu vực cháy để lấy tài sản."
    verdict: match
    note: "Bài 02/09/2026, Phòng Cảnh sát PCCC&CNCH Công an tỉnh Khánh Hòa. Nguồn còn khuyên 'dùng khăn hoặc vải che mũi, miệng' (che khói) mà steps không nêu."
  - text: "Hà Tĩnh dẫn Cục: không bao giờ quay lại bên trong nhà đang cháy sau khi đã ra"
    source_url: "https://congan.hatinh.gov.vn/tdpl/he-thong-van-ban-phap-luat/nhung-ky-nang-vang-de-thoat-hiem-khi-chay-nha_1684048203.caht"
    quote: "Dạy trẻ không bao giờ được quay lại bên trong một ngôi nhà đang cháy một khi chúng đã thoát nạn được ra ngoài."
    verdict: partial
    note: "Câu nằm trong phần dạy trẻ em. Mục 24 viết 'Không bao giờ quay lại ... sau khi đã ra' như dẫn nguyên văn của Cục; thực tế là khuyến cáo cho trẻ. Cùng nội dung được Khánh Hòa nói cho mọi người nên không sai ý."
  - text: "Bước 3: đi thang bộ"
    source_url: "https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm"
    quote: "Khi phát hiện có cháy ở nhà cao tầng cần bình tĩnh suy sét, tìm lối thoát nạn sẵn có theo đèn chỉ dẫn thoát nạn \"EXIT\" hoặc nghe thông báo chỉ dẫn qua loa chỉ dẫn."
    verdict: partial
    note: "Không nguồn nào trong mục nói nguyên văn 'đi thang bộ' (Khánh Hòa chỉ nói không dùng thang máy, nhớ vị trí cầu thang bộ). Thang bộ đầy khói thì sao: mục không nói; nguồn Báo CP bảo tìm 'lối thoát nạn sẵn có theo đèn EXIT'."
  - text: "Bước 5: không xuống được thì đóng cửa, chặn khe, gọi 114 báo vị trí"
    source_url: "https://baochinhphu.vn/huong-dan-thoat-nan-khi-co-chay-o-chung-cu-nha-cao-tang-102230914172510484.htm"
    quote: "Nếu không có lối thoát khác hoặc không thể ra cửa, hay nhanh chóng di chuyển ra ban công, cửa sổ và hô tô, ra hiệu bằng dùng đồ vật sáng màu. Gọi điện thoại báo cho Cảnh sát PCCC&CNCH số 114 hoặc báo cho người thân."
    verdict: partial
    note: "Có: gọi 114. Có thêm: ra ban công/cửa sổ, hô to, ra hiệu bằng vật sáng màu (mục không nêu). KHÔNG có trong bất kỳ nguồn nào của mục: 'đóng cửa', 'chặn khe' (là hướng dẫn quốc tế thông dụng nhưng không được nguồn của mục xác nhận). Nguồn cũng: 'Tuyệt đối không nhảy từ tầng quá cao xuống đất nếu không có sự hướng dẫn của lực lượng CNCH'."
  - text: "Bẫy 2: mất điện giữa cháy thì thang máy thành buồng kín; Bẫy 3: cầu thang lúc đó đầy khói"
    source_url: "https://congan.khanhhoa.gov.vn/vi/cong-an-tinh-khanh-hoa-khuyen-cao-an-toan-phong-chay-chua-chay-va-cuu-nan-cuu-ho-dip-le-quoc-khanh"
    quote: ""
    verdict: inference
    note: "Nguồn chỉ cấm dùng thang máy và quay lại lấy tài sản, không nêu lý do mất điện/khói. Lý do là suy luận của người soạn."
internal_checks:

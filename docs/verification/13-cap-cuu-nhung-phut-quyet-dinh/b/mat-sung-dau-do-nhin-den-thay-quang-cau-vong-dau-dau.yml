    severity: warn
  - issue: "Mục Nguồn trỏ tới file nén .rar (mat.rar) chứa 2 PDF, người đọc không mở trực tiếp được; không có số trang. Nên dẫn trang Bộ Y tế/Cục KCB của Quyết định 40 hoặc nêu rõ 'tr. 78-84'."
    severity: warn
  - issue: "Tiêu đề/tldr 'ngay trong ngày' nhưng thân dùng 'khẩn trương' và Bẫy 3 'không chờ hết cơn': cách nói không nhất quán về mốc thời gian; nguồn quốc tế nói 'ngay lập tức'."
    severity: warn
  - issue: "Không có con số trong tldr/steps ngoài nội dung đã kiểm; legal_refs rỗng nên không có URL để đối chiếu (d, e)."
    severity: warn
validity:
  doc: "Quyết định 40/QĐ-BYT ngày 12/01/2015 (Hướng dẫn chẩn đoán và điều trị các bệnh về mắt)"
  in_force: unconfirmed
  effective_from: "2015-01-12"
  amended_by: []
  basis: "Điều 3 của quyết định: 'Quyết định này có hiệu lực kể từ ngày ký ban hành.' Tìm 'hết hiệu lực/thay thế' chỉ ra các trang sao chép (vnras, luatvietnam, thuvienphapluat), không mở được trang Liên quan hiệu lực; không thấy bằng chứng bị thay thế nhưng cũng chưa có xác nhận từ Công báo/CSDL Bộ Y tế. Tài liệu 2015 (hơn 10 năm), AAO PPP 2025 là bản mới hơn về nội dung nhưng không mâu thuẫn triệu chứng."
deliberate_vn_deviation: []
potential_harm:
  - "Phần 'Phác đồ cụ thể trong tài liệu' đưa liều thuốc chẹn beta, acetazolamid, mannitol, pilocacpin cho người đọc phổ thông mà bỏ cảnh báo của nguồn (chẹn beta: thận trọng bệnh phổi/tim/mạch; acetazolamid: tác dụng phụ toàn thân, chỉ dùng chờ phẫu thuật, bổ sung Kali). Người đọc có thể tự mua và dùng thuốc trong lúc chờ khám, gây hại (đặc biệt hen/COPD với thuốc chẹn beta)."
suggested_edits:
  - "Mục 'Lợi ích', 'Phác đồ cụ thể trong tài liệu': bỏ liều/nhịp thuốc, hoặc ghi rõ 'do bác sĩ nhãn khoa thực hiện, không tự dùng', và nếu giữ chẹn beta thì thêm 'thận trọng nếu có bệnh phổi, tim, mạch' (quote: 'thận trọng nếu bệnh nhân có bệnh phổi, tim, mạch'); acetazolamid thêm 'chỉ dùng trong thời gian chờ phẫu thuật' (quote: 'chỉ dùng trong thời gian chờ phẫu thuật, không dùng kéo dài')."
  - "tldr/steps/Bẫy 2: gắn nhãn 'suy ra' cho 'không chườm nóng, không xông hơi'; đổi 'không nhỏ thuốc giảm đau' thành 'không tự nhỏ thuốc mắt hay uống thuốc giảm đau rồi nằm chờ' để rõ nghĩa. Dựa quote AAO: 'seek immediate ophthalmic care'."
  - "Tiêu đề/tldr: đổi 'ngay trong ngày' thành 'ngay (đi trong vài giờ đầu)' hoặc ít nhất thống nhất với 'khẩn trương'; dẫn AAO PPP 2025 cho ý 'immediate'."
  - "Mục 'Chi phí': bỏ 'vài trăm nghìn đồng' và 'BHYT trả một phần' hoặc dẫn nguồn (bảng giá viện phí/Thông tư giá dịch vụ)."
  - "Mục Nguồn: dẫn trang tải trực tiếp Quyết định 40 và ghi trang 78-84 của tài liệu."

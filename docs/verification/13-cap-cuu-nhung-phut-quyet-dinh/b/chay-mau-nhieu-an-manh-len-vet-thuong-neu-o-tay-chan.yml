  - text: "Chỉ định ga rô: đứt động mạch lớn chảy ồ ạt; đã áp dụng biện pháp cầm máu tạm thời mà không kết quả; chi cụt vẫn chảy; chi dập nát không bảo tồn được (QĐ 636, mục 4.6)"
    source_url: https://cucgiamdinh.gov.vn/Portals/1/Quyt%20dnh%20636%20QD-BYT%20-%20ban%20hanh%20Tai%20liu%20so%20cu%2C%20cp%20cu%20%20ti%20noi%20lam%20vic_1.pdf
    quote: "v ế t thươns, đứt động mạch lớn làm máu chảv ố ạt hoặc vêt thương mạch máu đã áp dụng nhừne biện pháp cầm máu tạm thời trẽn mà không có kẽí quả."
    verdict: match
    note: "PDF quét, lớp chữ OCR lỗi dấu, quote giữ nguyên OCR. Các gạch đầu dòng tiếp theo cũng khớp: 'v ế t thương trên chi đâ bị cất cụt vẫn tiếp tục chảy máu', 'Chi bị RÌập nát quá nhiều biết chẳc khôna thê bảo tồn được'. Nguồn còn một chỉ định mục KHÔNG ghi: 'v ết thương mà người bị thương và người có mặt tại hiện trường không biết cách băng chèn, băt buộc phải đặt ga-rô' (xem deliberate_vn_deviation)."
  - text: "Đặt ga rô sát trên vết thương, để lộ ra ngoài; vết thương lớn cách 5 cm, nhỏ cách 2 cm"
    source_url: https://cucgiamdinh.gov.vn/Portals/1/Quyt%20dnh%20636%20QD-BYT%20-%20ban%20hanh%20Tai%20liu%20so%20cu%2C%20cp%20cu%20%20ti%20noi%20lam%20vic_1.pdf
    quote: "Ga-rô phải đặt sát ngay phía trẽn vết thưcms và để lộ ra neoài (Đối với vết thương lớn đặt ga-rô phía trên vết thương cách 5 cm. vẻt thương nhỏ đặt cách 2 cm)."
    verdict: match
    note: "Khớp tài liệu VN. Lưu ý nguồn tự mâu thuẫn nhẹ ('sát ngay' và 'cách 5 cm'). AHA 2024 chỉ nói tourniquet phải đặt 'proximal to the wound', không nêu 2 cm/5 cm; tôi KHÔNG đối chiếu được con số cm với ERC/Stop the Bleed nên không kết luận lệch."
  - text: "Không ga rô chặt quá hoặc lỏng quá"

    source_url: https://cucgiamdinh.gov.vn/Portals/1/Quyt%20dnh%20636%20QD-BYT%20-%20ban%20hanh%20Tai%20liu%20so%20cu%2C%20cp%20cu%20%20ti%20noi%20lam%20vic_1.pdf
    quote: "Neu băng ẻp trực tiếp lên vết thương mà không cầm được máu thì phải dùng các biện pháp khác đe cầm máu."
    verdict: partial
    note: "QĐ 636 mục 4 liệt kê các 'kỹ thuật cầm máu tạm thời': 4.1 gấp chi tối đa, 4.2 ấn mạch máu (chẹn mạch), 4.3 băng ép, 4.4 băng chèn, 4.5 băng nhồi, 4.6 ga-rô. Đó là danh mục kỹ thuật, không phải thứ tự ưu tiên; mục bỏ 4.1/4.4/4.5. Quan trọng: 4.2 là ấn ĐIỂM mạch (pressure point) ở xa vết thương, khác 'ấn mạnh bằng hai tay lên đúng vết thương' của step 1. AHA 2024: 'No human studies have assessed the effectiveness of manual pressure points in individuals with life-threatening bleeding.'"

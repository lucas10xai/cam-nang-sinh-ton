validity:
  doc: "QĐ 636/QĐ-BYT ngày 21/02/2025 (Tài liệu huấn luyện sơ cứu, cấp cứu tại nơi làm việc); AHA/Red Cross First Aid 2024"
  in_force: unconfirmed
  effective_from: "2025-02-21 (QĐ 636, Điều 2: 'Quyết định này có hiệu lực kể từ ngày ký ban hành', theo lớp OCR)"
  amended_by: []
  basis: "Chỉ mở được PDF trên cổng Cục Giám định; không có trang tình trạng hiệu lực Công báo/vbpl. PDF là bản quét, lớp chữ OCR nhiều lỗi, đã dùng để đối chiếu từng câu nhưng không thể coi là văn bản khớp từng chữ. Nội dung ga-rô trong tài liệu (ga-rô băng cao su/vải, gấp chi tối đa, ấn mạch) mang tính tài liệu cũ, trích dẫn tài liệu 2014. AHA/Red Cross 2024 (Circulation 2024;150) là hướng dẫn mới và tôi không thấy hướng dẫn mới hơn."
deliberate_vn_deviation:
  - "QĐ 636 chỉ định ga-rô bắt buộc khi người ở hiện trường không biết băng chèn, và liệt kê ga-rô sau các biện pháp tạm thời kể cả ấn điểm mạch; mục và AHA 2024 đặt ép trực tiếp trước, ga-rô khi ép không cầm (AHA: 'should apply direct pressure followed by application of a tourniquet or wound packing'). Mục theo AHA nhưng gán cho QĐ 636."
  - "QĐ 636 cho phép ấn điểm mạch (4.2) như một kỹ thuật cầm máu; AHA 2024 nói không có nghiên cứu ở người chứng minh hiệu quả ('No human studies have assessed the effectiveness of manual pressure points'). Mục không dạy ấn điểm: không lệch có hại."
  - "QĐ 636: 'không ga-rô chặt quá hoặc lỏng quá' và nới ga-rô do nhân viên y tế; AHA: siết tới khi máu ngừng chảy."
potential_harm:
  - "steps[1] / tldr: 'không quá chặt hoặc quá lỏng' không nói tiêu chí hết chảy máu. Ga rô siết lỏng chỉ chẹn tĩnh mạch, giữ máu động mạch vào chi và làm chảy nhiều hơn; người đọc có thể dừng khi 'thấy vừa'. AHA 2024: 'tightened until the bleeding stops'. QĐ 636 (kỹ thuật): 'thấy ngừng chảy máu là được'. Mức: cao."
  - "steps[3] đặt 'Gọi 115' sau cùng và chỉ trong nhánh ga rô; người chỉ ấn tay cầm máu không có yêu cầu gọi 115. QĐ 636 mục 4.2 đặt gọi 115 ngay đầu và mở loa ngoài để được hướng dẫn. Làm đúng nguyên văn có thể trì hoãn xe cấp cứu. Mức: cao."
  - "steps[1] 'dây ga rô' không nêu bề rộng và vật dụng; AHA 2024: ga rô tự chế rộng tối thiểu 2 inch, ga rô chuyên dụng 'probably superior'. Chỉ Bẫy 3 nhắc dây mảnh, steps không. Dây mảnh gây đau, tổn thương mô, kém hiệu quả. Mức: trung bình."
suggested_edits:
  - "tldr/steps[1]: sau 'đặt dây ga rô' thêm 'siết cho tới khi máu ngừng chảy' (AHA 2024: 'a tourniquet should be applied and tightened until the bleeding stops'; QĐ 636: 'Quan sát vết thương thấy ngừng chảy máu là được'), thay cho 'không quá chặt hoặc quá lỏng'."
  - "steps: thêm bước 0 'Gọi hoặc nhờ người gọi 115 ngay, mở loa ngoài' trước/cùng lúc với ấn tay (QĐ 636 mục 4.2: 'Gọi câp cứu 115 đê được tư vấn, cấp cứu và vận chuyển nạn nhân')."
  - "steps[1]: nêu 'dùng ga rô chuyên dụng nếu có; nếu dùng vải, bản rộng ít nhất 5 cm (2 inch), không dùng dây mảnh' (AHA 2024: 'at least 2 in width')."
  - "Thêm AHA/Red Cross 2024 (https://www.ahajournals.org/doi/10.1161/CIR.0000000000001281) vào Nguồn làm nguồn cho 'ấn trực tiếp lên vết thương' và 'ga rô sau khi ấn không cầm'; sửa mục Pháp luật/Lợi ích để không gán 'ép trước rồi mới ga rô' cho QĐ 636; sửa câu 'liệt kê theo thứ tự ấn chẹn động mạch, băng ép, rồi ga rô'."
  - "Bẫy 1 và 'bằng cả hai tay': gắn nhãn 'suy ra' hoặc bỏ 'cục máu vừa đông bị bong'; chữ 'dây giày, dây điện' ghi là ví dụ của biên tập viên."
  - "Ghi nhận rõ trong Ghi chú: ga rô khi người ở hiện trường không biết băng chèn là chỉ định của QĐ 636 mà mục không theo."

validity:
  doc: "QĐ 1622/QĐ-BYT ngày 08/5/2014 (Hướng dẫn giám sát, phòng chống bệnh dại trên người)"
  in_force: unconfirmed
  effective_from: "2014-05-08"
  amended_by: []
  basis: "Bài Pasteur TP.HCM đăng 04/11/2024 vẫn dẫn QĐ 1622 làm nguồn bảng chỉ định, tức viện của Bộ Y tế còn dùng năm 2024. Không mở được trang tình trạng hiệu lực chính thức hay bản ký; chưa mở được thuvienphapluat; kết quả tìm kiếm không cho thấy văn bản thay thế nhưng không dùng điều đó làm bằng chứng. WHO (fact sheet) mới hơn cho phân loại rộng hơn."
deliberate_vn_deviation:
  - "Chỉ định huyết thanh/globulin kháng dại: QĐ 1622 (Độ III) giới hạn theo vị trí/độ sâu/số vết cắn/tình trạng con vật; WHO đặt mọi vết cắn/cào xuyên da, nước bọt dính niêm mạc/da trầy hoặc tiếp xúc dơi vào độ III cần vắc-xin kèm immunoglobulin/mAb. Cơ sở VN theo bảng QĐ 1622: vết cắn chảy máu ở chi và con vật bình thường chỉ được vắc-xin."
  - "QĐ 1622 cho phép dừng tiêm sau ngày thứ 10 nếu con vật (chó, mèo) khỏe; WHO cũng chấp nhận quan sát 10 ngày với chó/mèo, nên không lệch có hại."
potential_harm:
  - "Danh sách chỉ định (Pháp luật + Ghi chú) khiến người có vết cắn chảy máu ở tay/chân hay niêm mạc bị liếm nghĩ mình chỉ cần vắc-xin hoặc không thuộc nhóm nào; WHO coi các ca này là độ III cần immunoglobulin, và 'niêm mạc' bị bỏ khỏi chỉ định độ II. Mục có câu 'quyết định cuối cùng là của bác sĩ' giảm nhẹ. Mức: thấp đến trung bình."
suggested_edits:
  - "Mục Pháp luật > Chỉ định tiêm: đổi dòng 1 thành 'Vết xước, vết cào, liếm trên da bị tổn thương hoặc niêm mạc: tiêm vắc-xin dại ngay' (đúng chữ QĐ 1622 qua Pasteur) và thêm dòng 'Vết cắn/cào chảy máu ở vùng xa thần kinh trung ương: tiêm vắc-xin dại ngay'; thêm nhóm 'vùng nhiều dây thần kinh như đầu chi, bộ phận sinh dục' vào dòng huyết thanh."
  - "Thêm câu WHO: 'Category III - single or multiple transdermal bites or scratches, contamination of mucous membrane...' kèm ghi chú WHO cần immunoglobulin rộng hơn QĐ 1622 ('hỏi bác sĩ về globulin kháng dại nếu vết cắn chảy máu')."
  - "Bẫy 3: bỏ 'Hướng dẫn xếp cả ba việc vào nhóm phải tránh' hoặc sửa thành 'hướng dẫn chỉ nêu không làm dập nát và tránh khâu kín; đắp lá và nước mắm không nằm trong nguồn nhưng nên tránh'."
  - "Thêm 'hỏi bác sĩ về tiêm phòng uốn ván và kháng sinh' (Pasteur: 'Tùy trường hợp cụ thể có thể sử dụng kháng sinh và tiêm phòng uốn ván')."
  - "Nói rõ 'nếu con vật bình thường sau 10 ngày, bác sĩ có thể dừng tiêm' để người đọc theo dõi con vật nhưng không bỏ mũi ngày đầu (QĐ 1622 cột 'Trong vòng 10 ngày')."
  - "Xin bản ký QĐ 1622 (Công báo/vbpl) để nâng khẳng định pháp lý từ match-secondary lên match; hiện chỉ có bài Pasteur."

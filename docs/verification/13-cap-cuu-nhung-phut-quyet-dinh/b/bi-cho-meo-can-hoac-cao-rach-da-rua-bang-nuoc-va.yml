claims:
  - text: "Xối rửa kỹ vết cắn/cào 15 phút bằng nước và xà phòng, sau đó sát khuẩn cồn 45-70 độ hoặc cồn i-ốt (QĐ 1622/QĐ-BYT 2014, qua Viện Pasteur TP.HCM)"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Xối rửa kỹ tất cả các vết cắn/cào trong 15 phút với nước và xà phòng, hoặc nước sạch, sau đó sát khuẩn bằng cồn 45°-70° hoặc cồn i ốt để làm giảm thiểu lượng vi-rút dại tại vết cắn."
    verdict: match-secondary
    note: "Chỉ khớp qua bài của Viện Pasteur TP.HCM (đăng 04/11/2024) dẫn QĐ 1622; không mở được bản ký của QĐ 1622 (mục tự ghi). Nguồn nói 'nước và xà phòng, hoặc nước sạch': xà phòng không bắt buộc."
  - text: "Không làm dập nát thêm vết thương, tránh khâu kín ngay"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Không làm dập nát thêm vết thương hoặc làm tổn thương rộng hơn, tránh khâu kín ngay vết thương."
    verdict: match-secondary
    note: "Nguồn tiếp: 'Trường hợp bắt buộc phải khâu thì nên trì hoãn khâu vết thương sau vài giờ đến 3 ngày' và 'Tùy trường hợp cụ thể có thể sử dụng kháng sinh và tiêm phòng uốn ván.' Mục không nhắc uốn ván/kháng sinh."
  - text: "Vết xước, vết cào, hoặc chỗ da bị tổn thương do động vật liếm: tiêm vắc xin dại ngay (độ II)"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Vết xước, vết cào, liếm trên da bị tổn thương, niêm mạc"
    verdict: partial
    note: "Hàng bảng Độ II (QĐ 1622): 'Tiêm vắc-xin dại ngay, dừng tiêm sau ngày thứ 10' nếu con vật bình thường; 'Tiêm vắc-xin dại ngay và đủ liều' nếu ốm/có triệu chứng/mất tích. Mục (a) bỏ 'niêm mạc' (liếm lên niêm mạc mắt, miệng cũng thuộc độ II), (b) bỏ độ III: 'Vết cắn/cào chảy máu ở vùng xa thần kinh trung ương' → vắc-xin; người đọc có vết cắn chảy máu không thấy mình trong danh sách. Bảng do tôi ghép từ văn bản bị tách dòng trong trang."
  - text: "Vết cắn sâu, nhiều vết, ở đầu mặt cổ hoặc gần thần kinh trung ương: tiêm thêm huyết thanh kháng dại"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Tiêm huyết thanh kháng dại và vắc-xin phòng dại"
    verdict: partial
    note: "Hàng độ III: '- Vết cắn/cào sâu, nhiều vết - Vết cắn/cào gần thần kinh trung ương như đầu, mặt, cổ - Vết cắn/cào ở vùng có nhiều dây thần kinh như đầu chi, bộ phận sinh dục'. Mục bỏ nhóm đầu chi/sinh dục, và điều kiện tình trạng con vật (bình thường / có triệu chứng / không theo dõi được). Quan trọng: WHO phân loại rộng hơn, xem deliberate_vn_deviation."
  - text: "Thời gian ủ bệnh thường 1-3 tháng"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Thời gian ủ bệnh ở người thông thường là từ 1 - 3 tháng sau phơi nhiễm, hiếm khi có trường hợp thời gian ủ bệnh ngắn dưới 9 ngày hoặc dài tới một vài năm."
    verdict: match
    note: "Nguồn gốc là bài Pasteur chứ không phải QĐ 1622, mục đã ghi đúng nhãn."
  - text: "Tỷ lệ tử vong gần 100% khi đã lên cơn"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Khi đã lên cơn dại, tỷ lệ tử vong gần như 100% (đối với cả người và động vật)."
    verdict: match
    note: "WHO fact sheet (2026-11-08): 'rabies is fatal in 100% of cases' khi có triệu chứng."
  - text: "Có việc theo dõi con vật trong 10 ngày; tiêm ngay, đừng chờ xem con vật có ốm không"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: "Điều trị dự phòng nên được tiến hành càng sớm càng tốt sau khi bị phơi nhiễm, bao gồm: rửa vết thương, tiêm vắc-xin phòng dại và sử dụng huyết thanh kháng dại nếu có chỉ định."
    verdict: partial
    note: "Cột 'Trong vòng 10 ngày' của bảng cho phép dừng tiêm sau ngày thứ 10 nếu con vật khỏe (độ II, độ III xa thần kinh trung ương). Mục 'Đừng chờ xem con vật ốm' đúng với 'tiêm ngay' nhưng không nói 'dừng sau ngày 10 nếu con vật bình thường': người đọc có thể không theo dõi con vật và chịu đủ liều không cần thiết. 'Trong ngày' (title/steps) là diễn giải của 'càng sớm càng tốt', đồng chiều, không sai."
  - text: "WHO: rửa vết thương với nước và xà phòng ít nhất 15 phút (đối chiếu quốc tế)"
    source_url: https://www.who.int/news-room/fact-sheets/detail/rabies
    quote: "extensive wound washing with water and soap for at least 15 minutes soon after an exposure;"
    verdict: match
    note: "WHO fact sheet Rabies (truy cập 2026-11-08). Tóm tắt: rửa vết thương kỹ ≥15 phút, sau đó tiêm vắc-xin, và globulin miễn dịch/kháng thể đơn dòng nếu có chỉ định."
  - text: "Chỉ định huyết thanh kháng dại: chỉ vết sâu/nhiều vết/đầu mặt cổ (WHO đối chiếu)"
    source_url: https://www.who.int/news-room/fact-sheets/detail/rabies
    quote: "Category III - single or multiple transdermal bites or scratches, contamination of mucous membrane or broken skin with saliva from animal licks, exposures due to direct contact with bats (severe exposure) | Wound washing, immediate vaccination and administration of rabies immunoglobulin/monoclonal antibodies"
    verdict: partial
    note: "WHO: mọi vết cắn/cào xuyên da, hoặc nước bọt dính niêm mạc/da trầy, hoặc tiếp xúc dơi, là độ III cần cả globulin miễn dịch. QĐ 1622 (qua Pasteur) chỉ cho huyết thanh ở vết sâu/nhiều vết/gần thần kinh/đầu chi/sinh dục hoặc khi con vật có triệu chứng/không theo dõi được. Mục theo QĐ 1622, hẹp hơn WHO."
  - text: "Bẫy 3: đắp lá, bôi nước mắm hoặc đòi khâu kín vết thương; 'Hướng dẫn xếp cả ba việc vào nhóm phải tránh'"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: ""
    verdict: mismatch
    note: "Trang Pasteur chỉ nói tránh làm dập nát và tránh khâu kín ngay. Không có 'đắp lá' hay 'nước mắm'. Mục gán cho hướng dẫn điều nó không viết. Lời dặn bản thân vô hại."
  - text: "Bẫy 2: trạm y tế xã gần nhà thường không có vắc xin dại; 'cơ sở tiêm chủng'"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: ""
    verdict: not-found
    note: "Không có trong nguồn; nhận định thực tế, không phải chữ của nguồn. Nên gắn 'gọi trước hoặc hỏi số cơ sở tiêm gần nhất'."
internal_checks:

validity:
  doc: "Thông tư 51/2017/TT-BYT ngày 29/12/2017 (Hướng dẫn phòng, chẩn đoán và xử trí phản vệ)"
  in_force: unconfirmed
  effective_from: "2018-02-15"
  amended_by: []
  basis: "Điều 7 bản toàn văn: 'Thông tư này có hiệu lực từ ngày 15 tháng 02 năm 2018. Thông tư số 08/1999/TT-BYT ... hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.' Trang vbpl.vn chỉ trả khung nên không đọc được ô Tình trạng hiệu lực. Một trang thứ cấp (dulieuphapluat) có mục 'Sửa đổi / Thay thế' nhưng nội dung không hiện; không dùng làm bằng chứng. Không có bằng chứng cụ thể TT 51 còn hoặc hết hiệu lực."
deliberate_vn_deviation:
  - "Thời gian theo dõi: TT 51 'ít nhất 24 giờ' (và 24 giờ sau khi huyết áp ổn định); NHS 'around 2 to 12 hours, but you may need to stay longer'. VN nghiêm hơn, không có hại."
  - "Thứ tự gọi/tiêm: Phụ lục VII thẻ dị ứng và NHS: dùng adrenalin rồi gọi cấp cứu; mục steps: gọi 115 trước."
  - "Người tiêm: TT 51 Điều 6 khoản 3 cho phép người khác không phải nhân viên y tế tiêm khi có tiền sử phản vệ và có sẵn adrenalin; mục thu hẹp thêm thành 'đã được kê và hướng dẫn'; NHS nói dùng bút nếu có, hướng dẫn in trên bút."
potential_harm:
  - "steps/tldr không có 'nằm xuống, có thể kê cao chân; không đứng hay đi lại dù thấy khỏe hơn' (NHS: 'Do not stand or walk at any time, even if you feel better.'). Người đọc làm đúng nguyên văn có thể để nạn nhân đứng/ngồi dậy trong lúc chờ xe, nguy cơ tụt huyết áp tư thế, ngưng tim. Mức: cao (thiếu bước)."
  - "steps không nhắc dùng liều thứ hai sau 5 phút nếu chưa đỡ (NHS: 'If your symptoms have not improved after 5 minutes, use a 2nd adrenaline auto-injector') và Điều 6 khoản 3 / Phụ lục III 'nhắc lại 3-5 phút/lần'. Người đọc có thể chỉ dùng một liều rồi đợi. Mức: cao."
  - "steps[1]-[2] đòi 'đã được kê và hướng dẫn' mới dùng; người có bút trong tay chưa từng được tập huấn (hoặc người nhà) có thể không dùng. TT 51 Điều 6 khoản 3 và NHS ('use an adrenaline auto-injector if you have one – instructions are included on the side of the injector'; 'even if your symptoms are mild') không đòi điều kiện này. Làm chậm adrenalin, thuốc cứu sống. Mức: trung bình-cao."
  - "Mục Pháp luật chép liều ống adrenalin người lớn 0,5-1 ml và nhắc lại 3-5 phút mà không nêu liều trẻ em (<10 kg 0,2 ml; >30 kg 0,5 ml) và phác đồ này dành cho nhân viên y tế có theo dõi huyết áp; trái với thông điệp 'không tự định liều từ ống thuốc'. Cha mẹ lấy liều người lớn cho trẻ có thể quá liều gấp 2-5 lần. Mức: trung bình."
  - "Thứ tự steps (gọi 115 trước, tiêm sau) khác thẻ dị ứng Phụ lục VII ('Tiêm bắp adrenalin ngay lập tức' rồi 'Gọi 115') và NHS: nếu chỉ có một người, mất thời gian cầm máy trước khi tiêm. Mức: thấp-trung bình."
suggested_edits:
  - "steps: thêm bước 'Nằm xuống, có thể kê cao chân; nếu khó thở thì nửa nằm nửa ngồi; không đứng dậy hoặc đi lại dù thấy đỡ' dựa vào NHS ('Lie down – you can raise your legs ... Do not stand or walk at any time, even if you feel better')."
  - "steps: thêm 'Nếu sau 5 phút chưa đỡ và có bút thứ hai: dùng bút thứ hai' (NHS: 'If your symptoms have not improved after 5 minutes, use a 2nd adrenaline auto-injector') và 'luôn mang 2 bút' ở mục phòng ngừa."
  - "steps[1]-[2]: đổi 'đã được kê và hướng dẫn thì dùng' thành 'có bút adrenalin tự tiêm thì dùng ngay, làm theo hướng dẫn in trên bút (kể cả khi triệu chứng nhẹ)'; giữ 'không tự rút thuốc từ ống nếu chưa được huấn luyện' vì Điều 6 khoản 3 cho phép nhưng đòi người có tiền sử phản vệ có sẵn thuốc."
  - "mục Pháp luật > 'Liều và theo dõi': đổi thành thông tin cho nhân viên y tế, thêm liều trẻ em, hoặc bỏ liều và chỉ ghi 'liều tính theo cân nặng, do bác sĩ/nhân viên y tế quyết định'; nếu giữ, ghi rõ 'phác đồ cho nhân viên y tế'."
  - "steps: đổi thứ tự thành 'Dùng bút adrenalin nếu có, rồi gọi 115 (hoặc nhờ người gọi ngay lúc đó)'; dựa vào Phụ lục VII và NHS."
  - "Bỏ hoặc có nguồn cho 'Cuộc gọi 115 không tính phí'; gắn nhãn 'suy ra' cho 'không lấy thuốc uống thay adrenalin' và 'đừng chờ mẩn tự lặn'."
  - "Cập nhật ghi chú NHS: trang NHS ghi 'Next review due 21 June 2026', quá hạn xem lại; đối chiếu lại NHS/ERC khi có bản mới."
  - "Tìm bản toàn văn TT 51 trên Công báo hoặc đường tải trên vbpl.vn để nâng khẳng định pháp lý từ match-secondary lên match, và kiểm tình trạng hiệu lực."

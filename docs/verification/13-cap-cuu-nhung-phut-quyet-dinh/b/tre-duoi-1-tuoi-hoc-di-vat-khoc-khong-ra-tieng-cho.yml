validity:
  doc: Hướng dẫn Bệnh viện Nhi Trung ương (20/12/2024); đối chiếu ERC Guidelines 2021 Paediatric Life Support
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: Trang đăng 20/12/2024, không có hướng dẫn thay thế thấy được. ERC 2021 là bản đối chiếu mở được; chưa đối chiếu AHA 2020 (403) nên không khẳng định đã so với hướng dẫn mới nhất.
deliberate_vn_deviation: []
potential_harm:
  - 'Mục không có hướng dẫn khi trẻ ngừng đáp ứng/mất ý thức. Một người đọc làm đúng nguyên văn (vỗ lưng - ấn ngực "đến khi dị vật rơi ra") có thể tiếp tục vỗ lưng trên trẻ đã bất tỉnh thay vì bắt đầu CPR (ERC: nếu trẻ bất tỉnh chuyển sang PBLS; nguồn BV Nhi TW: mở đường thở, thổi ngạt, ép tim 30:2), làm chậm cứu sống.'
  - 'Step 4 "ấn mạnh 1/2 dưới xương ức" thiếu kỹ thuật hai ngón tay của nguồn: ấn bằng gót bàn tay lên ngực nhũ nhi có thể gây tổn thương.'
suggested_edits:
  - 'Thêm bước: "Nếu trẻ mềm nhũn, không phản ứng, không thở: đặt nằm ngửa trên nền cứng, mở miệng nhìn thấy dị vật thì lấy ra, thổi ngạt rồi ép tim 30:2, vừa gọi 115 bật loa ngoài (xem mục 44)" (dựa vào quote "Nếu trẻ không tỉnh: ...Thổi ngạt 2 lần - Hồi sức tim phổi..." và ERC "If the child with FBAO is, or becomes, unconscious, continue according to the paediatric BLS algorithm"). Thêm related: mục 44.'
  - 'Step 4: thêm "dùng hai ngón tay ấn" (dựa vào quote "dùng hai ngón tay trái ấn mạnh").'
  - 'Bẫy 3 và "Heimlich": sửa thành "Nguồn dành Heimlich cho trẻ lớn đứng/ngồi; với dưới 1 tuổi dùng vỗ lưng - ấn ngực" và gắn nhãn suy ra, bỏ "tổn thương tạng ổ bụng" nếu không có nguồn. Bỏ/gắn nhãn "đẩy xuống sâu hơn", "viêm phổi sau vài ngày" hoặc dẫn ERC 2021.'
  - 'Bẫy 1: gắn nguồn trang đuối nước 02/06/2023 hoặc nhãn suy ra cho "không bế dốc ngược, không lắc".'

potential_harm:
  - "steps[0] / tldr 'ở yên tại chỗ hoặc cạnh xe' áp dụng cho cả 'bãi biển vắng' (tiêu đề). Ở bãi biển, thủy triều dâng, sóng, vách đá hoặc mặt nước lên có thể làm ở yên nguy hiểm; ở suối/khe núi có lũ quét cũng vậy. Mục không có điều kiện 'chỗ đang đứng phải an toàn'; nguồn CAND nói 'tìm một địa điểm thích hợp'."
  - "Bẫy 2 'gọi 115 trước vì nhớ số cấp cứu... Việc tìm người lạc thuộc 112': nếu người lạc/bạn đi cùng bị thương, sốc nhiệt, rắn cắn thì không gọi 115. Cũng không nhắc 114 (cứu nạn cứu hộ). Nghị định cho phép 112 liên thông 113/114/115 nên gọi số nào cũng được chuyển, nhưng người đọc có thể hiểu không được gọi 115."
  - "steps[2] 'chia nước uống từng ngụm' là hạn chế uống nước không có nguồn cho điều kiện này. Trong nắng nóng, hạn chế nước khi còn đủ nước gây mất nước nhanh hơn; [INFERENCE, chưa đối chiếu nguồn] thông lệ hoang dã là uống khi khát và chỉ chia khi nguồn nước thật sự hết."
  - "Bẫy 1 'không men theo suối' trái nguồn dẫn; nếu theo mục, người lạc bỏ một cách thoát hiểm mà nguồn dẫn khuyến nghị. Ngược lại nguồn không đề cập nguy cơ vực/thác/lũ. Cần một nguồn chính thống (NPS, Cục Cứu nạn cứu hộ, hướng dẫn kỹ năng của Bộ Công an) cho quyết định này."
suggested_edits:
  - "Tiêu đề, tldr: bỏ 'bãi biển vắng' và 'cạnh xe' hoặc thêm nguồn riêng. Nếu giữ, thêm điều kiện 'chỗ đang đứng an toàn (không ngập, không sạt, không dưới vách)'."
  - "steps[1]: đổi thành 'Còn sóng thì gọi 112 (cứu nạn); bị thương/ốm nặng gọi 115; cháy/cứu hộ gọi 114. Nói rõ vị trí (địa danh, điểm mốc, tọa độ nếu có), số người, tình trạng', dựa vào quote Điều 3 khoản 3b ('Thời gian, địa điểm... yêu cầu trợ giúp') và Điều 3 khoản 2b/4a (112 liên thông 113, 114, 115). Ghi rõ 'số người' là khuyến nghị của biên tập, không phải chữ của nghị định."
  - "steps[2]: bỏ 'chia nước từng ngụm' hoặc thay 'uống khi khát, giữ nước còn lại nếu chưa có nguồn nước' kèm nguồn; hoặc nêu trong Ghi chú là kinh nghiệm không có nguồn."
  - "Bẫy 1: bỏ hoặc nêu 'chỉ nên men theo suối nếu biết chắc đường ra; suối có thể có thác, vực' kèm nguồn; hiện mâu thuẫn quote CAND 'men xuôi dòng vì chắc chắn dọc theo sông suối sẽ đổ về đồng bằng hoặc có người ở'."
  - "Bẫy 2: sửa thành 'nếu có người bị thương nặng thì gọi 115; 112 là đầu mối cứu nạn', bỏ câu khẳng định 'việc tìm người lạc thuộc 112' vì Nghị định 200/2025 không nói."
  - "Điền legal_refs[].effective_from = 2025-08-23, tra Công báo/vbpl.vn để xác nhận hiệu lực rồi cập nhật validity."

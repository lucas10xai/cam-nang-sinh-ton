    severity: warn
  - issue: "Chương 13: mục 25 (tldr, steps[0]) nói 'gọi 115'; mục 49 nêu cấp cứu ngoại viện từ 01/11/2026 do Tổng đài 113 tiếp nhận (Thông tư 42/2026/TT-BYT Điều 2.1; hiệu lực 01/11/2026; hôm nay 08/11/2026). Nguồn TP.HCM nói giai đoạn chuyển tiếp cả 113/114/115 vẫn dùng được nhưng TT 42 có lộ trình đến 2027. Cần thống nhất cách ghi cả chương."
    severity: warn
  - issue: "Phần Bẫy 2 có lỗi định dạng: 'n==ắm tay nhau thành dây người' (ký tự == lọt vào giữa chữ)."
    severity: warn
  - issue: "legal_refs: 2 ref (Điều 3 khoản 1, khoản 4) trỏ đúng văn bản Nghị định 200/2025/NĐ-CP và khớp khẳng định; quote và effective_from để null (nghị định có hiệu lực 23/08/2025). Hai Điều này chỉ nói về đầu số 112, không liên quan quy tắc 'không nhảy xuống nước'."
    severity: warn
  - issue: "Các số trong tldr/steps: 115, 112 đều có trong thân và khớp nguồn. Không mâu thuẫn số."
    severity: warn
validity:
  doc: "Nghị định 200/2025/NĐ-CP ngày 09/07/2025 (Quy định chi tiết một số điều của Luật Phòng thủ dân sự)"
  in_force: unconfirmed
  effective_from: "2025-08-23"
  amended_by: []
  basis: "Điều 53 khoản 1 (OCR trang 31): 'Nghị định này có hiệu lực thi hành kể từ ngày 23 tháng 8 năm 2025'; khoản 2 thay Nghị định 30/2017 và 02/2019. Chưa kiểm được văn bản sửa đổi sau đó (Quyết định 1166/QĐ-TTg 29/06/2026 về tích hợp 113/114/115 là đề án, chưa rõ có sửa Điều 3 hay không). Hướng dẫn cứu đuối nước (BV Lạng Sơn 2020, Red Cross, St John) không có ngày hiệu lực."
deliberate_vn_deviation:
  - "Hướng dẫn VN (BV Lạng Sơn, trích SKĐS 2020): 'Chỉ xuống cứu khi người cứu biết bơi'. Red Cross: 'Reach or throw, don't go! ... Don't go in!' không phân biệt người biết bơi. Mục 25 theo bản VN."
  - "Bản VN dùng thổi ngạt 2 hơi rồi ép 15:2 (hai người) hoặc 30:2; hướng dẫn quốc tế hiện hành (St John, ERC/ILCOR) dùng 5 hơi thổi ban đầu rồi 30:2. Mục 25 không nêu hồi sức nên không bị ảnh hưởng, nhưng nếu thêm bước thì dùng chuẩn mới."
potential_harm:
  - "steps[2] 'Chỉ xuống cứu khi mình biết bơi' đứng độc lập: người biết bơi nhưng chưa được huấn luyện cứu hộ cũng có thể bị nạn nhân hoảng loạn ghì chìm (chính nguồn Lạng Sơn nêu cơ chế này) và Red Cross khuyên không xuống nước. Có thể gây thêm người chết đuối. Mức: trung bình."
  - "Mục không có bước hồi sức cho nạn nhân đã lên bờ không thở nhưng nói dốc ngược 'làm mất thời gian ép tim'. Người đọc có thể hiểu chỉ cần ép tim (không thổi ngạt) rồi chờ 115. Với đuối nước, thổi ngạt là ưu tiên (5 hơi ban đầu, St John). Mức: trung bình (thiếu bước, không phải bước sai)."
suggested_edits:
  - "steps[2]: đổi thành 'Không nhảy xuống nước. Đưa sào/dây, ném phao/vật nổi rồi gọi người. Chỉ người đã được huấn luyện cứu hộ mới xuống nước' (dựa Red Cross 'Reach or throw, don't go'; giữ ghi chú nguồn VN)."
  - "steps[3] + Bẫy 2: bỏ 'không nắm tay nhau thành dây người' hoặc thêm nguồn; sửa lỗi 'n==ắm'."
  - "steps[0]: ghi rõ '112 khi ở biển/sông nước rộng' là suy ra từ phạm vi sự cố sông biển của 112; thống nhất 115/113 với mục 49."
  - "Thêm 1 bước hoặc câu dẫn sang mục CPR: nạn nhân lên bờ không đáp ứng, không thở thì gọi cấp cứu, mở đường thở, thổi 5 hơi ban đầu rồi ép ngực 30:2 (St John Ambulance)."
  - "legal_refs: bỏ hoặc điền quote; Điều 3 NĐ 200 chỉ sửa được claim về số 112."

potential_harm:
  - "Step 3 “Hô to để người xung quanh cùng nhìn” trong ẩu đả có hung khí có thể thu hút sự chú ý của nhóm đánh nhau về phía người hô, không có nguồn; nên gắn điều kiện “từ khoảng cách an toàn”."
  - "Step 4: chỉ gọi 115 “nếu có người nằm xuống”; người bị đâm/chém có thể vẫn đứng nhưng chảy máu nặng. Nếu làm đúng nguyên văn có thể chậm gọi cấp cứu."
suggested_edits:
  - "Bẫy 1: bỏ khẳng định “bị tính như một bên tham gia” hoặc dán nhãn “suy ra, không phải điều luật”; thêm câu: pháp luật (Điều 22 khoản 1) có bảo vệ người chống trả vì người khác khi cần thiết, nhưng rất khó ra khỏi giới hạn trong ẩu đả đông người."
  - "Bẫy 3: bỏ “tình tiết nặng nhất”; nói “rất bất lợi” hoặc dẫn điều luật cụ thể có quote."
  - "Step 4: sửa thành “Gọi 115 nếu có người bị thương nặng, chảy máu nhiều hoặc nằm xuống”."
  - "Thêm 1 dòng về Điều 132 BLHS (quote trên) để người đọc không hiểu “lùi ra” là được phép bỏ mặc nếu có thể gọi cứu giúp."

claims:
  - text: "Điều 22 khoản 1: chỉ coi là phòng vệ chính đáng khi chống trả cần thiết trước người đang xâm phạm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Phòng vệ chính đáng là hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên."
    verdict: partial
    note: "Khớp ý. Nhưng điều luật nói rõ phòng vệ cho “người khác”; mục chỉ nói “chống trả cần thiết trước người đang xâm phạm” và Bẫy 1 hàm ý can thiệp luôn bị tính là một bên, dễ khiến người đọc tưởng luật không bảo vệ người can thiệp hợp lý."
  - text: "Điều 22 khoản 2: chống trả rõ ràng quá mức cần thiết thì vẫn chịu trách nhiệm hình sự"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất và mức độ nguy hiểm cho xã hội của hành vi xâm hại. Người có hành vi vượt quá giới hạn phòng vệ chính đáng phải chịu trách nhiệm hình sự theo quy định của Bộ luật này."
    verdict: match
    note: ""
  - text: "113 tiếp nhận tin báo cướp giật, gây rối, bạo hành, hành vi có dấu hiệu tội phạm"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "113 – Lực lượng Công an: Tiếp nhận tin báo về cướp giật, trộm cắp, gây rối, bạo hành, tai nạn giao thông và các hành vi có dấu hiệu tội phạm, ảnh hưởng đến an ninh trật tự."
    verdict: match
    note: ""
  - text: "115 là số cấp cứu y tế cho tai nạn, chấn thương nặng"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "115 – Cấp cứu y tế: Sử dụng khi có tai nạn, chấn thương nặng, các tình huống bệnh lý nguy hiểm đến tính mạng cần cấp cứu khẩn cấp."
    verdict: match
    note: ""
  - text: "Cả hai miễn phí, bấm trực tiếp không cần mã vùng khi cùng khu vực"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "người dân khi ở trong cùng khu vực chỉ cần bấm trực tiếp số 113, 114, 115… mà không cần mã vùng. ... các cuộc gọi đến số khẩn cấp hoàn toàn miễn phí."
    verdict: match
    note: ""
  - text: "Giữ tay người đang đánh cũng là tác động vào thân thể người khác và bị tính như một bên tham gia (Bẫy 1)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: not-found
    note: "Không có điều luật nào trong nguồn nói vậy; đây là khẳng định pháp lý không nguồn. Điều 22 khoản 1 còn cho phép bảo vệ người khác."
  - text: "Cầm hung khí trong một vụ ẩu đả là tình tiết nặng nhất (Bẫy 3)"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: not-found
    note: "Không có điều khoản được trích (ví dụ tội cố ý gây thương tích). “Nặng nhất” là phóng đại không nguồn."
  - text: "Bạn vào can một nhóm đang đánh nhau thì rất khó chứng minh mình chỉ can; không ai đo được ai ra tay trước"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Suy ra từ ranh giới Điều 22; mục tự nhận ở Ghi chú."
  - text: "Quay clip từ xa, sau vật cản rồi rời đi; hô to để người xung quanh cùng nhìn"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: ""
    verdict: inference
    note: "Không có nguồn cho hai bước này."
internal_checks:

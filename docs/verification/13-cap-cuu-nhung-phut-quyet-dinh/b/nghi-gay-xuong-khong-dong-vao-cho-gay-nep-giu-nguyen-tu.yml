claims:
  - text: Bạch Mai hướng dẫn bất động ngay sau khi xác định chi gãy; mục đích ngăn tổn thương phần mềm, giảm đau, ngăn sốc, giảm gãy hở
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/cap-cuu-gay-xuong-chi/
    quote: Sau khi đã xác định được chi gãy cần bất động ngay để ngăn ngừa tổn thương thêm phần mềm do đầu xương sắc gây ra, làm giảm đau và ngăn ngừa sốc, giảm nguy cơ gãy hở do đầu xương có thể chọc thủng da.
    verdict: match
    note: ""
  - text: "Nguyên tắc đặt nẹp: không nắn lại xương, không ấn xương chồi; đệm lót; theo dõi tuần hoàn ngoại vi trước và sau nẹp"
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/cap-cuu-gay-xuong-chi/
    quote: "Đặt nẹp: – Không nắn lại xương, không ấn xương chồi"
    verdict: match
    note: Cũng có các dòng "Theo dõi tuần hoàn ngoại vi trước khi nẹp", "Đệm lút nẹp", "Theo dõi tuần hoàn sau nẹp" cùng trang.
  - text: Bước 1 "Để nguyên tư thế, không nắn lại xương" (vô điều kiện)
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/cap-cuu-gay-xuong-chi/
    quote: "Bất động nẹp trong tư thế gãy ngoại trừ: Chi biến dạng nặng nề không thể nẹp, khó khăn cho vận chuyển / Đầu xương gãy có nguy cơ chọc thủng da / Rối loạn tuần hoàn / Nếu vậy – Hãy kéo chi theo trục hoặc chỉnh lại trục xoay hoặc chỉ cần chỉnh lại cho thẳng tương đối để có thể bất động tốt hơn."
    verdict: partial
    note: Chính nguồn Bạch Mai nêu 3 ngoại lệ (biến dạng nặng, nguy cơ chọc thủng da, rối loạn tuần hoàn) cho nhân viên y tế được chỉnh trục. Mục viết "Hướng dẫn của Bạch Mai cấm đúng việc đó" và "Nắn tay là đẩy đầu xương vào dây thần kinh và mạch máu" (câu sau không có trong nguồn). Với người đọc không chuyên, lời "không tự nắn" là hợp lý nhưng mục không nói khi mất mạch/tím/lạnh chi sau nẹp thì làm gì (gọi 115, nới nẹp) nên đây là chỗ thiếu.
  - text: Chườm lạnh 15 đến 20 phút giúp giảm sưng và đau; không chườm trực tiếp đá lên da để tránh bỏng lạnh; rồi đưa tới cơ sở y tế chụp X-quang
    source_url: https://tytphuongcholon.medinet.gov.vn/chuyen-muc/5-dau-hieu-nhan-biet-gay-xuong-nhung-canh-bao-som-cmobile17616-272249.aspx
    quote: Dùng túi đá hoặc khăn lạnh chườm lên vùng bị thương trong 15–20 phút giúp giảm sưng và đau. Lưu ý không chườm trực tiếp đá lên da để tránh bỏng lạnh.
    verdict: match
    note: 'Dòng kế: "Sau khi sơ cứu, người bệnh cần được đưa đến bệnh viện để kiểm tra bằng các phương tiện chẩn đoán như X-quang hoặc CT scan". Nguồn là trang trạm y tế phường, không phải hướng dẫn Bộ Y tế/AAOS/Red Cross; con số 15–20 phút chỉ có nguồn này.'
  - text: 'Nguồn tl: "mỗi lần chườm 15 đến 20 phút" và đó là giới hạn (title ghi "không quá 20 phút")'
    source_url: https://tytphuongcholon.medinet.gov.vn/chuyen-muc/5-dau-hieu-nhan-biet-gay-xuong-nhung-canh-bao-som-cmobile17616-272249.aspx
    quote: Dùng túi đá hoặc khăn lạnh chườm lên vùng bị thương trong 15–20 phút giúp giảm sưng và đau.
    verdict: partial
    note: Nguồn không nói "không quá 20 phút", cũng không nói khoảng nghỉ giữa các lần chườm. Mục tự thêm "mỗi lần... rồi" (ngụ ý lặp lại) mà không nói nghỉ bao lâu.
  - text: '"Bẫy 2: chườm nóng, xoa dầu nóng, đắp lá thuốc ngay sau chấn thương làm sưng thêm"'
    source_url: https://tytphuongcholon.medinet.gov.vn/chuyen-muc/5-dau-hieu-nhan-biet-gay-xuong-nhung-canh-bao-som-cmobile17616-272249.aspx
    quote: Chườm lạnh giảm sưng
    verdict: inference
    note: Không nguồn nào nêu chườm nóng/dầu nóng/lá thuốc làm sưng thêm. Là suy ra hợp lý (nguyên tắc RICE) nhưng phải gắn nhãn hoặc dẫn nguồn.
  - text: Mục không nói gì về gãy hở/chảy máu, nghi chấn thương cột sống/cổ/chậu/đùi, hoặc khi nào gọi 115 thay vì tự đi viện
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/cap-cuu-gay-xuong-chi/
    quote: Trong trường hợp gãy xương hở cần tuân thủ nghiêm ngặt các nguyên tắc vô khuẩn trong sơ cứu
    verdict: partial
    note: Nguồn có nhánh gãy hở (băng vô khuẩn, không đổ thuốc sát khuẩn, không đẩy xương chồi). Mục lược bỏ hoàn toàn nên "tới cơ sở y tế chụp phim" là bước duy nhất cho mọi loại gãy.

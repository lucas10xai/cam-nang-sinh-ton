potential_harm:
  - 'Step 1/tldr "Để nguyên tư thế... không nắn" nói vô điều kiện, không có ngoại lệ nguồn chính nêu (rối loạn tuần hoàn/biến dạng nặng) và không dặn gọi 115/đưa đi ngay khi chi lạnh, tím, mất mạch: có thể làm chậm cứu chi.'
  - 'Mục không phân biệt gãy hở (chảy máu, lộ xương: cần cầm máu, băng vô khuẩn, không chườm đá lên vết thương hở) và không nhắc nghi gãy cột sống/cổ, xương chậu, xương đùi thì không di chuyển nạn nhân, gọi 115. Người đọc làm theo "nẹp rồi tự tới viện" có thể di chuyển nạn nhân chấn thương cột sống/chậu hoặc chậm cầm máu.'
suggested_edits:
  - 'Thêm bước 0 trước các bước hiện có: "Chảy máu nhiều, xương lộ ra, chi lạnh tím hoặc mất cảm giác, nghi gãy cổ/lưng/chậu/đùi, hoặc nạn nhân đau dữ dội/choáng: gọi 115, không di chuyển nạn nhân" (dựa vào Bạch Mai: "Gãy xương lớn có thể gây sốc chấn thương"; "Garô chỉ là biện pháp cuối cùng"; nhánh gãy hở).'
  - 'Bước 2: thay "theo dõi tuần hoàn ngoại vi" bằng ngôn ngữ thường: "Sau khi nẹp, kiểm tra đầu ngón: màu hồng, ấm, còn cảm giác; nếu tím, lạnh, tê hoặc đau tăng thì nới băng và gọi 115" (dựa vào quote "Theo dõi tuần hoàn sau nẹp"); gắn nhãn đây là diễn giải.'
  - 'Thêm 1 câu về gãy hở: băng sạch lên vết thương, không đẩy xương chồi, không rửa/đổ thuốc vào vết thương (dựa vào quote "Không thăm dò vết thương, không nắn đẩy đầu xương chồi.").'
  - Sửa "Nắn tay là đẩy đầu xương vào dây thần kinh và mạch máu" thành "Nắn có thể làm tổn thương thêm dây thần kinh, mạch máu; việc nắn thuộc về bác sĩ" hoặc bỏ; sửa "Bẫy 2... làm sưng thêm" gắn nhãn suy ra.
  - 'Title/tldr: đổi "không quá 20 phút" thành "15 đến 20 phút mỗi lần" cho khớp nguồn; thêm "nghỉ giữa các lần" nếu có nguồn.'
  - Thay/bổ sung nguồn quốc tế (Red Cross/AAOS/NHS) cho nhánh gọi cấp cứu và chườm lạnh.

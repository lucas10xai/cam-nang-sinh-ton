claims:
  - text: "Điều 52 Luật TĐKT: Huân chương Dũng cảm tặng cho cá nhân có hành động dũng cảm khi cứu người trong thảm họa, thiên tai, dịch bệnh, tai nạn, cháy, nổ hoặc đấu tranh phòng, chống tội phạm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/07/06-2022-qh15..pdf
    quote: "“Huân chương Dũng cảm” để tặng hoặc truy tặng cho cá nhân có hành động dũng cảm khi cứu người, cứu tài sản của Nhà nước, của Nhân dân trong thảm họa, thiên tai, dịch bệnh, tai nạn, cháy, nổ, đấu tranh phòng, chống tội phạm hoặc dũng cảm xung phong vào nơi nguy hiểm nhằm bảo vệ tính mạng của người dân và thành tích đạt được có tác dụng động viên, giáo dục, nêu gương trong phạm vi quản lý của Bộ, ban, ngành, tỉnh hoặc toàn quốc."
    verdict: partial
    note: "Bỏ điều kiện cuối: thành tích phải “có tác dụng động viên, giáo dục, nêu gương trong phạm vi quản lý của Bộ, ban, ngành, tỉnh hoặc toàn quốc”. Mục tldr và steps khiến người đọc tưởng cứu người là đủ để xin Huân chương Dũng cảm; luật cho phép các hình thức khen thưởng khác (không đề cập)."
  - text: "Điều 85 khoản 1 điểm b: hành động dũng cảm cứu người được khen thưởng theo thủ tục đơn giản"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/07/06-2022-qh15..pdf
    quote: "b) Cá nhân, tập thể lập được thành tích xuất sắc đột xuất trong chiến đấu, phục vụ chiến đấu, trong lao động, công tác, sản xuất, kinh doanh, học tập và nghiên cứu khoa học hoặc lĩnh vực khác hoặc có hành động dũng cảm cứu người, cứu tài sản của Nhà nước, của Nhân dân hoặc được giải thưởng quốc tế của khu vực hoặc thế giới;"
    verdict: match
    note: "Vế “tức không phải chờ bình xét cuối năm” là diễn giải của mục, không phải chữ luật. Luật sửa đổi Luật TĐKT (Luật 06/2026/QH16 ngày 23/04/2026 theo Thông tư 25/2026/TT-BNV) có sửa điểm a khoản 1 Điều 85 (dự thảo); chưa đọc bản chính thức xem điểm b còn nguyên."
  - text: "Nghị định 98/2023 Điều 3 khoản 4: “thành tích đặc biệt xuất sắc đột xuất” khi dũng cảm cứu người"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-98-2023-nd-cp-41047.htm
    quote: "4. Thành tích đặc biệt xuất sắc đột xuất là thành tích đột xuất đạt được ở mức độ đặc biệt xuất sắc khi dũng cảm cứu người, cứu tài sản của Nhân dân, của Nhà nước hoặc trong chiến đấu, phục vụ chiến đấu hoặc lập được thành tích đặc biệt xuất sắc trong các lĩnh vực kinh tế xã hội, văn hóa, thể thao và các lĩnh vực khác ở trong nước hoặc khu vực, thế giới."
    verdict: partial
    note: "Trích từ file PDF Công báo 147+148 (tải qua trang Công báo). Mục viết “Đây được gọi là ‘thành tích đặc biệt xuất sắc đột xuất’” cho mọi trường hợp cứu người; định nghĩa đòi “ở mức độ đặc biệt xuất sắc”. Văn bản này có thể đã bị thay thế (xem validity)."
  - text: "Tiền thưởng Huân chương Dũng cảm là 4,5 lần mức lương cơ sở (NĐ 98/2023 Điều 55 khoản 1 điểm h)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-98-2023-nd-cp-41047.htm
    quote: "h) “Huân chương Lao động” hạng Ba, “Huân chương Chiến công” hạng Ba, “Huân chương Bảo vệ Tổ quốc” hạng Ba và “Huân chương Dũng cảm”: 4,5 lần mức lương cơ sở."
    verdict: match
    note: "Khớp văn bản được dẫn, nhưng NĐ 98/2023 đã được thay (xem claim kế tiếp và validity): con số hiện hành nằm ở Điều 54 NĐ 368/2026."
  - text: "Hiện hành: Điều 54 khoản 1 điểm h NĐ 368/2026/NĐ-CP (hiệu lực 01/10/2026) cũng 4,5 lần"
    source_url: https://lawplayer.com/vn/article/vn-congbao-470594/e0054
    quote: "h) “Huân chương Lao động” hạng Ba, “Huân chương Chiến công” hạng Ba, “Huân chương Bảo vệ Tổ quốc” hạng Ba, “Huân chương Dũng cảm”, “Huân chương Hữu nghị”: 4,5 lần mức lương cơ sở."
    verdict: match-secondary
    note: "Bản sao LawPlayer (đồng bộ vbpl.vn 08/10/2026); bài tcnnld.vn ngày 29/09/2026 cũng nêu cùng mức và “có hiệu lực thi hành từ ngày 01/10/2026”. Chưa mở được PDF Công báo của NĐ 368/2026. Số 4,5 không đổi, nhưng điều khoản dẫn trong mục (NĐ 98, Điều 55) là văn bản cũ."
  - text: "Tiền thưởng tính theo lương cơ sở lúc ban hành quyết định, làm tròn lên hàng chục nghìn đồng (NĐ 98 Điều 53 khoản 1, 2)"
    source_url: https://lawplayer.com/vn/article/vn-congbao-470594/e0052
    quote: "1. Tiền thưởng cho cá nhân, tập thể, hộ gia đình được khen thưởng được tính trên cơ sở mức lương cơ sở do Chính phủ quy định đang có hiệu lực vào thời điểm ban hành quyết định công nhận danh hiệu thi đua, quyết định hình thức khen thưởng. 2. Tiền thưởng sau khi nhân với hệ số mức lương cơ sở được làm tròn số lên hàng chục nghìn đồng tiền Việt Nam."
    verdict: match-secondary
    note: "Khớp ở NĐ 368/2026 Điều 52 (bản sao LawPlayer). Văn bản NĐ 98 Điều 53 khoản 1, 2 (PDF Công báo) cũng có cùng nội dung nên claim đúng ý, nhưng số điều trong mục đã lạc hậu."
  - text: "Mức lương cơ sở từ 01/7/2026 là 2.530.000 đồng (NĐ 161/2026/NĐ-CP)"
    source_url: https://xaydungchinhsach.chinhphu.vn/tu-01-7-chinh-phu-tang-luong-co-so-119260517100243881.htm
    quote: "Theo Nghị định số 161/2026/NĐ-CP, mức lương cơ sở từ ngày 01/7/2026 là 2.530.000 đồng/tháng (mức lương cơ sở hiện nay là 2.340.000 đồng/tháng)."
    verdict: match-secondary
    note: "Báo chính phủ (Chinhphu.vn), không phải văn bản NĐ 161/2026. Nghị định này đồng thời quy định “chế độ tiền thưởng” cho cán bộ, công chức; không thấy nó đổi quy tắc tiền thưởng khen thưởng. Mục dẫn NĐ 161 trong Nguồn nhưng không có trong legal_refs."
  - text: "Mức thưởng tương đương 11.390.000 đồng"
    source_url: https://xaydungchinhsach.chinhphu.vn/tu-01-7-chinh-phu-tang-luong-co-so-119260517100243881.htm
    quote: ""
    verdict: inference
    note: "Phép tính: 4,5 × 2.530.000 = 11.385.000, làm tròn lên hàng chục nghìn = 11.390.000. Đúng số học; là suy ra từ hai nguồn trên, không phải chữ của nguồn."
  - text: "Điều 7 khoản 2 Luật KCB: từ chối hoặc cố ý chậm cấp cứu người bệnh là hành vi bị nghiêm cấm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf
    quote: "2. Từ chối hoặc cố ý chậm cấp cứu người bệnh, trừ trường hợp quy định tại Điều 40 của Luật này."
    verdict: partial
    note: "Mục bỏ ngoại lệ “trừ trường hợp quy định tại Điều 40”; không đọc Điều 40 nên không rõ ngoại lệ là gì. Không gây hại hành động của người đọc."
  - text: "Điều 61 khoản 7 điểm a Luật KCB: ngân sách nhà nước trả chi phí vận chuyển và dịch vụ KCB trong quá trình vận chuyển cấp cứu với trường hợp tai nạn"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf
    quote: "a) Ngân sách nhà nước bảo đảm kinh phí cho đầu tư thiết lập hệ thống cơ sở cấp cứu ngoại viện của Nhà nước; ... chi phí vận chuyển và sử dụng dịch vụ khám bệnh, chữa bệnh trong quá trình vận chuyển cấp cứu đối với trường hợp tai nạn, thiên tai, thảm họa, dịch bệnh truyền nhiễm đặc biệt nguy hiểm ..."
    verdict: match
    note: "Điều khoản về cấp cứu ngoại viện (hệ thống cấp cứu của Nhà nước). Mục dùng để nói người cứu người không phải trả tiền xe cấp cứu; luật không nêu rõ cho từng trường hợp (hoàn cảnh cụ thể do cơ quan có thẩm quyền quy định)."
  - text: "Việc lập hồ sơ do cơ quan nơi làm việc hoặc xã phường nơi xảy ra việc (step 4, Bẫy 1)"
    source_url: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-98-2023-nd-cp-41047.htm
    quote: "3. Người đứng đầu bộ, ban, ngành, tỉnh; người đứng đầu cơ quan, tổ chức, đơn vị khen thưởng và đề nghị khen thưởng ngay sau khi cá nhân, tập thể lập được thành tích xuất sắc, đột xuất theo quy định tại điểm b khoản 1 Điều 85 của Luật Thi đua, khen thưởng."
    verdict: inference
    note: "NĐ 98 Điều 40 khoản 3 nói người đứng đầu cơ quan, tổ chức, đơn vị khen thưởng và đề nghị khen thưởng, và khoản 2 b nói “cơ quan, tổ chức, đơn vị quản lý trực tiếp”. “Xã phường nơi xảy ra việc” không có trong chữ; là suy ra. Cũng không có thủ tục cho người không thuộc cơ quan nào (người dân tự do)."
  - text: "Bẫy 2: người cứu người ngoài đường thì đường đi là BHYT, bồi thường dân sự và khen thưởng; chế độ thương binh chỉ cho nhóm đối tượng theo pháp lệnh người có công"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/8/2026-123-phap-lenh-uu-dai-nguoi-co-cong-voi-cach-mang-thanh-trang.pdf
    quote: "h) Dũng cảm cứu người, cứu tài sản của Nhà nước, của Nhân dân hoặc dũng cảm ngăn chặn, bắt giữ người có hành vi phạm tội. 2. Người không phải là sĩ quan, quân nhân chuyên nghiệp, hạ sĩ quan, binh sĩ trong Quân đội nhân dân và sĩ quan, hạ sĩ quan, chiến sĩ trong Công an nhân dân bị thương có tỷ lệ tổn thương cơ thể từ 21% trở lên thuộc một trong các trường hợp quy định tại khoản 1 Điều này thì được cơ quan, đơn vị có thẩm quyền xem xét công nhận là người hưởng chính sách như thương binh"
    verdict: mismatch
    note: "VBHN 123/2026 Pháp lệnh Ưu đãi người có công, Điều 23 khoản 1 điểm h và khoản 2. Người dân thường bị thương ≥21% khi dũng cảm cứu người CÓ thể được xem xét công nhận “người hưởng chính sách như thương binh”; nếu hy sinh thì Điều 14 khoản 1 điểm h (liệt sĩ). Mục dặn “đường đi là BHYT, bồi thường dân sự và khen thưởng” và bác bỏ chế độ này, gây hiểu sai; người thương tật nặng có thể bỏ lỡ chế độ. “Đương nhiên được hưởng” đúng là sai (cần cơ quan xem xét), nhưng phần còn lại thì sai."

  - "Pháp luật VN, thêm mục “Chế độ ưu đãi” dựa trên quote Pháp lệnh Ưu đãi người có công Điều 23 khoản 1 điểm h và khoản 2 (người dân thường bị thương ≥21% do dũng cảm cứu người được xem xét công nhận người hưởng chính sách như thương binh) và Điều 14 khoản 1 điểm h (liệt sĩ khi hy sinh); sửa Bẫy 2 thành “không đương nhiên được; phải có cơ quan có thẩm quyền xem xét, hồ sơ xin ở UBND xã/phường hoặc cơ quan quản lý”. Cần kiểm tên cơ quan nộp hồ sơ (chưa kiểm)."
  - "legal_refs và Pháp luật VN: thay NĐ 98/2023 Điều 3 khoản 4, Điều 53, Điều 55 bằng NĐ 368/2026/NĐ-CP (Điều 52 nguyên tắc tính tiền thưởng, Điều 54 khoản 1 điểm h), kiểm Điều giải thích “thành tích đặc biệt xuất sắc đột xuất” trong NĐ 368 và thủ tục đơn giản (tương ứng Điều 40 NĐ 98); thêm NĐ 161/2026/NĐ-CP vào legal_refs."
  - "Điều 52 Luật TĐKT: thêm điều kiện “thành tích có tác dụng động viên, giáo dục, nêu gương trong phạm vi Bộ, ban, ngành, tỉnh hoặc toàn quốc” và nói thẳng nhiều vụ cứu người sẽ nhận hình thức khen thưởng khác (Bằng khen, Giấy khen) theo mức do NĐ 368/2026 Điều 57 quy định (chưa kiểm)."
  - "Step 4 và Bẫy 1: bỏ “xã phường nơi xảy ra việc” hoặc dán nhãn “suy ra”; dẫn NĐ 98 Điều 40 khoản 2, 3 (nay cần dẫn điều tương ứng của NĐ 368) rằng người đứng đầu cơ quan, tổ chức, đơn vị đề nghị ngay sau khi lập thành tích."
  - "Điều 7 khoản 2 Luật KCB: thêm “trừ trường hợp quy định tại Điều 40 Luật KCB” hoặc bỏ dòng này, vì không liên quan trực tiếp tới việc người dân cứu người."

  basis: "Bài thuvienphapluat 10/07/2025 kết luận NĐ 98/2023 hết hiệu lực từ 01/7/2025 (có chuyển tiếp áp dụng đến hết 31/12/2025 nếu chưa có quy định phân cấp); bài tcnnld.vn 29/09/2026 nói NĐ 368/2026/NĐ-CP có hiệu lực 01/10/2026 và thay NĐ 152/2025; Thông tư 25/2026/TT-BNV (01/10/2026) căn cứ NĐ 368/2026. Chưa mở văn bản gốc NĐ 368/2026 để đọc điều khoản bãi bỏ NĐ 98 và chưa tìm điều tương ứng Điều 3 khoản 4 NĐ 98. Luật Thi đua, khen thưởng 06/2022/QH15 được sửa bởi Luật 06/2026/QH16 (23/04/2026); chỉ đọc bản dự thảo, thấy sửa điểm a khoản 1 Điều 85, chưa thấy sửa Điều 52. Luật KCB 15/2023 (hợp nhất 2026) còn hiệu lực theo VBHN 26/2026. Pháp lệnh Ưu đãi người có công có VBHN 123/2026 (05/8/2026); Pháp lệnh 05/2026/UBTVQH16 sửa Điều 14 có hiệu lực 01/01/2027."

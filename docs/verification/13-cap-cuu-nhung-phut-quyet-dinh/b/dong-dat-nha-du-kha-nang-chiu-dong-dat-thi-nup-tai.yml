claims:
  - text: "Yêu cầu không sụp đổ: kết cấu phải chịu được tác động động đất thiết kế mà không sụp đổ cục bộ hay toàn phần, giữ tính toàn vẹn và còn một phần khả năng chịu tải sau động đất (mục 2.1)"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "Kết cấu phải được thiết kế và thi công để chịu được tác động động đất thiết kế như định nghĩa trong Chương 3 mà không bị sụp đổ cục bộ hay sụp đổ toàn phần, đồng thời giữ được tính toàn vẹn của kết cấu và còn một phần khả năng chịu tải trọng sau khi động đất xảy ra."
    verdict: match-secondary
    note: "Mục 2.1(1)P, 'Yêu cầu không sụp đổ'. Bản PDF 230 trang trích được chữ, lưu trên website mtu.edu.vn (thư mục tài liệu tham khảo của Khoa Xây dựng một trường đại học), không phải bản của Bộ Khoa học và Công nghệ/Bộ Xây dựng; nội dung tương ứng với TCVN 9386:2012 (đầu bản: 'TCVN 9386:2012 được chuyển đổi từ TCXDVN 375:2006'). Không có bản chính thống để đối chiếu nên match-secondary."
  - text: "Động đất mạnh, từ 0,08g trở lên: phải tính toán và cấu tạo kháng chấn (mục 3.1.3)"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "Theo giá trị gia tốc nền thiết kế ag = γI x agR, chia thành ba trường hợp động đất: - Động đất mạnh ag ≥ 0,08g, phải tính toán và cấu tạo kháng chấn;"
    verdict: match-secondary
    note: "Chữ đúng nhưng nằm trong LỜI NÓI ĐẦU (và 3.2.1(4),(5)), không phải 'mục 3.1.3'. Trong bản này 3.1 là 'Điều kiện nền đất' (3.1.1 Tổng quát, 3.1.2 Nhận dạng các loại nền đất); không có mục 3.1.3 chứa nội dung này (tìm thấy dòng 3.1.2 rồi 3.2.1 'Các vùng động đất'). Tham chiếu article sai. Thêm: ngưỡng áp dụng cho ag = γI·agR (gia tốc nền thiết kế = hệ số tầm quan trọng × gia tốc nền tham chiếu), trên nền loại A."
  - text: "Động đất yếu, từ 0,04g đến dưới 0,08g: chỉ cần giải pháp kháng chấn giảm nhẹ"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "Động đất yếu 0,04g ≤ ag < 0,08g, chỉ cần áp dụng các giải pháp kháng chấn đã được giảm nhẹ;"
    verdict: match-secondary
    note: "Cùng vị trí: Lời nói đầu. Mục 3.2.1(4): 'Trường hợp động đất yếu, có thể sử dụng các quy trình thiết kế chịu động đất được giảm nhẹ hoặc đơn giản hóa cho một số loại, dạng kết cấu.' ('có thể' cho 'một số loại, dạng kết cấu', không phải 'chỉ cần' cho mọi công trình)."
  - text: "Động đất rất yếu, dưới 0,04g: không cần thiết kế kháng chấn"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "Động đất rất yếu ag < 0,04g, không cần thiết kế kháng chấn."
    verdict: match-secondary
    note: "Lời nói đầu; 3.2.1(5)P: 'Trong trường hợp động đất rất yếu, không cần phải tuân theo những điều khoản của tiêu chuẩn này.'"
  - text: "Phụ lục H ghi nội thành Hà Nội ở mức 0,0976g đến 0,1032g, tức nằm trong nhóm phải tính kháng chấn"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "1. Thủ đô Hà Nội - Nội thành: Quận Ba Đình (P. Cống Vị) 0.0976; Quận Cầu Giấy (P. Quan Hoa) 0.1032; Quận Đống Đa 0.0983; Quận Hai Bà Trưng 0.0959; Quận Hoàn Kiếm 0.0892; Quận Hoàng Mai 0.1001; Quận Long Biên (P. Ngọc Thụy) 0.0747; Quận Tây Hồ 0.0819; Quận Thanh Xuân 0.1097"
    verdict: mismatch
    note: "Hai giá trị 0,0976 (Ba Đình) và 0,1032 (Cầu Giấy) có thật ở Phụ lục H, nhưng không phải 'mức' của cả nội thành. Bảng cho nội thành Hà Nội từ 0,0747 (Long Biên) đến 0,1097 (Thanh Xuân). Long Biên 0,0747 < 0,08 (động đất yếu, không phải 'phải tính kháng chấn' nếu γI=1). Giá trị trong bảng là agR (gia tốc nền tham chiếu), theo ag = γI·agR; công trình quan trọng có γI > 1."
  - text: "Tiêu chuẩn nói về nhà được thiết kế theo nó, không nói cách nhận biết một căn nhà cụ thể đã được thiết kế như vậy (Ghi chú)"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    quote: "Tiêu chuẩn này áp dụng để thiết kế nhà và công trình xây dựng trong vùng có động đất."
    verdict: match-secondary
    note: "Mục 1.1.1(1)P; khớp ý. Chính sự thừa nhận này cho thấy tiêu chuẩn không hỗ trợ khẳng định hành động (núp hay chạy)."
  - text: "Nhà xây theo chuẩn kháng chấn: chui xuống gầm bàn chắc, hai tay ôm đầu che gáy, bám chân bàn cho tới khi hết rung (steps[0])"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    quote: "COVER your head and neck with your arms. If a sturdy table or desk is nearby, crawl underneath it for protection. ... HOLD ON until the shaking stops. If you are under a table or desk, hold onto it as things will be moving."
    verdict: partial
    note: "American Red Cross: Drop, Cover, and Hold On (DROP onto hands and knees first), cũng áp dụng cho mọi toà nhà, không chỉ 'nhà chuẩn kháng chấn'. TCVN 9386 không có hướng dẫn hành động; nguồn mục dẫn (TCVN) KHÔNG chứa 'núp gầm bàn'. Mục thiếu 'DROP (quỳ xuống tay gối)', thiếu 'tránh xa cửa kính' ('crawl to an interior wall (away from windows)'), và thiếu điều kiện 'nếu không có bàn chắc'."
  - text: "Nhà cũ, tường gạch không giằng, cửa ra sân chỉ vài bước: chạy ra bãi trống (tldr/steps[1])"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    quote: "Deaths and injuries occur when people fall trying to walk or run during shaking or when they are hit by falling debris."
    verdict: mismatch
    note: "Red Cross (nguồn quốc tế gần nhất mở được): tử vong/chấn thương xảy ra khi người ngã lúc đi hoặc chạy trong lúc rung hoặc bị vật rơi; hướng dẫn 'Drop, Cover, Hold On' cho mọi tòa nhà, và 'If it is safe, exit the building' CHỈ SAU khi hết rung ('Wait a minute before getting up'). Không có nguồn nào mục dẫn nói 'nhà cũ thì chạy ra ngoài'; TCVN 9386 không đề cập. Đây là lệch công khai khỏi hướng dẫn quốc tế mà mục không gắn nhãn 'deliberate_vn_deviation' và không có nguồn VN (không có trích dẫn Bộ Xây dựng/Bộ Y tế/Cục Quản lý đê điều và PCTT)."
  - text: "Không nhảy lầu, không vào thang máy, không chen xuống cầu thang lúc đang rung"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    quote: "Deaths and injuries occur when people fall trying to walk or run during shaking or when they are hit by falling debris."
    verdict: inference
    note: "Hướng đúng (Red Cross: ở yên và che chở trong lúc rung) nhưng 'không vào thang máy' và 'không nhảy lầu' không có chữ trong trang Red Cross đã mở, càng không có trong TCVN 9386. Là suy ra, hợp lý."
  - text: "Bẫy 3: đứng ngay ô cửa vì nghĩ khung cửa chắc nhất; gạch và tấm đan phía trên khung cửa là thứ rơi trước"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    quote: "If you cannot find a protected space, crawl to an interior wall (away from windows)."
    verdict: inference
    note: "Không có chữ về 'khung cửa'; Red Cross khuyên tránh cửa kính. 'Gạch và tấm đan phía trên khung cửa rơi trước' là khẳng định cơ học không có nguồn."
  - text: "Việc cần làm khi chưa có động đất: đi một vòng, đếm số bước từ chỗ hay ngồi ra sân, chọn bàn chắc, tìm lối cầu thang thoát ra, hỏi nhà xây năm nào và có bản vẽ thiết kế không"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    quote: "If you live in an area prone to earthquakes, get your building evaluated and consider structural improvements."
    verdict: partial
    note: "Ý chuẩn bị khớp (Red Cross: 'Identify things that might fall during shaking... Secure these items'; đánh giá công trình). Mục không nói buộc cố định tủ, kệ, TV, không nhắc đồ dùng trong giày dép (Bed-kit: 'sturdy shoes to protect your feet from glass')."

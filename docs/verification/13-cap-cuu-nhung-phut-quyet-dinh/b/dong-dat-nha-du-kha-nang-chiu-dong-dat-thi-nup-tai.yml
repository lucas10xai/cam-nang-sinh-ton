validity:
  doc: "TCVN 9386:2012 Thiết kế công trình chịu động đất (Phần 1 và 2)"
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Bản PDF mtu.edu.vn không ghi quyết định ban hành hay ngày hiệu lực trong phần trích được; Lời nói đầu: 'TCVN 9386:2012 được chuyển đổi từ TCXDVN 375:2006 thành Tiêu chuẩn Quốc gia theo quy định tại khoản 1 Điều 69 của Luật Tiêu chuẩn và Quy chuẩn kỹ thuật'. Không tra Công báo/Bộ Khoa học Công nghệ nên unconfirmed. Hướng dẫn hành động khi động đất không có văn bản VN nào được mục dẫn."
deliberate_vn_deviation:
  - "Red Cross (và FEMA/USGS 'Drop, Cover, Hold On'): ở trong nhà, che chắn tại chỗ trong lúc rung rồi mới ra ngoài khi hết rung nếu an toàn. Mục: nhà cũ dễ sập mà cửa ra sân vài bước thì CHẠY ra bãi trống trong lúc rung. Không có nguồn VN; không có nhãn lệch trong mục."
potential_harm:
  - "tldr/steps[1]: 'Nhà cũ... cửa ra sân chỉ vài bước: chạy ra bãi trống' làm người đọc chạy trong lúc đất còn rung. Red Cross: 'Deaths and injuries occur when people fall trying to walk or run during shaking or when they are hit by falling debris.' Gạch/ngói/tấm đan ở lối ra, mái hiên, ban công thường rơi ra ngoài trước. Mục tự nêu Bẫy 3 'gạch và tấm đan phía trên khung cửa là thứ rơi trước' cho ô cửa, nhưng lệnh chạy qua đúng ô cửa đó."
  - "tldr/steps[0]: điều kiện 'Nhà xây theo chuẩn kháng chấn' không kiểm được. Nhà ở riêng lẻ VN, đa số không thiết kế theo TCVN 9386; người đọc không biết mình ở loại nào, nên có thể quyết định chạy ra ngoài (rủi ro ở trên) hoặc núp trong nhà dễ sập mà không có hướng dẫn thứ ba. Nguyên tắc chuẩn: núp gầm/che đầu cổ trong lúc rung rồi rời đi sau khi hết rung."
  - "steps[0] bỏ 'quỳ xuống tay gối (DROP)' và 'tránh xa cửa kính, cửa sổ' nếu không có bàn: Red Cross 'crawl to an interior wall (away from windows)'; dễ bị ngã hoặc kính vỡ."
suggested_edits:
  - "tldr, steps[0] và steps[1]: thay toàn bộ quy tắc 'nhà chuẩn/nhà cũ' bằng 'Quỳ xuống, che đầu cổ, chui xuống gầm bàn chắc (hoặc ép sát tường trong, tránh kính), bám chắc cho tới khi hết rung; hết rung mới ra ngoài nếu thấy nhà hư hại', dựa vào quote Red Cross (Drop/Cover/Hold On; 'Wait a minute before getting up... If it is safe, exit the building'). Nếu biên tập muốn giữ ngoại lệ 'nhà cũ, chạy ra', phải có nguồn VN hoặc quốc tế cụ thể (ví dụ hướng dẫn của IFRC/Cục Quản lý đê điều và PCTT) và ghi deliberate_vn_deviation."
  - "legal_refs[0].article: sửa 'mục 3.1.3' thành 'Lời nói đầu và mục 3.2.1(4),(5) (ba mức động đất); mục 2.1 (yêu cầu không sụp đổ); Phụ lục H'. Sửa cả phần Pháp luật Việt Nam."
  - "Phần Lợi ích và Pháp luật Việt Nam: bỏ câu 'nội thành Hà Nội ở mức 0,0976g đến 0,1032g, tức nằm trong nhóm phải tính kháng chấn'; thay bằng 'Phụ lục H: Ba Đình 0,0976; Cầu Giấy 0,1032; Long Biên 0,0747 (nội thành Hà Nội từ 0,0747 đến 0,1097; giá trị agR)'."
  - "Ghi rõ TCVN 9386 là tiêu chuẩn thiết kế, không phải hướng dẫn hành động, và đặt tldr/steps trên nguồn hướng dẫn hành động riêng (Red Cross/FEMA/USGS hoặc cơ quan VN)."
  - "Thay URL bằng bản chính thống của TCVN 9386:2012 (Bộ Khoa học Công nghệ/Bộ Xây dựng) hoặc ghi rõ là bản sao thứ cấp; tra hiệu lực/phiên bản mới."
  - "Thêm bước: hết rung thì rời nhà nếu hư hại, tránh dây điện, ngửi gas, dự trù dư chấn ('Expect aftershocks. Drop, Cover, and Hold On whenever you feel shaking')."

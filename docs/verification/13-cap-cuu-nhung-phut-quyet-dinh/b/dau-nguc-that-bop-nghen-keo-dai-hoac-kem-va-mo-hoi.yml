  basis: "Bản PDF ký số trên trungtamytehtn.vn: Điều 3 'có hiệu lực kể từ ngày ký'. Tìm kiếm 'còn hiệu lực/thay thế' không thấy văn bản thay thế trong kết quả (thuvienphapluat, nhuthanh, canhgiacduoc chỉ là bản sao), nhưng không mở được trang 'Liên quan hiệu lực' của CSDL chính thống nên không kết luận còn hiệu lực. Hướng dẫn tiêu sợi huyết/can thiệp dựa trên ESC 2017-2020; chưa đối chiếu hướng dẫn ESC/AHA mới hơn."
deliberate_vn_deviation:
  - "Quyết định 5332 mục 6.2.1 cho phép aspirin 150-325 mg khi nhân viên cấp cứu đến nhà; ERC 2021 First aid khuyến nghị người sơ cứu hỗ trợ tự nhai aspirin 150-300 mg sớm khi nghi nhồi máu. Bài truyền thông HCDC dẫn trong mục (và mục này) khuyên 'không tự dùng thuốc giảm đau' mà không nêu ngoại lệ aspirin: lệch hướng dẫn Bộ Y tế/ERC."
  - "Tư thế: Quyết định 5332 'nằm nghỉ'; mục viết 'ngồi nghỉ' theo bài HCDC; ERC: 'Sit or lie ... in a comfortable position'. Không lệch đáng kể."
potential_harm:
  - "tldr/title nêu 'cửa sổ 0 đến 12 giờ' mà không nói sau 12 giờ vẫn có chỉ định can thiệp (12-48 giờ nếu còn đau ngực/rối loạn nhịp/huyết động không ổn định): người đến sau 12 giờ có thể tự cho là muộn, không đi cấp cứu hoặc chờ thêm."
  - "Không nhắc aspirin nhai sớm (ERC 2021 / Quyết định 5332 6.2.1) trong khi cấm chung 'thuốc giảm đau', người đọc có thể bỏ lỡ can thiệp có lợi trong lúc chờ 115. Mức độ: lợi ích bị bỏ lỡ, không phải làm theo gây hại trực tiếp; nếu thêm aspirin phải kèm ngoại lệ (xem internal_checks)."
  - "Không có bước nào cho người ngất/ngừng thở (ép tim + AED + 115): người đọc chỉ làm theo 4 bước có thể ngồi nhìn người bệnh ngừng tim."
suggested_edits:
  - "tldr + 'Cửa sổ can thiệp': đổi 'Cửa sổ can thiệp ... 0 đến 12 giờ' thành 'Mở mạch kịp thời nhất trong 12 giờ đầu; sau 12 giờ vẫn có thể cần can thiệp, nên vẫn đi ngay' (dựa quote 'Từ 12 - 48 giờ ... bắt buộc chỉ định chụp và can thiệp ĐMV thì đầu nếu bệnh nhân có đau ngực tái phát, rối loạn nhịp hoặc huyết động không ổn định')."
  - "steps 3: đổi 'không tự dùng thuốc giảm đau' thành 'không tự uống thuốc giảm đau/thuốc dạ dày; chỉ nhai aspirin 150-300 mg nếu 115 hướng dẫn và không dị ứng, không nghi đau xé ra sau lưng' (dựa ERC 2021 'Early aspirin for chest pain' + Quyết định 5332 6.2.1 'Có thể cho dùng aspirin liều từ 150-325 mg nếu không có chống chỉ định'), hoặc bỏ cụm này và để 115 quyết."
  - "steps 2: đổi 'ngồi nghỉ' thành 'ngồi hoặc nằm ở tư thế thoải mái' (dựa ERC 2021 'Sit or lie the casualty in a comfortable position'); bỏ 'nới áo' hoặc gắn nhãn suy ra."
  - "Thêm bước: nếu người bệnh ngất, không đáp ứng, không thở hoặc thở ngáp: ép tim và dùng AED (liên kết mục 13-01), dựa bài HCDC ('ép tim ngay (100–120 lần/phút, sâu 5–6 cm)...')."
  - "Sửa số mục dẫn: 0-12 giờ và 120 phút → mục 4.2; 90/60/10 phút, 2-24 giờ → 4.3.2; 4.3.1.3 → 12 giờ/4 giờ; bỏ 4.3.1.4. Thêm chương 'Hội chứng vành cấp không ST chênh lên, 6.2.1' cho 115/không tự lái xe/aspirin."
  - "Bẫy 2: bỏ ý dùng mốc 10 phút để thúc người bệnh; viết 'càng chờ, cơ tim càng mất' dựa quote 'Thời gian là cơ tim, cơ tim là sự sống'."
  - "Chi phí: bỏ 'Gọi 115 không mất tiền' hoặc dẫn nguồn, bỏ ý BHYT nếu không có nguồn."

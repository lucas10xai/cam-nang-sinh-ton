  - "tldr/title/Nói dễ hiểu: thay 'đi loạng choạng, chậm chạp, ngủ nhiều' bằng triệu chứng có trong nguồn: 'đau đầu, lú lẫn, yếu liệt nửa người, thay đổi tính cách, có khi co giật' (quote Huế); hoặc gắn nhãn 'suy ra' cho 'loạng choạng, chậm chạp, ngủ nhiều'."

    note: "Bài tóm tắt báo cáo ca của Khoa Ngoại Thần kinh, Bệnh viện Đại học Y-Dược Huế, 23-07-2021. Bài báo cáo ca/truyền thông của bệnh viện, không phải hướng dẫn chuyên môn."
  - text: "Triệu chứng gồm đau đầu, lú lẫn, yếu liệt nửa người, thay đổi tính cách"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233
    quote: "Triệu chứng thường gặp của MTDMCMT là đau đầu, lú lẫn, yếu liệt nửa người, thay đổi tính cách, thỉnh thoảng có co giật [2]. Các triệu chứng này thường diễn ra từ từ và khó phát hiện."
    verdict: match
    note: "Nguồn còn ghi tỷ lệ: 'đau đầu (89,6%), lú lẫn (71,7%), liệt nửa người (70,5%)'. Nguồn KHÔNG liệt kê 'đi loạng choạng', 'chậm chạp', 'ngủ nhiều' (xem claim riêng)."
  - text: "Chẩn đoán nhờ CT-scan sọ não"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233

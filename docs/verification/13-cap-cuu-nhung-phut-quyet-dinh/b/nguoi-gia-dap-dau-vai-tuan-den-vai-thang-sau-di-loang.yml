    verdict: match
    note: ""
  - text: "Tỷ lệ khoảng 5/100.000 dân, tăng lên 58/100.000 ở nhóm trên 70 tuổi"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233
    quote: "với tỷ lệ khoảng 5/100 000 dân số chung và tăng lên đến 58/100 000 dân đối với nhóm trên 70 tuổi [1]."
    verdict: match
    note: "Số liệu trong bài Huế, dẫn tài liệu tham khảo [1] của họ (không phải số liệu Việt Nam; mục tự nhận ở Ghi chú rằng không có số liệu VN). Số liệu duy nhất đến từ một bài web bệnh viện; chương 13 yêu cầu con số có nguồn gốc hướng dẫn/nghiên cứu có DOI: nên lần theo tham khảo [1]."
  - text: "Nhóm nguy cơ: người cao tuổi đang dùng thuốc chống đông và người nghiện rượu"
    source_url: https://benhvien108.vn/mau-tu-duoi-mang-cung-man-tinh-o-nguoi-cao-tuoi.htm
    quote: "Những người đang điều trị và sử dụng thuốc kháng đông cũng có nguy cơ làm tăng khả năng bị máu tụ dưới màng cứng sau chấn thương đầu do bị rối loạn chức năng đông máu. Đối với người nghiện rượu, chức năng đông máu thường bị rối loạn, não teo nhanh và sớm hơn bình thường."
    verdict: match
    note: "Bài của Khoa Cấp cứu, Bệnh viện TW Quân đội 108, 06/10/2020 (ThS.BS Nguyễn Hải Ghi). Huế còn ghi nguy cơ 'thuốc chống ngưng tập tiểu cầu', sa sút trí tuệ."
  - text: "Nhiều ca không nhớ rõ chấn thương đầu (Ghi chú: 'bài của bệnh viện 108 ghi nhiều ca không có cơ chế chấn thương rõ ràng')"
    source_url: https://benhvien108.vn/mau-tu-duoi-mang-cung-man-tinh-o-nguoi-cao-tuoi.htm
    quote: "Một số trường hợp có cơ chế chấn thương trước đó trong khi một số khác không có cơ chế chấn thương rõ ràng."
    verdict: partial
    note: "Nguồn ghi 'một số', không phải 'nhiều'; và 'không có cơ chế chấn thương rõ ràng' khác 'không nhớ'. Ý 'bệnh nhân thường quên rằng mình bị té ngã' có trong bài Huế: 'bệnh nhân MTDMCMT thường quên rằng mình bị té ngã trước đó dẫn đến việc tiếp cận điều trị khá muộn và dễ nhầm lẫn với bệnh lý khác [7]'. Mục nên dẫn câu Huế cho ý này."
  - text: "Ca 72 tuổi vào viện vì đau đầu liên tục được chụp CT sọ não rồi mổ lấy máu tụ"
    source_url: https://benhvien108.vn/mau-tu-duoi-mang-cung-man-tinh-o-nguoi-cao-tuoi.htm
    quote: "bệnh nhân Nguyễn Văn Đ, 72 tuổi, đang dùng thuốc chống đông điều trị bệnh tim mạch, vào viện ngày 06/9/2020 với triệu chứng đau đầu liên tục, không có chấn thương đầu trong vài tháng gần đây. Sau khi được khám lâm sàng nghi có tổn thương sọ não, bệnh nhân được chụp cắt lớp vi tính sọ não phát hiện khối máu tụ mạn tính lớn và được phẫu thuật lấy máu tụ."
    verdict: match
    note: "Mục bỏ chi tiết 'không có chấn thương đầu trong vài tháng gần đây' và 'đang dùng thuốc chống đông' (có nêu ở nhóm nguy cơ)."
  - text: "Đi loạng choạng, chậm chạp, ngủ nhiều là dấu hiệu cần đi chụp CT (tiêu đề, tldr, Nói dễ hiểu: 'nói chậm, ngủ nhiều')"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233
    quote: "Triệu chứng thường gặp của MTDMCMT là đau đầu, lú lẫn, yếu liệt nửa người, thay đổi tính cách, thỉnh thoảng có co giật"
    verdict: inference
    note: "Hai nguồn đều không liệt kê 'đi loạng choạng', 'chậm chạp', 'ngủ nhiều' hay 'nói chậm'. Có liên quan hợp lý đến lú lẫn/thay đổi tính cách nhưng là diễn đạt lại (suy ra). Triệu chứng đau đầu, lú lẫn, co giật (nguồn) lại không có trong tiêu đề/tldr; ngược lại tiêu đề thiếu 'đau đầu'."
  - text: "Đi khám ngoại thần kinh và chụp CT sọ (step 1)"
    source_url: https://benhvien108.vn/mau-tu-duoi-mang-cung-man-tinh-o-nguoi-cao-tuoi.htm
    quote: "Người có những nguy cơ cao nên đi khám bệnh tại các tuyến bệnh viện có chuyên khoa khi có những chấn thương về đầu dù nhẹ, để có thể được phát hiện kịp thời."
    verdict: partial
    note: "Hướng khuyên có cơ sở, nhưng cả hai nguồn là bài của bệnh viện (không phải hướng dẫn), và không nguồn nào nói mức khẩn cấp: cả 2 ca Huế vào viện vì yếu nửa người (qua khoa cấp cứu), ca 108 vào vì đau đầu liên tục. Mục không phân biệt 'đi khám trong vài ngày' với 'đi cấp cứu ngay' (xem potential_harm)."
  - text: "Khai với bác sĩ nếu đang dùng thuốc chống đông hoặc kháng kết tập tiểu cầu (step 2); Bẫy 3: 'liều và hướng xử trí bị tính sai'"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233
    quote: "sử dụng thuốc chống đông hoặc thuốc chống ngưng tập tiểu cầu [2, 3]"
    verdict: partial
    note: "Nguồn chỉ nêu đây là yếu tố nguy cơ. Câu 'Liều và hướng xử trí bị tính sai' không có trong nguồn (suy ra). Báo cáo ca 2 của Huế còn ghi: 'Bệnh nhân tự dùng Aspirin khả năng để giảm đau đầu, tuy nhiên chúng tôi đã cho bệnh nhân ngưng thuốc vì mục đích điều trị.' Mục không nói 'không tự uống thuốc giảm đau/aspirin' khi đau đầu mới xuất hiện ở người già (không có nguồn nào cấm trực tiếp)."
  - text: "Chi phí: nếu có máu tụ phải mổ thì thêm vài ngày nằm viện và tiền phẫu thuật; nếu không mổ thì phần lớn chi phí dừng ở lần chụp và lần khám lại"
    source_url: https://bvydhue.vn/tin-tuc/thong-tin-y-te/canh-giac-voi-mau-tu-duoi-mang-cung-man-tinh-o-nguoi-lon-tuoi-1233
    quote: "Không có câu tương ứng về chi phí hoặc thời gian nằm viện."
    verdict: not-found
    note: "Không có nguồn; trong Huế, ca 1 mổ sau 5 giờ nhập viện và rút dẫn lưu sau 1 ngày, không nêu 'vài ngày'."

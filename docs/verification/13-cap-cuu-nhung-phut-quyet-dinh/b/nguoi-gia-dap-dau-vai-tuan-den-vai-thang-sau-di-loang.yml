  - "Bẫy 3: bỏ 'Liều và hướng xử trí bị tính sai' (không nguồn) hoặc thay bằng nguồn; có thể thêm 'đừng tự uống aspirin/thuốc giảm đau chờ cho hết đau đầu' chỉ nếu có nguồn (Huế ca 2 chỉ ghi bệnh nhân tự dùng aspirin và được ngưng)."

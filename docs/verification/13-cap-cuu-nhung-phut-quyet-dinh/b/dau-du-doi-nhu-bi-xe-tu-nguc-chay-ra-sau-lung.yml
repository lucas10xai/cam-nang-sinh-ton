validity:
  doc: "Quyết định 636/QĐ-BYT ngày 21/02/2025 (Tài liệu huấn luyện sơ cứu, cấp cứu tại nơi làm việc)"
  in_force: unconfirmed
  effective_from: "2025-02-21"
  amended_by: []
  basis: "Quyết định ghi 'Điều 2. Quyết định này có hiệu lực kể từ ngày ký ban hành.' (text-layer quét). Không có bằng chứng bị sửa/thay thế nhưng chưa tra Công báo/CSDL văn bản. Hai nguồn y tế còn lại (Việt Đức 2019, Vinmec không ghi ngày) không có 'hiệu lực'; chưa có hướng dẫn Bộ Y tế riêng cho lóc tách động mạch chủ (mục tự nhận). Hướng dẫn quốc tế đối chiếu: ACC/AHA 2022 Aortic Disease."
deliberate_vn_deviation:
  - "ACC/AHA 2022: 'if clinically stable, should be considered for transfer to a high-volume aortic center'; mục (theo bài Việt Đức) viết thành lệnh vô điều kiện: 'yêu cầu đưa thẳng ... đừng ghé tuyến gần', áp cho người chưa có chẩn đoán, không nêu điều kiện ổn định huyết động."
potential_harm:
  - "Bước 3/4 bảo người đọc 'yêu cầu đưa thẳng tới bệnh viện mổ được động mạch chủ', 'không ghé tuyến gần' và 'không tự chở': với người sốc/tụt huyết áp/nghi vỡ, quãng đường tới bệnh viện xa có thể làm chậm hồi sức. Nguồn (Việt Đức) chỉ nói về người đã chẩn đoán type A; ACC/AHA nói 'nếu lâm sàng ổn định'. Người đọc phổ thông không tự quyết được điểm đến; nên để tổng đài 115 điều phối."
  - "Bước 2 'nói rõ ... xuống thắt lưng' và Bẫy 3 'tổng đài không xếp tối khẩn' khiến người đọc tin rằng họ phải dùng đúng cụm từ; nếu gọi mà không nhớ cụm, họ có thể trì hoãn hoặc cho rằng cuộc gọi bị đánh giá thấp. Không có nguồn."
suggested_edits:
  - "steps 3/4 và tldr: đổi 'Yêu cầu đưa thẳng tới bệnh viện mổ được động mạch chủ. Đừng ghé tuyến gần' thành 'Mô tả cơn đau cho tổng đài 115 và làm theo điều phối; nếu bác sĩ nghi lóc tách động mạch chủ, họ sẽ chuyển tới nơi mổ được' (dựa quote Việt Đức 'Khi đã chẩn đoán lóc động mạch chủ type A cấp tính, người bệnh cần được chuyển ngay đến các bệnh viện có khả năng phẫu thuật' và ACC/AHA 'if clinically stable')."
  - "Bẫy 2: bỏ 'ghé phòng khám gần nhà ... đúng cái bác sĩ Việt Đức khuyên tránh' hoặc viết lại đúng phạm vi: 'sau khi đã chẩn đoán, tránh chuyển nhiều tuyến'."
  - "Bẫy 3: bỏ ý 'tổng đài không xếp vào nhóm tối khẩn' (không nguồn)."
  - "Tiêu đề/bước 2: bỏ 'xuống thắt lưng' hoặc đổi 'ra sau lưng' (đúng Vinmec: 'xuyên ra sau lưng')."
  - "legal_refs/Nguồn/'Pháp luật Việt Nam': đổi 'mục 4.6' thành 'Phần I, mục 4.2 (Kêu gọi sự trợ giúp ...: Gọi cấp cứu 115)'; hoặc bỏ phần Pháp luật vì không liên quan bước chính."
  - "'Việt Đức đã mổ hơn 250 ca trong gần 10 năm': thêm 'tính đến 2019'."

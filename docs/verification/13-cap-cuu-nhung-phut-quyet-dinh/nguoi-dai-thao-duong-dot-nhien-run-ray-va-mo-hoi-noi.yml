  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Hướng dẫn y tế không có ngày hiệu lực. HCDC cập nhật 15/11/2025; CDC ngày 14-15/05/2024. Không mở được toàn văn QĐ 5481/QĐ-BYT nên không xác nhận hiệu lực/sửa đổi của nó."
deliberate_vn_deviation:
  - "CDC: không nói 'lặp đến hết 2 lần rồi đi viện'; HCDC giới hạn hai lần trước khi đưa tới cơ sở y tế. Lệch theo hướng thận trọng, không nguy hiểm."
  - "CDC liệt kê '4 ounces (½ cup) of juice or regular soda'; HCDC liệt kê 1 cốc 300 ml nước trái cây (nhiều hơn 15 g). Lệch số lượng giữa hai nguồn; mục chọn lẫn cả hai."
potential_harm:
  - "steps[0] '3 viên kẹo' không đảm bảo 15 g carb (kẹo cứng ~4 g/viên, nhãn phải xem) nên có thể điều trị thiếu liều và hạ đường huyết kéo dài; người đọc làm đúng nguyên văn có thể không đạt mục tiêu 15 g."
  - "steps[4] 'Người lú lẫn hoặc mê man: không đút ăn uống gì' mở rộng nguồn ('rối loạn ý thức, hôn mê'): người lú lẫn nhẹ nhưng còn nuốt tốt có thể bị bỏ qua bước cho đường (chậm xử trí)."
suggested_edits:
  - "steps[0]: sửa thành '15 g đường (3 thìa cà phê đường hoặc mật ong pha nước; hoặc nửa cốc nước ép/nước ngọt thường, loại có đường; hoặc viên glucose theo nhãn)' và bỏ '3 viên kẹo' hoặc thêm 'xem nhãn để đủ 15 g'. Dựa quote CDC: '4 ounces (½ cup) of juice or regular (non-diet) soda.' và 'Hard candies, jellybeans, or gumdrops (see food label for how much to eat).'"
  - "Phần Lợi ích: ghi rõ HCDC nói 1 cốc 300 ml nước trái cây có 15 g và CDC nói 1/2 cốc; chọn một con số và nêu nguồn, để steps khớp thân."
  - "steps[4]: thay 'lú lẫn hoặc mê man' thành 'không tỉnh, không nuốt được hoặc co giật' (nguồn: 'rối loạn ý thức, hôn mê'); người lú lẫn nhưng nuốt được thì vẫn cho đường như trên và gọi 115."
  - "Chi phí: nêu cách làm khi không có máy đo (dựa triệu chứng, nhưng vẫn sau 15 phút nếu còn run/lú thì lặp lại) và ghi 'suy ra' vì nguồn chỉ nói kiểm tra bằng đường máu."

  - "Thứ tự gọi cấp cứu và tiêm: thẻ dị ứng TT 51 và NHS để adrenalin trước, gọi cấp cứu sau; mục đảo lại (gọi 115 trước)."
potential_harm:
  - "Title, tldr, steps[1-2]: giới hạn dùng bút ở người 'đã được kê và hướng dẫn'. Người ngoài (người thân, đồng nghiệp) thấy người bị phản vệ có bút nhưng chưa từng được hướng dẫn có thể không dùng, hoặc phải chờ gọi 115, làm chậm adrenalin (nguồn: thuốc quan trọng hàng đầu, tiêm bắp ngay). TT 51 6.3 và NHS cho dùng, hướng dẫn in trên bút."
  - "Không có bước nằm/nâng chân/giữ nằm. NHS: 'Do not stand or walk at any time, even if you feel better'; đứng dậy đột ngột khi huyết áp thấp có thể gây ngừng tuần hoàn. Mục chỉ nói gọi 115, dùng bút, đi theo dõi, không nói người đó phải nằm."
  - "Không có bước dùng bút thứ hai khi chưa đỡ sau 5 phút (NHS) / tiêm nhắc lại 3-5 phút (TT 51). Người đọc làm đúng nguyên văn chỉ tiêm một lần."
  - "steps[0] đặt gọi 115 trước tiêm adrenalin; nếu chỉ có một người, thứ tự này làm chậm adrenalin (NHS, thẻ TT 51 đặt tiêm trước)."

    quote: "Điều 6. Xử trí phản vệ 1. Adrenalin là thuốc quan trọng hàng đầu để tiêm bắp ngay cho người bị phản vệ khi được chẩn đoán phản vệ từ độ II trở lên."
    verdict: match
    note: ""
  - text: "Người có tiền sử phản vệ mang sẵn adrenalin thì chính người bệnh hoặc người khác được phép dùng để tiêm bắp trong trường hợp khẩn cấp khi không có nhân viên y tế (Điều 6 khoản 3)"
    source_url: https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-51-2017-tt-byt-huong-dan-phong-chan-doan-va-xu-tri-phan-ve--128248
    quote: "3. Đối với người có tiền sử phản vệ có sẵn adrenalin mang theo người thì người bệnh hoặc người khác không phải là nhân viên y tế được phép sử dụng thuốc trong trường hợp khẩn cấp để tiêm bắp cấp cứu khi không có nhân viên y tế."
    verdict: match
    note: "Thông tư KHÔNG đòi người dùng phải 'đã được kê và hướng dẫn'; điều kiện là 'người có tiền sử phản vệ có sẵn adrenalin mang theo' và 'không có nhân viên y tế'. Hạn chế 'đã được kê và hướng dẫn' trong title/tldr/steps[1] là điều kiện người soạn thêm (xem claim bên dưới)."
  - text: "Liều tiêm bắp: adrenalin 1 mg = 1 ml = 1 ống; người lớn 0,5 đến 1 ml; nhắc lại 3-5 phút/lần tới khi huyết áp và mạch ổn định (Phụ lục III mục IV)"
    source_url: https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-51-2017-tt-byt-huong-dan-phong-chan-doan-va-xu-tri-phan-ve--128248
    quote: "1. Thuốc adrenalin 1mg = 1ml = 1 ống, tiêm bắp: ... e) Người lớn: 0,5-1 ml (tương đương 1/2-1 ống). ... 3. Tiêm nhắc lại adrenalin liều như khoản 1 mục IV 3-5 phút/lần cho đến khi huyết áp và mạch ổn định."
    verdict: match
    note: "Nguồn còn liệt kê liều trẻ em theo cân nặng (<10 kg 0,2 ml; ~10 kg 0,25 ml; ~20 kg 0,3 ml; >30 kg 0,5 ml); mục chỉ nêu người lớn và vẫn viết 'không có một liều chung cho mọi độ tuổi' ở phần Chi phí (nhất quán, xem internal_checks)."
  - text: "Phải theo dõi ít nhất 24 giờ vì phản vệ có pha thứ hai (Phụ lục III)"
    source_url: https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-51-2017-tt-byt-huong-dan-phong-chan-doan-va-xu-tri-phan-ve--128248
    quote: "Tất cả các người bệnh phản vệ cần được theo dõi ở cơ sở khám bệnh, chữa bệnh đến ít nhất 24 giờ sau khi huyết áp đã ổn định và đề phòng phản vệ pha 2."
    verdict: match
    note: "Cũng Phụ lục III mục I.1: 'Tất cả trường hợp phản vệ phải được phát hiện sớm, xử trí khẩn cấp, kịp thời ngay tại chỗ và theo dõi liên tục ít nhất trong vòng 24 giờ.' NHS: 'You'll usually stay in hospital for around 2 to 12 hours, but you may need to stay longer.' (xem deliberate_vn_deviation)."
  - text: "Thẻ dị ứng ghi 'Tiêm bắp adrenalin ngay lập tức' và 'Gọi 115 hoặc đến cơ sở khám, chữa bệnh gần nhất' (Phụ lục VII)"
    source_url: https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-51-2017-tt-byt-huong-dan-phong-chan-doan-va-xu-tri-phan-ve--128248
    quote: "3) Khi có dấu hiệu phản vệ: “Tiêm bắp adrenalin ngay lập tức” “Gọi 115 hoặc đến cơ sở khám, chữa bệnh gần nhất”"
    verdict: match
    note: "Thứ tự trong thẻ VN: tiêm adrenalin TRƯỚC, gọi 115 SAU."
  - text: "Thứ tự steps: 'Gọi 115 ngay' (bước 1) rồi 'có bút adrenalin thì dùng ngay' (bước 2)"
    source_url: https://www.nhs.uk/conditions/anaphylaxis/
    quote: "Use an adrenaline auto-injector (such as an EpiPen) if you have one – instructions are included on the side of the injector. Call 999 for an ambulance and say that you think you're having an anaphylactic reaction."
    verdict: partial
    note: "NHS và thẻ dị ứng TT 51 đặt tiêm adrenalin trước, gọi cấp cứu sau (một người, hai tay không rảnh). Mục đặt gọi 115 trước. Nếu có người thứ hai thì song song là đúng; với người một mình, thứ tự mục có thể làm chậm adrenalin vài chục giây đến vài phút."
  - text: "Chỉ dùng bút 'đã được kê và hướng dẫn'; chưa được hướng dẫn thì 'làm theo nhân viên cấp cứu' (title, tldr, steps[1-2], Ghi chú)"
    source_url: https://www.nhs.uk/conditions/anaphylaxis/
    quote: "Use an adrenaline auto-injector (such as an EpiPen) if you have one – instructions are included on the side of the injector."
    verdict: mismatch
    note: "NHS (và Điều 6.3 TT 51 cho người có sẵn adrenalin) nói dùng bút nếu có, hướng dẫn in sẵn trên thân bút, không đòi 'đã được hướng dẫn trước'. Tóm tắt VN: có bút thì dùng ngay, đọc hướng dẫn trên bút. Mục tách thành hai nhánh làm người ngoài (người thân, bạn bè) không dám dùng bút của người đang bị phản vệ. Phần 'không tự định liều từ ống thuốc' (ống/lọ, không phải bút) thì hợp lý."
  - text: "Thiếu: nằm, nâng chân, không đứng/đi; tiêm bút thứ hai sau 5 phút nếu chưa đỡ"
    source_url: https://www.nhs.uk/conditions/anaphylaxis/
    quote: "Lie down – you can raise your legs, and if you're struggling to breathe, raise your shoulders or sit up slowly (if you're pregnant, lie on your left side). ... If your symptoms have not improved after 5 minutes, use a 2nd adrenaline auto-injector. Do not stand or walk at any time, even if you feel better."
    verdict: not-found
    note: "Mục không có bước tư thế và không có bước dùng liều thứ hai. TT 51 Phụ lục III cũng: 'Cho người bệnh nằm tại chỗ, đầu thấp, nghiêng trái nếu có nôn' và 'Tiêm nhắc lại ... 3-5 phút/lần'. Tóm tắt VN: nằm (chân cao), không đứng dậy dù thấy đỡ; chưa đỡ sau 5 phút thì dùng bút thứ hai."
  - text: "Bút tự động: tiêm thẳng vào bắp đùi (Bạch Mai)"
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/adrenalin-vu-khi-chong-soc-phan-ve/
    quote: "Với “bút tiêm” và một vài hướng dẫn đơn giản, bất cứ người dân nào cũng có thể sử dụng tiêm thẳng vào bắp đùi khi bệnh nhân bị sốc phản vệ."
    verdict: match
    note: "Bài trên trang Khoa Chấn thương chỉnh hình & Cột sống Bạch Mai, trích GS-TS Nguyễn Gia Bình. Câu này còn nói 'bất cứ người dân nào cũng có thể sử dụng' với bút, mâu thuẫn với điều kiện 'đã được kê và hướng dẫn' của mục. Bài không phải hướng dẫn chính thức Bộ Y tế; vị trí 'bắp đùi' chỉ đối chiếu được với bài này, NHS chỉ nói theo hướng dẫn in trên bút."
  - text: "Không lấy thuốc uống thay adrenalin; không chờ tụt huyết áp, ngất hoặc mẩn tự lặn"
    source_url: https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-51-2017-tt-byt-huong-dan-phong-chan-doan-va-xu-tri-phan-ve--128248
    quote: "Adrenalin là thuốc thiết yếu, quan trọng hàng đầu cứu sống người bệnh bị phản vệ, phải được tiêm bắp ngay khi chẩn đoán phản vệ từ độ II trở lên."
    verdict: inference
    note: "Nguồn chỉ nói adrenalin tiêm bắp ngay khi từ độ II; 'không thay bằng thuốc uống' và 'đừng chờ mẩn tự lặn' là suy ra (hợp lý). Lưu ý thông tư cho độ I (nhẹ) dùng methylprednisolon hoặc diphenhydramin: 'Sử dụng thuốc methylprednisolon hoặc diphenhydramin uống hoặc tiêm tùy tình trạng người bệnh' (Phụ lục III mục II), nên 'không thuốc uống' đúng cho độ II+ chứ không tuyệt đối."
  - text: "Triệu chứng nghi phản vệ: đột ngột khó thở, sưng họng hoặc choáng; có thể không nổi mẩn"
    source_url: https://www.nhs.uk/conditions/anaphylaxis/
    quote: "swelling of your throat and tongue; difficulty breathing or breathing very fast; feeling faint, dizzy or fainting ... You may also have a rash that's swollen, raised or itchy."

suggested_edits:
  - "Lợi ích, đoạn “Bạn vào can một nhóm ... rất khó chứng minh mình chỉ can”: đổi thành “Điều 22 cho phép chống trả cần thiết để bảo vệ người khác, nhưng trong một vụ ẩu đả nhiều người, việc chứng minh mình chỉ can ngăn là khó” và gắn nhãn suy ra; dựa vào quote Điều 22 khoản 1 (“của người khác”)."
  - "Ghi chú Bẫy 1: bỏ khẳng định “bị tính như một bên tham gia”, thay bằng “có thể bị hiểu là xô xát, và người can ngăn tay không dễ bị thương”, gắn nhãn suy ra."
  - "Ghi chú Bẫy 3: bỏ cụm “tình tiết nặng nhất mà người ta sẽ nhớ” hoặc đánh dấu là nhận định; giữ lời khuyên không nhặt vũ khí."
  - "Pháp luật VN: thêm dòng Điều 22 khoản 1 gồm cả bảo vệ “của người khác”, để người đọc không hiểu là cấm giúp người bị đánh."
  - "steps[2]: ghi rõ đây là lời khuyên thực hành (không nguồn) hoặc bỏ phần “hô to”."

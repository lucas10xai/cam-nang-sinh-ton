  - "legal_refs và Pháp luật VN: thay NĐ 98/2023 bằng Nghị định 368/2026/NĐ-CP (Điều 3 khoản 4, Điều 52, Điều 54 khoản 1 điểm h) hoặc ghi rõ cả hai; cập nhật url sang văn bản 368 trên Công báo/vbpl. Cập nhật Điều 52, 85 Luật theo bản hợp nhất 115/VBHN-VPQH (nội dung hai điều không đổi)."
  - "Điều 52 Luật: thêm điều kiện “thành tích ... có tác dụng động viên, giáo dục, nêu gương trong phạm vi quản lý của Bộ, ban, ngành, tỉnh hoặc toàn quốc”; đổi tldr “Khen thưởng ... Huân chương Dũng cảm thưởng 4,5 lần lương cơ sở” thành “nếu được tặng Huân chương Dũng cảm (chỉ cho thành tích đủ lớn) thì thưởng 4,5 lần lương cơ sở”; các mức thấp hơn (Bằng khen, Giấy khen) có mức riêng."
  - "Điều 3 khoản 4: sửa “Đây được gọi là thành tích đặc biệt xuất sắc đột xuất” thành “Khi đạt mức đặc biệt xuất sắc thì gọi là ...”."
  - "Ghi chú Bẫy 2: sửa. Dân thường bị thương tỷ lệ tổn thương cơ thể ≥21% khi đặc biệt dũng cảm cứu người, là tấm gương tiêu biểu, có thể được công nhận “người hưởng chính sách như thương binh” (Pháp lệnh 02/2020/UBTVQH14 Điều 23 khoản 1 điểm k, khoản 2; đã sửa bởi Pháp lệnh 05/2026/UBTVQH16). Cần đối chiếu bản gốc vbpl.vn."
  - "steps[1], Chi phí: thêm nguồn cho BHYT chi trả (Luật BHYT) và bồi thường thiệt hại do người khác gây ra (Bộ luật Dân sự) hoặc gắn nhãn “chưa có nguồn”."
  - "steps[3]/Bẫy 1: viết “người đứng đầu cơ quan, tổ chức, đơn vị đề nghị khen thưởng ngay sau khi có thành tích (NĐ 98 Điều 40 khoản 3); trên thực tế nhờ UBND xã/phường hoặc cơ quan chuyển tờ trình lên tỉnh” và gắn nhãn suy ra."
  - "Điều 7 khoản 2 LKBCB: thêm vế “trừ trường hợp quy định tại Điều 40”, hoặc bỏ dòng này vì không liên quan người cứu người."

validity:
  doc: "Quyết định 1622/QĐ-BYT ngày 08/5/2014 (Hướng dẫn giám sát, phòng chống bệnh dại trên người), qua bài Viện Pasteur TP.HCM đăng 04/11/2024"
  in_force: unconfirmed
  effective_from: "2014-05-08"
  amended_by: []
  basis: "Không mở được bản ký QĐ 1622 (tìm kiếm chỉ ra thuvienphapluat/luatvietnam, không mở được trạng thái hiệu lực). Bài Pasteur 2024 vẫn dẫn QĐ 1622 là tài liệu tham khảo và dùng bảng chỉ định của nó, là dấu hiệu còn áp dụng nhưng không đủ để kết luận in_force. Hướng quốc tế: WHO Rabies fact sheet (truy cập 2026-11-08) cùng nội dung rửa 15 phút, tiêm ngay, RIG khi độ III."
deliberate_vn_deviation: []
potential_harm:
  - "Step 3 và title chỉ hướng đến 'cơ sở tiêm chủng có vắc xin dại'. Với vết cắn sâu/nhiều vết/đầu mặt cổ/đầu chi, sinh dục cần thêm huyết thanh kháng dại (chính mục nêu ở Pháp luật) mà nhiều cơ sở tiêm chủng không có; mục không bảo người đọc nói rõ vết thương và đến cơ sở có huyết thanh, nên có thể mất thời gian đi vòng."
  - "Mục chỉ nói 'chó, mèo'. Bài nguồn ghi 'Các vết thương do động vật hoang dã cắn cần xử lý và điều trị như đối với động vật bị bệnh dại' (dơi, khỉ, cầy...). Thiếu điều kiện này khiến người bị khỉ/dơi cắn có thể không đi tiêm."
suggested_edits:
  - "Ghi chú, Bẫy 3: xóa 'đắp lá, bôi nước mắm' hoặc ghi rõ đó là suy ra; sửa câu 'Hướng dẫn xếp cả ba việc vào nhóm phải tránh' thành 'Hướng dẫn nêu: không làm dập nát thêm vết thương; tránh khâu kín ngay'. Dựa vào quote Pasteur 'Không làm dập nát thêm vết thương ... tránh khâu kín ngay vết thương'."
  - "Steps/Pháp luật: thêm 'vết cắn sâu, nhiều vết, ở đầu mặt cổ hoặc đầu chi, sinh dục: đến cơ sở có huyết thanh kháng dại (bệnh viện/viện Pasteur)'; dựa vào bảng chỉ định Pasteur."
  - "Thêm dòng: động vật hoang dã (dơi, khỉ, cầy...) cắn xử trí như động vật dại; hỏi bác sĩ về tiêm phòng uốn ván và kháng sinh. Dựa vào 'Các vết thương do động vật hoang dã cắn cần xử lý và điều trị như đối với động vật bị bệnh dại' và 'Tùy trường hợp cụ thể có thể sử dụng kháng sinh và tiêm phòng uốn ván'."
  - "Thêm nguồn WHO Rabies fact sheet vào mục Nguồn; mở và dẫn bản ký QĐ 1622 (vbpl/Công báo) hoặc ghi rõ 'theo Viện Pasteur TP.HCM' thay vì gán cho QĐ."
  - "Chuyển 'tiêm ngay trong ngày' thành 'tiêm càng sớm càng tốt (nên ngay trong ngày)'."

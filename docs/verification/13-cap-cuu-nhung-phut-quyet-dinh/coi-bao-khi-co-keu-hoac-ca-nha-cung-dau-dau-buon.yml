potential_harm:
  - "steps[3] 'Người bất tỉnh thì đặt nằm nghiêng và chờ xe cấp cứu' không có bước kiểm tra thở và CPR; người ngộ độc CO bất tỉnh có thể ngừng thở/ngừng tim, làm đúng nguyên văn là chờ trong khi cần ép tim."
  - "steps[0]-[1] 'Ra tới chỗ thoáng mới gọi 115' áp dụng cho người cứu đứng cạnh nạn nhân bất tỉnh trong phòng đầy CO: nếu chỉ có một người, việc kéo người ra mà chưa gọi 115 có thể chậm cứu; và mục không cảnh báo người cứu tự hít CO khi quay lại kéo nạn nhân (khuyến cáo là hít sâu, mở cửa, kéo ra và/hoặc gọi 115 ngoài nhà)."
suggested_edits:
  - "legal_refs[0] và mục 'Pháp luật Việt Nam': bỏ dẫn 'Phụ lục VII TT 51/2017' làm căn cứ cho số 115 (đó là mẫu thẻ dị ứng). Thay bằng nguồn trực tiếp về số 115 (văn bản của Bộ Y tế/Chính phủ về số điện thoại cấp cứu 115) hoặc xóa legal_refs và chỉ dẫn BV Nhi TW/HCDC 'Gọi cấp cứu 115'."
  - "steps[3]: 'Người bất tỉnh: gọi 115 ngay, kiểm tra thở; nếu không thở bình thường thì ép tim (hồi sức tim phổi) tại chỗ; nếu thở thì đặt nằm nghiêng'. Dựa Poison Control: 'If the individual collapses ... can't be awakened: Call 911 IMMEDIATELY.'"
  - "Thêm vào Nguồn: Poison Control 'First aid: Act fast!' (https://www.poison.org/first-aid-for-poisonings) hoặc CDC; gắn nhãn 'suy ra' cho steps[0..2] vì hai nguồn VN không nêu các bước này."
  - "tldr: đổi 'xử trí lần đầu trong 6 giờ' thành 'đến cơ sở y tế điều trị càng sớm càng tốt, kết quả tốt nhất khi điều trị lần đầu trong 6 giờ (BV Bỏng QG)'."

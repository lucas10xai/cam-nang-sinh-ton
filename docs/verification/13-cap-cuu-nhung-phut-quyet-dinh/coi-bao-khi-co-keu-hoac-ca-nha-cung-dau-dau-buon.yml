  in_force: unconfirmed
  effective_from: "2018-02-15"
  amended_by: []
  basis: "Bản vnras.com ghi Điều 7: 'Thông tư này có hiệu lực từ ngày 15 tháng 02 năm 2018' và thay thế TT 08/1999/TT-BYT. Không đọc được vbpl.vn (chỉ khung) hay Công báo nên không xác nhận được có bị sửa/thay thế sau này không; theo giao thức không kết luận còn hiệu lực. Tuy vậy, quan trọng hơn là Phụ lục VII không dùng để dẫn số 115 cấp cứu."

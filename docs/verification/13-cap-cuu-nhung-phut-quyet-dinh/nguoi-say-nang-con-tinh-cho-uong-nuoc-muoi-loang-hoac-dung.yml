claims:
  - text: "Nếu uống được nước: từng ngụm nhỏ nước mát, tốt nhất có muối khoáng như Oresol pha đúng liều"
    source_url: https://baochinhphu.vn/cach-phong-tranh-va-xu-tri-khi-say-nang-dot-quy-do-nong-10223052317263386.htm
    verdict: match
    quote: Nếu nạn nhân uống được nước, cho uống từng ngụm nhỏ nước mát. Tốt nhất là uống nước có bổ sung muối và khoáng chất như nước Oresol pha đúng liều lượng theo hướng dẫn sử dụng.
    note: Nguồn thuộc phần 'Mức độ nhẹ'. Không nói 'nước mát pha chút muối' tự pha.
  - text: "108: uống nước pha chút muối hoặc oresol, tránh nước ngọt có ga và đồ uống năng lượng"
    source_url: https://benhvien108.vn/%E2%80%9C-say-nang-say-nong%E2%80%9D-van-la-nhung-van-de-cap-thiet-trong-mua-he.htm
    verdict: partial
    quote: Có thể ống nước có pha một chút muối hoặc uống dung dịch oresol, nước trái cây, tránh xa nước ngọt có ga, đồ uống năng lượng.
    note: Câu nằm ở phần DỰ PHÒNG (uống khi nắng nóng/lao động), không phải xử trí người đang say nắng; còn 'nước trái cây' mà mục bỏ. Tiêu đề 'nước ngọt đậm' ≠ 'nước ngọt có ga/đồ uống năng lượng'.
  - text: "Bạch Mai: chỉ cho uống dung dịch muối NaCl 0,1% ở lả nhiệt nhẹ; nặng thì truyền dịch"
    source_url: https://bachmai.gov.vn/bai-viet/say-nang-va-benh-ly-than-nhiet?id=aa64d8a6-5900-e87e-e5d4-b34b5c0b70b9
    verdict: match
    quote: Nếu nhẹ hơn, uống dịch muối Natriclorua 0,1%, nếu nặng bn tụt HA tư thế hoặc nhiều triệu chứng nặng nên truyền dịch qua đường TM
    note: Chỉ áp cho LẢ NHIỆT (heat exhaustion) tại khoa Cấp cứu, không phải sơ cứu tại hiện trường và không phải sốc nhiệt (= 'say nắng' theo chính bài này). Mục không đưa liều tự pha nào.
  - text: "Bạch Mai A9 (báo SKĐS): 600–800 ml trước vận động, 200 ml mỗi 20 phút"
    source_url: https://suckhoedoisong.vn/nang-nhu-do-lua-bac-si-bach-mai-chi-cach-nhan-biet-som-say-nang-de-tranh-nguy-hiem-tinh-mang-169260525161204489.htm
    verdict: match
    quote: Uống bù đủ nước, điện giải trước - trong - sau khi vận động ngoài trời nắng nóng vào giữa trưa. Tối thiểu 600-800ml trước vận động, 200ml mỗi 20 phút dù không khát.
    note: Khuyến cáo PHÒNG NGỪA khi vận động, không phải liều xử trí.
  - text: Không uống rượu (giãn mạch, mất nước)
    source_url: https://suckhoedoisong.vn/nang-nhu-do-lua-bac-si-bach-mai-chi-cach-nhan-biet-som-say-nang-de-tranh-nguy-hiem-tinh-mang-169260525161204489.htm
    verdict: match
    quote: Không uống rượu vì nó gây giãn mạch và dễ bị mất nước nếu ở lâu ngoài trời nắng nóng.
    note: Cũng thuộc phần phòng ngừa.
  - text: Cho uống nước mát pha chút muối (steps[1], tldr, tiêu đề 'nước muối loãng')
    source_url: https://suckhoedoisong.vn/nang-nhu-do-lua-bac-si-bach-mai-chi-cach-nhan-biet-som-say-nang-de-tranh-nguy-hiem-tinh-mang-169260525161204489.htm
    verdict: mismatch
    quote: Tuyệt đối không dùng thuốc hạ sốt, không cho uống nước đá lạnh, không tự pha nước muối hay uống đồ thể thao không rõ thành phần.
    note: Nguồn mà mục này cite (BS Nguyễn Minh Hiếu, Bạch Mai A9) cấm 'tự pha nước muối'. Nguồn duy nhất cho 'chút muối' là bài 108 phòng ngừa; không nguồn nào cho tỉ lệ để người dân pha.
  - text: "Nếu còn tỉnh: oresol pha đúng hướng dẫn (trong giờ đầu); không có thì nước trắng/mát/nước hoa quả"
    source_url: https://suckhoedoisong.vn/nang-nhu-do-lua-bac-si-bach-mai-chi-cach-nhan-biet-som-say-nang-de-tranh-nguy-hiem-tinh-mang-169260525161204489.htm
    verdict: match
    quote: Nếu người bệnh còn tỉnh, cho uống nước oresol pha đúng hướng dẫn (trong giờ đầu), nếu không có thì cho uống nước trắng, nước mát hoặc nước hoa quả.
    note: Nguồn cùng bài cho 'nước trắng', mục thay bằng 'nước pha chút muối'.
  - text: Không uống ừng ực; ừng ực → nôn, sặc
    source_url: https://baochinhphu.vn/cach-phong-tranh-va-xu-tri-khi-say-nang-dot-quy-do-nong-10223052317263386.htm
    verdict: inference
    note: Nguồn chỉ nói 'từng ngụm nhỏ'. Không nguồn nào nêu 'ừng ực → nôn/sặc'. Cũng không nguồn cho 'vài nghìn đồng/gói' (Chi phí).
  - text: Lú lẫn hoặc nôn liên tục thì đưa tới cơ sở y tế
    source_url: https://baochinhphu.vn/cach-phong-tranh-va-xu-tri-khi-say-nang-dot-quy-do-nong-10223052317263386.htm
    verdict: partial
    quote: Nếu nạn nhân có các biểu hiện ở mức độ nặng, cần gọi ngay cấp cứu 115 hoặc nhanh chóng đưa nạn nhân đến cơ sở y tế gần nhất.
    note: Nguồn xếp nôn/lú lẫn/co giật vào mức nặng → gọi 115; mục chỉ nói 'đưa tới cơ sở y tế'.
internal_checks:
  - issue: Tiêu đề/tldr nói 'say nắng' (= sốc nhiệt theo Bạch Mai) nhưng liều/cách uống dẫn từ bài về LẢ NHIỆT nhẹ và phòng ngừa. Người sốc nhiệt cần làm mát + 115, không phải ưu tiên uống.
    severity: error
  - issue: "Mục mâu thuẫn với nguồn đã cite: SKĐS 'không tự pha nước muối' vs steps 'nước mát pha chút muối'; Bẫy 1 của chính mục cảnh báo pha sai liều gây tăng natri máu nhưng steps cho pha 'chút muối' không định lượng."
    severity: error
  - issue: Mục 23 không có bước làm mát và không nhắc 115 (mục 22 cùng chương có); mục 22 dặn lú lẫn → 115, mục 23 dặn lú lẫn → 'cơ sở y tế'.
    severity: warn
  - issue: Nguồn y tế thứ tư là báo (SKĐS) — EDITORIAL §3.5 không chấp nhận báo làm nguồn duy nhất cho con số; 600–800/200 ml không phải liều xử trí.
    severity: warn
  - issue: Ghi chú nói mốc 0,1%, 600–800 ml, 200 ml 'đọc được' nhưng steps/tldr không dùng số nào; số 113/115 không xuất hiện. Không số nào trong steps nằm ngoài thân.
    severity: warn
validity:
  doc: Báo CP/Bộ Y tế, BV 108, Bạch Mai (2014), SKĐS (05/2026) — hướng dẫn chuyên môn
  in_force: unconfirmed
  effective_from: null
  amended_by: []
  basis: "Mở được 4 trang nguồn (HTTP 200). NHS (heat exhaustion): 'Give them plenty of water to drink – you can also give them an isotonic sports drink or oral rehydration powder that you mix with water' — NHS cho phép đồ uống đẳng trương, ngược với SKĐS/108. CDC trả 403."
deliberate_vn_deviation:
  - Nguồn VN cho 'nước pha chút muối', Bạch Mai A9 cấm 'tự pha nước muối'; NHS khuyến nghị oral rehydration powder/isotonic drink cho lả nhiệt và gọi 999 nếu còn mệt sau 30 phút. Không nguồn nào quy định tỉ lệ muối cho người dân tự pha.
potential_harm:
  - "'Nước mát pha chút muối' tự pha, không định lượng (steps[1], tldr, tiêu đề) — ngược lời dặn 'không tự pha nước muối' của nguồn cite; sai nồng độ có nguy cơ tăng natri máu/nôn, nhất là trẻ nhỏ và người già (Bẫy 1 của mục thừa nhận)."
  - "Xếp 'còn tỉnh → cho uống' làm hành động chính cho 'say nắng' mà không có bước làm mát, không có ngưỡng gọi 115 và không có mốc 'còn mệt sau ~30 phút → gọi cấp cứu' (NHS; Bộ Y tế: nôn/buồn nôn là mức nặng). Có thể làm chậm làm mát/cấp cứu sốc nhiệt."
  - "Lú lẫn/nôn liên tục: 'đưa tới cơ sở y tế' không nói gọi 115, không nói không cho uống/nằm nghiêng/kiểm tra thở."
suggested_edits:
  - Bỏ 'nước muối loãng / pha chút muối' khỏi tiêu đề, tldr, steps; chỉ giữ 'dung dịch bù nước (Oresol) pha đúng liều theo tờ hướng dẫn' và 'nước mát' (đúng chữ báo CP/SKĐS).
  - "Đổi phạm vi mục thành 'lả nhiệt/say nóng nhẹ còn tỉnh' hoặc nói rõ: da nóng, không ra mồ hôi, đau đầu dữ dội, nôn → làm mát + gọi 115 (xem mục 22)."
  - "Thêm mốc: 'còn mệt sau khoảng 30 phút nghỉ, làm mát và uống → gọi cấp cứu' (NHS); bỏ số 600–800/200 ml khỏi phần xử trí (là phòng ngừa)."
  - "steps[3]: 'lú lẫn, nôn liên tục, co giật, ngất → gọi 115' (theo báo CP/Bộ Y tế), đồng bộ mục 22."
  - Thay nguồn báo SKĐS bằng nguồn Bộ Y tế/BV hoặc chỉ dùng cho câu 'không uống rượu'.

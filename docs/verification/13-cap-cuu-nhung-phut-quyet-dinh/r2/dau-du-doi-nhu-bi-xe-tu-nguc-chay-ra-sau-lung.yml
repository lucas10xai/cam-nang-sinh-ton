suggested_edits:
  - "Thêm hoặc thay nguồn lâm sàng bằng hướng dẫn chính thống (ví dụ 2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease hoặc ESC) cho: đau dữ dội đột ngột xé ngực/lưng là dấu hiệu cảnh báo cần cấp cứu; nếu không dẫn được, giữ nguyên mức B và ghi rõ nguồn là truyền thông bệnh viện."
  - "Step 2 và Bẫy 3: thêm nhãn '(lời khuyên thực hành, không phải chữ của nguồn)' và thêm chữ 'đột ngột' vào mô tả ('đột ngột đau dữ dội như bị xé') để tránh hiểu là phải đau nhiều giờ mới gọi."
  - "Step 4 và Bẫy 2: gắn nhãn 'suy ra' cho 'không tự chở bằng xe máy'; hoặc thêm quote QĐ 5332 mục 6.2.1 ('Không khuyến cáo bệnh nhân tự động lái (đi) xe đến bệnh viện', áp dụng cho đau ngực nghi hội chứng vành cấp) kèm ghi chú đây là mục khác."
  - "Ghi chú: đổi 'Bộ Y tế chưa ban hành hướng dẫn riêng ... có số hiệu để dẫn' thành 'chưa dẫn được hướng dẫn riêng của Bộ Y tế'."
  - "Thêm một câu cảnh báo: không tự cho aspirin khi đau ngực nghi lóc tách (chưa rõ nguyên nhân) và dẫn ERC 2021 ('Do not administer aspirin to adults with chest pain of unclear or traumatic aetiology') vì người đọc có thể vừa đọc mục 07 về aspirin."

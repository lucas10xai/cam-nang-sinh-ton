  - text: "Sưng to bất thường một chân, nặng chân, đau chân: đến bác sĩ chuyên khoa, có thể làm siêu âm Doppler nếu có điều kiện"
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/thuyen-tac-phoi-va-nhung-van-de-dieu-tri/
    quote: 90% thuyên tắc phổi bắt nguồn từ huyết khối tĩnh mạch sâu, do vậy nên đến bác sĩ chuyên khoa khám nếu thấy dấu hiệu sưng to bất thường một chân, nặng chân, đau chân, cũng có thể đến bệnh viện lớn để làm siêu âm Doppler nếu có điều kiện.

    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: If a doctor thinks you have DVT (deep vein thrombosis), you should be referred to hospital within 24 hours for an ultrasound scan.
    verdict: match
    note: "Trang NHS xem lại 30/04/2026. VN: bác sĩ nghi DVT thì chuyển siêu âm trong 24 giờ."

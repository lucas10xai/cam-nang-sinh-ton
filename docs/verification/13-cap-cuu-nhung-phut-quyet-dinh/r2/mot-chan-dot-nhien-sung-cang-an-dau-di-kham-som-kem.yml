    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: "Call 999 or go to A&E if: You have symptoms of DVT (deep vein thrombosis), such as pain and swelling, and: feel short of breath have chest pain"
    verdict: match
    note: 'Tiếp theo: "Do not drive to A&E. Ask someone to drive you or call 999 and ask for an ambulance." (cùng trang). VN: gọi cấp cứu khi DVT kèm khó thở/đau ngực; không tự lái xe.'
  - text: '"Đi khám ngay trong ngày" khi một chân sưng (tiêu đề, tldr, step 1)'
    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: "Ask for an urgent GP appointment or get help from NHS 111 if: you think you have DVT (deep vein thrombosis)"
    verdict: partial
    note: NHS nói "khám khẩn / gọi 111", không nói "trong ngày". "Trong ngày" là diễn giải của người soạn, mục không gắn nhãn "suy ra". Mốc 24 giờ của NHS là cho siêu âm sau khi bác sĩ nghi, không phải cho lần khám đầu.
  - text: Triệu chứng "sưng một bên, căng và ấn đau" (tiêu đề)
    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: swelling in 1 leg (rarely both legs)
    verdict: partial
    note: 'NHS: đau kiểu giật (throbbing) ở bắp chân/đùi, sưng một chân, da đỏ/xanh/sẫm, tĩnh mạch nổi. Không có chữ "căng" hay "ấn đau" ở NHS hay Bạch Mai; Bạch Mai: "tức, đau dọc theo đường đi của tĩnh mạch". Tiêu đề dùng từ chưa có nguồn.'
  - text: Ngất cũng nên coi là nguy hiểm (mục gắn nhãn "suy ra")
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/thuyen-tac-phoi-va-nhung-van-de-dieu-tri/
    quote: Một số trường hợp thuyên tắc phổi nặng có thể gây shock, bất tỉnh, ngừng tim hay tử vong.
    verdict: inference
    note: 'Nhãn "suy ra" trung thực và có cơ sở. Nhưng câu Ghi chú "Nguồn chỉ nêu khó thở và đau ngực" sai nhẹ: bài Bạch Mai có nêu "bất tỉnh".'
  - text: "Không tự uống thuốc chống đông: thuốc này do bác sĩ chỉ định (step 4)"
    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: DVT (deep vein thrombosis) is treated with blood-thinning medicines.
    verdict: inference
    note: Nguồn chỉ nói DVT được điều trị bằng thuốc chống đông; không có câu nào cấm tự dùng. Step 4 không gắn nhãn "suy ra", trong khi step 3 có nhãn. Lời khuyên hợp lý nhưng chưa có nguồn.
  - text: Tránh xoa bóp, giác hơi, lăn chân vùng sưng (mục gắn nhãn "suy ra, chưa có nguồn")
    source_url: https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/
    quote: Hầu như không có nguyên văn trong NHS DVT, Bạch Mai hay QĐ 3908
    verdict: inference
    note: 'Đã tìm "massage"/"xoa bóp" trong NHS DVT và hai bài Bạch Mai: không thấy. Nhãn trung thực.'

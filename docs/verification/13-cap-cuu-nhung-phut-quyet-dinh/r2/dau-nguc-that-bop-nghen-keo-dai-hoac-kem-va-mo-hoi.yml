  basis: "QĐ 5332 là tài liệu chuyên môn; tìm trên web chỉ thấy các bản đăng lại (thuvienphapluat, bệnh viện), không thấy văn bản thay thế nhưng không có nguồn chính thức xác nhận còn hiệu lực hay chưa có bản mới. ERC 2021 sơ cứu: chưa kiểm có bản ERC mới hơn cho phần sơ cứu aspirin."

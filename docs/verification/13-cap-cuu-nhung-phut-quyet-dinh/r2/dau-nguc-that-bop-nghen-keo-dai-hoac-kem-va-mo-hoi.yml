suggested_edits:
  - "Mục Lợi ích/Truyền thông và Bẫy 1: thêm QĐ 5332 mục 6.2.1 làm nguồn chính cho 'không tự lái xe' ('Không khuyến cáo bệnh nhân tự động lái (đi) xe đến bệnh viện'); giữ bài Phú Lâm là nguồn phụ."
  - "Step 3: đổi 'không tự uống thuốc giảm đau hay thuốc dạ dày' thành 'không tự uống thuốc giảm đau' (đúng chữ Phú Lâm), hoặc gắn nhãn '(thuốc dạ dày: suy ra)'."
  - "Bẫy 3: thêm nhãn '(suy ra từ y văn, không phải chữ của nguồn trên)' hoặc dẫn một hướng dẫn (ESC/AHA/Bộ Y tế) nêu biểu hiện không điển hình ở người già, đái tháo đường; nếu không dẫn được thì bỏ vế 'ở người già và người đái tháo đường'."
  - "Mục Aspirin: thêm một câu 'ERC: không cho nếu dị ứng aspirin, hen nặng hoặc có xuất huyết tiêu hóa' (quote: 'Do not administer aspirin to adults with a known allergy to aspirin or contraindications such as severe asthma or known gastrointestinal bleeding') để giải thích vì sao phải hỏi 115."

    severity: error
  - issue: 'Ghi chú "Mục để mức B", "Chưa thấy thống kê Việt Nam nào…": ngôn ngữ nội bộ về quy trình bằng chứng lọt vào thân; nên rút gọn.'
    severity: warn
  - issue: Step 1 bảo đưa mọi người ra ngoài "kể cả người còn tỉnh" nhưng không nói gì về người đã bất tỉnh trong nhà (ai kéo ra, người cứu có nguy cơ bị ngộ độc; NHS/Poison Control không đưa ra hướng dẫn kéo người). Nên thêm điều kiện an toàn hoặc ghi rõ nguồn không nói.
    severity: warn
  - issue: Số trong tldr/steps (chỉ có 115) khớp thân; không mâu thuẫn số liệu. Thiếu 115 trong nguồn Bộ Y tế đã được tự nêu. legal_refs rỗng.
    severity: warn

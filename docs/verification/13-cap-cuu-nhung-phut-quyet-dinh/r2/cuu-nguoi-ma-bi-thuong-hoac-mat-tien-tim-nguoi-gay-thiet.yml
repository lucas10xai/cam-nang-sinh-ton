  - "Xóa mọi ghi chú việc cần làm cho người soạn khỏi thân: 'mục này chưa có nguồn pháp lý ...', 'cần nguồn', 'chưa xác nhận được', 'phép tính của người soạn' (Chi phí, Lợi ích, Pháp luật Việt Nam, Ghi chú). Thay bằng câu trung tính: 'Mục này chưa nêu căn cứ pháp lý cho việc dùng bảo hiểm y tế và đòi bồi thường; hãy hỏi cơ sở y tế và cơ quan công an' hoặc bỏ hẳn. Dựa vào kết quả kiểm: mọi 'cần nguồn' về NĐ 368 đã có nguồn."
  - "Mục 'Chế độ như thương binh': nêu rõ thời điểm. Ví dụ: 'Đến hết 31/12/2026, Pháp lệnh 02/2020 áp dụng điểm k Điều 23: người không thuộc quân đội/công an bị thương từ 21% trở lên khi đặc biệt dũng cảm cứu người ... là tấm gương có ý nghĩa tôn vinh, giáo dục, lan tỏa rộng rãi trong xã hội thì được xem xét công nhận hưởng chính sách như thương binh. Từ 01/01/2027, Điều 23 sửa đổi theo Pháp lệnh 05/2026/UBTVQH16 ghi điểm h: dũng cảm cứu người, cứu tài sản ... (bỏ điều kiện đặc biệt/tấm gương)'. Dựa vào quote bản hợp nhất 123/2026 và footnote 22."
  - "Thay mọi dẫn NĐ 98/2023 (Điều 3 khoản 4, Điều 40 khoản 3, Điều 55 khoản 1 điểm h) bằng NĐ 368/2026: Điều 3 khoản 4; Điều 41 khoản 3; Điều 54 khoản 1 điểm h. Xóa NĐ 98/2023 khỏi legal_refs và mục Nguồn. Thêm URL congbao.chinhphu.vn cho NĐ 368."
  - "Điều 61 khoản 7 Luật KCB: sửa thành 'Ngân sách nhà nước bảo đảm kinh phí chi phí vận chuyển và sử dụng dịch vụ khám bệnh, chữa bệnh trong quá trình vận chuyển cấp cứu đối với trường hợp tai nạn... (Điều 61 khoản 7 điểm a; Chính phủ quy định chi tiết)'; bỏ 'không phải viện phí điều trị' hoặc gắn nhãn 'suy ra'."
  - "Luật TĐKT: đổi URL nguồn sang bản hợp nhất 115/VBHN-VPQH (https://cdn.thuvienphapluat.vn/uploads/tintuc/2026/06/06/2026_313_115_VBHN-VPQH.pdf là bản sao Công báo 313; ưu tiên bản gốc tại congbao.chinhphu.vn) vì Luật đã sửa năm 2026."

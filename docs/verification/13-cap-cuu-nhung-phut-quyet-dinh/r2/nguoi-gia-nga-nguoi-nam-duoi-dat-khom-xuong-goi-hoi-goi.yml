claims:
  - text: Gọi cấp cứu nếu người ngã có thể bị thương ở đầu, lưng, cổ hoặc hông, hoặc không đứng dậy được
    source_url: https://www.nhs.uk/conditions/falls/
    quote: "You or someone else has fallen and: may have injured the head, back, neck or hip; cannot get up"
    verdict: match
    note: 'NHS "Falls", rà soát 06/03/2025, mục "Immediate action required: Call 999 if". NHS không nêu "khung chậu"; AHA 2024 có (xem dưới).'
  - text: Có thể cẩn thận giúp đứng dậy khi họ làm được, đừng tự nhấc
    source_url: https://www.nhs.uk/conditions/falls/
    quote: If someone else has fallen, keep them comfortable and warm. Carefully help them get up if they can, but do not try to lift them yourself.
    verdict: match
    note: ""
  - text: "Người bị thương còn đáp ứng, thở bình thường, tính chất chấn thương gợi ý cổ/lưng/hông/khung chậu: để nguyên tư thế, trừ khi nơi đó không an toàn"
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: If a person has been injured, is responsive, and is breathing normally and the nature of the injury suggests a neck, back, hip, or pelvic injury, the person should be left in the position in which they were found to avoid potential further injury unless the area is unsafe.
    verdict: match
    note: AHA/Red Cross 2024 First Aid, COR 1 LOE C-EO. AHA chặn 403 với trình đọc; đọc bản lưu web.archive.org (chụp 2026-01) của đúng URL này. Phần steps/tldr bỏ mất ngoại lệ "unless the area is unsafe" và điều kiện "responsive, breathing normally" (thân bài mục Lợi ích có đủ).
  - text: "Người lớn không đáp ứng, không thở hoặc chỉ thở ngáp: người không chuyên coi là ngừng tim"
    source_url: https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-basic-life-support
    quote: If an adult is unconscious/unresponsive, with absent or abnormal breathing (ie, only gasping), the lay rescuer should assume the person is in cardiac arrest.
    verdict: match
    note: AHA 2025 mục 6.1. AHA chặn 403 với trình đọc; đọc bản lưu web.archive.org (chụp 2026-01) của đúng URL này.
  - text: "Nghi đột quỵ (yếu tay, méo miệng, nói khó): gọi cấp cứu ngay"
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: If stroke is suspected, the EMS system should be activated immediately.
    verdict: match
    note: AHA/Red Cross 2024, mục 6.2, COR 1 B-NR; NINDS cùng ý.
  - text: "Số liệu té ngã HCM 2025: 117.328 ca mắc và 218 ca chết; té ngã 35.272 ca (30%), 29 chết; trên 60 tuổi 8.536 ca (24%), 11 chết"
    source_url: https://hcdc.vn/phong-ngua-te-nga-cho-nguoi-cao-tuoi-nhan-dien-nguy-co-chu-dong-phong-ngua-aV9cMP.html
    quote: có 117.328 ca mắc và 218 ca chết do tai nạn thương tích xảy ra. Trong đó, 35.272 ca mắc, chiếm tỷ lệ 30%, và 29 ca chết do nguyên nhân té ngã. Riêng nhóm tuổi trên 60 tuổi có 8.536 ca, chiếm tỷ lệ 24%, và 11 ca chết do nguyên nhân té ngã.
    verdict: match
    note: 'Trang ghi "Cập nhật: 17:42 - 02/10/2026". 8.536/35.272 ≈ 24%: "24%" là tỷ lệ trong số té ngã, mục viết "chiếm 24%" không nói rõ mẫu số (có thể hiểu nhầm là 24% dân số trên 60); nên viết rõ.'
  - text: "Lời dặn: đứng lên từ từ; choáng thì dừng, ngồi/nằm nơi an toàn, báo người thân"
    source_url: https://hcdc.vn/phong-ngua-te-nga-cho-nguoi-cao-tuoi-nhan-dien-nguy-co-chu-dong-phong-ngua-aV9cMP.html
    quote: Nếu cảm thấy choáng hoặc mất thăng bằng, cần dừng lại, ngồi hoặc nằm xuống nơi an toàn và báo cho người thân.
    verdict: match
    note: ""
  - text: "QĐ 3312/QĐ-BYT: liệt mặt, liệt nửa người, rối loạn ngôn ngữ, nhìn đôi, thất điều, chóng mặt là biểu hiện khởi phát hay gặp của nhồi máu não"
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Biểu hiện khởi phát hay gặp của nhồi máu não thường đột ngột với sự xuất hiện đơn độc hoặc phối hợp của các dấu hiệu và triệu chứng hay gặp sau: + Liệt nửa người, liệt một chi hoặc liệt tứ chi (hiếm gặp) [...] + Nhìn đôi + Rối loạn ngôn ngữ + Liệt mặt + Thất điều + Chóng mặt (hiếm khi xuất hiện đơn độc)"
    verdict: match
    note: "Mục 3.1 (Lâm sàng) của bài nhồi máu não cấp. PDF trên bvtn.org.vn không in số/ngày quyết định; số 3312/QĐ-BYT ngày 05/11/2024 xác nhận qua luatvietnam.vn (bản thứ cấp, Điều 3: hiệu lực từ ngày ký, thay QĐ 5331/QĐ-BYT)."
  - text: Thời điểm khởi phát / lần cuối còn bình thường rất quan trọng; ngủ dậy đã có triệu chứng là đột quỵ không rõ thời điểm khởi phát
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Thời điểm khởi phát triệu chứng hoặc thời điểm cuối cùng thấy người bệnh còn bình thường: là rất quan trọng để xét điều trị tái tưới máu. Nếu ngủ dậy đã có triệu chứng hoặc không có người chứng kiến thì gọi là đột quỵ không rõ thời điểm khởi phát."
    verdict: match
    note: ""
  - text: Bác sĩ dùng chụp cộng hưởng từ để ước lượng thời điểm khởi phát
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: nếu có bất tương xứng tăng tín hiệu trên DWI nhưng chưa bất thường trên xung FLAIR, thì ước lượng giờ khởi phát đột quỵ vẫn còn nằm trong cửa sổ 4,5 giờ và chỉ định tiêu huyết khối tĩnh mạch.
    verdict: match
    note: Mục có điều kiện "bất tương xứng DWI–FLAIR"; mục tóm gọn đúng ý, không nêu điều kiện (không gây hại).
  - text: 'Bẫy 1 (gắn nhãn "suy ra từ NHS và AHA"): bế ngay lên giường vì còn tỉnh có thể làm nặng chấn thương'
    source_url: https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines
    quote: '(suy ra: khuyến cáo AHA mục 5 giữ nguyên tư thế khi nghi tổn thương cổ/lưng/hông/khung chậu; NHS "do not try to lift them yourself")'
    verdict: inference
    note: Nhãn "suy ra" trung thực và suy ra hợp lý từ hai điều khoản trên; không phải chữ của nguồn.
  - text: 'Bẫy 3 (gắn nhãn "suy ra"): gọi con cái trước hoặc tự chở bằng xe máy là sai; gọi 115 trước'
    source_url: https://www.nhs.uk/conditions/falls/
    quote: '(không có nguyên văn về xe máy/gọi con cái; NHS: "Call 999 if ... cannot get up"; AHA: "the EMS system should be activated immediately")'
    verdict: inference
    note: Nhãn "suy ra" đúng; phần "xe máy" không có trong nguồn nào.
  - text: "Gọi 115 không mất tiền (nguồn dẫn: Thông tư 02/2020/TT-BTTTT)"
    source_url: https://mst.gov.vn/mien-phi-cac-cuoc-goi-den-so-113-114-115-197140697.htm
    quote: gọi đến các số dịch vụ khẩn cấp (113, 114, 115) được hưởng giá cước 0 đồng/phút.
    verdict: partial
    note: Bản tin Cổng Bộ KH&CN (tóm tắt thứ cấp, không phải chính văn) đúng cho thời điểm 2020. Thông tư 02/2020 ("đến năm 2020") được lawplayer (đồng bộ vbpl.vn 2026-07-04) ghi "Hết hiệu lực toàn bộ"; văn bản kế nhiệm Thông tư 14/2022/TT-BTTTT Điều 5 liệt kê "liên lạc khẩn cấp đến các số 113, 114 và 115" là dịch vụ bắt buộc nhưng Điều 7 giao Bộ quyết định giá, tôi chưa thấy mức 0 đồng trong phần đã đọc. Mục đã tự hedge "hiệu lực hiện hành chưa xác nhận", trung thực nhưng dẫn nguồn đã hết hiệu lực. (mục 02 ghi "suy ra từ bản tin ... hiệu lực hiện hành chưa xác nhận").
internal_checks:
  - issue: 'Mục Chi phí lọt ghi chú soạn thảo hướng tới người đọc: "Cần nguồn cho mức giá và tỷ lệ bảo hiểm y tế chi trả."'
    severity: error
  - issue: tldr/steps bỏ mất ngoại lệ "trừ khi nơi đó không an toàn" và điều kiện "còn đáp ứng, thở bình thường" của khuyến cáo AHA 2024 (thân bài mục Lợi ích có nêu).
    severity: warn
  - issue: Bước 5 ("chỉ nhẹ nhàng đỡ dậy khi họ tỉnh, không nghi chấn thương và tự làm được") đúng tinh thần NHS, nhưng NHS còn khuyên mọi người ngã đi khám/gọi 111 (urgent advice) và hẹn bác sĩ gia đình; mục nói "Không phải lần nào ... cũng cần vào viện" mà không nêu khuyến cáo này.
    severity: warn
  - issue: Câu về "24%" ở nhóm trên 60 tuổi không nói rõ mẫu số (24% số ca té ngã).
    severity: warn
  - issue: Mọi con số trong tldr/steps có trong thân; không mâu thuẫn số liệu nội bộ; "mục 1" trỏ đúng mục hồi sức người lớn. Không tìm thấy chữ "báo cáo kiểm chứng/Còn treo/sổ kiểm chứng/bản nháp/[INFERENCE]".
    severity: warn

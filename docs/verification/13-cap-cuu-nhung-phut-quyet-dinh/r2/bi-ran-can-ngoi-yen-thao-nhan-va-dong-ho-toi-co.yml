validity:
  doc: Quyết định 5152/QĐ-BYT ngày 12/12/2014 (rắn lục xanh đuôi đỏ cắn)
  in_force: unconfirmed
  effective_from: 2014-12-12
  amended_by: []
  basis: "Chỉ thấy bản đăng lại trên BVĐK Quảng Trị; thuvienphapluat (thứ cấp) ghi 'Ngày hiệu lực: Đã biết' không có ngày. Không tìm thấy văn bản gốc trên Công báo/vbpl.vn hay văn bản thay thế; không đủ bằng chứng còn hiệu lực."
deliberate_vn_deviation:
  - "QĐ 5152/QĐ-BYT cho băng ép từ chỗ cắn lên gốc chi (tương đối chặt, còn sờ thấy mạch) hoặc ga-rô tĩnh mạch; WHO toàn cầu chỉ băng ép cho nọc thần kinh không sưng; ERC 2025 nói không băng ép cho rắn lục châu Âu. Mục không chọn bên nào (đúng nguyên tắc nêu rõ)."
potential_harm:
  - "Tiêu đề/tldr nói chung 'bị rắn cắn: ngồi yên, nẹp chi' nhưng nguồn chỉ cho rắn lục xanh đuôi đỏ; với rắn hổ/cạp nong (ít sưng) SEARO 2016 khuyên băng ép đệm-áp bất động trừ khi loại trừ được rắn hổ, mục chỉ bảo 'hỏi 115' (có thể chậm hoặc không có người trả lời được qua điện thoại). Cần nêu rõ phạm vi 'rắn lục' ở tldr hoặc thêm dòng 'chưa biết loài: xem băng ép ở bước 5'."
suggested_edits:
  - "tldr và tiêu đề: thêm 'rắn lục xanh đuôi đỏ' hoặc 'chưa biết loài' vào đầu câu để người đọc không áp dụng nguyên lời cho rắn hổ/cạp nong."
  - "Ghi chú: viết lại 'WHO chỉ khuyến cáo...' thành hai ý: trang WHO toàn cầu: PIB chỉ cho nọc thần kinh không sưng; SEARO 2016: băng ép đệm-áp trừ khi loại trừ chắc rắn hổ. Dựa vào quote SEARO ở claim 10."
  - "Bước 1: gắn nhãn 'lời khuyên thực hành' cho 'hỏi nơi có huyết thanh' hoặc bỏ."
  - "legal_refs: ghi URL văn bản gốc (Bộ Y tế/Công báo) nếu tìm được, nếu không thì dùng url bản đăng lại thay null."

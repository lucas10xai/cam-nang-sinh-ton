  - text: "Độ III cắn/cào chảy máu vùng xa thần kinh trung ương: tiêm vắc xin ngay"
    source_url: http://www.pasteurhcm.gov.vn/news/benh-dai-tren-nguoi-4594.html
    quote: Vết cắn/cào chảy máu ở vùng xa thần kinh trung ương Bình thường Bình thường Tiêm vắc-xin dại ngay, dừng tiêm sau ngày thứ 10

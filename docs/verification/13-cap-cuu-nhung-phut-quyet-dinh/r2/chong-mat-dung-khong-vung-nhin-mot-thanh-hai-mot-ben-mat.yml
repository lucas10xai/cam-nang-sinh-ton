claims:
  - text: Nhìn đôi, mất thị lực một hoặc hai mắt, thất điều, liệt mặt, rối loạn ngôn ngữ, chóng mặt là biểu hiện khởi phát hay gặp của nhồi máu não; chóng mặt hiếm khi đơn độc
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: + Mất thị lực một hoặc hai mắt + Khiếm khuyết trường thị giác + Nhìn đôi + Rối loạn ngôn ngữ + Liệt mặt + Thất điều + Chóng mặt (hiếm khi xuất hiện đơn độc)
    verdict: match
    note: Mục 3.1 Lâm sàng, bài nhồi máu não cấp.
  - text: Đột quỵ không rõ thời điểm khởi phát; thời điểm khởi phát/lần cuối bình thường rất quan trọng
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf
    quote: "Thời điểm khởi phát triệu chứng hoặc thời điểm cuối cùng thấy người bệnh còn bình thường: là rất quan trọng để xét điều trị tái tưới máu. Nếu ngủ dậy đã có triệu chứng hoặc không có người chứng kiến thì gọi là đột quỵ không rõ thời điểm khởi phát."
    verdict: match
    note: ""
  - text: "NINDS: gọi cấp cứu ngay khi khó nhìn ở một hoặc cả hai mắt, chóng mặt/mất thăng bằng/mất phối hợp khi đi"
    source_url: https://www.ninds.nih.gov/health-information/stroke/signs-and-symptoms
    quote: Call 9-1-1 immediately if one or more of the following symptoms appear suddenly.  Sudden Trouble Seeing | Trouble seeing in one or both eyes  Sudden Trouble Walking | Dizziness, or loss of balance or coordination
    verdict: match
    note: Bảng "Other Stroke Signs". NINDS cũng ghi nhìn đôi, buồn nôn, chóng mặt thuộc nhóm "More rarely".

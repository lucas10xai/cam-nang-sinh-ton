  - text: Tiêu huyết khối đường tĩnh mạch trong 3 giờ đầu, mở rộng 4,5 giờ, thường quy ở Hoa Kỳ và châu Âu
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf

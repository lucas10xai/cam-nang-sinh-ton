    verdict: match
    note: ""
  - text: QĐ 3312 nêu chỉ định điều trị muộn hơn cho một số người bệnh chọn lọc bằng hình ảnh học
    source_url: https://bvtn.org.vn/wp-content/uploads/2025/07/Q-Ban-hanh-HD-t-qu-nao.signed.pdf

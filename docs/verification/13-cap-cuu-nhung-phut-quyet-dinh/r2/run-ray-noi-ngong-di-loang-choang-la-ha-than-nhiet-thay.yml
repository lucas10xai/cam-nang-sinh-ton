claims:
  - text: "Hạ thân nhiệt: nhiệt độ cơ thể dưới 35 độ, là cấp cứu cần điều trị ở bệnh viện; nghi ngờ thì gọi cấp cứu"
    source_url: https://www.nhs.uk/conditions/hypothermia/
    verdict: match
    quote: "Hypothermia is a dangerous drop in body temperature below 35C (normal body temperature is around 37C). It's a medical emergency that needs to be treated in hospital. ... Go to A&E or call 999 if: you think you or your child have hypothermia"
    note: "Tóm tắt Việt: hạ thân nhiệt là tụt dưới 35°C, là cấp cứu cần điều trị ở bệnh viện; nghi ngờ thì gọi 999 (ở VN là 115)."
  - text: "Dấu hiệu: da lạnh, có thể ngón tay và môi xanh, giảm tỉnh táo, lú lẫn nhẹ, nói lắp; người cao tuổi có thể không rùng mình"
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/ha-than-nhiet-o-nguoi-cao-tuoi-va-cach-xu-tri/
    verdict: match
    quote: "Trong giai đoạn đầu của hạ thân nhiệt, da lạnh, có thể có ngón tay và môi xanh, giảm sự tỉnh táo, lú lẫn nhẹ, nói lắp. Tuy nhiên, luôn nhớ rằng những người cao tuổi bị hạ thân nhiệt có thể không rùng mình hay phàn nàn về cảm giác lạnh"
    note: "Bài dịch 7/2/2017 từ health.gov.il, đăng trên trang Khoa CTCH và Cột sống BV Bạch Mai."
  - text: Gọi trợ giúp y tế ngay; nhẹ nhàng di chuyển tới nơi ấm khô; thay quần áo ướt; cuộn chăn; nằm yên không trở người nhiều
    source_url: https://chanthuongvacotsong.bachmai.gov.vn/ha-than-nhiet-o-nguoi-cao-tuoi-va-cach-xu-tri/
    verdict: match
    quote: "Gọi trợ giúp y tế ngay lập tức tại nhà và/hoặc đi đến bệnh viện ngay lập tức; Trước khi sự hỗ trợ y tế, cần: Nhẹ nhàng di chuyển người cao tuổi đến một nơi ấm và khô; Nếu quần áo đang mặc bị ướt phải thay ngay quần áo khô và cuộn người trong chăn để giữ ấm; Để họ nằm yên, không trở người nhiều"
    note: "Bài viết cho người cao tuổi, tiếp theo là 'cho uống ngay nước ấm (trà gừng ấm, sữa ấm…)' không điều kiện tỉnh táo; mục đã thay bằng điều kiện 'tỉnh hẳn' của NHS (an toàn hơn)."
  - text: "NHS: cho uống đồ ấm không cồn nếu tỉnh hẳn; không bồn nước nóng/túi nước nóng/đèn sưởi; không xoa tay chân; không rượu"
    source_url: https://www.nhs.uk/conditions/hypothermia/
    verdict: match
    quote: "give them a warm non-alcoholic drink and some sugary food like chocolate if they're fully awake ... do not use a hot bath, hot water bottle or heat lamp to warm them up; do not rub their arms, legs, feet or hands; do not give them alcohol to drink"
    note: "Trang NHS xem lại 09/06/2023, 'Next review due: 09 June 2026' (đã quá hạn xem lại tại ngày kiểm). NHS còn dặn giữ tỉnh táo bằng cách nói chuyện, che đầu, ở lại với nạn nhân: mục chưa nêu."
  - text: "Đắp gạc ấm lên cổ, lồng ngực, háng"
    source_url: https://suckhoedoisong.vn/cap-cuu-nguoi-bi-ha-than-nhiet-the-nao-16989762.htm
    verdict: match
    quote: "Đắp gạc ấm lên cổ, lồng ngực và háng của bệnh nhân."
    note: "Chỉ có ở một bài báo SKĐS ngày 03-01-2015 (BS Trần Thanh Tâm); NHS không có. ERC 2025 nói bằng chứng cho 'removing wet clothes, drying the person's body, ... isothermal blankets and ... heating pads' (ủ ấm bằng nguồn nhiệt cục bộ) nhưng không nêu vị trí cổ-ngực-háng. Mục đã nêu rõ nguồn là báo 2015."
  - text: Không cố làm ấm tay chân; không chườm nóng trực tiếp; không đèn sưởi; không rượu; không xoa bóp; động tác nhẹ nhàng
    source_url: https://suckhoedoisong.vn/cap-cuu-nguoi-bi-ha-than-nhiet-the-nao-16989762.htm
    verdict: match
    quote: "Không chườm nóng trực tiếp. Không dùng nước nóng, đệm sưởi hoặc đèn sưởi để làm ấm nạn nhân. Không cố làm ấm tay và chân, bởi làm nóng tay và chân thúc đẩy máu lạnh trở về tim, phổi và não, gây hạ thân nhiệt trung tâm, có thể gây tử vong. Không cho người bệnh uống rượu. Không xoa bóp hoặc chà xát người bệnh. Các động tác với người bệnh cần phải nhẹ nhàng để tránh nguy cơ ngừng tim."
  - text: "Bước 5: 'Ngừng thở, hoặc thở rất chậm và nông: hà hơi thổi ngạt ngay'"
    source_url: https://suckhoedoisong.vn/cap-cuu-nguoi-bi-ha-than-nhiet-the-nao-16989762.htm
    verdict: match
    quote: "Nếu hơi thở ngừng hay có vẻ chậm hoặc nông trầm trọng, cần hà hơi thổi ngạt ngay."
    note: "Khớp chữ SKĐS 2015 nhưng LỆCH hướng dẫn hiện hành (ERC 2025 First Aid: 'If unresponsive and not breathing normally, call your local emergency number and start CPR according to dispatcher instructions'; chương này mục 01 dạy ép tim liên tục). Xem potential_harm."
  - text: 115 là số cấp cứu y tế
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    verdict: match
    quote: "115 – Cấp cứu y tế:"
    note: Trang Công an tỉnh Điện Biên.
  - text: "Tổng đài 112 liên thông với 113, 114, 115"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/200-ndcp.signed.pdf
    verdict: match
    quote: "a) Hệ thống Tổng đài 112 liên thông với các Tổng đài 113, 114, 115;"
    note: Điều 3 khoản 4. PDF bản ký là ảnh quét; đọc bằng OCR và đối chiếu bản lawplayer.
  - text: Ngưỡng 33 và 28 độ không dùng để quyết định có đi viện
    source_url: https://suckhoedoisong.vn/cap-cuu-nguoi-bi-ha-than-nhiet-the-nao-16989762.htm
    verdict: match
    quote: Nếu bệnh nhân có thân nhiệt trên 33
    note: "Bài SKĐS nói trên 33°C chỉ cần ủ ấm thông thường; mục cố ý không dùng mốc này. Ghi nhận lựa chọn an toàn hơn nguồn, không phải lỗi."

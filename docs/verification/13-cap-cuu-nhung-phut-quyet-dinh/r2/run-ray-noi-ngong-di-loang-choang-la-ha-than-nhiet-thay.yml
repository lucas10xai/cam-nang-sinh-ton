deliberate_vn_deviation:
  - "Bước 'hà hơi thổi ngạt ngay khi ngừng thở/thở rất chậm nông' (SKĐS 2015) lệch hướng dẫn hồi sinh hiện hành của ERC 2025 và mục 01 của chương: không thở bình thường thì ép tim (chưa học thổi ngạt thì ép liên tục)."
potential_harm:
  - "Bước 5 (steps/tldr 'Ngừng thở: thổi ngạt'): người không được tập huấn dễ thổi ngạt đơn thuần hoặc chờ thổi ngạt thay vì ép tim, làm chậm CPR; 'thở rất chậm và nông' là thở ngáp/giai đoạn gần ngừng tim cần CPR. Cần đổi sang: không phản ứng và không thở bình thường -> gọi 115, ép tim ngay theo mục 01."
  - "Phần 'Gạc ấm cổ, ngực, háng' và 'không làm ấm tay chân' chỉ có ở một bài báo 2015; nếu người làm tự chế gạc nóng hoặc chậm gọi 115 để làm việc này thì có thể chậm. Mục đã đặt gọi 115 trước, nên mức rủi ro thấp (chỉ nhắc, không tính là blocker)."
suggested_edits:
  - "steps bước 5 và tldr: thay bằng 'Không phản ứng và không thở bình thường: bật loa ngoài với 115, ép tim ngay (xem mục về người gục, không tỉnh, không thở bình thường)'. Dựa vào quote ERC 'If unresponsive and not breathing normally, call your local emergency number and start CPR according to dispatcher instructions.'"
  - "Thêm hai điều của NHS đang thiếu: che đầu nạn nhân, nói chuyện giữ tỉnh táo, ở lại với nạn nhân."
  - "Ghi chú: thay 'trong nguồn đã mở' bằng 'chưa có hướng dẫn của Bộ Y tế Việt Nam được dẫn ở đây'; ghi ngày xem lại của trang NHS."

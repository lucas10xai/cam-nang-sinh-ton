  - text: "TCVN 9386:2012 mục 2.1: kết cấu chịu động đất thiết kế không sụp đổ cục bộ hay toàn phần, còn một phần khả năng chịu tải"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    verdict: match
    quote: "Kết cấu phải được thiết kế và thi công để chịu được tác động động đất thiết kế như định nghĩa trong Chương 3 mà không bị sụp đổ cục bộ hay sụp đổ toàn phần, đồng thời giữ được tính toàn vẹn của kết cấu và còn một phần khả năng chịu tải trọng sau khi động đất xảy ra."
    note: "Bản sao trên mtu.edu.vn, không chính thống: nguồn pháp lý thứ cấp nhưng văn bản là chữ gốc của tiêu chuẩn; vẫn đặt match vì quote khớp bản PDF; hiệu lực để unconfirmed."
  - text: "Ba mức ag: mạnh >= 0,08g; yếu 0,04g <= ag < 0,08g; rất yếu < 0,04g"
    source_url: https://mtu.edu.vn/Resources/Docs/Khoa%20-%20Bo%20mon/Khoa%20Xay%20dung/Tai%20lieu%20tham%20khao/TCVN/Thiet-ke/TCVN9386_2012.pdf
    verdict: match
    quote: "Theo giá trị gia tốc nền thiết kế ag = I x agR, chia thành ba trường hợp động đất: - Động đất mạnh ag ≥ 0,08g, phải tính toán và cấu tạo kháng chấn; - Động đất yếu 0,04g ≤ ag < 0,08g, chỉ cần áp dụng các giải pháp kháng chấn đã được giảm nhẹ; - Động đất rất yếu ag < 0,04g, không cần thiết kế kháng chấn."
    note: "Ký hiệu gamma-I bị mất khi trích PDF. Phụ lục H: Ba Đình 0,0976; Cầu Giấy 0,1032; Long Biên 0,0747; Thanh Xuân 0,1097 khớp."

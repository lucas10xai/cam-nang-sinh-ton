    source_url: https://www.cdc.gov/earthquakes/safety/index.html
    verdict: match
    quote: "During an earthquake, most deaths and injuries are caused by collapsing building materials and heavy falling objects, such as bookcases, cabinets, and heating units."
    note: "Trang CDC 'Preparing for Earthquakes' (chặn curl 403; đọc qua trình đọc URL, xem lại 21/8/2026)."
  - text: "CDC: quỳ bằng tay và gối, che đầu cổ (và cả người nếu được) dưới bàn chắc; không có thì gần tường trong/đồ thấp, che đầu cổ bằng hai tay; bám tới khi hết rung"
    source_url: https://www.cdc.gov/earthquakes/safety/index.html
    verdict: match
    quote: "DROP down onto your hands and knees immediately. ... COVER your head and neck (and your entire body if possible) underneath a sturdy table or desk. If there is no shelter nearby, get down near an interior wall or next to low-lying furniture that won't fall on you, and cover your head and neck with your arms and hands. Try to stay clear of windows or glass that could shatter or objects that could fall on you. HOLD ON to your shelter (or to your head and neck) until the shaking stops."
  - text: "Red Cross: người chết/bị thương do ngã khi đi hoặc chạy lúc rung, hoặc bị mảnh vỡ rơi trúng"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    verdict: match
    quote: Deaths and injuries occur when people fall trying to walk or run during shaking or when they are hit by falling debris.
  - text: "Red Cross: không có bàn thì bò đến tường trong, xa cửa sổ"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    verdict: match
    quote: "If you cannot find a protected space, crawl to an interior wall (away from windows)."
  - text: "Hết rung đợi một phút; nếu an toàn thì ra ngoài; dư chấn lại quỳ, che, bám"
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html
    verdict: match
    quote: "Wait a minute before getting up. ... If it is safe, exit the building. Go outside to a clear area. ... Expect aftershocks. Drop, Cover, and Hold On whenever you feel shaking."

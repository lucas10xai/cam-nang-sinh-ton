  amended_by: []
  basis: "PDF 3312 có chữ ký số Bộ Y tế ngày 05-11-2024 (mở được, trích chữ). Tìm web không thấy văn bản sửa/thay thế nhưng không có nguồn chính thức xác nhận hiệu lực; không tự kết luận. NICE NG228 công bố 2022, trang không ghi cập nhật mới hơn trong phần đọc được."
deliberate_vn_deviation:
  - "Bộ Y tế (QĐ 3312 mục 3.2) coi chọc dịch não tủy là tiêu chuẩn vàng khi CT/MRI không thấy mà vẫn nghi chảy máu dưới nhện, không nêu mốc 6 giờ/12 giờ. NICE NG228 1.1.11-1.1.13: CT trong 6 giờ được đọc bình thường thì không chọc thường quy; chỉ cân nhắc chọc khi CT sau 6 giờ và sau tối thiểu 12 giờ từ khi khởi phát. Mục theo QĐ 3312 (có điều kiện 'bác sĩ vẫn nghi') nhưng chưa nêu sự khác biệt."
potential_harm: []
suggested_edits:
  - "Ghi chú, 'Mốc thời gian': đổi 'Quyết định 3312 chỉ ghi cơn đau xuất hiện đột ngột, không ghi số phút' thành 'Quyết định 3312 mô tả đau đầu sét đánh, đau như muốn vỡ tung đầu và không ghi số phút' (quote: 'Đau đầu dữ dội, cảm giác như “đau đầu sét đánh”, đau như muốn \"vỡ tung đầu\"')."
  - "Bẫy 3 và step 3: thêm một câu: 'NICE: nếu CT làm trong 6 giờ kể từ khi đau và bác sĩ chẩn đoán hình ảnh đọc bình thường thì không chọc dịch não tủy thường quy; chọc dịch não tủy được cân nhắc khi CT làm muộn hơn 6 giờ. Quyết định 3312 không nêu mốc này.' (dựa trên quote NICE 1.1.11-1.1.13). Giữ ý 'bác sĩ vẫn nghi thì nghe theo bác sĩ'."
  - "Mục Lợi ích/Pháp luật: ghi rõ mục 4.1 là của chương Nhồi máu não cấp và việc dùng cho chảy máu dưới nhện là suy ra từ cùng nhóm đột quỵ (gắn nhãn 'suy ra'), hoặc bỏ dòng đó khỏi mục 'chuyển tới cơ sở có máy CT' vì step 1 đã đủ."

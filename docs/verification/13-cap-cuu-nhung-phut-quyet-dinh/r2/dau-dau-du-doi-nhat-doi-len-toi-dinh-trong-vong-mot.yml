    note: "Mục 3.1 chương Phình động mạch não vỡ không có chữ 'đột ngột' (tìm trong cả chương 'Hướng dẫn chẩn đoán và điều trị phình động mạch não vỡ'); chỉ có 'đau đầu sét đánh', 'muốn vỡ tung đầu'. Đúng là QĐ không ghi số phút. Phần 'chỉ ghi ... đột ngột' sai chữ nhưng không đổi kết luận."

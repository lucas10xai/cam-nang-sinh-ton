suggested_edits:
  - "Ghi chú: xóa/viết lại câu 'cần nguồn cho trường hợp này' thành lời cho người đọc, ví dụ 'Mục này chưa có hướng dẫn riêng cho người mang thai muộn hoặc rất béo; hỏi 115 khi gọi.' (115 không nói điều này: gắn nhãn 'lời khuyên của biên tập' hoặc bỏ)."
  - "Mốc 1 tuổi: dẫn ERC Paediatric Life Support 2025 (hoặc nguồn Bộ Y tế) để chuyển từ 'suy ra' thành chữ của nguồn; nếu chưa có thì ghi 'suy ra' ngay ở tldr/tiêu đề, không chỉ ở Ghi chú."
  - "Bước 3 nên thêm 'nghiêng người về phía trước' (ERC: 'Lean the person forward' đứng trong mô tả ấn bụng; xác nhận lại vị trí câu này trong bản gốc trước khi thêm)."

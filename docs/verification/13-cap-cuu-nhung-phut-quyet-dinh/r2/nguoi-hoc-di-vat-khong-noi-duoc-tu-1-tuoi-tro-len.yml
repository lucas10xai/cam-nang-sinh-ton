    severity: error
  - issue: "Số liệu trong tldr/steps (5 vỗ lưng, 5 ấn bụng, 1 tuổi, 115) đều có trong thân; không mâu thuẫn nội bộ."
    severity: warn
  - issue: "Thứ tự 'gọi 115' đứng trước vỗ lưng trong steps; ERC đặt 'Call your emergency number' sau chu kỳ nhưng 115 trung tâm dặn gọi đồng thời; không mâu thuẫn, chỉ là khác thứ tự."
    severity: warn

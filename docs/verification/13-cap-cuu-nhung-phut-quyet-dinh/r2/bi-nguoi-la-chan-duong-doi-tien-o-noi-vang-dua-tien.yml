claims:
  - text: "Điều 168 khoản 1: dùng vũ lực/đe dọa vũ lực ngay tức khắc nhằm chiếm đoạt tài sản thì phạt tù 03 đến 10 năm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Người nào dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản, thì bị phạt tù từ 03 năm đến 10 năm."
    verdict: match
    note: "Trang PDF trích được chữ (pdftotext). Khớp."
  - text: "Điều 168 khoản 2: 07 đến 15 năm khi có tổ chức; gây thương tích 11%-30%; vũ khí/phương tiện/thủ đoạn nguy hiểm; chiếm đoạt 50 triệu đến dưới 200 triệu"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Phạm tội thuộc một trong các trường hợp sau đây, thì bị phạt tù từ 07 năm đến 15 năm: a) Có tổ chức; ... c) Gây thương tích hoặc gây tổn hại cho sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30%; d) Sử dụng vũ khí, phương tiện hoặc thủ đoạn nguy hiểm khác; đ) Chiếm đoạt tài sản trị giá từ 50.000.000 đồng đến dưới 200.000.000 đồng;"
    verdict: match
    note: ""
  - text: "Điều 168 khoản 3 và 4: 12-20 năm; 18-20 năm, chung thân khi làm chết người"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "4. Phạm tội thuộc một trong các trường hợp sau đây, thì bị phạt tù từ 18 năm đến 20 năm hoặc tù chung thân: ... c) Làm chết người;"
    verdict: partial
    note: "Khoản 3 là 12-20 năm đúng. Khoản 4: mức 18-20 năm HOẶC tù chung thân áp dụng cho mọi trường hợp a-d của khoản 4 (500 triệu trở lên, 61% trở lên, làm chết người, lợi dụng chiến tranh/khẩn cấp). Câu trong mục 'chung thân khi làm chết người' dễ hiểu là chung thân chỉ dành cho làm chết người. Cần sửa lời."
  - text: "Điều 22 khoản 1: phòng vệ chính đáng là chống trả cần thiết người đang có hành vi xâm phạm"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Phòng vệ chính đáng là hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên."
    verdict: match
    note: ""
  - text: "Điều 22 khoản 2: chống trả rõ ràng quá mức cần thiết thì vẫn phải chịu trách nhiệm hình sự"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "Vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất và mức độ nguy hiểm cho xã hội của hành vi xâm hại. Người có hành vi vượt quá giới hạn phòng vệ chính đáng phải chịu trách nhiệm hình sự theo quy định của Bộ luật này."
    verdict: match
    note: ""
  - text: "113 tiếp nhận tin báo cướp giật, trộm cắp, gây rối, bạo hành, tai nạn giao thông và hành vi có dấu hiệu tội phạm"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "113 – Lực lượng Công an: Tiếp nhận tin báo về cướp giật, trộm cắp, gây rối, bạo hành, tai nạn giao thông và các hành vi có dấu hiệu tội phạm, ảnh hưởng đến an ninh trật tự."
    verdict: match
    note: "Cổng Công an tỉnh Điện Biên (cơ quan nhà nước), không phải văn bản quy phạm; chấp nhận cho số điện thoại."
  - text: "Gọi số khẩn cấp miễn phí; cùng khu vực bấm trực tiếp không cần mã vùng"
    source_url: https://congan.dienbien.gov.vn/Danh-muc-tin-tuc/tong-hop-cac-so-dien-thoai-khan-cap-quoc-gia-ghi-nho-de-bao-ve-minh-va-ho-tro-nguoi-khac-13182.html
    quote: "người dân khi ở trong cùng khu vực chỉ cần bấm trực tiếp số 113, 114, 115… mà không cần mã vùng. ... Theo quy định của Luật Viễn thông, các cuộc gọi đến số khẩn cấp hoàn toàn miễn phí."
    verdict: match
    note: "Mục nêu đúng 'theo Luật Viễn thông' qua trang này; không tự mở Luật Viễn thông."
  - text: "Bước 1: đưa tiền (và đồ khác nếu bị đòi), không giằng co, không đuổi theo, vì an toàn thân thể trước"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Không có nguồn trong mục hay trong luật dặn việc này; mục gắn nhãn 'suy ra, không có nguồn đo' và Ghi chú nói rõ. Nhãn trung thực. Đây là lời khuyên an ninh thông dụng, không phải y tế/pháp lý có căn cứ chữ."
  - text: "Bước 3: không đi theo họ lên xe hay tới nơi khác"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: ""
    verdict: inference
    note: "Gắn nhãn 'suy ra, không có nguồn'. Trung thực."
  - text: "Suy ra từ Điều 22 khoản 1: phòng vệ chỉ với người 'đang' xâm phạm; đuổi theo đánh khi họ đã bỏ chạy thì khó còn là phòng vệ"
    source_url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/135-vbhn-vpqh.pdf
    quote: "chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên"
    verdict: inference

  basis: "Không có văn bản pháp quy/hướng dẫn Bộ Y tế; hai nguồn Việt là bài truyền thông bệnh viện 2020-2021, không có ngày hiệu lực. NHS xem lại 10/07/2025, kỳ tới 10/07/2028. Chưa kiểm hướng dẫn quốc tế chuyên khoa (ví dụ khuyến cáo phẫu thần kinh về máu tụ dưới màng cứng mạn tính) mới hơn."
deliberate_vn_deviation: []
potential_harm:
  - "Step 2 ('Nếu chỉ thay đổi dần: đưa đi khám ở bệnh viện có chuyên khoa...') và tldr không nêu thời hạn hay mức khẩn cho người già mới đau đầu, lú lẫn, đi loạng choạng, ngủ nhiều sau tiền sử đập đầu. Người đọc làm đúng nguyên văn có thể hẹn lịch khám chuyên khoa vài ngày sau; NHS (cùng trang mục dẫn) xếp đau đầu không đỡ với thuốc giảm đau, vấn đề trí nhớ và dùng thuốc loãng máu vào mức 'đi khoa cấp cứu', và máu tụ có thể tăng kích thước/cần mổ. Cần ghi rõ: khám trong ngày (khoa cấp cứu hoặc bệnh viện có CT sọ), đặc biệt nếu đang dùng thuốc chống đông/kháng kết tập tiểu cầu hoặc nghiện rượu."
suggested_edits:
  - "Step 2 và tldr: thay 'đưa đi khám ở bệnh viện có chuyên khoa' bằng 'đưa đi khám ngay trong ngày tại bệnh viện có chụp CT sọ (khoa cấp cứu nếu đau đầu không đỡ với thuốc giảm đau, lú lẫn, đang dùng thuốc chống đông hoặc kháng kết tập tiểu cầu); không chờ lịch hẹn nhiều ngày' và gắn nhãn '(lời khuyên thực hành, suy ra từ NHS: đau đầu không đỡ, vấn đề trí nhớ, dùng thuốc loãng máu thuộc mức đi khoa cấp cứu khi đã đập đầu)'."
  - "Bẫy 3: đổi 'Cả hai bệnh viện nêu thuốc này là yếu tố nguy cơ' thành 'BV 108 nêu thuốc chống đông; BV Huế nêu thuốc chống đông hoặc chống ngưng tập tiểu cầu' (quote Huế: 'sử dụng thuốc chống đông hoặc thuốc chống ngưng tập tiểu cầu')."
  - "Mục NHS 'đi khoa cấp cứu nếu đang dùng thuốc làm loãng máu': thêm điều kiện 'sau khi đập đầu' đúng chữ NHS ('You or your child have had a head injury and have ... you take medicine to thin your blood')."
  - "Bẫy 4: đổi 'Đó là mức gọi cấp cứu theo NHS' thành 'NHS ghi các dấu hiệu này ở người vừa đập đầu là mức gọi cấp cứu; áp dụng cho ca khởi phát muộn là suy ra'."
  - "Tldr: tách 'ngủ nhiều' (đi khám trong ngày) khỏi 'khó tỉnh' (gọi 115) bằng một câu ví dụ để người đọc phân biệt; cân nhắc thêm 'không tự dùng aspirin để giảm đau đầu' (bài Huế, ca 2)."

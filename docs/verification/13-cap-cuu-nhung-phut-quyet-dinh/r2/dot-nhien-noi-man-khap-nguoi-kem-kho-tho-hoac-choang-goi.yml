  basis: 'Trang vbpl.vn (CSDL quốc gia về văn bản pháp luật), dữ liệu nhúng của trang: "effFrom":"2018-02-15","effTo":null, tình trạng "Còn hiệu lực" (effStatus code CHL); Điều 7 khoản 1: "Thông tư này có hiệu lực từ ngày 15 tháng 02 năm 2018." Trang cập nhật 05/04/2026. Không thấy quan hệ sửa đổi/thay thế trong dữ liệu trang. Đối chiếu quốc tế: NHS Anaphylaxis xem lại 21/06/2023 (quá hạn 21/06/2026).'
deliberate_vn_deviation:
  - 'Adrenalin cho phản vệ nhẹ: NHS: dùng bút ngay cả khi triệu chứng nhẹ; Thông tư 51: adrenalin tiêm bắp từ độ II, độ I dùng methylprednisolon/diphenhydramin. Mục chọn theo NHS ("kể cả khi triệu chứng nhẹ") vì người không chuyên khó phân độ; hướng an toàn hơn nhưng khác Thông tư.'
  - 'Người không phải nhân viên y tế dùng adrenalin: Thông tư 51 Điều 6 khoản 3 cho phép người có tiền sử phản vệ mang sẵn adrenalin (thực tế ở VN thường là ống 1 mg/ml) tự tiêm hoặc nhờ người khác tiêm khi khẩn cấp; mục khuyên "không tự rút thuốc từ ống khi chưa được huấn luyện" (chặt hơn Thông tư, gắn nhãn suy ra).'
  - "Thời gian theo dõi: Thông tư 51 ≥ 24 giờ sau khi huyết áp ổn định; NHS thường 2-12 giờ. Mục theo Thông tư và nêu cả hai."
potential_harm:
  - 'Step 3: "Cho nằm tại chỗ, kê cao chân" bỏ điều kiện của Thông tư 51 (Phụ lục III mục III khoản 3: "nghiêng trái nếu có nôn"); người nôn nằm ngửa có nguy cơ sặc. Mức: thấp đến trung bình.'
  - 'Step 5: "Không tự rút thuốc từ ống khi chưa được huấn luyện" có thể làm chậm adrenalin khi chỉ có ống adrenalin mang theo (thực tế VN) và Thông tư 51 Điều 6 khoản 3 cho phép dùng trong khẩn cấp; mục dặn chờ nhân viên cấp cứu. Mức: thấp (115 hướng dẫn qua điện thoại; mục có nêu lý do).'
suggested_edits:
  - 'Chi phí: bỏ câu "Cần nguồn cho việc cuộc gọi 115 có tính phí hay không; mục này không khẳng định." (hoặc thay bằng sự kiện có nguồn).'
  - 'Pháp luật VN, "Liều và theo dõi": sửa "Liều adrenalin tính theo nhóm tuổi và cân nặng, do nhân viên y tế quyết định" thành "Phụ lục III mục IV nêu liều theo cân nặng cho nhân viên y tế (ví dụ người lớn 0,5-1 ml); người không chuyên không tự định liều" (quote Phụ lục III mục IV).'
  - 'Step 3 và "Nói dễ hiểu": thêm "nếu nôn thì cho nằm nghiêng" (quote Thông tư 51 Phụ lục III mục III khoản 3 "nghiêng trái nếu có nôn").'
  - "Step 5: nêu Điều 6 khoản 3: người có tiền sử phản vệ mang sẵn adrenalin (kể cả ống) hoặc người khác được phép tiêm bắp khi khẩn cấp; làm theo hướng dẫn của 115."
  - 'Ghi chú: bỏ câu "cần đối chiếu lại khi có bản mới" (nội bộ); ghi rõ nguồn NHS "xem lại 21/06/2023".'
  - 'Ghi chú "Không lấy thuốc uống thay adrenalin": thêm "từ độ II; độ I do nhân viên y tế quyết định (Phụ lục III mục II)".'
